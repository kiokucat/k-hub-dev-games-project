<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,apps,arrow_back,auto_awesome,chat,close,mic,notifications,photo_camera,search,send,table_chart_view,timer_10_alt_1,trending_up,visibility,bar_chart&display=block">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Google Fonts: Material Symbols の search アイコン */
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            direction: ltr;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 58px;
            padding: 0 12px 0 16px;
            font-size: 13px;
        }

        .hdr-left, .hdr-right { display: flex; align-items: center; }

        header a {
            color: #202124;
            text-decoration: none;
        }

        .hdr-left a { padding: 6px 12px; }
        .hdr-right a.hdr-link { padding: 6px 8px; }
        header a.hdr-link:hover { text-decoration: underline; }

        .apps-btn {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #5f6368 !important;
        }
        .apps-btn:hover { background: #f1f3f4; }
        .apps-btn .material-symbols-outlined { font-size: 24px; }

        .login-btn {
            display: inline-flex;
            align-items: center;
            height: 40px;
            margin-left: 8px;
            padding: 0 14px;
            border-radius: 20px;
            background: #0b57d0;
            color: #fff !important;
            font-size: 14px;
            font-weight: 500;
        }
        .login-btn:hover { background: #0a4cb3; box-shadow: 0 1px 3px rgba(32,33,36,0.35); }

        /* 縦中央寄せは .logo / .search-form の margin:auto で行う（内容が画面より高いときに上へはみ出さない）。
           下の padding は元の margin-top:-50px と同じ「少し上寄せ」の役割 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 50px;
        }

        .logo {
            margin-top: auto;
            font-size: 90px;
            font-weight: 600;
            letter-spacing: -2.5px;
            margin-bottom: 30px;
            user-select: none;
        }

        .g1, .g2 { color: #4285F4; }
        .o1, .e { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .l { color: #34A853; }

        .search-form {
            width: 100%;
            max-width: 690px;
            margin-bottom: auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 26px;
            padding: 0 10px 0 14px;
            height: 52px;
            transition: box-shadow 0.2s;
            background: #fff;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(0,0,0,0);
        }

        .search-icon.is-trend { color: #188038; }

        .search-icon {
            flex: none;
            color: #202124;
            margin-right: 12px;
            font-size: 24px;
        }

        .search-input {
            flex: 1;
            width: 100%;
            min-width: 0;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #000;
            background: transparent;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 8px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 16px;
            height: 36px;
            cursor: pointer;
            user-select: none;
            min-width: 0;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
            background-color: #f8f9fa;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }


        /* 🔎 検索サジェスト（ゲーム一覧） */
        .search-wrap { position: relative; }

        .search-box.open {
            border-radius: 26px 26px 0 0;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(0,0,0,0);
        }

        .suggest {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 20;
            max-height: min(340px, 60vh);
            overflow: hidden; /* 角丸の外にはみ出さない。スクロールは .suggest-list 側 */
            background: #fff;
            border-radius: 0 0 26px 26px;
            box-shadow: 0 4px 6px rgba(32,33,36,0.28);
            padding: 0;
        }

        .suggest.show { display: flex; flex-direction: column; }

        .suggest-list {
            flex: 1 1 auto;
            min-height: 0;
            max-height: min(168px, 24vh); /* 縮めた一覧。下のお知らせ／チャット／統計が隠れない */
            overflow-y: auto;
            padding: 6px 0;
        }

        .suggest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            cursor: pointer;
            text-align: left;
        }

        .suggest-item:hover, .suggest-item.active { background: #f1f3f4; }

        .suggest-icon { flex: none; font-size: 20px; color: #9aa0a6; }

        .suggest-main { display: flex; flex-direction: column; min-width: 0; }

        .suggest-name {
            font-size: 15px;
            color: #202124;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggest-tags {
            font-size: 12px;
            color: #70757a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggest-head {
            display: flex;
            align-items: center;
            padding: 8px 18px 4px;
            font-size: 13px;
            font-weight: 500;
            color: #5f6368;
        }

        .suggest-head .material-symbols-outlined { font-size: 18px; margin-right: 6px; }

        .suggest-item .trend-delta { margin-left: auto; }

        .suggest-empty {
            padding: 12px 18px;
            font-size: 14px;
            color: #70757a;
        }

        /* 🎰 縦スクロールルーレット用のスタイル */
        .lucky-trigger-btn {
            min-width: 180px !important;
            padding: 0 !important;
            overflow: hidden; /* はみ出たテキストを隠す */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-viewport {
            height: 36px;
            line-height: 36px;
            position: relative;
            width: 100%;
        }

        .roulette-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: top 0.05s linear;
        }

        .roulette-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
            box-sizing: border-box;
            height: 36px;
            text-align: center;
            width: 100%;
            display: block;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        footer {
            background-color: #fff;
            font-size: 14px;
            color: #202124;
        }

        .foot-country { padding: 15px 30px; border-bottom: 1px solid #dadce0; }

        .foot-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 0 22px;
        }
        .foot-links > div { display: flex; flex-wrap: wrap; }
        .foot-links a { padding: 15px; color: #202124; text-decoration: none; }
        .foot-links a:hover { text-decoration: underline; }

        /* 📈 検索バーの中に出す急上昇ティッカー */
        .search-box { position: relative; }

        .search-ticker {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            align-items: center;
            pointer-events: none; /* クリックは入力欄へ通す */
            font-size: 16px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
        }

        .search-ticker .tk-name { overflow: hidden; text-overflow: ellipsis; }
        .search-ticker .trend-delta { flex: none; }

        .trend-delta {
            flex: none;
            margin-left: 12px;
            padding: 0 8px;
            height: 22px;
            line-height: 22px;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 500;
            color: #188038;
            background: #e6f4ea;
            font-variant-numeric: tabular-nums;
        }

        /* 🔢 各検索カードの右側：過去10分間 / 総アクセス数 */
        .suggest-counts {
            flex: none;
            display: flex;
            align-items: center;
            margin-left: auto;
            padding-left: 12px;
            font-size: 12px;
            color: #5f6368;
            font-variant-numeric: tabular-nums;
        }

        .trend-delta + .suggest-counts { margin-left: 0; }

        .suggest-counts .cnt {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 62px;
            margin-left: 8px;
        }

        .suggest-counts .cnt.zero { color: #9aa0a6; }

        .suggest-counts .material-symbols-outlined { font-size: 16px; margin-right: 3px; }

        /* 過去10分間にアクセスがあるものは緑で目立たせる */
        .suggest-counts .cnt.live { color: #188038; font-weight: 500; }

        /* 名前が潰れないよう、狭い画面では数字を詰める */
        @media (max-width: 480px) {
            .suggest-item { gap: 8px; padding: 8px 12px; }
            .suggest-counts { padding-left: 6px; font-size: 11px; }
            .suggest-counts .cnt { min-width: 0; margin-left: 6px; }
            .suggest-counts .material-symbols-outlined { font-size: 14px; margin-right: 2px; }
            .suggest-main { flex: 1; }
        }


        /* 🔔 お知らせ：サジェストの一番下に固定 */
        .suggest-bell {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            padding: 11px 18px 12px;
            border: 0;
            border-top: 1px solid #e8eaed;
            background: #fff;
            font: inherit;
            font-size: 14px;
            color: #3c4043;
            text-align: left;
            cursor: pointer;
        }

        .suggest-bell[hidden] { display: none; }
        .suggest-bell:hover { background: #f1f3f4; }
        .suggest-bell:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
        .suggest-bell .material-symbols-outlined { font-size: 20px; color: #5f6368; }

        .bell-badge {
            margin-left: auto;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            box-sizing: border-box;
            border-radius: 10px;
            background: #d93025;
            color: #fff;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .bell-badge[hidden] { display: none; }

        /* お知らせモーダル：左に一覧、右に本文 */
        .bell-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(32,33,36,0.5);
        }

        .bell-modal.show { display: flex; }

        .bell-dialog {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 880px;
            height: min(560px, 86vh);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(32,33,36,0.35);
            overflow: hidden;
        }

        .bell-head {
            flex: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 10px 10px 22px;
            border-bottom: 1px solid #e8eaed;
        }

        .bell-head h2 {
            flex: 1;
            margin: 0;
            font-size: 18px;
            font-weight: 500;
            color: #202124;
        }

        .bell-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #5f6368;
            cursor: pointer;
        }

        .bell-icon-btn:hover { background: #f1f3f4; }
        .bell-icon-btn:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
        .bell-back { display: none; margin-left: -12px; }

        .bell-body { flex: 1; min-height: 0; display: flex; }

        .bell-list {
            flex: none;
            width: 292px;
            overflow-y: auto;
            border-right: 1px solid #e8eaed;
            padding: 6px 0;
        }

        .bell-row {
            position: relative;
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 18px 10px 26px;
            border: 0;
            border-left: 3px solid transparent;
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .bell-row:hover { background: #f8f9fa; }
        .bell-row:focus-visible { outline: 2px solid #1a73e8; outline-offset: -2px; }
        .bell-row[aria-current="true"] { background: #e8f0fe; border-left-color: #1a73e8; }

        .bell-row .r-dot {
            position: absolute;
            left: 10px;
            top: 16px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d93025;
            visibility: hidden;
        }

        .bell-row.unread .r-dot { visibility: visible; }

        .bell-row .r-date {
            display: block;
            font-size: 12px;
            color: #70757a;
            font-variant-numeric: tabular-nums;
        }

        .bell-row .r-title {
            display: block;
            margin-top: 2px;
            font-size: 14px;
            color: #202124;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bell-row.unread .r-title { font-weight: 600; }

        .bell-view {
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            padding: 24px 30px 30px;
        }

        .bell-view .v-date {
            font-size: 12px;
            color: #70757a;
            font-variant-numeric: tabular-nums;
        }

        .bell-view h3 {
            margin: 6px 0 18px;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.45;
            color: #202124;
            word-break: break-word;
        }

        .bell-view .v-text {
            max-width: 62ch;
            font-size: 15px;
            line-height: 1.85;
            color: #3c4043;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bell-view .v-text a { color: #1a73e8; }

        /* スマホ：一覧 → 本文 の2画面切り替え */
        @media (max-width: 640px) {
            .bell-modal { padding: 0; }
            .bell-dialog { max-width: none; height: 100%; border-radius: 0; }
            .bell-list { width: 100%; border-right: 0; }
            .bell-view { display: none; padding: 20px 20px 28px; }
            .bell-dialog.show-detail .bell-list { display: none; }
            .bell-dialog.show-detail .bell-view { display: block; }
            .bell-dialog.show-detail .bell-back { display: inline-flex; }
        }

        @media (max-width: 480px) {
            .suggest-bell { padding: 11px 12px 12px; }
        }

        /* チャット：お知らせの下の固定メニュー + モーダル */
        .suggest-chat { border-top-color: #f1f3f4; }

        .chat-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(32,33,36,0.5);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .chat-modal.show { display: flex; }
        .chat-modal.visible { opacity: 1; }

        .chat-dialog {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 520px;
            height: min(560px, 86vh);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(32,33,36,0.35);
            overflow: hidden;
            transform: translateY(12px) scale(0.98);
            transition: transform 0.2s ease;
        }
        .chat-modal.visible .chat-dialog { transform: none; }

        .chat-status { margin-right: 4px; font-size: 12px; color: #70757a; }
        .chat-status.err { color: #d93025; }

        /* モーダルが出たあとに、中身のチャットがふわっと表示される */
        .chat-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .chat-content.ready { opacity: 1; }

        .chat-log {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 22px;
            font-size: 14px;
        }
        .chat-empty { padding: 10px 0; font-size: 13px; color: #70757a; }
        .chat-msg { padding: 5px 0; line-height: 1.5; word-break: break-word; }
        .chat-meta { font-size: 12px; color: #70757a; }
        .chat-name { margin-right: 4px; font-weight: 600; color: #202124; }
        .chat-msg.mine .chat-name { color: #1a73e8; }
        .chat-uid { margin-right: 6px; font-variant-numeric: tabular-nums; }
        .chat-body { color: #202124; white-space: pre-wrap; }

        .chat-form {
            flex: none;
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid #e8eaed;
        }
        .chat-form input {
            min-width: 0;
            height: 38px;
            box-sizing: border-box;
            padding: 0 14px;
            border: 1px solid #dadce0;
            border-radius: 19px;
            outline: none;
            background: #fff;
            color: #202124;
            font-size: 16px; /* iOS で拡大されないように */
        }
        .chat-form input:focus { border-color: #1a73e8; }
        .chat-form .chat-name-input { flex: 0 0 96px; }
        .chat-form .chat-text-input { flex: 1; }
        .chat-send {
            flex: none;
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #1a73e8;
            color: #fff;
            cursor: pointer;
        }
        .chat-send .material-symbols-outlined { font-size: 20px; }
        .chat-send:disabled { opacity: 0.5; cursor: default; }
        .chat-send:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }

        @media (max-width: 640px) {
            .chat-modal { padding: 0; }
            .chat-dialog { max-width: none; height: 100%; border-radius: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .chat-modal, .chat-dialog, .chat-content { transition: none; }
        }

        /* 検索バー：入力欄 + 右側（マイク／レンズ／AI モード） */
        .search-field {
            position: relative;
            flex: 1;
            min-width: 0;
            align-self: stretch;
            display: flex;
            align-items: center;
        }

        .search-actions { flex: none; display: flex; align-items: center; margin-left: 6px; }

        .sa-btn {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #202124;
            cursor: pointer;
        }
        .sa-btn[hidden] { display: none; }
        .sa-btn:hover { background: #f1f3f4; }
        .sa-btn .material-symbols-outlined { font-size: 24px; }
        .sa-btn.fill .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .sa-btn.listening { color: #d93025; background: #fce8e6; }

        .ai-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            margin-left: 8px;
            padding: 0 12px 0 10px;
            border: 0;
            border-radius: 18px;
            background: #f0f4f9;
            color: #202124;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ai-btn:hover { background: #e3eaf4; }
        .ai-btn .material-symbols-outlined { font-size: 20px; }

        .sa-btn:focus-visible, .ai-btn:focus-visible, .apps-btn:focus-visible, .login-btn:focus-visible {
            outline: 2px solid #1a73e8;
            outline-offset: 1px;
        }

        /* 👁 検索バー右側：サイト全体のアクセス数 */
        .site-count {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            margin-right: 4px;
            padding: 0 10px 0 8px;
            border-radius: 14px;
            background: #f1f3f4;
            color: #5f6368;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            user-select: none;
        }
        .site-count[hidden] { display: none; }
        .search-box:not(.open) .site-count { display: none; } /* 検索窓を開いたときだけ表示 */
        .site-count .material-symbols-outlined { font-size: 16px; }

            { name: "k-hub Online 稼働状況",     path: "./files/stats/index.html",                              tags: ["稼働状況","ステータス","オンライン"] }
        ];

        // 🎰 ルーレットの対象（ツールやダウンロード先は除外）
        const luckyGames = games.filter(g => g.lucky !== false);

        // 📈 急上昇（/api/stats の結果。サジェストと「急上昇」欄の両方で使う）
        let gameStats = null;      // { ゲーム名: { last10, total } }（読み込み前は null）
        let latestTrending = [];   // [{ game, recent, prev }]
        let trendWinMin = 60;

        function findGame(name) {
            for (let i = 0; i < games.length; i++) {
                if (games[i].name === name) return games[i];
            }
            return null;
        }

        function winLabel(min) {
            return min % 60 === 0 ? (min / 60) + '時間' : min + '分';
        }

        // 急上昇のうち、一覧に存在するゲームだけ（名前を変えた・消したものは出さない）
        function trendItems() {
            const out = [];
            latestTrending.forEach(t => {
                const g = findGame(t.game);
                if (g) out.push({ g: g, recent: t.recent, prev: t.prev });
            });
            return out;
        }

        function trendSub(t) {
            return '直近' + winLabel(trendWinMin) + 'で' + t.recent + '回（その前は' + t.prev + '回）';
        }

        function fmt(n) {
            return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // 検索カードの右側に出す「過去10分間 / 総アクセス数」
        function makeCounts(name) {
            if (!gameStats) return null;
            const st = gameStats[name] || { last10: 0, total: 0 };
            const wrap = document.createElement('span');
            wrap.className = 'suggest-counts';
            [
                ['timer_10_alt_1', st.last10, '過去10分間のアクセス'],
                ['table_chart_view', st.total, '総アクセス数']
            ].forEach(it => {
                const c = document.createElement('span');
                c.className = 'cnt' + (it[1] ? (it[0] === 'timer_10_alt_1' ? ' live' : '') : ' zero');
                c.title = it[2] + '：' + it[1] + '回';
                c.setAttribute('aria-label', c.title);
                const ic = document.createElement('span');
                ic.className = 'material-symbols-outlined';
                ic.textContent = it[0];
                c.appendChild(ic);
                c.appendChild(document.createTextNode(fmt(it[1])));
                wrap.appendChild(c);
            });
            return wrap;
        }

        function makeDelta(t) {
            const d = document.createElement('span');
            d.className = 'trend-delta';
            d.textContent = '+' + (t.recent - t.prev) + '回';
            return d;
        }

        let finalSelectedIndex = null; // ルーレットで決定したゲーム（null=未決定）

        const ITEM_H = 36;
        const STEP_MS = 50;            // 1コマの速さ（2倍速）
        // ループ用の表示リスト（0番目は元の「I'm Feeling Lucky」）
        const labels = ["I'm Feeling Lucky", ...luckyGames.map(g => g.name)];
        const N = labels.length;

        let pos = 0;                   // 現在表示中の位置（0〜N。Nは0番目の複製）
        let isRolling = false;
        let isHovering = false;

        const track = () => document.getElementById('rouletteTrack');

        window.onload = function() {
            const t = track();
            t.innerHTML = '';
            // labels + 先頭の複製（シームレスにループさせるため）
            [...labels, labels[0]].forEach(text => {
                const span = document.createElement('span');
                span.className = 'roulette-item';
                span.innerText = text;
                t.appendChild(span);
            });
            setPos(0, false);
        };

        function setPos(p, animate) {
            const t = track();
            pos = p;
            t.style.transition = animate ? '' : 'none';
            t.style.top = `-${pos * ITEM_H}px`;
            if (!animate) { void t.offsetHeight; t.style.transition = ''; }
        }

        // ⬇ 1コマ下方向へ動かす（文字は上から下へ流れる）
        function stepDown() {
            if (pos === 0) setPos(N, false); // 末尾の複製へ瞬間移動してループ
            setPos(pos - 1, true);
        }

        // 🎰 ホバーでルーレット開始
        function onLuckyEnter() {
            isHovering = true;
            if (isRolling || finalSelectedIndex !== null) return;
            startSlotRoutine();
        }

        // ホバー終了で結果をリセット
        function onLuckyLeave() {
            isHovering = false;
            if (!isRolling) resetRoulette();
        }

        function resetRoulette() {
            finalSelectedIndex = null;
            setPos(0, false);
        }

        function startSlotRoutine() {
            isRolling = true;

            // 止まる位置を先に決める（labelsのindex 1〜N-1 = ゲーム）
            const targetGame = Math.floor(Math.random() * luckyGames.length);
            const targetPos = targetGame + 1;

            // 1周回してから目標位置でピタッと止まる（回転時間を半分に）
            const toTarget = ((pos - targetPos) % N + N) % N;
            const totalSteps = N + toTarget;

            let count = 0;
            const interval = setInterval(() => {
                stepDown();
                count++;
                if (count >= totalSteps) {
                    clearInterval(interval);
                    finalSelectedIndex = targetGame;
                    isRolling = false;
                    // 終了時にすでにホバーしていなければ即リセット
                    if (!isHovering) resetRoulette();
                }
            }, STEP_MS);
        }

        // クリック（スマホ等でホバーが無い場合も考慮）
        function onLuckyClick() {
            if (isRolling) return;
            if (finalSelectedIndex === null) {
                startSlotRoutine();
                return;
            }
            goToGame();
        }

        // 🔎 検索：ゲーム一覧のサジェスト表示
        let matches = [];
        let activeIdx = -1;

        function searchGames(q) {
            const terms = q.toLowerCase().replace(/#/g, ' ').split(/\s+/).filter(Boolean);
            if (!terms.length) return trendItems().map(t => t.g).concat(games); // 空なら 急上昇 + 全件（ゲーム一覧）
            return games.filter(g => {
                const hay = (g.name + ' ' + g.tags.join(' ') + ' ' + g.path).toLowerCase();
                return terms.every(t => hay.includes(t));
            });
        }

        function renderSuggest() {
            const input = document.getElementById('searchInput');
            const box = document.getElementById('suggestList');
            matches = searchGames(input.value);
            activeIdx = -1;
            box.innerHTML = '';

            // 空欄のときだけ、先頭の nTrend 件が「急上昇」
            const trends = input.value.replace(/#/g, ' ').trim() ? [] : trendItems();
            const nTrend = trends.length;

            if (!matches.length) {
                const d = document.createElement('div');
                d.className = 'suggest-empty';
                d.textContent = '一致するものがありません';
                box.appendChild(d);
            } else {
                matches.forEach((g, i) => {
                    if (nTrend && i === 0) suggestHead(box, '急上昇', 'trending_up');
                    if (nTrend && i === nTrend) suggestHead(box, 'すべてのゲーム');
                    const row = document.createElement('div');
                    row.className = 'suggest-item';
                    const icon = document.createElement('span');
                    icon.className = 'suggest-icon material-symbols-outlined';
                    icon.textContent = i < nTrend ? 'trending_up' : 'search';
                    const main = document.createElement('div');
                    main.className = 'suggest-main';
                    const name = document.createElement('span');
                    name.className = 'suggest-name';
                    name.textContent = g.name;
                    const tags = document.createElement('span');
                    tags.className = 'suggest-tags';
                    tags.textContent = i < nTrend ? trendSub(trends[i]) : g.tags.map(t => '#' + t).join('  ');
                    main.append(name, tags);
                    row.append(icon, main);
                    if (i < nTrend) row.append(makeDelta(trends[i]));
                    const cnt = makeCounts(g.name);
                    if (cnt) row.append(cnt);
                    row.addEventListener('mousedown', e => e.preventDefault());
                    row.addEventListener('click', () => openGame(g));
                    box.appendChild(row);
                });
            }
            document.getElementById('suggest').classList.add('show');
            document.getElementById('searchBox').classList.add('open');
            if (typeof renderTicker === 'function') renderTicker(); // 開いたら急上昇を出す
        }

        function suggestHead(box, text, iconName) {
            const h = document.createElement('div');
            h.className = 'suggest-head';
            if (iconName) {
                const ic = document.createElement('span');
                ic.className = 'material-symbols-outlined';
                ic.textContent = iconName;
                h.appendChild(ic);
            }
            h.appendChild(document.createTextNode(text));
            box.appendChild(h);
        }

        function closeSuggest() {
            document.getElementById('suggest').classList.remove('show');
            document.getElementById('searchBox').classList.remove('open');
            activeIdx = -1;
            if (typeof renderTicker === 'function') renderTicker(); // 閉じたら急上昇を隠す
        }

        function setActive(i) {
            const rows = document.querySelectorAll('#suggest .suggest-item');
            if (!rows.length) return;
            activeIdx = (i + rows.length) % rows.length;
            rows.forEach((r, k) => r.classList.toggle('active', k === activeIdx));
            rows[activeIdx].scrollIntoView({ block: 'nearest' });
        }

        function onSearchKey(e) {
            if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIdx + 1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIdx - 1); }
            else if (e.key === 'Escape') { closeSuggest(); }
        }

        // 外側クリックで閉じる
        document.addEventListener('click', e => {
            if (!e.target.closest('.search-wrap')) closeSuggest();
        });

        function openGame(g) {
            if (!g) return;
            sendHit({ type: 'game', game: g.name }); // 急上昇の集計用
            window.location.href = g.path;
        }

        // 🔍 EnterやGoogle検索を押した時
        function handleSearch(event) {
            event.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (activeIdx >= 0 && matches[activeIdx]) return openGame(matches[activeIdx]);
            if (q && matches.length) return openGame(matches[0]);
            if (q) return googleSearch(); // ゲームに一致しなければ Google で検索
            renderSuggest(); // 空ならゲーム一覧を表示
        }

        // 🌐 本物の Google で検索（Google 検索ボタン）
        function googleSearch() {
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (!q) { input.focus(); renderSuggest(); return; }
            window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        }

        // AI モード（Google の AI モードで検索）
        function aiModeSearch() {
            const q = document.getElementById('searchInput').value.trim();
            window.location.href = 'https://www.google.com/search?udm=50&q=' + encodeURIComponent(q);
        }

        // 画像で検索（Google レンズ）
        function openLens() {
            window.open('https://lens.google.com/', '_blank', 'noopener');
        }

        // 🎤 音声入力（対応ブラウザのみ。非対応ならマイクを隠す）
        (function () {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const mic = document.getElementById('micBtn');
            if (!SR) { mic.hidden = true; return; }
            let rec = null, listening = false;
            mic.addEventListener('click', function () {
                if (listening && rec) { rec.stop(); return; }
                rec = new SR();
                rec.lang = 'ja-JP';
                rec.interimResults = true;
                const input = document.getElementById('searchInput');
                rec.onstart = function () { listening = true; mic.classList.add('listening'); };
                rec.onresult = function (e) {
                    let t = '';
                    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
                    input.value = t;
                    renderSuggest();
                };
                rec.onerror = rec.onend = function () { listening = false; mic.classList.remove('listening'); };
                try { rec.start(); } catch (e) {}
            });
        })();

        // 🚀 ルーレットで決定されたゲームに移動する処理
        function goToGame() {
            if (finalSelectedIndex !== null) openGame(luckyGames[finalSelectedIndex]);
        }

        // 関数が出そろってからフォーカス（autofocus だとスクリプト読み込み前に onfocus が走ることがある）
        document.getElementById('searchInput').focus();
    </script>

    <script>
        // 📊 アクセス集計（functions/api の hit / stats を呼ぶ）
        var STATS_INTERVAL = 30000; // 30秒ごとに更新
        var statsTimer = null;
        var tickIdx = 0;
        var lastKey = '';

        // ゲームを開いたことを記録する（ページ遷移の直前でも届くよう sendBeacon を優先）
        function sendHit(payload) {
            var body = JSON.stringify(payload);
            try {
                if (navigator.sendBeacon &&
                    navigator.sendBeacon('/api/hit', new Blob([body], { type: 'application/json' }))) return;
            } catch (e) {}
            try {
                fetch('/api/hit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body,
                    keepalive: true
                });
            } catch (e) {}
        }

        // 検索バー（サジェスト）が開いているか
        function isSearchOpen() {
            return document.getElementById('suggest').classList.contains('show');
        }

        // 検索バーの中の急上昇ティッカー（検索バーを開いていて空欄のときだけ、数秒ごとに順番に表示）
        function renderTicker() {
            var el = document.getElementById('searchTicker');
            var items = trendItems();
            var icon = document.getElementById('searchIcon');
            if (!isSearchOpen() || !items.length || document.getElementById('searchInput').value) {
                el.style.display = 'none';
                icon.textContent = 'add';
                icon.className = icon.className.replace(' is-trend', '');
                return;
            }
            icon.textContent = 'trending_up'; // 急上昇を出している間は検索マークを置き換える
            if (icon.className.indexOf('is-trend') < 0) icon.className += ' is-trend';

            var t = items[tickIdx % items.length];
            el.innerHTML = '';
            var name = document.createElement('span');
            name.className = 'tk-name';
            name.textContent = t.g.name;
            el.appendChild(name);
            el.appendChild(makeDelta(t));
            el.style.display = 'flex';
        }

        function renderStats(d) {
            var key = JSON.stringify([d.trending, d.games]);
            var changed = key !== lastKey;
            lastKey = key;

            if (d.site && typeof d.site.today === 'number') {
                document.getElementById('siteCountNum').textContent = d.site.today.toLocaleString('ja-JP');
                document.getElementById('siteCount').hidden = false;
                var els = document.querySelectorAll('[data-stat]');
                for (var i = 0; i < els.length; i++) {
                    var v = d.site[els[i].getAttribute('data-stat')];
                    els[i].textContent = typeof v === 'number'
                        ? v.toLocaleString('ja-JP', { maximumFractionDigits: 1 })
                        : '–';
                }
            }

            gameStats = d.games || {};
            latestTrending = d.trending || [];
            trendWinMin = d.trendMin || 60;
            renderTicker();

            // サジェストが開いていて操作中でなければ、数字の変化をそちらにも反映（スクロール位置は保つ）
            var box = document.getElementById('suggest');
            var list = document.getElementById('suggestList');
            if (changed && activeIdx < 0 && box.classList.contains('show')) {
                var top = list.scrollTop;
                renderSuggest();
                list.scrollTop = top;
            }
        }

        function loadStats() {
            fetch('/api/stats', { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(renderStats)
                .catch(function () {
                    // 取得できないときは数字も急上昇も出さず、元の検索バーのままにする
                    gameStats = null;
                    latestTrending = [];
                    lastKey = '';
                    renderTicker();
                });
        }

        function startPolling() {
            clearInterval(statsTimer);
            statsTimer = setInterval(loadStats, STATS_INTERVAL);
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { clearInterval(statsTimer); }
            else { loadStats(); startPolling(); }
        });

        // サイト自体へのアクセスを記録（同じタブ／セッション中のリロードは数えない）
        function recordSiteHit() {
            try {
                if (sessionStorage.getItem('siteHit')) return Promise.resolve();
                sessionStorage.setItem('siteHit', '1');
            } catch (e) {}
            return fetch('/api/hit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'site' }),
                keepalive: true
            }).catch(function () {});
        }

        // 📊 統計モーダルの開閉
        (function () {
            var modal = document.getElementById('statsModal');
            var openBtn = document.getElementById('statsOpen');
            var closeBtn = document.getElementById('statsClose');
            function open() {
                if (typeof closeSuggest === 'function') closeSuggest();
                loadStats(); // 開いたときに最新の数字にする
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                closeBtn.focus();
            }
            function close() {
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                openBtn.focus();
            }
            openBtn.addEventListener('click', open);
            closeBtn.addEventListener('click', close);
            modal.addEventListener('mousedown', function (e) { if (e.target === modal) close(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) close();
            });
        })();

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('searchInput').addEventListener('input', renderTicker);
            setInterval(function () { tickIdx++; renderTicker(); }, 4000);
            recordSiteHit().then(loadStats); // 記録してから取得すると、自分の分も数字に入る
            startPolling();
        });
    </script>
    <script>
        // 🔔 お知らせ：同じフォルダの bell.js（window.BELL_ITEMS）を読み込む。無ければお知らせ欄は出さない
        (function () {
            var SEEN_KEY = 'bellSeen';
            var items = [];
            var rows = [];
            var sel = -1;
            var seen = [];
            var overlayDown = false;

            var $ = function (id) { return document.getElementById(id); };
            var isMobile = function () { return window.matchMedia('(max-width: 640px)').matches; };
            var isOpen = function () { return $('bellModal').classList.contains('show'); };

            function pad(n) { return (n < 10 ? '0' : '') + n; }

            function parseDate(s) {
                var t = Date.parse(String(s || '').replace(/\//g, '-').replace(' ', 'T'));
                return isNaN(t) ? 0 : t;
            }

            function fmtDate(s) {
                var t = parseDate(s);
                if (!t) return String(s || '');
                var d = new Date(t);
                var out = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate());
                return String(s).indexOf(':') < 0 ? out : out + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            function readSeen() {
                try {
                    var a = JSON.parse(localStorage.getItem(SEEN_KEY) || '[]');
                    return Array.isArray(a) ? a : [];
                } catch (e) { return []; }
            }

            function writeSeen() {
                try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen.slice(-300))); } catch (e) {}
            }

            function isUnread(it) { return seen.indexOf(it.key) < 0; }

            function loadItems() {
                var raw = window.BELL_ITEMS;
                if (!Array.isArray(raw)) return [];
                return raw
                    .filter(function (x) { return x && (x.title || x.body); })
                    .map(function (x) {
                        var o = { date: String(x.date || ''), title: String(x.title || ''), body: String(x.body || '') };
                        o.key = o.date + '|' + o.title;
                        o.time = parseDate(o.date);
                        return o;
                    })
                    .sort(function (a, b) { return b.time - a.time; }); // 新しい順
            }

            // 本文：URL（http/https）だけリンクにして、あとは文字のまま出す
            function appendText(el, text) {
                text.split(/(https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/g).forEach(function (part, i) {
                    if (i % 2 === 1) {
                        var a = document.createElement('a');
                        a.href = part;
                        a.textContent = part;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        el.appendChild(a);
                    } else if (part) {
                        el.appendChild(document.createTextNode(part));
                    }
                });
            }

            function updateBar() {
                var bar = $('suggestBell');
                var badge = $('bellBadge');
                bar.hidden = !items.length;
                var n = items.filter(isUnread).length;
                badge.hidden = n === 0;
                badge.textContent = n > 9 ? '9+' : String(n);
                bar.setAttribute('aria-label', 'お知らせ' + (n ? '（未読' + n + '件）' : ''));
            }

            function buildList() {
                var list = $('bellList');
                list.innerHTML = '';
                rows = items.map(function (it, i) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'bell-row';
                    var dot = document.createElement('span');
                    dot.className = 'r-dot';
                    var d = document.createElement('span');
                    d.className = 'r-date';
                    d.textContent = fmtDate(it.date);
                    var t = document.createElement('span');
                    t.className = 'r-title';
                    t.textContent = it.title || '（無題）';
                    b.append(dot, d, t);
                    b.addEventListener('click', function () { select(i, true); });
                    list.appendChild(b);
                    return b;
                });
            }

            function refreshRows() {
                rows.forEach(function (b, i) {
                    b.classList.toggle('unread', isUnread(items[i]));
                    if (i === sel) b.setAttribute('aria-current', 'true');
                    else b.removeAttribute('aria-current');
                });
            }

            function renderView(it) {
                var v = $('bellView');
                v.innerHTML = '';
                var d = document.createElement('div');
                d.className = 'v-date';
                d.textContent = fmtDate(it.date);
                var h = document.createElement('h3');
                h.textContent = it.title || '（無題）';
                var p = document.createElement('div');
                p.className = 'v-text';
                appendText(p, it.body);
                v.append(d, h, p);
                v.scrollTop = 0;
            }

            // スマホで一覧だけが見えている間は「読んだ」扱いにしない
            function select(i, fromTap) {
                sel = i;
                var it = items[i];
                renderView(it);
                var showDetail = !isMobile() || fromTap;
                $('bellDialog').classList.toggle('show-detail', isMobile() && fromTap);
                if (showDetail && isUnread(it)) {
                    seen.push(it.key);
                    writeSeen();
                    updateBar();
                }
                refreshRows();
                if (isMobile() && fromTap) $('bellBack').focus();
            }

            function openModal() {
                if (!items.length) return;
                if (typeof closeSuggest === 'function') closeSuggest();
                seen = readSeen();
                buildList();
                var m = $('bellModal');
                m.classList.add('show');
                m.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                $('bellDialog').classList.remove('show-detail');
                select(0, false);
                $('bellClose').focus();
            }

            function closeModal() {
                var m = $('bellModal');
                m.classList.remove('show');
                m.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            function focusables() {
                return Array.prototype.filter.call(
                    $('bellDialog').querySelectorAll('button, a[href]'),
                    function (el) { return el.offsetParent !== null; }
                );
            }

            function onKey(e) {
                if (!isOpen()) return;
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeModal();
                } else if (e.key === 'Tab') {
                    var f = focusables();
                    if (!f.length) return;
                    var first = f[0], last = f[f.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && rows.indexOf(document.activeElement) >= 0) {
                    e.preventDefault();
                    var next = rows.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1);
                    if (next >= 0 && next < rows.length) { select(next, false); rows[next].focus(); }
                }
            }

            function init() {
                items = loadItems();
                seen = readSeen();
                updateBar();
                if (!items.length) return;
                $('suggestBell').addEventListener('click', openModal);
                $('bellClose').addEventListener('click', closeModal);
                $('bellBack').addEventListener('click', function () {
                    $('bellDialog').classList.remove('show-detail');
                    if (rows[sel]) rows[sel].focus();
                });
                var m = $('bellModal');
                m.addEventListener('mousedown', function (e) { overlayDown = e.target === m; });
                m.addEventListener('click', function (e) { if (overlayDown && e.target === m) closeModal(); });
                document.addEventListener('keydown', onKey);
            }

            // 毎回最新の bell.js を取りに行く（無ければ何もしない）
            var sc = document.createElement('script');
            sc.src = './bell.js?t=' + Date.now();
            sc.onload = init;
            sc.onerror = function () {};
            document.head.appendChild(sc);
        })();
    </script>
    <script>
        // チャット（/api/chat を6秒ごとに差分取得）
        (function () {
            var POLL_MS = 6000;
            var MAX_NODES = 100;
            var lastId = 0;
            var timer = null;
            var loading = false;
            var sending = false;
            var firstDone = false;
            var forceScroll = false;

            var logEl = document.getElementById('chatLog');
            var form = document.getElementById('chatForm');
            var nameEl = document.getElementById('chatName');
            var textEl = document.getElementById('chatText');
            var sendEl = document.getElementById('chatSend');
            var statusEl = document.getElementById('chatStatus');

            function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

            // 端末ごとの匿名ID（自分の発言の色分けと、同名の区別に使う）
            var myUid = lsGet('chatUid');
            if (!/^[0-9a-f]{16}$/.test(myUid || '')) {
                var a = new Uint8Array(8);
                (window.crypto || window.msCrypto).getRandomValues(a);
                myUid = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
                lsSet('chatUid', myUid);
            }
            nameEl.value = lsGet('chatName') || '';

            function setStatus(text, isErr) {
                statusEl.textContent = text;
                statusEl.className = 'chat-status' + (isErr ? ' err' : '');
            }

            function fmtTime(ts) {
                var d = new Date(ts), now = new Date();
                var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
                return d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
            }

            function setEmpty(text) {
                var e = logEl.querySelector('.chat-empty');
                if (e) e.textContent = text;
            }

            function addMessages(list) {
                var nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
                var added = 0;
                list.forEach(function (m) {
                    if (m.id <= lastId) return;
                    lastId = m.id;
                    added++;
                    var row = document.createElement('div');
                    row.className = 'chat-msg' + (m.uid && m.uid === myUid ? ' mine' : '');
                    var meta = document.createElement('div');
                    meta.className = 'chat-meta';
                    var name = document.createElement('span');
                    name.className = 'chat-name';
                    name.textContent = m.name;
                    meta.appendChild(name);
                    if (m.uid) {
                        var id = document.createElement('span');
                        id.className = 'chat-uid';
                        id.textContent = '#' + m.uid.slice(0, 4);
                        meta.appendChild(id);
                    }
                    meta.appendChild(document.createTextNode(fmtTime(m.ts)));
                    var body = document.createElement('div');
                    body.className = 'chat-body';
                    body.textContent = m.body; // textContent なのでHTMLは解釈されない
                    row.append(meta, body);
                    logEl.appendChild(row);
                });
                if (added) {
                    var e = logEl.querySelector('.chat-empty');
                    if (e) e.remove();
                }
                var msgs = logEl.querySelectorAll('.chat-msg');
                for (var i = 0; i < msgs.length - MAX_NODES; i++) msgs[i].remove();
                if (added && (nearBottom || forceScroll || !firstDone)) logEl.scrollTop = logEl.scrollHeight;
                forceScroll = false;
            }

            function loadChat() {
                if (loading) return Promise.resolve();
                loading = true;
                return fetch('/api/chat' + (lastId ? '?after=' + lastId : ''), { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (d) {
                        setStatus('', false);
                        addMessages(d.messages || []);
                        if (!firstDone && !lastId) setEmpty('まだメッセージはありません');
                        firstDone = true;
                    })
                    .catch(function () {
                        setStatus('読み込めません', true);
                        if (!firstDone) setEmpty('チャットを読み込めませんでした');
                    })
                    .then(function () { loading = false; });
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var body = textEl.value.trim();
                if (!body || sending) return;
                sending = true;
                sendEl.disabled = true;
                var name = nameEl.value.trim();
                lsSet('chatName', name);
                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, body: body, uid: myUid })
                })
                    .then(function (r) {
                        return r.json().catch(function () { return {}; }).then(function (d) {
                            if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
                        });
                    })
                    .then(function () {
                        textEl.value = '';
                        setStatus('', false);
                        forceScroll = true;
                        return loadChat();
                    })
                    .catch(function (err) { setStatus(err.message || '送信できませんでした', true); })
                    .then(function () {
                        sending = false;
                        sendEl.disabled = false;
                        textEl.focus();
                    });
            });

            // チャットに入力するときは検索サジェストを閉じる
            [nameEl, textEl].forEach(function (el) {
                el.addEventListener('focus', function () {
                    if (typeof closeSuggest === 'function') closeSuggest();
                });
            });

            function startPolling() {
                clearInterval(timer);
                timer = setInterval(loadChat, POLL_MS);
            }
            // モーダルの開閉：開く → ふわっと表示 → そのあとチャットを表示して読み込み開始
            var modal = document.getElementById('chatModal');
            var content = document.getElementById('chatContent');
            var openBtn = document.getElementById('chatOpen');
            var closeBtn = document.getElementById('chatClose');
            var isOpen = false;
            var modalTimer = null;

            function openChat() {
                if (isOpen) return;
                isOpen = true;
                if (typeof closeSuggest === 'function') closeSuggest();
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                void modal.offsetHeight; // 表示してからクラスを付けてアニメーションさせる
                modal.classList.add('visible');
                clearTimeout(modalTimer);
                modalTimer = setTimeout(function () {
                    content.classList.add('ready');
                    forceScroll = true;
                    loadChat();
                    startPolling();
                    textEl.focus();
                }, 220);
            }

            function closeChat() {
                if (!isOpen) return;
                isOpen = false;
                clearTimeout(modalTimer);
                clearInterval(timer);
                modal.classList.remove('visible');
                content.classList.remove('ready');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                modalTimer = setTimeout(function () { modal.classList.remove('show'); }, 200);
                openBtn.focus();
            }

            openBtn.addEventListener('click', openChat);
            closeBtn.addEventListener('click', closeChat);
            modal.addEventListener('mousedown', function (e) {
                if (e.target === modal) closeChat(); // 背景クリックで閉じる
            });
            document.addEventListener('keydown', function (e) {
                if (!isOpen) return;
                if (e.key === 'Escape') { closeChat(); return; }
                if (e.key === 'Tab') { // フォーカスをモーダル内に留める
                    var f = modal.querySelectorAll('button:not([disabled]), input');
                    if (!f.length) return;
                    var first = f[0], last = f[f.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                }
            });

            document.addEventListener('visibilitychange', function () {
                if (!isOpen) return;
                if (document.hidden) { clearInterval(timer); }
                else { loadChat(); startPolling(); }
            });
        })();
    </script>
</body>
</html>
