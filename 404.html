<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 エラー</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: #222;
            overflow-x: hidden;
        }

        .wrap {
            box-sizing: border-box;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
            padding: 40px 24px;
        }

        .text { width: 100%; max-width: 400px; }

        .logo {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -2px;
            line-height: 1;
            margin: 0 0 44px;
            user-select: none;
        }
        .g1, .g2 { color: #4285F4; }
        .o1, .e { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .l { color: #34A853; }

        .code {
            margin: 0 0 22px;
            font-size: 16px;
            font-weight: 400;
            color: #70757a;
        }
        .code b { color: #202124; font-weight: 700; }

        .msg {
            margin: 0 0 24px;
            font-size: 16px;
            line-height: 1.6;
            color: #202124;
            word-break: break-all;
        }
        .msg .gray { color: #70757a; }
        .msg code {
            font-family: inherit;
            font-weight: 600;
        }

        .back {
            display: inline-block;
            font-size: 14px;
            color: #1a73e8;
            text-decoration: none;
        }
        .back:hover { text-decoration: underline; }
        .back:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }

        .robot { flex: none; width: 200px; height: auto; user-select: none; }

        @media (max-width: 720px) {
            .wrap { flex-direction: column; justify-content: center; gap: 24px; }
            .text { max-width: 480px; }
            .logo { margin-bottom: 28px; }
            .robot { width: 150px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="text">
            <h1 class="logo" aria-label="Google">
                <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
            </h1>

            <p class="code"><b>404.</b> エラーです。</p>

            <p class="msg">
                リクエストされた URL <code id="reqPath">/</code> はこのサーバーで見つかりませんでした。
                <span class="gray">わかっているのはここまでです。</span>
            </p>

            <a href="/" class="back">トップページへ戻る</a>
        </div>

        <img class="robot" src="/robot.png" width="171" height="213" alt="壊れて部品が散らばったロボットのイラスト">
    </div>

    <script>
        // 存在しなかったURLのパスを表示（textContentなのでHTMLとしては解釈されない）
        document.getElementById('reqPath').textContent = location.pathname + location.search;
    </script>
</body>
</html>
