<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Craft</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  overflow: hidden;
  font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  user-select: none;
}
canvas { display: block; cursor: none; }

/* ─── メニュー画面 ─── */
#menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
  transition: opacity 0.2s ease;
}
#menu-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
#menu-overlay h1 {
  color: #fff;
  font-size: 42px;
  font-weight: 500;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 #000;
}
#menu-overlay .subtitle {
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  margin-bottom: 40px;
}
.menu-btn {
  width: 220px;
  padding: 14px 0;
  margin: 8px 0;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}
.menu-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
  transform: scale(1.03);
}
.menu-btn.primary {
  background: rgba(76, 175, 80, 0.25);
  border-color: rgba(76, 175, 80, 0.5);
}
.menu-btn.primary:hover {
  background: rgba(76, 175, 80, 0.4);
}
.menu-btn.danger {
  background: rgba(244, 67, 54, 0.2);
  border-color: rgba(244, 67, 54, 0.4);
}
.menu-btn.danger:hover {
  background: rgba(244, 67, 54, 0.35);
}

/* ─── ゲーム内UI ─── */
#game-ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
#crosshair {
  position: fixed;
  top: 50%; left: 50%;
  width: 20px; height: 20px;
  transform: translate(-50%, -50%);
}
#crosshair::before, #crosshair::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.9);
}
#crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
#crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
#hotbar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  background: rgba(0,0,0,0.5);
  padding: 8px;
  border-radius: 10px;
}
.slot {
  width: 48px; height: 48px;
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.1s;
}
.slot.active {
  border-color: #fff;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
  transform: scale(1.08);
}
.slot .color {
  width: 30px; height: 30px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.3);
}
.slot .key-label {
  position: absolute;
  bottom: 3px; left: 4px;
  font-size: 10px;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
}
#hud-info {
  position: fixed;
  top: 14px; left: 16px;
  color: #fff;
  font-size: 13px;
  line-height: 1.7;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
}
#hud-info .coord {
  font-family: 'Consolas', monospace;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.8);
}
#click-to-play {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 18px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 20;
  transition: opacity 0.3s;
}
</style>
</head>
<body>

<!-- メニュー画面 -->
<div id="menu-overlay">
  <h1>Mini Craft</h1>
  <div class="subtitle">HTML5 Sandbox World</div>
  <button class="menu-btn primary" id="btn-resume">ゲームに戻る</button>
  <button class="menu-btn" id="btn-regen">ワールド再生成</button>
  <button class="menu-btn danger" id="btn-exit">終了</button>
  <div style="margin-top:24px;color:rgba(255,255,255,0.4);font-size:12px">
    Esc でメニューを開く　|　クリックでマウスロック
  </div>
</div>

<!-- ゲーム内UI -->
<div id="game-ui">
  <div id="crosshair"></div>
  <div id="hotbar">
    <div class="slot active" data-type="1"><div class="color" style="background:#5D4037"></div><span class="key-label">1</span></div>
    <div class="slot" data-type="2"><div class="color" style="background:#7CB342"></div><span class="key-label">2</span></div>
    <div class="slot" data-type="3"><div class="color" style="background:#43A047"></div><span class="key-label">3</span></div>
    <div class="slot" data-type="4"><div class="color" style="background:#8D6E63"></div><span class="key-label">4</span></div>
    <div class="slot" data-type="5"><div class="color" style="background:#B0BEC5"></div><span class="key-label">5</span></div>
  </div>
  <div id="hud-info">
    <div>Mini Craft v1.0</div>
    <div class="coord" id="coord-display">X: 0 Y: 0 Z: 0</div>
    <div style="margin-top:4px;color:rgba(255,255,255,0.5);font-size:11px">
      WASD移動 | スペースジャンプ | Q/E上下 | 左クリック設置 | 右クリック破壊
    </div>
  </div>
  <div id="click-to-play">クリックしてゲーム開始</div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('menu-overlay');
const clickToPlay = document.getElementById('click-to-play');
const coordDisplay = document.getElementById('coord-display');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ─── ゲーム状態 ───
let isPaused = true;
let pointerLocked = false;
let selectedBlock = 1;

// ─── Pointer Lock ───
function lockPointer() {
  if (!isPaused) {
    canvas.requestPointerLock();
  }
}

canvas.addEventListener('click', () => {
  if (isPaused) {
    isPaused = false;
    menuOverlay.classList.add('hidden');
    clickToPlay.style.opacity = '0';
    lockPointer();
  } else if (!pointerLocked) {
    lockPointer();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  if (!pointerLocked && !isPaused) {
    // Escで自動解除された → メニュー表示
    isPaused = true;
    menuOverlay.classList.remove('hidden');
    clickToPlay.style.opacity = '1';
  }
});

// ─── メニューボタン ───
document.getElementById('btn-resume').addEventListener('click', () => {
  isPaused = false;
  menuOverlay.classList.add('hidden');
  clickToPlay.style.opacity = '0';
  lockPointer();
});

document.getElementById('btn-regen').addEventListener('click', () => {
  generate();
  isPaused = false;
  menuOverlay.classList.add('hidden');
  clickToPlay.style.opacity = '0';
  lockPointer();
});

document.getElementById('btn-exit').addEventListener('click', () => {
  if (document.exitPointerLock) document.exitPointerLock();
  window.close();
  // window.close()が効かない場合
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:18px;">ゲームを終了しました。タブを閉じてください。</div>';
});

// ─── ワールド設定 ───
const WORLD_SIZE = 32;
const BLOCK_SIZE = 24;
const world = new Uint8Array(WORLD_SIZE * WORLD_SIZE * WORLD_SIZE);

function idx(x, y, z) {
  if (x < 0 || x >= WORLD_SIZE || y < 0 || y >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return -1;
  return (y * WORLD_SIZE + z) * WORLD_SIZE + x;
}
function get(x, y, z) {
  const i = idx(x, y, z);
  return i >= 0 ? world[i] : 0;
}
function set(x, y, z, v) {
  const i = idx(x, y, z);
  if (i >= 0) world[i] = v;
}

const BLOCKS = {
  1: { name: '土', top: '#5D4037', side: '#6D4C41', bottom: '#4E342E' },
  2: { name: '草', top: '#7CB342', side: '#795548', bottom: '#5D4037' },
  3: { name: '葉', top: '#43A047', side: '#388E3C', bottom: '#2E7D32' },
  4: { name: '木', top: '#8D6E63', side: '#795548', bottom: '#6D4C41' },
  5: { name: '石', top: '#B0BEC5', side: '#90A4AE', bottom: '#78909C' },
};

function generate() {
  world.fill(0);
  for (let x = 0; x < WORLD_SIZE; x++) {
    for (let z = 0; z < WORLD_SIZE; z++) {
      const h = Math.floor(8 + Math.sin(x * 0.25) * 2.5 + Math.cos(z * 0.25) * 2.5 + Math.random() * 1.2);
      for (let y = 0; y <= h && y < WORLD_SIZE; y++) {
        if (y === h) set(x, y, z, 2);
        else if (y > h - 3) set(x, y, z, 1);
        else set(x, y, z, 5);
      }
      if (Math.random() < 0.035 && h + 4 < WORLD_SIZE) {
        for (let t = 1; t <= 3; t++) set(x, h + t, z, 4);
        set(x, h + 4, z, 3);
        if (x > 0) set(x - 1, h + 3, z, 3);
        if (x < WORLD_SIZE - 1) set(x + 1, h + 3, z, 3);
        if (z > 0) set(x, h + 3, z - 1, 3);
        if (z < WORLD_SIZE - 1) set(x, h + 3, z + 1, 3);
      }
    }
  }
}
generate();

// ─── カメラ ───
const cam = { x: WORLD_SIZE * BLOCK_SIZE * 0.5, y: 200, z: WORLD_SIZE * BLOCK_SIZE * 0.3 };
let rotX = 0.6, rotY = 0.4;

// ─── 入力 ───
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape') {
    isPaused = true;
    if (document.exitPointerLock) document.exitPointerLock();
    menuOverlay.classList.remove('hidden');
    clickToPlay.style.opacity = '1';
  }
  if (['1','2','3','4','5'].includes(e.key)) {
    selectedBlock = parseInt(e.key);
    document.querySelectorAll('.slot').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.type) === selectedBlock);
    });
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// マウス移動（Pointer Lock時）
let moveX = 0, moveY = 0;
document.addEventListener('mousemove', e => {
  if (pointerLocked && !isPaused) {
    rotY += e.movementX * 0.003;
    rotX += e.movementY * 0.003;
    rotX = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, rotX));
  }
});

// クリック（設置・破壊）
canvas.addEventListener('mousedown', e => {
  if (!pointerLocked || isPaused) return;
  if (e.button === 0) placeBlock();      // 左クリック → 設置
  else if (e.button === 2) breakBlock();   // 右クリック → 破壊
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── レイキャスト ───
function raycast() {
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const dir = {
    x: sinX * sinY,
    y: cosX,
    z: sinX * cosY
  };
  let x = cam.x, y = cam.y, z = cam.z;
  for (let step = 0; step < 140; step++) {
    x += dir.x * 2;
    y += dir.y * 2;
    z += dir.z * 2;
    const bx = Math.floor(x / BLOCK_SIZE);
    const by = Math.floor(y / BLOCK_SIZE);
    const bz = Math.floor(z / BLOCK_SIZE);
    if (bx >= 0 && bx < WORLD_SIZE && by >= 0 && by < WORLD_SIZE && bz >= 0 && bz < WORLD_SIZE) {
      if (get(bx, by, bz) !== 0) {
        return { x: bx, y: by, z: bz, px: x - dir.x * 2, py: y - dir.y * 2, pz: z - dir.z * 2 };
      }
    }
  }
  return null;
}

function placeBlock() {
  const hit = raycast();
  if (!hit) return;
  const nx = Math.floor((hit.px + 0.01) / BLOCK_SIZE);
  const ny = Math.floor((hit.py + 0.01) / BLOCK_SIZE);
  const nz = Math.floor((hit.pz + 0.01) / BLOCK_SIZE);
  const px = Math.floor(cam.x / BLOCK_SIZE);
  const py = Math.floor(cam.y / BLOCK_SIZE);
  const pz = Math.floor(cam.z / BLOCK_SIZE);
  if (nx === px && ny === py && nz === pz) return;
  if (nx === px && ny === py - 1 && nz === pz) return;
  if (get(nx, ny, nz) === 0) set(nx, ny, nz, selectedBlock);
}

function breakBlock() {
  const hit = raycast();
  if (hit) set(hit.x, hit.y, hit.z, 0);
}

// ─── 3D投影 ───
function project(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x1 = dx * cosY - dz * sinY;
  const z1 = dx * sinY + dz * cosY;
  const y2 = dy * cosX - z1 * sinX;
  const z2 = dy * sinX + z1 * cosX;
  if (z2 <= 1) return null;
  const scale = 600 / z2;
  return { x: W / 2 + x1 * scale, y: H / 2 - y2 * scale, scale, z: z2 };
}

function drawFace(points, color, brightness) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  const f = brightness;
  ctx.fillStyle = `rgb(${Math.floor(r * f)},${Math.floor(g * f)},${Math.floor(b * f)})`;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function render() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, W, H);

  // 地面グリッド
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = -20; i <= 20; i++) {
    const p1 = project(i * BLOCK_SIZE * 2, 0, -WORLD_SIZE * BLOCK_SIZE);
    const p2 = project(i * BLOCK_SIZE * 2, 0, WORLD_SIZE * BLOCK_SIZE * 2);
    if (p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
    const p3 = project(-WORLD_SIZE * BLOCK_SIZE, 0, i * BLOCK_SIZE * 2);
    const p4 = project(WORLD_SIZE * BLOCK_SIZE * 2, 0, i * BLOCK_SIZE * 2);
    if (p3 && p4) { ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke(); }
  }

  const toRender = [];
  const cx = Math.floor(cam.x / BLOCK_SIZE);
  const cz = Math.floor(cam.z / BLOCK_SIZE);

  for (let x = 0; x < WORLD_SIZE; x++) {
    for (let y = 0; y < WORLD_SIZE; y++) {
      for (let z = 0; z < WORLD_SIZE; z++) {
        const b = get(x, y, z);
        if (b === 0) continue;
        const dx = x - cx, dz = z - cz;
        if (dx * dx + dz * dz > 18 * 18) continue;
        if (get(x + 1, y, z) && get(x - 1, y, z) && get(x, y + 1, z) && get(x, y - 1, z) && get(x, y, z + 1) && get(x, y, z - 1)) continue;
        const wx = x * BLOCK_SIZE, wy = y * BLOCK_SIZE, wz = z * BLOCK_SIZE;
        const center = project(wx + BLOCK_SIZE / 2, wy + BLOCK_SIZE / 2, wz + BLOCK_SIZE / 2);
        if (!center) continue;
        toRender.push({ x, y, z, b, depth: center.z, wx, wy, wz });
      }
    }
  }

  toRender.sort((a, b) => b.depth - a.depth);

  for (const block of toRender) {
    const { x, y, z, b, wx, wy, wz } = block;
    const type = BLOCKS[b];
    const p000 = project(wx, wy, wz);
    const p100 = project(wx + BLOCK_SIZE, wy, wz);
    const p110 = project(wx + BLOCK_SIZE, wy + BLOCK_SIZE, wz);
    const p010 = project(wx, wy + BLOCK_SIZE, wz);
    const p001 = project(wx, wy, wz + BLOCK_SIZE);
    const p101 = project(wx + BLOCK_SIZE, wy, wz + BLOCK_SIZE);
    const p111 = project(wx + BLOCK_SIZE, wy + BLOCK_SIZE, wz + BLOCK_SIZE);
    const p011 = project(wx, wy + BLOCK_SIZE, wz + BLOCK_SIZE);
    if (!p000 || !p100 || !p110 || !p010 || !p001 || !p101 || !p111 || !p011) continue;

    if (!get(x, y + 1, z)) drawFace([p010, p110, p111, p011], type.top, 1.0);
    if (!get(x, y, z + 1)) drawFace([p001, p101, p111, p011], type.side, 0.85);
    if (!get(x + 1, y, z)) drawFace([p100, p110, p111, p101], type.side, 0.7);
    if (!get(x - 1, y, z)) drawFace([p000, p010, p011, p001], type.side, 0.7);
    if (!get(x, y, z - 1)) drawFace([p000, p100, p110, p010], type.side, 0.6);
    if (!get(x, y - 1, z)) drawFace([p000, p100, p101, p001], type.bottom, 0.5);
  }

  // 選択ハイライト
  const hit = raycast();
  if (hit) {
    const hx = hit.x * BLOCK_SIZE, hy = hit.y * BLOCK_SIZE, hz = hit.z * BLOCK_SIZE;
    const pts = [
      project(hx - 1, hy - 1, hz - 1), project(hx + BLOCK_SIZE + 1, hy - 1, hz - 1),
      project(hx + BLOCK_SIZE + 1, hy + BLOCK_SIZE + 1, hz - 1), project(hx - 1, hy + BLOCK_SIZE + 1, hz - 1),
      project(hx - 1, hy - 1, hz + BLOCK_SIZE + 1), project(hx + BLOCK_SIZE + 1, hy - 1, hz + BLOCK_SIZE + 1),
      project(hx + BLOCK_SIZE + 1, hy + BLOCK_SIZE + 1, hz + BLOCK_SIZE + 1), project(hx - 1, hy + BLOCK_SIZE + 1, hz + BLOCK_SIZE + 1),
    ];
    if (pts.every(p => p)) {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y); ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pts[4].x, pts[4].y); ctx.lineTo(pts[5].x, pts[5].y);
      ctx.lineTo(pts[6].x, pts[6].y); ctx.lineTo(pts[7].x, pts[7].y); ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[4].x, pts[4].y);
      ctx.moveTo(pts[1].x, pts[1].y); ctx.lineTo(pts[5].x, pts[5].y);
      ctx.moveTo(pts[2].x, pts[2].y); ctx.lineTo(pts[6].x, pts[6].y);
      ctx.moveTo(pts[3].x, pts[3].y); ctx.lineTo(pts[7].x, pts[7].y);
      ctx.stroke();
    }
  }
}

// ─── ゲームループ ───
let vy = 0;
const GRAVITY = 0.6;
const SPEED = 2.5;

function update() {
  if (!isPaused) {
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    let mx = 0, mz = 0;
    if (keys['w'] || keys['arrowup']) { mx += sinY; mz += cosY; }
    if (keys['s'] || keys['arrowdown']) { mx -= sinY; mz -= cosY; }
    if (keys['a'] || keys['arrowleft']) { mx += cosY; mz -= sinY; }
    if (keys['d'] || keys['arrowright']) { mx -= cosY; mz += sinY; }
    const len = Math.sqrt(mx * mx + mz * mz);
    if (len > 0) { mx = mx / len * SPEED; mz = mz / len * SPEED; }

    const nx = cam.x + mx;
    const nz = cam.z + mz;
    const bx = Math.floor(nx / BLOCK_SIZE);
    const bz = Math.floor(nz / BLOCK_SIZE);
    const by = Math.floor((cam.y - 10) / BLOCK_SIZE);
    if (bx >= 0 && bx < WORLD_SIZE && bz >= 0 && bz < WORLD_SIZE && by >= 0 && by < WORLD_SIZE) {
      if (get(bx, by, bz) === 0 && get(bx, by - 1, bz) === 0) {
        cam.x = nx; cam.z = nz;
      }
    }

    if (keys['q']) cam.y -= SPEED;
    if (keys['e']) cam.y += SPEED;

    const footY = Math.floor((cam.y - 20) / BLOCK_SIZE);
    const footX = Math.floor(cam.x / BLOCK_SIZE);
    const footZ = Math.floor(cam.z / BLOCK_SIZE);

    if (keys[' '] && vy === 0) {
      if (footY >= 0 && footY < WORLD_SIZE && get(footX, footY, footZ) !== 0) {
        vy = 8;
      }
    }

    if (vy !== 0 || get(footX, Math.max(0, footY), footZ) === 0) {
      vy -= GRAVITY;
      cam.y += vy;
      const newFootY = Math.floor((cam.y - 20) / BLOCK_SIZE);
      if (newFootY >= 0 && newFootY < WORLD_SIZE && get(footX, newFootY, footZ) !== 0) {
        cam.y = (newFootY + 1) * BLOCK_SIZE + 20;
        vy = 0;
      }
      if (cam.y < 20) { cam.y = 20; vy = 0; }
    }

    // 座標表示更新
    coordDisplay.textContent = `X: ${Math.floor(cam.x)} Y: ${Math.floor(cam.y)} Z: ${Math.floor(cam.z)}`;
  }

  render();
  requestAnimationFrame(update);
}

update();
