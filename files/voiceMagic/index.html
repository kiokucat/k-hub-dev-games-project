<style>

<div id="start"><div class="card">
<h1>詠唱の魔導士</h1>
<p style="font-size:15px;opacity:.9">千年の封印が、いま緩む。<br>声を喰らう「沈黙の王」を、あなたの声でもう一度闇へ還せ。</p><p>マイクに向かって<b>本当に呪文を唱えて</b>撃て。声が大きいほど威力アップ。</p>
<div class="sp" id="sl"></div>
<p style="font-size:13px;opacity:.85">赤い敵にはサンダー、青い敵にはファイア、紫の敵にはアイスが2倍効く。<br>「燃えろ、ファイア！」のように文の中に混ぜてもOK。</p>
<p id="rcd" style="font-size:13px;opacity:.85"></p><button class="btn" id="ct" style="display:none"></button><button class="btn" id="go">マイクを許可して始める</button><button class="btn s" id="cm"></button><button class="btn s" id="md">モード：物語</button><button class="btn s" id="go2">マイクなしで遊ぶ</button>
</div></div>
<div id="cr"><div class="card"><h1>魔法工房</h1>
<p style="font-size:13px;opacity:.85">5つのスロットに自分だけの魔法を設計して、そのままエンドレスへ出撃。<br>言葉はひらがな・カタカナ推奨。複数は「,」で区切る。言葉が重ならないように。</p>
<div id="crt"></div>
<div class="fm">
<label><span>魔法の名前</span><input id="cn" maxlength="12"></label>
<label><span>唱える言葉</span><input id="cw" maxlength="30"></label>
<label><span>属性</span><select id="ce"><option value="fire">炎（火球）</option><option value="ice">氷（氷の矢・凍結）</option><option value="thunder">雷（連鎖）</option><option value="meteor">隕石（全体爆発）</option><option value="heal">癒し（HP回復）</option></select></label>
<label><span>強さ <b id="pv"></b></span><input id="cp" type="range" min="5" max="300" step="5"></label>
<label><span>クールタイム <b id="cv"></b>秒</span><input id="cc" type="range" min="3" max="300"></label>
</div>
<p id="crm" style="color:#ffd24a;min-height:1.4em;font-size:13px"></p>
<button class="btn" id="cgo">この魔法で出撃</button><button class="btn s" id="crs">標準に戻す</button><button class="btn s" id="crb">保存してもどる</button>
</div></div>
<div id="over"><div class="card"><h1 id="oh">力尽きた…</h1><p id="res"></p><p id="nr" style="color:#ffd24a"></p><button class="btn" id="ld" style="display:none">セーブ地点から再開</button><button class="btn" id="en" style="display:none">エンドレスで続ける</button><button class="btn s" id="tt">タイトルへ</button><button class="btn" id="re">もう一度</button></div></div>

{const n=1800,p=new Float32Array(n*3),c=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.acos(Math.random()*.96+.04);p.set([Math.cos(a)*Math.sin(v)*380,Math.cos(v)*380,Math.sin(a)*Math.sin(v)*380],i*3);const t=rnd(.6,1);c.set([t,t*rnd(.8,1),1],i*3)}

{const M=new THREE.MeshStandardMaterial({map:mkStone(1,3),color:0x8e86a8,roughness:.95,flatShading:true});

(async()=>{try{if(typeof claude==='undefined')return;const d=await claude.use('db'),u=await claude.use('user');if(!d||!u)return;const ref=d.doc('data/users/'+await u.id()+'/vm'),sn=await ref.get();DB=ref;P=mergeP(P,sn.exists?sn.data():null);LS.s(P);showRec();ref.set(P).catch(()=>{})}catch(_){}})();
const DEF={};for(const k in SP){const s=SP[k];DEF[k]={n:s.n,k:s.k,ds:s.ds,re:s.re,c:s.c,cd:s.cd,d:s.d}}

const crV=()=>{$('pv').textContent=$('cp').value;$('cv').textContent=($('cc').value/10).toFixed(1)};

const tell=k=>{if(cmode)return;for(const s of ST[k]||[])SQ.push(s)},busy=()=>SQ.length>0||sqT>0;
function storyTick(dt){if(sqT>0)sqT-=dt;if(sqT<=0){if(SQ.length){const s=SQ.shift(),sp=SPK[s[0]],t=s.slice(2),b=$('talk');b.innerHTML=(sp[0]?'<b>'+sp[0]+'</b>':'')+t;b.style.setProperty('--sc',hx(sp[1]));b.classList.add('on');sqT=Math.max(2.8,t.length*.15)}else $('talk').classList.remove('on')}if(state===3&&!busy())tru?victory2():victory()}
function victory(){state=4;$('en').style.display='inline-block';P.save={w:wave+1,sc:score,hp:100,en:1,tr:tru,ts:Date.now()};endRec(1);$('oh').textContent='封印、完了';$('res').innerHTML='鎖は新たに紡がれ、沈黙の王は闇の彼方へ還った。<br>声は、いまも世界を守っている。<br>得点 '+score;$('over').style.display='flex'}
$('talk').onclick=()=>{sqT=0};
function reset(){for(const e of enemies)scene.remove(e.g);enemies.length=0;for(const p of pj)scene.remove(p.m);pj.length=0;hp=100;score=0;wave=0;toSpawn=0;gap=1;told=0;SQ.length=0;sqT=0;thx=0;tru=0;$('talk').classList.remove('on');for(const k in cd)cd[k]=0;state=1;$('over').style.display='none';$('start').style.display='none'}

function update(dt){
mc.rotation.z+=dt*.05;pd1.rotation.z+=dt*.4;pd2.rotation.z-=dt*.7;
if(Math.random()<dt*30)emit(V(rnd(-30,30),rnd(.3,7),rnd(-55,6)),1,Math.random()<.5?0x8a6cff:0xffb870,.3,8,.16,-.02);
cc.lerp(ct.setHex(lastCol),Math.min(1,dt*5));orbM.material.color.copy(cc);orbG.material.color.copy(cc);plt.color.copy(cc);mc.material.color.copy(cc);
kick=Math.max(0,kick-dt*3);plt.intensity=1.2+kick*3+vol*3;orbG.scale.setScalar(.7+vol*1.2+kick*.6);
staff.position.z=-.9+kick*.12;staff.rotation.x=.25-kick*.3;staff.rotation.z=-.22+Math.sin(T*1.3)*.03;
if(an){an.getByteTimeDomainData(vb);let m=0;for(let i=0;i<512;i++)m=Math.max(m,Math.abs(vb[i]-128));vol=m/128;peak=Math.max(vol,peak-dt*.4);$('lv').firstChild.style.width=Math.min(100,vol*200)+'%'}
if(state===0)mx=Math.sin(T*.15)*.4;
cam.rotation.y+=(-mx*.25-cam.rotation.y)*Math.min(1,dt*3);cam.rotation.x+=(-my*.12-cam.rotation.x)*Math.min(1,dt*3);
cam.position.set(rnd(-1,1)*shk*.25,1.7+rnd(-1,1)*shk*.25+Math.sin(T*1.2)*.015,rnd(-1,1)*shk*.2);shk*=Math.exp(-5*dt);
fxl.intensity*=Math.exp(-5*dt);flashSky*=Math.exp(-8*dt);dawn=state>=3?Math.min(.5,dawn+dt*.06):0;skyU.fl.value=flashSky+dawn;
if(bloom)bloom.strength=1+flashSky*1.5+kick*.3;if(fp)fp.uniforms.t.value=T%10;
for(let i=sig.length-1;i>=0;i--){const s=sig[i];s.t+=dt/.8;const t=Math.min(1,s.t);s.m.scale.setScalar((s.d>0?1:.6)*(1+t*2.6));s.m.rotation.z+=s.d*dt*3;s.m.material.opacity=Math.pow(1-t,1.5)*.9;if(s.t>=1){cam.remove(s.m);s.m.geometry.dispose();s.m.material.dispose();sig.splice(i,1)}}
for(let i=rg.length-1;i>=0;i--){const r=rg[i];r.t+=dt/r.dur;const t=Math.min(1,r.t);r.m.scale.setScalar(1+r.r*(1-(1-t)*(1-t)));r.m.material.opacity=.9*(1-t);if(r.t>=1){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();rg.splice(i,1)}}
for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t+=dt/b.life;b.g.visible=b.t>.5||Math.random()>.25;b.g.children[1].material.opacity=.45*(1-Math.min(1,b.t));if(b.t>=1){scene.remove(b.g);b.g.children.forEach(c=>{c.geometry.dispose();c.material.dispose()});bolts.splice(i,1)}}
upP(dt);storyTick(dt);
if(state!==1)return;
for(const k in cd){cd[k]=Math.max(0,cd[k]-dt);SP[k].b.firstChild.style.height=(cd[k]/SP[k].cd*100)+'%'}
if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawn();toSpawn--;spawnT=Math.max(1.1,3-wave*.25)}}
else if(!enemies.length){if(!told){told=1;tell(wave)}if(!busy()){gap-=dt;if(gap<=0){wave++;told=0;gap=1.5;saveCk();if(wave>1)hp=Math.min(100,hp+12);if(wave%5===0&&(endless||wave===5)){toSpawn=3;spawnT=4;spawn(1);tell(wave>5?'c':'b');pop(wave>5?'残響の王':'沈黙の王','#c86bff')}else{toSpawn=Math.min(32,3+wave*2);spawnT=1.5;tell('w'+wave);pop('第'+wave+'波','#fff')}}}}
for(let i=pj.length-1;i>=0;i--){const p=pj[i];p.t+=dt/p.dur;if(p.tg){if(p.tg.dead)p.tg=null;else p.end.copy(p.tg.g.position)}
const t=Math.min(1,p.k==='meteor'?p.t*p.t:p.t),prev=p.m.position.clone();
p.m.position.copy(p.a).lerp(p.end,t).addScaledVector(p.side,Math.sin(Math.PI*Math.min(1,p.t))*p.amp);const ps2=p.m.position;
if(p.k==='fire'){emit(ps2,2,0xff8a2a,1.5,.5,.55,-1);fl(ps2,0xff7a2a,8)}
else if(p.k==='ice'){emit(ps2,1,0xaee8ff,.6,.45,.28);const dv=ps2.clone().sub(prev);if(dv.lengthSq()>1e-6)p.m.lookAt(ps2.clone().add(dv))}
else{emit(ps2,6,0xff5a1a,4,1,1.4,-1);emit(ps2,3,0xffd080,3,.6,.9);p.m.rotation.x+=dt*2;fl(ps2,0xff6a2a,30)}
if(p.t>=1){impact(p);scene.remove(p.m);pj.splice(i,1)}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],p=e.g.position,dist=Math.max(.01,Math.hypot(p.x,p.z)),k=(e.boss&&dist<6?0:e.sp*(e.fz>0?.25:1))*dt/dist;e.fz-=dt;e.ht-=dt;if(e.boss){e.rot-=dt;if(e.rot<=0){e.rot=7;e.el=EL[(EL.indexOf(e.el)+1)%3];const c=SP[e.el].c;e.mats.forEach(m=>m.color.setHex(c));e.body.material.emissive.setHex(c);ring(p.clone(),c,7,.7);emit(p,30,c,9,.8,.7);if(!e.said){e.said=1;tell('x')}}}
p.x-=p.x*k;p.z-=p.z*k;p.y=e.y0+Math.sin(T*2+e.ph)*.5;
e.body.rotation.y+=dt;e.body.rotation.x+=dt*.6;e.ring.rotation.z+=dt*2;e.orb.rotation.y+=dt*1.5;e.core.scale.setScalar(1+Math.sin(T*6+e.ph)*.15);
e.body.material.emissiveIntensity=.3+Math.max(0,e.ht)*8;e.body.material.color.setHex(e.fz>0?0x3a5a80:0x1a1426);
e.bar.quaternion.copy(cam.quaternion);const r=Math.max(.001,e.hp/e.max);e.fl.scale.x=r;e.fl.position.x=-(1-r);
if(dist<(e.boss?7:3.4)){if(e.boss){e.atk-=dt;if(e.atk>0)continue;e.atk=1.3}hp-=e.d;shake(.7);$('red').style.opacity=.9;setTimeout(()=>$('red').style.opacity=0,70);boom(p.clone(),0xff2040,1);if(!e.boss)rm(e);if(hp<=0)gameOver()}}
$('hp').style.width=Math.max(0,hp)+'%';$('wv').textContent=wave;$('sc').textContent=score}

function begin(){ac=ac||new AC();if(ac.resume)ac.resume();reset();P.rec.pl++;cmode=cwant;cwant=0;if(cmode){endless=true;toast('✦ クリエイトモード')}useLoadout();if(wantLoad){wantLoad=0;applySave()}}

(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);T+=dt;update(dt);if(comp)comp.render();else renderer.render(scene,cam)})();
