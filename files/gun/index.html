 show(`<h1>CPU STRIKE</h1><div class='sub'>◆ エペ式 一本勝負 FPS ◆</div><div class='mn'><button class='cta' onclick='begin(0)'>ソロ（vs CPU）</button><button class='cta' onclick='begin(1)'>タッグ（CPU相棒）</button><button class='cta' onclick='begin(2)'>CPU対戦（観戦）</button><button onclick='lobby()'>オンライン タッグ</button><button onclick='openMatch()'>試合設定</button><button onclick='openSet()'>設定</button></div><div class='keys'><b>WASD</b><span>移動</span><b>SHIFT</b><span>ダッシュ</span><b>MOUSE</b><span>視点（矢印も可）</span><b>CLICK</b><span>撃つ</span><b>R</b><span>リロード</span><b>E</b><span>レーダー（撃てない）</span><b>Q</b><span>ボム（壁を壊せる）</span><b>F</b><span>フリーカメラ</span></div><p class='hint'>🎮 コントローラー: 左スティック=移動 / 右スティック=視点 / RT=撃つ / LB=ボム / X=リロード / Y=レーダー / L3・A=ダッシュ / BACK=フリーカメラ / START=ポーズ。メニューは十字キーで選択、Aで決定。</p><p class='hint'>銃は3発で撃破（HPは試合設定で変更可）。ボムは1.5秒後に爆発、爆心地ほど大ダメージ。CPUもレーダーや銃声で位置を探り、ボムも投げてきます。個性（ミス多め／達人／最短で来る／遅れて来る）は毎ラウンドランダムです。</p>`)
}
function begin(m){mode=['solo','tag','cvc'][m];online=0;ishost=1;useMap();reset();if(mode=='cvc'){FC.x=N/2;FC.y=N/2;FC.z=Math.max(20,N*.67);FC.a=.8;FC.p=-1.3}go()}
// ---- マップ切替（試合開始時に設定どおり再生成。オンラインはホストの設定を共有） ----
let MAPP=[51,5,20261024];
function applyMap(p){genMap(p[0],p[1],p[2]);buildScene();MAPP=[p[0],p[1],p[2]]}
function useMap(){const n=(+SET.mz|0)||51,cx=Math.max(0,Math.min(10,+SET.mc)),ms=+SET.ms|0,
 seed=ms==1?20261024:ms?((20261024+ms*104729)>>>0):(Math.random()*4294967295>>>0);applyMap([n%2?n:n+1,isNaN(cx)?5:cx,seed])}
// ---- Supabase Realtime（テーブル不要：Broadcast + Presence のみ使用） ----
/* ★ Supabase設定（ここに直接書く）: Project Settings > API の「Project URL」と「anon / publishable キー」
   ※ service_role キーは絶対に入れない。空のままならオンラインは使えません。 */
const SB_URL='https://hiflevbinrxqbmgdbqsn.supabase.co',SB_KEY='sb_publishable_d1OkE0uQWtxtvHNH0F_gTg_yVIZd5qs';
const SBC={url:SB_URL.trim().replace(/\/+$/,''),key:SB_KEY.trim()};let sbCli=null,sbK='';
const sbOn=()=>!!(SBC.url&&SBC.key);
function sbLoad(){return window.supabase?Promise.resolve():new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=ok;s.onerror=()=>ng(new Error('supabase-js を読み込めません'));document.head.appendChild(s)})}
async function sbJoin(name){
 await sbLoad();
 const k=SBC.url+'|'+SBC.key;
 if(!sbCli||sbK!=k){sbCli=window.supabase.createClient(SBC.url,SBC.key,{realtime:{params:{eventsPerSecond:30}}});sbK=k}
 const id='p'+Math.random().toString(36).slice(2,10),st={};let list=[],me={};
 const ch=sbCli.channel(name,{config:{broadcast:{self:false},presence:{key:id}}});
 ch.on('presence',{event:'sync'},()=>{list=Object.keys(ch.presenceState())});
 let rtt=null,rx=Date.now(),pt=0;
 ch.on('broadcast',{event:'s'},({payload:m})=>{if(m&&m.id&&m.id!==id){st[m.id]=m.o;rx=Date.now()}});
 ch.on('broadcast',{event:'ping'},({payload:m})=>{if(m&&m.id!==id){rx=Date.now();ch.send({type:'broadcast',event:'pong',payload:{to:m.id,t:m.t}})}});
 ch.on('broadcast',{event:'pong'},({payload:m})=>{if(m&&m.to===id){rtt=Date.now()-m.t;rx=Date.now()}});
 await new Promise((ok,ng)=>{const t=setTimeout(()=>ng(new Error('接続タイムアウト')),8000);
  ch.subscribe(s=>{if(s==='SUBSCRIBED'){clearTimeout(t);ok()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){clearTimeout(t);ng(new Error('接続失敗: '+s))}})});
 await ch.track({t:Date.now()});list=Object.keys(ch.presenceState());
 pt=setInterval(()=>{if(ch.state==='joined')ch.send({type:'broadcast',event:'ping',payload:{id,t:Date.now()}})},2000);
 // 既存コードが使う NR インターフェース（peers / presence / leave）に合わせる
 return{
  peers(){const a=[{peer:id,isMe:true,sameTab:true,presence:me}];for(const p of list)if(p!==id)a.push({peer:p,isMe:false,sameTab:false,presence:st[p]||{}});return a},
  presence(o){me=o;return ch.send({type:'broadcast',event:'s',payload:{id,o}})},
  stat(){return{joined:ch.state==='joined',n:list.length,rtt:list.length<2?null:rtt,age:Date.now()-rx}},
  leave(){clearInterval(pt);return sbCli.removeChannel(ch)}}
}
async function netJoin(name){
 if(sbOn())return sbJoin(name);
 if(window.claude&&claude.use){const Rm=await claude.use('room');return Rm.join(name)}
 throw new Error('Supabase未設定')
}
let NERR='',NB='';
const dot=(c,t)=>`<span style="color:var(${c})">●</span> ${t}`;
// 接続中のオンライン状態（ロビー待機・試合中のHUD共通）
function netBadge(){
 if(!NR)return dot('--ac','OFFLINE');
 if(!NR.stat)return dot('--ok','ONLINE');
 const s=NR.stat();
 if(!s.joined)return dot('--ac','切断（再接続中…）');
 if(s.n<2)return dot('--yl','相手なし');
 if(s.rtt==null)return dot('--yl','確認中…');
 if(s.age>4000)return dot('--ac','応答なし');
 return dot(s.rtt<150?'--ok':s.rtt<400?'--yl':'--ac',`ONLINE ${s.rtt}ms`)}
// ロビーでの接続確認（試しにルームへ入って即抜ける）
async function netCheck(){const el=$('nst');if(!el)return;
 if(!sbOn()){el.innerHTML=window.claude&&claude.use?dot('--ok','Claude内蔵ルーム'):dot('--ac','未設定（ファイル内の SB_URL / SB_KEY に記入）');return}
 el.innerHTML=dot('--yl','接続確認中…');
 try{await sbLoad();const t0=performance.now(),n=await sbJoin('cs-ping-'+Math.random().toString(36).slice(2,8)),ms=Math.round(performance.now()-t0);await n.leave();
  if($('nst')===el)el.innerHTML=dot('--ok',`Supabase ONLINE（${ms}ms）`)}
 catch(e){if($('nst')===el)el.innerHTML=dot('--ac','Supabase OFFLINE：'+String(e&&e.message||e).replace(/[<>&]/g,''))}}
function lobby(){show(`<h1>オンライン</h1><p>友達も同じページを開き、同じコードを入力。2人で組んでCPUと戦います（敵の数・レベル・HP・ボム数はホストの試合設定）。</p><p class='hint'>接続状態: <span id='nst'></span> <button onclick='netCheck()' style='font-size:.8em;padding:.1em .6em'>再確認</button></p><div><button class='cta' onclick='joinRoom(1)'>部屋を作る</button></div><div><input id='cd' maxlength='8' placeholder='コード' style='font:inherit;padding:.4em;width:7em;text-align:center'> <button onclick='joinRoom(0)'>参加する</button></div><button onclick='menu()'>戻る</button>`);netCheck()}
async function joinRoom(h){
 const c=h?Math.random().toString(36).slice(2,6):($('cd').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!c)return;
 show('<h1>接続中…</h1>');
 NERR='';try{NR=await netJoin('cs-'+c)}catch(e){NR=null;NERR=String(e&&e.message||e)}
 if(!NR){show(`<h1>接続できません</h1><p>${sbOn()?'Supabaseに接続できませんでした。URL/キー、Realtimeが有効か、ネットワークを確認してください。':'オンラインを使うには、ファイル内の SB_URL / SB_KEY にSupabaseの情報を記入してください。'}</p><p class='hint'>${NERR.replace(/[<>&]/g,'')}</p><button class='cta' onclick='menu()'>戻る</button>`);return}
 code=c;ishost=h;
 show(`<h1>${h?'コード '+c:'待機中'}</h1><p id='lc'></p>${h?`<button class='cta' id='sb' onclick='goOnline()' disabled>開始</button> `:''}<button onclick='menu()'>やめる</button>`);
 lt=setInterval(()=>{const ps=NR.peers(),n=ps.length;$('lc').innerHTML=`参加中 ${n}人`+(h?(n<2?' ／ 友達を待っています…':''):'（ホストの開始待ち）')+'<br>'+netBadge();if(h)$('sb').disabled=n<2;
  const hp=ps.find(p=>!p.isMe&&p.presence.go);if(!h&&hp){clearInterval(lt);goOnline(hp.presence.mp)}},400)
}
function goOnline(mp){clearInterval(lt);mode='tag';online=1;if(ishost)useMap();else if(mp)applyMap(mp);reset();go()}
useMap();menu();

applyScan();

(function loop(n){const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;FD=dt;T+=dt;gpPoll(dt);if(st==1)update(dt);render();hud();requestAnimationFrame(loop)})(last);
