<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPU STRIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f4ecd0;--ac:#e8382a;--ok:#3cd84c;--yl:#fcd83c;--pn:#34343e;--hi:#8c8c9c;--lo:#0a0a10;--f:'DotGothic16','MS Gothic','Osaka-Mono',monospace;--fh:'Press Start 2P','DotGothic16',monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:400 clamp(12px,2vw,18px)/1.45 var(--f);overflow:hidden;user-select:none;-webkit-font-smoothing:none;font-smooth:never}
#w{position:relative;width:100%;height:100%;--scan:.5}
#w::after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,calc(var(--scan)*.5)) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 calc(var(--scan)*150px) rgba(0,0,0,.65)}
/* 3D画面と同じ16:9の枠。HUDはこの枠の内側に収める */
#fr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:16/9;width:min(100vw,177.78vh);container-type:inline-size;overflow:hidden;background:#000}
@supports (width:1dvh){#fr{width:min(100vw,177.78dvh)}}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}#c{background:transparent}#g3{background:#000}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px 0 #000;font-size:clamp(8px,1.75cqw,18px);line-height:1.4}
#hud>*{position:absolute}
.px{background:var(--pn);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000}
#top{left:14px;top:12px;padding:3px 10px;color:var(--yl);font-size:.9em;max-width:calc(100% - 40px)}
#net{right:14px;top:calc(12px + 2.6em);padding:3px 10px;font-size:.8em;display:none;white-space:nowrap}
#fc{left:50%;top:calc(12px + 2.6em);transform:translateX(-50%);padding:3px 10px;color:#7cf0ff;font-size:.85em;display:none;white-space:nowrap;max-width:calc(100% - 20px)}
#bm{left:50%;bottom:16px;transform:translateX(-50%);padding:3px 10px;color:var(--fg);font-size:.8em;white-space:nowrap}
#mid{left:0;right:0;top:28%;text-align:center;font:400 clamp(10px,3.1cqw,34px)/1.3 var(--fh);color:var(--yl);text-shadow:4px 4px 0 #b02818,7px 7px 0 #000}
#rt{right:14px;bottom:58px;font:400 .75em var(--fh);color:var(--ac);animation:bl .5s steps(1) infinite alternate}@keyframes bl{to{opacity:0}}
#bar{left:14px;bottom:16px;width:32%;height:22px;background:#000;border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 2px #000}
#bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,#000 8px 10px)}
#bar i{position:absolute;left:0;top:0;height:100%;display:block}
#gh{background:#f8f8f8;opacity:.6;width:100%}
#hp{background:var(--ok);width:100%}
#bar b{position:absolute;left:-3px;bottom:calc(100% + 9px);font:400 .8em var(--fh);color:var(--yl);letter-spacing:.06em;font-weight:400}
#bar.lo #hp{animation:lo .35s steps(1) infinite alternate}@keyframes lo{to{filter:brightness(1.9)}}
#am{right:14px;bottom:14px;display:flex;gap:3px;align-items:flex-end;padding:5px 7px;background:var(--pn);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000}
.bu{display:block;width:7px;height:22px;background:#e8b848;box-shadow:inset -2px 0 #a07818,0 0 0 1px #000;position:relative;transition:none}
.bu::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:#d0583a;box-shadow:inset -2px 0 #802c18}
.bu.off{filter:grayscale(1) brightness(.3);transform:translateY(3px)}
.bu.ej{animation:ej .3s steps(4)}@keyframes ej{from{transform:translateY(-14px);filter:none}}
.bu.ld{animation:ld .25s steps(3)}@keyframes ld{from{transform:translateY(10px);opacity:0}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:rgba(0,0,0,.86);text-align:center;cursor:pointer;padding:16px;overflow:auto}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{margin:0;font:400 clamp(20px,4.6vw,44px)/1.3 var(--fh);letter-spacing:.04em;color:var(--yl);text-shadow:4px 4px 0 #b02818,8px 8px 0 #000}
#ov p{margin:0;max-width:34em;color:var(--fg)}
#ov .sub{color:var(--ok);letter-spacing:.25em}
#ov .hint{max-width:34em;color:#9a9ab0;font-size:.85em}
#ov.lite{background:rgba(0,0,0,.3)}
.mn{display:grid;gap:8px;width:min(360px,84vw)}
.mn button{padding-top:.3em;padding-bottom:.3em;display:block;width:100%;text-align:left;padding-left:2.4em;position:relative}
.mn button:hover::before,.mn button:focus::before{content:"▶";position:absolute;left:.8em}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 10px;align-items:center;text-align:left;padding:8px 12px;font-size:.78em;background:var(--pn);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 2px #000;max-width:min(680px,92vw)}
.keys b{font-weight:400;color:#000;background:var(--yl);padding:0 6px;text-align:center;box-shadow:2px 2px 0 #000;white-space:nowrap}
.set{display:grid;gap:9px;width:min(440px,88vw);text-align:left;padding:16px 18px;background:var(--pn);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 2px #000}
.set label{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.set output{color:var(--yl)}
.set input{grid-column:1/3;width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:#000;border:2px solid var(--hi);border-radius:0;margin:0;cursor:pointer}
input[type=range]:focus{outline:2px solid var(--yl);outline-offset:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--yl);border:2px solid #000;border-radius:0;box-shadow:inset -3px -3px 0 #a08818}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--yl);border:2px solid #000;border-radius:0}
input:not([type]){background:#000;color:var(--yl);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);border-radius:0;text-transform:uppercase;outline:none}
button{font:inherit;color:var(--fg);background:var(--pn);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:0;box-shadow:0 0 0 2px #000;padding:.5em 1.3em;cursor:pointer;letter-spacing:.08em}
button:hover,button:focus{background:var(--yl);color:#000;outline:none}
button:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
button.cta{background:var(--ac);color:#fff}
button.cta:hover,button.cta:focus{background:var(--yl);color:#000}
/* ダメージ集計: HUD(#dm) / ラウンド終了パネル(#rr) / 結果表(.tb) */
.dg{display:none;grid-template-columns:auto auto auto;align-items:baseline;white-space:nowrap}
.dg .h{color:#b8b8c8;text-align:right}
.dg .d,.dg .t,.tb .n{text-align:right;font-family:var(--fh);font-size:.85em;font-variant-numeric:tabular-nums}
.dg .d,.tb .d{color:var(--ok)}
.dg .t,.tb .t{color:#ff7a6a}
#dm{left:14px;top:calc(12px + 2.6em);padding:4px 10px;gap:1px 1em;font-size:.8em}
#rr{left:50%;top:47%;transform:translateX(-50%);padding:8px 18px;gap:4px 1.6em;font-size:1.05em}
.tb{display:grid;grid-template-columns:auto auto auto auto;gap:3px 1.6em;align-items:baseline;text-align:left;padding:10px 16px;background:var(--pn);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 2px #000;max-height:38vh;overflow:auto;max-width:92vw}
.tb .h{color:#b8b8c8;font-size:.8em}
.tb .s{border-top:2px solid var(--hi);padding-top:5px;margin-top:3px}
/* HP: めくれるフリップカード（上半分が倒れ、下半分が起き上がる） */
#bar #hv{left:-3px;bottom:calc(100% + 9px);display:flex;align-items:flex-end;gap:.7em;font:400 1em var(--fh);letter-spacing:0;color:var(--yl)}
#hv .hl{font-size:.8em;padding-bottom:.35em;letter-spacing:.06em}
#hv .hc{display:flex;gap:3px}
#hv .hw{display:none;font-size:.7em;padding:.4em .6em;margin-bottom:.4em;background:var(--ac);color:#fff;box-shadow:2px 2px 0 #000;animation:bl .35s steps(1) infinite alternate}
#hv.lo .hw{display:block}
.fd{position:relative;display:block;width:1.15em;height:1.8em;font:400 1.3em/1 var(--fh);color:var(--ok);box-shadow:0 0 0 2px #000,0 3px 0 2px #000}
#hv.mid .fd{color:var(--yl)}
#hv.lo .fd,#hv.dead .fd{color:#ff6a5a}
.fd::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#000;z-index:6}
.fd .fh{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden}
.fd .fh>span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;text-shadow:2px 2px 0 #000}
.fd .fu,.fd .ft{top:0;background:linear-gradient(#3c3c4a,#262631)}
.fd .fl,.fd .fb{bottom:0;background:linear-gradient(#1a1a22,#2c2c38)}
.fd .fu>span,.fd .ft>span{top:0}
.fd .fl>span,.fd .fb>span{bottom:0}
.fd .fu,.fd .fl{z-index:1}
.fd .ft,.fd .fb{z-index:3;visibility:hidden}
.fd .ft{transform-origin:50% 100%}
.fd .fb{transform-origin:50% 0}
.fd.go .ft,.fd.go .fb{visibility:visible;animation-fill-mode:both}
.fd.go .ft{animation:ftf .15s cubic-bezier(.55,.05,.9,.55) var(--dl,0s)}
.fd.go .fb{animation:fbf .24s cubic-bezier(.2,.8,.35,1.4) calc(var(--dl,0s) + .15s)}
@keyframes ftf{from{transform:perspective(240px) rotateX(0);filter:brightness(1)}to{transform:perspective(240px) rotateX(-90deg);filter:brightness(.5)}}
@keyframes fbf{from{transform:perspective(240px) rotateX(90deg);filter:brightness(.5)}to{transform:perspective(240px) rotateX(0);filter:brightness(1)}}
#hv.hurt .hc{animation:hsk .36s steps(1)}
@keyframes hsk{0%{transform:translate(-5px,2px)}17%{transform:translate(5px,-2px)}34%{transform:translate(-4px,0)}51%{transform:translate(3px,2px)}68%{transform:translate(-2px,-1px)}85%{transform:translate(1px,0)}100%{transform:none}}
/* HP警告: 画面端の赤い脈動 */
#vg{inset:0;opacity:0;box-shadow:inset 0 0 9cqw 1cqw rgba(232,56,42,.8)}
#vg.on{animation:vgp .95s ease-in-out infinite}
@keyframes vgp{0%,100%{opacity:.12}50%{opacity:1}}
/* ダメージポップ: カードがめくれて現れ、浮き上がって裏返り消える */
#fx{inset:0;overflow:hidden}
.pp{position:absolute;left:50%;top:50%;padding:.3em .6em;font:400 1.35em/1 var(--fh);white-space:nowrap;background:linear-gradient(#3c3c4a 50%,#262631 50%);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000;text-shadow:2px 2px 0 #000;animation:ppf 1.1s both;will-change:transform}
.pp.d{color:var(--yl)}
.pp.k{color:#ff9a3c;font-size:1.7em}
.pp.t{color:#ff6a5a;left:calc(14px + 4.2em);top:auto;bottom:calc(53px + 4.5em)}
@keyframes ppf{
0%{opacity:0;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px))) perspective(320px) rotateX(-95deg) scale(.7)}
12%{opacity:1;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px) - 12px)) perspective(320px) rotateX(14deg) scale(1.18)}
22%{transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px) - 16px)) perspective(320px) rotateX(0) scale(1)}
70%{opacity:1;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px) - 38px)) perspective(320px) rotateX(0) scale(1)}
100%{opacity:0;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px) - 58px)) perspective(320px) rotateX(92deg) scale(.9)}}
@keyframes ppr{0%,100%{opacity:0;transform:translate(-50%,-50%)}15%,80%{opacity:1;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){.pp{animation-name:ppr}#vg.on{animation:none;opacity:.6}.fd.go .ft,.fd.go .fb{animation:none}#hv.hurt .hc{animation:none}}
#cr{left:50%;bottom:19%;transform:translateX(-50%);padding:5px 14px;font-size:.85em;white-space:nowrap;display:none;text-align:center;line-height:1.7}
.ck{background:var(--fg);color:#000;padding:0 .4em;margin:0 .15em;box-shadow:2px 2px 0 #000}
.cs{font:400 1.5em var(--fh);color:var(--ok)}
.cw{color:#ff6a5a}
.pp.c{color:#ffd23c}.pp.h{color:#6aff8a}
#wn{right:14px;bottom:calc(58px + 2.2em);padding:3px 10px;font-size:.8em;white-space:nowrap;color:var(--yl)}
.coin{color:var(--yl);font-family:var(--fh);font-size:.9em}
.arm{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;text-align:left;padding:10px 14px;background:var(--pn);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 2px #000;max-width:min(760px,94vw);max-height:56vh;overflow:auto;font-size:.82em}
.arm .an{color:var(--fg);white-space:nowrap}.arm .as{color:#b8b8c8;font-size:.9em}
.arm button:disabled{opacity:.45}
</style></head><body>
<div id="w"><div id="fr"><canvas id="g3"></canvas><canvas id="c"></canvas>
<div id="hud"><div id="vg"></div><div id="top" class="px"></div><div id="net" class="px"></div><div id="fc" class="px"></div><div id="mid"></div><div id="bar"><i id="gh"></i><i id="hp"></i><b id="hv"></b></div><div id="rt"></div><div id="am"></div><div id="bm" class="px"></div><div id="wn" class="px"></div><div id="dm" class="px dg"></div><div id="rr" class="px dg"></div><div id="fx"></div><div id="cr" class="px"></div></div></div>
<div id="ov"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=640,H=360,R=W/480,CFG={fov:90,sens:1,spd:1,vol:.7,dif:1,scan:.5,rnd:1},RA=new Float32Array(W);let FOV,PD,FD=.016;
C.width=W;C.height=H;try{Object.assign(CFG,JSON.parse(localStorage.cfg))}catch(e){}
function setFov(){FOV=CFG.fov*Math.PI/180;PD=W/2/Math.tan(FOV/2);for(let i=0;i<W;i++)RA[i]=Math.atan((i+.5-W/2)/PD)}setFov();
let N=51,M=[];let sd=20261024;const rn=()=>{sd=sd*1664525+1013904223>>>0;return sd/4294967296};
// マップ生成: n=サイズ(奇数) cx=複雑さ(0=広場〜10=完全迷路, 5=従来) seed=乱数の種
function genMaze(n,cx,seed){N=n;sd=seed>>>0;M=Array.from({length:N},()=>Array(N).fill(1));
{const st=[[1,1]];M[1][1]=0;while(st.length){const[x,y]=st[st.length-1],d=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>x+a>0&&y+b>0&&x+a<N-1&&y+b<N-1&&M[y+b][x+a]);if(!d.length){st.pop();continue}const[a,b]=d[rn()*d.length|0];M[y+b/2][x+a/2]=0;M[y+b][x+a]=0;st.push([x+a,y+b])}
 for(let i=0,L=N*N*(10-cx)/30;i<L;i++){const x=1+(rn()*(N-2)|0),y=1+(rn()*(N-2)|0);if(M[y][x]&&((x&1)!=(y&1)))M[y][x]=0}
 if(cx<5)for(let y=2;y<N-2;y+=2)for(let x=2;x<N-2;x+=2)if(M[y][x]&&(!M[y-1][x]||!M[y+1][x]||!M[y][x-1]||!M[y][x+1])&&rn()<(5-cx)*.12)M[y][x]=0;
 for(const[cx,cy,r]of[[2,2,1],[N-3,N-3,1],[(N>>1)|0,(N>>1)|0,3],[(N>>2)|1,(N>>1)|0,1],[(N*3>>2)|1,(N>>1)|0,1],[(N>>1)|0,(N>>2)|1,1],[(N>>1)|0,(N*3>>2)|1,1]])for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)M[y][x]=0}}
// ---- マップ プリセット（町・闘技場・倉庫・森）---- seed固定のrn()だけで生成するので、オンラインでも全員同じ地形になる
const PRN=['迷路(従来)','町(昼)','町(夜)','闘技場','倉庫','森'];
let PR=0,MT=[],MC=[],FK=[];// MT=壁の種類 MC=色番号 FK=床の種類
const hs=(a,b)=>((a*73856093)^(b*19349663))>>>0,ri=n=>rn()*n|0,mkA=()=>Array.from({length:N},()=>new Uint8Array(N));
function putW(x,y,t,c){if(x>0&&y>0&&x<N-1&&y<N-1){M[y][x]=1;MT[y][x]=t;MC[y][x]=c|0}}
function putO(x,y,f){if(x>0&&y>0&&x<N-1&&y<N-1){M[y][x]=0;MT[y][x]=1;FK[y][x]=f|0}}
function rectW(x0,y0,w,h,t,c){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)putW(x,y,t,c)}
function rectO(x0,y0,w,h,f){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)putO(x,y,f)}
// 外周を壁にし、中央から到達できない空きセルを壁で埋める（敵CPUが行けない場所を作らない）
function finishMap(bt,fillT){
 for(let i=0;i<N;i++)for(const[x,y]of[[i,0],[i,N-1],[0,i],[N-1,i]]){M[y][x]=1;MT[y][x]=bt;MC[y][x]=hs(x,y)&7}
 let sx=N>>1,sy=N>>1,f=0;
 for(let r=0;r<N&&!f;r++)for(let y=sy-r;y<=sy+r&&!f;y++)for(let x=sx-r;x<=sx+r;x++)if(x>0&&y>0&&x<N-1&&y<N-1&&!M[y][x]){sx=x;sy=y;f=1;break}
 const D=bfsFrom(sx,sy);for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!M[y][x]&&D[y*N+x]<0)putW(x,y,fillT,hs(x,y)&7)}
// 壁の種類: 1煉瓦 2〜4建物(階数) 5生け垣 6石 7木箱 8棚 9木 10石柱 11車 12コンクリ 13コンテナ
function genTown(){
 const S=4,B=5,P=S+B,k=Math.max(1,((N-2-S)/P)|0),used=k*P+S,sh=1+((N-2-used)>>1),inter=(x,y)=>(x-sh)%P<S&&(y-sh)%P<S;
 for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)putW(x,y,2+hs(x>>2,y>>2)%3,hs(x>>2,y>>2)>>3&7);
 for(let y=sh;y<sh+used;y++)for(let x=sh;x<sh+used;x++){const px=(x-sh)%P,py=(y-sh)%P,ix=px<S,iy=py<S;
  if(ix&&iy)putO(x,y,(px==0||px==S-1)&&(py==0||py==S-1)?2:1);
  else if(iy)putO(x,y,py==0||py==S-1?2:1);
  else if(ix)putO(x,y,px==0||px==S-1?2:1)}
 const cb=k>>1;
 for(let bj=0;bj<k;bj++)for(let bi=0;bi<k;bi++){const bx=sh+S+bi*P,by=sh+S+bj*P,r=rn(),col=ri(8);
  if(bi==cb&&bj==cb&&k>=3){rectO(bx,by,B,B,3);rectW(bx+1,by+1,3,3,6,0);for(const[a,b]of[[0,0],[B-1,0],[0,B-1],[B-1,B-1]])putW(bx+a,by+b,5,0)}

  peers(){const a=[{peer:id,isMe:true,sameTab:true,presence:me}];for(const p of list)if(p!==id)a.push({peer:p,isMe:false,sameTab:false,presence:st[p]||{}});return a},
  presence(o){me=o;return ch.send({type:'broadcast',event:'s',payload:{id,o}})},
  stat(){return{joined:ch.state==='joined',n:list.length,rtt:list.length<2?null:rtt,age:Date.now()-rx}},
  leave(){clearInterval(pt);return sbCli.removeChannel(ch)}}
}
async function netJoin(name){
 if(sbOn())return sbJoin(name);
 if(window.claude&&claude.use){const Rm=await claude.use('room');return Rm.join(name)}
 throw new Error('Supabase未設定')
}
let NERR='',NB='';
const dot=(c,t)=>`<span style="color:var(${c})">●</span> ${t}`;
// 接続中のオンライン状態（ロビー待機・試合中のHUD共通）
function netBadge(){
 if(!NR)return dot('--ac','OFFLINE');
 if(!NR.stat)return dot('--ok','ONLINE');
 const s=NR.stat();
 if(!s.joined)return dot('--ac','切断（再接続中…）');
 if(s.n<2)return dot('--yl','相手なし');
 if(s.rtt==null)return dot('--yl','確認中…');
 if(s.age>4000)return dot('--ac','応答なし');
 return dot(s.rtt<150?'--ok':s.rtt<400?'--yl':'--ac',`ONLINE ${s.rtt}ms`)}
// ロビーでの接続確認（試しにルームへ入って即抜ける）
async function netCheck(){const el=$('nst');if(!el)return;
 if(!sbOn()){el.innerHTML=window.claude&&claude.use?dot('--ok','Claude内蔵ルーム'):dot('--ac','未設定（ファイル内の SB_URL / SB_KEY に記入）');return}
 el.innerHTML=dot('--yl','接続確認中…');
 try{await sbLoad();const t0=performance.now(),n=await sbJoin('cs-ping-'+Math.random().toString(36).slice(2,8)),ms=Math.round(performance.now()-t0);await n.leave();
  if($('nst')===el)el.innerHTML=dot('--ok',`Supabase ONLINE（${ms}ms）`)}
 catch(e){if($('nst')===el)el.innerHTML=dot('--ac','Supabase OFFLINE：'+String(e&&e.message||e).replace(/[<>&]/g,''))}}
function lobby(){show(`<h1>オンライン</h1><p>友達も同じページを開き、同じコードを入力。2人で組んでCPUと戦います（敵の数・レベル・HP・ボム数はホストの試合設定／銃はハンドガン固定）。</p><p class='hint'>接続状態: <span id='nst'></span> <button onclick='netCheck()' style='font-size:.8em;padding:.1em .6em'>再確認</button></p><div><button class='cta' onclick='joinRoom(1)'>部屋を作る</button></div><div><input id='cd' maxlength='8' placeholder='コード' style='font:inherit;padding:.4em;width:7em;text-align:center'> <button onclick='joinRoom(0)'>参加する</button></div><button onclick='menu()'>戻る</button>`);netCheck()}
async function joinRoom(h){
 const c=h?Math.random().toString(36).slice(2,6):($('cd').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!c)return;
 show('<h1>接続中…</h1>');
 NERR='';try{NR=await netJoin('cs-'+c)}catch(e){NR=null;NERR=String(e&&e.message||e)}
 if(!NR){show(`<h1>接続できません</h1><p>${sbOn()?'Supabaseに接続できませんでした。URL/キー、Realtimeが有効か、ネットワークを確認してください。':'オンラインを使うには、ファイル内の SB_URL / SB_KEY にSupabaseの情報を記入してください。'}</p><p class='hint'>${NERR.replace(/[<>&]/g,'')}</p><button class='cta' onclick='menu()'>戻る</button>`);return}
 code=c;ishost=h;
 show(`<h1>${h?'コード '+c:'待機中'}</h1><p id='lc'></p>${h?`<button class='cta' id='sb' onclick='goOnline()' disabled>開始</button> `:''}<button onclick='menu()'>やめる</button>`);
 lt=setInterval(()=>{const ps=NR.peers(),n=ps.length;$('lc').innerHTML=`参加中 ${n}人`+(h?(n<2?' ／ 友達を待っています…':''):'（ホストの開始待ち）')+'<br>'+netBadge();if(h)$('sb').disabled=n<2;
  const hp=ps.find(p=>!p.isMe&&p.presence.go);if(!h&&hp){clearInterval(lt);goOnline(hp.presence.mp)}},400)
}
function goOnline(mp){clearInterval(lt);mode='tag';online=1;CW=0;if(ishost)useMap();else if(mp)applyMap(mp);reset();go()}
useMap();menu();

reset();
applyScan();
let last=performance.now();
// フレームレート非依存: 全ての動きは実経過時間(dt)で計算（60Hz/144Hzでも同じ速さ）
(function loop(n){const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;FD=dt;T+=dt;gpPoll(dt);if(st==1)update(dt);render();hud();requestAnimationFrame(loop)})(last);
</script></body></html>
