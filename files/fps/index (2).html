<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦場AI FPS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Noto Sans JP",sans-serif;color:#e9e6d4;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;color:#e0a526}
  .hud{position:fixed;left:12px;right:12px;top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;pointer-events:none;font-size:14px;text-shadow:0 1px 3px #000}
  .box{background:rgba(20,26,18,.72);border:1px solid #3a4a2e;border-radius:10px;padding:7px 11px;display:flex;gap:8px;align-items:center}
  .bar{width:150px;height:10px;background:#0c100a;border-radius:6px;overflow:hidden;border:1px solid #3a4a2e}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4fa654,#7bc47f);width:100%;transition:width .15s}
  .num{font-family:Orbitron,sans-serif;color:#e0a526;font-size:16px}
  #cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
  #cross::before{left:12px;top:0;width:2px;height:26px}
  #cross::after{top:12px;left:0;height:2px;width:26px}
  #cross.hit::before,#cross.hit::after{background:#e0584f}
  #dmg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 55%,rgba(200,30,30,.55));opacity:0}
  .ov{position:fixed;inset:0;background:rgba(8,12,7,.8);display:flex;align-items:center;justify-content:center;padding:16px}
  .ov.hide{display:none}
  .card{background:#1f2719;border:1px solid #3a4a2e;border-radius:14px;padding:22px 24px;max-width:520px;width:100%;box-shadow:0 14px 50px rgba(0,0,0,.6)}
  .card h1{font-family:Orbitron,sans-serif;font-weight:900;margin:0 0 8px;font-size:26px;letter-spacing:.06em}
  .card h1 span{color:#e0a526}
  .card p{color:#a9b08f;line-height:1.7;font-size:14px;margin:8px 0 14px}
  .help{font-size:13px;color:#a9b08f;line-height:1.9;margin-bottom:16px}
  .help .material-symbols-outlined{margin-right:4px}
  .result{font-size:15px;line-height:1.7;background:#0c100a;border:1px solid #3a4a2e;border-radius:8px;padding:10px 12px;margin:8px 0}
  button{font:inherit;font-weight:700;background:#e0a526;color:#1a1406;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button .material-symbols-outlined{color:#1a1406}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="dmg"></div>

<div class="hud">
  <div class="box"><span class="material-symbols-outlined">favorite</span><div class="bar"><i id="hpBar"></i></div><b id="hpTxt" class="num">100</b></div>
  <div class="box"><span class="material-symbols-outlined">timer</span><b id="time" class="num">2:00</b></div>
  <div class="box"><span class="material-symbols-outlined">target</span>キル <b id="kills" class="num">0</b>／デス <b id="deaths" class="num">0</b></div>
  <div class="box"><span class="material-symbols-outlined">psychology</span>敵AI 世代 <b id="gen" class="num">1</b></div>
  <div class="box"><span class="material-symbols-outlined">bolt</span><b id="ammo" class="num">30</b>／30</div>
  <div class="box"><span class="material-symbols-outlined">explosion</span>ボム <b id="bombs" class="num">3</b></div>
</div>

<div id="ov" class="ov"><div class="card">
  <h1>戦場 <span>AI</span> FPS</h1>
  <p id="ovMsg">マップを読み込み中…</p>
  <div class="help">
    <span class="material-symbols-outlined">keyboard</span>WASD 移動 ／ Shift ダッシュ ／ Space ジャンプ ／ R リロード<br>
    <span class="material-symbols-outlined">mouse</span>マウスで視点 ／ 左クリック（押しっぱなしで連射）<br>
    <span class="material-symbols-outlined">explosion</span>Q でボム投擲（1.5秒後に爆発、近いほど大ダメージ）<br>
    <span class="material-symbols-outlined">flag</span>制限時間2分。敵AIは試合ごとに学習して強くなります<br>
    <span class="material-symbols-outlined">logout</span>Esc で一時停止
  </div>
  <div id="resultBox" class="result" style="display:none"></div>
  <button id="go" disabled><span class="material-symbols-outlined">play_arrow</span><span id="goTxt">読み込み中</span></button>
</div></div>

<script>
(() => {
// ================= ユーティリティ =================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normA = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };

// ================= 小さなニューラルネット（敵AIの脳） =================
// 入力8 → 隠れ8(tanh) → 出力3(tanh): [前後, 左右, 射撃]
const NI = 8, NH = 8, NO = 3;
const NPARAM = NH*NI + NH + NO*NH + NO; // 99
const randomBrain = () => Array.from({length: NPARAM}, () => (Math.random()*2-1)*0.8);
const mutate = (w, s) => w.map(v => v + (Math.random()+Math.random()-1) * s);
function forward(Wt, f) {
  const h = new Array(NH);
  for (let j = 0; j < NH; j++) {
    let s = Wt[NH*NI + j];
    for (let i = 0; i < NI; i++) s += Wt[j*NI + i] * f[i];
    h[j] = Math.tanh(s);
  }
  const o = new Array(NO), b2 = NH*NI + NH + NO*NH;
  for (let k = 0; k < NO; k++) {
    let s = Wt[b2 + k];
    for (let j = 0; j < NH; j++) s += Wt[NH*NI + NH + k*NH + j] * h[j];
    o[k] = Math.tanh(s);
  }
  return o;
}

// ================= Three.js セットアップ =================
const cv = $('c');
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb3c8);
scene.fog = new THREE.Fog(0x9bb3c8, 70, 200);
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 600);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x44553a, 1.0));
const sun = new THREE.DirectionalLight(0xfff3dd, 1.1);
sun.position.set(50, 100, 30);
scene.add(sun);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// 手持ちの銃（カメラの子）
const gun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.55), new THREE.MeshLambertMaterial({color: 0x2b2f26}));
gun.position.set(0.25, -0.22, -0.5);
camera.add(gun);
let gunRecoil = 0;

// ================= マップ（GLB）と高さマップによる当たり判定 =================
// ===== 調整用定数 =====
const MAP_WIDTH = 120;               // ステージの横幅（単位）。大きくすると広くなる
const SPEED_K = MAP_WIDTH / 90;      // 移動速度・投擲距離・爆風半径をステージに合わせて拡大
let mapRoot = null, HM = null, NX = 0, NZ = 0, CELL = 1;
const MIN = new THREE.Vector3();
let spawns = [], mapReady = false;

// 三角形をXZグリッドに投影し、各セルの最も高い面の高さを記録する
function buildHeightmap(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const N = 256;
  MIN.copy(box.min);
  const sx = box.max.x - box.min.x, sz = box.max.z - box.min.z;
  CELL = Math.max(sx, sz) / N;
  NX = Math.ceil(sx / CELL) + 1;
  NZ = Math.ceil(sz / CELL) + 1;
  HM = new Float32Array(NX * NZ).fill(box.min.y - 1);
  const v = new THREE.Vector3();

  root.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry, pos = geo.attributes.position, idx = geo.index, m = o.matrixWorld;
    const n = pos.count;
    const PX = new Float32Array(n), PY = new Float32Array(n), PZ = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m);
      PX[i] = (v.x - MIN.x) / CELL;   // セル座標
      PY[i] = v.y;
      PZ[i] = (v.z - MIN.z) / CELL;
      const ci = Math.floor(PX[i]), cj = Math.floor(PZ[i]);
      if (ci >= 0 && ci < NX && cj >= 0 && cj < NZ) {
        const k = cj*NX + ci;
        if (PY[i] > HM[k]) HM[k] = PY[i];
      }
    }
    const tris = idx ? idx.count / 3 : n / 3;
    const gi = i => idx ? idx.getX(i) : i;
    for (let t = 0; t < tris; t++) {
      const a = gi(t*3), b = gi(t*3+1), c = gi(t*3+2);
      const ax = PX[a], az = PZ[a], bx = PX[b], bz = PZ[b], cx = PX[c], cz = PZ[c];
      const x0 = Math.max(0, Math.floor(Math.min(ax, bx, cx)));
      const x1 = Math.min(NX-1, Math.ceil(Math.max(ax, bx, cx)));
      const z0 = Math.max(0, Math.floor(Math.min(az, bz, cz)));
      const z1 = Math.min(NZ-1, Math.ceil(Math.max(az, bz, cz)));
      const den = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
      if (Math.abs(den) < 1e-12) continue;
      for (let j = z0; j <= z1; j++) {
        for (let i = x0; i <= x1; i++) {
          const px = i + 0.5, pz = j + 0.5;
          const w1 = ((bz - cz) * (px - cx) + (cx - bx) * (pz - cz)) / den;
          const w2 = ((cz - az) * (px - cx) + (ax - cx) * (pz - cz)) / den;
          const w3 = 1 - w1 - w2;
          if (w1 < -1e-4 || w2 < -1e-4 || w3 < -1e-4) continue;
          const y = w1*PY[a] + w2*PY[b] + w3*PY[c];
          const k = j*NX + i;
          if (y > HM[k]) HM[k] = y;
        }
      }
    }
  });

  // 床の代表高さ（中央値）
  const samples = [];
  for (let k = 0; k < HM.length; k += 7) if (HM[k] > box.min.y - 0.5) samples.push(HM[k]);
  samples.sort((a, b) => a - b);
  const floorMed = samples.length ? samples[Math.floor(samples.length * 0.3)] : box.min.y;

  // 出現地点（床の近くで壁にめり込まない場所）
  spawns = [];
  for (let tries = 0; tries < 4000 && spawns.length < 200; tries++) {
    const x = MIN.x + Math.random() * sx, z = MIN.z + Math.random() * sz;
    const g = groundAt(x, z);
    if (g === -Infinity || g > floorMed + 1.0) continue;
    if (blockedAt(x, z, g, 0.8)) continue;
    spawns.push(new THREE.Vector3(x, g, z));
  }
}
function cellIndex(x, z) {
  const i = Math.floor((x - MIN.x) / CELL), j = Math.floor((z - MIN.z) / CELL);
  if (i < 0 || j < 0 || i >= NX || j >= NZ) return -1;
  return j*NX + i;
}
function groundAt(x, z) { const k = cellIndex(x, z); return k < 0 ? -Infinity : HM[k]; }
// 足元の高さから見て、0.55以上の段差があれば壁扱い
function blockedAt(x, z, feetY, r) {
  const offs = [[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*.7,r*.7],[-r*.7,-r*.7],[r*.7,-r*.7],[-r*.7,r*.7]];
  for (const [ox, oz] of offs) {
    const k = cellIndex(x+ox, z+oz);
    if (k < 0) return true;
    if (HM[k] > feetY + 0.55) return true;
  }
  return false;
}
function moveEnt(e, mx, mz, r = 0.4) {
  if (!blockedAt(e.pos.x + mx, e.pos.z, e.pos.y, r)) e.pos.x += mx;
  if (!blockedAt(e.pos.x, e.pos.z + mz, e.pos.y, r)) e.pos.z += mz;
}
function applyGravity(e, dt) {
  e.vy -= 25 * dt;
  e.pos.y += e.vy * dt;
  const g = groundAt(e.pos.x, e.pos.z);
  if (g === -Infinity) return;
  if (e.pos.y <= g) { e.pos.y = g; e.vy = 0; e.onGround = true; }
  else e.onGround = false;
}
// レイマーチ：地形(高さマップ)と対象エンティティに当たるか調べる
function trace(origin, dir, maxDist, targets) {
  const step = 0.25, p = new THREE.Vector3();
  for (let t = 0.3; t < maxDist; t += step) {
    p.copy(origin).addScaledVector(dir, t);
    const g = groundAt(p.x, p.z);
    if (g === -Infinity) return {t, ent: null, hit: true};
    if (g > p.y) return {t, ent: null, hit: true, pt: p.clone()};
    for (const e of targets) {
      if (!e.alive) continue;
      const dx = p.x - e.pos.x, dz = p.z - e.pos.z;
      if (dx*dx + dz*dz < 0.25 && p.y > e.pos.y && p.y < e.pos.y + 1.9)
        return {t, ent: e, hit: true, pt: p.clone()};
    }
  }
  return {t: maxDist, ent: null, hit: false};
}
function losTo(a, b) {
  const o = new THREE.Vector3(a.x, a.y + 1.5, a.z);
  const tgt = new THREE.Vector3(b.x, b.y + 1.4, b.z);
  const d = tgt.clone().sub(o), len = d.length();
  d.divideScalar(len);
  const r = trace(o, d, len, []);
  return !r.hit || r.t >= len - 0.5;
}

// ================= エンティティ =================
function makePlayer() {
  return {pos: new THREE.Vector3(), yaw: 0, pitch: 0, vy: 0, hp: 100, max: 100,
    alive: true, cd: 0, respawn: 0, kills: 0, deaths: 0, hit: 0, isPlayer: true, onGround: false};
}
const P = makePlayer();
let bots = [];
function makeBotMesh() {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({color: 0x9a3b35});
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.4), mat);
  body.position.y = 0.8;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshLambertMaterial({color: 0xd8b48a}));
  head.position.y = 1.6;
  const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), new THREE.MeshLambertMaterial({color: 0x222222}));
  rifle.position.set(0.25, 1.0, -0.4);
  group.add(body, head, rifle);
  scene.add(group);
  return {group, mat};
}
function pickSpawn(from) {
  let best = null, bestD = -1;
  for (let k = 0; k < 8 && spawns.length; k++) {
    const s = spawns[(Math.random() * spawns.length) | 0];
    const d = from ? Math.hypot(s.x - from.x, s.z - from.z) : 999;
    if (d > bestD) { bestD = d; best = s; }
  }
  return best ? best.clone() : new THREE.Vector3(0, 0, 0);
}
function spawnEntity(e, from) {
  e.pos.copy(pickSpawn(from));
  e.vy = 0; e.alive = true; e.hp = e.max; e.cd = 0; e.hit = 0;
  if (e.mesh) e.mesh.group.visible = true;
}
function kill(e, killer) {
  e.alive = false; e.hp = 0;
  if (e.isPlayer) { P.deaths++; P.respawn = 3; }
  else { e.respawn = 4; e.mesh.group.visible = false; killer.kills = (killer.kills || 0) + 1; }
}
function shootFrom(shooter, origin, dir, targets, dmg) {
  const r = trace(origin, dir, 200, targets);
  if (r.ent) {
    const e = r.ent;
    e.hp -= dmg; e.hit = 0.15;
    if (e.isPlayer) { fitDealt += dmg; P.hit = 0.3; }
    else fitTaken += dmg;
    if (e.hp <= 0 && e.alive) kill(e, shooter);
  }
  return r;
}

// 弾道（トレーサー）
const tracers = [];
function tracer(from, to) {
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([from, to]),
    new THREE.LineBasicMaterial({color: 0xffe08a, transparent: true, opacity: 0.85})
  );
  scene.add(line);
  tracers.push({line, life: 0.08});
}
function updateTracers(dt) {
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    if (tracers[i].life <= 0) {
      scene.remove(tracers[i].line);
      tracers[i].line.geometry.dispose();
      tracers.splice(i, 1);
    }
  }
}

// ================= 試合の状態 =================
let brain = randomBrain(), bestBrain = null, bestFit = -Infinity, gen = 1;
let fitDealt = 0, fitTaken = 0;
let running = false, over = true, started = false, locked = false;
let matchT = 120, ammo = 30, MAG = 30, reloadT = 0;
let mouseDown = false, hitFlash = 0;
const keys = {};

// ================= ボム（Q） =================
const BOMB_R = 0.2, BOMB_FUSE = 1.5, BLAST_R = 7 * SPEED_K, BLAST_DMG = 120;
const bombs = [], blasts = [];
let bombsLeft = 3;
const bombGeo = new THREE.SphereGeometry(BOMB_R, 12, 10);

function clearLine(a, b) {
  const d = b.clone().sub(a), len = d.length();
  if (len < 0.01) return true;
  d.divideScalar(len);
  const r = trace(a, d, len, []);
  return !r.hit || r.t >= len - 0.5;
}

function throwBomb() {
  if (!running || over || !P.alive || bombsLeft <= 0) return;
  bombsLeft--;
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const pos = camera.position.clone().addScaledVector(dir, 0.6);
  const vel = dir.clone().multiplyScalar(16 * SPEED_K).add(new THREE.Vector3(0, 6, 0));
  const mesh = new THREE.Mesh(bombGeo, new THREE.MeshLambertMaterial({color: 0x333333, emissive: 0x000000}));
  mesh.position.copy(pos);
  scene.add(mesh);
  bombs.push({pos, vel, fuse: BOMB_FUSE, mesh});
}

// 物理：重力・地面バウンド・壁での反射（サブステップで貫通を防止）
function updateBombs(dt) {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.fuse -= dt;
    b.mesh.material.emissive.setHex(Math.floor(b.fuse / 0.2) % 2 === 0 ? 0xff2222 : 0x000000);
    const steps = 4, h = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.vel.y -= 25 * h;
      const nx = b.pos.x + b.vel.x * h, nz = b.pos.z + b.vel.z * h;
      const g = groundAt(nx, nz);
      if (g === -Infinity || g > b.pos.y - BOMB_R + 0.3) {
        // 壁・マップ外：水平方向に跳ね返す
        b.vel.x *= -0.4; b.vel.z *= -0.4;
      } else {
        b.pos.x = nx; b.pos.z = nz;
      }
      b.pos.y += b.vel.y * h;
      const gf = groundAt(b.pos.x, b.pos.z);
      if (gf !== -Infinity && b.pos.y - BOMB_R < gf) {
        b.pos.y = gf + BOMB_R;
        if (b.vel.y < -2) { b.vel.y = -b.vel.y * 0.4; b.vel.x *= 0.7; b.vel.z *= 0.7; }
        else { b.vel.y = 0; b.vel.x *= 0.9; b.vel.z *= 0.9; }
      }
    }
    b.mesh.position.copy(b.pos);
    if (b.fuse <= 0) {
      explodeAt(b.pos.clone(), P);
      scene.remove(b.mesh);
      bombs.splice(i, 1);
    }
  }
  // 爆風エフェクト
  for (let i = blasts.length - 1; i >= 0; i--) {
    const bl = blasts[i];
    bl.life -= dt;
    const k = 1 - bl.life / bl.max;
    bl.mesh.scale.setScalar(0.5 + k * BLAST_R);
    bl.mesh.material.opacity = 0.7 * (1 - k);
    if (bl.life <= 0) { scene.remove(bl.mesh); blasts.splice(i, 1); }
  }
}

// 爆発：距離に応じてダメージ減衰、遮蔽物の向こうは軽減
function explodeAt(p, owner) {
  const sph = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({color: 0xffa040, transparent: true, opacity: 0.7}));
  sph.position.copy(p);
  scene.add(sph);
  blasts.push({mesh: sph, life: 0.5, max: 0.5});
  for (const t of [P, ...bots]) {
    if (!t.alive) continue;
    const c = new THREE.Vector3(t.pos.x, t.pos.y + 0.9, t.pos.z);
    const d = c.distanceTo(p);
    if (d > BLAST_R) continue;
    let dmg = BLAST_DMG * (1 - d / BLAST_R);
    if (!clearLine(p, c)) dmg *= 0.3;
    dmg = Math.round(dmg);
    if (dmg <= 0) continue;
    t.hp -= dmg; t.hit = 0.2;
    if (t.isPlayer) { fitDealt += dmg; P.hit = 0.5; }
    else { fitTaken += dmg; if (owner === P) hitFlash = 0.18; }
    if (t.hp <= 0 && t.alive) kill(t, owner);
  }
}

function playerFire() {
  if (!running || over || !P.alive || P.cd > 0) return;
  if (reloadT > 0) return;
  if (ammo <= 0) { reloadT = 1.6; return; }
  ammo--; P.cd = 0.12; gunRecoil = 0.07;
  const origin = camera.position.clone();
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  dir.x += (Math.random() - 0.5) * 0.012;
  dir.y += (Math.random() - 0.5) * 0.012;
  dir.normalize();
  const r = shootFrom(P, origin, dir, bots, 25);
  const end = r.pt ? r.pt : origin.clone().addScaledVector(dir, r.t);
  tracer(gun.getWorldPosition(new THREE.Vector3()), end);
  if (r.ent && !r.ent.isPlayer) hitFlash = 0.18;
}

function botFire(b) {
  const eye = new THREE.Vector3(b.pos.x, b.pos.y + 1.5, b.pos.z);
  const tgt = new THREE.Vector3(P.pos.x, P.pos.y + 1.4, P.pos.z);
  const dir = tgt.sub(eye).normalize();
  dir.x += (Math.random() - 0.5) * 0.08;
  dir.y += (Math.random() - 0.5) * 0.04;
  dir.normalize();
  shootFrom(b, eye, dir, [P], 12);
  b.cd = 0.6;
}

function updatePlayer(dt) {
  if (!P.alive) {
    P.respawn -= dt;
    if (P.respawn <= 0) spawnEntity(P, bots[0] ? bots[0].pos : null);
    return;
  }
  const f = new THREE.Vector3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw));
  const rt = new THREE.Vector3(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  let mx = 0, mz = 0;
  if (keys.KeyW) { mx += f.x; mz += f.z; }
  if (keys.KeyS) { mx -= f.x; mz -= f.z; }
  if (keys.KeyD) { mx += rt.x; mz += rt.z; }
  if (keys.KeyA) { mx -= rt.x; mz -= rt.z; }
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 10 : 6) * SPEED_K * dt / len;
    moveEnt(P, mx * sp, mz * sp);
  }
  if (keys.Space && P.onGround) { P.vy = 8; P.onGround = false; }
  applyGravity(P, dt);
  P.cd -= dt;
  if (mouseDown) playerFire();
  if (keys.KeyR && reloadT <= 0 && ammo < MAG) reloadT = 1.6;
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) ammo = MAG; }
}

function updateBot(b, dt) {
  if (!b.alive) {
    b.respawn -= dt;
    if (b.respawn <= 0 && running && !over) spawnEntity(b, P.pos);
    return;
  }
  const dx = P.pos.x - b.pos.x, dz = P.pos.z - b.pos.z;
  const dist = Math.hypot(dx, dz) || 0.001;
  const desiredYaw = Math.atan2(-dx, -dz);
  const diff = normA(desiredYaw - b.yaw);
  const los = P.alive && losTo(b.pos, P.pos) ? 1 : 0;

  // 特徴量 → ニューラルネット → 行動
  const f = [dx/40, dz/40, dist/60, b.hp/b.max, P.hp/P.max, Math.cos(diff), Math.sin(diff), los];
  const o = forward(brain, f);
  const fx = -Math.sin(b.yaw), fz = -Math.cos(b.yaw);
  const rx = Math.cos(b.yaw), rz = -Math.sin(b.yaw);
  const sp = 4.5 * SPEED_K * dt;
  moveEnt(b, (fx*o[0] + rx*o[1]) * sp, (fz*o[0] + rz*o[1]) * sp);
  applyGravity(b, dt);
  b.yaw += clamp(diff, -3*dt, 3*dt);
  b.cd -= dt;
  if (o[2] > 0.3 && b.cd <= 0 && Math.abs(diff) < 0.15 && los && dist < 70 && P.alive) botFire(b);
  b.hit = Math.max(0, b.hit - dt);

  b.mesh.group.position.copy(b.pos);
  b.mesh.group.rotation.y = b.yaw;
  b.mesh.mat.emissive.setHex(b.hit > 0 ? 0x553333 : 0x000000);
}

function startMatch() {
  matchT = 120; fitDealt = 0; fitTaken = 0;
  P.kills = 0; P.deaths = 0; ammo = MAG; reloadT = 0;
  for (const x of bombs) scene.remove(x.mesh);
  bombs.length = 0;
  for (const x of blasts) scene.remove(x.mesh);
  blasts.length = 0;
  bombsLeft = 3;
  spawnEntity(P, null);
  for (const b of bots) { spawnEntity(b, P.pos); b.respawn = 0; b.kills = 0; }
  running = true; over = false; started = true;
}

function endMatch() {
  over = true; running = false;
  const fit = fitDealt - fitTaken * 0.5;
  let note;
  if (fit > bestFit) {
    bestFit = fit; bestBrain = brain.slice();
    note = '学習成功：最高記録を更新（適合度 ' + fit.toFixed(0) + '）';
  } else {
    note = '学習中：適合度 ' + fit.toFixed(0) + '（最高 ' + bestFit.toFixed(0) + '）';
  }
  brain = mutate(bestBrain || brain, Math.max(0.05, 0.3 / Math.sqrt(gen)));
  gen++;
  if (document.pointerLockElement) document.exitPointerLock();
  $('resultBox').style.display = 'block';
  $('resultBox').innerHTML = 'キル ' + P.kills + ' ／ デス ' + P.deaths + '<br>' + note + '<br>次の敵AI：世代 ' + gen;
  $('ovMsg').textContent = '試合終了';
  $('goTxt').textContent = '次の試合';
  showOverlay(true);
}

function showOverlay(show) { $('ov').classList.toggle('hide', !show); }

// ================= 入力 =================
cv.addEventListener('click', () => { if (running && !locked) cv.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv;
  if (!locked && running) {
    $('ovMsg').textContent = '一時停止中';
    $('goTxt').textContent = '再開';
    $('resultBox').style.display = 'none';
    showOverlay(true);
  }
});
document.addEventListener('mousemove', e => {
  if (!locked || !P.alive) return;
  P.yaw -= e.movementX * 0.0022;
  P.pitch = clamp(P.pitch - e.movementY * 0.0022, -1.5, 1.5);
});
cv.addEventListener('mousedown', e => { if (e.button === 0) { mouseDown = true; } });
window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyQ' && !e.repeat && locked) throwBomb();
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

$('go').addEventListener('click', () => {
  if (!mapReady) return;
  if (!started || over) startMatch();
  showOverlay(false);
  cv.requestPointerLock();
});

// ================= マップ読み込み =================
const loader = new THREE.GLTFLoader();
loader.load('model_1.glb', gltf => {
  mapRoot = gltf.scene;
  scene.add(mapRoot);
  // 約90単位の幅に正規化し、最小点を原点へ
  mapRoot.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(mapRoot);
  const size = box.getSize(new THREE.Vector3());
  mapRoot.scale.multiplyScalar(MAP_WIDTH / Math.max(size.x, size.z));
  mapRoot.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(mapRoot);
  mapRoot.position.sub(box.min);
  mapRoot.updateMatrixWorld(true);

  buildHeightmap(mapRoot);

  for (let i = 0; i < 4; i++) {
    bots.push({pos: new THREE.Vector3(), yaw: 0, vy: 0, hp: 60, max: 60, alive: true,
      cd: 0, respawn: 0, hit: 0, kills: 0, isPlayer: false, onGround: false, mesh: makeBotMesh()});
  }
  for (const b of bots) b.mesh.group.visible = false;
  P.pos.copy(pickSpawn(null));

  mapReady = true;
  $('ovMsg').textContent = 'マップ読み込み完了。出撃してください。';
  $('goTxt').textContent = '出撃';
  $('go').disabled = false;
}, xhr => {
  if (xhr.total) $('ovMsg').textContent = 'マップを読み込み中… ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
}, err => {
  $('ovMsg').textContent = 'model_1.glb を読み込めませんでした。index.html と同じフォルダに置き、ローカルサーバー経由で開いてください。';
  console.error(err);
});

// ================= 描画・更新ループ =================
function updateCamera() {
  camera.position.set(P.pos.x, P.pos.y + (P.alive ? 1.6 : 0.4), P.pos.z);
  camera.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
  gunRecoil = Math.max(0, gunRecoil - dt0 * 0.6);
  gun.position.z = -0.5 + gunRecoil;
  gun.visible = P.alive;
}
let dt0 = 0.016;
function updateHUD() {
  $('hpBar').style.width = (clamp(P.hp / P.max, 0, 1) * 100) + '%';
  $('hpTxt').textContent = Math.max(0, Math.ceil(P.hp));
  const m = Math.max(0, Math.ceil(matchT));
  $('time').textContent = Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  $('kills').textContent = P.kills;
  $('deaths').textContent = P.deaths;
  $('gen').textContent = gen;
  $('ammo').textContent = reloadT > 0 ? '…' : ammo;
  $('bombs').textContent = bombsLeft;
  $('cross').classList.toggle('hit', hitFlash > 0);
  $('dmg').style.opacity = clamp(P.hit * 3, 0, 1);
}

let last = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts; dt0 = dt;
  if (mapReady && running && !over && locked) {
    matchT -= dt;
    updatePlayer(dt);
    for (const b of bots) updateBot(b, dt);
    updateBombs(dt);
    if (matchT <= 0) endMatch();
  }
  if (mapReady) {
    P.hit = Math.max(0, P.hit - dt);
    hitFlash = Math.max(0, hitFlash - dt);
    updateTracers(dt);
    updateCamera();
    updateHUD();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
