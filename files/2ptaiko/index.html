<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太鼓アーケード</title>
<style>
:root{--bg:#1a0d0d;--fg:#fff4e0;--acc:#ffb300;--red:#e8392b;--blue:#2e8bd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#screen{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 50% 30%,#4a1a14,#150808);border-bottom:6px solid #5a2a1a;overflow:hidden}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;padding:10px;text-align:center;overflow-y:auto}
#ui,#ui *{touch-action:pan-y}
#cv{position:absolute;inset:0;width:100%;height:100%;display:none}
h1{margin:0;font-size:clamp(22px,6vw,40px);color:var(--acc);text-shadow:0 3px 0 #000}
.msg{font-size:clamp(14px,3.8vw,21px)}
.blink{animation:b 1s infinite}@keyframes b{50%{opacity:.25}}
#slots{display:flex;gap:12px;width:100%;max-width:520px}
.slot{flex:1;border:3px solid #6a3a2a;border-radius:14px;padding:10px 6px;background:#0006;font-weight:700}
.slot.on{border-color:var(--acc);background:#ffb30026}
.slot small{display:block;font-weight:400;opacity:.8;margin-top:4px}
#timer{font-size:clamp(26px,7vw,44px);color:var(--acc);font-weight:800}
#panel{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;background:#2a1208}
#coinbar{display:flex;align-items:center;justify-content:center;gap:14px}
#coinbtn{font-size:16px;font-weight:800;padding:10px 20px;border:0;border-radius:30px;background:linear-gradient(#ffd54f,#ff9800);color:#4a2a00;box-shadow:0 4px 0 #8a5200}
#coinbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5200}
#coins{font-size:18px;font-weight:800}
#drums{display:flex;justify-content:space-between;padding:0 1vw}
.drum{position:relative;width:min(48vw,520px);height:min(28vw,20vh,220px);border-radius:50%;background:radial-gradient(ellipse,#c9a06a,#8a5a2a);border:7px solid var(--blue);box-shadow:0 5px 0 #0006,inset 0 0 0 4px #fff3}
.drum .c{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(ellipse,#ff6b5b,var(--red));border:3px solid #fff5;pointer-events:none}
.drum .l{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-weight:700;font-size:11px;opacity:.8;pointer-events:none}
.drum.hit{filter:brightness(1.5)}
.pop{position:absolute;font-weight:800;font-size:26px;pointer-events:none;animation:pop .5s forwards;z-index:3}
@keyframes pop{to{transform:translateY(-40px) scale(1.3);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#items{position:absolute;inset:0}
.it{position:absolute;padding:9px 14px;background:#fff4e0;color:#3a1a10;border-radius:10px;font-weight:800;white-space:nowrap;border:3px solid #c0392b;transform:translate(-50%,-50%);font-size:14px;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.it.cen{background:var(--acc);font-size:19px;border-color:#fff}
.it.shr{animation:shr 1.5s}@keyframes shr{0%,100%{transform:translate(-50%,-50%) scaleX(1)}35%,65%{transform:translate(-50%,-50%) scaleX(.04)}}
.it.shr span{animation:hid 1.5s}@keyframes hid{0%,100%{opacity:1}25%,75%{opacity:0}}
#screen.bright{background:linear-gradient(#ffd23f,#ff9a3a 55%,#ff7a8a)}
.bright .msg{color:#4a2200}
#tm{position:absolute;right:10px;top:8px;text-align:center;font-weight:800;z-index:6;color:#3a1a10;font-size:11px}
#tm b{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:#fff;border:4px solid #3a1a10;font-size:24px;margin:0 auto 4px}
#items .sb{position:absolute;transform:translate(-50%,-50%);border:4px solid #2a1208;border-radius:16px;padding:8px;background:linear-gradient(#ffc4a3,#ffc4a3) content-box,var(--cc,#ff7a1f);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;-webkit-text-stroke:4px #3a1608;paint-order:stroke fill;white-space:nowrap;overflow:hidden;box-sizing:border-box;font-size:clamp(13px,3.4vw,20px)}
.sb span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
#items .sb.cen{box-shadow:0 0 0 5px #fff700,0 0 22px 8px #fff70099;z-index:2;font-size:clamp(18px,5vw,30px);overflow:visible}
#items .sb.rnd{background:linear-gradient(90deg,#7ed957,#ffd000,#ff9a1f,#f26a3a,#ff8fd0,#b073e0,#5eaee8) content-box,#ff7a1f}
#items .sb.cls{background:#a8702a}
.sb.shr{animation:shr 1.5s}.sb.shr span{animation:hid 1.5s}
#dpanel{width:100%;max-width:640px;border:5px solid #2a1208;border-radius:20px;background:var(--cc,#ff7a1f);padding:12px}
#dtitle{background:linear-gradient(#ffc4a3,#ffb08a);border-radius:12px;padding:clamp(8px,2.5vh,24px) 10px;color:#fff;font-weight:900;font-size:clamp(20px,5.5vw,34px);-webkit-text-stroke:5px #3a1608;paint-order:stroke fill;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dcards{display:flex;gap:2.5%;justify-content:center;align-items:flex-end;margin-top:10px}
.dc.back{flex:none;width:min(84px,11vh)}.card2.cb{aspect-ratio:1;background:linear-gradient(#e8b070,#a65a1e);justify-content:center}.card2.cb .ic{flex:none;font-size:clamp(24px,6vw,40px)}
.dc{flex:1;max-width:min(132px,15.5vh);display:flex;flex-direction:column;align-items:center;min-width:0}
.bub{height:32px;display:flex;gap:3px;align-items:flex-end;justify-content:center;margin-bottom:6px}
.bub i{font-style:normal;font-weight:900;font-size:13px;color:#fff;padding:3px 8px;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 0 #0004}
.bub i.p1{background:#e8392b}.bub i.p2{background:#2e8bd8}.bub i.dn{outline:3px solid #fff700}
.card2{width:100%;aspect-ratio:.62;border:4px solid #2a1208;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 2px;color:#fff;font-weight:900;-webkit-text-stroke:3px #2a0a05;paint-order:stroke fill}
.card2 .ic{font-size:clamp(28px,8vw,52px);flex:1;display:flex;align-items:center;-webkit-text-stroke:0}
.card2 .nm{font-size:clamp(11px,3vw,17px);white-space:nowrap}
.card2 .st{font-size:clamp(14px,4vw,22px)}
.card2 .dots{margin-top:4px;width:90%;height:10px;border-radius:5px;background:#0006;-webkit-text-stroke:0;font-size:6px;line-height:10px;letter-spacing:1px;overflow:hidden;white-space:nowrap;text-align:left;padding-left:3px}
.c0{background:linear-gradient(#ffb0a0,#d02a1a)}.c1{background:linear-gradient(#d9f08c,#5c9a1a)}.c2{background:linear-gradient(#a8e0ee,#1f6fa0)}.c3{background:linear-gradient(#e0b0f5,#7a2fb0)}
.dc.sel .card2{box-shadow:0 0 0 4px #fff700,0 0 14px 6px #fff70099}
.dc.na .card2{filter:grayscale(1);opacity:.45}
.card{background:#fff4e0;color:#3a1a10;border-radius:14px;padding:12px;font-weight:700;font-size:14px;text-align:left;border:4px solid var(--acc)}
.card div{display:flex;justify-content:space-between;gap:16px}
#cur{position:absolute;top:0;bottom:0;left:0;width:0;background:#b01c1c;transition:width 1s;overflow:hidden;z-index:5}
#cur>div{width:100vw;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:clamp(34px,10vw,64px);font-weight:900}
.btn{display:inline-block;font-family:inherit;font-size:15px;font-weight:800;padding:12px 18px;border:0;border-radius:30px;background:linear-gradient(#ffd54f,#ff9800);color:#4a2a00;box-shadow:0 4px 0 #8a5200;cursor:pointer}
.btn.sub{background:#5a2a1a;color:var(--fg);box-shadow:0 4px 0 #2a1208}
.btn.off{opacity:.4;pointer-events:none}
.btn:active{transform:translateY(3px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chk{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
#scats{font-size:12px;opacity:.75;max-width:92%}
</style></head><body>
<div id="app">
 <div id="screen"><canvas id="cv"></canvas><div id="ui"></div><div id="cur"><div>おしまい!<span style="font-size:.4em">また遊んでね!</span></div></div></div>
 <div id="panel">
  <div id="coinbar"><button id="coinbtn">🪙 コイン投入</button><div id="coins">COIN: 0</div></div>
  <div id="drums">
   <div class="drum" id="d0"><div class="c"></div><div class="l">LEFT 中:D/F 縁:S/G</div></div>
   <div class="drum" id="d1"><div class="c"></div><div class="l">RIGHT 中:J/K 縁:H/L</div></div>
  </div>
  <div style="height:22px"></div>
 </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},scr=$('screen'),ui=$('ui'),cv=$('cv'),cx=cv.getContext('2d');
var AUD=new Map(),curSrc=null,curAP=null,BG=[],coins=0,S='setup',ent=[0,0],players=[],songN=0,tid=null,tcount=0,ac=null,unlock=false,cat=null,idx=0,busy=0,curSong=0,curText='',curP=null,T0=0,raf=0,lastT=0;
var SONGS=[],CATS=[],TOP=[],userSongs=[],have={},useDemo=true,UNC='未分類',CRS=['Easy','Normal','Hard','Oni'],CN=['かんたん','ふつう','むずかしい'];
var CCOLS={'未分類':'#9e9e9e','ナムコオリジナル':'#e8392b','ポップス':'#4fc3e8','バラエティ':'#43b02a','ゲームミュージック':'#9b59d0','クラシック':'#f2a60d','キッズ':'#ffe100'};
function ccol(it){var n=it.k=='cat'?it.t:it.k=='song'?SONGS[it.s].cat:null;return n?(CCOLS[n]||'#9e9e9e'):'#ff7a1f'}
var RND={k:'rnd',t:'ランダムに曲を選ぶ'},CLS={k:'close',t:'カテゴリを閉じる'};
try{unlock=localStorage.getItem('oniu')=='1'}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dec(b){try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){}try{return new TextDecoder('shift_jis').decode(b)}catch(e){return ''}}
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,t,v,type,dur){var a=audio();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*t),a.currentTime+dur);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function sDon(){tone(180,.4,.8,'sine',.25);tone(90,.5,.5,'triangle',.2)}
function sKa(){tone(900,.6,.35,'square',.07);tone(1400,.5,.2,'triangle',.05)}
function sCoin(){tone(1200,1,.3,'square',.08);setTimeout(function(){tone(1800,1,.3,'square',.25)},80)}
function sOk(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,1,.3,'square',.15)},i*90)})}

/* ---- TJA ---- */
var RW={Easy:['1000100010001000','1000200010002000','1000100020002000','1000200010001000','5000000800000000','7000000000000008'],
Normal:['1010100020201000','1000201020001010','1020102010201020','1010201020102000','7000000000000008','5000000800000000'],
Hard:['1010201010201020','1121102011211020','1010101020202020','1212121212121212','5000000800000000','3020402030204020'],
Oni:['1111211121112111','1212121221212121','1020102020102020','1111111122222222','3030404030304040','6000000000000008'],
Edit:['1212121212121212','1122112211221122','1111111111111111','3434343434343434','1212212112122121','6000000000000008']};
function mk(title,bpm,seed,ura){var s='TITLE:'+title+'\nBPM:'+bpm+'\nOFFSET:0\n',lv={Easy:2,Normal:4,Hard:6,Oni:8,Edit:10};
 for(var c in RW){if(c=='Edit'&&!ura)continue;s+='COURSE:'+c+'\nLEVEL:'+lv[c]+'\nBALLOON:6,8\n#START\n';
  for(var r=0;r<3;r++)for(var i=0;i<6;i++){if(ura&&r==2&&!i)s+='#BPMCHANGE '+(bpm+30)+'\n';s+=RW[c][(i+seed+r)%6]+',\n'}
  s+='#END\n'}return s}
var DEMO=[{title:'ひよこのマーチ',cat:'デモ曲',text:mk('ひよこのマーチ',110,0,0)},{title:'さくら疾走',cat:'ちょっと本気',text:mk('さくら疾走',150,2,0)},{title:'鬼ノ宴',cat:'ちょっと本気',text:mk('鬼ノ宴',180,4,1)}];
var CRSMAP={'0':'Easy','1':'Normal','2':'Hard','3':'Oni','4':'Edit',easy:'Easy',normal:'Normal',hard:'Hard',oni:'Oni',edit:'Edit',ura:'Edit'};
function mkc(b){return {notes:[],bars:[],n:0,bal:[],bpm:b}}
function parse(s){var o={bpm:120,off:0,c:{}},cur=null,sv=null,inCh=0,bpm,m,sc,t,items,bi,open;
 function meas(){var beats=4*m[0]/m[1],L=0;
  items.forEach(function(x){if(x.cmd){var a=x.cmd.split(/\s+/);if(a[0].toUpperCase()=='#MEASURE'){var f=(a[1]||'4/4').split('/');m=[+f[0]||4,+f[1]||4];beats=4*m[0]/m[1]}}else L++});
  cur.bars.push(t);var dt=L?beats*60/bpm/L:0;
  items.forEach(function(x){if(x.cmd){var a=x.cmd.split(/\s+/),c=a[0].toUpperCase();if(c=='#BPMCHANGE'){bpm=+a[1]||bpm;dt=L?beats*60/bpm/L:0}else if(c=='#SCROLL')sc=+a[1]||1;else if(c=='#DELAY')t+=+a[1]||0;return}
   var ch=x.ch,ty=+ch;
   if(ty>=1&&ty<=4){cur.notes.push({t:t,type:ty,sc:sc,j:0});cur.n++}
   else if(ty==5||ty==6||ty==7||ty==9){var n={t:t,type:ty==9?7:ty,sc:sc,j:0,end:1e9,c:0,need:ty>=7?(cur.bal[bi++]||5):0};cur.notes.push(n);open=n}
   else if(ty==8&&open){open.end=t;open=null}
   t+=dt});
  if(!L)t+=beats*60/bpm;items=[]}
 s.split(/\r?\n/).forEach(function(l){l=l.replace(/\/\/.*$/,'').trim();if(!l)return;
  if(!inCh){
   if(/^#START/i.test(l)){if(!cur){cur=mkc(o.bpm);cur.name='Oni'}
    if(cur.dbl||/\bP2\b/i.test(l)){sv=cur;cur=mkc(o.bpm)}else o.c[cur.name]=cur;
    inCh=1;bpm=o.bpm;t=-o.off;sc=1;m=[4,4];items=[];bi=0;open=null;return}
   var q=l.split(':'),k=q[0].trim().toUpperCase(),v=q.slice(1).join(':').trim();
   if(k=='BPM')o.bpm=+v||120;else if(k=='OFFSET')o.off=+v||0;
   else if(k=='COURSE'){cur=mkc(o.bpm);cur.name=CRSMAP[v.toLowerCase()]||v}
   else if(k=='STYLE'&&cur&&/^(double|2)$/i.test(v))cur.dbl=1;
   else if(k=='WAVE')o.wave=v;else if(k=='SONGVOL')o.vol=(+v||100)/100;
   else if(k=='LEVEL'&&cur)cur.lv=+v||0;
   else if(k=='BALLOON'&&cur)cur.bal=v.split(',').map(Number)}
  else{if(/^#END/i.test(l)){if(items.some(function(x){return x.ch}))meas();inCh=0;if(sv){cur=sv;sv=null}return}
   if(l[0]=='#'){items.push({cmd:l});return}
   var d=l.indexOf(',')>=0;l=l.replace(/,.*/,'');for(var i=0;i<l.length;i++)items.push({ch:l[i]});if(d)meas()}});
 return o}

/* ---- songs ---- */
var col=new Intl.Collator('ja',{numeric:true});
function rebuild(){SONGS=(useDemo?DEMO:[]).concat(userSongs);var mp=new Map();
 SONGS.forEach(function(s,i){var l=mp.get(s.cat);if(!l){l=[];mp.set(s.cat,l)}l.push(i)});
 var names=Array.from(mp.keys()).sort(function(a,b){return a==UNC?1:b==UNC?-1:col.compare(a,b)});
 CATS=names.map(function(n){var l=mp.get(n);l.sort(function(a,b){return col.compare(SONGS[a].title,SONGS[b].title)});return {n:n,songs:l}});
 TOP=[RND].concat(CATS.map(function(c,i){return {k:'cat',t:c.n,i:i}}));info()}
function addFiles(list){var recs=[],cnt={};
 list.forEach(function(r){var p=r.p||r.f.name;if(/\.(ogg|mp3|wav|m4a|aac|flac|opus)$/i.test(p)){AUD.set(p.toLowerCase(),r.f);return}if(!/\.tja$/i.test(p)||have[p])return;have[p]=1;
  var d=p.split('/');d.pop();var n=d.length,k=d.join('/');cnt[k]=(cnt[k]||0)+1;
  recs.push({f:r.f,k:k,cat:n>=3?d[n-2]:UNC,fo:n?d[n-1]:'',nm:r.f.name.replace(/\.tja$/i,'')})});
 recs.forEach(function(s){s.title=s.fo?(cnt[s.k]>1?s.fo+' ['+s.nm+']':s.fo):s.nm});
 userSongs=userSongs.concat(recs);rebuild()}
function loadSong(s){var o=SONGS[s];return o.text!=null?Promise.resolve(o.text):o.f.arrayBuffer().then(dec)}
function findAudio(sg,w){if(sg.f==null)return null;var d=sg.k?sg.k.toLowerCase()+'/':'',f,b;
 if(w){w=w.replace(/\\/g,'/');f=AUD.get((d+w).toLowerCase());if(f)return f;b=w.split('/').pop().toLowerCase();f=AUD.get(d+b);if(f)return f}
 if(!d)return null;var best=null;AUD.forEach(function(v,k){if(!best&&k.indexOf(d)==0&&k.indexOf('/',d.length)<0)best=v});return best}
function loadAudio(sg,w){var f=findAudio(sg,w),A=audio();if(!f||!A)return Promise.resolve(null);
 return f.arrayBuffer().then(function(b){return new Promise(function(ok){try{var r=A.decodeAudioData(b,ok,function(){ok(null)});if(r&&r.catch)r.catch(function(){ok(null)})}catch(e){ok(null)}})}).catch(function(){return null})}
function stopAudio(){if(curSrc){try{curSrc.stop()}catch(e){}curSrc=null}}
function walk(en,pre,out){return new Promise(function(ok){
 if(en.isFile){en.file(function(f){out.push({f:f,p:pre+en.name});ok()},ok);return}
 var rd=en.createReader(),ps=[];(function rr(){rd.readEntries(function(es){if(!es.length){Promise.all(ps).then(ok);return}es.forEach(function(x){ps.push(walk(x,pre+en.name+'/',out))});rr()},ok)})()})}

/* ---- ui ---- */
function setUI(h,b){scr.classList.toggle('bright',!!b);ui.innerHTML=h}
function show(p){ui.style.display=p?'none':'flex';cv.style.display=p?'block':'none'}
function setCoins(n){coins=n;$('coins').textContent='COIN: '+coins;if(S=='entry')renderEntry()}
function info(){var a=$('sinfo');if(!a)return;a.textContent=SONGS.length+'曲 / '+CATS.length+'カテゴリ';
 var c=$('scats');if(c)c.textContent=CATS.slice(0,6).map(function(x){return x.n+'('+x.songs.length+')'}).join(' ・ ')+(CATS.length>6?' …他'+(CATS.length-6):'');
 var g=$('go');if(g)g.classList.toggle('off',!SONGS.length)}
function renderSetup(){S='setup';clr();show(0);
 setUI('<h1>曲の設定</h1>'+
 '<div class="msg" style="font-size:12px;line-height:1.7;opacity:.85">曲フォルダ/tja → 未分類<br>カテゴリ/曲フォルダ/tja → カテゴリ名<br>フォルダ/カテゴリ/曲フォルダ/tja → カテゴリ名<br>同じ曲フォルダ内の WAVE: で指定した音声(ogg/mp3/wav等)を再生</div>'+
 '<div class="row"><label class="btn">📁 フォルダを選ぶ<input type="file" id="fdir" webkitdirectory multiple hidden></label><label class="btn sub">🎵 tja/音声を選ぶ<input type="file" id="ffile" multiple hidden></label></div>'+
 '<label class="chk"><input type="checkbox" id="demo"'+(useDemo?' checked':'')+'> デモ曲を含める</label>'+
 '<div id="sinfo" class="msg"></div><div id="scats"></div>'+
 '<div class="row"><button class="btn sub" data-a="clear">クリア</button><button class="btn" id="go" data-a="start">▶ スタート</button></div>');info()}
function slotHTML(i){return '<div class="slot'+(ent[i]?' on':'')+'">'+(i?'2P（右）':'1P（左）')+'<small>'+(ent[i]?'参加中！':'太鼓を叩いて参加')+'</small></div>'}

  c.globalAlpha=1-u;c.strokeStyle=gd?'#ffb300':'#fff';c.lineWidth=gd?5:3;c.beginPath();c.arc(jx,y,r*(1.3+u*(gd?2:1.1)),0,7);c.stroke();
  if(gd){c.lineWidth=3;c.strokeStyle='#fff3b0';for(k=0;k<14;k++){var an=k*Math.PI/7;c.beginPath();c.moveTo(jx+Math.cos(an)*r*(1.5+u*1.2),y+Math.sin(an)*r*(1.5+u*1.2));c.lineTo(jx+Math.cos(an)*r*(2.2+u*1.8),y+Math.sin(an)*r*(2.2+u*1.8));c.stroke()}}
  c.restore()}
 if(t-P.jtm<.4){c.fillStyle=P.jt=='良'?'#ffd54f':P.jt=='可'?'#fff':'#8af';c.font='bold 20px sans-serif';c.textAlign='center';c.fillText(P.jt,jx,fl?bot+16:top-16)}
 if(ix==0){var fs=Math.min(H*.075,26),ty=fs*.9+4,tt=SONGS[curSong].title;c.font='bold '+fs+'px sans-serif';c.textAlign='right';c.textBaseline='middle';c.lineWidth=5;c.lineJoin='round';c.strokeStyle='#2a0a2a';c.strokeText(tt,W-12,ty);c.fillStyle='#fff';c.fillText(tt,W-12,ty);
  if(solo){var ph=fs*.62,py=ty+fs*.65,xx=W-12;c.font='bold '+ph*.7+'px sans-serif';['3曲',(songN+1)+'曲目'].forEach(function(s2){var w2=c.measureText(s2).width+ph;c.fillStyle='#fff';rrect(c,xx-w2,py,w2,ph,ph/2);c.fill();c.fillStyle='#3a1a3a';c.textAlign='center';c.fillText(s2,xx-w2/2,py+ph/2+1);xx-=w2+6})}}
 if(solo&&ab){var sy0=bot+10,sy1=H-Math.min((H-bot)*.18,22)-8,sh3=Math.max(40,sy1-sy0),pwd=Math.min(W*.36,sh3*2.2),px0=(W-pwd)/2;
  c.fillStyle='#000';rrect(c,px0-4,sy0-4,pwd+8,sh3+8,sh3*.14);c.fill();c.fillStyle='#f6b90b';rrect(c,px0,sy0,pwd,sh3,sh3*.12);c.fill();c.lineWidth=3;c.strokeStyle='#fff';c.stroke();
  nd(c,px0+pwd*.13,sy0+sh3*.66,sh3*.2,'#f0402f');nd(c,px0+pwd*.87,sy0+sh3*.66,sh3*.2,'#3cc3d0');
  c.font='900 '+sh3*.7+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=sh3*.1;c.strokeStyle='#000';var bn=String(Math.max(0,ab.need-ab.c));c.strokeText(bn,W/2,sy0+sh3*.5);c.fillStyle='#fff';c.fillText(bn,W/2,sy0+sh3*.5)}}

/* result */
function toResult(){S='result';stopAudio();show(0);var h='<h1 style="font-size:22px">RESULT '+(songN+1)+'/3</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px">';
 [0,1].forEach(function(s){var P=players.filter(function(x){return x.side==s})[0];if(!P){h+='<div></div>';return}
  h+='<div class="card"><b>'+(s?'右':'左')+'の太鼓 '+Math.round(P.sc).toLocaleString()+'点</b>'+[['良',P.good],['可',P.ok],['不可',P.bad],['連打数',P.roll],['最大コンボ',P.mx]].map(function(r){return '<div><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'}).join('')+'<div style="color:'+(P.g>=70?'#c0392b':'#555')+'"><span>魂ゲージ</span><span>'+(P.g>=70?'クリア':'未達')+'</span></div></div>'});
 setUI(h+'</div><div class="msg blink">太鼓を叩いて次へ</div>')}
function next(){songN++;if(songN>=3){S='end';var c=$('cur');c.style.width='100%';setTimeout(function(){c.style.transition='none';reset();setTimeout(function(){c.style.transition='width 1s'},50)},3000)}else toSel()}

/* input */
function hit(side,kind,dir){var el=$('d'+side);el.classList.add('hit');setTimeout(function(){el.classList.remove('hit')},70);kind=='don'?sDon():sKa();
 if(S!='play'){var p=document.createElement('div');p.className='pop';p.textContent=kind=='don'?'ドン':'カッ';p.style.color=kind=='don'?'#ff6b5b':'#7fc4ff';p.style.left=side?'72%':'22%';p.style.top='35%';scr.appendChild(p);setTimeout(function(){p.remove()},500)}
 if(S=='entry')entry(side);
 else if(S=='mode'){if(side==0||!ent[0])toSel()}
 else if(S=='select')selInput(kind,dir);
 else if(S=='diff')diffInput(pidx(side),kind,dir);
 else if(S=='play')pHit(pidx(side),kind);
 else if(S=='result')next()}
[0,1].forEach(function(i){var el=$('d'+i);el.addEventListener('pointerdown',function(e){e.preventDefault();audio();var r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),nx=dx/(r.width/2),ny=dy/(r.height/2);hit(i,Math.sqrt(nx*nx+ny*ny)<.62?'don':'ka',dx<0?-1:1)})});
var K={KeyD:[0,'don',-1],KeyF:[0,'don',1],KeyS:[0,'ka',-1],KeyG:[0,'ka',1],KeyJ:[1,'don',-1],KeyK:[1,'don',1],KeyH:[1,'ka',-1],KeyL:[1,'ka',1]};

ui.addEventListener('change',function(e){var t=e.target;
 if(t.id=='fdir'||t.id=='ffile'){var l=[].map.call(t.files,function(f){return {f:f,p:f.webkitRelativePath||''}});t.value='';addFiles(l)}
 else if(t.id=='demo'){useDemo=t.checked;rebuild()}});
ui.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
 if(a=='start'){if(SONGS.length)reset()}
 else if(a=='clear'){userSongs=[];have={};AUD.clear();rebuild()}
 else if(a=='setup'&&S=='entry')renderSetup()});
scr.addEventListener('dragover',function(e){if(S=='setup')e.preventDefault()});
scr.addEventListener('drop',function(e){if(S!='setup')return;e.preventDefault();var its=e.dataTransfer.items,out=[],ps=[];
 if(its&&its.length&&its[0].webkitGetAsEntry){for(var i=0;i<its.length;i++){var en=its[i].webkitGetAsEntry();if(en)ps.push(walk(en,'',out))}Promise.all(ps).then(function(){addFiles(out)})}
 else addFiles([].map.call(e.dataTransfer.files,function(f){return {f:f,p:''}}))});

rebuild();renderSetup();
})();
