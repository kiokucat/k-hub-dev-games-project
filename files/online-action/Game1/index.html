<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>4Pランダムステージ・プラットフォーマー (オンライン対応)</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
  :root{
    --sky-top:#5c94fc;
    --sky-bottom:#a6d8ff;
    --ground:#8a5a2a;
    --ground-dark:#6b4420;
    --brick:#c9773a;
    --panel: rgba(15, 17, 26, 0.85);
    --panel-light: rgba(42, 47, 66, 0.9);
    --accent:#ffd23f;
    --accent-hover:#e6b822;
    --p1:#e6402c;
    --p2:#2fae4e;
    --p3:#3a8ef0;
    --p4:#c46bf0;
    --text:#f4f1ea;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* キャンバス */
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: var(--sky-top);
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: none;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  }
  .hud-p {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  
  .esc-hint {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 12px;
    font-weight: bold;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 4px;
  }

  /* タイトル＆設定画面 */
  #titleScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 20, 0.7);
    backdrop-filter: blur(12px);
    z-index: 20;
    padding: 20px;
    overflow-y: auto;
  }

  .title-card {
    background: var(--panel-light);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 40px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
    animation: slideUp 0.4s ease-out forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title-card h1 {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 30px;
    text-shadow: 0 2px 10px rgba(255, 210, 63, 0.4);
    letter-spacing: 2px;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    text-align: left;
    margin-bottom: 30px;
  }

  @media(max-width: 768px){
    .settings-grid { grid-template-columns: 1fr; }
  }

  .setting-section {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .setting-section h3 {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }

  .player-setup-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }

  .player-setup-row span {
    font-size: 14px;
    font-weight: bold;
    width: 70px;
  }

  .name-input {
    flex: 1;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .name-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(255, 210, 63, 0.3);
  }
  .name-input:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .count-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .count-btn {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
  }
  .count-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(255, 210, 63, 0.4);
  }

  .seed-row { display: flex; gap: 10px; }
  .seed-input {
    flex: 1;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 16px;
  }

  .controls-info {
    font-size: 13px;
    line-height: 1.8;
    color: #ccc;
  }
  .controls-info kbd {
    background: #333;
    padding: 2px 6px;
    border-radius: 4px;
    border-bottom: 2px solid #111;
    font-family: monospace;
    color: #fff;
    font-size: 12px;
  }

  /* 下部ボタンエリア */
  .btn-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    width: 100%;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .start-btn {
    background: var(--accent);
    color: #1a1500;
    border: none;
    padding: 16px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-hover), 0 10px 20px rgba(0,0,0,0.4);
    transition: all 0.1s;
    letter-spacing: 1px;
  }
  .start-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0px 0 var(--accent-hover), 0 2px 5px rgba(0,0,0,0.4);
  }

  /* オンライン用接続設定パネル */
  #onlinePanel {
    margin-top: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    width: 100%;
    text-align: left;
    display: none;
  }
  #onlineStatus {
    font-size: 14px;
    margin-bottom: 12px;
    color: var(--accent);
    font-weight: bold;
    line-height: 1.4;
  }
  .join-form {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #gameOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 15;
    text-align: center;
  }
  #gameOverlay h2 { font-size: 40px; margin: 0; color: var(--accent); }
  #gameOverlay p { font-size: 18px; line-height: 1.6; white-space: pre-line; }
  .action-btn {
    background: var(--accent); color: #000; border: none; padding: 12px 24px;
    font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud"></div>
<div id="hud-esc" class="esc-hint" style="display:none;">[Esc] タイトルへ戻る</div>

<div id="gameOverlay">
  <h2 id="overlayTitle"></h2>
  <p id="overlayText"></p>
  <button class="action-btn" id="overlayBtn">続ける</button>
</div>

<div id="titleScreen">
  <div class="title-card">
    <h1>🍄 RANDOM STAGE PLATFORMER 🍄</h1>
    
    <div class="settings-grid">
      <div class="setting-section">
        <h3>プレイヤー設定 (ローカル用)</h3>
        <div class="count-selector">
          <button class="count-btn" data-count="1">1人</button>
          <button class="count-btn active" data-count="2">2人</button>
          <button class="count-btn" data-count="3">3人</button>
          <button class="count-btn" data-count="4">4人</button>
        </div>
        
        <div class="player-setup-row">
          <span style="color: var(--p1)">P1 (赤)</span>
          <input type="text" id="nameP1" class="name-input" value="Player 1" maxlength="10">
        </div>
        <div class="player-setup-row">
          <span style="color: var(--p2)">P2 (緑)</span>
          <input type="text" id="nameP2" class="name-input" value="Player 2" maxlength="10">
        </div>
        <div class="player-setup-row">
          <span style="color: var(--p3)">P3 (青)</span>
          <input type="text" id="nameP3" class="name-input" value="Player 3" maxlength="10" disabled>
        </div>
        <div class="player-setup-row">
          <span style="color: var(--p4)">P4 (紫)</span>
          <input type="text" id="nameP4" class="name-input" value="Player 4" maxlength="10" disabled>
        </div>
      </div>

      <div class="setting-section">
        <h3>ゲームルール設定</h3>
        <div class="player-setup-row" style="margin-bottom: 20px;">
          <span>初期ライフ</span>
          <select id="initLives" class="name-input" style="flex: none; width: 90px;">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <h3>ステージ設定 (シード値)</h3>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 8px;">空欄で完全ランダム生成</p>
        <div class="seed-row" style="margin-bottom: 20px;">
          <input type="number" id="seedInput" class="seed-input" min="0" max="999999999" placeholder="ランダムシード">
        </div>

        <h3>操作方法</h3>
        <div class="controls-info">
          <div><strong style="color:var(--p1)">ローカルP1 / ネット対戦全員:</strong> <kbd>←</kbd><kbd>→</kbd> 移動 / <kbd>↑</kbd> ジャンプ</div>
          <div style="margin-top:4px;"><strong style="color:var(--p2)">ローカルP2:</strong> <kbd>A</kbd><kbd>D</kbd> 移動 / <kbd>W</kbd> ジャンプ</div>
          <div style="margin-top:10px; color:var(--accent);">★ 5コインで1UP！ ネット対戦時は自分の名前のキャラが動きます。</div>
        </div>
      </div>
    </div>

    <div class="btn-container">
      <button id="startBtn" class="start-btn">GAME START</button>
      <button id="hostInitBtn" class="start-btn" style="background: #2fae4e; box-shadow: 0 6px 0 #1f8a39;">ネット対戦 (ホスト)</button>
    </div>

    <div id="onlinePanel">
      <div id="onlineStatus">ルーム作成中...</div>
      <div id="joinForm" class="join-form">
        <input type="text" id="joinRoomId" class="name-input" placeholder="ホストのルームIDを入力">
        <button id="joinBtn" class="start-btn" style="padding: 10px 20px; font-size: 15px; background: #3a8ef0; box-shadow: 0 4px 0 #1b66b8; white-space: nowrap;">部屋に参加する</button>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 32;
const ROWS = 13; 
const GROUND_ROW = 9; 

let logicalW, logicalH;
const TARGET_LOGICAL_HEIGHT = 600; 

let level, levelWidthTiles, coins, enemies, players, stageSeed;
let particles = [];
let gameState = 'title'; 
let selectedPlayerCount = 2;

// 放置検知用
let lastInputTime = Date.now();
const TIMEOUT_DURATION = 15000; 

// オンライン通信用変数
let isOnline = false;
let isHost = false;
let myPlayerIdx = 0; 
let peer = null;
let hostConnections = []; 
let guestConnection = null; 
let onlinePlayerNames = [];

const PLAYER_COLORS = ['--p1','--p2','--p3','--p4'];
const PLAYER_KEYS = [
  {left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp'},
  {left:'KeyA', right:'KeyD', jump:'KeyW'},
  {left:'KeyJ', right:'KeyL', jump:'KeyI'},
  {left:'Comma', right:'Slash', jump:'Period'}
];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let currentRNG = Math.random;
function rnd(){ return currentRNG(); }
function rand(a,b){ return a + rnd()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generateLevel(seedValue){
  const prevRNG = currentRNG;
  currentRNG = mulberry32(seedValue);
  levelWidthTiles = randi(110, 150);
  const cols = levelWidthTiles;
  const grid = [];
  for(let r=0;r<ROWS;r++) grid.push(new Array(cols).fill(0));

  const groundHeight = []; 
  let x = 0;
  for(let i=0; i<6; i++){ groundHeight[i] = GROUND_ROW; }
  x = 6;
  while(x < cols){
    const isPit = x > 10 && x < cols-8 && rnd() < 0.22;
    if(isPit){
      const gapW = randi(2,3);
      for(let i=0;i<gapW && x<cols;i++,x++) groundHeight[x] = -1;
    } else {
      const runLen = randi(4,10);
      for(let i=0; i<runLen && x<cols;i++,x++) groundHeight[x] = GROUND_ROW;
    }
  }
  for(let i=Math.max(0,cols-8); i<cols; i++) groundHeight[i] = GROUND_ROW;

  for(let c=0;c<cols;c++){
    if(groundHeight[c] === -1) continue;
    for(let r=groundHeight[c]; r<ROWS; r++){
      grid[r][c] = 1;
    }
  }

  const platformEnemySpots = []; 
  for(let c=6;c<cols-6;c++){
    if(groundHeight[c] !== -1) platformEnemySpots.push(c);
  }

  let px = 8;
  while(px < cols-10){
    if(rnd() < 0.5){
      const platRow = GROUND_ROW - randi(2,5);
      const platLen = randi(2,6);
      if(platRow > 1){
        for(let i=0;i<platLen && px+i<cols-4;i++){
          grid[platRow][px+i] = 2;
        }
      }
      px += platLen + randi(2,4);
    } else {
      px += randi(2,5);
    }
  }

  for(let c=8;c<cols-8;c++){
    if(groundHeight[c] !== -1 && rnd() < 0.15){
      const qRow = GROUND_ROW - randi(2,3);
      if(qRow>0 && grid[qRow][c]===0){
        grid[qRow][c] = 3;
      }
    }
  }

  for(let c=10;c<cols-10;c++){
    if(groundHeight[c] !== -1 && rnd()<0.02 && grid[GROUND_ROW-1][c]===0 && grid[GROUND_ROW-2][c]===0){
      grid[GROUND_ROW-1][c] = 5;
      grid[GROUND_ROW-2][c] = 5;
    }
  }

  const coinList = [];
  for(let c=8;c<cols-8;c++){
    if(rnd()<0.1){
      let r = GROUND_ROW - randi(1,3);
      if(r>0 && grid[r][c]===0){
        coinList.push({x:c*TILE+TILE/2, y:r*TILE+TILE/2, taken:false, r:8});
      }
    }
  }

  const flagCol = cols-4;
  for(let r=1;r<ROWS-1;r++){
    if(grid[r][flagCol]===0) grid[r][flagCol] = 6;
  }

  const enemyList = [];
  for(const c of platformEnemySpots){
    if(rnd()<0.045 && c>10 && c<cols-10){
      let left=c, right=c;
      while(left>0 && groundHeight[left-1]===GROUND_ROW) left--;
      while(right<cols-1 && groundHeight[right+1]===GROUND_ROW) right++;
      if(right-left>=2){
        enemyList.push({
          x:c*TILE, y:(GROUND_ROW-1)*TILE,
          vx: rnd()<0.5?-1.2:1.2,
          minX:left*TILE, maxX:right*TILE,
          alive:true, w:28,h:28,
          animT: rnd()*100
        });
      }
    }
  }

  currentRNG = prevRNG;
  return {grid, cols, coinList, enemyList, flagCol};
}

function tileAt(c,r){
  if(c<0||c>=level.cols) return 1; 
  if(r<0) return 0; 
  if(r>=ROWS) return 0; 
  return level.grid[r][c];
}
function setTile(c,r,v){
  if(r<0||r>=ROWS||c<0||c>=level.cols) return;
  level.grid[r][c]=v;
}
function isSolid(t){
  return t===1||t===2||t===3||t===4||t===5;
}

function makePlayer(id, name, color, keys, spawnX, spawnY){
  return {
    id, name, color, keys,
    x:spawnX, y:spawnY, w:26, h:30, 
    vx:0, vy:0,
    onGround:false,
    facing:1,
    coins:0,
    totalCoins:0,
    lives:3,
    invuln:0,
    finished:false,
    dead:false,
    respawnX:spawnX, respawnY:spawnY,
    animT:0, moving:false,
    camX:0, camY:0
  };
}

function resetPlayerState(p){
  p.x=p.respawnX; p.y=p.respawnY; p.vx=0; p.vy=0; p.invuln=90; p.dead=false;
}

const KEYS = {};
window.addEventListener('keydown', e=>{ 
  KEYS[e.code]=true; 
  lastInputTime = Date.now(); 
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); 
  if(e.code === 'Escape' && gameState === 'playing') returnToTitle();
});
window.addEventListener('keyup', e=>{ KEYS[e.code]=false; });

function addCoin(p){
  p.coins++;
  p.totalCoins++;
  if(p.coins >= 5){
    p.coins = 0;
    p.lives++;
    spawn1UPText(p.x, p.y);
  }
}

function updatePlayer(p, dt){
  if(p.finished || p.dead) return;

  // オンライン時は自分のインデックスに対応するキャラのみ、共通して矢印キーで操作可能にする
  let left, right, jump;
  if (isOnline) {
    if (p.id - 1 === myPlayerIdx) {
      left = KEYS[PLAYER_KEYS[0].left];
      right = KEYS[PLAYER_KEYS[0].right];
      jump = KEYS[PLAYER_KEYS[0].jump];
    } else {
      left = false; right = false; jump = false;
    }
  } else {
    left = KEYS[p.keys.left];
    right = KEYS[p.keys.right];
    jump = KEYS[p.keys.jump];
  }

  const ACCEL = 0.6, MAXSPD = 4.2, FRICTION = 0.75, GRAVITY = 0.62, MAXFALL = 14, JUMPV = -12.2;

  p.moving = false;
  if(left && !right){ p.vx -= ACCEL * dt; p.facing=-1; p.moving=true; }
  else if(right && !left){ p.vx += ACCEL * dt; p.facing=1; p.moving=true; }
  else { 
    p.vx *= Math.pow(FRICTION, dt); 
    if(Math.abs(p.vx)<0.05) p.vx=0; 
  }
  p.vx = Math.max(-MAXSPD, Math.min(MAXSPD, p.vx));

  if(jump && p.onGround){
    p.vy = JUMPV;
    p.onGround = false;
  }

  p.vy += GRAVITY * dt;
  if(p.vy>MAXFALL) p.vy = MAXFALL;

  p.x += p.vx * dt;
  resolveCollisionsX(p);
  
  p.y += p.vy * dt;
  p.onGround = false;
  resolveCollisionsY(p);

  if(p.y > ROWS*TILE + 60){
    killPlayer(p);
    if (isOnline && !isHost && p.id - 1 === myPlayerIdx) {
      sendToHost({ type: 'playerDamaged', pIdx: myPlayerIdx, lives: p.lives, dead: p.dead });
    }
  }

  const pCol = Math.floor((p.x+p.w/2)/TILE);
  if(!p.finished && pCol >= level.flagCol){
    p.finished = true;
    p.vx = 0;
    spawnParticleBurst(p.x, p.y, p.color);
  }

  if(p.invuln>0) p.invuln = Math.max(0, p.invuln - dt);
  p.animT += (Math.abs(p.vx)*0.4 + 0.2) * dt;

  if(p.x<0) p.x=0;
  if(p.x > level.cols*TILE - p.w) p.x = level.cols*TILE - p.w;
}

function resolveCollisionsX(p){
  const dir = p.vx>0?1:(p.vx<0?-1:0);
  if(dir===0) return;
  const top = Math.floor(p.y/TILE);
  const bottom = Math.floor((p.y+p.h-1)/TILE);
  const edgeCol = dir>0 ? Math.floor((p.x+p.w-1)/TILE) : Math.floor(p.x/TILE);
  for(let r=top;r<=bottom;r++){
    const t = tileAt(edgeCol, r);
    if(isSolid(t)){
      if(dir>0) p.x = edgeCol*TILE - p.w - 0.01;
      else p.x = (edgeCol+1)*TILE + 0.01;
      p.vx = 0;
      break;
    }
  }
}

function resolveCollisionsY(p){
  const dir = p.vy>0?1:(p.vy<0?-1:0);
  if(dir===0) return;
  const left = Math.floor(p.x/TILE);
  const right = Math.floor((p.x+p.w-1)/TILE);
  const edgeRow = dir>0 ? Math.floor((p.y+p.h-1)/TILE) : Math.floor(p.y/TILE);
  for(let c=left;c<=right;c++){
    const t = tileAt(c, edgeRow);
    if(isSolid(t)){
      if(dir>0){
        p.y = edgeRow*TILE - p.h - 0.01;
        p.vy = 0;
        p.onGround = true;
      } else {
        p.y = (edgeRow+1)*TILE + 0.01;
        p.vy = 0.5;
        if(t===3){
          if (!isOnline || isHost) {
            setTile(c, edgeRow, 4);
            spawnCoinPop(c*TILE+TILE/2, edgeRow*TILE);
            addCoin(p);
          } else if (p.id - 1 === myPlayerIdx) {
            sendToHost({ type: 'hitBlock', c, r: edgeRow, pIdx: myPlayerIdx, tileType: 3 });
          }
        } else if(t===2){
          if (!isOnline || isHost) {
            setTile(c, edgeRow, 0); 
            spawnParticleBurst(c*TILE+TILE/2, edgeRow*TILE+TILE/2, '#c9773a');
          } else if (p.id - 1 === myPlayerIdx) {
            sendToHost({ type: 'hitBlock', c, r: edgeRow, pIdx: myPlayerIdx, tileType: 2 });
          }
        }
      }
      break;
    }
  }
}

function killPlayer(p){
  if(p.invuln>0 || p.finished) return;
  p.lives--;
  if(p.lives<=0){
    p.lives=0;
    p.dead=true;
  } else {
    resetPlayerState(p);
  }
}

function spawnCoinPop(x,y){ particles.push({type:'coinpop', x, y, vy:-6, life:24}); }
function spawnParticleBurst(x,y,color){
  for(let i=0;i<12;i++){ particles.push({type:'burst', x:x, y:y, vx:rand(-4,4), vy:rand(-6,-1), life:40, color}); }
}
function spawn1UPText(x,y){ particles.push({type:'text', text:'1UP!', x:x+13, y:y, vy:-1.5, life:50, color:'#2fae4e'}); }

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.life -= dt;
    if(pt.type==='coinpop'){ pt.y += pt.vy * dt; pt.vy += 0.4 * dt; }
    else if(pt.type==='burst'){ pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 0.3 * dt; }
    else if(pt.type==='text'){ pt.y += pt.vy * dt; }
    if(pt.life<=0) particles.splice(i,1);
  }
}

function updateEnemies(dt){
  if (isOnline && !isHost) return; // ゲストはホストからの同期処理を待つ

  for(let i=0; i<level.enemyList.length; i++){
    const e = level.enemyList[i];
    if(!e.alive) continue;
    e.x += e.vx * dt;
    if(e.x < e.minX){ e.x=e.minX; e.vx*=-1; }
    if(e.x+e.w > e.maxX+TILE){ e.x = e.maxX+TILE-e.w; e.vx*=-1; }
    e.animT += 0.15 * dt;

    for(const p of players){
      if(p.dead||p.finished) continue;
      if(isOnline && (p.id - 1 !== myPlayerIdx)) continue; // 自キャラのみが当たり判定を行う

      if(rectsOverlap(p.x,p.y,p.w,p.h, e.x,e.y,e.w,e.h)){
        if(p.vy>0 && (p.y+p.h) - e.y < 16){
          p.vy = -8; 
          if (!isOnline) {
            e.alive=false;
            spawnParticleBurst(e.x+14, e.y+14, '#c9773a');
          } else {
            if (isHost) {
              e.alive = false;
              spawnParticleBurst(e.x+14, e.y+14, '#c9773a');
            } else {
              sendToHost({ type: 'killEnemy', enemyIdx: i, pIdx: myPlayerIdx });
            }
          }
        } else if(p.invuln<=0){
          killPlayer(p);
          if (isOnline && !isHost) {
            sendToHost({ type: 'playerDamaged', pIdx: myPlayerIdx, lives: p.lives, dead: p.dead });
          }
        }
      }
    }
  }
}
function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2){ return x1<x2+w2 && x1+w1>x2 && y1<y2+h2 && y1+h1>y2; }

function checkCoinPickup(){
  for(let i=0; i<level.coinList.length; i++){
    const c = level.coinList[i];
    if(c.taken) continue;
    for(const p of players){
      if(p.dead||p.finished) continue;
      if(isOnline && (p.id - 1 !== myPlayerIdx)) continue;

      const dx = (p.x+p.w/2)-c.x, dy=(p.y+p.h/2)-c.y;
      if(Math.hypot(dx,dy) < 22){
        if (!isOnline) {
          c.taken = true;
          addCoin(p);
        } else {
          if (isHost) {
            c.taken = true;
            addCoin(p);
          } else {
            sendToHost({ type: 'takeCoin', coinIdx: i, pIdx: myPlayerIdx });
          }
        }
      }
    }
  }
}

function updatePlayerCamera(p, vw, vh, dt){
  const targetX = p.dead ? p.camX : (p.x + p.w/2) - vw/2;
  p.camX += (targetX - p.camX) * (1 - Math.pow(1 - 0.15, dt));
  p.camX = Math.max(0, Math.min(p.camX, level.cols*TILE - vw));

  const worldH = ROWS*TILE;
  const maxCamY = Math.max(0, worldH - vh);
  const targetY = p.dead ? p.camY : (p.y + p.h/2) - vh/2;
  p.camY += (targetY - p.camY) * (1 - Math.pow(1 - 0.15, dt));
  p.camY = Math.max(0, Math.min(p.camY, maxCamY));
}

function computeViewports(n, w, h){
  if(n<=1) return [{x:0, y:0, w:w, h:h}];
  if(n===2) return [{x:0, y:0, w:w/2, h:h}, {x:w/2, y:0, w:w/2, h:h}]; 
  const hw = w/2, hh = h/2;
  const vps = [{x:0, y:0, w:hw, h:hh}, {x:hw, y:0, w:hw, h:hh}, {x:0, y:hh, w:hw, h:hh}];
  if(n===4) vps.push({x:hw, y:hh, w:hw, h:hh});
  return vps;
}

function drawBackground(camX, vw, vh){
  const g = ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,'#5c94fc'); g.addColorStop(1,'#a6d8ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,vw,vh);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for(let i=0; i<6; i++){
    const cx = ((i*260) - camX*0.3) % (vw+300) - 150;
    drawCloud(cx, 30+ (i%3)*18);
  }
  ctx.fillStyle = '#4fae52';
  for(let i=0; i<8; i++){
    const hx = ((i*220) - camX*0.5) % (vw+300) - 150;
    ctx.beginPath(); ctx.arc(hx, vh-30, 60, Math.PI, 0); ctx.fill();
  }
}
function drawCloud(x,y){
  ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.arc(x+12,y-4,12,0,Math.PI*2); ctx.arc(x+24,y,10,0,Math.PI*2); ctx.fill();
}

function drawLevel(camX, camY, vw, vh){
  const startCol = Math.max(0, Math.floor(camX/TILE)-1);
  const endCol = Math.min(level.cols-1, Math.ceil((camX+vw)/TILE)+1);
  const startRow = Math.max(0, Math.floor(camY/TILE)-1);
  const endRow = Math.min(ROWS-1, Math.ceil((camY+vh)/TILE)+1);
  for(let r=startRow; r<=endRow; r++){
    for(let c=startCol; c<=endCol; c++){
      const t = level.grid[r][c];
      if(t===0) continue;
      const sx = c*TILE - camX, sy = r*TILE - camY;
      drawTile(t, sx, sy, vw, vh);
    }
  }
  const fx = level.flagCol*TILE - camX;
  ctx.fillStyle = '#ffdd55'; ctx.beginPath();
  ctx.moveTo(fx+16, TILE*1.2 - camY); ctx.lineTo(fx+40, TILE*1.4 - camY); ctx.lineTo(fx+16, TILE*1.6 - camY); ctx.fill();
}

function drawTile(t, sx, sy, vw, vh){
  if(sx< -TILE || sx>vw) return;
  switch(t){
    case 1:
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle = '#a3712f'; ctx.fillRect(sx,sy,TILE,6);
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.strokeRect(sx+0.5,sy+0.5,TILE-1,TILE-1);
      break;
    case 2:
      ctx.fillStyle = '#c9773a'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.strokeRect(sx+2,sy+2,TILE-4,TILE-4);
      ctx.beginPath(); ctx.moveTo(sx+TILE/2,sy+2); ctx.lineTo(sx+TILE/2,sy+TILE-2); ctx.stroke();
      break;
    case 3:
      ctx.fillStyle = '#f6b93b'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.strokeStyle='#8a5a1e'; ctx.lineWidth=2; ctx.strokeRect(sx+2,sy+2,TILE-4,TILE-4);
      ctx.fillStyle='#8a5a1e'; ctx.font='bold 18px monospace'; ctx.shadowColor='transparent'; ctx.textAlign='center';
      ctx.fillText('?', sx+TILE/2, sy+TILE/2+7);
      break;
    case 4:
      ctx.fillStyle = '#9c7a4d'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.strokeRect(sx+2,sy+2,TILE-4,TILE-4);
      break;
    case 5:
      ctx.fillStyle = '#2fae4e'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle = '#1f8a39'; ctx.fillRect(sx,sy,6,TILE); ctx.fillRect(sx+TILE-6,sy,6,TILE);
      break;
    case 6:
      ctx.fillStyle = '#cfcfcf'; ctx.fillRect(sx+TILE/2-2, sy, 4, TILE);
      break;
  }
}

function drawCoins(camX, camY, vw, vh){
  for(const c of level.coinList){
    if(c.taken) continue;
    const sx = c.x - camX, sy0 = c.y - camY;
    if(sx<-30||sx>vw+30) continue;
    ctx.save(); ctx.translate(sx, sy0);
    const squish = Math.abs(Math.sin(Date.now()/150 + c.x));
    ctx.scale(0.4+0.6*squish,1);
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c9962a'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
  }
}

function drawEnemies(camX, camY, vw, vh){
  for(const e of level.enemyList){
    if(!e.alive) continue;
    const sx = e.x - camX, sy = e.y - camY;
    if(sx<-40||sx>vw+40) continue;
    const bob = Math.sin(e.animT)*2;
    ctx.fillStyle = '#8b4a2b'; ctx.beginPath(); ctx.ellipse(sx+e.w/2, sy+e.h/2+bob, e.w/2, e.h/2, 0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx+e.w/2-6, sy+e.h/2-2+bob, 4,0,Math.PI*2); ctx.arc(sx+e.w/2+6, sy+e.h/2-2+bob, 4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(sx+e.w/2-6, sy+e.h/2-2+bob, 2,0,Math.PI*2); ctx.arc(sx+e.w/2+6, sy+e.h/2-2+bob, 2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c3319'; ctx.fillRect(sx+2, sy+e.h-4+bob, 8,6); ctx.fillRect(sx+e.w-10, sy+e.h-4+bob, 8,6);
  }
}

function drawPlayer(p, camX, camY, vw, vh){
  if(p.dead) return;
  const sx = p.x - camX, sy = p.y - camY;
  if(sx<-60||sx>vw+60) return;
  if(p.invuln>0 && Math.floor(p.invuln/4)%2===0) return; 

  const bounce = p.onGround ? Math.sin(p.animT)* (p.moving?3:0) : 0;
  ctx.save();
  ctx.translate(sx + p.w/2, sy + p.h);
  
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.shadowBlur = 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4a4a'; ctx.font = '10px Arial';
  let hearts = '';
  for(let i=0; i<p.lives; i++) hearts += '♥';
  ctx.fillText(hearts, 0, -44);

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
  ctx.fillText(p.name, 0, -34);
  ctx.restore();

  ctx.scale(p.facing, 1 - Math.abs(bounce) * 0.04);
  ctx.fillStyle = '#2a4fae'; ctx.fillRect(-p.w/2, -12, p.w, 12);  
  ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -19, p.w, 7);     
  ctx.fillStyle = '#f2c29a'; ctx.fillRect(-p.w/2+4, -26, p.w-8, 7); 
  ctx.fillStyle = p.color; ctx.fillRect(-p.w/2+2, -30, p.w-4, 4);  
  ctx.fillRect(2, -28, p.w/2-2, 2);                                
  ctx.fillStyle='#000'; ctx.fillRect(4, -24, 3, 3);                
  ctx.fillStyle='#5a3312'; ctx.fillRect(-1, -21, 8, 2);            
  ctx.restore();
}

function buildHud(){
  const hud = document.getElementById('hud');
  hud.innerHTML = '';
  players.forEach((p, i)=>{
    const div = document.createElement('div');
    div.className = 'hud-p';
    div.innerHTML = `<span class="dot" style="background:${p.color}"></span><span style="font-weight:bold">${p.name}</span> &nbsp;コイン:<span id="p${i+1}coins">0</span>/5`;
    hud.appendChild(div);
  });
}
function updateHud(){
  players.forEach((p,i)=>{
    const c = document.getElementById('p'+(i+1)+'coins');
    if(c) c.textContent = p.coins;
  });
}

const titleScreen = document.getElementById('titleScreen');
const gameOverlay = document.getElementById('gameOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayBtn = document.getElementById('overlayBtn');

const hudEsc = document.getElementById('hud-esc');

function getCSS(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }

function newStage(keepScores, seedOverride){
  const initLives = parseInt(document.getElementById('initLives').value, 10) || 3;
  stageSeed = (seedOverride!==undefined && seedOverride!==null && seedOverride!=='')
    ? parseInt(seedOverride, 10) : Math.floor(Math.random() * 999999999);
  
  level = generateLevel(stageSeed);
  const spawnY = (GROUND_ROW-2)*TILE;
  const oldPlayers = players;
  const n = selectedPlayerCount;
  players = [];

  for(let i=0; i<n; i++){
    const spawnX = (2 + i*1.2)*TILE;
    let nameInput = document.getElementById(`nameP${i+1}`).value || `Player ${i+1}`;
    if (isOnline && onlinePlayerNames[i]) nameInput = onlinePlayerNames[i];
    
    const p = makePlayer(i+1, nameInput, getCSS(PLAYER_COLORS[i]), PLAYER_KEYS[i], spawnX, spawnY);
    p.lives = initLives; // 初期ライフ設定を反映
    
    if(keepScores && oldPlayers && oldPlayers[i]){
      p.coins = oldPlayers[i].coins;
      p.totalCoins = oldPlayers[i].totalCoins; 
      p.lives = oldPlayers[i].lives > 0 ? oldPlayers[i].lives : initLives;
    }
    players.push(p);
  }
  particles = [];
  buildHud();
  updateHud();
}

function returnToTitle() {
  gameState = 'title';
  if (peer) { peer.destroy(); peer = null; }
  isOnline = false; isHost = false;
  hostConnections = []; guestConnection = null;
  document.getElementById('onlinePanel').style.display = 'none';
  titleScreen.style.display = 'flex';
  gameOverlay.style.display = 'none';
  hudContainer.style.display = 'none';
  hudEsc.style.display = 'none';
}

}
function hideGameOverlay(){ gameOverlay.style.display='none'; }

const countButtons = Array.from(document.querySelectorAll('.count-btn'));
function refreshCountButtons(){

    b.classList.toggle('active', isActive);
  });
  for(let i=1; i<=4; i++){
    const input = document.getElementById(`nameP${i}`);
    if (input) input.disabled = (i > selectedPlayerCount);
  }
}
countButtons.forEach(b=>{

    selectedPlayerCount = parseInt(b.dataset.count,10);

// 通常ゲームスタート（ローカルまたはホスト開始）
document.getElementById('startBtn').addEventListener('click', ()=>{
  const seedVal = document.getElementById('seedInput').value;
  const initLives = parseInt(document.getElementById('initLives').value, 10) || 3;
  
  if (isOnline && isHost) {
    stageSeed = seedVal ? parseInt(seedVal, 10) : Math.floor(Math.random() * 999999999);
    
    const finalNames = [onlinePlayerNames[0]];
    for(let i=0; i<hostConnections.length; i++) {
      finalNames.push(onlinePlayerNames[i+1] || `Player ${i+2}`);
    }
    onlinePlayerNames = finalNames;

    hostConnections.forEach((conn, idx) => {
      conn.send({
        type: 'start',
        assignedIdx: idx + 1, 
        playerCount: selectedPlayerCount,
        seed: stageSeed,
        initLives: initLives,
        playerNames: onlinePlayerNames
      });
    });

    newStage(false, stageSeed); 
    gameState = 'playing';
    lastInputTime = Date.now();
    titleScreen.style.display = 'none';
    hudContainer.style.display = 'flex';
    hudEsc.style.display = 'block';
  } else {
    isOnline = false;
    newStage(false, seedVal); 
    gameState = 'playing';
    lastInputTime = Date.now();
    titleScreen.style.display = 'none';
    hudContainer.style.display = 'flex';
    hudEsc.style.display = 'block';
  }
});

// ネット対戦 (ホストとして部屋を作る)
document.getElementById('hostInitBtn').addEventListener('click', () => {
  isOnline = true; isHost = true; myPlayerIdx = 0;
  hostConnections = [];
  onlinePlayerNames = [document.getElementById('nameP1').value || 'Host'];

  document.getElementById('onlinePanel').style.display = 'block';
  document.getElementById('onlineStatus').textContent = '接続サーバーにルームを登録中...';

  peer = new Peer();
  peer.on('open', (id) => {
    document.getElementById('onlineStatus').innerHTML = `あなたのルームID: <span style="background:#222; padding:3px 6px; border-radius:4px; font-family:monospace; color:#fff;">${id}</span><br>参加者の接続を待っています。全員揃ったら上の「GAME START」を押してね！`;
    selectedPlayerCount = 1;
    refreshCountButtons();
  });

  peer.on('connection', (conn) => {
    if (hostConnections.length >= 3) {
      conn.on('open', () => conn.send({ type: 'error', message: '部屋が満員です' }));
      setTimeout(() => conn.close(), 500); return;
    }
    hostConnections.push(conn);
    const pIdx = hostConnections.length;
    selectedPlayerCount = pIdx + 1;
    refreshCountButtons();

    conn.on('data', (data) => {
      if (data.type === 'join') {
        onlinePlayerNames[pIdx] = data.name;
        document.getElementById('onlineStatus').innerHTML += `<br>👤 参加者: ${data.name}`;
      } else {
        handleHostReceive(data, pIdx);
      }
    });

    conn.on('close', () => {
      const idx = hostConnections.indexOf(conn);
      if (idx !== -1) {
        hostConnections.splice(idx, 1);
        selectedPlayerCount = hostConnections.length + 1;
        refreshCountButtons();
        if (gameState === 'playing') {
          gameState = 'timeout';
          showGameOverlay('通信切断', '参加プレイヤーとの接続が切れました。', 'タイトルへ戻る');
        }
      }
    });
  });
});

// ネット対戦 (参加する)
document.getElementById('joinBtn').addEventListener('click', () => {
  const targetId = document.getElementById('joinRoomId').value.trim();
  if (!targetId) { alert('ルームIDを入力してください。'); return; }

  isOnline = true; isHost = false;
  document.getElementById('onlinePanel').style.display = 'block';
  document.getElementById('onlineStatus').textContent = 'ホストへ接続を試みています...';

  peer = new Peer();
  peer.on('open', () => {
    guestConnection = peer.connect(targetId);
    guestConnection.on('open', () => {
      document.getElementById('onlineStatus').textContent = '接続成功！ホストがゲームを開始するのを待っています...';
      const myName = document.getElementById('nameP1').value || 'Guest';
      guestConnection.send({ type: 'join', name: myName });
    });
    guestConnection.on('data', handleGuestReceive);
    guestConnection.on('close', () => {
      if (gameState === 'playing') {
        gameState = 'timeout';
        showGameOverlay('通信切断', 'ホストとの通信が切れました。', 'タイトルへ戻る');
      }
    });
  });
});

function handleHostReceive(data, guestIdx) {
  if (data.type === 'playerSync' && players && players[guestIdx]) {
    Object.assign(players[guestIdx], data.playerState);
  }
  else if (data.type === 'takeCoin' && level && level.coinList[data.coinIdx] && !level.coinList[data.coinIdx].taken) {
    level.coinList[data.coinIdx].taken = true;
    if (players && players[data.pIdx]) addCoin(players[data.pIdx]);
    spawnCoinPop(level.coinList[data.coinIdx].x, level.coinList[data.coinIdx].y - 16);
  }
  else if (data.type === 'killEnemy' && level && level.enemyList[data.enemyIdx] && level.enemyList[data.enemyIdx].alive) {
    level.enemyList[data.enemyIdx].alive = false;
    if (players && players[data.pIdx]) players[data.pIdx].vy = -8;
    const e = level.enemyList[data.enemyIdx];
    spawnParticleBurst(e.x+14, e.y+14, '#c9773a');
  }
  else if (data.type === 'playerDamaged' && players && players[data.pIdx]) {
    players[data.pIdx].lives = data.lives;
    players[data.pIdx].dead = data.dead;
  }
  else if (data.type === 'hitBlock') {
    const t = tileAt(data.c, data.r);
    if (t === data.tileType) {
      if (t === 3) { setTile(data.c, data.r, 4); spawnCoinPop(data.c*TILE+TILE/2, data.r*TILE); if (players && players[data.pIdx]) addCoin(players[data.pIdx]); }
      else if (t === 2) { setTile(data.c, data.r, 0); spawnParticleBurst(data.c*TILE+TILE/2, data.r*TILE+TILE/2, '#c9773a'); }
    }
  }
}

function handleGuestReceive(data) {
  if (data.type === 'error') { alert(data.message); returnToTitle(); }
  else if (data.type === 'start') {
    myPlayerIdx = data.assignedIdx;
    selectedPlayerCount = data.playerCount;
    onlinePlayerNames = data.playerNames;
    document.getElementById('initLives').value = data.initLives;

    newStage(false, data.seed);
    gameState = 'playing';
    lastInputTime = Date.now();
    titleScreen.style.display = 'none';
    hudContainer.style.display = 'flex';
    hudEsc.style.display = 'block';
  }
  else if (data.type === 'gameSync' && players) {
    data.players.forEach((pState, idx) => { if (idx !== myPlayerIdx && players[idx]) Object.assign(players[idx], pState); });
    if (level) {
      data.enemies.forEach((eState, idx) => { if (level.enemyList[idx]) Object.assign(level.enemyList[idx], eState); });
      data.coins.forEach((taken, idx) => { if (level.coinList[idx]) level.coinList[idx].taken = taken; });
      if (data.brokenBlocks) data.brokenBlocks.forEach(b => setTile(b.c, b.r, b.v));
    }
  }
  else if (data.type === 'nextStage') {
    newStage(true, data.seed); gameState = 'playing'; lastInputTime = Date.now(); hideGameOverlay();
  }
}

function sendToHost(data) { if (guestConnection && guestConnection.open) guestConnection.send(data); }

overlayBtn.addEventListener('click', ()=>{
  if(gameState==='cleared'){
    if (isOnline) {
      if (isHost) {
        const nextSeed = Math.floor(Math.random() * 999999999);
        hostConnections.forEach(c => c.send({ type: 'nextStage', seed: nextSeed }));
        newStage(true, nextSeed); gameState='playing'; lastInputTime = Date.now(); hideGameOverlay();
      }
    } else {
      newStage(true); gameState='playing'; lastInputTime = Date.now(); hideGameOverlay();
    }
  } else if(gameState==='gameover' || gameState==='timeout'){
    returnToTitle(); 
  }
});

let lastTime = 0;

function loop(timestamp){
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = timestamp;
  let elapsed = timestamp - lastTime;
  lastTime = timestamp;
  if (elapsed > 100) elapsed = 16.67;
  const dt = elapsed / (1000 / 60);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(level && players && players.length){
    const SCALE = canvas.height / TARGET_LOGICAL_HEIGHT;
    const vw = canvas.width / SCALE;
    const vh = canvas.height / SCALE;

    if(gameState==='playing'){
      // 放置判定：オンライン時は自キャラ、ローカル時は全プレイヤーの操作を監視
      let anyKeyPressed = false;
      if (isOnline) {
        if(KEYS[PLAYER_KEYS[0].left] || KEYS[PLAYER_KEYS[0].right] || KEYS[PLAYER_KEYS[0].jump]) anyKeyPressed = true;
      } else {
        for(const p of players) { if(KEYS[p.keys.left] || KEYS[p.keys.right] || KEYS[p.keys.jump]) { anyKeyPressed = true; break; } }
      }
      
      if(anyKeyPressed){
        lastInputTime = Date.now();
      } else if(Date.now() - lastInputTime > TIMEOUT_DURATION){
        gameState = 'timeout';
        if (peer) peer.destroy();
        showGameOverlay('DISCONNECTED', '15秒間操作がなかったため、接続を自動切断しました。', 'タイトルへ戻る');
      }

      for(const p of players) updatePlayer(p, dt);
      updateEnemies(dt);
      checkCoinPickup();
      updateParticles(dt);
      updateHud();

      // オンライン同期データの毎フレーム送信
      if (isOnline) {
        if (isHost) {
          const playersData = players.map(p => ({
            x: p.x, y: p.y, vx: p.vx, vy: p.vy, facing: p.facing, animT: p.animT, moving: p.moving, finished: p.finished, dead: p.dead, lives: p.lives, coins: p.coins, totalCoins: p.totalCoins, invuln: p.invuln
          }));
          const enemiesData = level.enemyList.map(e => ({ x: e.x, y: e.y, alive: e.alive }));
          const coinsData = level.coinList.map(c => c.taken);
          const brokenBlocks = [];
          for(let r=0; r<ROWS; r++){
            for(let c=0; c<level.cols; c++){
              const t = level.grid[r][c];
              if (t === 4 || t === 0) brokenBlocks.push({ c, r, v: t });
            }
          }
          hostConnections.forEach(c => c.send({ type: 'gameSync', players: playersData, enemies: enemiesData, coins: coinsData, brokenBlocks }));
        } else {
          const p = players[myPlayerIdx];
          if (p) sendToHost({
            type: 'playerSync', playerState: { x: p.x, y: p.y, vx: p.vx, vy: p.vy, facing: p.facing, animT: p.animT, moving: p.moving, finished: p.finished, dead: p.dead, lives: p.lives, coins: p.coins, totalCoins: p.totalCoins, invuln: p.invuln }
          });
        }
      }

      const anyFinished = players.some(p=>p.finished);
      const allDeadOrFinished = players.every(p=>p.finished || p.dead);
      const allDead = players.every(p=>p.dead);

      if(allDeadOrFinished && anyFinished && gameState === 'playing'){
        gameState='cleared';
        const totalScore = players.reduce((s,p)=>s+p.totalCoins,0);
        showGameOverlay('STAGE CLEAR!', `合計獲得コイン: ${totalScore} 枚\n次のステージへ進もう！`, isHost||!isOnline?'次のステージへ':'ホストの開始を待機中...');
      } else if(allDead && gameState === 'playing'){
        gameState='gameover';
        showGameOverlay('GAME OVER', '全員力尽きてしまった…', 'タイトルへ戻る');
      }
    }

    const viewports = computeViewports(players.length, vw, vh);
    
    players.forEach((p, i)=>{
      const vp = viewports[i];
      if(!vp) return;
      if(gameState==='playing') updatePlayerCamera(p, vp.w, vp.h, dt);
      const camX = p.camX, camY = p.camY;

      ctx.save();
      ctx.scale(SCALE, SCALE);
      ctx.beginPath(); ctx.rect(vp.x, vp.y, vp.w, vp.h); ctx.clip();
      ctx.translate(vp.x, vp.y);

      drawBackground(camX, vp.w, vp.h);
      drawLevel(camX, camY, vp.w, vp.h);
      drawCoins(camX, camY, vp.w, vp.h);
      drawEnemies(camX, camY, vp.w, vp.h);
      for(const op of players) drawPlayer(op, camX, camY, vp.w, vp.h);
      drawParticles(camX, camY, vp.w, vp.h);

      ctx.restore();
    });

    if(players.length>1){
      ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 4;
      if(players.length===2){
        ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
      }
      if(players.length===3){ ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(canvas.width/2, canvas.height/2, canvas.width/2, canvas.height/2); }
    }
  }
}

function drawParticles(camX, camY, vw, vh){
  for(const pt of particles){
    const sx = pt.x - camX, sy = pt.y - camY;
    if(pt.type==='coinpop'){ ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(sx, sy, 8,0,Math.PI*2); ctx.fill(); }
    else if(pt.type==='burst'){ ctx.fillStyle = pt.color; ctx.fillRect(sx-3, sy-3, 6,6); }
    else if(pt.type==='text'){
      ctx.save(); ctx.globalAlpha = Math.max(0, pt.life/50);
      ctx.fillStyle = pt.color; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.fillText(pt.text, sx, sy); ctx.restore();
    }
  }
}

requestAnimationFrame(loop);
})();
</script>
