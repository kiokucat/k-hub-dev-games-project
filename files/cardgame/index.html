<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction - 開発中</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景グリッド */
    .bg-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg) translateY(-100px);
      animation: gridMove 20s linear infinite;
      z-index: 1;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }

    /* メインコンテンツカード */
    .container {
      position: relative;
      z-index: 2;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    /* ギア（歯車）アニメーション */
    .gear-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
    }

    .gear {
      position: absolute;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gear-main {
      width: 80px;
      height: 80px;
      top: 10px;
      left: 10px;
      stroke: #00e5ff;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));
      animation: rotateClockwise 8s linear infinite;
    }

    .gear-sub {
      width: 50px;
      height: 50px;
      bottom: 10px;
      right: 15px;
      stroke: #ff2a8d;
      stroke-width: 3;
      filter: drop-shadow(0 0 6px rgba(255, 42, 141, 0.6));
      animation: rotateCounterClockwise 5s linear infinite;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* テキストスタイル */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(255, 170, 0, 0.15);
      border: 1px solid #ffaa00;
      color: #ffaa00;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 20px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* 装飾ライン */
    .glow-line {
      height: 2px;
      width: 60%;
      background: linear-gradient(90deg, transparent, #00e5ff, transparent);
      margin: 1.5rem auto 0;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <main class="container">
    <div class="gear-container">
      <!-- メインギア -->
      <svg class="gear gear-main" viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <!-- サブギア -->
      <svg class="gear gear-sub" viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>

    <span class="badge">UNDER CONSTRUCTION</span>
    <h1>工事中 / 開発中</h1>
    <p>ただいまゲームおよびウェブサイトを制作中です。<br>公開まで今しばらくお待ちください。</p>
    
    <div class="glow-line"></div>
  </main>

</body>
</html>
