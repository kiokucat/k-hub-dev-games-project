.rv-grid .c{text-align:right;font-weight:800;padding:4px 0;border-bottom:1px dashed #b98f4a}.rv-grid .l{padding:4px 0;border-bottom:1px dashed #b98f4a;font-weight:700}
.rv-grid .t{border-top:2px solid #8a5a22;font-weight:900}
.rv-pos{color:#15803d}.rv-neg{color:#b91c1c}.rv-mute{color:#8a6a3a;font-weight:600}
.rv-rows{padding:5px 0;border-bottom:1px dashed #b98f4a;font-size:13px}.rv-rows .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.rv-bar{height:6px;border-radius:3px;margin-top:3px;min-width:2px}.rv-bar.p{background:#4ade80}.rv-bar.n{background:#f87171}
.rv-item{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:8px 2px;border-bottom:1px dashed #b98f4a}
.rv-item .ic{font-size:22px;text-align:center}.rv-st{color:#e0a100;letter-spacing:1px;font-size:13px}.rv-who{font-size:11px;color:#7c5a2a;font-weight:700}
.rv-tx{font-size:13px;line-height:1.5;font-weight:700}.rv-tip{font-size:11px;color:#8a5a22;margin-top:2px}.rv-time{font-size:10px;color:#8a6a3a;margin-top:2px}
.rv-chip{align-self:start;font-size:12px;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap;text-align:center}
.rv-chip.p{background:#d1fae5;color:#065f46}.rv-chip.n{background:#fee2e2;color:#991b1b}.rv-chip.z{background:#e5e7eb;color:#374151}
.rv-chip small{display:block;font-size:10px;font-weight:700}

/* ---- 店員が止まるバグ対策：到達できる面を選ぶ ---- */
function staffApproach(a,o,obj){
  const cs=getAdjacentWalkable(obj.x,obj.y);
  if(cs.some(c=>c.x===a&&c.y===o))return[];
  cs.sort((p,q)=>Math.abs(p.x-a)+Math.abs(p.y-o)-Math.abs(q.x-a)-Math.abs(q.y-o));
  for(const c of cs){const f=findPath(a,o,c.x,c.y);if(f.length)return f}
  return[];
}

/* ---- フレームレート上限（モニターのHzに引きずられてFPSがばらつくのを防ぐ） ---- */
"fpsCap" in settings||(settings.fpsCap=60);
let __capNext=0;
(function(){
  const g=gameLoop;
  gameLoop=function(e){
    const cap=settings.fpsCap===undefined?60:settings.fpsCap;
    if(cap>0){
      const iv=1000/cap;
      if(e<__capNext-2){requestAnimationFrame(gameLoop);return}
      __capNext=(e-__capNext>iv)?e+iv:__capNext+iv;
    }
    return g.call(this,e);
  };
})();
function setFpsCap(v){settings.fpsCap=v;__capNext=0;saveSettings();gfxRefresh()}
(function(){
  const base=gfxSettingsHtml;
  gfxSettingsHtml=function(){
    const cur=settings.fpsCap===undefined?60:settings.fpsCap;
    const b=(v,l)=>`<button class="kairo-btn ${cur===v?"btn-orange":"btn-cream"}" style="padding:6px 10px" onclick="setFpsCap(${v})">${l}</button>`;
    const html=`<div class="set-h">🎞 フレームレート上限</div>
    <div class="gfx-row">${b(30,"30")}${b(60,"60（推奨）")}${b(90,"90")}${b(120,"120")}${b(0,"無制限")}</div>
    <div class="gfx-note">高Hzモニター(144Hz等)で60〜144を行き来してカクつくときは60に固定すると安定します。ゲーム内処理も同じ周期で動くので負荷も下がります（倍速時にも効果大）。</div>`;
    return base.apply(this,arguments).replace('<div class="set-h">🎥 追従視点</div>',html+'<div class="set-h">🎥 追従視点</div>');
  };
})();

/* ---- 店員の運搬数：研修(Lv)・足の速さ・特性・役職・キャンペーンで増える ---- */
(function(){
  const cb={"俊足ランナー":3,"コスパ最強":2,"ベテラン職人":3,"元コンビニ王":6};
  TRAITS.forEach(x=>{if(cb[x.name]){x.carry=cb[x.name];if(!/運搬/.test(x.desc))x.desc+="／運搬+"+x.carry}});
})();
function staffTraitCarry(s){const tr=s&&s.trait&&TRAITS.find(x=>x.name===s.trait.name);return tr&&tr.carry||0}
function staffCarryParts(s){
  return{trait:staffTraitCarry(s),lv:Math.max(0,((s&&s.level)||1)-1),spd:Math.floor(((s&&s.spdStat)||0)/30),role:s&&s.role==="stocker"?2:0};
}
function staffCarryBonus(s){const p=staffCarryParts(s);return Math.min(60,p.trait+p.lv+p.spd+p.role+campAdd("carry"))}
function carryLine(s){
  const p=staffCarryParts(s),b=staffCarryBonus(s);
  return `<div style="font-size:10px;color:var(--text-muted);margin:1px 0;">🎒 一度に運べる数 <b>+${b}個</b>（特性+${p.trait} / 研修Lv+${p.lv} / 足の速さ+${p.spd}${p.role?` / 品出し役+${p.role}`:""}）</div>`;
}

const campOf=id=>CAMPS.find(c=>c.id===id);
const campState=()=>state.camps||(state.camps={});
function campMul(k){const s=state.camps;if(!s)return 1;let m=1;for(const id in s){const c=campOf(id);if(c&&c.fx&&c.fx[k]!==undefined&&s[id]>0)m*=c.fx[k]}return m}
function campAdd(k){const s=state.camps;if(!s)return 0;let m=0;for(const id in s){const c=campOf(id);if(c&&c.fx&&c.fx[k]!==undefined&&s[id]>0)m+=c.fx[k]}return m}
function campCostText(c){return c.cost.p?`✨${c.cost.p}P`:`¥${c.cost.m.toLocaleString()}`}
function campCanPay(c){return c.cost.p?state.points>=c.cost.p:state.money>=c.cost.m}
function startCamp(id){
  const c=campOf(id);if(!c)return;
  const S=campState();
  if(S[id]>0)return;
  if(state.rankIdx<c.rk)return;
  if(!campCanPay(c))return SFX.angry(),setTicker("⚠️ キャンペーンの費用が足りません！");
  if(c.cost.p)state.points-=c.cost.p;else state.money-=c.cost.m;
  if(c.instant==="lottery"){
    const r=Math.random();let msg;
    if(r<.45){const v=[3000,5000,8000][Math.floor(Math.random()*3)];state.money+=v;msg=`💰 ¥${v.toLocaleString()} 当選！`}
    else if(r<.8){const v=[10000,15000,20000][Math.floor(Math.random()*3)];state.money+=v;msg=`💰 ¥${v.toLocaleString()} 当選！`}
    else if(r<.95){state.points+=40;msg="✨ 経営ポイント +40P 当選！"}
    else{state.money+=30000;state.points+=30;msg="🎉 特賞！ ¥30,000 と 30P！"}
    SFX.fanfare&&SFX.fanfare();setTicker("🎁 福引き大会："+msg);
  }else{
    S[id]=c.dur;SFX.combo();setTicker(`${c.icon} ${c.name} 開始！（${c.dur}秒）`);
  }
  updateHUD();renderManageTab();campHud();
}
let _campPt=0,_campCl=0;
function campTick(e){
  const S=state.camps;if(!S)return;
  let any=false;
  for(const id in S){
    const c=campOf(id);if(!c){delete S[id];continue}
    S[id]-=e;
    if(S[id]<=0){delete S[id];setTicker(`${c.icon} ${c.name} が終了しました`);continue}
    any=true;
    const f=c.fx||{};
    if(f.rep)repAdd(f.rep*e,"greeter");
    if(f.pps){_campPt+=f.pps*e;if(_campPt>=1){const n=Math.floor(_campPt);_campPt-=n;state.points+=n}}
    if(f.clean){_campCl+=e;if(_campCl>=1){_campCl=0;if(dirts.length)dirts.shift()}}
  }
}
(function(){
  const u=updateCalendarAndEconomy;
  updateCalendarAndEconomy=function(e){campTick(e);return u.apply(this,arguments)};
  const mf=machFee;
  machFee=function(e){return Math.round(mf.apply(this,arguments)*campMul("mach"))};
  /* 管理タブにキャンペーン一覧を追加 */
  const rm=renderManageTab;
  renderManageTab=function(){
    rm.apply(this,arguments);
    const b=document.querySelector('#pane-manage button[onclick="startCampaign()"]');

    let h='<div class="ribbon-title"><span>📣 キャンペーン一覧（同時に複数OK）</span></div>';
    CAMPS.forEach(c=>{
      const lock=state.rankIdx<c.rk,on=S[c.id]>0;
      const fx=c.instant?"一発勝負":`${c.dur}秒間`;
      h+=`<div class="item-card ${lock?"locked":""} ${on?"sale-active":""}" style="padding:6px 10px;"><div class="card-top"><span class="card-name">${c.icon} ${c.name}</span><span style="font-size:12px;font-weight:800;color:#b45309;">${campCostText(c)}</span></div><div style="font-size:11px;color:var(--text-muted);">${c.desc}（${fx}）</div>${lock?`<div style="font-size:11px;font-weight:800;color:#e5484d;">🔒 店舗ランク ${RANKS[c.rk].rank} で開放</div>`:`<button class="kairo-btn btn-blue" style="width:100%;margin-top:3px;" onclick="startCamp('${c.id}')" ${on||!campCanPay(c)?"disabled":""}>${on?`実施中（残り${Math.ceil(S[c.id])}秒）`:`${c.icon} 実施する（${campCostText(c)}）`}</button>`}</div>`;
    });
    card.insertAdjacentHTML("afterend",h);
  };
  /* 実施中は1秒ごとに残り時間を更新 */
  const ts=tabSig;
  tabSig=function(){const S=state.camps||{};return ts.apply(this,arguments)+"|"+Object.keys(S).map(k=>k+Math.ceil(S[k])).join(",")+"|"+CAMPS.map(c=>campCanPay(c)?1:0).join("")};
})();

function campHud(){
  const d=document.getElementById("camp-hud");if(!d)return;
  const S=state.camps||{},ids=Object.keys(S).filter(k=>campOf(k)&&S[k]>0);
  if(typeof titleOpen!=="undefined"&&titleOpen){d.innerHTML="";return}
  const h=ids.map(k=>{const c=campOf(k);return `<span>${c.icon} ${c.name} ${Math.ceil(S[k])}s</span>`}).join("");
  if(d._h!==h){d._h=h;d.innerHTML=h}
}
