    ctx.fillStyle = '#3b2d22';
    ctx.fillRect(px + 2, py + 6, TILE - 4, TILE - 10);
    ctx.fillStyle = '#2596be';
    ctx.fillRect(px + 4, py + 8, TILE - 8, TILE - 14);
    // レジ機本体
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(px + 10, py + 10, 20, 14);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px + 12, py + 12, 16, 6);
    // 店員立ち位置ドット枠
    ctx.strokeStyle = 'rgba(44, 182, 125, 0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 8, (obj.y - 1)*TILE + 8, TILE - 16, TILE - 16);

    if (obj.progress > 0) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(px + 4, py - 5, TILE - 8, 5);
      ctx.fillStyle = '#2cb67d';
      ctx.fillRect(px + 5, py - 4, (TILE - 10) * obj.progress, 3);
    }

  } else if (def.cat === 'eatin') {
    ctx.fillStyle = '#92400e';
    ctx.fillRect(px + 6, py + 8, TILE - 12, TILE - 14);
    ctx.fillStyle = '#fef3c7';
    ctx.fillRect(px + 8, py + 10, TILE - 16, TILE - 20);
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('☕', px + TILE/2, py + TILE/2);

  } else if (def.cat === 'atm') {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px + 6, py + 4, TILE - 12, TILE - 8);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(px + 9, py + 8, TILE - 18, 14);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ATM', px + TILE/2, py + 30);

  } else if (def.cat === 'backyard') {
    ctx.fillStyle = '#475569'; ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 5, py + 5, TILE - 10, TILE - 10);
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1e293b'; ctx.fillText('📦', px + TILE / 2, py + TILE / 2);
    const n = Object.values(BACK_EQUIP).filter(e => equipLv[e.id] > 0).length;
    if (n > 0) { ctx.font = 'bold 9px sans-serif'; ctx.fillText('🏭×' + n, px + TILE / 2, py + TILE - 3); }
  } else if (def.cat === 'block') {
    ctx.fillStyle = def.color; ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
    ctx.beginPath(); ctx.moveTo(px, py + TILE / 2); ctx.lineTo(px + TILE, py + TILE / 2);
    ctx.moveTo(px + TILE / 2, py); ctx.lineTo(px + TILE / 2, py + TILE / 2);
    ctx.moveTo(px + TILE / 4, py + TILE / 2); ctx.lineTo(px + TILE / 4, py + TILE); ctx.stroke();
  } else if (def.cat === 'neighbor') {
    const W = NB_W * TILE, H = NB_H * TILE, n2 = NB_W * 2, fl = FLOOR_THEMES[floorOf(obj)];
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(px + 4, py + 6, W, H);
    ctx.fillStyle = '#475569'; ctx.fillRect(px, py, W, H);
    for (let y = 1; y < NB_H - 1; y++) for (let x = 1; x < NB_W - 1; x++) { ctx.fillStyle = (x + y) % 2 ? fl[0] : fl[1]; ctx.fillRect(px + x * TILE, py + y * TILE, TILE, TILE); }
    for (let i = 0; i < n2; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#ef4444'; ctx.fillRect(px + i * W / n2, py, W / n2 + 0.5, 16); }
    ctx.fillStyle = '#1e293b'; ctx.fillRect(px + W / 2 - 80, py + 19, 160, 19);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fef9c3'; ctx.font = '900 12px sans-serif'; ctx.fillText(def.icon + ' ' + def.name, px + W / 2, py + 29);
    ctx.fillStyle = '#0369a1'; ctx.fillRect(px + W / 2 - TILE + 4, py + H - TILE + 4, 2 * TILE - 8, TILE - 8);
    ctx.strokeStyle = def.color; ctx.lineWidth = 3; ctx.strokeRect(px + 1.5, py + 1.5, W - 3, H - 3);
  } else if (def.cat === 'fixture') {
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(px + 5, py + 6, TILE - 6, TILE - 8);
    ctx.fillStyle = def.color; ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 8);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 8);
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(def.icon, px + TILE / 2, py + TILE / 2 - 1);
    if (def.blink) { ctx.fillStyle = Math.floor(performance.now() / 300 + obj.uid) % 2 ? '#f43f5e' : '#facc15'; ctx.fillRect(px + TILE - 12, py + 5, 5, 5); }
  } else if (def.cat === 'decor' && def.type !== 'plant') {
    ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(def.icon, px + TILE / 2, py + TILE / 2);
  } else if (def.cat === 'decor') {
    ctx.fillStyle = '#b45309';
    ctx.fillRect(px + 12, py + 24, 16, 12);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.arc(px + 20, py + 17, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#14532d';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawChibi(x, y, bodyColor, hairColor, bounce, isStaff, isManager = false) {
  const by = Math.abs(Math.sin(bounce || 0)) * -3;

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(x, y + 9, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 体（エプロン・服）
  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = '#2d241e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - 8, y - 2 + by, 16, 12, 4);
  ctx.fill();
  ctx.stroke();

  if (isStaff) {
    // 店員の白いエプロン紐
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 4, y + 1 + by, 8, 7);
  }

  // 頭
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.arc(x, y - 7 + by, 8.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 髪 / 帽子
  ctx.fillStyle = isManager ? '#2596be' : hairColor;
  ctx.beginPath();
  ctx.arc(x, y - 9 + by, 8.5, Math.PI, Math.PI * 2);
  ctx.fill();
  if (isManager) {
    // 店長サンバイザーのツバ
    ctx.fillStyle = '#facc15';
    ctx.fillRect(x - 6, y - 10 + by, 12, 3);
  }

  // かわいい目
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x - 4, y - 7 + by, 2, 3);
  ctx.fillRect(x + 2, y - 7 + by, 2, 3);
}

function drawEmoteBubble(x, y, emote) {
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#3b2d22';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - 12, y - 13, 24, 20, 6);
  ctx.fill();
  ctx.stroke();
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emote, x, y - 3);
}

// =========================================================
// Canvas マウス操作（建築＆インスペクター）
// =========================================================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const [gx, gy] = evTile(e);
  hoverTile = { x: gx, y: gy };
});

canvas.addEventListener('mouseleave', () => { hoverTile = null; });

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (state.buildMode) cancelBuildMode();
  closeInspector();
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) return;
  initAudio();
  const [gx, gy] = evTile(e);
  if (!state.buildMode) {
    const r = canvas.getBoundingClientRect(), sr = signRect();
    const wx = (e.clientX - r.left) * (canvas.width / r.width) / cam.scale + cam.x, wy = (e.clientY - r.top) * (canvas.height / r.height) / cam.scale + cam.y;
    if (wy >= 2 && wy <= 30 && Math.abs(wx - sr.cx) <= sr.w / 2) { openSignEditor(); return; }
  }

  if (state.buildMode) {
    const check = canPlaceSafely(state.buildMode.type, gx, gy, state.buildMode.moveUid);
    if (!check.ok) {
      SFX.angry();
      setTicker(`⚠️ 設置不可: ${check.reason}`);
      return;
    }

    if (state.buildMode.moveUid) {
      // 移動完了
      const obj = placedObjects.find(o => o.uid === state.buildMode.moveUid);
      if (obj) {
        if (FACILITY_TYPES[obj.type].cat === 'neighbor') { const ddx = gx - obj.x, ddy = gy - obj.y; placedObjects.forEach(q => { if (hostedBy(obj, q)) { q.x += ddx; q.y += ddy; } }); }
        obj.x = gx;
        obj.y = gy;
        SFX.place();
        recalcCombos();
      }
      cancelBuildMode();
    } else {
      // 新規設置
      const def = FACILITY_TYPES[state.buildMode.type];
      if (state.money < def.cost) {
        SFX.angry();
        setTicker('⚠️ 資金が足りません！');
        return;
      }
      state.money -= def.cost;
      addPlacedObject(state.buildMode.type, gx, gy);
      SFX.place();
      recalcCombos();
      setTicker(`🏗️ ${def.name} を設置しました！`);
      updateHUD();
      // 連続配置できるように建築モード維持（資金不足なら解除）
      if (state.money < def.cost) cancelBuildMode();
    }
    return;
  }

  // 通常クリック：設備を選択してクイックメニュー表示
  const clicked = objAt(gx, gy);
  if (clicked) {
    SFX.click();
    openInspector(clicked);
  } else {
    closeInspector();
  }
});

function startBuildMode(type, moveUid = null) {
  closeInspector();
  const def = FACILITY_TYPES[type];
  if (!moveUid && state.money < def.cost) {
    SFX.angry();
    return setTicker(`⚠️ ${def.name} の建築費用(¥${def.cost.toLocaleString()})が足りません！`);
  }
  state.buildMode = { type, moveUid };
  document.getElementById('build-banner').classList.add('show');
  document.getElementById('build-banner-msg').textContent = moveUid
    ? `🚚「${def.name}」の新しい場所をクリック！(右クリックで中止)`
    : `🏗️「${def.name}」(¥${def.cost}) を置く場所をクリック！(連続設置可 / 右クリック終了)`;
  SFX.click();
}

function cancelBuildMode() {
  state.buildMode = null;
  document.getElementById('build-banner').classList.remove('show');
}

function openInspector(obj) {
  state.selectedObjId = obj.uid;
  const def = FACILITY_TYPES[obj.type];
  const pop = document.getElementById('inspector-popup');

  let extra = '';
  if (def.cat === 'shelf') {
    const p = products[def.prod];
    extra = `
      <div style="font-size:12px; margin:4px 0;">
        陳列数: <b>${obj.stock}/${def.maxCap}</b> | 販売価格: <b>¥${getEffectivePrice(p)}</b>
      </div>
      <button class="kairo-btn btn-blue" style="width:100%; margin-bottom:5px;" onclick="switchDockById('price'); closeInspector();">
        💰 価格・特売を設定する
      </button>
    `;
  } else if (def.cat === 'register') {
    extra = `<div style="font-size:12px; margin:4px 0;">待機列: <b>${obj.queue.length}人</b></div>`;
  } else if (def.cat === 'neighbor') {
    const fx = placedObjects.filter(q => hostedBy(obj, q)), inc = fx.reduce((a, q) => a + fxIncome(q), 0);
    extra = `<div style="font-size:12px; margin:4px 0;">🛠 内装 ${fx.length}/${(NB_W - 2) * (NB_H - 2)}マス ／ 内装収入 毎週 +¥${inc}<br>🎨 床: ${FLOOR_NAMES[floorOf(obj)]}</div>
      <button class="kairo-btn btn-blue" style="width:100%; margin-bottom:5px;" onclick="cycleFloor(${obj.uid})">🎨 床の色を変える</button>
      <button class="kairo-btn btn-green" style="width:100%; margin-bottom:5px;" onclick="switchDockById('build'); closeInspector();">🛠 内装を置く（建築タブの下の方）</button>`;
  } else if (def.cat === 'fixture') {
    extra = `<div style="font-size:12px; margin:4px 0;">内装収入 毎週 <b>+¥${fxIncome(obj)}</b>（評判で増減）</div>`;
  }

  const canDelete = def.cat !== 'backyard' && !(def.cat === 'register' && placedObjects.filter(o => o.type === 'register').length <= 1);

  pop.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <span style="font-weight:900; font-size:14px;">${def.icon} ${def.name}</span>
      <button class="kairo-btn btn-cream" style="padding:2px 6px;" onclick="closeInspector()">✖</button>
    </div>
    <div style="font-size:11px; color:var(--text-muted);">${def.desc}</div>
    ${obj.inCombo ? '<div style="font-size:11px; color:#b45309; font-weight:800; margin-top:2px;">✨ コーナーボーナス発動中！</div>' : ''}
    ${extra}
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button class="kairo-btn btn-orange" style="flex:1;" onclick="startBuildMode('${obj.type}', ${obj.uid})">🚚 移動</button>
      <button class="kairo-btn btn-red" style="flex:1;" onclick="removeObject(${obj.uid})" ${!canDelete ? 'disabled title="最後のレジは撤去できません"' : ''}>
        🗑 撤去(+¥${Math.floor(def.cost*0.5)})
      </button>
    </div>
  `;
  pop.classList.add('show');
}

function closeInspector() {
  state.selectedObjId = null;
  document.getElementById('inspector-popup').classList.remove('show');
}

function removeObject(uid) {
  const idx = placedObjects.findIndex(o => o.uid === uid);
  if (idx === -1) return;
  const obj = placedObjects[idx];
  const def = FACILITY_TYPES[obj.type];
  if (def.cat === 'shelf' && obj.stock > 0) {
    products[def.prod].stock += obj.stock;
  }
  let refund = Math.floor(def.cost * 0.5);
  if (def.cat === 'neighbor') { const fx = placedObjects.filter(q => hostedBy(obj, q)); fx.forEach(q => { refund += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); }); placedObjects = placedObjects.filter(q => !fx.includes(q)); }
  state.money += refund;
  placedObjects.splice(placedObjects.indexOf(obj), 1);
  closeInspector();
  recalcCombos();
  SFX.click();
  setTicker(`🗑 ${def.name} を撤去しました (+¥${refund})`);
  updateHUD();
}

// =========================================================
// コマンドドック UI レンダリング
// =========================================================
function switchDock(tabId, btnEl) {
  state.activeDock = tabId;
  document.querySelectorAll('.dock-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btnEl.classList.add('active');
  document.getElementById('pane-' + tabId).classList.add('active');
  SFX.click();
  refreshAllTabs();
}

function switchDockById(tabId) {
  const tabs = document.querySelectorAll('.dock-tab');
  const map = { build: 0, price: 1, staff: 2, manage: 3, back: 4 };
  switchDock(tabId, tabs[map[tabId]]);
}

function refreshAllTabs() {
  if (state.activeDock === 'build') renderBuildTab();
  else if (state.activeDock === 'price') renderPriceTab();
  else if (state.activeDock === 'staff') renderStaffTab();
  else if (state.activeDock === 'manage') renderManageTab();
  else if (state.activeDock === 'back') renderBackTab();
}

function renderBuildTab() {
  const pane = document.getElementById('pane-build');
  let html = `<div class="ribbon-title"><span>🏗️ 店内設備・商品棚の設置</span><span>移動もOK!</span></div>`;
  let lastGrp = '';
  Object.values(FACILITY_TYPES).sort((a, b) => BUILD_ORDER.indexOf(a.cat) - BUILD_ORDER.indexOf(b.cat)).forEach(def => {
    if (def.cat === 'backyard') return;
    const grp = BUILD_GROUP[def.cat];
    if (grp !== lastGrp) { lastGrp = grp; html += `<div class="ribbon-title" style="font-size:12px;"><span>${grp}</span></div>`; }
    const locked = def.cat === 'shelf' && products[def.prod].unlockRank > state.rankIdx;
    const reqRank = def.cat === 'shelf' ? RANKS[products[def.prod].unlockRank].rank : '';
    html += `
      <div class="item-card ${locked ? 'locked' : ''}" ${tipAttr(facilityTip(def))}>
        <div class="card-top">
          <span class="card-name">${def.icon} ${def.name}</span>
          <span style="font-weight:900; color:#b45309; font-size:12px;">¥${def.cost.toLocaleString()}</span>
        </div>
        <div style="font-size:11px; color:var(--text-muted);">${def.desc}</div>
        ${locked
          ? `<div style="font-size:11px; font-weight:800; color:#e5484d;">🔒 店舗ランク ${reqRank} で開放</div>`
          : `<button class="kairo-btn btn-orange" onclick="startBuildMode('${def.type}')" ${state.money < def.cost ? 'disabled' : ''}>📍 設置場所を選ぶ</button>`
        }
      </div>
    `;
  });
  pane.innerHTML = html;
}

// 価格設定タブ（スライダーのドラッグを邪魔しないよう、構築時と数値更新を分離！）

function updatePriceCardInline(pid) {
  const p = products[pid];
  const fb = getPriceFeedback(p);
  const eff = getEffectivePrice(p);
  const profit = eff - getUnitCost(p);

  const badge = document.getElementById('pbadge-' + pid);
  const effEl = document.getElementById('peff-' + pid);
  const profEl = document.getElementById('pprof-' + pid);
  if (badge) {
    badge.className = 'badge ' + fb.cls;
    badge.textContent = fb.label;
  }
  if (effEl) effEl.textContent = '¥' + eff;
  if (profEl) {
    profEl.textContent = `粗利 ${profit>=0?'+':''}¥${profit}`;
    profEl.style.color = profit >= 0 ? '#15803d' : '#e5484d';
  }
}

function setPrice(pid, val) {
  products[pid].price = val; const ne = document.getElementById('pnum-' + pid); if (ne) ne.value = val;
  updatePriceCardInline(pid);
}

function adjustPrice(pid, delta) {
  const p = products[pid];
  const minP = 10;
  const maxP = Math.max(Math.round(p.basePrice * 4 / 10) * 10, Math.round(p.price * 1.5 / 10) * 10);
  p.price = Math.max(10, p.price + delta);
  SFX.click();
  renderPriceTab();
}

function toggleSale(pid) {
  const p = products[pid];
  if (!p.onSale) {
    const activeSales = Object.values(products).filter(x => x.onSale).length;
    if (activeSales >= 2) {
      SFX.angry();
      return setTicker('⚠️ 特売セールは同時に2商品まで指定できます！');
    }
    p.onSale = true;
    setTicker(`📣 「${p.name}」の特売セールを開始！のぼり旗を立てました！`);
  } else {
    p.onSale = false;
  }
  SFX.place();
  renderPriceTab();
}

function upgradeQuality(pid) {
  const p = products[pid];
  const cost = 10 + p.quality * 10;
  if (state.points < cost) return;
  state.points -= cost;
  p.quality++;
  SFX.heart();
  setTicker(`✨ 「${p.name}」の品質が Lv.${p.quality} に上昇！高価格でも売れやすくなりました！`);
  renderPriceTab();
  updateHUD();
}

function bulkBuy(pid) {
  const p = products[pid];
  const cost = Math.round(getUnitCost(p) * 30 * 0.9); // 10%OFF卸売！
  if (state.money < cost) {
    SFX.angry();
    return setTicker(`⚠️ まとめ買い費用(¥${cost.toLocaleString()})が足りません！`);
  }
  state.money -= cost;
  state.monthStats.cost += cost;
  p.stock += 30;
  SFX.cash();
  setTicker(`🚚 ${p.name}を卸値10%OFFで30個仕入れました！(-¥${cost.toLocaleString()})`);
  renderPriceTab();
  updateHUD();
}

function renderStaffTab() {

  const maxS = RANKS[state.rankIdx].maxStaff;

  let html = `
    <div style="display:flex; gap:6px;">
      <button class="kairo-btn ${state.staffSubTab==='manage'?'btn-orange':'btn-cream'}" style="flex:1;" onclick="state.staffSubTab='manage'; renderStaffTab();">
        📋 店員管理 (${currentS}/${maxS}人)
      </button>
      <button class="kairo-btn ${state.staffSubTab==='recruit'?'btn-blue':'btn-cream'}" style="flex:1;" onclick="state.staffSubTab='recruit'; renderStaffTab();">
        📢 求人募集 (${candidateList.length}名)
      </button>
    </div>

function expandStore() {
  const cost = expCostOf(state.expansionLevel);
  if (state.money < cost || state.expansionLevel >= MAX_EXP || state.rankIdx < expReqOf(state.expansionLevel)) return;
  state.money -= cost;
  state.expansionLevel++;
  const gone = placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'neighbor' && o.x <= getStoreBounds().maxX);
  gone.forEach(o => { state.money += FACILITY_TYPES[o.type].cost; });
  if (gone.length) { const fx = placedObjects.filter(q => FACILITY_TYPES[q.type].cat === 'fixture' && gone.some(g => hostedBy(g, q))); fx.forEach(q => { state.money += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); }); placedObjects = placedObjects.filter(o => !gone.includes(o) && !fx.includes(o)); }
  recalcCombos(true);
  SFX.fanfare();
  setTicker('🎉 店舗の増築工事が完了！フロアが広くなりました！');
  updateHUD();
  renderManageTab();
}

function startCampaign() {
  if (state.points < 25 || state.campaignTimer > 0) return;
  state.points -= 25;
  state.campaignTimer = 30;
  SFX.combo();
  setTicker('📣 駅前チラシ配りキャンペーン開始！お客さんが続々来店します！');
  updateHUD();
  renderManageTab();
}

let lastT = performance.now();
let uiTimer = 0;

function gameLoop(now) {
  const rawDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!state.paused) {
    const dt = rawDt * state.speed;
    updateStaffAI(dt);
    updateCustomers(dt);
    updateRegisters(dt);
    updateCalendarAndEconomy(dt);

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 22 * dt;
      floatingTexts[i].life -= dt;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }

    uiTimer += rawDt;
    if (uiTimer >= 0.35) {
      uiTimer = 0;
      updateHUD();
      // 価格タブはスライダー操作を阻害しないよう在庫数とラベルのみ更新、他タブも必要な時だけ更新
      if (state.activeDock === 'price') {
        Object.values(products).forEach(p => {
          const el = document.getElementById('pstock-' + p.id);
          if (el) el.textContent = `在庫: ${p.stock}`;
        });
      } else {
        const sg = tabSig();
        if (sg !== lastSig) { lastSig = sg; refreshAllTabs(); }
      }
    }
  }

  view3D ? draw3D() : draw();
  requestAnimationFrame(gameLoop);
}

let lastSig = '';
function tabSig() {
  const a = state.activeDock, m = state.money, pt = state.points;
  if (a === 'build') return [state.rankIdx, ...Object.values(FACILITY_TYPES).map(d => m >= d.cost ? 1 : 0)].join('');
  if (a === 'back') return [state.rankIdx, ...Object.values(BACK_EQUIP).map(e => (equipLv[e.id] || 0) + (m >= equipUpCost(e) ? 'y' : 'n'))].join('');
  if (a === 'staff') return [state.rankIdx, hiredStaff.length, candidateList.length, ...candidateList.map(c => m >= c.hireCost ? 1 : 0), ...hiredStaff.map(x => pt >= 10 + x.level * 5 ? 1 : 0)].join('');
  return [state.rankIdx, Math.floor(state.totalRevenue / 100), m >= 6000 ? 1 : 0, m >= 15000 ? 1 : 0, pt >= 25 ? 1 : 0, Math.ceil(state.campaignTimer), state.discoveredCombos.size, state.expansionLevel].join('|');
}

// =========================================================
// IndexedDB オートセーブ
// =========================================================
const DB_NAME = 'mycombini_dx', STORE = 'save', SAVE_KEY = 'main';
let dbp = null, ready = false, saving = false;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB非対応'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
function idbOp(mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const rq = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
function snapshot() {
  return JSON.parse(JSON.stringify({
    v: 2, savedAt: Date.now(), curStore,
    stores: (packStore(), stores.map(sx => ({ name: sx.name, sign: sx.sign, expansionLevel: sx.expansionLevel, nextObjUid: sx.nextObjUid, nextStaffId: sx.nextStaffId, candidateList: sx.candidateList, placedObjects: sx.placedObjects.map(o => ({ ...o, queue: [] })), hiredStaff: sx.hiredStaff.map(x => ({ ...x, path: [], carry: null, targetObjId: null })) }))),
    state: { ...state, discoveredCombos: [...state.discoveredCombos], buildMode: null, selectedObjId: null },
    placedObjects: placedObjects.map(o => ({ ...o, queue: [] })),
    nextObjUid,
    hiredStaff: hiredStaff.map(s => ({ ...s, path: [], carry: null, targetObjId: null })),
    candidateList, nextStaffId,
    products: Object.fromEntries(Object.values(products).map(p => [p.id, { price: p.price, quality: p.quality, stock: p.stock, onSale: p.onSale }])),
    equipLv, soundOn
  }));
}
async function saveGame(manual = false) {
  if (!ready || saving) return;
  saving = true;
  try {
    await idbOp('readwrite', s => s.put(snapshot(), SAVE_KEY));
    const b = document.getElementById('btn-save');
    if (b) { b.textContent = '✅'; setTimeout(() => { b.textContent = '💾'; }, 900); }
    if (manual) setTicker('💾 セーブしました！（8秒ごとにオートセーブされます）');
  } catch (e) {
    if (manual) setTicker('⚠️ セーブに失敗しました。ブラウザの保存設定を確認してください。');
  }
  saving = false;
}
async function loadGame() {
  try {
    let d = await idbOp('readonly', s => s.get(SAVE_KEY));
    d = normalizeSave(d);
    if (!d || d.v < 1) return false;
    Object.assign(state, d.state, { discoveredCombos: new Set(d.state.discoveredCombos || []), buildMode: null, selectedObjId: null, paused: false, activeDock: 'build' });
    placedObjects = d.placedObjects.filter(o => FACILITY_TYPES[o.type]).map(o => ({ ...o, queue: [] }));
    nextObjUid = d.nextObjUid;
    hiredStaff = d.hiredStaff.map(s => ({ ...s, x: (s.isManager ? 4.5 : 2.5) * TILE, y: (s.isManager ? 3.5 : 2.5) * TILE, path: [], carry: null, cooldown: 0, targetObjId: null }));
    if (d.candidateList && d.candidateList.length) candidateList = d.candidateList;
    nextStaffId = d.nextStaffId;
    if (d.stores && d.stores.length) {
      stores.length = 0;
      d.stores.forEach(sx => stores.push({ ...sx, customers: [], passers: [], dirts: [],
        placedObjects: sx.placedObjects.filter(o => FACILITY_TYPES[o.type]).map(o => ({ ...o, queue: [] })),
        hiredStaff: sx.hiredStaff.map(x => ({ ...x, x: (x.isManager ? 4.5 : 2.5) * TILE, y: (x.isManager ? 3.5 : 2.5) * TILE, path: [], carry: null, cooldown: 0, targetObjId: null })) }));
      curStore = Math.min(d.curStore || 0, stores.length - 1);
      applyStore(stores[curStore]);
    }
    Object.entries(d.products || {}).forEach(([id, v]) => { if (products[id]) Object.assign(products[id], v); });
    Object.assign(equipLv, d.equipLv || {});
    if (typeof d.soundOn === 'boolean') soundOn = d.soundOn;
    ensureBackyard();
    recalcCombos(true);
    return true;
  } catch (e) { return false; }
}
async function resetGame() {
  if (!confirm('セーブデータを消して最初から始めます。よろしいですか？')) return;
  ready = false;
  try { await idbOp('readwrite', s => s.delete(SAVE_KEY)); } catch (e) {}
  location.reload();
}
// ---- 旧バージョン対応：形式ゆれを補完して読み込む ----
function normalizeSave(d) {
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { return null; } }
  if (!d || typeof d !== 'object') return null;
  for (const k of ['save', 'data', 'payload', 'gameData']) if (d[k] && typeof d[k] === 'object' && !d.state && !d.placedObjects) d = d[k];
  if (!d.state && typeof d.money === 'number') d.state = { money: d.money, totalRevenue: d.totalRevenue, points: d.points, rating: d.rating, rankIdx: d.rankIdx, year: d.year, month: d.month, week: d.week, totalCustomers: d.totalCustomers, expansionLevel: d.expansionLevel };
  if (!d.state || typeof d.state !== 'object') return null;
  d = JSON.parse(JSON.stringify(d));
  d.v = d.v || 1;
  d.state.discoveredCombos = Array.isArray(d.state.discoveredCombos) ? d.state.discoveredCombos : [];
  const objs = a => (Array.isArray(a) ? a : []).filter(o => o && FACILITY_TYPES[o.type]).map((o, i) => ({ stock: 0, progress: 0, ...o, uid: o.uid ?? (9000 + i), x: o.x | 0, y: o.y | 0 }));
  const staff = a => { a = (Array.isArray(a) ? a : []).filter(Boolean); if (!a.some(s => s.isManager)) a.unshift(makeManager()); return a; };
  const nextUid = a => a.reduce((m, o) => Math.max(m, +o.uid || 0), 0) + 1;
  const nextSid = (a, v) => v || a.reduce((m, s) => Math.max(m, +s.id || 0), 0) + 1;
  d.placedObjects = objs(d.placedObjects); d.hiredStaff = staff(d.hiredStaff);
  d.nextObjUid = Math.max(d.nextObjUid || 1, nextUid(d.placedObjects)); d.nextStaffId = nextSid(d.hiredStaff, d.nextStaffId);
  d.candidateList = Array.isArray(d.candidateList) ? d.candidateList : [];
  d.products = d.products || {}; d.equipLv = d.equipLv || {};
  if (Array.isArray(d.stores) && d.stores.length) {
    d.stores = d.stores.map(sx => { const po = objs(sx.placedObjects), hs = staff(sx.hiredStaff);
      return { name: '店', expansionLevel: 0, candidateList: [], ...sx, placedObjects: po, hiredStaff: hs, nextObjUid: Math.max(sx.nextObjUid || 1, nextUid(po)), nextStaffId: nextSid(hs, sx.nextStaffId) }; });
    d.curStore = Math.min(d.curStore | 0, d.stores.length - 1);
  } else d.stores = null;
  return d;
}
function exportSave() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(snapshot())], { type: 'application/json' }));
  a.download = `mycombini_dx_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(raw) {
  const d = normalizeSave(raw);
  if (!d) { alert('セーブデータとして読み込めませんでした。'); return; }
  if (!confirm(`いまのデータを上書きして読み込みます。\n（読み込むデータ: 所持金 ¥${(d.state.money || 0).toLocaleString()} / 設備 ${d.placedObjects.length}個）\nよろしいですか？`)) return;
  ready = false;
  try { d.savedAt = Date.now(); await idbOp('readwrite', s => s.put(d, SAVE_KEY)); location.reload(); }
  catch (e) { ready = true; alert('保存に失敗しました。'); }
}
function importFromFile(inp) { const f = inp.files && inp.files[0]; if (f) f.text().then(importData); }
function importFromText() { importData(document.getElementById('imp-text').value.trim()); }
function openImportModal() {
  openModal('📂 セーブの書き出し／読み込み', `
    <div style="font-size:12px;line-height:1.6">旧バージョンのセーブデータも読み込めます（足りない項目は自動で補います）。読み込み前に、いまのデータを書き出しておくと安心です。</div>

  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key.startsWith('Arrow')) { keys[e.key] = true; e.preventDefault(); }

function mgrOK(px, py) { const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE); return ty <= 10 && isWalkableForPath(tx, ty); }
function manualMove(st, dt, spd) {
  const L = keys.ArrowLeft, R = keys.ArrowRight, U = keys.ArrowUp, D = keys.ArrowDown;
  if (!(L || R || U || D)) return false;
  st.path = [];
  let dx, dy;
  if (view3D) {
    mgrAng += ((L ? 1 : 0) - (R ? 1 : 0)) * 2.2 * dt * -1;
    const f = (U ? 1 : 0) - (D ? 1 : 0);
    dx = Math.cos(mgrAng) * f; dy = Math.sin(mgrAng) * f;

  if (stuck || mgrOK(nx, st.y)) st.x = nx;
  if (stuck || mgrOK(st.x, ny)) st.y = ny;
  st.bounce += dt * 12;
  for (let i = dirts.length - 1; i >= 0; i--) {
    if (Math.hypot(st.x - dirts[i].x, st.y - dirts[i].y) < 22) {
      dirts.splice(i, 1); state.rating = Math.min(5.0, state.rating + 0.02); addFloatText(st.x, st.y - 18, '✨掃除!', '#2cb67d');
    }

}

function draw3D() {
  const W = c3.width, H = c3.height, me = hiredStaff[0], FOV = 1.05;
  const px = me.x / TILE, py = me.y / TILE;
  x3.fillStyle = '#efe7cf'; x3.fillRect(0, 0, W, H / 2);
  x3.fillStyle = '#cdb98a'; x3.fillRect(0, H / 2, W, H / 2);
  const zb = new Array(W).fill(99);
  for (let i = 0; i < W; i++) {
    const a = mgrAng + (i / W - 0.5) * FOV, rx = Math.cos(a), ry = Math.sin(a);
    let mx = Math.floor(px), my = Math.floor(py);
    const ddx = Math.abs(1 / (rx || 1e-9)), ddy = Math.abs(1 / (ry || 1e-9));
    const sx = rx < 0 ? -1 : 1, sy = ry < 0 ? -1 : 1;
    let sdx = (rx < 0 ? px - mx : mx + 1 - px) * ddx, sdy = (ry < 0 ? py - my : my + 1 - py) * ddy;
    let side = 0, hit = null, d = 0;
    for (let n = 0; n < 40 && !hit; n++) {
      if (sdx < sdy) { d = sdx; sdx += ddx; mx += sx; side = 0; } else { d = sdy; sdy += ddy; my += sy; side = 1; }
      hit = wall3(mx, my);
    }
    d = Math.max(0.05, d * Math.cos(a - mgrAng)); zb[i] = d;
    if (!hit) continue;
    const h = Math.min(H * 1.5, H / d * 0.9), y0 = (H - h) / 2;

    x3.fillStyle = 'rgba(0,0,0,' + (1 - Math.max(0.3, 1 - d / 12) * (side ? 0.8 : 1)).toFixed(2) + ')'; x3.fillRect(i, y0, 1, h);
  }

  sp.map(q => { const dx = q.x / TILE - px, dy = q.y / TILE - py; return { ...q, dist: Math.hypot(dx, dy), ang: Math.atan2(dy, dx) }; })
    .sort((a, b) => b.dist - a.dist).forEach(q => {

      for (let i = Math.floor(sxp - w / 2); i < sxp + w / 2; i++) {
        if (i < 0 || i >= W || zb[i] < dd) continue;
        x3.fillStyle = q.c; x3.fillRect(i, y0 + h * 0.3, 1, h * 0.7);
        x3.fillStyle = '#fde68a'; x3.fillRect(i, y0, 1, h * 0.3);
      }
    });

  x3.fillStyle = '#fff'; x3.font = '10px sans-serif'; x3.textAlign = 'left'; x3.textBaseline = 'middle';
  x3.fillText(`👁 店長視点 ｜ ←→回転 ↑↓移動 Vで戻る ｜ 💰¥${state.money.toLocaleString()} 客${customers.length}人`, 6, H - 8);

    ['fx_showcase', 'ケーキショーケース', '🍰', 1200, 80, 0.010, [C, B], '#fce7f3', '甘い誘惑のショーケース'],
    ['fx_piano', 'グランドピアノ', '🎹', 1800, 110, 0.014, [C], '#e2e8f0', '生演奏で評判UP'],
    ['fx_breadrack', 'パン棚', '🥖', 600, 45, 0.006, [B], '#fcd34d', '焼きたてを並べる棚'],

  ].forEach(([type, name, icon, cost, income, traffic, hosts, color, desc]) => {
    FACILITY_TYPES[type] = { type, cat: 'fixture', name, icon, cost, income, traffic, hosts, color, blink: hosts && hosts[0] === G,
      desc: `［${hosts ? hosts.map(h => H[h]).join('・') + '用' : 'どのお店でもOK'}］${desc}` };

// =========================================================
// わかりやすいツールチップ
// =========================================================
const tipEl = document.createElement('div');
tipEl.id = 'tip';
document.body.appendChild(tipEl);
function tipAttr(t) { return 'data-tip="' + String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"'; }
function showTip(txt, x, y) {
  if (!txt) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = txt; tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(4, Math.min(x + 14, innerWidth - w - 6)) + 'px';
  tipEl.style.top = (y + 18 + h > innerHeight ? Math.max(4, y - h - 12) : y + 18) + 'px';
}
function facilityTip(d) {
  let t = `${d.icon} ${d.name}　¥${d.cost.toLocaleString()}\n${d.desc}`;
  if (d.cat === 'shelf') t += `\n売る商品: ${products[d.prod].name}（最大${d.maxCap}個陳列）\n店内でも屋外でも置けます`;
  else if (d.cat === 'register') t += '\n店内専用。上側に店員が立つ1マスが必要です';
  else if (d.cat === 'fixture') t += `\n毎週の収入 +¥${d.income}（評判で増減）／通行人 +${(d.traffic * 100).toFixed(1)}%\nお隣の店の中の床マスに置けます（金色の枠が置ける場所）`;
  else if (d.cat === 'neighbor') t += `\n中に内装設備を置けます（クリックで床色も変更可）`;
  if (d.cat === 'neighbor') t += `\n屋外(芝生)専用／毎週の家賃 +¥${d.rent}／通行人 +${Math.round(d.traffic * 100)}%\n店を広げて店内に入ると、返金して撤去されます`;
  else if (d.cat === 'block') t += '\n通れない壁。通路の仕切りや外構に。設備への道は塞げません';
  else if (DECOR_BONUS[d.type]) t += `\n隣の商品棚の魅力 +${Math.round(DECOR_BONUS[d.type] * 100)}%（店内・屋外OK）`;
  const cs = COMBO_DEFS.filter(c => c.a === d.type || c.b === d.type);
  if (cs.length) t += '\n【隣に置くとコンボ】\n' + cs.map(c => { const o = FACILITY_TYPES[c.a === d.type ? c.b : c.a]; return `・${o.icon}${o.name} → ${c.name} (${c.desc.split('：')[1]})`; }).join('\n');
  return t;
}
function objTip(o) {
  const d = FACILITY_TYPES[o.type];
  let t = `${d.icon} ${d.name}（${inYard(o.x, o.y) ? '屋外' : '店内'}）\n${d.desc}`;
  if (d.cat === 'shelf') {
    const p = products[d.prod];
    t += `\n陳列 ${o.stock}/${d.maxCap}個／売値 ¥${getEffectivePrice(p)}（原価 ¥${getUnitCost(p)}）\n今の魅力ボーナス +${Math.round((state.comboBonusByProd[d.prod] || 0) * 100)}%`;
  }
  if (d.cat === 'fixture') t += `\n毎週 +¥${fxIncome(o)}`;
  if (d.cat === 'neighbor') t += `\n家賃 毎週+¥${d.rent}／通行人 +${Math.round(d.traffic * 100)}%`;
  const cs = COMBO_DEFS.filter(c => c.a === o.type || c.b === o.type);
  if (cs.length) t += '\n隣に置くとコンボ: ' + cs.slice(0, 3).map(c => FACILITY_TYPES[c.a === o.type ? c.b : c.a].name).join('・') + (cs.length > 3 ? ' ほか' : '');
  return t + (o.inCombo ? '\n✨ コンボ成立中！' : '') + '\n（クリックで移動・撤去）';
}
function setTips() {
  const T = {
    'hud-rank': 'ランク: 累計売上で上がります。上がると新商品・設備・店員枠・店舗拡張が開放されます',
    'hud-date': '1か月=4週。月末に収支決算が出ます。毎週、家賃収入や仕入が発生します',
    'hud-money': '所持金。仕入・設備・給料・拡張工事に使います',
    'hud-pt': '経営P: 研修・品質UP・キャンペーンに使います。コーナー(コンボ)発見やイートインで増えます',
    'hud-rating': '評判: 高いほど来客が増えます。品切れ・行列・ゴミで下がり、掃除や接客で上がります',
    'hud-cust': '今、店にいるお客さんの数',
    'btn-sound': 'サウンドのON/OFF',
    'btn-save': '今すぐセーブ（8秒ごとに自動保存されています）',
    'store-sel': '店舗の切り替え。表示中の店だけ接客し、他の店は週ごとに自動で収益が入ります',
    'btn-newstore': '新しい店舗を建てます。費用は店が増えるごとに倍になります',
    'btn-3d': '店長視点(3D)に切り替え。Vキーでも切り替えられます。←→で向き、↑↓で移動'
  };
  Object.entries(T).forEach(([id, t]) => { const e = document.getElementById(id); if (e) e.dataset.tip = t; });
  const r = document.querySelector('[onclick="resetGame()"]'); if (r) r.dataset.tip = 'セーブデータを消して最初から始めます';
  const tabs = ['🏗️ 棚・装飾・ブロック・お隣の店を置く／動かす。屋外の芝生にも置けます', '💰 売値・特売・品質UPを設定。価格は上限なし', '👥 雇う・研修で強化・役割(レジ/品出し/掃除)を決める', '🏆 ランク・店舗拡張・キャンペーン・発見したコーナー図鑑', '🏭 設備を導入すると商品の仕入原価が下がります'];
  document.querySelectorAll('.dock-tab').forEach((b, i) => { if (tabs[i]) b.dataset.tip = tabs[i]; });
}
document.addEventListener('mousemove', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t) return showTip(t.dataset.tip, e.clientX, e.clientY);
  if (e.target === canvas && hoverTile) {
    const { x, y } = hoverTile;
    if (state.buildMode) {
      const c = canPlaceSafely(state.buildMode.type, x, y, state.buildMode.moveUid);
      return showTip(c.ok ? '✅ ここに置けます（クリックで設置）' : '⚠️ ' + c.reason, e.clientX, e.clientY);
    }
    const o = objAt(x, y);
    if (o) return showTip(objTip(o), e.clientX, e.clientY);
    if (inYard(x, y)) return showTip('🌳 屋外エリア\n棚・装飾・ブロック・お隣の店を置けます\n（レジとバックヤードは店内専用）', e.clientX, e.clientY);
    if ((x === 5 || x === 6) && y === 10) return showTip('🚪 自動ドア\nお客さんの出入口。手前のマスは空けておきます', e.clientX, e.clientY);
  }
  showTip(null);
});
window.addEventListener('blur', () => showTip(null));

// 初期化実行
initDefaultStore();
refreshCandidates(true);
loadGame().then(loaded => {
  ready = true;
  setTips();
  refreshStoreUI();
  updateHUD();
  refreshAllTabs();
  if (loaded) setTicker('💾 前回のセーブデータから再開しました！');
  requestAnimationFrame(gameLoop);
});
</script>
