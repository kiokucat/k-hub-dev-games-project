<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開拓！マイコンビニDX - カイロ風経営シミュレーション</title>
<style>
  :root {
    --bg-outer: #2c2638;
    --panel-bg: #fffdf5;
    --panel-inner: #f7f1e1;
    --border-dark: #3b2d22;
    --accent-blue: #2596be;
    --accent-blue-dark: #196b88;
    --accent-orange: #f58220;
    --accent-orange-dark: #c96008;
    --accent-green: #2cb67d;
    --accent-green-dark: #1e875b;
    --accent-red: #e5484d;
    --accent-gold: #f5b700;
    --text-main: #3b2d22;
    --text-muted: #7a6a5c;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 10px;
    background: var(--bg-outer);
    background-image: radial-gradient(#3f3750 1px, transparent 1px);
    background-size: 16px 16px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* カイロ風ゲーム枠クラス */
  .kairo-box {
    background: var(--panel-bg);
    border: 3px solid var(--border-dark);
    border-radius: 10px;
    box-shadow: inset 0 0 0 2px #ffffff, 0 4px 0 #1a1410;
  }

  .kairo-btn {
    font-family: inherit;
    font-weight: 800;
    border: 2px solid var(--border-dark);
    border-radius: 7px;
    cursor: pointer;
    padding: 6px 10px;
    font-size: 12px;
    color: #ffffff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 3px 0 var(--border-dark);
    transition: transform 0.08s, box-shadow 0.08s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .kairo-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 1px 0 var(--border-dark);
  }
  .kairo-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(40%);
  }

  .btn-blue { background: var(--accent-blue); }
  .btn-orange { background: var(--accent-orange); }
  .btn-green { background: var(--accent-green); }
  .btn-red { background: var(--accent-red); }
  .btn-gold { background: #eab308; color: #3b2d22; text-shadow: none; }
  .btn-cream { background: #efe6d0; color: var(--text-main); text-shadow: none; }
  .btn-active { outline: 3px solid var(--accent-gold); background: #d97706 !important; }

  /* 上部HUD */
  .top-hud {
    width: 100%;
    max-width: 1240px;
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fffdf5 0%, #f5ebd6 100%);
  }

  .store-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rank-tag {
    background: var(--accent-orange);
    color: white;
    border: 2px solid var(--border-dark);
    border-radius: 6px;
    padding: 3px 8px;
    font-weight: 900;
    font-size: 13px;
    box-shadow: 0 2px 0 var(--border-dark);
  }
  .store-title {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .hud-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .hud-pill {
    background: #ffffff;
    border: 2px solid var(--border-dark);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: inset 0 2px 0 #f1e8d3;
  }
  .pill-money { color: #15803d; min-width: 115px; }
  .pill-money.minus { color: var(--accent-red); }
  .pill-pt { color: #7e22ce; }
  .pill-rating { color: #b45309; }

  .hud-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* ニュースティッカー */
  .ticker-bar {
    width: 100%;
    max-width: 1240px;
    background: #1e293b;
    color: #fde047;
    border: 3px solid var(--border-dark);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 3px 0 #1a1410;
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker-label {
    background: #ef4444;
    color: white;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 900;
    flex-shrink: 0;
  }

  /* メイン領域 */
  .main-grid {
    width: 100%;
    max-width: 1240px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  /* キャンバスコンテナ */
  .stage-wrap {
    flex: 1;
    min-width: 0;
    padding: 8px;
    position: relative;
    background: #473b31;
  }

  canvas {
    width: 100%;
    height: auto;
    border: 2px solid var(--border-dark);
    border-radius: 6px;
    display: block;
    background: #8fd175;
    cursor: pointer;
    image-rendering: pixelated;
  }

  /* 建築モード中バナー */
  .build-banner {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 41, 59, 0.94);
    color: white;
    border: 2px solid var(--accent-gold);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 800;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 20;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .build-banner.show { display: flex; }

  /* キャンバス内クイックインスペクター */
  .inspector-popup {
    position: absolute;
    bottom: 18px;
    left: 18px;
    width: 270px;
    padding: 10px;
    display: none;
    z-index: 25;
    background: #fffdf5;
  }
  .inspector-popup.show { display: block; }

  /* 右側コマンドパネル */
  .side-dock {
    width: 400px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: 540px;
    overflow: hidden;
  }

  .dock-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #e2d5b7;
    border-bottom: 3px solid var(--border-dark);
    padding: 4px 4px 0 4px;
    gap: 3px;
  }

  .dock-tab {
    background: #cbbba0;
    border: 2px solid var(--border-dark);
    border-bottom: none;
    border-radius: 7px 7px 0 0;
    padding: 8px 4px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 900;
    color: #4a3b2c;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .dock-tab.active {
    background: var(--panel-bg);
    color: var(--accent-orange-dark);
    padding-bottom: 10px;
    margin-bottom: -3px;
    position: relative;
    z-index: 2;
  }

  .dock-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: var(--panel-inner);
  }

  .tab-pane { display: none; flex-direction: column; gap: 8px; }
  .tab-pane.active { display: flex; }

  /* サブタブ・見出しリボン */
  .ribbon-title {
    background: var(--accent-blue);
    color: white;
    border: 2px solid var(--border-dark);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 900;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 0 var(--border-dark);
  }

  /* カードデザイン */
  .item-card {
    background: #ffffff;
    border: 2px solid var(--border-dark);
    border-radius: 8px;
    padding: 8px 10px;
    box-shadow: 0 2px 0 #cbbba0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .item-card.locked { background: #f1ece1; border-style: dashed; }
  .item-card.sale-active { border-color: #ef4444; background: #fff5f5; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .card-name {
    font-weight: 900;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .badge {
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border-dark);
  }
  .badge-cheap { background: #dcfce7; color: #166534; }
  .badge-fair { background: #e0f2fe; color: #075985; }
  .badge-high { background: #fef3c7; color: #92400e; }
  .badge-ripoff { background: #fee2e2; color: #991b1b; }
  .badge-sale { background: #ef4444; color: white; border-color: #991b1b; }

  /* 能力ゲージバー */
  .stat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
  }
  .stat-label { width: 46px; color: var(--text-muted); }
  .bar-bg {
    flex: 1;
    height: 8px;
    background: #e2d5b7;
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; transition: width 0.25s; }

  /* スライダー */
  .price-slider-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f8f4ea;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #d6c8ad;
  }
  input[type=range] {
    flex: 1;
    accent-color: var(--accent-orange);
    cursor: pointer;
  }

  /* モーダル（月次決算 / ランクアップ / コーナー達成） */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 28, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }

  .modal-window {
    width: 100%;
    max-width: 440px;
    padding: 0;
    overflow: hidden;
    animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-header {
    background: var(--accent-orange);
    color: white;
    padding: 10px 14px;
    font-size: 16px;
    font-weight: 900;
    border-bottom: 3px solid var(--border-dark);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--panel-bg);
    max-height: 75vh;
    overflow-y: auto;
  }
  .ledger-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 0;
    border-bottom: 1px dashed #d6c8ad;
  }
  .ledger-total {
    font-size: 16px;
    font-weight: 900;
    border-top: 2px solid var(--border-dark);
    border-bottom: none;
    padding-top: 8px;
  }

  /* スクロールバー装飾 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #e8dec8; border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: #a8967a; border-radius: 4px; border: 1px solid var(--border-dark); }

  @media (max-width: 1060px) {
    .main-grid { flex-direction: column; }
    .side-dock { width: 100%; height: 460px; }
  }

:root{--bg-outer:#1b2434;--panel-bg:#fbfaf6;--panel-inner:#f1eee6;--border-dark:#26303f;--accent-blue:#2f7fd1;--accent-orange:#ee7b30;--accent-green:#2fa77a;--accent-red:#dc4b52;--text-main:#26303f;--text-muted:#6b7686}
body{background:radial-gradient(1200px 600px at 20% -10%,#2b3b57,transparent),var(--bg-outer);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
.kairo-box{border:2px solid var(--border-dark);border-radius:16px;box-shadow:0 10px 24px rgba(8,12,22,.35),inset 0 0 0 1px rgba(255,255,255,.7)}
.kairo-btn{border:0;border-radius:10px;padding:7px 12px;text-shadow:none;box-shadow:0 2px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.kairo-btn:hover:not(:disabled){filter:brightness(1.07)}
.kairo-btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn-cream{background:#e9e4d6;color:var(--text-main)}
.btn-active{outline:2px solid #ffd45c;outline-offset:1px}
.top-hud{background:linear-gradient(180deg,#fff,#efebe0)}
.hud-pill{border:0;border-radius:999px;padding:5px 12px;box-shadow:inset 0 0 0 1px #d8d2c2}
.rank-tag{border:0;border-radius:8px;background:linear-gradient(135deg,#ff9a4d,#ee6a1f);box-shadow:none}
.ticker-bar{border:0;border-radius:12px;background:#111a28;box-shadow:inset 0 0 0 1px #2c3a52}
.stage-wrap{background:#2a3446}
canvas{border:0;border-radius:10px}
.dock-tabs{grid-template-columns:repeat(5,1fr);background:#dcd6c6;border-bottom:2px solid var(--border-dark);gap:4px;padding:6px 6px 0}
.dock-tab{border:0;border-radius:10px 10px 0 0;background:#c9c2b0;font-size:10px}
.dock-tab.active{background:var(--panel-bg);color:#c25a14}
.item-card{border:1px solid #d6d0c0;border-radius:12px;box-shadow:0 1px 2px rgba(30,30,30,.08)}
.item-card.eq-owned{border-color:#2fa77a;background:#f2fbf6}
.ribbon-title{border:0;border-radius:10px;background:linear-gradient(90deg,#2f7fd1,#4a97e6);box-shadow:none}
.modal-header{background:linear-gradient(90deg,#ee7b30,#f59a4a);text-shadow:none}
.bar-bg{border:0;background:#e3ddcc}
canvas#view3d{background:#222;cursor:default}
select.kairo-btn{max-width:110px}
#tip{position:fixed;z-index:9999;max-width:270px;background:#1b2434;color:#fff;border:2px solid #ffd45c;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.55;pointer-events:none;display:none;white-space:pre-line;box-shadow:0 6px 16px rgba(0,0,0,.4)}
input,textarea{user-select:text}
html,body{height:100%;overflow:hidden}
body{padding:0;display:block;min-height:0}
.main-grid{display:block;max-width:none;width:auto}
.stage-wrap{position:fixed;inset:0;flex:none;height:auto;padding:0;border:0;border-radius:0;box-shadow:none;background:#86efac;z-index:1}
canvas#gameCanvas{position:absolute;inset:0;width:100%;height:100%;border-radius:0;touch-action:none;image-rendering:auto;cursor:grab}
canvas#view3d{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:0;background:#222}
.top-hud{position:fixed;top:8px;left:8px;right:8px;width:auto;max-width:none;margin:0;z-index:30;padding:6px 12px}
.ticker-bar{position:fixed;left:8px;right:8px;top:80px;width:auto;max-width:none;margin:0;z-index:29}
.side-dock{position:fixed;right:8px;bottom:8px;top:var(--ui-top,120px);width:min(400px,calc(100vw - 16px));height:auto;z-index:28;transition:transform .22s ease;background:rgba(251,250,246,.95)}
.side-dock.hidden{transform:translateX(calc(100% + 24px));pointer-events:none}
.cam-bar{position:fixed;left:12px;top:var(--ui-top,120px);display:flex;flex-direction:column;gap:6px;z-index:27}
.build-banner{position:fixed;top:var(--ui-top,120px);z-index:27}
@media (max-width:760px){
.top-hud{padding:4px 8px;gap:4px}.store-title{display:none}.hud-stats,.hud-controls{gap:4px}
.hud-pill{font-size:11px;padding:3px 8px}.pill-money{min-width:0}
.side-dock{left:8px;right:8px;width:auto;top:auto;height:46vh}
.side-dock.hidden{transform:translateY(calc(100% + 24px))}
.inspector-popup{left:60px;right:8px;width:auto;bottom:auto;top:var(--ui-top,120px)}}
</style>
</head>
<body>

  <!-- 上部HUD -->
  <header class="top-hud kairo-box" id="hud">
    <div class="store-badge">
      <span class="rank-tag" id="hud-rank">ランク F</span>
      <span class="store-title">開拓！マイコンビニDX</span>
    </div>

    <div class="hud-stats">
      <div class="hud-pill" id="hud-date">📅 1年目 4月 第1週 ☀️</div>
      <div class="hud-pill pill-money" id="hud-money">💰 ¥15,000</div>
      <div class="hud-pill pill-pt" id="hud-pt">✨ 経営P: 30</div>
      <div class="hud-pill pill-rating" id="hud-rating">♥ 評判 3.2</div>
      <div class="hud-pill" id="hud-cust">👥 客 0</div>
    </div>

    <div class="hud-controls">
      <button class="kairo-btn btn-cream" id="btn-pause" onclick="togglePause()">⏸</button>
      <button class="kairo-btn btn-blue" id="btn-spd1" onclick="setSpeed(1)">1x</button>
      <button class="kairo-btn btn-cream" id="btn-spd2" onclick="setSpeed(2)">2x</button>
      <button class="kairo-btn btn-cream" id="btn-spd3" onclick="setSpeed(3)">3x</button>
      <button class="kairo-btn btn-cream" id="btn-sound" onclick="toggleSound()">🔊</button>
      <button class="kairo-btn btn-cream" id="btn-save" onclick="saveGame(true)" title="今すぐセーブ">💾</button>
      <button class="kairo-btn btn-cream" onclick="openSignEditor()" title="店の看板を編集（マップ上の看板クリックでもOK）">🪧</button>
      <button class="kairo-btn btn-cream" onclick="openImportModal()" title="セーブの書き出し／旧バージョンのデータ読み込み">📂</button>
      <button class="kairo-btn btn-cream" onclick="resetGame()" title="データを消して最初から">🗑</button>
      <select id="store-sel" class="kairo-btn btn-cream" onchange="switchStore(+this.value)"></select>
      <button class="kairo-btn btn-blue" id="btn-newstore" onclick="buildNewStore()">🏬新店</button>
      <button class="kairo-btn btn-gold" id="btn-3d" onclick="toggle3D()" title="店長視点(Vキー)">👁3D</button>
    </div>
  </header>

  <!-- ニュースティッカー -->
  <div class="ticker-bar" id="ticker-bar">
    <span class="ticker-label">街の声</span>
    <span id="ticker-text">新しいコンビニがオープンしました！棚を並べてお客さんを迎えよう！</span>
  </div>

  <!-- メインエリア -->
  <div class="main-grid">
    <!-- 左：店舗マップ -->
    <div class="stage-wrap kairo-box">
      <div class="build-banner" id="build-banner">
        <span id="build-banner-msg">🏗️ 配置したい場所をクリック！</span>
        <button class="kairo-btn btn-red" style="padding: 3px 10px; font-size: 11px;" onclick="cancelBuildMode()">✖ キャンセル</button>
      </div>

      <div class="cam-bar"><button class="kairo-btn btn-cream" onclick="zoomBtn(1.25)" title="拡大">＋</button><button class="kairo-btn btn-cream" onclick="zoomBtn(0.8)" title="縮小">－</button><button class="kairo-btn btn-cream" onclick="camHome()" title="自分の店へ">🏪</button><button class="kairo-btn btn-cream" onclick="toggleDock()" title="メニュー表示切替">📋</button></div>
      <canvas id="gameCanvas" width="1320" height="520"></canvas>
      <canvas id="view3d" width="420" height="260" style="display:none;image-rendering:pixelated"></canvas>

      <!-- マップ内アイテムクリック時のクイックカード -->
      <div class="inspector-popup kairo-box" id="inspector-popup"></div>
    </div>

    <!-- 右：カイロ風コマンドドック -->
    <aside class="side-dock kairo-box" id="side-dock">
      <div class="dock-tabs">
        <button class="dock-tab active" onclick="switchDock('build', this)"><span>🏗️</span><span>建築・配置</span></button>
        <button class="dock-tab" onclick="switchDock('price', this)"><span>💰</span><span>商品・価格</span></button>
        <button class="dock-tab" onclick="switchDock('staff', this)"><span>👥</span><span>店員・求人</span></button>
        <button class="dock-tab" onclick="switchDock('manage', this)"><span>🏆</span><span>経営・図鑑</span></button>
        <button class="dock-tab" onclick="switchDock('back', this)"><span>🏭</span><span>バック設備</span></button>
      </div>

      <div class="dock-body">
        <!-- タブ1: 建築・配置 -->
        <div class="tab-pane active" id="pane-build"></div>
        <!-- タブ2: 商品・価格設定 -->
        <div class="tab-pane" id="pane-price"></div>
        <!-- タブ3: 店員雇用・育成 -->

const TILE = 40;
let COLS = 120;                 // ステージ横幅（足りなくなると自動で広がる）
const NB_W = 8, NB_H = 7, MAX_COLS = 600; // お隣の店 = コンビニ大(8x7マス)
const ROWS = 13;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---- カメラ（上下左右に無限スクロール＆ズーム）& レスポンシブ ----
const cam = { x: 0, y: 0, zoom: 1, scale: 1, dpr: 1, needHome: true };
function viewW() { return canvas.width / cam.scale; }
function viewH() { return canvas.height / cam.scale; }
function dockW() { const d = document.getElementById('side-dock'); return d && !d.classList.contains('hidden') && window.innerWidth > 760 ? d.offsetWidth : 0; }
function camHome() { cam.needHome = true; }
function resizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(200, Math.round(r.width * dpr)), h = Math.max(150, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  cam.dpr = dpr;
  if (cam.needHome) {
    cam.needHome = false;
    const b = getStoreBounds(), visW = Math.max(240, r.width - dockW());
    cam.zoom = Math.max(0.3, Math.min(1.4, visW / ((b.maxX + 4) * TILE), r.height * 0.78 / (13 * TILE)));
    cam.x = ((b.maxX + 1) / 2) * TILE - (visW / 2) / cam.zoom;
    cam.y = 6.5 * TILE - (r.height / 2) / cam.zoom;
  }
  cam.scale = cam.zoom * dpr;
}
function zoomAt(cx, cy, z) {
  const r = canvas.getBoundingClientRect(), k = canvas.width / r.width;
  const sx = (cx - r.left) * k, sy = (cy - r.top) * k;
  const wx = sx / cam.scale + cam.x, wy = sy / cam.scale + cam.y;
  cam.zoom = Math.max(0.2, Math.min(2.5, z)); cam.scale = cam.zoom * cam.dpr;
  cam.x = wx - sx / cam.scale; cam.y = wy - sy / cam.scale;
}
function zoomBtn(f) { const r = canvas.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, cam.zoom * f); }
function toggleDock() { document.getElementById('side-dock').classList.toggle('hidden'); }
function layoutUI() {
  const hud = document.getElementById('hud').getBoundingClientRect(), tk = document.getElementById('ticker-bar');
  tk.style.top = (hud.bottom + 6) + 'px';
  document.documentElement.style.setProperty('--ui-top', (tk.getBoundingClientRect().bottom + 8) + 'px');
}
layoutUI();
window.addEventListener('resize', layoutUI);
window.addEventListener('load', () => {
  layoutUI();

  if ('ResizeObserver' in window) new ResizeObserver(layoutUI).observe(document.getElementById('hud'));
});
function evTile(e) {
  const r = canvas.getBoundingClientRect();
  const wx = (e.clientX - r.left) * (canvas.width / r.width) / cam.scale + cam.x;
  const wy = (e.clientY - r.top) * (canvas.height / r.height) / cam.scale + cam.y;
  return [Math.floor(wx / TILE), Math.floor(wy / TILE)];
}
const ptrs = new Map(); let camDrag = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.zoom }; camDrag = null; return; }
  const mouse = e.pointerType === 'mouse';
  if (mouse && !(e.button === 1 || (e.button === 0 && !state.buildMode))) return;
  camDrag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false, id: e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
  if (!camDrag || e.pointerId !== camDrag.id) return;
  const dx = e.clientX - camDrag.sx, dy = e.clientY - camDrag.sy;
  if (!camDrag.moved && Math.hypot(dx, dy) < 6) return;
  camDrag.moved = true;

  cam.x = camDrag.cx - dx * k; cam.y = camDrag.cy - dy * k;
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; camDrag = null; };
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) { const k = canvas.width / canvas.getBoundingClientRect().width / cam.scale; cam.x += (e.deltaX || e.deltaY) * k; return; }
  zoomAt(e.clientX, e.clientY, cam.zoom * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

const FLOOR_THEMES = [['#fffbeb', '#fef3c7'], ['#f1f5f9', '#e2e8f0'], ['#334155', '#1e293b'], ['#fce7f3', '#fbcfe8'], ['#dbeafe', '#bfdbfe']];

function inInterior(h, gx, gy) { return gx >= h.x + 1 && gx <= h.x + NB_W - 2 && gy >= h.y + 1 && gy <= h.y + NB_H - 2; }
function hostedBy(h, q) { return FACILITY_TYPES[q.type].cat === 'fixture' && inInterior(h, q.x, q.y); }
function objAt(gx, gy) { return placedObjects.find(o => FACILITY_TYPES[o.type].cat !== 'neighbor' && covers(o, gx, gy)) || placedObjects.find(o => covers(o, gx, gy)); }

function cycleFloor(uid) { const o = placedObjects.find(q => q.uid === uid); if (!o) return; o.floor = (floorOf(o) + 1) % FLOOR_THEMES.length; SFX.place(); openInspector(o); }

// ---- 占有判定（お隣の店は複数マス） ----
function fpOf(type) { const d = FACILITY_TYPES[type]; return d && d.cat === 'neighbor' ? { w: NB_W, h: NB_H } : { w: 1, h: 1 }; }
function covers(o, gx, gy) { const f = fpOf(o.type); return gx >= o.x && gx < o.x + f.w && gy >= o.y && gy < o.y + f.h; }
function migrateNeighbors() {
  const placed = []; let refund = 0; const b = getStoreBounds();
  placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'neighbor').forEach(o => {
    if (!o.v2) { o.y = 10 - NB_H; o.v2 = true; }
    const hit = o.x <= b.maxX && o.x + NB_W > 0 && o.y <= 10 && o.y + NB_H > 0;
    if (hit || placed.some(p => Math.abs(p.x - o.x) < NB_W && Math.abs(p.y - o.y) < NB_H)) { o.__rm = true; refund += FACILITY_TYPES[o.type].cost; } else placed.push(o);
  });
  placedObjects.forEach(q => {
    const qc = FACILITY_TYPES[q.type].cat;
    if (qc === 'fixture') { if (!placed.some(n => inInterior(n, q.x, q.y))) { q.__rm = true; refund += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); } return; }
    if (!q.__rm && qc !== 'neighbor' && placed.some(n => covers(n, q.x, q.y))) { q.__rm = true; refund += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); }
  });

}

// =========================================================
let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type = 'square', vol = 0.04, delay = 0) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function getFairPrice(p) {
  const qualMult = 1 + (p.quality - 1) * 0.16;
  const comboMult = 1 + (state.comboBonusByProd[p.id] || 0);
  return Math.round((p.basePrice * qualMult * comboMult) / 10) * 10;
}

function getEffectivePrice(p) {
  return p.onSale ? Math.round((p.price * 0.8) / 10) * 10 : p.price;
}

function getPriceFeedback(p) {
  const fair = getFairPrice(p);
  const eff = getEffectivePrice(p);
  const ratio = eff / fair;
  if (ratio <= 0.82) return { label: '🔥 激安！', cls: 'badge-cheap', buyProb: 0.98, sat: 0.12 };
  if (ratio <= 1.06) return { label: '👍 適正価格', cls: 'badge-fair', buyProb: 0.88, sat: 0.04 };
  if (ratio <= 1.28) return { label: '💰 高め', cls: 'badge-high', buyProb: 0.62, sat: -0.02 };
  return { label: '😱 高すぎ！', cls: 'badge-ripoff', buyProb: 0.22, sat: -0.15 };
}

// =========================================================
// コーナー判定ロジック
// =========================================================
function recalcCombos(silent = false) {
  state.comboBonusByProd = {};
  placedObjects.forEach(o => o.inCombo = false);

  const newlyFound = [];

  for (let i = 0; i < placedObjects.length; i++) {
    for (let j = i + 1; j < placedObjects.length; j++) {
      const o1 = placedObjects[i];
      const o2 = placedObjects[j];
      const manhattan = Math.abs(o1.x - o2.x) + Math.abs(o1.y - o2.y);
      if (manhattan !== 1) continue;

      // 装飾ボーナス(観葉植物・花壇・シンボルツリー・街灯)
      [[o1, o2], [o2, o1]].forEach(([d, s2]) => {
        const bn = DECOR_BONUS[d.type];
        if (bn && FACILITY_TYPES[s2.type].cat === 'shelf') {
          const pid = FACILITY_TYPES[s2.type].prod;
          state.comboBonusByProd[pid] = (state.comboBonusByProd[pid] || 0) + bn;
          d.inCombo = true; s2.inCombo = true;
        }
      });

      // 専門コーナー判定
      COMBO_DEFS.forEach(c => {
        if ((o1.type === c.a && o2.type === c.b) || (o1.type === c.b && o2.type === c.a)) {
          o1.inCombo = true;
          o2.inCombo = true;
          c.bonusProd.forEach(pid => {
            state.comboBonusByProd[pid] = Math.max(state.comboBonusByProd[pid] || 0, c.bonus);
          });
          if (!state.discoveredCombos.has(c.id)) {
            state.discoveredCombos.add(c.id);
            newlyFound.push(c);
          }
        }
      });
    }
  }

  if (!silent && newlyFound.length > 0) {
    SFX.combo();
    state.points += 15 * newlyFound.length;
    newlyFound.forEach(c => {
      setTicker(`🎉 新コーナー【${c.name}】を発見！${c.desc} (✨+15P獲得)`);
      addFloatText(5 * TILE, 4 * TILE, `✨${c.name} 発見!`, '#f59e0b');
    });
  }
}

// =========================================================
// グリッド & 接続性チェック (BFS)
// =========================================================
function isTileBlocked(gx, gy, ignoreUid = null) {
  const b = getStoreBounds();
  if (!inStore(gx, gy) && !inYard(gx, gy)) return true;
  // バックヤードゾーン (1..2, 1..2) は納品口なので配置不可
  
  // 自動ドア前 (5..6, 9) は開けておく
  if ((gx === 5 || gx === 6) && gy === 9) return true;

  return placedObjects.some(o => o.uid !== ignoreUid && covers(o, gx, gy));
}

function isWalkableForPath(gx, gy, extraBlock = null) {
  const b = getStoreBounds();
  // 店外歩道
  if (gy === 11 || gy === 12) return true;
  // 自動ドアマス
  if ((gx === 5 || gx === 6) && gy === 10) return true;
  // 屋外エリア(芝生)
  if (inYard(gx, gy)) {
    if (extraBlock && extraBlock.x === gx && extraBlock.y === gy) return false;
    return !placedObjects.some(o => covers(o, gx, gy));
  }
  // 店内
  if (gx < b.minX || gx > b.maxX || gy < b.minY || gy > b.maxY) return false;
  if (extraBlock && extraBlock.x === gx && extraBlock.y === gy) return false;
  return !placedObjects.some(o => covers(o, gx, gy));
}

// 設置テスト時に「入口からバックヤードや既存設備が塞がれないか」検証
function canPlaceSafely(type, gx, gy, moveUid = null) {
  if (FACILITY_TYPES[type].cat === 'fixture') {
    const fd = FACILITY_TYPES[type], host = placedObjects.find(o => FACILITY_TYPES[o.type].cat === 'neighbor' && inInterior(o, gx, gy));
    if (!host) return { ok: false, reason: 'お隣の店の中（床のマス）に置きます' };
    if (fd.hosts && !fd.hosts.includes(host.type)) return { ok: false, reason: `${FACILITY_TYPES[host.type].name}には置けない設備です` };
    if (placedObjects.some(o => o.uid !== moveUid && FACILITY_TYPES[o.type].cat !== 'neighbor' && covers(o, gx, gy))) return { ok: false, reason: 'そこには置けません' };
    return { ok: true };
  }
  if (FACILITY_TYPES[type].cat === 'neighbor') {
    const f = fpOf(type), mh = moveUid ? placedObjects.find(o => o.uid === moveUid) : null;
    for (let yy = gy; yy < gy + f.h; yy++) for (let xx = gx; xx < gx + f.w; xx++) {
      if (!inYard(xx, yy)) return { ok: false, reason: 'お隣の店は店の外（芝生）に建てます' };
      if (placedObjects.some(o => o.uid !== moveUid && covers(o, xx, yy) && !(mh && hostedBy(mh, o)))) return { ok: false, reason: '他の設備と重なります' };
    }
  } else if (isTileBlocked(gx, gy, moveUid)) return { ok: false, reason: 'ここには置けません' };
  const def = FACILITY_TYPES[type], yard = inYard(gx, gy);
  if (def.cat === 'neighbor' && !yard) return { ok: false, reason: 'お隣の店は屋外（芝生エリア）にだけ建てられます' };
  if (yard && (def.cat === 'register' || def.cat === 'backyard')) return { ok: false, reason: 'レジとバックヤードは店内専用です' };
  const others = placedObjects.filter(o => o.uid !== moveUid);
  if (def.cat === 'backyard' && others.some(o => o.type === 'backyard')) return { ok: false, reason: 'バックヤードは1つだけです' };
  if (def.cat === 'register') {
    if (others.filter(o => o.type === 'register').length >= 3) return { ok: false, reason: 'レジは最大3台までです' };
    if (gy <= 1) return { ok: false, reason: '店員が後ろに立てるよう1マス空けてください' };
  }
  // 入口(店内)と屋外の入口(歩道側)から、全ての設備に近づけるか BFS で検証
  const _fp = fpOf(type);
  const occ = (x, y) => (x >= gx && x < gx + _fp.w && y >= gy && y < gy + _fp.h) || others.some(o => covers(o, x, y));
  const okT = (x, y) => inStore(x, y) || inYard(x, y) || isRoad(y);
  let bx0 = Math.min(-3, gx - 2), bx1 = Math.max(getStoreBounds().maxX + 3, gx + _fp.w + 2), by0 = Math.min(-2, gy - 2), by1 = Math.max(14, gy + _fp.h + 2);
  others.forEach(o => { const f = fpOf(o.type); bx0 = Math.min(bx0, o.x - 2); bx1 = Math.max(bx1, o.x + f.w + 2); by0 = Math.min(by0, o.y - 2); by1 = Math.max(by1, o.y + f.h + 2); });
  const K = (x, y) => (x - bx0) * 4096 + (y - by0);
  const visited = new Set(), q = [];
  const seed = (x, y) => { if (x < bx0 || x > bx1 || y < by0 || y > by1) return; if (okT(x, y) && !occ(x, y) && !visited.has(K(x, y))) { visited.add(K(x, y)); q.push([x, y]); } };
  seed(5, 9);
  for (let x = bx0; x <= bx1; x++) { seed(x, 11); seed(x, 12); }
  const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  for (let qi = 0; qi < q.length; qi++) { const [cx, cy] = q[qi]; dirs.forEach(([dx, dy]) => seed(cx + dx, cy + dy)); }
  const reach = o => dirs.some(([dx, dy]) => okT(o.x + dx, o.y + dy) && visited.has(K(o.x + dx, o.y + dy)));
  const need = ['shelf', 'register', 'eatin', 'atm', 'backyard'];
  if (need.includes(def.cat) && !reach({ x: gx, y: gy })) return { ok: false, reason: 'お客さんが近づけません！' };
  const cut = others.find(o => need.includes(FACILITY_TYPES[o.type].cat) && !reach(o));
  if (cut) return { ok: false, reason: `${FACILITY_TYPES[cut.type].name}に近づけなくなります！` };
  if (def.cat === 'register' && !visited.has(K(gx, gy - 1))) return { ok: false, reason: 'レジの後ろ(上側)に店員が立てません' };
  return { ok: true };
}

function findPath(sx, sy, gx, gy) {
  if (sx === gx && sy === gy) return [];
  const M = 24, bx0 = Math.min(sx, gx) - M, bx1 = Math.max(sx, gx) + M, by0 = Math.min(sy, gy) - M, by1 = Math.max(sy, gy) + M;
  const K = (x, y) => (x - bx0) * 8192 + (y - by0);
  const parent = new Map(); parent.set(K(sx, sy), null);
  const q = [{ x: sx, y: sy }], dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  let found = false;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi];
    if (c.x === gx && c.y === gy) { found = true; break; }
    for (const [dx, dy] of dirs) {
      const nx = c.x + dx, ny = c.y + dy;
      if (nx < bx0 || nx > bx1 || ny < by0 || ny > by1 || parent.has(K(nx, ny))) continue;
      if (isWalkableForPath(nx, ny) || (nx === gx && ny === gy)) { parent.set(K(nx, ny), c); q.push({ x: nx, y: ny }); }
    }
  }
  if (!found) return [];
  const path = []; let cur = { x: gx, y: gy };
  while (cur && !(cur.x === sx && cur.y === sy)) {
    path.unshift({ x: cur.x * TILE + TILE / 2, y: cur.y * TILE + TILE / 2, tx: cur.x, ty: cur.y });
    cur = parent.get(K(cur.x, cur.y));
  }
  return path;
}

function getAdjacentWalkable(tx, ty) {
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  return dirs.map(([dx,dy]) => ({x: tx+dx, y: ty+dy})).filter(t => isWalkableForPath(t.x, t.y));
}

  // 店長は初期スタッフ（日給¥0）
  {
    id: 'manager', name: 'あなた (店長)', isManager: true, level: 1, rank: 'B',
    trait: { name: '店長魂', desc: '給料0円で年中無休！' },
    regStat: 55, spdStat: 55, charmStat: 60, wage: 0, role: 'all',
    color: '#2596be', hair: '#1e293b',
    x: 4.5 * TILE, y: 3.5 * TILE, path: [], carry: null, cooldown: 0, targetObjId: null, bounce: 0
  }
];

let candidateList = [];
let nextStaffId = 1;

function generateCandidate(isRareBoost = false) {
  const ln = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
  const fn = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
  const isSuper = isRareBoost ? Math.random() < 0.3 : Math.random() < 0.08;
  const trait = isSuper ? TRAITS[5] : TRAITS[Math.floor(Math.random() * 5)];

  const base = 32 + Math.floor(Math.random() * 28) + state.rankIdx * 4;
  const regStat = Math.min(99, base + trait.reg + Math.floor(Math.random()*12));
  const spdStat = Math.min(99, base + trait.spd + Math.floor(Math.random()*12));
  const charmStat = Math.min(99, base + trait.charm + Math.floor(Math.random()*12));

  const avg = (regStat + spdStat + charmStat) / 3;
  const hireCost = Math.round((600 + avg * 25) / 50) * 50;
  const wage = Math.round(((280 + avg * 7) * trait.wageMod) / 10) * 10;

  return {
    id: 'st_' + (nextStaffId++),
    name: `${ln} ${fn}`,
    trait,
    regStat, spdStat, charmStat,
    hireCost, wage,
    color: STAFF_COLORS[Math.floor(Math.random() * STAFF_COLORS.length)],
    hair: ['#1e293b','#451a03','#78350f','#713f12'][Math.floor(Math.random()*4)]
  };
}

function refreshCandidates(free = false) {
  if (!free) {
    if (state.money < 200) return setTicker('⚠️ 求人広告費(¥200)が足りません！');
    state.money -= 200;
    SFX.click();
  }
  candidateList = [generateCandidate(), generateCandidate(), generateCandidate(true)];
  renderStaffTab();
  updateHUD();
}

function hireCandidate(candId) {
  const maxS = RANKS[state.rankIdx].maxStaff;
  if (hiredStaff.length - 1 >= maxS) {
    return setTicker(`⚠️ 現在のランクでは店員は${maxS}人までしか雇えません！`);
  }
  const idx = candidateList.findIndex(c => c.id === candId);
  if (idx === -1) return;
  const c = candidateList[idx];
  if (state.money < c.hireCost) return setTicker('⚠️ 採用契約金が足りません！');

  state.money -= c.hireCost;
  candidateList.splice(idx, 1);
  candidateList.push(generateCandidate());

  const newStaff = {
    ...c,
    isManager: false,
    level: 1,
    rank: getStatRank((c.regStat + c.spdStat + c.charmStat)/3),
    role: 'all', // 'all' | 'cashier' | 'stocker'
    x: 2.5 * TILE, y: 2.5 * TILE, path: [], carry: null, cooldown: 0, targetObjId: null, bounce: 0
  };
  hiredStaff.push(newStaff);
  SFX.combo();
  setTicker(`🎉 新人「${newStaff.name}」を採用しました！`);
  addFloatText(newStaff.x, newStaff.y, 'よろしく!', '#2cb67d');
  renderStaffTab();
  updateHUD();
}

function getStatRank(avg) {
  if (avg >= 85) return 'S';
  if (avg >= 72) return 'A';
  if (avg >= 58) return 'B';
  return 'C';
}

function trainStaff(staffId) {
  const st = hiredStaff.find(s => s.id === staffId);
  if (!st) return;
  const ptCost = 10 + st.level * 5;
  if (state.points < ptCost) return setTicker(`⚠️ 経営Pが足りません (必要: ✨${ptCost}P)`);

  state.points -= ptCost;
  st.level++;
  st.regStat += 6;
  st.spdStat += 6;
  st.charmStat += 6;
  st.rank = getStatRank((st.regStat + st.spdStat + st.charmStat)/3);
  SFX.heart();
  addFloatText(st.x, st.y - 20, `Lv.${st.level} UP!`, '#eab308');
  setTicker(`💪 ${st.name} の研修を実施！能力がアップしました！(ランク ${st.rank})`);
  renderStaffTab();
  updateHUD();
}

function changeStaffRole(staffId, role) {
  const st = hiredStaff.find(s => s.id === staffId);
  if (st) {
    st.role = role;
    st.path = [];
    SFX.click();
    renderStaffTab();
  }
}

function fireStaff(staffId) {
  const idx = hiredStaff.findIndex(s => s.id === staffId);
  if (idx <= 0) return; // 店長は解雇不可
  const name = hiredStaff[idx].name;
  hiredStaff.splice(idx, 1);
  SFX.click();
  setTicker(`👋 ${name} さんが退職しました。`);
  renderStaffTab();
}

// =========================================================
// エンティティ (客・ゴミ・フローティングテキスト)
// =========================================================
let customers = [];
let passers = []; // 店の外を歩く通行人
let dirts = [];
let floatingTexts = [];
let spawnTimer = 1.5;
let passerTimer = 1.0;
let dirtTimer = 15.0;

function spawnPasser() {
  const left = Math.random() < 0.5;
  const y = 11.4 * TILE + Math.random() * 20;
  passers.push({
    x: left ? passMin() * TILE : passSpan() * TILE + 15,
    y,
    dir: left ? 1 : -1,
    speed: 45 + Math.random() * 25,
    shirt: ['#ef4444','#3b82f6','#10b981','#f59e0b','#a855f7','#64748b'][Math.floor(Math.random()*6)],
    hair: ['#1e293b','#451a03','#78350f'][Math.floor(Math.random()*3)],
    checkedStore: false,
    bounce: 0
  });
}

function tryEnterCustomerFromPasser(p) {
  // 店内の全商品棚から在庫がある設備をリストアップ
  const shelves = placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'shelf' && o.stock > 0);
  if (shelves.length === 0) return false;

  const saleShelves = shelves.filter(o => products[FACILITY_TYPES[o.type].prod].onSale);
  let enterProb = 0.35 + (state.rating - 2.5) * 0.14 + (saleShelves.length * 0.14);
  if (state.campaignTimer > 0) enterProb += 0.28;

  if (Math.random() > enterProb || customers.length >= 18) return false;

  // 客を生成
  const wantCount = Math.random() < (0.2 + state.rating * 0.08) ? 3 : (Math.random() < 0.6 ? 2 : 1);
  const targets = [];
  for (let i = 0; i < wantCount; i++) {
    // 特売棚が選ばれやすい
    const pool = [...shelves, ...saleShelves, ...saleShelves];
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (!targets.includes(pick.uid)) targets.push(pick.uid);
  }

  // たまにATMやイートインにも興味を持つ
  const atmObj = placedObjects.find(o => o.type === 'atm');
  const wantsAtm = atmObj && Math.random() < 0.25;

  const doorX = Math.random() < 0.5 ? 5 : 6;
  const cust = {
    id: Math.random(),
    x: p.x, y: p.y,
    shirt: p.shirt, hair: p.hair,
    speed: 68 + Math.random() * 22,
    state: 'entering', // entering -> shopping -> picking -> eatin -> atm -> queuing -> leaving
    targets,
    basket: [],
    currentObjId: null,
    waitTimer: 0,
    patience: 24,
    maxPatience: 24,
    regUid: null,
    wantsAtm,
    emote: null,
    emoteTimer: 0,
    bounce: 0,
    path: [
      { x: doorX * TILE + TILE/2, y: 11 * TILE + TILE/2, tx: doorX, ty: 11 },
      { x: doorX * TILE + TILE/2, y: 9 * TILE + TILE/2, tx: doorX, ty: 9 }
    ]
  };
  customers.push(cust);
  state.totalCustomers++;
  return true;
}

// =========================================================
// ゲームロジック更新ループ
// =========================================================
function updateStaffAI(dt) {
  hiredStaff.forEach(st => {
    const spd = 72 + st.spdStat * 0.95;
    if (st.cooldown > 0) st.cooldown -= dt;
    if (st.isManager) { if (manualMove(st, dt, spd)) return; if (view3D) return; }

    // 移動処理
    if (st.path.length > 0) {
      const t = st.path[0];
      const dx = t.x - st.x, dy = t.y - st.y;
      const d = Math.hypot(dx, dy);
      if (d < 4) {
        st.path.shift();
      } else {
        const step = Math.min(d, spd * dt);
        st.x += (dx / d) * step;
        st.y += (dy / d) * step;
        st.bounce += dt * 12;
      }
      // 途中でゴミを踏んだら掃除
      for (let i = dirts.length - 1; i >= 0; i--) {
        if (Math.hypot(st.x - dirts[i].x, st.y - dirts[i].y) < 22) {
          dirts.splice(i, 1);
          state.rating = Math.min(5.0, state.rating + 0.02);
          addFloatText(st.x, st.y - 18, '✨掃除!', '#2cb67d');
        }
      }
      return;
    }

    if (st.cooldown > 0) return;

    const stx = Math.floor(st.x / TILE);
    const sty = Math.floor(st.y / TILE);

    // レジ対応チェック (role !== 'stocker')
    if (st.role !== 'stocker') {
      const regs = placedObjects.filter(o => o.type === 'register');
      // 自分がすでにどこかのレジ後ろに立っていて客が並んでいるなら最優先
      const myReg = regs.find(r => stx === r.x && sty === r.y - 1);
      if (myReg && myReg.queue.length > 0) return; // レジ処理は updateRegisters がやる

      // 客が並んでいるのに店員がいないレジを探す
      const needyReg = regs.find(r => {
        if (r.queue.length === 0) return false;
        const someoneThere = hiredStaff.some(other =>
          other !== st && Math.floor(other.x/TILE) === r.x && Math.floor(other.y/TILE) === r.y - 1
        );
        return !someoneThere;
      });

      if (needyReg) {
        st.path = findPath(stx, sty, needyReg.x, needyReg.y - 1);
        return;
      }

      // レジ専任なら空いているレジの後ろで待機
      if (st.role === 'cashier') {
        const freeReg = regs.find(r => !hiredStaff.some(o => o !== st && Math.floor(o.x/TILE) === r.x && Math.floor(o.y/TILE) === r.y - 1));
        if (freeReg && (stx !== freeReg.x || sty !== freeReg.y - 1)) {
          st.path = findPath(stx, sty, freeReg.x, freeReg.y - 1);
        }
        return;
      }
    }

    // 品出し・清掃チェック (role !== 'cashier')
    if (st.role !== 'cashier') {
      // 1. 商品を手に持っているなら対象棚へ運ぶ
      if (st.carry) {
        const targetShelf = placedObjects.find(o => o.uid === st.targetObjId);
        if (!targetShelf) { st.carry = null; return; }
        const def = FACILITY_TYPES[targetShelf.type];
        const near = Math.abs(stx - targetShelf.x) + Math.abs(sty - targetShelf.y) <= 1;
        if (near) {
          const space = def.maxCap - targetShelf.stock;
          const put = Math.min(space, st.carry.count);
          targetShelf.stock += put;
          if (st.carry.count > put) products[st.carry.prod].stock += (st.carry.count - put);
          st.carry = null;
          st.cooldown = 0.25;
          addFloatText(targetShelf.x*TILE + 20, targetShelf.y*TILE, `+${put}${products[def.prod].icon}`, '#2596be');
        } else {
          const adjs = getAdjacentWalkable(targetShelf.x, targetShelf.y);
          if (adjs.length > 0) {
            const p = findPath(stx, sty, adjs[0].x, adjs[0].y);
            if (p.length > 0) st.path = p;
          }
        }
        return;
      }

      // 2. 補充が必要な棚を探す
      const emptyShelves = placedObjects
        .filter(o => {
          const def = FACILITY_TYPES[o.type];
          if (def.cat !== 'shelf') return false;
          const prod = products[def.prod];
          return o.stock < def.maxCap * 0.75 && prod.stock > 0;
        })
        .sort((a, b) => (a.stock / FACILITY_TYPES[a.type].maxCap) - (b.stock / FACILITY_TYPES[b.type].maxCap));

      if (emptyShelves.length > 0) {
        const tgt = emptyShelves[0];
        const def = FACILITY_TYPES[tgt.type];
        const prod = products[def.prod];
        const by = placedObjects.find(o => o.type === 'backyard');
        if (!by) return;
        if (Math.abs(stx - by.x) + Math.abs(sty - by.y) <= 1) {
          const take = Math.min(4, def.maxCap - tgt.stock, prod.stock);
          if (take > 0) {
            prod.stock -= take;
            st.carry = { prod: def.prod, count: take };
            st.targetObjId = tgt.uid;
            st.cooldown = 0.25;
          }
        } else {
          { const ad = getAdjacentWalkable(by.x, by.y); if (ad.length) st.path = findPath(stx, sty, ad[0].x, ad[0].y); }
        }
        return;
      }

      // 3. ゴミ掃除
      if (dirts.length > 0) {
        st.path = findPath(stx, sty, dirts[0].tx, dirts[0].ty);
        return;
      }
    }
  });
}

function updateRegisters(dt) {
  const regs = placedObjects.filter(o => o.type === 'register');
  regs.forEach(reg => {
    if (reg.queue.length === 0) { reg.progress = 0; return; }
    const head = reg.queue[0];
    const standPos = { x: reg.x * TILE + TILE/2, y: (reg.y + 1) * TILE + TILE/2 };
    if (Math.hypot(head.x - standPos.x, head.y - standPos.y) > 12) {
      reg.progress = 0;
      return;
    }

    // 後ろ(y-1)に店員が立っているか
    const worker = hiredStaff.find(st => Math.floor(st.x/TILE) === reg.x && Math.floor(st.y/TILE) === reg.y - 1);
    if (worker) {
      const rate = 0.65 + (worker.regStat / 100) * 1.4; // 秒間進捗
      reg.progress += rate * dt;
      if (reg.progress >= 1) {
        reg.progress = 0;
        finishCustomerCheckout(reg, head, worker);
      }
    }
  });
}

function finishCustomerCheckout(reg, cust, worker) {
  reg.queue.shift();
  // 列を前に詰める
  reg.queue.forEach((c, idx) => {
    const ty = Math.min(9, reg.y + 1 + idx);
    c.path = findPath(Math.floor(c.x/TILE), Math.floor(c.y/TILE), reg.x, ty);
  });

  let sum = 0;
  let extraSat = 0;
  cust.basket.forEach(item => {
    sum += item.paidPrice;
    extraSat += item.sat;
  });

  state.money += sum;
  state.totalRevenue += sum;
  state.monthStats.rev += sum;
  state.monthStats.served++;

  // スタッフの愛想と商品満足度で経営P＆評判ボーナス
  const ptGain = (Math.random() < (0.35 + worker.charmStat / 200)) ? 2 : 1;
  state.points += ptGain;
  state.rating = Math.max(1.0, Math.min(5.0, state.rating + 0.03 + extraSat * 0.15));

  SFX.cash();
  addFloatText(cust.x, cust.y - 22, `+¥${sum}`, '#15803d');
  if (ptGain >= 2) addFloatText(worker.x, worker.y - 24, `✨+${ptGain}P`, '#9333ea');

  // イートイン席が空いていれば少し寄ってから帰ることも
  const eatin = placedObjects.find(o => o.type === 'eatin');
  if (eatin && Math.random() < 0.35) {
    const adjs = getAdjacentWalkable(eatin.x, eatin.y);
    if (adjs.length > 0) {
      cust.state = 'eatin';
      cust.currentObjId = eatin.uid;
      cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adjs[0].x, adjs[0].y);
      return;
    }
  }

  cust.emote = '❤️';
  cust.emoteTimer = 1.5;
  sendCustomerHome(cust);
}

function sendCustomerHome(cust) {
  cust.state = 'leaving';
  const doorX = Math.random() < 0.5 ? 5 : 6;
  const cx = Math.floor(cust.x/TILE), cy = Math.floor(cust.y/TILE);
  const path = findPath(cx, cy, doorX, 9);
  path.push({ x: doorX * TILE + TILE/2, y: 11.5 * TILE });
  const exitX = Math.random() < 0.5 ? passMin() * TILE : passSpan() * TILE + 20;
  path.push({ x: exitX, y: 11.5 * TILE });
  cust.path = path;
}

function assignCustomerNextTarget(cust) {
  if (cust.targets.length === 0) {
    if (cust.wantsAtm) {
      cust.wantsAtm = false;
      const atm = placedObjects.find(o => o.type === 'atm');
      if (atm) {
        const adjs = getAdjacentWalkable(atm.x, atm.y);
        if (adjs.length > 0) {
          cust.state = 'atm';
          cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adjs[0].x, adjs[0].y);
          return;
        }
      }
    }

    if (cust.basket.length > 0) {
      // レジへ
      const regs = placedObjects.filter(o => o.type === 'register');
      if (regs.length === 0) {
        cust.emote = '💢';
        sendCustomerHome(cust);
        return;
      }
      regs.sort((a, b) => a.queue.length - b.queue.length);
      const chosen = regs[0];
      if (chosen.queue.length >= 5) {
        state.rating = Math.max(1.0, state.rating - 0.1);
        cust.emote = '💢';
        addFloatText(cust.x, cust.y - 20, '混みすぎ!', '#e5484d');
        sendCustomerHome(cust);
        return;
      }
      cust.state = 'queuing';
      cust.regUid = chosen.uid;
      chosen.queue.push(cust);
      const ty = Math.min(9, chosen.y + chosen.queue.length);
      cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), chosen.x, ty);
    } else {
      sendCustomerHome(cust);
    }
    return;
  }

  const nextUid = cust.targets.shift();
  const obj = placedObjects.find(o => o.uid === nextUid);
  if (!obj) return assignCustomerNextTarget(cust);
  const adjs = getAdjacentWalkable(obj.x, obj.y);
  if (adjs.length === 0) return assignCustomerNextTarget(cust);
  const adj = adjs[Math.floor(Math.random() * adjs.length)];
  cust.state = 'shopping';
  cust.currentObjId = nextUid;
  cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adj.x, adj.y);
}

function updateCustomers(dt) {
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    if (c.emoteTimer > 0) {
      c.emoteTimer -= dt;
      if (c.emoteTimer <= 0) c.emote = null;
    }

    if (c.path && c.path.length > 0) {
      const t = c.path[0];
      const dx = t.x - c.x, dy = t.y - c.y;
      const d = Math.hypot(dx, dy);
      if (d < 4) {
        c.path.shift();
      } else {
        const step = Math.min(d, c.speed * dt);
        c.x += (dx / d) * step;
        c.y += (dy / d) * step;
        c.bounce += dt * 10;
      }
    } else {
      if (c.state === 'entering') {
        SFX.door();
        assignCustomerNextTarget(c);
      } else if (c.state === 'shopping') {
        c.state = 'picking';
        c.waitTimer = 0.55;
      } else if (c.state === 'picking') {
        c.waitTimer -= dt;
        if (c.waitTimer <= 0) {
          const obj = placedObjects.find(o => o.uid === c.currentObjId);
          if (obj && obj.stock > 0) {
            const p = products[FACILITY_TYPES[obj.type].prod];
            const fb = getPriceFeedback(p);
            if (Math.random() <= fb.buyProb) {
              obj.stock--;
              c.basket.push({ prod: p.id, paidPrice: getEffectivePrice(p), sat: fb.sat });
              if (fb.sat >= 0.1) {
                c.emote = '🎵'; c.emoteTimer = 1.2;
                addFloatText(c.x, c.y - 20, `${p.icon}安い!`, '#16a34a');
              } else {
                addFloatText(c.x, c.y - 20, `${p.icon}`, '#3b2d22');
              }
            } else {
              // 高すぎて買わない！
              state.rating = Math.max(1.0, state.rating - 0.08);
              c.emote = '💦'; c.emoteTimer = 1.3;
              SFX.angry();
              addFloatText(c.x, c.y - 20, '高いな…', '#e5484d');
            }
          } else {
            state.rating = Math.max(1.0, state.rating - 0.08);
            c.emote = '💢'; c.emoteTimer = 1.2;
            addFloatText(c.x, c.y - 20, '品切れ!', '#e5484d');
          }
          assignCustomerNextTarget(c);
        }
      } else if (c.state === 'atm') {
        state.money += 120;
        state.monthStats.extra += 120;
        state.points += 1;
        SFX.cash();
        addFloatText(c.x, c.y - 20, '🏧+¥120', '#2596be');
        assignCustomerNextTarget(c);
      } else if (c.state === 'eatin') {
        if (c.waitTimer <= 0) c.waitTimer = 1.8;
        c.waitTimer -= dt;
        if (c.waitTimer <= 0) {
          state.points += 2;
          SFX.heart();
          addFloatText(c.x, c.y - 20, '✨+2P 満腹!', '#f59e0b');
          c.emote = '❤️'; c.emoteTimer = 1.2;
          sendCustomerHome(c);
        }
      } else if (c.state === 'leaving') {
        customers.splice(i, 1);
        continue;
      }
    }

    // レジ待ち我慢ゲージ
    if (c.state === 'queuing') {
      const reg = placedObjects.find(o => o.uid === c.regUid);
      const isProcessing = reg && reg.queue[0] === c && reg.progress > 0;
      if (!isProcessing) {
        c.patience -= dt;
        if (c.patience <= 0) {
          if (reg) {
            const idx = reg.queue.indexOf(c);
            if (idx !== -1) reg.queue.splice(idx, 1);
          }
          state.rating = Math.max(1.0, state.rating - 0.14);
          SFX.angry();
          addFloatText(c.x, c.y - 20, '待ちすぎ💢', '#e5484d');
          sendCustomerHome(c);
        }
      }
    }
  }
}

function updateCalendarAndEconomy(dt) {
  // 1週間 = 20秒
  state.weekTimer += dt;
  if (state.campaignTimer > 0) state.campaignTimer = Math.max(0, state.campaignTimer - dt);

  if (state.weekTimer >= 20) {
    state.weekTimer -= 20;
    state.week++;
    { const rent = placedObjects.reduce((a, o) => a + (FACILITY_TYPES[o.type].rent || 0) + (FACILITY_TYPES[o.type].income ? fxIncome(o) : 0), 0); if (rent) { state.money += rent; state.monthStats.extra += rent; } }
    stores.forEach((sx, i) => { if (i === curStore || !sx.placedObjects) return; const n = sx.placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'shelf').length; const g = Math.round(n * 160 * (0.6 + state.rating / 5)); state.money += g; state.monthStats.extra += g; });

    // 週ごとの自動仕入れ（棚で減った分の補填としてバックヤードへ仕入れ）
    if (state.autoRestock) {
      Object.values(products).forEach(p => {
        if (p.unlockRank <= state.rankIdx && p.stock < 16) {
          const buyQty = 15;
          const cost = getUnitCost(p) * buyQty;
          if (state.money >= cost) {
            state.money -= cost;
            state.monthStats.cost += cost;
            p.stock += buyQty;
          }
        }
      });
    }

    if (state.week > 4) {
      state.week = 1;
      state.month++;
      if (state.month > 12) {
        state.month = 1;
        state.year++;
      }
      onMonthEnd();
    }
  }

  // 通行人スポーン
  passerTimer -= dt;
  if (passerTimer <= 0) {
    passerTimer = (state.campaignTimer > 0 ? 1.1 : 2.1) * (0.7 + Math.random()*0.6) / (1 + tenantTraffic());
    if (passers.length < 14) spawnPasser();
  }

  // 通行人更新 & 入店判定
  for (let i = passers.length - 1; i >= 0; i--) {
    const p = passers[i];
    p.x += p.dir * p.speed * dt;
    p.bounce += dt * 9;
    if (!p.checkedStore && Math.abs(p.x - 6 * TILE) < 35) {
      p.checkedStore = true;
      if (tryEnterCustomerFromPasser(p)) {
        passers.splice(i, 1);
        continue;
      }
    }
    if (p.x < passMin() * TILE - 30 || p.x > passSpan() * TILE + 30) passers.splice(i, 1);
  }

  // ゴミ発生
  dirtTimer -= dt;
  if (dirtTimer <= 0) {
    dirtTimer = 15 + Math.random() * 12;
    const b = getStoreBounds();
    if (dirts.length < 5 && customers.length > 0) {
      for (let t = 0; t < 10; t++) {
        const rx = 2 + Math.floor(Math.random() * (b.maxX - 1));
        const ry = 2 + Math.floor(Math.random() * 7);
        if (isWalkableForPath(rx, ry)) {
          dirts.push({ tx: rx, ty: ry, x: rx*TILE + TILE/2, y: ry*TILE + TILE/2 });
          break;
        }
      }
    }
  }

  if (dirts.length >= 3) {
    state.rating = Math.max(1.0, state.rating - 0.006 * dt * dirts.length);
  }
}

function onMonthEnd() {
  // 月給（週給×4ではなく月次人件費として日給×4を請求して分かりやすく）
  let wages = 0;
  [hiredStaff, ...stores.filter((sx, i) => i !== curStore && sx.hiredStaff).map(sx => sx.hiredStaff)].forEach(a => a.forEach(s => { if (!s.isManager) wages += s.wage * 3; }));
  state.money -= wages;
  state.monthStats.wages = wages;

  const net = state.monthStats.rev + state.monthStats.extra - state.monthStats.cost - wages;

  // 店舗ランク昇格チェック
  let promoted = null;
  if (state.rankIdx < RANKS.length - 1) {
    const nextR = RANKS[state.rankIdx + 1];
    if (state.totalRevenue >= nextR.needRev) {
      state.rankIdx++;
      promoted = nextR;
      state.points += 30;
    }
  }

  // 月次決算モーダルを表示（ゲームは自動で一時停止）
  state.paused = true;
  if (promoted) SFX.fanfare();
  else SFX.combo();

  const body = `
    <div class="ledger-row"><span>🛒 商品売上 (${state.monthStats.served}人会計)</span><span style="color:#15803d">+¥${state.monthStats.rev.toLocaleString()}</span></div>
    <div class="ledger-row"><span>🏧 ATM等その他収入</span><span style="color:#2596be">+¥${state.monthStats.extra.toLocaleString()}</span></div>
    <div class="ledger-row"><span>📦 商品仕入コスト</span><span style="color:#e5484d">-¥${state.monthStats.cost.toLocaleString()}</span></div>
    <div class="ledger-row"><span>👥 スタッフ人件費</span><span style="color:#e5484d">-¥${wages.toLocaleString()}</span></div>
    <div class="ledger-row ledger-total"><span>💰 今月の純利益</span><span style="color:${net>=0?'#15803d':'#e5484d'}">${net>=0?'+':''}¥${net.toLocaleString()}</span></div>
    ${promoted ? `
      <div style="background:#fef3c7; border:2px solid #f59e0b; border-radius:8px; padding:10px; text-align:center;">
        <div style="font-size:15px; font-weight:900; color:#b45309;">🎉 店舗ランクアップ！！</div>
        <div style="font-size:13px; font-weight:800; margin-top:4px;">ランク ${promoted.rank}【${promoted.name}】になりました！</div>
        <div style="font-size:11px; color:#78350f; margin-top:3px;">雇用上限: ${promoted.maxStaff}人 / 新商品アンロック & ✨+30P!</div>
      </div>
    ` : ''}
    <button class="kairo-btn btn-orange" style="padding:10px; font-size:14px;" onclick="closeModal()">👍 翌月へ進む！</button>
  `;
  openModal(`📊 ${state.month === 1 ? 12 : state.month - 1}月度 営業決算レポート`, body);

  state.monthStats = { rev: 0, cost: 0, wages: 0, extra: 0, served: 0 };
  updateHUD();
  refreshAllTabs();
}

let hoverTile = null;

function draw() {
  if (!canvas.clientWidth) return;
  resizeCanvas();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(cam.scale, 0, 0, cam.scale, -cam.x * cam.scale, -cam.y * cam.scale);
  const b = getStoreBounds();
  const vx0 = Math.floor(cam.x / TILE) - 1, vx1 = Math.ceil((cam.x + viewW()) / TILE) + 1, vy0 = Math.floor(cam.y / TILE) - 1, vy1 = Math.ceil((cam.y + viewH()) / TILE) + 1;

  // 1. 地面・道路・店内床（上下左右に無限）
  const gx0 = vx0 * TILE, gw = (vx1 - vx0 + 1) * TILE;
  ctx.fillStyle = '#86efac'; ctx.fillRect(gx0, vy0 * TILE, gw, (vy1 - vy0 + 1) * TILE);
  if ((vx1 - vx0) * (vy1 - vy0) < 3000) {
    for (let y = vy0; y <= vy1; y++) for (let x = vx0; x <= vx1; x++) {
      if (isRoad(y) || inBuilding(x, y)) continue;
      const px = x * TILE, py = y * TILE;
      if ((x + y) % 2 === 0) { ctx.fillStyle = '#4ade80'; ctx.fillRect(px, py, TILE, TILE); }
      if ((x * 7 + y * 13) % 9 === 0) { ctx.fillStyle = '#22c55e'; ctx.fillRect(px + 12, py + 14, 6, 6); }
    }
  }
  ctx.fillStyle = '#d6d3d1'; ctx.fillRect(gx0, 11 * TILE, gw, TILE);
  ctx.fillStyle = '#a8a29e'; ctx.fillRect(gx0, 12 * TILE - 4, gw, 4);
  ctx.fillStyle = '#64748b'; ctx.fillRect(gx0, 12 * TILE, gw, TILE);
  ctx.fillStyle = '#e2e8f0';
  for (let x = vx0; x <= vx1; x++) if (x % 2 === 0) ctx.fillRect(x * TILE + 8, 12 * TILE + 18, 22, 4);
  for (let y = Math.max(0, vy0); y <= Math.min(10, vy1); y++) for (let x = Math.max(0, vx0); x <= Math.min(b.maxX, vx1); x++) {
    const px = x * TILE, py = y * TILE;
    if (inStore(x, y)) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#fffbeb' : '#fef3c7'; ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = 'rgba(180, 140, 80, 0.12)'; ctx.strokeRect(px, py, TILE, TILE);
    } else {
      ctx.fillStyle = '#475569'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#334155'; ctx.fillRect(px, py + TILE - 6, TILE, 6);
    }
  }

  // 店舗の赤いストライプひさし（y=0 と y=10 の店舗上部に飾る）
  for (let x = b.minX - 1; x <= b.maxX + 1; x++) {
    ctx.fillStyle = x % 2 === 0 ? '#ef4444' : '#ffffff';
    ctx.fillRect(x * TILE, 0, TILE, 16);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x * TILE, 16, TILE, 3);
  }
  // 屋外エリア境界と案内
  ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo((b.maxX + 1) * TILE, TILE); ctx.lineTo((b.maxX + 1) * TILE, 11 * TILE); ctx.stroke(); ctx.restore();
  ctx.fillStyle = 'rgba(20,83,45,.8)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🌳 屋外エリア（棚・装飾・ブロック・お隣の店OK）', Math.max((b.maxX + 1) * TILE + 150, cam.x + viewW() / 2), 1.5 * TILE);
  // 店舗看板（編集可）
  const sr = signRect();
  ctx.fillStyle = '#1e293b'; ctx.fillRect(sr.cx - sr.w / 2, 2, sr.w, 28);
  ctx.fillStyle = signBg(); ctx.fillRect(sr.cx - sr.w / 2 + 3, 5, sr.w - 6, 22);
  ctx.fillStyle = '#1e293b'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(signLabel(), sr.cx, 16);

  // バックヤード表示
  ctx.fillStyle = '#334155';
  ctx.font = 'bold 10px sans-serif';
  

  // 自動ドア描画 (x=5,6, y=10)
  ctx.fillStyle = '#bae6fd';
  ctx.fillRect(5 * TILE, 10 * TILE + 4, 2 * TILE, TILE - 8);
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2;
  ctx.strokeRect(5 * TILE, 10 * TILE + 4, 2 * TILE, TILE - 8);
  ctx.fillStyle = '#0369a1';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText('自動ドア IN/OUT', 6 * TILE, 10 * TILE + TILE/2);

  // 特売中のぼり旗（店外入口横）
  const hasSale = Object.values(products).some(p => p.onSale);
  if (hasSale) {
    const wave = Math.sin(performance.now() / 180) * 3;
    ctx.fillStyle = '#78350f';
    ctx.fillRect(4 * TILE + 12, 10.1 * TILE, 3, 34);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(4 * TILE + 15, 10.1 * TILE + wave * 0.2, 20, 22);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('特売', 4 * TILE + 25, 10.35 * TILE);
  }

  // 2. 建築モード時のグリッドとゴーストプレビュー
  if (state.buildMode) {
    ctx.strokeStyle = 'rgba(37, 150, 190, 0.35)';
    ctx.lineWidth = 1;
    for (let y = b.minY; y <= b.maxY; y++) {
      for (let x = b.minX; x <= b.maxX; x++) {
        ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
      }
    }

    if (FACILITY_TYPES[state.buildMode.type].cat === 'fixture') {
      const hs = FACILITY_TYPES[state.buildMode.type].hosts;
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 1;
      placedObjects.forEach(o => {
        if (FACILITY_TYPES[o.type].cat !== 'neighbor' || (hs && !hs.includes(o.type))) return;
        for (let y = o.y + 1; y <= o.y + NB_H - 2; y++) for (let x = o.x + 1; x <= o.x + NB_W - 2; x++) ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
      });
    }
    if (hoverTile) {
      const check = canPlaceSafely(state.buildMode.type, hoverTile.x, hoverTile.y, state.buildMode.moveUid);
      ctx.fillStyle = check.ok ? 'rgba(44, 182, 125, 0.45)' : 'rgba(229, 72, 77, 0.45)';
      ctx.fillRect(hoverTile.x * TILE, hoverTile.y * TILE, TILE * fpOf(state.buildMode.type).w, TILE * fpOf(state.buildMode.type).h);
      ctx.strokeStyle = check.ok ? '#15803d' : '#991b1b';
      ctx.lineWidth = 3;
      ctx.strokeRect(hoverTile.x * TILE + 1, hoverTile.y * TILE + 1, TILE * fpOf(state.buildMode.type).w - 2, TILE * fpOf(state.buildMode.type).h - 2);

      // コーナー成立予報！
      if (check.ok) {
        const previewCombos = getPreviewCombos(state.buildMode.type, hoverTile.x, hoverTile.y, state.buildMode.moveUid);
        if (previewCombos.length > 0) {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(hoverTile.x * TILE - 40, hoverTile.y * TILE - 24, 120, 20);
          ctx.fillStyle = '#fde047';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText(`✨ ${previewCombos[0]}!`, hoverTile.x * TILE + 20, hoverTile.y * TILE - 14);
        }
      } else {
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(hoverTile.x * TILE - 50, hoverTile.y * TILE - 22, 140, 18);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(check.reason, hoverTile.x * TILE + 20, hoverTile.y * TILE - 13);
      }
    }
  }

  // 3. ゴミ描画
  dirts.forEach(d => {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🗑️', d.x, d.y);
  });

  // 4. 配置設備（棚・レジ・イートイン・ATM・観葉植物）
  placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'neighbor').forEach(drawFacility);
  placedObjects.filter(o => FACILITY_TYPES[o.type].cat !== 'neighbor').forEach(drawFacility);

  // 5. 通行人（店外）
  passers.forEach(p => {
    drawChibi(p.x, p.y, p.shirt, p.hair, p.bounce, false);
  });

  // 6. 来店客
  customers.forEach(c => {
    drawChibi(c.x, c.y, c.shirt, c.hair, c.bounce, false);
    if (c.state === 'queuing') {
      const r = Math.max(0, c.patience / c.maxPatience);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(c.x - 13, c.y - 25, 26, 5);
      ctx.fillStyle = r > 0.5 ? '#2cb67d' : (r > 0.25 ? '#f59e0b' : '#ef4444');
      ctx.fillRect(c.x - 12, c.y - 24, 24 * r, 3);
    } else if (c.emote) {
      drawEmoteBubble(c.x, c.y - 24, c.emote);
    }
  });

  // 7. 店員（店長含む）
  hiredStaff.forEach(st => {
    drawChibi(st.x, st.y, st.color, st.hair, st.bounce, true, st.isManager);
    if (st.carry) {
      // 商品箱を持っている描画
      ctx.fillStyle = '#f59e0b';
      ctx.strokeStyle = '#3b2d22';
      ctx.lineWidth = 1.5;
      ctx.fillRect(st.x + 6, st.y - 4, 11, 10);
      ctx.strokeRect(st.x + 6, st.y - 4, 11, 10);
    }
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(st.isManager ? '店長' : st.name.split(' ')[1], st.x, st.y - 20);
  });

  // 8. キャンペーンキラキラ演出
  if (state.campaignTimer > 0) {
    ctx.fillStyle = 'rgba(250, 204, 21, 0.9)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`📣 宣伝キャンペーン中! 残り${Math.ceil(state.campaignTimer)}秒`, cam.x + 14, cam.y + viewH() - 14);
  }

  // 9. フローティングテキスト
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  });
}

function getPreviewCombos(type, gx, gy, ignoreUid) {
  const hits = [];
  placedObjects.forEach(o => {
    if (o.uid === ignoreUid) return;
    if (Math.abs(o.x - gx) + Math.abs(o.y - gy) !== 1) return;
    if (type === 'plant' && FACILITY_TYPES[o.type].cat === 'shelf') hits.push('魅力+15%');
    if (o.type === 'plant' && FACILITY_TYPES[type].cat === 'shelf') hits.push('魅力+15%');
    COMBO_DEFS.forEach(c => {
      if ((type === c.a && o.type === c.b) || (type === c.b && o.type === c.a)) {
        hits.push(c.name);
      }
    });
  });
  return hits;
}

function drawFacility(obj) {
  const px = obj.x * TILE, py = obj.y * TILE;
  const def = FACILITY_TYPES[obj.type];

  // コーナー成立中のキラキラ枠
  if (obj.inCombo) {
    ctx.strokeStyle = (Math.floor(performance.now() / 350) % 2 === 0) ? '#f5b700' : '#fef08a';
    ctx.lineWidth = 3;
    ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
  }

  // 選択中のハイライト
  if (state.selectedObjId === obj.uid) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, TILE, TILE);
  }

  if (def.cat === 'shelf') {
    const p = products[def.prod];
    // 2.5D立体棚
    ctx.fillStyle = '#3b2d22';
    ctx.fillRect(px + 3, py + 4, TILE - 6, TILE - 6);
    ctx.fillStyle = p.color;
    ctx.fillRect(px + 5, py + 6, TILE - 10, TILE - 14);
    ctx.fillStyle = '#78350f'; // 前面フチ
    ctx.fillRect(px + 5, py + TILE - 10, TILE - 10, 6);

    // 商品ドット
    const cols = 4;
    for (let i = 0; i < obj.stock; i++) {
      const r = Math.floor(i / cols), col = i % cols;
      ctx.fillStyle = p.dot;
      ctx.beginPath();
      ctx.arc(px + 10 + col * 6.5, py + 12 + r * 8, 2.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // 右上にアイコン、右下に特売/在庫バッジ
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(p.icon, px + 3, py + 1);

    if (p.onSale) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(px + 20, py + 2, 17, 10);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('特売', px + 28.5, py + 3);

    ctx.fillStyle = obj.stock === 0 ? '#ef4444' : '#1e293b';

  } else if (def.cat === 'register') {
