// =========================================================
// ゲームロジック更新ループ
// =========================================================
function updateStaffAI(dt) {
  hiredStaff.forEach(st => {
    const spd = 72 + st.spdStat * 0.95;
    if (st.cooldown > 0) st.cooldown -= dt;
    if (st.isManager) { if (manualMove(st, dt, spd)) return; if (view3D) return; }

    // 移動処理
    if (st.path.length > 0) {
      const t = st.path[0];
      const dx = t.x - st.x, dy = t.y - st.y;
      const d = Math.hypot(dx, dy);
      if (d < 4) {
        st.path.shift();
      } else {
        const step = Math.min(d, spd * dt);
        st.x += (dx / d) * step;
        st.y += (dy / d) * step;
        st.bounce += dt * 12;
      }
      // 途中でゴミを踏んだら掃除
      for (let i = dirts.length - 1; i >= 0; i--) {
        if (Math.hypot(st.x - dirts[i].x, st.y - dirts[i].y) < 22) {
          dirts.splice(i, 1);
          state.rating = Math.min(5.0, state.rating + 0.02);
          addFloatText(st.x, st.y - 18, '✨掃除!', '#2cb67d');
        }
      }
      return;
    }

    if (st.cooldown > 0) return;

    const stx = Math.floor(st.x / TILE);
    const sty = Math.floor(st.y / TILE);

    // 接客係・販促係は入口で持ち場につく
    if (st.role === 'greeter' || st.role === 'promoter') {
      const post = st.role === 'greeter' ? { x: 4, y: 9 } : { x: 7, y: 9 };
      if (stx !== post.x || sty !== post.y) { const pp = findPath(stx, sty, post.x, post.y); if (pp.length) st.path = pp; }
      return;
    }

    // レジ対応チェック
    if (roleCash(st.role)) {
      const regs = placedObjects.filter(o => o.type === 'register');
      // 自分がすでにどこかのレジ後ろに立っていて客が並んでいるなら最優先
      const myReg = regs.find(r => stx === r.x && sty === r.y - 1);
      if (myReg && myReg.queue.length > 0) return; // レジ処理は updateRegisters がやる

      // 客が並んでいるのに店員がいないレジを探す
      const needyReg = regs.find(r => {
        if (r.queue.length === 0) return false;
        const someoneThere = hiredStaff.some(other =>
          other !== st && Math.floor(other.x/TILE) === r.x && Math.floor(other.y/TILE) === r.y - 1
        );
        return !someoneThere;
      });

      if (needyReg) {
        st.path = findPath(stx, sty, needyReg.x, needyReg.y - 1);
        return;
      }

      // レジ専任なら空いているレジの後ろで待機
      if (st.role === 'cashier') {
        const freeReg = regs.find(r => !hiredStaff.some(o => o !== st && Math.floor(o.x/TILE) === r.x && Math.floor(o.y/TILE) === r.y - 1));
        if (freeReg && (stx !== freeReg.x || sty !== freeReg.y - 1)) {
          st.path = findPath(stx, sty, freeReg.x, freeReg.y - 1);
        }
        return;
      }
    }

    // 品出し・清掃チェック
    if (roleStock(st.role)) {
      // 1. 商品を手に持っているなら対象棚へ運ぶ
      if (st.carry) {
        const targetShelf = placedObjects.find(o => o.uid === st.targetObjId);
        if (!targetShelf) { st.carry = null; return; }
        const def = FACILITY_TYPES[targetShelf.type];
        const near = Math.abs(stx - targetShelf.x) + Math.abs(sty - targetShelf.y) <= 1;
        if (near) {
          const space = def.maxCap - targetShelf.stock;
          const put = Math.min(space, st.carry.count);
          targetShelf.stock += put;
          if (st.carry.count > put) products[st.carry.prod].stock += (st.carry.count - put);
          st.carry = null;
          st.cooldown = 0.25;
          addFloatText(targetShelf.x*TILE + 20, targetShelf.y*TILE, `+${put}${products[def.prod].icon}`, '#2596be');
        } else {
          const adjs = getAdjacentWalkable(targetShelf.x, targetShelf.y);
          if (adjs.length > 0) {
            const p = findPath(stx, sty, adjs[0].x, adjs[0].y);
            if (p.length > 0) st.path = p;
          }
        }
        return;
      }

      // 2. 補充が必要な棚を探す
      const emptyShelves = placedObjects
        .filter(o => {
          const def = FACILITY_TYPES[o.type];
          if (def.cat !== 'shelf' || st.role === 'cleaner') return false;
          const rp = STAFF_ROLES[st.role] && STAFF_ROLES[st.role].prods;
          if (rp && !rp.includes(def.prod)) return false;
          const prod = products[def.prod];
          return o.stock < def.maxCap * 0.75 && prod.stock > 0;
        })
        .sort((a, b) => (a.stock / FACILITY_TYPES[a.type].maxCap) - (b.stock / FACILITY_TYPES[b.type].maxCap));

      if (emptyShelves.length > 0) {
        const tgt = emptyShelves[0];
        const def = FACILITY_TYPES[tgt.type];
        const prod = products[def.prod];
        const by = placedObjects.find(o => o.type === 'backyard');
        if (!by) return;
        if (Math.abs(stx - by.x) + Math.abs(sty - by.y) <= 1) {
          const take = Math.min(4, def.maxCap - tgt.stock, prod.stock);
          if (take > 0) {
            prod.stock -= take;
            st.carry = { prod: def.prod, count: take };
            st.targetObjId = tgt.uid;
            st.cooldown = 0.25;
          }
        } else {
          { const ad = getAdjacentWalkable(by.x, by.y); if (ad.length) st.path = findPath(stx, sty, ad[0].x, ad[0].y); }
        }
        return;
      }

      // 3. ゴミ掃除
      if (dirts.length > 0) {
        st.path = findPath(stx, sty, dirts[0].tx, dirts[0].ty);
        return;
      }
    }
  });
}

// レジ待ちの立ち位置：レジ正面を先頭に、近いマスから順に詰めて並ぶ
function queueSpots(reg, n) {
  let relaxed = false;
  const door = (x, y) => y === 10 && (x === 5 || x === 6);
  const ok = (x, y) => (relaxed || y >= reg.y) && !(x === reg.x && y === reg.y - 1) && (inStore(x, y) || door(x, y)) && isWalkableForPath(x, y);
  let first = [[0, 1], [-1, 1], [1, 1], [-2, 1], [2, 1], [-1, 0], [1, 0]].map(([dx, dy]) => [reg.x + dx, reg.y + dy]).find(([x, y]) => ok(x, y));
  if (!first) {   // 正面が塞がれていても、レジ近くの空きマスに並ばせる
    relaxed = true; let bd = 99;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { const dd = Math.abs(dx) + Math.abs(dy); if (dd && dd < bd && ok(reg.x + dx, reg.y + dy)) { bd = dd; first = [reg.x + dx, reg.y + dy]; } }
  }
  if (!first) return [];
  const out = [], seen = new Set([first[0] * 100 + first[1]]), q = [first];
  for (let qi = 0; qi < q.length && out.length < n; qi++) {
    const [x, y] = q[qi]; out.push({ x, y });
    [[0, 1], [-1, 0], [1, 0], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, k = nx * 100 + ny;
      if (!seen.has(k) && ok(nx, ny)) { seen.add(k); q.push([nx, ny]); }
    });
  }
  return out;
}
function layoutQueue(reg) {
  const spots = queueSpots(reg, reg.queue.length);
  reg.queue.forEach((c, i) => {
    const s = spots[i] || spots[spots.length - 1]; if (!s) return;
    c.spot = s;
    const p = findPath(Math.floor(c.x / TILE), Math.floor(c.y / TILE), s.x, s.y);
    c.path = p.length ? p : [{ x: s.x * TILE + TILE / 2, y: s.y * TILE + TILE / 2, tx: s.x, ty: s.y }];
  });
}

function updateRegisters(dt) {
  const regs = placedObjects.filter(o => o.type === 'register');
  regs.forEach(reg => {
    if (reg.queue.length === 0) { reg.progress = 0; return; }
    const head = reg.queue[0];
    const sp0 = queueSpots(reg, 1)[0];
    const standPos = sp0 ? { x: sp0.x * TILE + TILE / 2, y: sp0.y * TILE + TILE / 2 } : { x: reg.x * TILE + TILE / 2, y: (reg.y + 1) * TILE + TILE / 2 };
    if (Math.hypot(head.x - standPos.x, head.y - standPos.y) > 12) {
      reg.progress = 0;
      return;
    }

    // 後ろ(y-1)に店員が立っているか
    const worker = hiredStaff.find(st => Math.floor(st.x/TILE) === reg.x && Math.floor(st.y/TILE) === reg.y - 1);
    if (worker) {
      const rate = (0.65 + (worker.regStat / 100) * 1.4) * (worker.role === 'chief' ? 1.25 : 1); // 秒間進捗
      reg.progress += rate * dt;
      if (reg.progress >= 1) {
        reg.progress = 0;
        finishCustomerCheckout(reg, head, worker);
      }
    }
  });
}

function finishCustomerCheckout(reg, cust, worker) {
  reg.queue.shift();
  // 列を前に詰める
  layoutQueue(reg);

  let sum = 0;
  let extraSat = 0;
  cust.basket.forEach(item => {
    sum += item.paidPrice;
    extraSat += item.sat;
    const sl = (state.sales ||= {});
    const se = (sl[item.prod] ||= { qty: 0, rev: 0 });
    se.qty++; se.rev += item.paidPrice;
  });

  state.money += sum;
  state.totalRevenue += sum;
  state.monthStats.rev += sum;
  state.monthStats.served++;

  // スタッフの愛想と商品満足度で経営P＆評判ボーナス
  const ptGain = (Math.random() < (0.35 + worker.charmStat / 200)) ? 2 : 1;
  state.points += ptGain;
  state.rating = Math.max(1.0, Math.min(5.0, state.rating + 0.03 + extraSat * 0.15));

  SFX.cash();
  addFloatText(cust.x, cust.y - 22, `+¥${sum}`, '#15803d');
  if (ptGain >= 2) addFloatText(worker.x, worker.y - 24, `✨+${ptGain}P`, '#9333ea');

  // イートイン席が空いていれば少し寄ってから帰ることも
  const eatin = placedObjects.find(o => o.type === 'eatin');
  if (eatin && Math.random() < 0.35) {
    const adjs = getAdjacentWalkable(eatin.x, eatin.y);
    if (adjs.length > 0) {
      cust.state = 'eatin';
      cust.currentObjId = eatin.uid;
      cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adjs[0].x, adjs[0].y);
      return;
    }
  }

  cust.emote = '❤️';
  cust.emoteTimer = 1.5;
  sendCustomerHome(cust);
}

function sendCustomerHome(cust) {
  cust.state = 'leaving';
  const doorX = Math.random() < 0.5 ? 5 : 6;
  const cx = Math.floor(cust.x/TILE), cy = Math.floor(cust.y/TILE);
  const path = findPath(cx, cy, doorX, 9);
  path.push({ x: doorX * TILE + TILE/2, y: 11.5 * TILE });
  const exitX = Math.random() < 0.5 ? passMin() * TILE : passSpan() * TILE + 20;
  path.push({ x: exitX, y: 11.5 * TILE });
  cust.path = path;
}

function assignCustomerNextTarget(cust) {
  if (cust.targets.length === 0) {
    if (cust.wantsAtm) {
      cust.wantsAtm = false;
      const atm = placedObjects.find(o => o.type === 'atm');
      if (atm) {
        const adjs = getAdjacentWalkable(atm.x, atm.y);
        if (adjs.length > 0) {
          cust.state = 'atm';
          cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adjs[0].x, adjs[0].y);
          return;
        }
      }
    }

    if (cust.machineUid) {
      const mc = placedObjects.find(o => o.uid === cust.machineUid);
      cust.machineUid = null;
      if (mc) {
        const adjs = getAdjacentWalkable(mc.x, mc.y);
        if (adjs.length > 0) {
          const a = adjs[Math.floor(Math.random() * adjs.length)];
          cust.state = 'machine';
          cust.currentObjId = mc.uid;
          cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), a.x, a.y);
          return;
        }
      }
    }

    if (cust.basket.length > 0) {
      // レジへ
      const regs = placedObjects.filter(o => o.type === 'register');
      if (regs.length === 0) {
        cust.emote = '💢';
        sendCustomerHome(cust);
        return;
      }
      regs.sort((a, b) => a.queue.length - b.queue.length);
      const chosen = regs[0];
      if (chosen.queue.length >= 5) {
        state.rating = Math.max(1.0, state.rating - 0.1);
        cust.emote = '💢';
        addFloatText(cust.x, cust.y - 20, '混みすぎ!', '#e5484d');
        sendCustomerHome(cust);
        return;
      }
      cust.state = 'queuing';
      cust.regUid = chosen.uid;
      chosen.queue.push(cust);
      layoutQueue(chosen);
    } else {
      sendCustomerHome(cust);
    }
    return;
  }

  const nextUid = cust.targets.shift();
  const obj = placedObjects.find(o => o.uid === nextUid);
  if (!obj) return assignCustomerNextTarget(cust);
  const adjs = getAdjacentWalkable(obj.x, obj.y);
  if (adjs.length === 0) return assignCustomerNextTarget(cust);
  const adj = adjs[Math.floor(Math.random() * adjs.length)];
  cust.state = 'shopping';
  cust.currentObjId = nextUid;
  cust.path = findPath(Math.floor(cust.x/TILE), Math.floor(cust.y/TILE), adj.x, adj.y);
}

// 近くに商品棚があるか（歩きながら眺める判定）
function shelfNear(c) {
  return placedObjects.some(o => FACILITY_TYPES[o.type].cat === 'shelf' && Math.hypot((o.x + 0.5) * TILE - c.x, (o.y + 0.5) * TILE - c.y) < 1.7 * TILE);
}
function updateCustomers(dt) {
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    if (c.emoteTimer > 0) {
      c.emoteTimer -= dt;
      if (c.emoteTimer <= 0) c.emote = null;
    }

    if (c.pause > 0) {
      c.pause -= dt; c.v = 0;
    } else if (c.path && c.path.length > 0) {
      const t = c.path[0];
      const dx = t.x - c.x, dy = t.y - c.y;
      const d = Math.hypot(dx, dy);
      // 自動ドアが開ききるまで手前で待つ
      const gate = Math.abs(c.x - 6 * TILE) < 1.2 * TILE && ((c.y >= 9.3 * TILE && c.y < 10 * TILE && t.y >= 10 * TILE) || (c.y > 11 * TILE && c.y <= 11.8 * TILE && t.y <= 11 * TILE));
      if (gate && DOOR.open < 0.55) {
        c.v = 0; c.fx = Math.sign(dx); c.fy = Math.sign(dy);
      } else if (d < 4) {
        c.path.shift();
      } else {
        let sp = c.speed;
        if (c.state === 'shopping' && c.path.length <= 2) sp *= 0.65;   // 棚に近づくとゆっくり歩く
        if (c.state === 'shopping' && c.path.length > 2 && Math.random() < dt * 0.22 && shelfNear(c)) {   // 歩きながら商品を眺めて立ち止まる
          c.pause = 0.5 + Math.random() * 0.9;
          if (Math.random() < 0.4) { c.emote = '👀'; c.emoteTimer = 0.8; }
        }
        c.v = (c.v || 0) + (sp - (c.v || 0)) * Math.min(1, dt * 5);     // 加速・減速
        const step = Math.min(d, c.v * dt);
        c.x += (dx / d) * step; c.y += (dy / d) * step;
        c.fx = dx / d; c.fy = dy / d;
        c.bounce += dt * (2 + c.v / 9);
        for (const o of customers) {   // 他のお客さんとぶつからないように避ける
          if (o === c) continue;
          const ox = o.x - c.x, oy = o.y - c.y, od = Math.hypot(ox, oy);
          if (od > 0.1 && od < 15) {
            const k = (15 - od) * Math.min(1, dt * 4) * 0.5, nx = c.x - ox / od * k, ny = c.y - oy / od * k;
            if (isWalkableForPath(Math.floor(nx / TILE), Math.floor(ny / TILE))) { c.x = nx; c.y = ny; }
          }
        }
      }
    } else {
      c.v = 0;
      if (c.state === 'entering') {
        assignCustomerNextTarget(c);
      } else if (c.state === 'shopping') {
        c.state = 'picking';
        c.waitTimer = c.browse = 1.2 + Math.random() * 1.8; c.looked = false;   // 商品を手に取って品定め
        if (Math.random() < 0.18 && c.targets.length < 3) {   // ふと目に留まって寄り道
          const cur = placedObjects.find(o => o.uid === c.currentObjId);
          const nb = cur ? placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'shelf' && o.stock > 0 && o.uid !== cur.uid && !c.targets.includes(o.uid) && Math.abs(o.x - cur.x) + Math.abs(o.y - cur.y) <= 3) : [];
          if (nb.length) { c.targets.unshift(nb[Math.floor(Math.random() * nb.length)].uid); c.emote = '✨'; c.emoteTimer = 0.9; }
        }
      } else if (c.state === 'picking') {
        c.waitTimer -= dt;
        const o2 = placedObjects.find(o => o.uid === c.currentObjId);
        if (o2) {   // 棚の方を向く
          const ddx = (o2.x + 0.5) * TILE - c.x, ddy = (o2.y + 0.5) * TILE - c.y;
          if (Math.abs(ddx) > Math.abs(ddy)) { c.fx = Math.sign(ddx); c.fy = 0; } else { c.fx = 0; c.fy = Math.sign(ddy); }
        }
        if (!c.looked && c.waitTimer < c.browse * 0.5) { c.looked = true; if (Math.random() < 0.5) { c.emote = '🤔'; c.emoteTimer = 0.9; } }
        if (c.waitTimer <= 0) {
          c.looked = false;
          const obj = placedObjects.find(o => o.uid === c.currentObjId);
          if (obj && obj.stock > 0) {
            const p = products[FACILITY_TYPES[obj.type].prod];
            const fb = getPriceFeedback(p);
            if (Math.random() <= fb.buyProb) {
              obj.stock--;
              c.basket.push({ prod: p.id, paidPrice: getEffectivePrice(p), sat: fb.sat });
              if (fb.sat >= 0.1) {
                c.emote = '🎵'; c.emoteTimer = 1.2;
                addFloatText(c.x, c.y - 20, `${p.icon}安い!`, '#16a34a');
              } else {
                addFloatText(c.x, c.y - 20, `${p.icon}`, '#3b2d22');
              }
            } else {
              // 高すぎて買わない！
              state.rating = Math.max(1.0, state.rating - 0.08);
              c.emote = '💦'; c.emoteTimer = 1.3;
              SFX.angry();
              addFloatText(c.x, c.y - 20, '高いな…', '#e5484d');
            }
          } else {
            state.rating = Math.max(1.0, state.rating - 0.08);
            c.emote = '💢'; c.emoteTimer = 1.2;
            addFloatText(c.x, c.y - 20, '品切れ!', '#e5484d');
          }
          assignCustomerNextTarget(c);
        }
      } else if (c.state === 'atm') {
        state.money += 120;
        state.monthStats.extra += 120;
        state.points += 1;
        SFX.cash();
        addFloatText(c.x, c.y - 20, '🏧+¥120', '#2596be');
        assignCustomerNextTarget(c);
      } else if (c.state === 'machine') {
        const mc = placedObjects.find(o => o.uid === c.currentObjId);
        if (mc) useMachine(mc, c);
        assignCustomerNextTarget(c);
      } else if (c.state === 'eatin') {
        if (c.waitTimer <= 0) c.waitTimer = 1.8;
        c.waitTimer -= dt;
        if (c.waitTimer <= 0) {
          state.points += 2;
          SFX.heart();
          addFloatText(c.x, c.y - 20, '✨+2P 満腹!', '#f59e0b');
          c.emote = '❤️'; c.emoteTimer = 1.2;
          sendCustomerHome(c);
        }
      } else if (c.state === 'leaving') {
        customers.splice(i, 1);
        continue;
      }
    }

    // レジ待ち我慢ゲージ
    if (c.state === 'queuing') {
      const reg = placedObjects.find(o => o.uid === c.regUid);
      if (reg && (!c.path || !c.path.length)) {   // 立ち止まっているのに定位置でなければ、レジ近くへ詰め直す
        const qi = reg.queue.indexOf(c), sp = qi >= 0 ? (queueSpots(reg, qi + 1)[qi] || c.spot) : null;
        if (sp && (Math.floor(c.x / TILE) !== sp.x || Math.floor(c.y / TILE) !== sp.y)) layoutQueue(reg);
      }
      const isProcessing = reg && reg.queue[0] === c && reg.progress > 0;
      if (!isProcessing) {
        c.patience -= dt * patienceMul();
        if (c.patience <= 0) {
          if (reg) {
            const idx = reg.queue.indexOf(c);
            if (idx !== -1) { reg.queue.splice(idx, 1); layoutQueue(reg); }
          }
          state.rating = Math.max(1.0, state.rating - 0.14);
          SFX.angry();
          addFloatText(c.x, c.y - 20, '待ちすぎ💢', '#e5484d');
          sendCustomerHome(c);
        }
      }
    }
  }
}

function updateCalendarAndEconomy(dt) {
  // 1週間 = 20秒
  state.weekTimer += dt;
  if (state.campaignTimer > 0) state.campaignTimer = Math.max(0, state.campaignTimer - dt);

  if (state.weekTimer >= 20) {
    state.weekTimer -= 20;
    state.week++;
    { const rent = placedObjects.reduce((a, o) => a + (FACILITY_TYPES[o.type].rent || 0) + (FACILITY_TYPES[o.type].income ? fxIncome(o) : 0), 0); if (rent) { state.money += rent; state.monthStats.extra += rent; } }
    stores.forEach((sx, i) => { if (i === curStore || !sx.placedObjects) return; const n = sx.placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'shelf').length; const g = Math.round(n * 160 * (0.6 + state.rating / 5)); state.money += g; state.monthStats.extra += g; });

    // 週ごとの自動仕入れ（棚で減った分の補填としてバックヤードへ仕入れ）
    if (state.autoRestock) {
      Object.values(products).forEach(p => {
        if (p.unlockRank <= state.rankIdx && p.stock < 16) {
          const buyQty = 15;
          const cost = getUnitCost(p) * buyQty;
          if (state.money >= cost) {
            state.money -= cost;
            state.monthStats.cost += cost;
            p.stock += buyQty;
          }
        }
      });
    }

    if (state.week > 4) {
      state.week = 1;
      state.month++;
      if (state.month > 12) {
        state.month = 1;
        state.year++;
      }
      onMonthEnd();
    }
  }

  // 通行人スポーン
  passerTimer -= dt;
  if (passerTimer <= 0) {
    passerTimer = (state.campaignTimer > 0 ? 1.1 : 2.1) * (0.7 + Math.random()*0.6) / (1 + tenantTraffic());
    if (passers.length < 14) spawnPasser();
  }

  // 通行人更新 & 入店判定
  for (let i = passers.length - 1; i >= 0; i--) {
    const p = passers[i];
    p.x += p.dir * p.speed * dt;
    p.bounce += dt * 9;
    if (!p.checkedStore && Math.abs(p.x - 6 * TILE) < 35) {
      p.checkedStore = true;
      if (tryEnterCustomerFromPasser(p)) {
        passers.splice(i, 1);
        continue;
      }
    }
    // お隣の店の入口の前を通ったら、入るかどうか判定
    if (!p.visited) p.visited = new Set();
    let enteredNb = false;
    for (const o of placedObjects) {
      if (FACILITY_TYPES[o.type].cat !== 'neighbor' || p.visited.has(o.uid)) continue;
      if (Math.abs(p.x - (o.x + NB_W / 2) * TILE) < 35) {
        p.visited.add(o.uid);
        if (tryEnterNeighbor(p, o)) { passers.splice(i, 1); enteredNb = true; break; }
      }
    }
    if (enteredNb) continue;
    if (p.x < passMin() * TILE - 30 || p.x > passSpan() * TILE + 30) passers.splice(i, 1);
  }

  // ゴミ発生
  dirtTimer -= dt;
  if (dirtTimer <= 0) {
    dirtTimer = 15 + Math.random() * 12;
    const b = getStoreBounds();
    if (dirts.length < 5 && customers.length > 0) {
      for (let t = 0; t < 10; t++) {
        const rx = 2 + Math.floor(Math.random() * (b.maxX - 1));
        const ry = 2 + Math.floor(Math.random() * 7);
        if (isWalkableForPath(rx, ry)) {
          dirts.push({ tx: rx, ty: ry, x: rx*TILE + TILE/2, y: ry*TILE + TILE/2 });
          break;
        }
      }
    }
  }

  if (dirts.length >= 3) {
    state.rating = Math.max(1.0, state.rating - 0.006 * dt * dirts.length);
  }
}

function onMonthEnd() {
  // 月給（週給×4ではなく月次人件費として日給×4を請求して分かりやすく）
  let wages = 0;
  [hiredStaff, ...stores.filter((sx, i) => i !== curStore && sx.hiredStaff).map(sx => sx.hiredStaff)].forEach(a => a.forEach(s => { if (!s.isManager) wages += s.wage * 3; }));
  state.money -= wages;
  state.monthStats.wages = wages;

  const net = state.monthStats.rev + state.monthStats.extra - state.monthStats.cost - wages;

  // 店舗ランク昇格チェック
  let promoted = null;
  if (state.rankIdx < RANKS.length - 1) {
    const nextR = RANKS[state.rankIdx + 1];
    if (state.totalRevenue >= nextR.needRev) {
      state.rankIdx++;
      promoted = nextR;
      state.points += 30;
    }
  }

  // 決算レポートは左下に表示するだけ（ゲームは止めない）
  if (promoted) SFX.fanfare();
  else SFX.combo();

  const repMonth = state.month === 1 ? 12 : state.month - 1;
  const repYear = state.month === 1 ? state.year - 1 : state.year;
  const entry = {
    y: repYear, m: repMonth, rev: state.monthStats.rev, extra: state.monthStats.extra,
    cost: state.monthStats.cost, wages, net, served: state.monthStats.served,
    rank: promoted ? promoted.rank : null
  };
  (state.history ||= []).push(entry);
  if (state.history.length > 60) state.history.shift();
  if (promoted) setTicker(`🎉 店舗ランクアップ！ ランク ${promoted.rank}【${promoted.name}】になりました！`);
  showReport(entry, promoted);

  state.monthStats = { rev: 0, cost: 0, wages: 0, extra: 0, served: 0 };
  updateHUD();
  refreshAllTabs();
}

// =========================================================
// Canvas 描画 (カイロソフト風 ピクセル＆ポップスタイル)
// =========================================================
let hoverTile = null;

function draw() {
  if (!canvas.clientWidth) return;
  resizeCanvas();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(cam.scale, 0, 0, cam.scale, -cam.x * cam.scale, -cam.y * cam.scale);
  const b = getStoreBounds();
  const vx0 = Math.floor(cam.x / TILE) - 1, vx1 = Math.ceil((cam.x + viewW()) / TILE) + 1, vy0 = Math.floor(cam.y / TILE) - 1, vy1 = Math.ceil((cam.y + viewH()) / TILE) + 1;

  // 1. 地面・道路・店内床（上下左右に無限）
  const gx0 = vx0 * TILE, gw = (vx1 - vx0 + 1) * TILE;
  ctx.fillStyle = '#86efac'; ctx.fillRect(gx0, vy0 * TILE, gw, (vy1 - vy0 + 1) * TILE);
  if ((vx1 - vx0) * (vy1 - vy0) < 3000) {
    for (let y = vy0; y <= vy1; y++) for (let x = vx0; x <= vx1; x++) {
      if (isRoad(y) || inBuilding(x, y)) continue;
      const px = x * TILE, py = y * TILE;
      if ((x + y) % 2 === 0) { ctx.fillStyle = '#4ade80'; ctx.fillRect(px, py, TILE, TILE); }
      if ((x * 7 + y * 13) % 9 === 0) { ctx.fillStyle = '#22c55e'; ctx.fillRect(px + 12, py + 14, 6, 6); }
    }
  }
  ctx.fillStyle = '#d6d3d1'; ctx.fillRect(gx0, 11 * TILE, gw, TILE);
  ctx.fillStyle = '#a8a29e'; ctx.fillRect(gx0, 12 * TILE - 4, gw, 4);
  ctx.fillStyle = '#64748b'; ctx.fillRect(gx0, 12 * TILE, gw, TILE);
  ctx.fillStyle = '#e2e8f0';
  for (let x = vx0; x <= vx1; x++) if (x % 2 === 0) ctx.fillRect(x * TILE + 8, 12 * TILE + 18, 22, 4);
  for (let y = Math.max(0, vy0); y <= Math.min(10, vy1); y++) for (let x = Math.max(0, vx0); x <= Math.min(b.maxX + 1, vx1); x++) {
    const px = x * TILE, py = y * TILE;
    if (inStore(x, y)) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#fffbeb' : '#fef3c7'; ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = 'rgba(180, 140, 80, 0.12)'; ctx.strokeRect(px, py, TILE, TILE);
    } else {
      ctx.fillStyle = '#475569'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#334155'; ctx.fillRect(px, py + TILE - 6, TILE, 6);
    }
  }

  // 店舗の赤いストライプひさし（y=0 と y=10 の店舗上部に飾る）
  for (let x = b.minX - 1; x <= b.maxX + 1; x++) {
    ctx.fillStyle = x % 2 === 0 ? '#ef4444' : '#ffffff';
    ctx.fillRect(x * TILE, 0, TILE, 16);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x * TILE, 16, TILE, 3);
  }
  // 屋外エリア境界と案内
  ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo((b.maxX + 2) * TILE, TILE); ctx.lineTo((b.maxX + 2) * TILE, 11 * TILE); ctx.stroke(); ctx.restore();
  ctx.fillStyle = 'rgba(20,83,45,.8)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🌳 屋外エリア（棚・装飾・ブロック・お隣の店OK）', Math.max((b.maxX + 2) * TILE + 150, cam.x + viewW() / 2), 1.5 * TILE);
  // 店舗看板（編集可）
  const sr = signRect();
  ctx.fillStyle = '#1e293b'; ctx.fillRect(sr.cx - sr.w / 2, 2, sr.w, 28);
  ctx.fillStyle = signBg(); ctx.fillRect(sr.cx - sr.w / 2 + 3, 5, sr.w - 6, 22);
  ctx.fillStyle = '#1e293b'; ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(signLabel(), sr.cx, 16);

  // バックヤード表示
  ctx.fillStyle = '#334155';
  ctx.font = 'bold 10px sans-serif';
  

  // 自動ドア描画 (x=5,6, y=10)：センサーで左右にスライド
  {
    const e = DOOR.open * DOOR.open * (3 - 2 * DOOR.open), x0 = 5 * TILE, y0 = 10 * TILE + 4, w = 2 * TILE, h = TILE - 8;
    ctx.fillStyle = '#334155'; ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = '#64748b'; ctx.fillRect(x0 + 4, y0 + h / 2 - 3, w - 8, 6);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
    const off = e * (TILE - 4);
    [[x0 - off, 1], [x0 + TILE + off, -1]].forEach(([qx, dir]) => {
      ctx.fillStyle = 'rgba(186,230,253,.85)'; ctx.fillRect(qx, y0, TILE, h);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath();
      ctx.moveTo(qx + 6, y0 + h); ctx.lineTo(qx + 16, y0); ctx.lineTo(qx + 22, y0); ctx.lineTo(qx + 12, y0 + h); ctx.fill();
      ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2; ctx.strokeRect(qx + 1, y0 + 1, TILE - 2, h - 2);
      ctx.fillStyle = '#0369a1'; ctx.fillRect(dir > 0 ? qx + TILE - 5 : qx + 1, y0 + h * 0.3, 4, h * 0.4);
    });
    ctx.restore();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, w, h);
    ctx.fillStyle = DOOR.open > 0.05 ? '#22c55e' : '#ef4444';
    ctx.beginPath(); ctx.arc(6 * TILE, y0 - 2, 3, 0, Math.PI * 2); ctx.fill();
  }

  // 特売中のぼり旗（店外入口横）
  const hasSale = Object.values(products).some(p => p.onSale);
  if (hasSale) {
    const wave = Math.sin(performance.now() / 180) * 3;
    ctx.fillStyle = '#78350f';
    ctx.fillRect(4 * TILE + 12, 10.1 * TILE, 3, 34);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(4 * TILE + 15, 10.1 * TILE + wave * 0.2, 20, 22);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('特売', 4 * TILE + 25, 10.35 * TILE);
  }

  // 2. 建築モード時のグリッドとゴーストプレビュー
  if (state.buildMode) {
    ctx.strokeStyle = 'rgba(37, 150, 190, 0.35)';
    ctx.lineWidth = 1;
    for (let y = b.minY; y <= b.maxY; y++) {
      for (let x = b.minX; x <= b.maxX; x++) {
        ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
      }
    }

    if (FACILITY_TYPES[state.buildMode.type].cat === 'fixture') {
      const hs = FACILITY_TYPES[state.buildMode.type].hosts;
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 1;
      placedObjects.forEach(o => {
        if (FACILITY_TYPES[o.type].cat !== 'neighbor' || (hs && !hs.includes(o.type))) return;
        for (let y = o.y + 1; y <= o.y + NB_H - 2; y++) for (let x = o.x + 1; x <= o.x + NB_W - 2; x++) ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
      });
    }
    if (hoverTile) {
      const check = canPlaceSafely(state.buildMode.type, hoverTile.x, hoverTile.y, state.buildMode.moveUid);
      ctx.fillStyle = check.ok ? 'rgba(44, 182, 125, 0.45)' : 'rgba(229, 72, 77, 0.45)';
      ctx.fillRect(hoverTile.x * TILE, hoverTile.y * TILE, TILE * fpOf(state.buildMode.type).w, TILE * fpOf(state.buildMode.type).h);
      ctx.strokeStyle = check.ok ? '#15803d' : '#991b1b';
      ctx.lineWidth = 3;
      ctx.strokeRect(hoverTile.x * TILE + 1, hoverTile.y * TILE + 1, TILE * fpOf(state.buildMode.type).w - 2, TILE * fpOf(state.buildMode.type).h - 2);

      // コーナー成立予報！
      if (check.ok) {
        const previewCombos = getPreviewCombos(state.buildMode.type, hoverTile.x, hoverTile.y, state.buildMode.moveUid);
        if (previewCombos.length > 0) {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(hoverTile.x * TILE - 40, hoverTile.y * TILE - 24, 120, 20);
          ctx.fillStyle = '#fde047';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText(`✨ ${previewCombos[0]}!`, hoverTile.x * TILE + 20, hoverTile.y * TILE - 14);
        }
      } else {
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(hoverTile.x * TILE - 50, hoverTile.y * TILE - 22, 140, 18);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(check.reason, hoverTile.x * TILE + 20, hoverTile.y * TILE - 13);
      }
    }
  }

  // 3. ゴミ描画
  dirts.forEach(d => {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🗑️', d.x, d.y);
  });

  // 4. 配置設備（棚・レジ・イートイン・ATM・観葉植物）
  placedObjects.filter(o => FACILITY_TYPES[o.type].cat === 'neighbor').forEach(drawFacility);
  placedObjects.filter(o => FACILITY_TYPES[o.type].cat !== 'neighbor').forEach(drawFacility);

  // 5. 通行人（店外）
  passers.forEach(p => {
    drawChibi(p.x, p.y, p.shirt, p.hair, p.bounce, false);
  });

  // 5b. お隣の店に入った人
  visitors.forEach(v => {
    drawChibi(v.x, v.y, v.shirt, v.hair, v.bounce, false);
    if (v.emote) drawEmoteBubble(v.x, v.y - 24, v.emote);
  });

  // 6. 来店客
  customers.forEach(c => {
    const lean = c.state === 'picking' ? 2.5 : 0;   // 商品を見るときは少し棚に寄る
    drawChibi(c.x + (c.fx || 0) * lean, c.y + (c.fy || 0) * lean * 0.6, c.shirt, c.hair, c.bounce, false);
    if (c.basket && c.basket.length) {   // 買い物かご
      const bx = c.x + 9, by2 = c.y + 2;
      ctx.fillStyle = '#d97706'; ctx.fillRect(bx, by2, 9, 7); ctx.strokeStyle = '#3b2d22'; ctx.lineWidth = 1; ctx.strokeRect(bx, by2, 9, 7);
      c.basket.slice(-3).forEach((b, k) => { ctx.fillStyle = products[b.prod].dot; ctx.fillRect(bx + 1 + k * 3, by2 - 2, 3, 3); });
    }
    if (c.state === 'picking' && c.currentObjId != null) {   // 商品を手に取って眺める
      const sh = placedObjects.find(o => o.uid === c.currentObjId);
      if (sh && FACILITY_TYPES[sh.type].prod) {
        ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(products[FACILITY_TYPES[sh.type].prod].icon, c.x + (c.fx || 0) * 13, c.y - 2 + Math.sin(performance.now() / 160 + c.id * 9) * 1.5);
      }
    }
    if (c.state === 'queuing') {
      const r = Math.max(0, c.patience / c.maxPatience);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(c.x - 13, c.y - 25, 26, 5);
      ctx.fillStyle = r > 0.5 ? '#2cb67d' : (r > 0.25 ? '#f59e0b' : '#ef4444');
      ctx.fillRect(c.x - 12, c.y - 24, 24 * r, 3);
    } else if (c.emote) {
      drawEmoteBubble(c.x, c.y - 24, c.emote);
    }
  });

  // 7. 店員（店長含む）
  hiredStaff.forEach(st => {
    drawChibi(st.x, st.y, st.color, st.hair, st.bounce, true, st.isManager);
    if (st.carry) {
      // 商品箱を持っている描画
      ctx.fillStyle = '#f59e0b';
      ctx.strokeStyle = '#3b2d22';
      ctx.lineWidth = 1.5;
      ctx.fillRect(st.x + 6, st.y - 4, 11, 10);
      ctx.strokeRect(st.x + 6, st.y - 4, 11, 10);
    }
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(st.isManager ? '店長' : st.name.split(' ')[1], st.x, st.y - 20);
  });

  // 8. キャンペーンキラキラ演出
  if (state.campaignTimer > 0) {
    ctx.fillStyle = 'rgba(250, 204, 21, 0.9)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`📣 宣伝キャンペーン中! 残り${Math.ceil(state.campaignTimer)}秒`, cam.x + 14, cam.y + viewH() - 14);
  }

  // 9. フローティングテキスト
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1;
  });
}

function getPreviewCombos(type, gx, gy, ignoreUid) {
  const hits = [];
  placedObjects.forEach(o => {
    if (o.uid === ignoreUid) return;
    if (Math.abs(o.x - gx) + Math.abs(o.y - gy) !== 1) return;
    if (type === 'plant' && FACILITY_TYPES[o.type].cat === 'shelf') hits.push('魅力+15%');
    if (o.type === 'plant' && FACILITY_TYPES[type].cat === 'shelf') hits.push('魅力+15%');
    COMBO_DEFS.forEach(c => {
      if ((type === c.a && o.type === c.b) || (type === c.b && o.type === c.a)) {
        hits.push(c.name);
      }
    });
  });
  return hits;
}

function drawFacility(obj) {
  const px = obj.x * TILE, py = obj.y * TILE;
  const def = FACILITY_TYPES[obj.type];

  // コーナー成立中のキラキラ枠
  if (obj.inCombo) {
    ctx.strokeStyle = (Math.floor(performance.now() / 350) % 2 === 0) ? '#f5b700' : '#fef08a';
    ctx.lineWidth = 3;
    ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
  }

  // 選択中のハイライト
  if (state.selectedObjId === obj.uid) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, TILE, TILE);
  }

  if (def.cat === 'shelf') {
    const p = products[def.prod];
    // 2.5D立体棚
    ctx.fillStyle = '#3b2d22';
    ctx.fillRect(px + 3, py + 4, TILE - 6, TILE - 6);
    ctx.fillStyle = p.color;
    ctx.fillRect(px + 5, py + 6, TILE - 10, TILE - 14);
    ctx.fillStyle = '#78350f'; // 前面フチ
    ctx.fillRect(px + 5, py + TILE - 10, TILE - 10, 6);

    // 同じ棚が隣り合うと連結して柄が変わる（つながった数で3段階）
    {
      const sm = [[-1, 0], [1, 0], [0, -1], [0, 1]].map(([a, b]) => placedObjects.some(q => q.type === obj.type && q.x === obj.x + a && q.y === obj.y + b));
      const ns = sm.filter(Boolean).length;
      if (ns) {
        const l = sm[0] ? 0 : 5, r = sm[1] ? 0 : 5;
        ctx.fillStyle = '#3b2d22'; if (sm[0]) ctx.fillRect(px, py + 4, 5, TILE - 6); if (sm[1]) ctx.fillRect(px + TILE - 5, py + 4, 5, TILE - 6);
        ctx.fillStyle = p.color; if (sm[0]) ctx.fillRect(px, py + 6, 5, TILE - 14); if (sm[1]) ctx.fillRect(px + TILE - 5, py + 6, 5, TILE - 14);
        ctx.save(); ctx.beginPath(); ctx.rect(px + l, py + 6, TILE - l - r, TILE - 14); ctx.clip();
        ctx.fillStyle = ns >= 3 ? 'rgba(250,204,21,.35)' : ns === 2 ? 'rgba(255,255,255,.32)' : 'rgba(0,0,0,.14)';
        for (let wx = Math.floor(px / 8) * 8; wx < px + TILE; wx += 8) ctx.fillRect(wx, py + 6, 4, TILE - 14);
        ctx.restore();
        ctx.fillStyle = p.dot; ctx.fillRect(px + l, py + 6, TILE - l - r, 3);
      }
      ctx.fillStyle = '#78350f';
    }

    // 商品ドット
    const cols = 4;
    for (let i = 0; i < obj.stock; i++) {
      const r = Math.floor(i / cols), col = i % cols;
      ctx.fillStyle = p.dot;
      ctx.beginPath();
      ctx.arc(px + 10 + col * 6.5, py + 12 + r * 8, 2.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // 右上にアイコン、右下に特売/在庫バッジ
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(p.icon, px + 3, py + 1);

    if (p.onSale) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(px + 20, py + 2, 17, 10);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('特売', px + 28.5, py + 3);
    }

    ctx.fillStyle = obj.stock === 0 ? '#ef4444' : '#1e293b';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`${obj.stock}`, px + TILE - 6, py + TILE - 11);

  } else if (def.cat === 'register') {
    // レジカウンター
    ctx.fillStyle = '#3b2d22';
    ctx.fillRect(px + 2, py + 6, TILE - 4, TILE - 10);
    ctx.fillStyle = '#2596be';
    ctx.fillRect(px + 4, py + 8, TILE - 8, TILE - 14);
    // レジ機本体
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(px + 10, py + 10, 20, 14);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px + 12, py + 12, 16, 6);
    // 店員立ち位置ドット枠
    ctx.strokeStyle = 'rgba(44, 182, 125, 0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 8, (obj.y - 1)*TILE + 8, TILE - 16, TILE - 16);

    if (obj.progress > 0) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(px + 4, py - 5, TILE - 8, 5);
      ctx.fillStyle = '#2cb67d';
      ctx.fillRect(px + 5, py - 4, (TILE - 10) * obj.progress, 3);
    }

  } else if (def.cat === 'eatin') {
    ctx.fillStyle = '#92400e';
    ctx.fillRect(px + 6, py + 8, TILE - 12, TILE - 14);
    ctx.fillStyle = '#fef3c7';
    ctx.fillRect(px + 8, py + 10, TILE - 16, TILE - 20);
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('☕', px + TILE/2, py + TILE/2);

  } else if (def.cat === 'atm') {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px + 6, py + 4, TILE - 12, TILE - 8);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(px + 9, py + 8, TILE - 18, 14);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ATM', px + TILE/2, py + 30);

  } else if (def.cat === 'backyard') {
    ctx.fillStyle = '#475569'; ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(px + 5, py + 5, TILE - 10, TILE - 10);
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1e293b'; ctx.fillText('📦', px + TILE / 2, py + TILE / 2);
    const n = Object.values(BACK_EQUIP).filter(e => equipLv[e.id] > 0).length;
    if (n > 0) { ctx.font = 'bold 9px sans-serif'; ctx.fillText('🏭×' + n, px + TILE / 2, py + TILE - 3); }
  } else if (def.win) {
    ctx.fillStyle = '#64748b'; ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = 'rgba(186,230,253,.92)'; ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath();
    ctx.moveTo(px + 7, py + TILE - 6); ctx.lineTo(px + 18, py + 4); ctx.lineTo(px + 25, py + 4); ctx.lineTo(px + 14, py + TILE - 6); ctx.fill();
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(px + TILE / 2, py + 3); ctx.lineTo(px + TILE / 2, py + TILE - 3); ctx.moveTo(px + 3, py + TILE / 2); ctx.lineTo(px + TILE - 3, py + TILE / 2); ctx.stroke();
  } else if (def.cat === 'block') {
    ctx.fillStyle = def.color; ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
    ctx.beginPath(); ctx.moveTo(px, py + TILE / 2); ctx.lineTo(px + TILE, py + TILE / 2);
    ctx.moveTo(px + TILE / 2, py); ctx.lineTo(px + TILE / 2, py + TILE / 2);
    ctx.moveTo(px + TILE / 4, py + TILE / 2); ctx.lineTo(px + TILE / 4, py + TILE); ctx.stroke();
  } else if (def.cat === 'neighbor') {
    const W = NB_W * TILE, H = NB_H * TILE, n2 = NB_W * 2, fl = FLOOR_THEMES[floorOf(obj)];
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(px + 4, py + 6, W, H);
    ctx.fillStyle = '#475569'; ctx.fillRect(px, py, W, H);
    for (let y = 1; y < NB_H - 1; y++) for (let x = 1; x < NB_W - 1; x++) { ctx.fillStyle = (x + y) % 2 ? fl[0] : fl[1]; ctx.fillRect(px + x * TILE, py + y * TILE, TILE, TILE); }
    for (let i = 0; i < n2; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#ef4444'; ctx.fillRect(px + i * W / n2, py, W / n2 + 0.5, 16); }
    ctx.fillStyle = '#1e293b'; ctx.fillRect(px + W / 2 - 80, py + 19, 160, 19);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fef9c3'; ctx.font = '900 12px sans-serif'; ctx.fillText(def.icon + ' ' + def.name, px + W / 2, py + 29);
    ctx.fillStyle = '#0369a1'; ctx.fillRect(px + W / 2 - TILE + 4, py + H - TILE + 4, 2 * TILE - 8, TILE - 8);
    ctx.strokeStyle = def.color; ctx.lineWidth = 3; ctx.strokeRect(px + 1.5, py + 1.5, W - 3, H - 3);
  } else if (def.cat === 'fixture') {
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(px + 5, py + 6, TILE - 6, TILE - 8);
    ctx.fillStyle = def.color; ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 8);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 8);
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(def.icon, px + TILE / 2, py + TILE / 2 - 1);
    if (def.blink) { ctx.fillStyle = Math.floor(performance.now() / 300 + obj.uid) % 2 ? '#f43f5e' : '#facc15'; ctx.fillRect(px + TILE - 12, py + 5, 5, 5); }
  } else if (def.cat === 'machine') {
    const fl = (machineFlash.get(obj.uid) || 0) > performance.now();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(px + 5, py + 7, TILE - 8, TILE - 9);
    ctx.fillStyle = def.color; ctx.fillRect(px + 3, py + 2, TILE - 6, TILE - 7);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 2, TILE - 6, TILE - 7);
    ctx.fillStyle = fl ? '#fef08a' : '#0f172a'; ctx.fillRect(px + 7, py + 6, TILE - 14, 14);
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(def.icon, px + TILE / 2, py + 13);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(px + 10, py + 25, TILE - 20, 6);
    ctx.fillStyle = Math.floor(performance.now() / 400 + obj.uid) % 2 ? '#f43f5e' : '#facc15'; ctx.fillRect(px + TILE - 11, py + 24, 4, 4);
    if (fl) ctx.fillText('🪙', px + TILE / 2, py - 4);
  } else if (def.cat === 'decor' && def.type !== 'plant') {
    ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(def.icon, px + TILE / 2, py + TILE / 2);
  } else if (def.cat === 'decor') {
    ctx.fillStyle = '#b45309';
    ctx.fillRect(px + 12, py + 24, 16, 12);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.arc(px + 20, py + 17, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#14532d';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawChibi(x, y, bodyColor, hairColor, bounce, isStaff, isManager = false) {
  const by = Math.abs(Math.sin(bounce || 0)) * -3;

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(x, y + 9, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 体（エプロン・服）
  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = '#2d241e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - 8, y - 2 + by, 16, 12, 4);
  ctx.fill();
  ctx.stroke();

  if (isStaff) {
    // 店員の白いエプロン紐
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 4, y + 1 + by, 8, 7);
  }

  // 頭
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.arc(x, y - 7 + by, 8.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 髪 / 帽子
  ctx.fillStyle = isManager ? '#2596be' : hairColor;
  ctx.beginPath();
  ctx.arc(x, y - 9 + by, 8.5, Math.PI, Math.PI * 2);
  ctx.fill();
  if (isManager) {
    // 店長サンバイザーのツバ
    ctx.fillStyle = '#facc15';
    ctx.fillRect(x - 6, y - 10 + by, 12, 3);
  }

  // かわいい目
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x - 4, y - 7 + by, 2, 3);
  ctx.fillRect(x + 2, y - 7 + by, 2, 3);
}

function drawEmoteBubble(x, y, emote) {
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#3b2d22';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - 12, y - 13, 24, 20, 6);
  ctx.fill();
  ctx.stroke();
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emote, x, y - 3);
}

// =========================================================
// Canvas マウス操作（建築＆インスペクター）
// =========================================================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const [gx, gy] = evTile(e);
  hoverTile = { x: gx, y: gy };
});

canvas.addEventListener('mouseleave', () => { hoverTile = null; });

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (state.buildMode) cancelBuildMode();
  closeInspector();
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) return;
  initAudio();
  const [gx, gy] = evTile(e);
  if (!state.buildMode) {
    const r = canvas.getBoundingClientRect(), sr = signRect();
    const wx = (e.clientX - r.left) * (canvas.width / r.width) / cam.scale + cam.x, wy = (e.clientY - r.top) * (canvas.height / r.height) / cam.scale + cam.y;
    if (wy >= 2 && wy <= 30 && Math.abs(wx - sr.cx) <= sr.w / 2) { openSignEditor(); return; }
  }

  if (state.buildMode) {
    const check = canPlaceSafely(state.buildMode.type, gx, gy, state.buildMode.moveUid);
    if (!check.ok) {
      SFX.angry();
      setTicker(`⚠️ 設置不可: ${check.reason}`);
      return;
    }

    if (state.buildMode.moveUid) {
      // 移動完了
      const obj = placedObjects.find(o => o.uid === state.buildMode.moveUid);
      if (obj) {
        if (FACILITY_TYPES[obj.type].cat === 'neighbor') { const ddx = gx - obj.x, ddy = gy - obj.y; placedObjects.forEach(q => { if (hostedBy(obj, q)) { q.x += ddx; q.y += ddy; } }); }
        obj.x = gx;
        obj.y = gy;
        SFX.place();
        recalcCombos();
      }
      cancelBuildMode();
    } else {
      // 新規設置
      const def = FACILITY_TYPES[state.buildMode.type];
      if (state.money < def.cost) {
        SFX.angry();
        setTicker('⚠️ 資金が足りません！');
        return;
      }
      state.money -= def.cost;
      addPlacedObject(state.buildMode.type, gx, gy);
      SFX.place();
      recalcCombos();
      setTicker(`🏗️ ${def.name} を設置しました！`);
      updateHUD();
      // 連続配置できるように建築モード維持（資金不足なら解除）
      if (state.money < def.cost) cancelBuildMode();
    }
    return;
  }

  // 通常クリック：設備を選択してクイックメニュー表示
  const clicked = objAt(gx, gy);
  if (clicked) {
    SFX.click();
    openInspector(clicked);
  } else {
    closeInspector();
  }
});

function startBuildMode(type, moveUid = null) {
  closeInspector();
  const def = FACILITY_TYPES[type];
  if (!moveUid && state.money < def.cost) {
    SFX.angry();
    return setTicker(`⚠️ ${def.name} の建築費用(¥${def.cost.toLocaleString()})が足りません！`);
  }
  state.buildMode = { type, moveUid };
  { const bn = document.getElementById('build-banner'); clearTimeout(bnTimer); bn.classList.remove('closing'); bn.classList.add('show'); }
  document.getElementById('build-banner-msg').textContent = moveUid
    ? `🚚「${def.name}」の新しい場所をクリック！(右クリックで中止)`
    : `🏗️「${def.name}」(¥${def.cost}) を置く場所をクリック！(連続設置可 / 右クリック終了)`;
  SFX.click();
}

function cancelBuildMode() {
  state.buildMode = null;
  const bn = document.getElementById('build-banner');
  if (!bn.classList.contains('show') || bn.classList.contains('closing')) return;
  bn.classList.add('closing');
  clearTimeout(bnTimer);
  bnTimer = setTimeout(() => bn.classList.remove('show', 'closing'), 200);
}
let bnTimer = null;

function openInspector(obj) {
  state.selectedObjId = obj.uid;
  const def = FACILITY_TYPES[obj.type];
  const pop = document.getElementById('inspector-popup');

  let extra = '';
  if (def.cat === 'shelf') {
    const p = products[def.prod];
    extra = `
      <div style="font-size:12px; margin:4px 0;">
        陳列数: <b>${obj.stock}/${def.maxCap}</b> | 販売価格: <b>¥${getEffectivePrice(p)}</b>
      </div>
      <button class="kairo-btn btn-blue" style="width:100%; margin-bottom:5px;" onclick="switchDockById('price'); closeInspector();">
        💰 価格・特売を設定する
      </button>
    `;
  } else if (def.cat === 'register') {
    extra = `<div style="font-size:12px; margin:4px 0;">待機列: <b>${obj.queue.length}人</b></div>`;
  } else if (def.cat === 'neighbor') {
    const fx = placedObjects.filter(q => hostedBy(obj, q)), inc = fx.reduce((a, q) => a + fxIncome(q), 0);
    extra = `<div style="font-size:12px; margin:4px 0;">🛠 内装 ${fx.length}/${(NB_W - 2) * (NB_H - 2)}マス ／ 内装収入 毎週 +¥${inc}<br>🎨 床: ${FLOOR_NAMES[floorOf(obj)]}</div>
      <button class="kairo-btn btn-blue" style="width:100%; margin-bottom:5px;" onclick="cycleFloor(${obj.uid})">🎨 床の色を変える</button>
      <button class="kairo-btn btn-green" style="width:100%; margin-bottom:5px;" onclick="switchDockById('build'); closeInspector();">🛠 内装を置く（建築タブの下の方）</button>`;
  } else if (def.cat === 'machine') {
    extra = `<div style="font-size:12px; margin:4px 0;">1回の利用 <b>¥${def.fee}</b>（評判で増減）<br>🪙 この機械の累計収入 <b>¥${(obj.earned || 0).toLocaleString()}</b></div>`;
  } else if (def.cat === 'fixture') {
    extra =`<div style="font-size:12px; margin:4px 0;">内装収入 毎週 <b>+¥${fxIncome(obj)}</b>（評判で増減）</div>`;
  }

  const canDelete = def.cat !== 'backyard' && !(def.cat === 'register' && placedObjects.filter(o => o.type === 'register').length <= 1);

  pop.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <span style="font-weight:900; font-size:14px;">${def.icon} ${def.name}</span>
      <button class="kairo-btn btn-cream" style="padding:2px 6px;" onclick="closeInspector()">✖</button>
    </div>
    <div style="font-size:11px; color:var(--text-muted);">${def.desc}</div>
    ${obj.inCombo ? '<div style="font-size:11px; color:#b45309; font-weight:800; margin-top:2px;">✨ コーナーボーナス発動中！</div>' : ''}
    ${extra}
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button class="kairo-btn btn-orange" style="flex:1;" onclick="startBuildMode('${obj.type}', ${obj.uid})">🚚 移動</button>
      <button class="kairo-btn btn-red" style="flex:1;" onclick="removeObject(${obj.uid})" ${!canDelete ? 'disabled title="最後のレジは撤去できません"' : ''}>
        🗑 撤去(+¥${Math.floor(def.cost*0.5)})
      </button>
    </div>
  `;
  clearTimeout(inspTimer); pop.classList.remove('closing');
  pop.classList.add('show');
}

let inspTimer = null;
function closeInspector() {
  state.selectedObjId = null;
  const pop = document.getElementById('inspector-popup');
  if (!pop.classList.contains('show') || pop.classList.contains('closing')) return;
  pop.classList.add('closing');
  clearTimeout(inspTimer);
  inspTimer = setTimeout(() => pop.classList.remove('show', 'closing'), 170);
}

function removeObject(uid) {
  const idx = placedObjects.findIndex(o => o.uid === uid);
  if (idx === -1) return;
  const obj = placedObjects[idx];
  const def = FACILITY_TYPES[obj.type];
  if (def.cat === 'shelf' && obj.stock > 0) {
    products[def.prod].stock += obj.stock;
  }
  let refund = Math.floor(def.cost * 0.5);
  if (def.cat === 'neighbor') { const fx = placedObjects.filter(q => hostedBy(obj, q)); fx.forEach(q => { refund += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); }); placedObjects = placedObjects.filter(q => !fx.includes(q)); }
  state.money += refund;
  placedObjects.splice(placedObjects.indexOf(obj), 1);
  closeInspector();
  recalcCombos();
  SFX.click();
  setTicker(`🗑 ${def.name} を撤去しました (+¥${refund})`);
  updateHUD();
}

function switchDock(tabId, btnEl) {
  state.activeDock = tabId;
  document.querySelectorAll('.dock-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btnEl.classList.add('active');
  document.getElementById('pane-' + tabId).classList.add('active');
  SFX.click();
  refreshAllTabs();
}

function switchDockById(tabId) {
  const tabs = document.querySelectorAll('.dock-tab');
  const map = { build: 0, price: 1, staff: 2, manage: 3, back: 4 };
  switchDock(tabId, tabs[map[tabId]]);
}

function refreshAllTabs() {
  if (state.activeDock === 'build') renderBuildTab();
  else if (state.activeDock === 'price') renderPriceTab();
  else if (state.activeDock === 'staff') renderStaffTab();
  else if (state.activeDock === 'manage') renderManageTab();
  else if (state.activeDock === 'back') renderBackTab();
}

let buildF = { cat: 'all', q: '', ok: false };
function renderBuildTab() {

          <span id="pprof-${p.id}" style="color:${profit>=0?'#15803d':'#e5484d'}">粗利 ${profit>=0?'+':''}¥${profit}</span>
          <span id="pstock-${p.id}">在庫: ${p.stock}</span>
        </div>

        <div class="price-slider-row">

          <input type="range" min="${minP}" max="${maxP}" step="10" value="${p.price}"
            oninput="setPrice('${p.id}', Number(this.value))">
          <input type="number" id="pnum-${p.id}" min="10" step="10" value="${p.price}" style="width:72px;font-weight:800;" onchange="setPriceNum('${p.id}', this.value)">

  if (gone.length) { const fx = placedObjects.filter(q => FACILITY_TYPES[q.type].cat === 'fixture' && gone.some(g => hostedBy(g, q))); fx.forEach(q => { state.money += Math.floor(FACILITY_TYPES[q.type].cost * 0.5); }); placedObjects = placedObjects.filter(o => !gone.includes(o) && !fx.includes(o)); }
  clearWallColumn();
  recalcCombos(true);
  SFX.fanfare();

let lastT = performance.now();
let uiTimer = 0;

function gameLoop(now) {
  const rawDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!state.paused && !titleOpen) {
    // 高速時はサブステップに分割して、移動や判定が飛ばないようにする
    const total = rawDt * state.speed;
    const steps = Math.max(1, Math.ceil(total / 0.05));
    const dt = total / steps;
    for (let s = 0; s < steps; s++) {
      updateStaffAI(dt);
      updateCustomers(dt);
      updateVisitors(dt);
      updateRegisters(dt);
      updateRoleEffects(dt);
      updateCalendarAndEconomy(dt);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 22 * rawDt;
      floatingTexts[i].life -= rawDt;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }

    uiTimer += rawDt;
    if (uiTimer >= 0.35) {
      uiTimer = 0;
      updateHUD();
      // 価格タブはスライダー操作を阻害しないよう在庫数とラベルのみ更新、他タブも必要な時だけ更新
      if (state.activeDock === 'price') {
        Object.values(products).forEach(p => {
          const el = document.getElementById('pstock-' + p.id);
          if (el) el.textContent = `在庫: ${p.stock}`;
        });
      } else {
        const sg = tabSig();
        if (sg !== lastSig) { lastSig = sg; refreshAllTabs(); }
      }
    }
  }

  updateDoor(rawDt);
  coinAnim();
  view3D ? draw3D() : draw();
  requestAnimationFrame(gameLoop);
}

// =========================================================
// IndexedDB オートセーブ
// =========================================================
const DB_NAME = 'mycombini_dx', STORE = 'save', SAVE_KEY = 'main';
let dbp = null, ready = false, saving = false;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB非対応'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
function idbOp(mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const rq = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
function snapshot() {
  return JSON.parse(JSON.stringify({
    v: 2, savedAt: Date.now(), curStore,
    stores: (packStore(), stores.map(sx => ({ name: sx.name, sign: sx.sign, expansionLevel: sx.expansionLevel, nextObjUid: sx.nextObjUid, nextStaffId: sx.nextStaffId, candidateList: sx.candidateList, placedObjects: sx.placedObjects.map(o => ({ ...o, queue: [] })), hiredStaff: sx.hiredStaff.map(x => ({ ...x, path: [], carry: null, targetObjId: null })) }))),
    state: { ...state, discoveredCombos: [...state.discoveredCombos], buildMode: null, selectedObjId: null },
    placedObjects: placedObjects.map(o => ({ ...o, queue: [] })),
    nextObjUid,
    hiredStaff: hiredStaff.map(s => ({ ...s, path: [], carry: null, targetObjId: null })),
    candidateList, nextStaffId,
    products: Object.fromEntries(Object.values(products).map(p => [p.id, { price: p.price, quality: p.quality, stock: p.stock, onSale: p.onSale }])),
    equipLv, soundOn
  }));
}
async function saveGame(manual = false) {
  if (!ready || saving) return;
  saving = true;
  try {
    await idbOp('readwrite', s => s.put(snapshot(), SAVE_KEY));
    const b = document.getElementById('btn-save');
    if (b) { b.textContent = '✅'; setTimeout(() => { b.textContent = '💾'; }, 900); }
    if (manual) setTicker('💾 セーブしました！（8秒ごとにオートセーブされます）');
  } catch (e) {
    if (manual) setTicker('⚠️ セーブに失敗しました。ブラウザの保存設定を確認してください。');
  }
  saving = false;
}
async function loadGame() {
  try {
    let d = await idbOp('readonly', s => s.get(SAVE_KEY));
    d = normalizeSave(d);
    if (!d || d.v < 1) return false;
    Object.assign(state, d.state, { discoveredCombos: new Set(d.state.discoveredCombos || []), buildMode: null, selectedObjId: null, paused: false, activeDock: 'build' });
    placedObjects = d.placedObjects.filter(o => FACILITY_TYPES[o.type]).map(o => ({ ...o, queue: [] }));
    nextObjUid = d.nextObjUid;
    hiredStaff = d.hiredStaff.map(s => ({ ...s, x: (s.isManager ? 4.5 : 2.5) * TILE, y: (s.isManager ? 3.5 : 2.5) * TILE, path: [], carry: null, cooldown: 0, targetObjId: null }));
    if (d.candidateList && d.candidateList.length) candidateList = d.candidateList;
    nextStaffId = d.nextStaffId;
    if (d.stores && d.stores.length) {
      stores.length = 0;
      d.stores.forEach(sx => stores.push({ ...sx, customers: [], passers: [], dirts: [],
        placedObjects: sx.placedObjects.filter(o => FACILITY_TYPES[o.type]).map(o => ({ ...o, queue: [] })),
        hiredStaff: sx.hiredStaff.map(x => ({ ...x, x: (x.isManager ? 4.5 : 2.5) * TILE, y: (x.isManager ? 3.5 : 2.5) * TILE, path: [], carry: null, cooldown: 0, targetObjId: null })) }));
      curStore = Math.min(d.curStore || 0, stores.length - 1);
      applyStore(stores[curStore]);
    }
    Object.entries(d.products || {}).forEach(([id, v]) => { if (products[id]) Object.assign(products[id], v); });
    Object.assign(equipLv, d.equipLv || {});
    if (typeof d.soundOn === 'boolean') soundOn = d.soundOn;
    ensureBackyard();
    recalcCombos(true);
    return true;
  } catch (e) { return false; }
}
async function resetGame() {
  if (!confirm('セーブデータを消して最初から始めます。よろしいですか？')) return;

      return showTip(c.ok ? '✅ ここに置けます（クリックで設置）' : '⚠️ ' + c.reason, e.clientX, e.clientY);
    }
    const o = objAt(x, y);
    if (o) return showTip(objTip(o), e.clientX, e.clientY);
    if (inYard(x, y)) return showTip('🌳 屋外エリア\n棚・装飾・ブロック・お隣の店を置けます\n（レジとバックヤードは店内専用）', e.clientX, e.clientY);
    if ((x === 5 || x === 6) && y === 10) return showTip('🚪 自動ドア\nお客さんの出入口。手前のマスは空けておきます', e.clientX, e.clientY);
  }
  showTip(null);
});
window.addEventListener('blur', () => showTip(null));

// =========================================================
// 決算レポート（ワードパッド風・左下に表示するだけ）
// =========================================================
const yen = n => '¥' + Math.round(n).toLocaleString();
const sgn = n => (n >= 0 ? '+' : '-') + yen(Math.abs(n));
function wpRow(label, val, color) { return `<div class="wp-row"><span>${label}</span><span class="dot"></span><span style="color:${color || '#000'}">${val}</span></div>`; }
function showReport(e, promoted) {
  const w = document.getElementById('wp-win');
  document.getElementById('wp-title-text').textContent = `${e.m}月度決算レポート - ワードパッド`;
  document.getElementById('wp-page').innerHTML =
    `<div class="wp-h">＊ ${e.y}年目 ${e.m}月度 営業決算レポート ＊</div><div class="wp-hr"></div>` +
    wpRow(`商品売上 (${e.served}人会計)`, sgn(e.rev), '#15803d') +
    wpRow('ATM等その他収入', sgn(e.extra), '#0369a1') +
    wpRow('商品仕入コスト', sgn(-e.cost), '#b91c1c') +
    wpRow('スタッフ人件費', sgn(-e.wages), '#b91c1c') +
    `<div class="wp-row wp-total"><span>今月の純利益</span><span class="dot"></span><span style="color:${e.net >= 0 ? '#15803d' : '#b91c1c'}">${sgn(e.net)}</span></div>` +
    (promoted ? `<div class="wp-rankup">★ 店舗ランクアップ！<br>ランク ${promoted.rank}【${promoted.name}】になりました<br>雇用上限 ${promoted.maxStaff}人 ／ 新商品解放 ／ ✨+30P</div>` : '') +
    `<div class="wp-note">※ 過去の決算は 📜メニュー → 決算履歴 で見られます</div>`;
  document.getElementById('wp-status').textContent = `${e.y}年目 ${e.m}月 ／ 純利益 ${sgn(e.net)}`;
  clearTimeout(wpTimer); w.classList.remove('show', 'min', 'closing'); void w.offsetWidth; w.classList.add('show');
  document.body.classList.add('has-report');
}
let wpTimer = null;
function wpClose() {
  const w = document.getElementById('wp-win');
  if (!w.classList.contains('show') || w.classList.contains('closing')) return;
  document.body.classList.remove('has-report');
  w.classList.add('closing');
  clearTimeout(wpTimer);
  wpTimer = setTimeout(() => w.classList.remove('show', 'closing'), 360);
}
function wpMin() { document.getElementById('wp-win').classList.toggle('min'); }
function wpMax() { document.getElementById('wp-win').classList.toggle('max'); }

// =========================================================
// 巻物メニュー（履歴・商品の販売数・営業成績）
// =========================================================
let scrollTab = 'history', scrollIsOpen = false, scrollTimer = null;
function openScrollMenu() {
  if (scrollIsOpen) return closeScrollMenu();
  scrollIsOpen = true; SFX.click();
  const ov = document.getElementById('scroll-overlay');
  ov.classList.remove('show', 'opening', 'closing'); void ov.offsetWidth;
  renderScroll(true);
  ov.classList.add('show', 'opening');
  clearInterval(scrollTimer); scrollTimer = setInterval(() => renderScroll(false), 1000);
}
function closeScrollMenu() {
  if (!scrollIsOpen) return;
  scrollIsOpen = false; clearInterval(scrollTimer); SFX.click();
  const ov = document.getElementById('scroll-overlay');
  ov.classList.remove('opening'); ov.classList.add('closing');
  setTimeout(() => { if (!scrollIsOpen) ov.classList.remove('show', 'closing'); }, 800);
}
function setScrollTab(t) { scrollTab = t; SFX.click(); renderScroll(true); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && scrollIsOpen) closeScrollMenu(); });

function renderScroll(resetScroll) {
  document.querySelectorAll('#scroll-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === scrollTab));
  const body = document.getElementById('scroll-body');
  const top = resetScroll ? 0 : body.scrollTop;
  if (!resetScroll && scrollTab === 'settings') return;
  body.innerHTML = scrollTab === 'settings' ? scSettings() : scrollTab === 'history' ? scHistory() : scrollTab === 'sales' ? scSales() : scStats();
  body.scrollTop = top;
}
function scSettings() {
  const card = (id, icon, name, desc) => `<button class="theme-card ${settings.theme === id ? 'on' : ''}" onclick="setTheme('${id}')"><span class="tc-icon">${icon}</span><b>${name}</b><small>${desc}</small></button>`;
  const btn = (cls, label, js) => `<button class="kairo-btn ${cls}" style="padding:8px;width:100%;margin-top:6px" onclick="${js}">${label}</button>`;
  return `<div class="sc-card"><div class="sc-h">💾 セーブ</div><div style="font-size:12px;line-height:1.6">8秒ごとに自動保存されています。</div>` +
    btn('btn-blue', '💾 今すぐセーブ', "saveGame(true);this.textContent='✅ セーブしました'") +
    btn('btn-cream', '📂 セーブの書き出し／読み込み', 'closeScrollMenu();openImportModal()') +
    btn('btn-red', '🗑 データを消して最初から', 'closeScrollMenu();resetGame()') + `</div>` +
    `<div class="sc-card"><div class="sc-h">🎨 UIテーマ</div><div class="theme-row">${card('modern', '✨', 'モダン', 'すっきり丸みのあるデザイン')}${card('retro', '🕹️', 'レトロ', 'カイロ風の太枠・ドット調')}</div></div>` +
    `<div class="sc-card"><div class="sc-h">🪧 店の看板</div>` + btn('btn-gold', '🪧 看板を編集', 'closeScrollMenu();openSignEditor()') + `</div>` +
    `<div class="sc-card"><div class="sc-h">🔊 サウンド・その他</div>` + btn('btn-cream', soundOn ? '🔊 ON（クリックでOFF）' : '🔇 OFF（クリックでON）', 'toggleSound();renderScroll(true)') +
    (titleOpen ? '' : btn('btn-orange', '🏠 タイトルに戻る', 'closeScrollMenu();backToTitle()')) + `</div>`;
}
function scHistory() {
  const h = state.history || [], ms = state.monthStats;
  let html = `<div class="sc-card"><div class="sc-h">📅 今月ここまで（${state.year}年目 ${state.month}月 第${state.week}週）</div>` +
    `<div class="sc-kv"><span>🛒 商品売上</span><b>${yen(ms.rev)}（${ms.served}人会計）</b></div>` +
    `<div class="sc-kv"><span>📦 仕入コスト</span><b>${yen(ms.cost)}</b></div></div>`;
  if (!h.length) return html + `<div class="sc-empty">まだ決算の記録がありません。<br>月末（4週ごと）に自動で記録されます。</div>`;
  const last = h.slice(-12), mx = Math.max(1, ...last.map(x => Math.abs(x.net)));
  html += `<div class="sc-card"><div class="sc-h">📈 純利益のうつりかわり（直近${last.length}か月）</div><div class="sc-graph">` +
    last.map(x => `<div title="${x.y}年目${x.m}月 ${sgn(x.net)}"><i style="height:${Math.max(3, Math.abs(x.net) / mx * 62)}px;background:${x.net >= 0 ? '#2f9a47' : '#c2410c'}"></i><span>${x.m}月</span></div>`).join('') +
    `</div></div><div class="sc-card"><div class="sc-h">🗒 月ごとの決算</div>` +
    `<div class="sc-hrow hd"><span>年月</span><span>売上</span><span>その他</span><span>仕入</span><span>人件費</span><span>純利益</span></div>` +
    h.slice().reverse().map(x => `<div class="sc-hrow"><span>${x.y}年目 ${x.m}月${x.rank ? ' 🎉' : ''}</span><span>${yen(x.rev)}</span><span>${yen(x.extra)}</span><span>${yen(x.cost)}</span><span>${yen(x.wages)}</span><span style="color:${x.net >= 0 ? '#15803d' : '#b91c1c'};font-weight:900">${sgn(x.net)}</span></div>`).join('') +
    `</div>`;
  return html;
}
function scSales() {
  const sl = state.sales || {};
  const list = Object.values(products).filter(p => (sl[p.id] && sl[p.id].qty > 0) || p.unlockRank <= state.rankIdx)
    .map(p => ({ p, qty: (sl[p.id] || {}).qty || 0, rev: (sl[p.id] || {}).rev || 0 }))
    .sort((a, b) => b.qty - a.qty);
  const mx = Math.max(1, ...list.map(x => x.qty));
  const totQ = list.reduce((a, x) => a + x.qty, 0), totR = list.reduce((a, x) => a + x.rev, 0);
  const medal = ['🥇', '🥈', '🥉'];
  return `<div class="sc-card"><div class="sc-h">🛒 商品が買われた数（累計）</div>` +
    (totQ === 0 ? `<div class="sc-empty">まだ売れた商品がありません。</div>` : '') +
    list.map((x, i) => `<div class="sc-prod"><span style="font-size:26px;text-align:center">${x.p.icon}</span><div><div class="nm"><span>${x.qty > 0 && i < 3 ? medal[i] + ' ' : ''}${x.p.name}</span></div><div class="sc-bar"><i style="width:${x.qty / mx * 100}%"></i></div></div><div class="qty">${x.qty.toLocaleString()}個<br><small style="font-weight:700;color:#7c5a2a;font-size:11px">${yen(x.rev)}</small></div></div>`).join('') +
    `</div><div class="sc-card"><div class="sc-kv"><span>合計販売数</span><b>${totQ.toLocaleString()}個</b></div><div class="sc-kv"><span>合計売上</span><b>${yen(totR)}</b></div></div>`;
}
function scStats() {
  const r = RANKS[state.rankIdx], ms = state.monthStats;
  const months = (state.year - 1) * 12 + (state.month - 4);
  const kv = (k, v) => `<div class="sc-kv"><span>${k}</span><b>${v}</b></div>`;
  return `<div class="sc-card"><div class="sc-h">🏪 お店の成績</div>` +
    kv('🏆 店舗ランク', `${r.rank}【${r.name}】`) +
    kv('📅 いまの日付', `${state.year}年目 ${state.month}月 第${state.week}週（開店から${months}か月）`) +
    kv('💰 累計売上', yen(state.totalRevenue)) +
    kv('👥 来店客数（累計）', `${(state.totalCustomers || 0).toLocaleString()}人`) +
    kv('⭐ 現在の評判', state.rating.toFixed(1)) +
    kv('🏬 店舗数', `${stores.length}店`) +
    kv('🧑‍🍳 店員（この店）', `${hiredStaff.length}人`) +
    kv('✨ 発見したコーナー', `${state.discoveredCombos.size}個`) +
    kv('💴 所持金', yen(state.money)) + kv('🔆 経営ポイント', `${state.points}P`) + `</div>` +
    `<div class="sc-card"><div class="sc-h">📅 今月ここまで</div>` +
    kv('🛒 商品売上', `${yen(ms.rev)}（${ms.served}人会計）`) + kv('🏧 その他収入', yen(ms.extra)) + kv('📦 仕入コスト', yen(ms.cost)) + `</div>`;
}

// =========================================================

// ---- コイン機械（お客さんが使うと利用料が入る） ----
const machineFlash = new Map();
[ // type, name, icon, cost, fee, pts, rank, color
  ['machine_gacha', 'ガチャガチャ', '🎰', 1600, 300, 1, 1, '#fbcfe8'],
  ['machine_copy', 'コピー機', '🖨️', 1800, 120, 1, 1, '#e2e8f0'],
  ['machine_claw', 'クレーンゲーム機', '🧸', 2600, 220, 2, 2, '#a5f3fc'],
  ['machine_locker', '宅配ロッカー', '🗄️', 2400, 260, 1, 2, '#bfdbfe'],
  ['machine_photo', '証明写真機', '📸', 3200, 700, 2, 3, '#fde68a']
].forEach(([type, name, icon, cost, fee, pts, rank, color]) => {
  FACILITY_TYPES[type] = { type, cat: 'machine', name, icon, cost, fee, pts, rank, color, desc: `お客さんがコインを入れて使う機械。1回¥${fee}` };
});
COMBO_DEFS.push(
  { id: 'gacha_c', name: 'おやつガチャ通り', a: 'machine_gacha', b: 'shelf_snack', bonusProd: ['snack'], bonus: 0.18, desc: 'ガチャ×お菓子：魅力+18%' },
  { id: 'claw_c', name: 'ゲームコーナー', a: 'machine_claw', b: 'shelf_drink', bonusProd: ['drink', 'snack'], bonus: 0.15, desc: 'クレーン×ドリンク：魅力+15%' }
);
function useMachine(mc, c) {
  const d = FACILITY_TYPES[mc.type];
  const fee = Math.round(d.fee * (0.8 + state.rating / 10));
  state.money += fee; state.monthStats.extra += fee; state.points += d.pts || 1;
  mc.earned = (mc.earned || 0) + fee;
  machineFlash.set(mc.uid, performance.now() + 600);
  SFX.cash();
  addFloatText(c.x, c.y - 20, `${d.icon}+¥${fee}`, '#b45309');
  c.emote = ['🎉', '😊', '✨'][Math.floor(Math.random() * 3)]; c.emoteTimer = 1.2;
}

// ---- 右下のコインカウンター ----
let ccShown = null, ccLast = null;
function coinPop(diff) {
  const box = document.getElementById('cc-pops'); if (!box || !diff) return;
  while (box.children.length >= 6) box.removeChild(box.firstChild);
  const s = document.createElement('span');
  s.className = 'cc-pop ' + (diff > 0 ? 'pos' : 'neg');
  s.textContent = (diff > 0 ? '+' : '-') + '¥' + Math.abs(diff).toLocaleString();
  box.appendChild(s); setTimeout(() => s.remove(), 900);
}
function coinAnim() {
  const el = document.getElementById('cc-val'); if (!el) return;
  const m = state.money;
  if (ccShown === null) ccShown = m;
  const diff = m - ccShown;
  ccShown += Math.abs(diff) < 1 ? diff : diff * 0.18;
  const txt = '¥' + Math.round(ccShown).toLocaleString();
  if (el.textContent !== txt) el.textContent = txt;
  el.parentElement.classList.toggle('minus', m < 0);
}
function coinTrack() {
  if (ccLast !== null && state.money !== ccLast) coinPop(state.money - ccLast);
  ccLast = state.money;
}

const SETTINGS_KEY = 'mycombini_settings';
const settings = { theme: 'modern' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
function applyTheme() {
  document.body.classList.toggle('theme-retro', settings.theme === 'retro');
  document.body.classList.toggle('theme-modern', settings.theme !== 'retro');
  setTimeout(layoutUI, 0);
}
function setTheme(t) {
  settings.theme = t === 'retro' ? 'retro' : 'modern';
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  applyTheme(); SFX.place(); if (scrollIsOpen && scrollTab === 'settings') renderScroll(true); else openSettings();
}
function openSettings() {
  const card = (id, icon, name, desc) => `<button class="theme-card ${settings.theme === id ? 'on' : ''}" onclick="setTheme('${id}')"><span class="tc-icon">${icon}</span><b>${name}</b><small>${desc}</small></button>`;
  openModal('⚙ 設定', `
    <div class="set-h">🎨 UIテーマ</div>
    <div class="theme-row">${card('modern', '✨', 'モダン', 'すっきり丸みのあるデザイン')}${card('retro', '🕹️', 'レトロ', 'カイロ風の太枠・ドット調')}</div>
    <div class="set-h">🔊 サウンド</div>
    <button class="kairo-btn btn-cream" style="padding:8px" onclick="toggleSound(); openSettings()">${soundOn ? '🔊 ON（クリックでOFF）' : '🔇 OFF（クリックでON）'}</button>
    ${titleOpen ? '' : '<button class="kairo-btn btn-orange" style="padding:8px" onclick="closeModal(); backToTitle()">🏠 タイトルに戻る</button>'}
    <button class="kairo-btn btn-blue" style="padding:8px" onclick="closeModal()">✔ 閉じる</button>`);
}
let titleOpen = true, titleBusy = false;
function updateTitleInfo(loaded) {
  const el = document.getElementById('title-save');
  if (el) el.textContent = loaded ? `💾 セーブデータあり ／ ${state.year}年目 ${state.month}月 ／ 💰¥${state.money.toLocaleString()}` : '✨ 新しい経営がはじまります';
}
function startFromTitle() {
  if (!titleOpen || titleBusy) return;
  titleBusy = true; titleOpen = false; initAudio(); SFX.fanfare();
  const t = document.getElementById('title-screen');
  t.classList.remove('entering'); t.classList.add('leaving');
  setTimeout(() => { t.classList.remove('show', 'leaving'); titleBusy = false; }, 700);
}
function backToTitle() {
  if (titleOpen || titleBusy) return;
  saveGame(); cancelBuildMode(); closeInspector();
  titleOpen = true; updateTitleInfo(true); SFX.door();
  const t = document.getElementById('title-screen');
  t.classList.remove('leaving'); t.classList.add('show', 'entering');
}
document.addEventListener('keydown', e => {
  if (titleOpen && e.key === 'Enter' && e.target.tagName !== 'BUTTON' && !document.getElementById('modal-backdrop').classList.contains('show')) { e.preventDefault(); startFromTitle(); }
});
applyTheme();

// 初期化実行
initDefaultStore();
refreshCandidates(true);
loadGame().then(loaded => {
  ready = true;
  setTips();
  refreshStoreUI();
  updateHUD();
  refreshAllTabs();
  if (loaded) setTicker('💾 前回のセーブデータから再開しました！');
  updateTitleInfo(loaded);
  ccShown = null; ccLast = null;
  requestAnimationFrame(gameLoop);
});
</script>
