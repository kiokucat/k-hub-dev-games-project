    this._keyCapture = null;
    this.soundset = 'default'; // 音色フォルダ名(default=assets直下)
    try { this.soundset = localStorage.getItem('taiko_soundset') || 'default'; } catch (e) {}
    this.p2 = { score: 0, combo: 0, maxCombo: 0, perfect: 0, good: 0, miss: 0 }; // 2P状態(startGameでも再初期化)
    // 演奏オプション(0=P1, 1=P2)
    this.randMode = ['off', 'off'];   // off / kimagure(きまぐれ) / detarame(でたらめ)
    this.abe = [false, false];        // あべこべ
    this.noDist = [false, false];     // ドンカツ区別なし
    this.visBPM = 0;                  // 見た目BPM(0=オフ・100〜400) ※レーン表示はP1設定
    this.players = 1;
    // 演奏オプション縦リストパネル(難易度選択画面・下からスライドイン)
    this.optPanelOpen = false;
    this._optPanelEase = 0;
    // キャラクターのキー色(b1=胴体 / b2=顔)
    this.bodyColor = '#e53935';
    this.faceColor = '#fff3e0';
    this.composite = { char: [], gogo: [], clear: [] };
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.loop();
  }

  resize() {
    const container = this.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const availW = container.clientWidth * 0.99;
    const availH = container.clientHeight * 0.97;
    let cssW = availW;
    let cssH = cssW / (W / H);
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * (W / H);
    }
    this.canvas.style.width = Math.round(cssW) + 'px';
    this.canvas.style.height = Math.round(cssH) + 'px';
    this.canvas.width = Math.max(1, Math.round(cssW * dpr));
    this.canvas.height = Math.max(1, Math.round(cssH * dpr));
    this.scale = this.canvas.width / W;
  }

  async loadAssets(onProgress) {
    this.assetIdx = {};
    // manifest.jsonがあれば任意のファイル名/枚数に対応(無ければデフォルト名で試行)
    let manifest = null;
    try {
      const r = await fetch(ASSET_BASE + 'manifest.json');
      if (r.ok) manifest = await r.json();
    } catch (e) { /* file://等では不可 */ }
    const filesOf = (key, defaults) => {
      if (manifest && Array.isArray(manifest[key])) return manifest[key];
      return defaults;
    };
    const jobs = [];
    let done = 0;
    const total = Object.values(FRAME_SETS).reduce((s, a) => s + a.length, 0);
    for (let key of Object.keys(FRAME_SETS)) {
      const fileList = filesOf(key, FRAME_SETS[key]);
      this.assets[key] = fileList.map(name => {
        const img = new Image();
        img.src = ASSET_BASE + name;
        jobs.push(new Promise(res => {
          img.onload = img.onerror = () => { done++; onProgress(done / total); res(); };
        }));
        return img;
      });
      // 除外済みフレームリストに対応する元フレーム番号(b1/b2との整合用)
      this.assetIdx[key] = fileList.map(name => {
        const m = name.match(/_(\d+)\.png$/);
        return m ? parseInt(m[1], 10) : 0;
      });
    }
    // 15秒で打ち切り: アセットが無くてもゲームは開始できる
    await Promise.race([Promise.all(jobs), new Promise(res => setTimeout(res, 15000))]);
    this.manifest = manifest; // SEロードに引き継ぐ
    // 10コンボ演出用combo.png(単体アセット)
    this.comboImg = new Image();
    this.comboImg.src = ASSET_BASE + (manifest && manifest.combo ? manifest.combo : 'combo.png');
    // 難易度徽章(easy/normal/hard/oni/edit)
    this.courseBadges = {};
    const badgeMap = (manifest && manifest.badges) || { Easy:'easy.png', Normal:'normal.png', Hard:'hard.png', Oni:'oni.png', Edit:'edit.png' };
    for (const [course, file] of Object.entries(badgeMap)) {
      const im = new Image();
      im.src = ASSET_BASE + file;
      this.courseBadges[course] = im;
    }
    // ミニ太鼓(入力表示): 枠 + 左右×don/ka のハイライト
    this.tkImages = {};
    const tkMap = (manifest && manifest.tk) || { frame:'tk_frame.png', left_don:'tk_left_don.png', left_ka:'tk_left_ka.png', right_don:'tk_right_don.png', right_ka:'tk_right_ka.png' };
    for (const [n, file] of Object.entries(tkMap)) {
      const im = new Image();
      im.src = ASSET_BASE + file;
      this.tkImages[n] = im;
    }
    this.buildComposites();
  }

  // b1/b2廃止: 合成(キー色塗替)は不要。フレーム画像をそのまま使う
  buildComposites() {
    this.composite = {
      char: (this.assets.char || []).filter(img => img.complete && img.naturalWidth),
      gogo: (this.assets.gogo || []).filter(img => img.complete && img.naturalWidth),
      clear: (this.assets.clear || []).filter(img => img.complete && img.naturalWidth),
    };
  }

  // キャラクターアニメーションフレーム取得
  // char(通常): 常にノーマル(0枚目)。10コンボごとの演出はcombo.png(0.5秒)で行う
  // gogo(GOGO): 1>2>3>4>5>4>3>2 をループ
  charFrame(mode) {
    const bank = (this.composite[mode] && this.composite[mode].length) ? this.composite[mode]
               : (this.assets[mode] && this.assets[mode].length) ? this.assets[mode] : this.assets.char;
    if (!bank || !bank.length) return null;
    if (mode === 'gogo') {
      // フレーム番号(1〜5) → バンクindex(0〜4) に変換して 1>2>3>4>5>4>3>2 をループ
      const seq = [1, 2, 3, 4, 5, 4, 3, 2];
      const step = Math.floor(this.animTime * 8) % seq.length;
      return bank[Math.min(seq[step] - 1, bank.length - 1)];
    }
    return bank[0];
  }

  drawCharImg(ctx, cx, cy, w, h, mode, squash) {
    // 10コンボ到達時はcombo.pngを0.5秒表示する
    if (mode === 'char' && this.comboImg && this.comboImg.complete && this.comboImg.naturalWidth
        && this.comboFlashAt !== undefined && (this.animTime - this.comboFlashAt) < 0.5) {
      ctx.save();
      ctx.translate(cx, cy);
      if (squash > 0) {
        const s = 1 - 0.16 * Math.sin((squash / 0.25) * Math.PI);
        ctx.scale(1 + (1 - s) * 0.8, s);
      }
      const iw = this.comboImg.naturalWidth, ih = this.comboImg.naturalHeight;
      const sc = Math.min(w / iw, h / ih);
      ctx.drawImage(this.comboImg, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
      ctx.restore();
      return;
    }
    const img = this.charFrame(mode);
    ctx.save();
    ctx.translate(cx, cy);
    if (squash > 0) {
      const s = 1 - 0.16 * Math.sin((squash / 0.25) * Math.PI);
      ctx.scale(1 + (1 - s) * 0.8, s);
    }
    // canvas合成フレームでもHTMLImageElementでも正しく判定
    const drawable = img && ((img instanceof HTMLCanvasElement && img.width > 0)
                           || (img.complete && img.naturalWidth));
    if (drawable) {
      // アスペクト比を保ってw×hに収める(n.png等の任意サイズに対応)
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(w / iw, h / ih);
      ctx.drawImage(img, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
    } else {
      // フォールバック: 手書きドンちゃん
      ctx.fillStyle = '#e53935';
      ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, h * 0.05, w * 0.3, h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-w * 0.1, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.1, 0, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  loadCourse(course) {
    this.course = course;
    this.notes = [];
    this.rolls = [];
    this.balloons = [];
    this.measureLines = [];
    this.gogoRanges = [];
    this.autoProcessed.clear();

    // ===== タイムライン方式: 1文字ずつ時間を蓄積して全音符の到達時間を決定 =====
    // 【OFFSETの解釈】音符到達時間 = |OFFSET| (音楽開始からのイントロ秒数)
    //   OFFSET:-1.5 → 音楽開始1.5秒後に最初の音符(この譜面コーパスの解釈)
    //   OFFSET: 1.5 → 音楽開始1.5秒後に最初の音符(標準的なTJAの解釈)
    // どちらの符号でも「音楽先行のイントロ長」として扱う。負値クランプは
    // しない(先行譜面が潰れてズレるため)。極端に早い先行はLEAD_IN手前に寄せる。
    let time = Math.abs(parseFloat(course.headers.OFFSET) || 0); // 常に0以上・カウントイン内で自然にスクロールインするのでクランプ不要
    // 【zip配信曲のみ】フォルダ演奏と同じ土台(|OFFSET|)に、音声先頭の
    // 無音パディング分だけを足す。パディングは曲ごとに異なるため、JSONの
    // lead_in フィールドで個別指定する(未指定=0: 無音が曲の演出である曲は
    // 何も指定しないで正しく再生できる)。lead_in は playShopSong が
    // songs オブジェクトへコピーしておく。
    const selSong = this.songs[this.selectedSong];
    if (selSong && selSong.zipPath) {
      const lead = (typeof selSong.zipLeadIn === 'number') ? selSong.zipLeadIn : ZIP_AUDIO_LEAD_IN;
      time += lead;
    }
    // 音符タイミングは音楽位置と一致(カウントイン中の先行スクロールはgameClock()の負時刻で実現)
    const baseBPM = parseFloat(course.headers.BPM) || 120;
    let currentBPM = baseBPM;          // 命令で上書きされるたびに変化
    let currentScroll = 1;             // 同上(#SCROLL系)
    let currentMeasureFrac = [4, 4];   // 同上(#MEASURE、拍子 m/n)
    let gogoActive = false;
    let gogoStart = null;
    // #BMSCROLL / #HBSCROLL モード(公式TJA仕様準拠):
    //   BMSCROLL … #SCROLL を無視して等速でスクロールする
    //   HBSCROLL … BMSCROLL を #SCROLL 有効で動作させる
    //   いずれのモードでも #DELAY n は「n秒間だけ譜面のスクロールが停止」し、
    //   音符の出現・当たり判定の時刻には一切影響しない(表示上の停止のみ)。
    this.scrollStopMode = String(course.headers.BMSCROLL || '') === '1' || String(course.headers.HBSCROLL || '') === '1';
    this.scrollPauses = []; // {start,end} スクロール停止区間(表示時計を遅らせる)
    const bmIgnoreScroll = String(course.headers.BMSCROLL || '') === '1' && String(course.headers.HBSCROLL || '') !== '1';

    const rawNotes = [];

    for (let m = 0; m < course.measures.length; m++) {
      const measure = course.measures[m];

      // 小節開始時の状態(前小節の命令で更新済みの値が入っている)
      if (measure.bpm) currentBPM = measure.bpm;
      if (measure.scroll !== undefined) currentScroll = measure.scroll;
      if (measure.measure && measure.measure.length === 2) currentMeasureFrac = measure.measure;

      if (measure.barline !== false) {
        this.measureLines.push({ 
            time: time, 
            scroll: currentScroll, 
            bpm: currentBPM,
            measure: measure.measure
          });
      }

      // 小節の「音符イベント総数」= 等分割の分母(7〜8の間の0も含め全文字数)
      // コマンド(#BPMCHANGE等)を除いて音符のみカウント
      const totalChars = measure.events.filter(e => e.t !== 'cmd').length || 1;

      // イベントを先頭から1文字ずつ処理
      for (let ei = 0; ei < measure.events.length; ei++) {
        const ev = measure.events[ei];
        if (ev.t === 'cmd') {
          // 命令: その位置で状態を上書き(時間は進めない)
          const val = ev.val;
          if (ev.cmd === '#BPMCHANGE') {
            const b = parseFloat(val);
            if (b > 0) currentBPM = b;
          } else if (ev.cmd === '#SCROLL' || ev.cmd === '#BMSCROLL' || ev.cmd === '#HBSCROLL') {
            // BMSCROLL(非HB)モードでは #SCROLL を無視して等速(1)のままにする
            currentScroll = bmIgnoreScroll ? 1 : parseScrollVal(val);
          } else if (ev.cmd === '#MEASURE') {
            const mm = String(val).split('/').map(Number);
            if (mm.length === 2 && mm[0] > 0 && mm[1] > 0) currentMeasureFrac = mm;
          } else if (ev.cmd === '#DELAY') {
            const d = parseFloat(val) || 0;
            if (this.scrollStopMode) {
              // BM/HBモード: 音符時刻は進めず「n秒間スクロール停止」区間として記録(表示のみ)
              this.scrollPauses.push({ start: time, end: time + d });
            } else {
              time += d; // 通常モード: 後続の音符を n 秒遅らせる
            }
          } else if (ev.cmd === '#GOGOSTART') {
            if (!gogoActive) { gogoActive = true; gogoStart = time; }
          } else if (ev.cmd === '#GOGOEND') {
            if (gogoActive) {
              gogoActive = false;
              this.gogoRanges.push([gogoStart, time]);
              gogoStart = null;
            }
          }
          continue;
        }
        // 音符: 「その音符の到達時間 = 現在の時間」として記録する
        const type = parseInt(ev.v, 10);
        if (!isNaN(type)) {
          rawNotes.push({ type, time: time, scroll: currentScroll, bpm: currentBPM, mIdx: m });
        }
        // 1文字進めるごとに時間をプラスする:
        //   time += (60 / 現在のBPM / 小節の総文字数) * 4 * (拍子 m/n)
        // 小節途中でBPMが変わっても、これより前の文字の時間は一切変わらない
        time += (60 / currentBPM) * 4 * (currentMeasureFrac[0] / currentMeasureFrac[1]) / totalChars;
      }
    }
    if (gogoStart !== null) this.gogoRanges.push([gogoStart, time]);

    const used = new Array(rawNotes.length).fill(false);
    let balloonIdx = 0;

    // 【自動終了セーフティ(taikoweb・太鼓さん次郎互換)】
    // 8(正式終了)が出現する前に
    //   (a) 通常音符「1,2,3,4」が出現した → その音符が始まる「直前」の時刻で強制終了
    //   (b) 新しい連打・風船の開始「5,6,7,9」が出現した → その開始「直前」の時刻で強制終了
    // 「8」の書き忘れ・省略がある譜面でも、音符同士が重ならず正常にプレイできる。
    // ※終端となった 1-4 / 5,6,7,9 自体は「未使用」のまま残り、通常音符・次の
    //   連打・風船として後続処理で正しく扱われる。
    const AUTO_END_EPS = 0.001; // 1ms。「直前」を厳密に保証するための微小区間
    const findRollEnd = (fromIdx) => {
      for (let j = fromIdx + 1; j < rawNotes.length; j++) {
        const nt = rawNotes[j].type;
        if (nt === 8) {
          // 正式終了: 8自身の位置が終端(8は終端マーカーとして消費)
          return { endIdx: j, endTime: rawNotes[j].time, closed: true };
        }
        if (nt >= 1 && nt <= 4) {
          // (a) 通常音符の開始直前で強制終了(その音符は通常音符として残す)
          return { endIdx: j - 1, endTime: rawNotes[j].time - AUTO_END_EPS, closed: false };
        }
        if (nt === 5 || nt === 6 || nt === 7 || nt === 9) {
          // (b) 新しい連打・風船の開始直前で強制終了(その開始は次のオブジェクトとして残す)
          return { endIdx: j - 1, endTime: rawNotes[j].time - AUTO_END_EPS, closed: false };
        }
      }
      // 譜面末尾まで8なし
      return { endIdx: -1, endTime: -1, closed: false };
    };

    for (let i = 0; i < rawNotes.length; i++) {
      if (used[i]) continue;
      const t = rawNotes[i].type;

      if (t === 5 || t === 6 || t === 7 || t === 9) {
        // 7〜8の間の「0」も小節の等分割カウント(分母)に含まれているため、
        // rawNotes生成時(タイムライン積算)に time が正しく割り当て済みで狂わない。
        const startTime = rawNotes[i].time;
        const scroll = rawNotes[i].scroll;

        const end = findRollEnd(i);
        let endIdx, endTime;
        if (end.endIdx === -1) {
          // 8が譜面末尾まで存在しない場合: 開始から2拍後で安全に打ち切る
          const beatSec = 60 / (rawNotes[i].bpm || baseBPM);
          endTime = startTime + beatSec * 2;
          endIdx = i;
        } else {
          endIdx = end.endIdx;
          endTime = end.endTime; // 正式終了・自動終了のいずれもこの時刻で確定
        }

        used[i] = true;
        if (end.closed) used[endIdx] = true; // 正式の8のみ消費(自動終了では何も消費しない)

        if (t === 5 || t === 6) {
          // 連打: 正式終了・自動終了のいずれの場合も endTime が確定済み。
          // 通常音符の直前で切れるため、連打と通常音符が時間的に重ならない。
          this.rolls.push({
            type: t === 5 ? 'roll' : 'big_roll',
            startTime, endTime, scroll,
            resolved: [false, false],  // 各プレイヤーが終了(消滅)したか
            hits: [0, 0]              // 各プレイヤーの叩いた回数(別々にカウント)
          });
        } else {
          // 風船音符(7)・方言の風船開始(9):
          // 開始時間・終了時間・必要打数を持つ1オブジェクトで管理。
          // BALLOONヘッダから順に取得、取得できない場合はデフォルト5回。
          const required = (course.balloons && Number(course.balloons[balloonIdx])) || 5;
          this.balloons.push({
            type: 'balloon', scroll,
            time: startTime,       // 7(または9)のタイミング(開始)
            endTime: endTime,      // 8 or 自動終了のタイミング(終了)
            hitsRequired: required,
            resolved: [false, false],        // 各プレイヤーが終了(消滅)したか
            hits: [0, 0],                    // 各プレイヤーの叩いた回数(別々にカウント)
            hitFlag: [false, false],         // 各プレイヤーが叩き始めたか
            poppedAt: [undefined, undefined] // 各プレイヤーの破裂時刻
          });
          balloonIdx++;
        }
      }
    }

    for (let i = 0; i < rawNotes.length; i++) {
      if (used[i]) continue;
      const n = rawNotes[i];
      // 0は空白・8は連打/風船の終端マーカー・9は風船開始(上のループで処理済み)としてスキップ
      if (n.type === 0 || n.type === 8 || n.type === 9) continue;
      this.notes.push({ type: n.type, time: n.time, scroll: n.scroll, bpm: n.bpm || 120, mIdx: n.mIdx || 0, hp1: false, hp2: false, rt1: 0, rt2: 0 });
    }

    this.totalNotes = this.notes.length + this.rolls.length + this.balloons.length;
    // ランダムオプション: 有効なら赤青を入れ替えた見かけタイプを割当
    const rnd01 = (x) => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
    const swapT = (t) => t === 1 ? 2 : t === 2 ? 1 : t === 3 ? 4 : t === 4 ? 3 : t;
    for (const n of this.notes) {
      n.rt1 = n.type; n.rt2 = n.type;
      if (this.randMode[0] === 'kimagure' && rnd01(n.mIdx * 7.13) < 0.5) n.rt1 = swapT(n.type);
      if (this.randMode[0] === 'detarame' && rnd01(n.time * 997.7 + 1) < 0.5) n.rt1 = swapT(n.type);
      if (this.randMode[1] === 'kimagure' && rnd01(n.mIdx * 3.71) < 0.5) n.rt2 = swapT(n.type);
      if (this.randMode[1] === 'detarame' && rnd01(n.time * 571.3 + 5) < 0.5) n.rt2 = swapT(n.type);
    }

    // 終了時刻(空配列でも安全)
    const endTimes = [...this.notes.map(n => n.time), ...this.rolls.map(r => r.endTime), ...this.balloons.map(b => b.endTime)];
    this.songEndTime = endTimes.length ? Math.max(...endTimes) : 0;

    // スコア設計: フルコンボ・全良で約100万点(天井999,999)
    const tn = Math.max(1, this.totalNotes);
    this.pointPerfect = 650000 / tn;
    this.pointGood = this.pointPerfect / 2;
    this.comboK = 700000 / (tn * (tn + 1)); // コンボボーナス合計≈35万
  }

  async startGame() {
    const song = this.songs[this.selectedSong];
    if (!song) return;

    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.perfect = 0;
    this.good = 0;
    this.miss = 0;
    this.soul = 0;
    this.hitEffects = [];
    this.autoProcessed.clear();
    this._endTriggered = false;
    this.hitEffects = [];
    this.charHitT = 0;
    // 演出状態・パーティクルをリセット
    this.gameResult = 'playing';
    this.fxParticles = [];
    this.resultAt = undefined;
    this._fcSpawned = false;
    this.comboFlashAt = undefined;
    this.p2 = { score: 0, combo: 0, maxCombo: 0, perfect: 0, good: 0, miss: 0 };
    this.xpGained = 0;
    this.levelUpLv = 0;
    this.newTitles = [];
    this._autoAlt = false;
    this._autoRollLast = undefined;
    this._autoBalloonLast = undefined;
    this.zipLeadOverride = null; // 前の曲の無音検出値を引き継がない
    this.isPlaying = true;
    this.screen = 'playing';
    // 【のれん演出】start.ogg 再生 → 画面端からのれんが閉じる → (1秒+読み込み完了まで閉じたまま)
    // → 1秒かけてのれんが画面端へ開く → のれんが端に届いた瞬間に従来の開始(音楽はLEAD_IN秒後に正確に開始)
    this.norenPhase = 'closing';
    this.norenAt = this.animTime;
    this._norenLoaded = false;
    this.audio.playSE('start'); // start.ogg(無ければ無音)
    // 音源の読み込みはのれんが閉じている間に完了させる
    (async () => {
      if (song.isBuiltIn && song.audioBuffer) {
        this.audio.loadFromBuffer(song.audioBuffer);
        this._norenLoaded = true;
      } else if (song.audioFile) {
        try {
          await this.audio.loadFromFile(song.audioFile);
          this._norenLoaded = true;
        } catch(e) {
          console.error('Failed to load audio:', e);
          this.norenPhase = null;
          this.isPlaying = false;
          this.screen = 'songSelect';
          alert('音楽ファイルの読み込みに失敗しました。ファイル形式を確認してください。');
        }
      } else {
        this._norenLoaded = true;
      }
    })();
  }

  // 【のれん演出状態機械】
  // closing(0.4秒で閉じる) → closed(1秒+読み込み完了を保持) → opening(1秒で画面端へ) → 終了時にLEAD_IN開始
  _updateNoren() {
    if (!this.norenPhase) return;
    const t = this.animTime - this.norenAt;
    if (this.norenPhase === 'closing') {
      if (t >= 0.4) { this.norenPhase = 'closed'; this.norenAt = this.animTime; }
    } else if (this.norenPhase === 'closed') {
      if (t >= 1.0 && this._norenLoaded) {
        // 【診断】zip曲の実際の先頭無音を検出して表示のみ行う。
        // 譜面への自動適用はしない(フェードイン等で過大検出するケースがあるため)。
        // ズレが残る場合は表示された検出値を参考に ZIP_AUDIO_LEAD_IN を調整する。
        // zip曲の lead_in はJSONで個別指定。コンソールに診断を出すのみ。
        const sel = this.songs[this.selectedSong];
        if (sel && sel.zipPath) {
          console.log('[zip-lead] OFFSET=' + (this.course && this.course.headers.OFFSET) +
            ' lead_in=' + (sel.zipLeadIn != null ? sel.zipLeadIn : ZIP_AUDIO_LEAD_IN) +
            ' liveShift=' + this.liveShift);
        }
        // のれんが引き始めた瞬間が「開始」:
        // 譜面時間の基準(syncStart)も音声クロック基準。音楽の開始は
        // 「AudioContext時刻の正確なスケジュール」で予約し、クロックが -LEAD_IN から
        // 進み始め、0秒の瞬間に音楽が始まる(ずれなし)。
        this.norenPhase = 'opening'; this.norenAt = this.animTime;
        this.audio.syncStart();
        this.audio.playAt(this.audio.ctx.currentTime + LEAD_IN);
      }
    } else if (this.norenPhase === 'opening') {
      if (t >= 1.0) {
        this.norenPhase = null; // 音楽・譜面は引き始めた瞬間に既に開始済み
      }
    }
  }

  // ---- のれん(演奏開始演出・赤地に白い円紋の左右カーテン) ----
  drawNoren() {
    const ctx = this.ctx;
    const t = this.animTime - this.norenAt;
    let p; // 0=画面端(全開) 1=中央で閉じた状態
    if (this.norenPhase === 'closing') p = Math.min(1, t / 0.4);
    else if (this.norenPhase === 'closed') p = 1;
    else if (this.norenPhase === 'opening') p = 1 - Math.min(1, t / 1.0);
    else p = 0;
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easeInOutQuad
    const half = (W / 2) * e;
    if (half < 1) return;
    this._drawNorenHalf(ctx, half, true);
    this._drawNorenHalf(ctx, half, false);
  }

  _drawNorenHalf(ctx, half, isLeft) {
    const x0 = isLeft ? 0 : W - half;
    // 本体: 赤のグラデーション
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#c62828');
    g.addColorStop(0.6, '#8e1212');
    g.addColorStop(1, '#5c0a0a');
    ctx.fillStyle = g;
    ctx.fillRect(x0, 0, half, H);
    // 縦じわ(折り目の陰影)
    const foldW = 46;
    for (let fx = x0 + foldW * 0.5; fx < x0 + half; fx += foldW) {
      const fg = ctx.createLinearGradient(fx - 12, 0, fx + 12, 0);
      fg.addColorStop(0, 'rgba(0,0,0,0)');
      fg.addColorStop(0.5, 'rgba(0,0,0,0.22)');
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(fx - 12, 0, 24, H);
    }
    // 白い円紋(上下に3つ)
    const cx = isLeft ? x0 + half - 64 : x0 + 64;
    for (let k = 0; k < 3; k++) {
      const cy = H / 2 + (k - 1) * 175;
      ctx.fillStyle = '#fff8f0';
      ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = '#c62828';
      ctx.beginPath(); ctx.arc(cx, cy, 29, 0, Math.PI * 2); ctx.fill();
    }
    // 中央側の白い縁(帯)
    const bx = isLeft ? x0 + half - 18 : x0;
    ctx.fillStyle = '#fff8f0';
    ctx.fillRect(bx, 0, 18, H);
    ctx.fillStyle = '#c62828';
    ctx.fillRect(bx + 7, 0, 4, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, -2, 18, H + 4);
  }

  _saveAvOffset() {
    try { localStorage.setItem('taiko_avoffset', String(this.avOffsetMs)); } catch (e) {}
    this._avOsdAt = this.animTime;
  }

  _saveLiveShift() {
    try { localStorage.setItem('taiko_liveshift', String(this.liveShift)); } catch (e) {}
    this._avOsdAt = this.animTime;
  }

  _saveLiveShift() {
    try { localStorage.setItem('taiko_liveshift', String(this.liveShift)); } catch (e) {}
    this._avOsdAt = this.animTime;
  }

  stopGame() {
    this.isPlaying = false;
    if (this._startTimer) {
      clearTimeout(this._startTimer);
      this._startTimer = null;
    }
    this.audio.stop();
  }

  // 演奏クロック: カウントイン中は-LEAD_INから進行(音符が先行して流れる)。
  // 音楽開始直前で0になり、開始後はaudio.getTime()と連続する
  gameClock() {
    // 譜面進行・描画位置・当たり判定の全ての「現在時間」は
    // 「再生中の音声オブジェクトの currentTime * 1000」からのみ算出する(秒換算)。
    // LEAD_INのカウントイン期間は負の時刻として表現され、音声開始と0秒で連続する。
    if (this._endTriggered && this.frozenClock !== undefined) return this.frozenClock;
    // のれんが閉じている間(閉じる最中〜閉じたまま保持)は音声・音符ともに-4秒で固定
    if (this.norenPhase === 'closing' || this.norenPhase === 'closed') return -4;
    // avOffsetMs: 正の値で譜面が遅れて(音符が右に)ずれる = 聞こえる音声に追いつかせる
    // liveShift: 実行中の微調整値(秒)。正で音符が遅れる。
    return this.audio.getTimeMs() / 1000 - LEAD_IN - this.avOffsetMs / 1000 + this.liveShift;
  }

  isGogo(t) {
    for (let r of this.gogoRanges) {
      if (t >= r[0] && t < r[1]) return true;
    }
    return false;
  }

  // レーンの中心Y(2P時は上=1P・下=2Pの2レーン)
  laneCY(player) {
    if (this.players !== 2) return LANE_CY;
    // 2P: 1Pは上段レーン(中央200)、2Pは下側にクローンしたレーン(中央400)を配置
    return player === 1 ? 200 : 400;
  }

  // ノーツが両プレイヤー分終了したか
  noteDone(note) {
    return this.players === 2 ? (note.hp1 && note.hp2) : note.hp1;
  }

  // 現在のGOGO区間の開始時刻(区間内でなければnull)
  gogoStartAt(t) {
    for (let r of this.gogoRanges) {
      if (t >= r[0] && t < r[1]) return r[0];
    }
    return null;
  }

  // scrollStopMode(#BMSCROLL/#HBSCROLL)時の表示時刻変換。
  // #DELAY の「スクロール停止区間」の経過分だけ表示時計を遅らせることで、
  // 停止中は全音符が画面に留まり、停止後は滑らかにスクロールを再開する。
  // (音楽の進行・当たり判定の時刻には一切影響しない)
  _pauseBefore(t) {
    let p = 0;
    for (const w of this.scrollPauses) {
      if (t <= w.start) break;
      p += Math.min(t, w.end) - w.start;
    }
    return p;
  }
  _visTime(t) { return t - this._pauseBefore(t); }

  loop() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.lastFrame) / 1000);
    this.lastFrame = now;
    this.animTime = now / 1000;
    this.titleAnim += dt;
    this.ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
    if (this.charHitT > 0) this.charHitT = Math.max(0, this.charHitT - dt);
    // 演出パーティクルの更新(毎フレーム: 移動+重力+フェードアウト)
    this.updateFxParticles(dt);
    // 魂放物線パーティクルの更新
    this.updateSoulParticles(dt);

    if (this.screen === 'playing') {
      const musicTime = this.gameClock();
      this.update(musicTime);
      this.drawGame(musicTime);
      if (this._endTriggered) this.drawClear(); // 演奏画面の上にクリア演出
      if (this.norenPhase) this.drawNoren();    // 最前面にのれん(演奏開始演出)
    } else if (this.screen === 'title') {
      this.drawTitle();
    } else if (this.screen === 'songSelect') {
      this.drawSongSelect();
    } else if (this.screen === 'difficulty') {
      this.drawDifficulty();
    } else if (this.screen === 'keyconfig') {
      this.drawKeyconfig();
    } else if (this.screen === 'result') {
      this.drawResult();
    }
    // 検索ボックスは曲選択画面でのみ表示
    const sb = document.getElementById('searchBox');
    if (sb && sb.style.display !== (this.screen === 'songSelect' ? 'block' : 'none')) {
      sb.style.display = this.screen === 'songSelect' ? 'block' : 'none';
    }
    requestAnimationFrame(() => this.loop());
  }

  update(musicTime) {
    this._updateNoren(); // のれん演出の進行(開始直後は音楽をまだ流さない)
    if (this.autoPlay) this._processAuto(musicTime);
    this.gogoActive = this.isGogo(musicTime);

    const visOn = this.visBPM > 0; // 見た目BPM: ノーツのSCROLLを無視してBPM基準の等速に
    // BMSCROLL/HBSCROLLモード: 表示時計を「スクロール停止区間」分だけ遅らせる
    const stopM = this.scrollStopMode;
    const visNow = stopM ? this._visTime(musicTime) : musicTime;
    for (let note of this.notes) {
      if (!this.noteDone(note)) {
        const factor = visOn ? (note.bpm / this.visBPM) : note.scroll;
        const nt = stopM ? this._visTime(note.time) : note.time;
        note.x = this.judgeLineX + (nt - visNow) * this.noteSpeed * this.hs * factor;
      }
    }
    for (let roll of this.rolls) {
      if (!(roll.resolved[0] && (this.players !== 2 || roll.resolved[1]))) {
        const rs = stopM ? this._visTime(roll.startTime) : roll.startTime;
        const re = stopM ? this._visTime(roll.endTime) : roll.endTime;
        roll.startX = this.judgeLineX + (rs - visNow) * this.noteSpeed * this.hs * roll.scroll;
        roll.endX = this.judgeLineX + (re - visNow) * this.noteSpeed * this.hs * roll.scroll;
      }
    }
    for (let balloon of this.balloons) {
      if (!(balloon.resolved[0] && (this.players !== 2 || balloon.resolved[1]))) {
        // 描画位置は「音声の currentTime * 1000」由来の musicTime からのみ算出(毎フレーム再計算)。
        // 判定枠に到達したらそれ以上左へ行かず、8(終了)が流れてくるまで留まる。
        const bt2 = stopM ? this._visTime(balloon.time) : balloon.time;
        const rawX = this.judgeLineX + (bt2 - visNow) * this.noteSpeed * this.hs * balloon.scroll;
        balloon.x = Math.max(rawX, this.judgeLineX);
      }
    }

    for (let note of this.notes) {
      if (!this.noteDone(note) && note.type >= 1 && note.type <= 4 && musicTime > note.time + 0.15) {
        if (!note.hp1) {
          note.hp1 = true;
          this.combo = 0;
          this.miss++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(1), type: 'miss', time: musicTime, life: 1.3 });
        }
        if (this.players === 2 && !note.hp2) {
          note.hp2 = true;
          this.p2.combo = 0;
          this.p2.miss++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(2), type: 'miss', time: musicTime, life: 1.3 });
        }
      }
    }

    // 連打: 各プレイヤーごとに終了判定・カウントを別々に処理する
    for (let roll of this.rolls) {
      for (const pi of (this.players === 2 ? [0, 1] : [0])) {
        if (roll.resolved[pi] || musicTime <= roll.endTime + 0.2) continue;
        roll.resolved[pi] = true;
        const st = pi === 1 ? this.p2 : this;
        if (roll.hits[pi] === 0) {
          st.combo = 0;
          st.miss++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(pi + 1), type: 'miss', time: musicTime, life: 1.3 });
        } else {
          st.perfect++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(pi + 1), type: 'perfect', time: musicTime, life: 1.3 });
        }
      }
    }

    // 風船: 各プレイヤーごとに終了判定・破裂を別々に処理する
    for (let balloon of this.balloons) {
      for (const pi of (this.players === 2 ? [0, 1] : [0])) {
        if (balloon.resolved[pi] || musicTime <= balloon.endTime) continue;
        balloon.resolved[pi] = true;
        const st = pi === 1 ? this.p2 : this;
        if (balloon.hitFlag[pi] && balloon.hits[pi] >= balloon.hitsRequired) {
          balloon.poppedAt[pi] = musicTime;
          st.perfect++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(pi + 1), type: 'perfect', time: musicTime, life: 1.3 });
          this.audio.playSE('balloon');
        }
        // 打数不足・未入力: 静かに消える(ペナルティなし)
      }
    }

    // 魂ゲージ更新(ミスは-4で目に見えて減少)
    const denom = Math.max(1, this.totalNotes * 2);
    // 増加raw値は1.0を超えて成長させ(ミス分を後続ヒットで回復可能)、最後にのみクランプ
    this.soul = Math.min(1, Math.max(0, ((this.perfect * 2 + this.good) * 2.8) / denom - this.miss * 0.03));
    // P2魂ゲージ(2P時)
    this.soul2 = Math.min(1, Math.max(0, ((this.p2.perfect * 2 + this.p2.good) * 2.8) / denom - this.p2.miss * 0.03));

    this.hitEffects = this.hitEffects.filter(e => musicTime - e.time < e.life);

    const allNotesDone = this.notes.every(n => this.noteDone(n)) &&
                         this.rolls.every(r => r.resolved[0] && (this.players !== 2 || r.resolved[1])) &&
                         this.balloons.every(b => b.resolved[0] && (this.players !== 2 || b.resolved[1]));
    // 終了検出: 最後の音符(TJA終了)から2秒後にクリア演出を開始。
    // 演出2秒後→3秒かけてブラックアウト+音量フェード(演出計5.5秒でリザルトへ)。+8秒で強制
    if (!this._endTriggered && this.totalNotes > 0) {
      const endBase = this.songEndTime;
      if (musicTime > endBase + 2.0 && (allNotesDone || musicTime > endBase + 8)) {
        this._endTriggered = true;
        this.showClearScreen();
      }
    }
  }

  // 演奏終了演出: ノルマ/フルコンボ/ドンダフル/失敗を中央に表示し音声を鳴らす
  showClearScreen() {
    const isDFC = this.miss === 0 && this.good === 0 && this.perfect > 0;
    const isFC = this.miss === 0 && !isDFC && (this.perfect + this.good) > 0;
    const cleared = this.soul >= 0.8 || isFC;
    let kind;
    if (isDFC) kind = 'dfc';
    else if (isFC) kind = 'fc';
    else if (cleared) kind = 'clear';
    else kind = 'fail';
    this.clearKind = kind;
    this.clearShownAt = this.animTime;
    // 演出状態機械を更新(リザルト描画もこの状態で分岐)
    this.gameResult = (kind === 'dfc' || kind === 'fc') ? 'fullcombo' : (kind === 'clear' ? 'clear' : 'failed');
    this._fcSpawned = false;
    this.frozenClock = this.gameClock();
    // 【所持コイン】クリア結果・魂ゲージ・フルコンボで獲得枚数が変わる
    const clearOk = (kind !== 'fail');
    // メダルショップの価格帯(1400〜4100)に合わせた獲得量
    let coins = clearOk ? 400 : 100;                                       // ベース: クリア400 / 失敗100
    if (clearOk) coins += Math.round(Math.max(0, this.soul - 0.8) * 1500); // 魂ゲージボーナス(0〜300)
    if (kind === 'fc') coins += 1000;                                      // フルコンボボーナス
    else if (kind === 'dfc') coins += 2000;                                // ドンダフルコンボボーナス
    this.coinEarned = coins;
    coinMgr.add(coins);
    // 【プロフィール】XP付与・実績の累積・称号の新規解禁判定
    const gainedXp = coins + 50;                 // ベース50 + コイン相当
    profileMgr.plays++;
    if (clearOk) profileMgr.clears++;
    if (kind === 'fc') profileMgr.fc++;
    else if (kind === 'dfc') profileMgr.dfc++;
    if (this.maxCombo > profileMgr.maxCombo) profileMgr.maxCombo = this.maxCombo;
    const lvBefore = profileMgr.level();
    profileMgr.xp += gainedXp;
    this.xpGained = gainedXp;
    this.levelUpLv = profileMgr.level() > lvBefore ? profileMgr.level() : 0;
    this.newTitles = profileMgr.checkTitles();
    profileMgr.save();
    // ハイスコア記録(曲×難易度ごと・localStorage)
    try {
      const recs = JSON.parse(localStorage.getItem('taiko_records') || '{}');
      const sName = (this.songs[this.selectedSong] && this.songs[this.selectedSong].name) || '';
      const key = sName + '|' + (this.course && this.course.headers.COURSE || '');
      this.newRecord = this.score > (recs[key] || 0);
      if (this.newRecord) recs[key] = this.score;
      this.bestScore = Math.max(this.score, recs[key] || 0);
      localStorage.setItem('taiko_records', JSON.stringify(recs));
    } catch (e) {
      this.newRecord = false;
      this.bestScore = this.score;
    }
    this.isPlaying = false;
    // 音楽がまだ流れている場合: 2秒後から3秒かけて音量100%→0%フェード、その後停止
    this.audio.scheduleFadeOut(2.0, 3.0);
    // 結果音声(norma/fullcombo/dondafull/failed.ogg) — resultGain経由(フェードの影響なし)
    const v = this.audio.resultVoices || {};
    const buf = kind === 'dfc' ? v.dfc : kind === 'fc' ? v.fc : kind === 'clear' ? v.clear : v.fail;
    if (buf && this.audio.ctx) {
      const src = this.audio.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.audio.resultGain || this.audio.masterGain);
      src.start();
    }
  }

  // ==================== 魂放物線パーティクル ====================
  // 「良」「可」で叩いた瞬間、判定枠から魂ゲージの現在位置へ放物線で魂が飛ぶ。
  // vy += 0.4 の重力加速度で弧を描き、ゲージ端に到達した瞬間消滅して火花が弾ける。
  spawnSoulParticle(player = 1) {
    const sx = this.judgeLineX, sy = this.laneCY(player);
    // 到達目標: 1Pは上段ゲージ(左→右へ溜まる) / 2Pは下段ゲージ(右→左へ溜まる)
    const soulV = Math.max(0, Math.min(1, player === 2 ? (this.soul2 || 0) : this.soul));
    const gx = player === 2 ? (1200 - 420 * soulV) : (800 + 420 * soulV);
    const gy = player === 2 ? 594 : 119;
    this.soulParticles.push({ x: sx, y: sy, gx, gy, t: 0,
      vx: (gx - sx) / 45,                     // 45フレームで到達する水平初速
      vy: -9 - Math.random() * 3,             // 上向き初速(放物線の頂点を作る)
      r: 5 + Math.random() * 3 });
  }

  updateSoulParticles(dt) {
    const step = dt * 60; // 60fps基準のフレーム換算
    for (const p of this.soulParticles) {
      p.t += step;
      p.vy += 0.4 * step;   // 重力加速度
      p.x += p.vx * step;
      p.y += p.vy * step;
      // ゲージ端(目標X)に到達した瞬間: 消滅して火花がプチプチ弾ける
      if ((p.vx > 0 ? p.x >= p.gx : p.x <= p.gx) || p.t > 90) {
        p.dead = true;
        for (let i = 0; i < 4; i++) {
          const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2;
          this.soulSparks.push({ x: p.gx, y: p.gy || 119, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.3 + Math.random() * 0.2, maxLife: 0.5, r: 1.5 + Math.random() * 1.5 });
        }
      }
    }
    this.soulParticles = this.soulParticles.filter(p => !p.dead);
    for (const s of this.soulSparks) {
      s.x += s.vx * step; s.y += s.vy * step; s.life -= dt;
    }
    this.soulSparks = this.soulSparks.filter(s => s.life > 0);
  }

  drawSoulParticles(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.soulParticles) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
      g.addColorStop(0, '#fff8d0');
      g.addColorStop(0.4, '#ffd54f');
      g.addColorStop(1, 'rgba(255,140,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2); ctx.fill();
    }
    for (const s of this.soulSparks) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
      ctx.fillStyle = '#ffecb3';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ==================== 演出パーティクル管理 ====================
  // 火花・紙吹雪・クラッカーは全てこの配列で管理。毎フレーム updateFxParticles で
  // 位置を進め、life を減らしながらフェードアウトして消去する。
  spawnFxParticle(x, y, vx, vy, life, color, size, gravity = 0) {
    this.fxParticles.push({ x, y, vx, vy, life, maxLife: life, color, size, gravity });
  }

  updateFxParticles(dt) {
    for (const p of this.fxParticles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.life -= dt;
    }
    this.fxParticles = this.fxParticles.filter(p => p.life > 0);
  }

  drawFxParticles(ctx) {
    for (const p of this.fxParticles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ==================== 終了演出(状態機械: fullcombo / clear / failed) ====================
  drawClear() {
    const ctx = this.ctx;
    const t = this.animTime - this.clearShownAt;
    const fade = t > 2.8 ? Math.max(0, 1 - (t - 2.8) / 0.4) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    if (this.gameResult === 'fullcombo') this.drawFxFullCombo(ctx, t);
    else if (this.gameResult === 'clear') this.drawFxClearSuccess(ctx, t);
    else this.drawFxFailed(ctx, t);
    ctx.restore();
    // 演出から2秒後→3秒かけてブラックアウト(音楽音量も同時にフェード中)
    if (t > 2.0) {
      const bo = Math.min(1, (t - 2.0) / 3.0);
      ctx.fillStyle = `rgba(0,0,0,${bo})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (t > 5.5) {
      this.screen = 'result'; // 成績発表へ
      this.resultAt = this.animTime;
    }
  }

  // ---- フルコンボ演出 ----
  // 1) スケール0→「グワッ」と2倍(イージング)→2) シュッと1倍に縮小→固定
  // 3) 出現ピークで紙吹雪・火花パーティクル26個が円状に飛散
  // 4) その後サイン波でフワフワ上下に浮遊し続ける
  drawFxFullCombo(ctx, t) {
    const label = this.clearKind === 'dfc' ? 'ドンダフルコンボ!!' : 'フルコンボ！';
    // 1)・2) スケール制御: 0→2倍を0.4秒で(easeOutCubic)、その後0.2秒で2→1倍に縮小
    let s;
    if (t < 0.4) s = 2 * (1 - Math.pow(1 - t / 0.4, 3));
    else if (t < 0.6) s = 2 - (t - 0.4) / 0.2;
    else s = 1;
    // 3) 拡大ピーク(t=0.4)に1度だけ紙吹雪・火花をspawn
    if (!this._fcSpawned && t >= 0.4) {
      this._fcSpawned = true;
      const colors = ['#ffd54f', '#ff8f00', '#ff4081', '#40c4ff', '#69f0ae', '#e040fb', '#ffffff'];
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2 + Math.random() * 0.3; // 円状に(ランダムずらし)
        const sp = 150 + Math.random() * 260;
        this.spawnFxParticle(W / 2, H / 2 - 40, Math.cos(a) * sp, Math.sin(a) * sp - 80,
          1.1 + Math.random() * 0.6, colors[i % colors.length], 3 + Math.random() * 4, 300);
      }
    }
    // パーティクルは文字の「後ろ側」から飛散する(先に描画)
    this.drawFxParticles(ctx);
    // 4) フワフワ浮遊(サイン波ループ)
    const floatY = t > 0.6 ? Math.sin((t - 0.6) * 2.2) * 10 : 0;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40 + floatY);
    ctx.scale(s, s);
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px Yu Gothic, Meiryo, sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(label, 0, 0);
    let fill;
    if (this.clearKind === 'dfc') {
      // ドンダフル: ニジイロ(虹色グラデーションが流れる)
      const hue = (this.animTime * 60) % 360;
      fill = ctx.createLinearGradient(-330, 0, 330, 0);
      for (let i = 0; i <= 6; i++) fill.addColorStop(i / 6, `hsl(${(hue + i * 60) % 360}, 92%, 55%)`);
    } else {
      fill = ctx.createLinearGradient(0, -46, 0, 16);
      fill.addColorStop(0, '#ffd700');
      fill.addColorStop(1, '#ff8f00');
    }
    ctx.fillStyle = fill;
    this.outlineText(ctx, label, 0, 0);
    ctx.restore();
  }

  // ---- クリア成功演出 ----
  // 1) 「ク」「リ」「ア」「成」「功」「！」が右から1文字ずつ0.1秒おきに弾んで滑り込む
  // 2) 全文字が揃った瞬間に金色にピカッ(白フラッシュ+金色グラデーション)
  // 3) 画面下半分からクラッカーのようなカラフルな丸パーティクルが湧き上がる
  drawFxClearSuccess(ctx, t) {
    const chars = ['ク', 'リ', 'ア', '成', '功', '！'];
    const cw = 68;
    const cx = W / 2, cy = H / 2 - 40;
    const startX = W + 140;
    const slideDur = 0.32;
    const allInAt = (chars.length - 1) * 0.1 + slideDur; // 全文字到達: 0.82秒
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px Yu Gothic, Meiryo, sans-serif';
    ctx.lineJoin = 'round';
    let allIn = true;
    for (let i = 0; i < chars.length; i++) {
      const ct = t - i * 0.1; // 0.1秒おきの時間差
      if (ct <= 0) { allIn = false; continue; }
      const p = Math.min(1, ct / slideDur);
      const e = 1 - Math.pow(1 - p, 3);          // easeOutCubicで滑り込み
      const bounce = Math.sin(p * Math.PI) * 26; // 弾む弧を描く
      const targetX = cx - (chars.length - 1) * cw / 2 + i * cw;
      const x = startX + (targetX - startX) * e;
      ctx.save();
      ctx.translate(x, cy - bounce);
      const sc = 0.6 + 0.4 * e;
      ctx.scale(sc, sc);
      ctx.lineWidth = 13;
      ctx.strokeStyle = '#fff';
      ctx.strokeText(chars[i], 0, 0);
      ctx.fillStyle = '#e53935';
      this.outlineText(ctx, chars[i], 0, 0);
      ctx.restore();
      if (p < 1) allIn = false;
    }
    // 2) 金色フラッシュ: 全文字到達後0.45秒だけ白→金色に光る
    const ft = t - allInAt;
    if (allIn && ft > 0 && ft < 0.45) {
      const a = 1 - ft / 0.45;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = '#fff7cc';
      this.outlineText(ctx, 'クリア成功！', cx, cy);
      ctx.globalAlpha = a;
      const gg = ctx.createLinearGradient(cx - 280, 0, cx + 280, 0);
      gg.addColorStop(0, '#ffd700');
      gg.addColorStop(0.5, '#fff8d0');
      gg.addColorStop(1, '#ffd700');
      ctx.fillStyle = gg;
      this.outlineText(ctx, 'クリア成功！', cx, cy);
      ctx.restore();
    }
    ctx.restore();
    // 3) クラッカー粒子: 下半分から上へゆるやかに弧を描いて湧き上がる
    if (t > allInAt && t < 2.9 && this.fxParticles.length < 90) {
      const colors = ['#ffd54f', '#ff4081', '#40c4ff', '#69f0ae', '#ff9100', '#e040fb'];
      for (let k = 0; k < 2; k++) {
        if (Math.random() < 0.6) {
          this.spawnFxParticle(W * 0.15 + Math.random() * W * 0.7, H * 0.55 + Math.random() * H * 0.45,
            (Math.random() - 0.5) * 70, -(170 + Math.random() * 190),
            1.2 + Math.random() * 0.7, colors[(Math.random() * colors.length) | 0], 3 + Math.random() * 4, 90);
        }
      }
    }
    this.drawFxParticles(ctx);
  }

  // ---- クリア失敗演出(簡易ポップアップ) ----
  drawFxFailed(ctx, t) {
    const ease = Math.min(1, t / 0.4);
    const s = 0.6 + 0.4 * (1 - Math.pow(1 - ease, 3));
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40);
    ctx.scale(s, s);
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px Yu Gothic, Meiryo, sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#fff';
    ctx.strokeText('クリア失敗…', 0, 0);
    ctx.fillStyle = '#2196f3'; // 青
    this.outlineText(ctx, 'クリア失敗…', 0, 0);
    ctx.restore();
  }

  _processAuto(musicTime) {
    for (let note of this.notes) {
      if (note.hit) continue;
      const key = 'n' + note.time;
      if (this.autoProcessed.has(key)) continue;
      if (musicTime >= note.time - 0.02) {
        this.autoProcessed.add(key);
        this._autoAlt = !this._autoAlt;
        // 交互打ち: 左右手を交互に。音符のドン/カツは正しい色で区別して叩く
        const et = note.rt1 || note.type;
        this.input(et === 1 || et === 3, this._autoAlt ? 'right' : 'left', 1);
      }
    }
    // 連打: 秒速15・交互打ち
    for (let roll of this.rolls) {
      if (roll.resolved[0]) continue;
      if (musicTime >= roll.startTime - 0.02 && musicTime <= roll.endTime) {
        if (this._autoRollLast === undefined || musicTime - this._autoRollLast >= 1 / 15) {
          this._autoRollLast = musicTime;
          this._autoAlt = !this._autoAlt;
          this._autoNoType = true;
          this.input(this._autoAlt, this._autoAlt ? 'right' : 'left', 1);
          this._autoNoType = false;
        }
      }
    }
    // 風船: 秒速30・交互打ち
    for (let balloon of this.balloons) {
      if (balloon.resolved[0]) continue;
      if (musicTime >= balloon.time - 0.02 && musicTime <= balloon.endTime) {
        if (this._autoBalloonLast === undefined || musicTime - this._autoBalloonLast >= 1 / 30) {
          this._autoBalloonLast = musicTime;
          this._autoAlt = !this._autoAlt;
          this._autoNoType = true;
          this.input(this._autoAlt, this._autoAlt ? 'right' : 'left', 1);
          this._autoNoType = false;
        }
      }
    }
  }

  // ==================== 描画: ゲーム画面 ====================
  drawGame(musicTime) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    this.drawHeader(ctx);
    // 花火はGOGO開始から2秒間のみ
    const gs = this.gogoStartAt(musicTime);
    // 2P時はノーツ・レーンをクローンして下側に置くため、縁日シーンを先に描きレーンを重ねる
    if (this.players === 2) {
      this.drawFestival(ctx, this.animTime, this.gogoActive, (gs !== null && musicTime - gs < 2.0) ? (musicTime - gs) : null);
      // 2P: 下半分の裏背景を青色テーマにする
      ctx.fillStyle = 'rgba(13, 60, 97, 0.30)';
      ctx.fillRect(0, SCENE_Y, W, H - SCENE_Y);
      this.drawLane(ctx, musicTime);
    } else {
      this.drawLane(ctx, musicTime);
      this.drawFestival(ctx, this.animTime, this.gogoActive, (gs !== null && musicTime - gs < 2.0) ? (musicTime - gs) : null);
    }
    this.drawSoulParticles(ctx);   // 魂の放物線パーティクル
    if (this.players === 2) this.drawP2Overlay(ctx);
    // 【zip曲デバッグHUD】演奏中ずっと表示: TJAのOFFSET / 音声先頭無音の実測値 /
    // 現在の補正値。Shift+[ / Shift+] で±0.05sずつ調整、Backspaceで0に戻す。
    {
      const sel = this.songs[this.selectedSong];
      if (sel && sel.zipPath) {
        const rawOff = (this.course && this.course.headers.OFFSET) || '0';
        const curLead = (typeof sel.zipLeadIn === 'number') ? sel.zipLeadIn : ZIP_AUDIO_LEAD_IN;
        const info = 'TJA OFFSET:' + rawOff +
          '  |  lead_in:' + curLead.toFixed(2) + 's' +
          '  |  shift' + (this.liveShift > 0 ? '+' : '') + this.liveShift.toFixed(2) + 's (Shift+[ ])';
        ctx.textAlign = 'right';
        ctx.font = 'bold 15px monospace';
        const tw2 = ctx.measureText(info).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(W - 14 - tw2 - 10, LANE_Y - 30, tw2 + 14, 22);
        ctx.lineWidth = 4; ctx.strokeStyle = '#000';
        ctx.strokeText(info, W - 18, LANE_Y - 14);
        ctx.fillStyle = '#ffe082';
        this.outlineText(ctx, info, W - 18, LANE_Y - 14);
      }
    }
    // zip曲の音声リードイン診断OSD(開始後3秒間)
    if (this._leadOsdAt !== undefined && this.animTime - this._leadOsdAt < 3) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 17px sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = '#000';
      ctx.strokeText(this._leadOsdText, PANEL_W + 14, LANE_Y + LANE_H + 50);
      ctx.fillStyle = '#b3e5fc';
      this.outlineText(ctx, this._leadOsdText, PANEL_W + 14, LANE_Y + LANE_H + 50);
    }
    // AV微調整のOSD('[ ]'で変更した1.2秒間だけ表示)
    if (this._avOsdAt !== undefined && this.animTime - this._avOsdAt < 1.2) {
      const label = 'AV\u88DC\u6B63: ' + (this.avOffsetMs > 0 ? '+' : '') + this.avOffsetMs + 'ms ([ ] \u3067\u8ABF\u6574)';
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = '#000';
      ctx.strokeText(label, PANEL_W + 14, LANE_Y + LANE_H + 26);
      ctx.fillStyle = '#ffe082';
      this.outlineText(ctx, label, PANEL_W + 14, LANE_Y + LANE_H + 26);
    }
  }

  // ---- 上部ヘッダー ----
  drawHeader(ctx) {
    const song = this.songs[this.selectedSong];
    const course = song ? song.courses[this.selectedDiff] : null;

    const grad = ctx.createLinearGradient(0, 0, 0, HEADER_H);
    grad.addColorStop(0, '#8e1212');
    grad.addColorStop(1, '#570a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, HEADER_H);

    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#ffd54f';
    ctx.fillStyle = '#ffd54f';
    for (let px = 60; px < W; px += 150) {
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, HEADER_H + 46, 92, Math.PI, Math.PI * 2);
      ctx.stroke();
      for (let a = 0; a <= 6; a++) {
        const ang = Math.PI + a * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(px, HEADER_H + 46);
        ctx.lineTo(px + Math.cos(ang) * 92, HEADER_H + 46 + Math.sin(ang) * 92);
        ctx.stroke();
      }
    }
    for (let i = 0; i < 26; i++) {
      const fx = (i * 173 + 40) % W;
      const fy = (i * 67 + 15) % HEADER_H;
      ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, HEADER_H - 5, W, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(0, HEADER_H - 9, W, 2);

    // ---- キャラクター(左上) ----
    const avX = 96, avY = 64;
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.arc(avX, avY, 50, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3e0d04'; ctx.lineWidth = 4; ctx.stroke();
    // 10コンボ到達時は combo.png を0.5秒表示
    let img = this.charFrame(this.gogoActive ? 'gogo' : 'char');
    if (!this.gogoActive && this.comboImg && this.comboImg.complete && this.comboImg.naturalWidth
        && this.comboFlashAt !== undefined && (this.animTime - this.comboFlashAt) < 0.5) {
      img = this.comboImg; // GOGO中はgogoアニメを優先
    }
    if (img && img.width) {
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(190 / iw, 96 / ih);
      ctx.drawImage(img, avX + 6 - iw * sc / 2, avY + 4 - ih * sc / 2, iw * sc, ih * sc);
    }

    // ---- 1P ネームプレート ----
    ctx.fillStyle = '#ff6d00';
    this.roundRect(ctx, 232, 16, 74, 42, 10); ctx.fill();
    ctx.strokeStyle = '#7f2600'; ctx.lineWidth = 3;
    this.roundRect(ctx, 232, 16, 74, 42, 10); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 27px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, '1P', 269, 47);

    ctx.fillStyle = '#fffdf5';
    this.roundRect(ctx, 310, 16, 250, 42, 10); ctx.fill();
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 3;
    this.roundRect(ctx, 310, 16, 250, 42, 10); ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 25px sans-serif';
    ctx.textAlign = 'left';
    this.outlineText(ctx, this.playerName, 328, 46);
    ctx.fillStyle = '#b71c1c';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    this.outlineText(ctx, 'Lv.' + profileMgr.level(), 548, 44);

    // ---- 曲名・ジャンル(右上) ----
    if (song) {
      // TITLEJA(和訳タイトル)がある場合はそちらを優先表示
      const title = (course && (course.headers.TITLEJA || course.headers.TITLE)) || song.name;
      ctx.textAlign = 'right';
      ctx.font = 'bold 40px Yu Gothic, Meiryo, sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#000';
      ctx.strokeText(title, W - 28, 56);
      ctx.fillStyle = '#fff';
      this.outlineText(ctx, title, W - 28, 56);

      const g0 = (course && course.headers.GENRE) || '';
      const g1 = (!g0 && song.genre && song.genre !== 'その他') ? song.genre : g0;
      const genre = (!g1 && song.category) ? song.category : g1;
      if (genre) { // カテゴリ/ジャンル不明のときは非表示
        ctx.font = 'bold 17px sans-serif';
        const gw = ctx.measureText(genre).width + 28;
        const gGrad = ctx.createLinearGradient(0, 74, 0, 104);
        gGrad.addColorStop(0, '#ffe082');
        gGrad.addColorStop(1, '#d4a017');
        ctx.fillStyle = gGrad;
        this.roundRect(ctx, W - 28 - gw, 74, gw, 30, 6); ctx.fill();
        ctx.strokeStyle = '#7a5b00'; ctx.lineWidth = 2;
        this.roundRect(ctx, W - 28 - gw, 74, gw, 30, 6); ctx.stroke();
        ctx.fillStyle = '#4e2c00';
        ctx.textAlign = 'center';
        this.outlineText(ctx, genre, W - 28 - gw / 2, 95);
      }
    }

    // ---- 魂ゲージ(クリア圏=右端20%だけ30px盛り上がる・背景=暗い黄色・本体=黄色) ----
    const gx = 800, gw2 = 420, gy = 110, gh = 18;
    const clearX = gx + gw2 * 0.8, clearW = gw2 * 0.2;
    const bumpY = gy - 30, bumpH = gh + 30;
    const soulV = Math.max(0, Math.min(1, this.soul));

    // ベース部(0〜80%): 暗い赤の通常ゲージ
    ctx.fillStyle = '#2a0d05';
    ctx.fillRect(gx, gy, gw2 * 0.8, gh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(gx, gy, gw2 * 0.8, gh);

    // クリア圏(80〜100%): 30px盛り上がった台(背景=暗い黄色)
    ctx.fillStyle = '#4a3d00';
    ctx.fillRect(clearX, bumpY, clearW, bumpH);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 2;
    ctx.strokeRect(clearX, bumpY, clearW, bumpH);
    ctx.fillStyle = '#ffca28';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, 'クリア', clearX + clearW / 2, bumpY - 6);

    // フィル(通常部: オレンジ)
    const innerN = gw2 * 0.8 - 4;
    const fw2 = (gw2 - 4) * soulV;
    if (fw2 > 0.001) {
      const fGrad = ctx.createLinearGradient(gx, 0, clearX, 0);
      fGrad.addColorStop(0, '#ffca28');
      fGrad.addColorStop(1, '#ff6f00');
      ctx.fillStyle = fGrad;
      ctx.fillRect(gx + 2, gy + 2, Math.min(fw2, innerN), gh - 4);
    }
    // フィル(クリア圏: 黄色・盛り上がりに沿う ※100%時は虹色)
    const fwC = fw2 - innerN;
    if (fwC > 0.001) {
      if (soulV >= 0.999) {
        const rGrad = ctx.createLinearGradient(clearX, 0, clearX + clearW, 0);
        for (let i = 0; i <= 20; i++) {
          const h = this.rainbowStyle === 0 ? i * 18 : 360 - i * 18;
          rGrad.addColorStop(i / 20, `hsl(${h}, 92%, 55%)`);
        }
        ctx.fillStyle = rGrad;
      } else {
        const yGrad = ctx.createLinearGradient(0, bumpY, 0, bumpY + bumpH);
        yGrad.addColorStop(0, '#ffeb3b');
        yGrad.addColorStop(1, '#fbc02d');
        ctx.fillStyle = yGrad;
      }
      ctx.fillRect(clearX + 2, bumpY + 2, Math.min(fwC, clearW - 4), bumpH - 4);
    }
    // 魂の炎は判定枠側に表示する(ゲージ横ではなく)
    ctx.font = 'bold 32px Yu Gothic, Meiryo, sans-serif';
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#000';
    ctx.textAlign = 'right';
    ctx.strokeText('魂', W - 22, 130);
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, '魂', W - 22, 130);
  }

  // ---- ミニ太鼓(入力表示) ----
  // player=1: 通常色(左=ドン赤 / 右=カツ青) / player=2: 赤⇔水色を反転させた色
  _drawMiniTaiko(ctx, mx, my, player = 1) {
    const lt = 0.15;
    const S = player === 2 ? '2' : ''; // lastLeftDonAt2 等のサフィックス
    const lDon = this['lastLeftDonAt' + S] !== undefined && (this.animTime - this['lastLeftDonAt' + S]) < lt;
    const rDon = this['lastRightDonAt' + S] !== undefined && (this.animTime - this['lastRightDonAt' + S]) < lt;
    const lKa = this['lastLeftKaAt' + S] !== undefined && (this.animTime - this['lastLeftKaAt' + S]) < lt;
    const rKa = this['lastRightKaAt' + S] !== undefined && (this.animTime - this['lastRightKaAt' + S]) < lt;
    const isP2 = player === 2;
    const donTint = isP2 ? '#1e88e5' : null; // 2Pはドンを水色に
    const kaTint = isP2 ? '#e53935' : null;  // 2Pはカツを赤に(反転)
    const tk = this.tkImages;
    const tkOk = tk && tk.frame && tk.frame.complete && tk.frame.naturalWidth;
    const anyHit = lDon || rDon || lKa || rKa;
    ctx.save();
    ctx.translate(mx, my);
    if (anyHit) ctx.scale(1.1, 1.1);
    if (tkOk) {
      const fw = 92, fh = 92 * tk.frame.naturalHeight / tk.frame.naturalWidth;
      ctx.drawImage(tk.frame, -fw / 2, -fh / 2, fw, fh);
      const ov = (img) => img && img.complete && img.naturalWidth;
      // P2用の色反転キャッシュ
      this._tkTint = this._tkTint || {};
      const tint = (img, color) => {
        const k = color + (img.src.length);
        if (!this._tkTint[k]) {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const cc = c.getContext('2d');
          cc.drawImage(img, 0, 0);
          cc.globalCompositeOperation = 'source-in';
          cc.fillStyle = color;
          cc.fillRect(0, 0, c.width, c.height);
          this._tkTint[k] = c;
        }
        return this._tkTint[k];
      };
      const dImg = (img) => (donTint && ov(img)) ? tint(img, donTint) : img;
      const kImg = (img) => (kaTint && ov(img)) ? tint(img, kaTint) : img;
      if (lDon && ov(tk.left_don)) ctx.drawImage(dImg(tk.left_don), -fw / 2, -fh / 2, fw, fh);
      if (rDon && ov(tk.right_don)) ctx.drawImage(dImg(tk.right_don), -fw / 2, -fh / 2, fw, fh);
      if (lKa && ov(tk.left_ka)) ctx.drawImage(kImg(tk.left_ka), -fw / 2, -fh / 2, fw, fh);
      if (rKa && ov(tk.right_ka)) ctx.drawImage(kImg(tk.right_ka), -fw / 2, -fh / 2, fw, fh);
    } else {
      const donFlash = lDon || rDon, kaFlash = lKa || rKa;
      const mr = 42;
      const donCol = isP2 ? '#3fb9e8' : this.bodyColor; // 2Pはドン=水色
      const kaCol = isP2 ? '#e53935' : '#3fb9e8';       // 2Pはカツ=赤(反転)
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, mr + 4, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(-mr, -mr, mr, mr * 2); ctx.clip();
      ctx.fillStyle = donCol;
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill();
      if (donFlash) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -mr, mr, mr * 2); ctx.clip();
      ctx.fillStyle = kaCol;
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill();
      if (kaFlash) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.strokeStyle = '#26130b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, mr, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -mr); ctx.lineTo(0, mr); ctx.stroke();
    }
    ctx.restore();
    // キー表記(左右)
    const kL = isP2 ? '←/→' : 'F/J';
    const kR = isP2 ? '↑/↓' : 'D/K';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(kL, mx - 64, my + 4);
    ctx.strokeText(kR, mx + 64, my + 4);
    ctx.fillStyle = isP2 ? '#b3e5fc' : '#fff';
    this.outlineText(ctx, kL, mx - 64, my + 4);
    this.outlineText(ctx, kR, mx + 64, my + 4);
  }

  // ---- ノーツレーン + 左パネル ----
  drawLane(ctx, musicTime) {
    ctx.fillStyle = '#161619';
    ctx.fillRect(PANEL_W, LANE_Y, W - PANEL_W, LANE_H);
    // 2P: ノーツとレーンをクローンし、下側(320〜480)に2Pレーンを配置
    const laneTotalH = this.players === 2 ? LANE_H * 2 : LANE_H;
    const laneGrad = ctx.createLinearGradient(0, LANE_Y, 0, LANE_Y + laneTotalH);
    laneGrad.addColorStop(0, 'rgba(255,255,255,0.05)');
    laneGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
    laneGrad.addColorStop(1, 'rgba(0,0,0,0.25)');
    if (this.players === 2) {
      ctx.fillStyle = '#0b1e33'; // 2Pレーン帯(下段・ダークブルー)
      ctx.fillRect(PANEL_W, LANE_Y + LANE_H, W - PANEL_W, LANE_H);
      ctx.fillStyle = laneGrad;
      ctx.fillRect(PANEL_W, LANE_Y, W - PANEL_W, laneTotalH);
      ctx.fillStyle = 'rgba(79,195,247,0.8)';
      ctx.fillRect(PANEL_W, LANE_Y + LANE_H - 1, W - PANEL_W, 2); // 1P/2Pレーン分割線(青)
    } else {
      ctx.fillStyle = laneGrad;
      ctx.fillRect(PANEL_W, LANE_Y, W - PANEL_W, LANE_H);
    }
    ctx.fillStyle = '#3a3a3f';
    ctx.fillRect(PANEL_W, LANE_Y - 4, W - PANEL_W, 4);
    ctx.fillRect(PANEL_W, LANE_Y + laneTotalH, W - PANEL_W, 4);

    // 魂の炎(GOGO中のみ・2.5倍・フレーム1〜6) ※ノーツ・判定枠の下に半透明で
    if (this.gogoActive) {
      const soulArr = this.assets.soul;
      if (soulArr && soulArr.length) {
        const sImg = soulArr[1 + Math.floor(this.animTime * 10) % 6];
        if (sImg && sImg.complete && sImg.naturalWidth) {
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.drawImage(sImg, this.judgeLineX - 137, this.laneCY(1) - 137, 275, 275);
          ctx.restore();
        }
      }
    }

    const visOnML = this.visBPM > 0;
    const stopML = this.scrollStopMode;
    const visNowML = stopML ? this._visTime(musicTime) : musicTime;
    for (let ml of this.measureLines) {
      // ノーツと同じ速度ファクター(個別SCROLL・見た目BPMに追従)
      const mlFactor = visOnML ? (ml.bpm / this.visBPM) : ml.scroll;
      const mlt = stopML ? this._visTime(ml.time) : ml.time;
      const mx = this.judgeLineX + (mlt - visNowML) * this.noteSpeed * this.hs * mlFactor;
      if (mx < PANEL_W || mx > W) continue;
      ctx.strokeStyle = 'rgba(255,255,255,0.20)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 10]);
      ctx.beginPath();
      ctx.moveTo(mx, LANE_Y + 6);
      ctx.lineTo(mx, LANE_Y + laneTotalH - 6);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ===== プレイヤー別レーン描画(2P時は上下2レーン) =====
    const pc = this.players === 2 ? [1, 2] : [1];
    for (const p of pc) {
      const cy = this.laneCY(p);
      const ringCol = p === 1 ? '#ffd700' : '#4fc3f7'; // 1P金・2P青

    for (let roll of this.rolls) {
      if (roll.resolved[0] && (this.players !== 2 || roll.resolved[1])) continue;
      if (roll.endX < PANEL_W - 60 || roll.startX > W + 60) continue;
      const sx = Math.max(roll.startX, PANEL_W);
      const ex = Math.min(roll.endX, W);
      if (ex <= sx) continue;
      const isBig = roll.type === 'big_roll';
      const barH = isBig ? 46 : 32;
      const barY = cy - barH / 2;
      ctx.fillStyle = isBig ? 'rgba(255, 143, 0, 0.32)' : 'rgba(255, 202, 40, 0.28)';
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8); ctx.fill();
      ctx.strokeStyle = isBig ? 'rgba(255,143,0,0.7)' : 'rgba(255,202,40,0.7)';
      ctx.lineWidth = isBig ? 3 : 2;
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8); ctx.stroke();
      ctx.save();
      this.roundRect(ctx, sx, barY, ex - sx, barH, 8);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 3;
      for (let ox = sx - 20; ox < ex + 20; ox += 14) {
        ctx.beginPath();
        ctx.moveTo(ox, barY + barH);
        ctx.lineTo(ox + 16, barY);
        ctx.stroke();
      }
      ctx.restore();
      // 先頭に1つだけ黄色い音符(通常音符と同じ見たし)。残りは半透明バー
      const rr = isBig ? 17 : 14;
      const hx = Math.max(sx + rr, Math.min(roll.startX, ex - rr));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx, cy, rr + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isBig ? '#ffc400' : '#ffca28';
      ctx.beginPath(); ctx.arc(hx, cy, rr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#4e3400';
      ctx.beginPath(); ctx.ellipse(hx - rr*0.3, cy - rr*0.18, rr*0.11, rr*0.16, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx + rr*0.3, cy - rr*0.18, rr*0.11, rr*0.16, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#4e3400'; ctx.lineWidth = rr * 0.1;
      ctx.beginPath(); ctx.arc(hx - rr*0.12, cy + rr*0.22, rr*0.13, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + rr*0.12, cy + rr*0.22, rr*0.13, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
      if (roll.hits[p - 1] > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        this.outlineText(ctx, String(roll.hits[p - 1]), (sx + ex) / 2, barY - 8);
      }
    }

    for (let note of this.notes) {
      if ((p === 1 ? note.hp1 : note.hp2) || note.x < -60 || note.x > W + 60) continue;
      const et = p === 1 ? (note.rt1 || note.type) : (note.rt2 || note.type);
      if (p === 2) {
        // 2Pは上下反転(顔が逆さま)
        ctx.save();
        ctx.translate(note.x, cy);
        ctx.scale(1, -1);
        this.drawNoteFace(ctx, 0, 0, et);
        ctx.restore();
      } else {
        this.drawNoteFace(ctx, note.x, cy, et);
      }
    }

    for (let balloon of this.balloons) {
      const pi2 = p - 1; // このレーンのプレイヤーindex
      if (balloon.resolved[pi2]) {
        // 破裂アニメーション(判定枠で割れた瞬間)
        if (balloon.poppedAt[pi2] !== undefined && musicTime >= balloon.poppedAt[pi2] && musicTime - balloon.poppedAt[pi2] < 0.35) {
          const pp = Math.min(1, Math.max(0, (musicTime - balloon.poppedAt[pi2]) / 0.35));
          ctx.strokeStyle = `rgba(255, 105, 180, ${1 - pp})`;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(this.judgeLineX + 62, cy - 34, 20 + pp * 45, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = `rgba(255, 105, 180, ${(1 - pp) * 0.5})`;
          for (let k = 0; k < 6; k++) {
            const a = k * Math.PI / 3 + 0.5;
            ctx.beginPath();
            ctx.arc(this.judgeLineX + 62 + Math.cos(a) * (15 + pp * 40), cy - 34 + Math.sin(a) * (15 + pp * 40), 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        continue;
      }
      if (balloon.x < -80 || balloon.x > W + 80) continue;
      const shake = balloon.hitFlag[pi2] ? Math.sin(musicTime * 30) * 3 : 0;
      const bx = balloon.x + shake;
      // オレンジの音符 + 右側に風船(円)
      const nr = 20;
      const bpx = bx + 62, bpy = cy - 34, br = 26;
      // 音符(オレンジ・ドン顔)
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bx, cy, nr + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff9800';
      ctx.beginPath(); ctx.arc(bx, cy, nr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e65100'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#26130b';
      ctx.beginPath(); ctx.ellipse(bx - 7, cy - 3, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx + 7, cy - 3, 2.6, 3.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#26130b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx - 2.5, cy + 5, 2.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx + 2.5, cy + 5, 2.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      // ひも(音符→風船)
      ctx.strokeStyle = '#8d5524'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(bx + nr - 2, cy - 8);
      ctx.quadraticCurveTo(bx + 40, cy - 18, bpx - br * 0.5, bpy + br * 0.6);
      ctx.stroke();
      // 風船本体(右側の円)
      ctx.fillStyle = '#ff69b4';
      ctx.beginPath(); ctx.arc(bpx, bpy, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ad1457'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.ellipse(bpx - br * 0.3, bpy - br * 0.3, br * 0.28, br * 0.2, -0.4, 0, Math.PI * 2); ctx.fill();
      // 残り回数
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      const remain = balloon.hitFlag[pi2] ? Math.max(0, balloon.hitsRequired - balloon.hits[pi2]) : balloon.hitsRequired;
      this.outlineText(ctx, String(remain), bpx, bpy + 6);
    }

    ctx.strokeStyle = ringCol;
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(this.judgeLineX, cy, 52, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(this.judgeLineX, cy, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    if (this.charHitT > 0 && p === 1) {
      const pp2 = Math.min(1, Math.max(0, 1 - this.charHitT / 0.25));
      ctx.strokeStyle = `rgba(255, 235, 100, ${1 - pp2})`;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(this.judgeLineX, cy, 52 + pp2 * 30, 0, Math.PI * 2); ctx.stroke();
    }
    } // ===== プレイヤー別レーン描画ここまで =====
    const pGrad = ctx.createLinearGradient(0, HEADER_H, 0, SCENE_Y);
    pGrad.addColorStop(0, '#a31414');
    pGrad.addColorStop(1, '#7d0d0d');
    ctx.fillStyle = pGrad;
    ctx.fillRect(0, HEADER_H, PANEL_W, SCENE_Y - HEADER_H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(PANEL_W - 3, HEADER_H, 3, SCENE_Y - HEADER_H);

    ctx.textAlign = 'left';
    ctx.font = 'bold 42px Yu Gothic, Meiryo, sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#000';
    ctx.strokeText(String(this.score), 22, 182);
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, String(this.score), 22, 182);

    const course = this.songs[this.selectedSong] ? this.songs[this.selectedSong].courses[this.selectedDiff] : null;
    const diffNames = course ? (course.headers.COURSE || 'Oni') : 'Oni';
    const diffLabels = { Easy: 'かんたん', Normal: 'ふつう', Hard: 'むずかしい', Oni: 'おに', Edit: 'えでぃっと' };
    const diffColors = { Easy: '#ffb300', Normal: '#7cb342', Hard: '#546e7a', Oni: '#c2185b', Edit: '#5e35b1' };
    const badgeKey = diffNames.charAt(0).toUpperCase() + diffNames.slice(1).toLowerCase();

    // 難易度徽章(edit/oni/hard/normal/easy.png)
    const badge = this.courseBadges && this.courseBadges[badgeKey];
    if (badge && badge.complete && badge.naturalWidth) {
      const bw = 52, bh = 52 * badge.naturalHeight / badge.naturalWidth;
      ctx.drawImage(badge, 66 - bw / 2, 208 - bh / 2, bw, bh);
    } else {
      ctx.fillStyle = diffColors[badgeKey] || '#c2185b';
      ctx.beginPath(); ctx.arc(66, 208, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff';
      this.drawStar(ctx, 66, 208, 5, 15, 7);
    }

    // ミニ太鼓(入力表示): 1Pはパネル右側。2Pは専用の青パネルに個別配置
    const mx = 185, my = 252;
    this._drawMiniTaiko(ctx, mx, my, 1);
    if (this.players === 2) {
      // 【2P青パネル】左カラム下部を青色テーマにし、2Pミニ太鼓を配置
      const bpGrad = ctx.createLinearGradient(0, SCENE_Y, 0, H);
      bpGrad.addColorStop(0, '#0d3c61');
      bpGrad.addColorStop(1, '#072a44');
      ctx.fillStyle = bpGrad;
      ctx.fillRect(0, SCENE_Y, PANEL_W, H - SCENE_Y);
      ctx.fillStyle = '#4fc3f7';
      ctx.fillRect(PANEL_W - 3, SCENE_Y, 3, H - SCENE_Y);
      // 2Pラベル
      ctx.fillStyle = '#0288d1';
      this.roundRect(ctx, 14, 334, 62, 32, 8); ctx.fill();
      ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
      this.roundRect(ctx, 14, 334, 62, 32, 8); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'center';
      this.outlineText(ctx, '2P', 45, 357);
      this._drawMiniTaiko(ctx, 185, 424, 2);
    }

    // 難易度ラベル
    ctx.font = 'bold 15px sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeText(diffLabels[diffNames] || diffNames, 66, 310);
    this.outlineText(ctx, diffLabels[diffNames] || diffNames, 66, 310);




    // 判定テキスト: 上側から幽霊(不透明度0)で登場 → イージング0.5秒で移動 → その後ゆっくりフェード
    for (let eff of this.hitEffects) {
      const age = musicTime - eff.time;
      if (age < 0) continue;
      const enter = Math.min(1, age / 0.5);
      const ease = 1 - Math.pow(1 - enter, 3); // ease-out
      const fadeDur = Math.max(0.3, eff.life - 0.5);
      const alpha = age <= 0.5 ? ease : Math.max(0, 1 - (age - 0.5) / fadeDur);
      const rise = (1 - ease) * 20;           // 最終位置から+20px上から降りてくる
      const sxx = 1 + (1 - ease) * 0.05;      // 横はほぼ変化なし
      const syy = 1 + (1 - ease) * 0.22;      // 縦比率を控えめに伸ばして現れる
      ctx.textAlign = 'center';
      ctx.globalAlpha = alpha;
      const sets = {
        perfect: ['良', 40, '#ffd700', 'rgba(120, 60, 0, 0.85)'],
        good:    ['可', 34, '#00e676', 'rgba(0, 90, 40, 0.85)'],
        miss:    ['不可', 34, '#c9c9c9', 'rgba(60, 60, 60, 0.85)'],
      };
      const s = sets[eff.type];
      if (s) {
        ctx.save();
        ctx.translate(eff.x, eff.y - 62 - rise);
        ctx.scale(sxx, syy);
        ctx.font = `bold ${s[1]}px Yu Gothic, Meiryo, sans-serif`;
        ctx.lineWidth = 8;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = s[3];
        ctx.strokeText(s[0], 0, 0);
        ctx.fillStyle = s[2];
        this.outlineText(ctx, s[0], 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // コンボ表示(ミニ太鼓マークの中央に中央ぞろえ / 5コンボから / 50で銀・100で金)
    if (this.combo !== this._lastComboDrawn) {
      this._comboBounceAt = this.animTime; // 増減の瞬間にバウンド開始
      this._lastComboDrawn = this.combo;
    }
    if (this.combo >= 5) {
      const bt = this._comboBounceAt ? Math.min(1, (this.animTime - this._comboBounceAt) / 0.35) : 1;
      const comboSy = 1 + Math.sin(bt * Math.PI) * 0.35; // 跳ねる代わりに縦比率が伸び縮み
      ctx.save();
      ctx.translate(mx, my);
      ctx.scale(1, comboSy);
      ctx.translate(-mx, -my);
      const comboColor = this.combo >= 100 ? '#ffca28' : this.combo >= 50 ? '#d5dbe0' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px Yu Gothic, Meiryo, sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#26130b';
      ctx.strokeText(String(this.combo), mx, my);
      ctx.fillStyle = comboColor;
      this.outlineText(ctx, String(this.combo), mx, my);
      ctx.font = 'bold 10px sans-serif';
      ctx.lineWidth = 3;
      ctx.strokeText('combo', mx, my + 13);
      this.outlineText(ctx, 'combo', mx, my + 13);
      ctx.restore();
    }

    if (this.autoPlay) {
      ctx.fillStyle = '#ff5252';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      this.outlineText(ctx, '🤖 AUTO', PANEL_W + 12, LANE_Y - 10);
    }

  }

  // ---- ドンちゃん顔ノーツ ----
  drawNoteFace(ctx, x, y, type) {
    const don = (type === 1 || type === 3);
    const big = (type === 3 || type === 4);
    const r = big ? 36 : 27;
    const col = don ? this.bodyColor : '#3fb9e8';
    const edge = don ? '#7a0000' : '#01579b';
    const inner = don ? '#ff8a75' : '#8fdcf5';

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    if (big) {
      ctx.fillStyle = inner;
      ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#26130b';
    const ey = y - r * 0.12;
    ctx.beginPath(); ctx.ellipse(x - r * 0.32, ey, r * 0.10, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.32, ey, r * 0.10, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#26130b';
    ctx.lineWidth = r * 0.09;
    ctx.beginPath(); ctx.arc(x - r * 0.11, y + r * 0.20, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.11, y + r * 0.20, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(x - r * 0.48, y + r * 0.14, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.48, y + r * 0.14, r * 0.12, 0, Math.PI * 2); ctx.fill();
  }

  // ---- 縁日シーン(下部) ----
  drawFestival(ctx, t, gogo, firePhase = null) {
    const sky = ctx.createLinearGradient(0, SCENE_Y, 0, H);
    sky.addColorStop(0, gogo ? '#4a1208' : '#33100c');
    sky.addColorStop(1, '#120404');
    ctx.fillStyle = sky;
    ctx.fillRect(0, SCENE_Y, W, H - SCENE_Y);

    this.drawLanternString(ctx, 356, 0, t);
    this.drawLanternString(ctx, 396, 55, t);

    this.drawCandyStall(ctx, 36, 408);
    this.drawTakoyakiStall(ctx, 470, 380, t);
    this.drawKakigoriStall(ctx, 972, 402);

    if (gogo) {
      ctx.fillStyle = 'rgba(255, 120, 0, 0.07)';
      ctx.fillRect(0, SCENE_Y, W, H - SCENE_Y);
    }

    // GOGO開始時のみ: 下側に花火を3本表示(firePhaseはGOGO開始からの経過秒)
    if (firePhase !== null) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const spots = [[170, 480], [640, 505], [1110, 480]];
      for (let k = 0; k < 3; k++) {
        const arr = this.assets.fire;
        if (!arr || !arr.length) break;
        // 1回だけアニメーション(8フレームを0.8秒で)。開始を0.12秒ずつずらす
        const idx = Math.floor(firePhase * 10 - k * 1.2);
        if (idx >= 0 && idx < arr.length) {
          const f = arr[idx];
          if (f && f.complete && f.naturalWidth) {
            ctx.globalAlpha = 0.85;
            ctx.drawImage(f, spots[k][0] - 45, spots[k][1] - 90, 90, 180);
          }
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#7f0000';
    ctx.fillRect(0, 604, W, 4);
    const stripeW = 36;
    for (let i = 0; i * stripeW < W; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#d32f2f' : '#fff8f0';
      ctx.fillRect(i * stripeW, 608, stripeW, H - 608);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 608, W, 4);
  }

  drawLanternString(ctx, y, phase, t) {
    ctx.strokeStyle = 'rgba(60, 20, 10, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y - 14);
    ctx.quadraticCurveTo(W / 2, y + 22, W, y - 14);
    ctx.stroke();
    const colors = ['#76ff03', '#ffea00', '#ff4081', '#ff9100', '#40c4ff', '#e040fb'];
    for (let i = 0; i < 14; i++) {
      const lx = 46 + i * 90 + phase;
      if (lx > W) break;
      const u = lx / W;
      const ly = (y - 14) + (1 - Math.pow(2 * u - 1, 2)) * 36;
      const c = colors[i % colors.length];
      const pulse = 0.75 + Math.sin(t * 3 + i * 1.7) * 0.25;
      const glow = ctx.createRadialGradient(lx, ly + 10, 2, lx, ly + 10, 26);
      glow.addColorStop(0, c);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.35 * pulse;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(lx, ly + 10, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(lx, ly + 10, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.ellipse(lx - 3, ly + 6, 3, 4, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5d2100';
      ctx.fillRect(lx - 6, ly - 4, 12, 4);
      ctx.fillRect(lx - 5, ly + 22, 10, 3);
    }
  }

  drawAwning(ctx, x, y, w, h, c1, c2) {
    const n = Math.max(3, Math.round(w / 30));
    const sw = w / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 === 0 ? c1 : c2;
      ctx.beginPath();
      ctx.moveTo(x + i * sw, y);
      ctx.lineTo(x + (i + 1) * sw, y);
      ctx.lineTo(x + (i + 1) * sw - 6, y + h);
      ctx.lineTo(x + i * sw + 6, y + h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.arc(x + i * sw + sw / 2, y + h, sw / 2 - 2, 0, Math.PI);
      ctx.fill();
    }
  }

  drawCandyStall(ctx, x, y) {
    ctx.fillStyle = '#8d3b1e';
    ctx.fillRect(x, y, 300, 196);
    ctx.fillStyle = '#6d2a12';
    ctx.fillRect(x - 8, y - 8, 316, 12);
    this.drawAwning(ctx, x - 14, y - 34, 328, 34, '#e53935', '#fff6ee');
    ctx.fillStyle = '#5c2410';
    ctx.fillRect(x + 16, y + 20, 268, 66);
    const cols = ['#ff5252', '#ffeb3b', '#4fc3f7', '#69f0ae', '#e040fb', '#ff9800', '#f48fb1'];
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 8; c++) {
        ctx.fillStyle = cols[(r * 8 + c) % cols.length];
        ctx.beginPath();
        ctx.arc(x + 40 + c * 30, y + 46 + r * 30, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(x + 36 + c * 30, y + 42 + r * 30, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#c62828' : '#fff6ee';
      ctx.fillRect(x + i * 30, y + 100, 30, 96);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
