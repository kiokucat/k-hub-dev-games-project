<script>
// ==================== 内蔵デモデータ ====================

// ==================== アセット定義 ====================
const ASSET_BASE = 'assets/';
// 空フレーム(サイズ2108の空PNG)を除外したフレーム番号リスト
// キャラクター構成(b1/b2廃止):
//   char  = n.png(通常・両腕下降)
//   gogo  = gogo_now_frame_1〜5 (1>2>3>4>5>4>3>2ループ)
//   clear = n.png(リザルトでも通常ポーズ)
//   10コンボごとの演出は combo.png(別途読み込み)
const FRAME_SETS = {
  char:  ['n.png'],
  gogo:  [1, 2, 3, 4, 5].map(i => `gogo_now_frame_${i}.png`),
  clear: ['n.png'],
  soul:  [...Array(8).keys()].map(i => `soul_new_${i}.png`),
  fire:  [...Array(8).keys()].map(i => `firework_new_${i}.png`),
};

// 体色プリセット(🎨ボタンで循環)
const BODY_PRESETS = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#ec407a'];
// デフォルトキーバインド(localStorage 'taiko_keys' で上書き可)
const DEFAULT_KEYS = {
  donL: 'f', donR: 'j', kaL: 'd', kaR: 'k',
  donL2: 'arrowleft', donR2: 'arrowright', kaL2: 'arrowup', kaR2: 'arrowdown'
};

// 開始前カウントイン(秒): 音楽開始と音符開始位置を同だけ遅らせる
const LEAD_IN = 2.0;

// 配信zip曲の音声ファイル先頭に挿入されている「意図的な無音リードイン」(秒)。
// フォルダ演奏と同じ土台(|OFFSET|)にこの分だけ足すことで音ズレを防ぐ。
// 「3秒くらい」はのれん演出2秒+実際の無音約1秒の合計だったため実態は約1秒。
// ズレが残る場合はこの値を 0.9 / 1.1 などに微調整する。
const ZIP_AUDIO_LEAD_IN = 0.0; // 基本はフォルダ演奏と同等(0)。確定した補正値が出たらここに固定する。

// コンボボイスを鳴らすコンボ数
const COMBO_VOICE_THRESHOLDS = [10, 30, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

// #SCROLL の値解釈。公式TJAの複素数記法「n+Ni」には X軸速度(実部 n)のみ使用する
// (本ゲームは横一列レーンのため Y軸速度=虚部は未使用)。通常の実数はそのまま採用。
function parseScrollVal(v) {
  const m = String(v).trim().match(/^(-?\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)i$/i);
  if (m) return parseFloat(m[1]);
  const f = parseFloat(v);
  return isNaN(f) ? 1 : f;
}

// ==================== TJAパーサー（改善版） ====================
// 小節途中のコマンド対応版
class TJAParser {
  parse(tjaText) {
    const lines = tjaText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const global = {};
    const courses = [];
    let currentCourse = null;
    let inStart = false;
    let currentMeasure = null;

    const pushCourse = () => {
      if (currentCourse && currentCourse.measures.length > 0) {
        courses.push(currentCourse);
      }
    };

    const newMeasure = () => ({
      events: [],
      bpm: currentCourse ? currentCourse.currentBPM : (parseFloat(global.BPM) || 120),
      scroll: currentCourse ? currentCourse.currentScroll : 1,
      measure: currentCourse ? [...currentCourse.currentMeasure] : [4, 4],
      barline: currentCourse ? currentCourse.currentBarline : true
    });

    for (let rawLine of lines) {
      let line = rawLine.split('//')[0].trim();
      if (!line) continue;

      if (!inStart) {
        const upLine = line.toUpperCase();
        if (upLine === '#BMSCROLL' || upLine === '#HBSCROLL') {
          const k = upLine.slice(1);
          if (currentCourse) currentCourse.headers[k] = '1';
          else global[k] = '1';
          continue;
        }
        if (line === '#START') {
          inStart = true;
          if (!currentCourse) {
            currentCourse = {
              headers: { COURSE: 'Oni', LEVEL: '1' },
              measures: [],
              balloons: [],
              currentBPM: parseFloat(global.BPM) || 120,
              currentScroll: 1,
              currentMeasure: [4, 4],
              currentBarline: true,
              _parsedCommands: [] // デバッグ用：処理されたコマンドを記録
            };
          }
          currentMeasure = newMeasure();
        } else if (line.includes(':')) {
          const [key, ...vals] = line.split(':');
          const k = key.trim();
          const v = vals.join(':').trim();
          if (k === 'COURSE') {
            pushCourse();
            currentCourse = {
              headers: { COURSE: v, LEVEL: '1' },
              measures: [],
              balloons: [],
              currentBPM: parseFloat(global.BPM) || 120,
              currentScroll: 1,
              currentMeasure: [4, 4],
              currentBarline: true,
              _parsedCommands: []
            };
          } else if (currentCourse) {
            currentCourse.headers[k] = v;
            if (k === 'BPM') currentCourse.currentBPM = parseFloat(v);
            if (k === 'BALLOON') currentCourse.balloons = v.split(/,\s*/).map(Number);
          } else {
            global[k] = v;
            if (k === 'BPM') global.BPM = v;
          }
        }
      } else {
        if (line === '#END') {
          if (currentMeasure && currentMeasure.events.length) {
            currentCourse.measures.push(currentMeasure);
          }
          inStart = false;
        } else if (line === ',') {
          if (currentMeasure && currentMeasure.events.length) {
            currentCourse.measures.push(currentMeasure);
          }
          currentCourse.measures.push(newMeasure());
          currentMeasure = newMeasure();
          continue;
        } else {
          // 【改善】小節内のコマンドと音符を正確に処理する
          // 例：1000#BPMCHANGE 240 0100,  →  "1000" + BPMCHANGE + "0100"
          
          let s = line;
          while (true) {
            const ci = s.indexOf(',');
            const seg = ci === -1 ? s.trim() : s.slice(0, ci).trim();
            
            // セグメント内のコマンドと音符を分離
            const elements = this._extractElements(seg);
            
            for (let elem of elements) {
              if (elem.type === 'cmd') {
                const { cmd, val } = elem;
                currentMeasure.events.push({ t: 'cmd', cmd, val });
                
                if (currentCourse) {
                  currentCourse._parsedCommands.push({
                    cmd, val, 
                    measureIdx: currentCourse.measures.length,
                    eventIdx: currentMeasure.events.length - 1
                  });
                }
                
                if (cmd === '#BARLINEOFF') { currentCourse.currentBarline = false; currentMeasure.barline = false; }
                if (cmd === '#BARLINEON') { currentCourse.currentBarline = true; currentMeasure.barline = true; }
                if (cmd === '#MEASURE') {
                  const m = String(val).split('/').map(Number);
                  if (m.length === 2 && m[0] > 0 && m[1] > 0) {
                    currentCourse.currentMeasure = m;
                    currentMeasure.measure = m;
                  }
                }
                if (cmd === '#SCROLL' || cmd === '#BMSCROLL' || cmd === '#HBSCROLL') {
                  currentCourse.currentScroll = parseScrollVal(val);
                  currentMeasure.scroll = currentCourse.currentScroll;
                }
                if (cmd === '#BPMCHANGE') {
                  const b = parseFloat(val);
                  if (b > 0) { 
                    currentCourse.currentBPM = b; 
                    currentMeasure.bpm = b; 
                  }
                }
              } else if (elem.type === 'note') {
                currentMeasure.events.push({ t: 'note', v: elem.v });
              }
            }
            
            if (ci === -1) break;
            currentCourse.measures.push(currentMeasure);
            currentMeasure = newMeasure();
            s = s.slice(ci + 1);
          }
        }
      }
    }
    pushCourse();

    for (let c of courses) {
      for (let k in global) {
        if (!c.headers[k]) c.headers[k] = global[k];
      }
    }
    return courses;
  }

  // 小節途中のコマンド+音符を分離
  _extractElements(segment) {
    const elements = [];
    let noteBuffer = '';
    
    // コマンドの正規表現
    const cmdRegex = /#([A-Z]+)(?:\s+(.+?))?(?=[,#]|$)/g;
    let lastIndex = 0;
    let match;
    
    // コマンド位置を先に記録
    const cmdMatches = [];
    while ((match = cmdRegex.exec(segment)) !== null) {
      cmdMatches.push({
        start: match.index,
        end: match.index + match[0].length,
        cmd: '#' + match[1],
        arg: match[2] ? match[2].trim() : ''
      });
    }
    
    // コマンドがなければ全て音符
    if (cmdMatches.length === 0) {
      for (const ch of segment) {
        if (/[0-9]/.test(ch)) {
          elements.push({ type: 'note', v: ch });
        }
      }
      return elements;
    }
    
    // コマンドと音符を交互に処理
    lastIndex = 0;
    for (let cm of cmdMatches) {
      // コマンド前の音符
      const before = segment.substring(lastIndex, cm.start);
      for (const ch of before) {
        if (/[0-9]/.test(ch)) {
          elements.push({ type: 'note', v: ch });
        }
      }
      
      // コマンド
      elements.push({
        type: 'cmd',
        cmd: cm.cmd,
        val: cm.arg
      });
      
      lastIndex = cm.end;
    }
    
    // 最後の音符
    const after = segment.substring(lastIndex);
    for (const ch of after) {
      if (/[0-9]/.test(ch)) {
        elements.push({ type: 'note', v: ch });
      }
    }
    
    return elements;
  }
}

// ==================== オーディオマネージャー ====================
class AudioManager {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicSource = null;
    this.musicBuffer = null;
    this.startTime = 0;
    this.pausedAt = 0;
    this.isPlaying = false;
    this.seGain = null;
    this._init();
  }

  _init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.6;
      this.masterGain.connect(this.ctx.destination);
      this.seGain = this.ctx.createGain();
      this.seGain.gain.value = 0.5;
      this.seGain.connect(this.masterGain);
      // 結果音声専用: masterGainのフェード(音楽用)をバイパスして常に通常音量
      this.resultGain = this.ctx.createGain();
      this.resultGain.gain.value = 0.9;
      this.resultGain.connect(this.ctx.destination);
    } catch(e) {
      console.error('AudioContext init failed:', e);
    }
  }

  // 音楽の音量フェードアウト: delay秒待ってからdur秒かけて100%→0%へ。
  // 終了後にstopし、masterGainを元の音量(0.6)に復帰させる。
  // フェードアウトの途中で次の演奏が始まった場合のための解除処理。
  // 旧タイマーが残っていると次の曲の演奏中に stop() が発火して音楽が途中で止まり、
  // また masterGain の減衰ランプが次の曲に持ち越されて音量が消える原因になる。
  cancelFade() {
    clearTimeout(this._fadeTimer);
    this._fadeTimer = null;
    if (this.ctx && this.masterGain) {
      const g = this.masterGain.gain;
      g.cancelScheduledValues(this.ctx.currentTime);
      g.setValueAtTime(0.6, this.ctx.currentTime);
    }
  }

  scheduleFadeOut(delaySec, durSec) {
    if (!this.ctx || !this.masterGain) return;
    const g = this.masterGain.gain;
    const now = this.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(0.6, now);
    g.setValueAtTime(0.6, now + delaySec);
    g.linearRampToValueAtTime(0, now + delaySec + durSec);
    clearTimeout(this._fadeTimer);
    this._fadeTimer = setTimeout(() => {
      this.stop();
      if (this.ctx) {
        g.cancelScheduledValues(this.ctx.currentTime);
        g.setValueAtTime(0.6, this.ctx.currentTime);
      }
    }, (delaySec + durSec) * 1000 + 150);
  }

  _ensureContext() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  async loadFromFile(file) {
    this._ensureContext();
    if (!this.ctx) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      this.musicBuffer = await this.ctx.decodeAudioData(arrayBuffer);
    } catch(e) {
      console.error('Audio decode failed:', e);
      throw e;
    }
  }

  loadFromBuffer(buffer) {
    this._ensureContext();
    this.musicBuffer = buffer;
  }

  // 譜面・判定の「時間ゼロ」の基準を、音声オブジェクト(AudioContext)の時計で記録する。
  // これ以降の全ての時間計算は currentTime*1000 以外の源を使わない(音ズレ防止)。
  syncStart() {
    this._ensureContext();
    if (!this.ctx) return;
    this.cancelFade(); // 前の曲のフェード残りを全て解除(音ズレ・途中停止防止)
    this.startTime = this.ctx.currentTime;
    this.pausedAt = 0;
  }

  play() {
    this._ensureContext();
    if (!this.musicBuffer || !this.ctx) return;
    if (this.isPlaying) this.stop();
    this.musicSource = this.ctx.createBufferSource();
    this.musicSource.buffer = this.musicBuffer;
    this.musicSource.connect(this.masterGain);
    this.musicSource.start(0, this.pausedAt);
    this.isPlaying = true;
  }

  // 指定の AudioContext 時刻(when)ちょうどに再生を開始する(正確なスケジュール再生)。
  // LEAD_INのカウントイン中(-2秒→0秒)に音楽開始を予約し、
  // クロック0秒と音楽の0秒を1ミリ秒のずれもなく一致させる。
  playAt(when) {
    this._ensureContext();
    if (!this.musicBuffer || !this.ctx) return;
    this.cancelFade(); // フェード中の再演奏でも gain ランプと旧タイマーを無効化
    if (this.isPlaying) this.stop();
    this.musicSource = this.ctx.createBufferSource();
    this.musicSource.buffer = this.musicBuffer;
    this.musicSource.connect(this.masterGain);
    // 開始時刻が過去・現在をまたいだ場合でも、時計原点を同じ分だけずらすことで
    // 「クロック0秒＝音楽0秒」を厳密に保つ(ズレ防止)
    const startAt = Math.max(when, this.ctx.currentTime);
    if (startAt > when) this.startTime += (startAt - when);
    this.musicSource.start(startAt, this.pausedAt);
    this.isPlaying = true;
  }

  stop() {
    clearTimeout(this._fadeTimer); // 旧フェードタイマーの誤発火を防止
    this._fadeTimer = null;
    if (this.musicSource) {
      try { this.musicSource.stop(); } catch(e){}
      this.musicSource = null;
    }
    this.isPlaying = false;
    this.pausedAt = 0;
  }

  // 「再生中の音声オブジェクトの currentTime * 1000」(ミリ秒)を唯一の時間源として返す。
  // Date.now()・performance.now()・フレーム数は使用しない。
  // startTime が記録されてさえいれば、音声の再生開始前(カウントイン中)も
  // クロックは -LEAD_IN 秒から滑らかに進行し、0秒ちょうどで音楽が始まる。
  // 【出力遅延の補正】音源は currentTime 基準で進むが、実際に聞こえるのは
  // baseLatency+outputLatency 分だけ遅れた時刻。この分を引くことで
  // 「譜面・判定が聞こえる音声より数ms〜数十ms早く進む」ズレを解消する。
  getTimeMs() {
    if (!this.ctx || this.startTime === undefined) return 0;
    const lat = (this.ctx.baseLatency || 0) + (this.ctx.outputLatency || 0);
    return (this.ctx.currentTime - lat - this.startTime) * 1000;
  }

  // SE読み込み。音色フォルダ(assets/<音色名>/)対応。無ければnull→合成音フォールバック
  async loadSE(manifest) {
    if (!this.ctx) return;
    const seBase = (this.soundset && this.soundset !== 'default') ? ASSET_BASE + this.soundset + '/' : ASSET_BASE;
    const loadOne = async (file, base) => {
      try {
        const r = await fetch((base || seBase) + file);
        if (!r.ok) return null;
        return await this.ctx.decodeAudioData(await r.arrayBuffer());
      } catch (e) { return null; }
    };
    const tryLoad = async (name) => {
      for (const ext of ['ogg', 'mp3', 'wav']) {
        const b = await loadOne(`${name}.${ext}`);
        if (b) return b;
      }
      return null;
    };
    const seMap = manifest && manifest.se;
    this.seBuffers = {
      don: seMap && seMap.don ? await loadOne(seMap.don, ASSET_BASE) : await tryLoad('don'),
      ka:  seMap && seMap.ka  ? await loadOne(seMap.ka, ASSET_BASE)  : await tryLoad('ka'),
      balloon: await tryLoad('Balloon'), // 風船破裂音(任意)
      start: (manifest && manifest.start) ? await loadOne(manifest.start, ASSET_BASE) : await tryLoad('start'), // 演奏開始のれん音(任意)
    };
    // 結果音声: ノルマ/フルコンボ/ドンダフル/失敗
    const rMap = (manifest && manifest.result) || {};
    this.resultVoices = {
      clear: rMap.clear ? await loadOne(rMap.clear, ASSET_BASE) : await tryLoad('norma'),
      fc:    rMap.fc    ? await loadOne(rMap.fc, ASSET_BASE)    : await tryLoad('fullcombo'),
      dfc:   rMap.dfc   ? await loadOne(rMap.dfc, ASSET_BASE)   : await tryLoad('dondafull'),
      fail:  rMap.fail  ? await loadOne(rMap.fail, ASSET_BASE)  : await tryLoad('failed'),
    };
    // コンボボイス: 10,30,50,100,200,...1000
    this.comboVoices = {};
    const vMap = manifest && manifest.voices;
    for (const n of COMBO_VOICE_THRESHOLDS) {
      if (vMap && vMap[n]) this.comboVoices[n] = await loadOne(vMap[n], ASSET_BASE);
      else {
        this.comboVoices[n] = (await tryLoad('combo_' + n))
                           || (await loadOne(`combo_${n}.ogg`, ASSET_BASE))
                           || (await loadOne(`combo_${n}.mp3`, ASSET_BASE))
                           || (await loadOne(`combo_${n}.wav`, ASSET_BASE));
      }
    }
  }

  // コンボボイス再生(無ければ何もしない)
  playComboVoice(combo) {
    if (!this.ctx) return;
    const buf = this.comboVoices && this.comboVoices[combo];
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.seGain);
    src.start();
  }

  playSE(type) {
    this._ensureContext();
    if (!this.ctx) return;
    // assetsの音源があればそちらを使う
    const buf = this.seBuffers && this.seBuffers[type];
    if (buf) {
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.seGain);
      src.start();
      return;
    }
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.seGain);
    const now = this.ctx.currentTime;
    if (type === 'don') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'ka') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    }
  }

  async generateDemoMusic() {
    if (!this.ctx) this._init();
    const sampleRate = this.ctx.sampleRate;
    const bpm = 130;
    const beatSec = 60 / bpm;
    const duration = beatSec * 90;
    const length = sampleRate * duration;
    const buffer = this.ctx.createBuffer(2, length, sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const beat = t / beatSec;
        let sample = 0;
        if (beat % 1 < 0.1) {
          const kt = (beat % 1) / 0.1;
          sample += Math.sin(2 * Math.PI * 60 * t) * (1 - kt) * 0.8;
          sample += (Math.random() * 2 - 1) * (1 - kt) * 0.3;
        }
        if ((beat + 0.5) % 2 < 0.1) {
          const st = ((beat + 0.5) % 2) / 0.1;
          sample += (Math.random() * 2 - 1) * (1 - st) * 0.6;
        }
        if (beat % 0.5 < 0.05) {
          const ht = (beat % 0.5) / 0.05;
          sample += (Math.random() * 2 - 1) * (1 - ht) * 0.15;
        }
        const bassNote = [55, 55, 73, 73, 65, 65, 49, 49][Math.floor(beat / 4) % 8];
        sample += Math.sin(2 * Math.PI * bassNote * t) * 0.15 * Math.exp(-((beat % 1) * 4));
        if (beat >= 32 && beat < 80) {
          const melNotes = [440, 523, 659, 784, 659, 523, 440, 392];
          const noteIdx = Math.floor((beat - 32) / 0.5) % melNotes.length;
          const freq = melNotes[noteIdx];
          sample += Math.sin(2 * Math.PI * freq * t) * 0.08 * Math.sin(Math.PI * ((beat - 32) % 0.5) / 0.5);
        }
        data[i] = sample * 0.7;
      }
    }
    this.musicBuffer = buffer;
  }
}

// ==================== ファイルローダー ====================
class SongLoader {
  constructor() {
    this.parser = new TJAParser();
  }

  // TJA読込: UTF-8でデコードし、文字化け(�)があればShift-JISで再デコード
  async readTJA(file) {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) {
      try { text = new TextDecoder('shift_jis').decode(buf); } catch (e) {}
    }
    return text;
  }

  async handleFiles(files) {
    const folderMap = {};
    for (let file of files) {
      const path = file.webkitRelativePath || file.name;
      const parts = path.split('/');
      if (parts.length < 1) continue;
      const fileName = parts[parts.length - 1].toLowerCase();
      // フォルダ構造の解釈:
      //   親/曲フォルダ/*.tja        → parts.slice(1,-1).join('/') が曲フォルダ
      //   曲フォルダ自体を選択した    → parts[0] が曲フォルダ
      //   ファイルだけドロップした    → ファイル名(拡張子抜き)を曲名にする
      let songFolder;
      let category = null;
      if (parts.length >= 3) {
        // 親/カテゴリ名/曲名/ファイル → 曲名はファイルの直下フォルダ、カテゴリはその上
        songFolder = parts[parts.length - 2];
        if (parts.length >= 4) category = parts[parts.length - 3];
      } else if (parts.length === 2) {
        songFolder = parts[0];
      } else {
        songFolder = file.name.replace(/\.[^.]+$/, '') || '曲';
      }
      if (!folderMap[songFolder]) {
        folderMap[songFolder] = { tja: null, audio: null, category: null };
      }
      if (category) folderMap[songFolder].category = category;
      if (fileName.endsWith('.tja')) {
        folderMap[songFolder].tja = file;
      }
      if (fileName.endsWith('.ogg') || fileName.endsWith('.mp3') || fileName.endsWith('.wav')) {
        folderMap[songFolder].audio = file;
      }
    }
    const loaded = [];
    for (let songName in folderMap) {
      const entry = folderMap[songName];
      if (entry.tja && entry.audio) {
        try {
          const tjaText = await this.readTJA(entry.tja);
          const courses = this.parser.parse(tjaText);
          if (courses.length > 0) {
            loaded.push({
              name: songName,
              category: entry.category,
              courses,
              audioFile: entry.audio,
              genre: (courses[0].headers.GENRE || '').trim() || 'その他'
            });
          }
        } catch(e) {
          console.error('Parse error:', songName, e);
        }
      }
    }
    return loaded;
  }
}

// ==================== プロフィール(ユーザーネーム/レベリング/称号) ====================
// localStorage 'taiko_profile' に保存: {name, xp, plays, clears, fc, dfc, maxCombo, titles[], title}
// レベル: n→n+1 に必要なXP = 100 + (n-1)*50 で累積難易度が上がる。
const TITLE_DEFS = [
  { id: 'default',  name: '見習い奏者',       desc: '初期称号',              check: () => true },
  { id: 'clear1',   name: 'はじめてのクリア', desc: 'クリアを1回達成',       check: p => p.clears >= 1 },
  { id: 'clear50',  name: 'クリア職人',       desc: 'クリアを50回達成',      check: p => p.clears >= 50 },
  { id: 'fc1',      name: 'フルコンボ！',     desc: 'フルコンボを1回達成',   check: p => p.fc >= 1 },
  { id: 'fc10',     name: 'フルコンボマスター', desc: 'フルコンボを10回達成', check: p => p.fc >= 10 },
  { id: 'dfc1',     name: 'ドンダフルコンボ！', desc: 'ドンダフルを1回達成', check: p => p.dfc >= 1 },
  { id: 'combo300', name: '連打の達人',       desc: '最大コンボ300以上',     check: p => p.maxCombo >= 300 },
  { id: 'combo800', name: '太鼓の申し子',     desc: '最大コンボ800以上',     check: p => p.maxCombo >= 800 },
  { id: 'lv5',      name: '一人前',           desc: 'レベル5到達',           check: p => p.level() >= 5 },
  { id: 'lv10',     name: '名人',             desc: 'レベル10到達',          check: p => p.level() >= 10 },
  { id: 'lv20',     name: '達人',             desc: 'レベル20到達',          check: p => p.level() >= 20 },
  { id: 'plays50',  name: '常連さん',         desc: '演奏50回',              check: p => p.plays >= 50 },
  { id: 'plays200', name: '太鼓ずき',         desc: '演奏200回',             check: p => p.plays >= 200 },
  { id: 'medal',    name: 'メダル王',         desc: '所持メダル10000枚',     check: () => coinMgr.coins >= 10000 },
];
const profileMgr = {
  name: '1P', xp: 0, plays: 0, clears: 0, fc: 0, dfc: 0, maxCombo: 0,
  titles: ['default'], title: 'default',
  load() {
    try {
      const p = JSON.parse(localStorage.getItem('taiko_profile'));
      if (p) Object.assign(this, p);
    } catch (e) {}
  },
  save() {
    try {
      localStorage.setItem('taiko_profile', JSON.stringify({
        name: this.name, xp: this.xp, plays: this.plays, clears: this.clears,
        fc: this.fc, dfc: this.dfc, maxCombo: this.maxCombo,
        titles: this.titles, title: this.title
      }));
    } catch (e) {}
  },
  // レベル: 必要XPは 100+(Lv-1)*50 ずつ増える(1→2:100, 2→3:150, 3→4:200...)
  level() {
    let l = 1, need = 100, rest = this.xp;
    while (rest >= need) { rest -= need; l++; need = 100 + (l - 1) * 50; }
    return l;
  },
  // 現在レベル内の進捗 {into, need}(XPゲージ表示用)
  xpProgress() {
    let l = 1, need = 100, rest = this.xp;
    while (rest >= need) { rest -= need; l++; need = 100 + (l - 1) * 50; }
    return { into: rest, need };
  },
  titleName() {
    const t = TITLE_DEFS.find(t => t.id === this.title);
    return t ? t.name : '';
  },
  // 条件を満たした称号を解禁し「今回新たに解禁したもの」の配列を返す
  checkTitles() {
    const fresh = [];
    for (const t of TITLE_DEFS) {
      if (this.titles.includes(t.id)) continue;
      try { if (t.check(this)) { this.titles.push(t.id); fresh.push(t); } } catch (e) {}
    }
    if (fresh.length) this.save();
    return fresh;
  },
  // 解放済み称号を順番に切り替え(タイトル画面のバッジをクリック)
  cycleTitle() {
    const i = this.titles.indexOf(this.title);
    this.title = this.titles[(i + 1) % this.titles.length];
    this.save();
  },
};
profileMgr.load();
