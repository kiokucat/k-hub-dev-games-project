    ctx.strokeRect(x, y, 300, 196);
    ctx.fillStyle = '#ffca28';
    ctx.beginPath(); ctx.ellipse(x + 300, y - 44, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 2; ctx.stroke();
  }

  drawTakoyakiStall(ctx, x, y, t) {
    ctx.fillStyle = '#a33d1f';
    ctx.fillRect(x, y + 60, 380, 200);
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(x + 10, y, 360, 58);
    ctx.strokeStyle = '#8d4b00';
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 10, y, 360, 58);
    ctx.fillStyle = '#ffb300';
    for (let i = 0; i < 9; i++) {
      ctx.beginPath();
      ctx.arc(x + 30 + i * 40, y + 58, 16, 0, Math.PI);
      ctx.fill();
    }
    ctx.fillStyle = '#c62828';
    ctx.font = 'bold 38px Yu Gothic, Meiryo, sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, 'たこ焼き', x + 200, y + 44);
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.arc(x + 42, y + 26, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c62828'; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(x + 38 + i * 4, y + 36);
      ctx.quadraticCurveTo(x + 30 + i * 8, y + 48, x + 34 + i * 8, y + 52);
      ctx.stroke();
    }
    this.drawAwning(ctx, x - 6, y + 58, 392, 26, '#ff8f00', '#ffe0b2');
    ctx.fillStyle = '#4e180a';
    ctx.fillRect(x + 18, y + 90, 344, 100);
    ctx.fillStyle = '#37474f';
    ctx.fillRect(x + 40, y + 128, 240, 46);
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 7; c++) {
        const bx = x + 58 + c * 32, by = y + 140 + r * 20;
        ctx.fillStyle = '#b9783e';
        ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6d3f16';
        ctx.beginPath(); ctx.arc(bx, by - 2, 7, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f5deb3';
        ctx.fillRect(bx - 6, by - 3, 12, 1.5);
      }
    }
    for (let i = 0; i < 3; i++) {
      const sy = y + 118 - ((t * 22 + i * 14) % 34);
      const sx = x + 90 + i * 70 + Math.sin(t * 2 + i) * 5;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.globalAlpha = 0.35 * (1 - ((t * 22 + i * 14) % 34) / 34);
      ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#fff3e0';
    ctx.beginPath(); ctx.arc(x + 320, y + 150, 22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 304, y + 134); ctx.lineTo(x + 308, y + 118); ctx.lineTo(x + 314, y + 133); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 326, y + 133); ctx.lineTo(x + 332, y + 118); ctx.lineTo(x + 336, y + 134); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#26130b';
    ctx.beginPath(); ctx.arc(x + 312, y + 148, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 328, y + 148, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#26130b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + 320, y + 156, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = '#eceff1';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(x + 296, y + 176 - i * 5, 52, 4);
    }
    for (let i = 0; i < 13; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#c62828' : '#fff6ee';
      ctx.fillRect(x + i * 30, y + 190, 30, 70);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y + 60, 380, 200);

    ctx.beginPath(); ctx.ellipse(x + 386, y + 76, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8c2d00'; ctx.lineWidth = 2; ctx.stroke();
  }

  drawKakigoriStall(ctx, x, y) {

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x + 126, y + 64);
    ctx.quadraticCurveTo(x + 158, y + 22, x + 190, y + 64);

    ctx.fillStyle = '#ff7043';

    ctx.beginPath(); ctx.moveTo(x + 62, y + 80); ctx.lineTo(x + 70, y + 74); ctx.lineTo(x + 70, y + 86); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + 51, y + 78, 1.8, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 9; i++) {

    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';

  }

  // 2Pオーバーレイ: 左下に色反転どんちゃん+スコア、右下に下向き魂ゲージ
  drawP2Overlay(ctx) {
    // 左下: 赤⇔水色を反転したキャラ(hue-rotate)
    const img = this.charFrame(this.gogoActive ? 'gogo' : 'char');
    if (img && img.width) {
      ctx.save();
      try { ctx.filter = 'hue-rotate(180deg) saturate(1.3)'; } catch (e) {}
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(150 / iw, 95 / ih);
      ctx.drawImage(img, 88 - iw * sc / 2, 548 - ih * sc / 2, iw * sc, ih * sc);
      ctx.restore();
      try { ctx.filter = 'none'; } catch (e) {}
    }
    // P2スコア/コンボ(左下)
    ctx.textAlign = 'left';
    ctx.font = 'bold 26px Yu Gothic, Meiryo, sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#000';
    ctx.strokeText(`2P ${this.p2.score}`, 20, 444);
    ctx.fillStyle = '#4fc3f7';
    this.outlineText(ctx, `2P ${this.p2.score}`, 20, 444);
    if (this.p2.combo >= 5) {
      ctx.font = 'bold 20px Yu Gothic, Meiryo, sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeText(`${this.p2.combo} combo`, 20, 472);
      this.outlineText(ctx, `${this.p2.combo} combo`, 20, 472);
    }
    // 右下: 下向き魂ゲージ(右から左へ溜まる)
    const g2x = 780, g2w = 420, g2y = 594, g2h = 16;
    ctx.fillStyle = '#2a0d05';
    ctx.fillRect(g2x, g2y, g2w, g2h);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(g2x, g2y, g2w, g2h);
    // クリアゾーン(左側20%)
    ctx.fillStyle = 'rgba(79, 195, 247, 0.25)';
    ctx.fillRect(g2x, g2y - 3, g2w * 0.2, g2h + 6);
    ctx.strokeStyle = 'rgba(79, 195, 247, 0.8)'; ctx.lineWidth = 2;
    ctx.strokeRect(g2x, g2y - 3, g2w * 0.2, g2h + 6);
    // ゲージfill(右端から)
    const v2 = Math.max(0, Math.min(1, this.soul2 || 0));
    if (v2 > 0.001) {
      const w2 = (g2w - 4) * v2;
      const gg = ctx.createLinearGradient(g2x + g2w, 0, g2x, 0);
      gg.addColorStop(0, '#4fc3f7');
      gg.addColorStop(1, '#0288d1');
      ctx.fillStyle = gg;
      ctx.fillRect(g2x + g2w - 2 - w2, g2y + 2, w2, g2h - 4);
    }
    // 炎アイコン(右側)
    const soulArr = this.assets.soul;
    if (soulArr && soulArr.length) {
      const sImg = soulArr[Math.floor(this.animTime * 10) % soulArr.length];
      if (sImg && sImg.complete && sImg.naturalWidth) {
        ctx.save();
        try { ctx.filter = 'hue-rotate(180deg)'; } catch (e) {}
        ctx.drawImage(sImg, g2x + g2w + 8, g2y - 14, 40, 41);
        ctx.restore();
        try { ctx.filter = 'none'; } catch (e) {}
      }
    }
    ctx.font = 'bold 28px Yu Gothic, Meiryo, sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#000';
    ctx.textAlign = 'right';
    ctx.strokeText('魂', W - 18, 616);
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, '魂', W - 18, 616);
    ctx.textAlign = 'left';
  }

  drawBpmOverlay(ctx) {
    const course = this.songs[this.selectedSong] ? this.songs[this.selectedSong].courses[this.selectedDiff] : null;
    if (!course) return;
    const bpm = parseFloat(course.headers.BPM) || 120;
    const hs = this.hs.toFixed(3);
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(`BPM: ${bpm.toFixed(3)}`, 16, 592);
    ctx.strokeText(`HS: ${hs}`, 16, 614);
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, `BPM: ${bpm.toFixed(3)}`, 16, 592);
    this.outlineText(ctx, `HS: ${hs}`, 16, 614);
  }

  drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (i * Math.PI / spikes) - Math.PI / 2;
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // 【フチなし描画】外枠は不要(fillTextのみ)
  outlineText(ctx, text, x, y) {
    ctx.fillText(text, x, y);
  }

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

      { label: '🎵 曲の拠り所', action: 'site' },

  // 曲リストレイアウト(ジャンルごとにグルーピングした描画用レイアウト)
  buildSongListLayout() {
    const groups = [];
    const map = new Map();
    const q = (this.searchQuery || '').trim().toLowerCase();
    // 先頭に「システム」グループを確保し、ランダム選曲(index=-1)を一番上に置く
    if (!q) {
      const sysGrp = { genre: 'システム', items: [-1] };
      map.set('システム', sysGrp);
      groups.push(sysGrp);
    }
    for (let i = 0; i < this.songs.length; i++) {
      // 検索フィルタ(曲名/TITLE/TITLEJA/ジャンル)
      if (q) {
        const c0 = this.songs[i].courses[0] || { headers: {} };
        const hay = [this.songs[i].name, c0.headers.TITLE, c0.headers.TITLEJA, this.songs[i].genre, c0.headers.GENRE]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) continue;
      }
      // フォルダ構造(親/カテゴリ/曲)のカテゴリ名を最優先。無ければTJAのGENRE
      const genre = this.songs[i].category
                 || this.songs[i].genre
                 || (this.songs[i].courses[0] && this.songs[i].courses[0].headers.GENRE)
                 || 'その他';
      if (!map.has(genre)) {
        const grp = { genre, items: [] };
        map.set(genre, grp);
        groups.push(grp);
      }
      map.get(genre).items.push(i);
    }
    const layout = [];
    let y = 170;
    for (const grp of groups) {
      layout.push({ type: 'header', genre: grp.genre, y });
      y += 46;
      for (const i of grp.items) {
        layout.push({ type: 'song', index: i, y });
        y += 76;
      }
    }
    this._listTotalH = Math.max(0, y - 170);
    return layout;
  }

  // メダルショップ未解禁チェック(songs.json の曲で未購入のものは 🔒・選択不可)
  // 【例外】フォルダ読込(zip 経由ではない)で既に所持している同名曲はロックしない。
  // 手元に音源・譜面があるのに未購入扱いで選べなくなるのを防ぐため。
  isSongLocked(song) {
    if (!shop.songs || !Array.isArray(shop.songs)) return false;
    const locked = shop.songs.filter(s => !shop.isSongUnlocked(s));
    if (!locked.length) return false;
    const lockedNames = [];
    for (const s of locked) {
      lockedNames.push(String(s.title));
      if (s.id) lockedNames.push(String(s.id).replace(/\.zip$/i, '')); // zipファイル名(id)でも照合
    }
    const songNames = (s) => {
      const c0 = (s.courses && s.courses[0]) || { headers: {} };
      return [s.name, c0.headers.TITLE, c0.headers.TITLEJA].filter(Boolean).map(String);
    };
    // フォルダ読込曲(zipPath なし)がロック対象と同名なら「既に所持」→ ロックしない
    const ownedLocally = this.songs.some(s => !s.zipPath && songNames(s).some(n => lockedNames.includes(n)));
    if (ownedLocally) return false;
    return songNames(song).some(n => lockedNames.includes(n));
  }

  // ==================== 曲選択 ====================
  drawSongSelect() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8e1212'); g.addColorStop(1, '#3a0909');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    this.drawLanternString(ctx, 90, 0, this.animTime);
    ctx.fillStyle = '#fff8e1';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, '🎵 曲選択', W/2, 130);

    const layout = this.buildSongListLayout();
    const diffColors = { Easy: '#ffb300', Normal: '#fb8c00', Hard: '#f4511e', Oni: '#c2185b', Edit: '#8e24aa' };
    for (const row of layout) {
      const y = row.y - this.scrollOffset;
      if (row.type === 'header') {
        if (y < -50 || y > H) continue;
        // ジャンルヘッダー
        ctx.fillStyle = 'rgba(255, 202, 40, 0.16)';
        this.roundRect(ctx, 90, y, W - 180, 38, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 202, 40, 0.55)';
        ctx.lineWidth = 2;
        this.roundRect(ctx, 90, y, W - 180, 38, 8); ctx.stroke();
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        this.outlineText(ctx, '♪ ' + row.genre, 112, y + 27);
        continue;
      }
      const i = row.index;
      if (i === -1) {
        // ランダム選曲行(システムジャンルの先頭)
        if (y < -76 || y > H) continue;
        const selected = this.selectedSong === -1;
        ctx.fillStyle = selected ? 'rgba(255,179,0,0.5)' : '#fff8e1';
        this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.fill();
        ctx.strokeStyle = selected ? '#ffe082' : 'rgba(255,255,255,0.25)';
        ctx.lineWidth = selected ? 4 : 2;
        this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.stroke();
        ctx.fillStyle = '#b71c1c';
        ctx.font = 'bold 26px Yu Gothic, Meiryo, sans-serif';
        ctx.textAlign = 'center';
        this.outlineText(ctx, '🎲 ランダムに選曲', W / 2, y + 42);
        continue;
      }
      if (y < -76 || y > H) continue;
      const selected = i === this.selectedSong;
      // クリック時: 行が一瞬縮むアニメーション(クリック後150msで画面遷移する間だけ)
      let press = 1;
      if (this._songClickIdx === i && this._songClickAt !== undefined) {
        const pdt = this.animTime - this._songClickAt;
        if (pdt < 0.3) press = 1 - 0.06 * Math.sin(Math.min(1, pdt / 0.15) * Math.PI);
      }
      ctx.save();
      ctx.translate(W / 2, y + 32);
      ctx.scale(press, press);
      ctx.translate(-W / 2, -(y + 32));
      ctx.fillStyle = selected ? 'rgba(255,179,0,0.5)' : '#fff8e1';
      this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.fill();
      ctx.strokeStyle = selected ? '#ffe082' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = selected ? 4 : 2;
      this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.stroke();
      ctx.fillStyle = '#4e2c1e';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'left';
      const locked = this.isSongLocked(this.songs[i]);
      if (locked) {
        // 未解禁: グレーで塗り潰し+🔒マーク(選択不可)
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#707070';
        this.roundRect(ctx, 90, y, W - 180, 64, 10); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#4e2c1e';
      }
      const dispName = (this.songs[i].courses[0] && (this.songs[i].courses[0].headers.TITLEJA || this.songs[i].courses[0].headers.TITLE)) || this.songs[i].name;
      this.outlineText(ctx, (locked ? '\u{1F512} ' : '') + dispName, 120, y + 42);
      const courses = this.songs[i].courses;
      // 難易度徽章(右寄せ・画像+レベル数値・末尾の数値まで含めて画面内にクランプ)
      const dnList = courses.map(c => c.headers.COURSE || 'Oni');
      const itemW = 76;
      const lvLast = String(courses[courses.length - 1].headers.LEVEL || '?');
      // 曲行の右端(W-90)の内側に、最後の数値まで含めて収める
      const bxLast = (W - 90) - 16 - 20 - lvLast.length * 10;
      let bx = bxLast - (dnList.length - 1) * itemW;
      if (bx < 380) bx = 380; // 曲名との最低限の余白
      for (let j = 0; j < dnList.length; j++) {
        const dn = dnList[j];
        const key = dn.charAt(0).toUpperCase() + dn.slice(1).toLowerCase();
        const badge = this.courseBadges && this.courseBadges[key];
        const lv = courses[j].headers.LEVEL || '?';
        if (badge && badge.complete && badge.naturalWidth) {
          const bw = 32, bh = 32 * badge.naturalHeight / badge.naturalWidth;
          ctx.drawImage(badge, bx - bw / 2, y + 32 - bh / 2, bw, bh);
        } else {
          ctx.fillStyle = diffColors[dn] || '#888';
          ctx.beginPath(); ctx.arc(bx, y + 32, 14, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.fillStyle = '#4e2c1e';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'left';
        this.outlineText(ctx, String(lv), bx + 20, y + 38);
        bx += itemW;
      }
      ctx.restore();
    }
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, '↑↓ で選択 / Enter で決定 / Esc で戻る / 曲数: ' + this.songs.length, W/2, H - 18);
  }

  _optionItems() {
    const randNames = { off: 'なし', kimagure: 'きまぐれ', detarame: 'でたらめ' };
    return [
      { label: 'AUTO', val: this.autoPlay ? 'ON' : 'OFF', act: 'auto' },
      { label: 'プレイ人数', val: this.players + 'P', act: 'players' },
      { label: 'ハイスピード', val: '◀ ' + this.hs.toFixed(1) + ' ▶', act: 'hs' },
      { label: 'ランダム', val: randNames[this.randMode[0]], act: 'rand' },
      { label: 'あべこべ', val: this.abe[0] ? 'ON' : 'OFF', act: 'abe' },
      { label: '見た目BPM', val: this.visBPM > 0 ? String(this.visBPM) : 'OFF', act: 'vis' },
      { label: 'ドンカツ区別', val: this.noDist[0] ? 'なし' : 'あり', act: 'nodist' },
    ];
  }

  _applyOption(act, dir) {
    if (act === 'auto') this.autoPlay = !this.autoPlay;
    else if (act === 'players') this.players = this.players === 1 ? 2 : 1; // 1P⇔2P切替
    else if (act === 'hs') this.hs = Math.max(0.5, Math.min(4.0, Math.round((this.hs + dir * 0.5) * 10) / 10));
    else if (act === 'rand') this.randMode[0] = this.randMode[0] === 'off' ? 'kimagure' : this.randMode[0] === 'kimagure' ? 'detarame' : 'off';
    else if (act === 'abe') this.abe[0] = !this.abe[0];
    else if (act === 'vis') this.visBPM = this.visBPM >= 400 ? 0 : this.visBPM === 0 ? 100 : this.visBPM + 10;
    else if (act === 'nodist') this.noDist[0] = !this.noDist[0];
  }

  // 画面下からなめらかにスライドインする演奏オプションパネル(縦リスト)
  drawOptionPanel(ctx) {
    const target = this.optPanelOpen ? 1 : 0;
    this._optPanelEase += (target - this._optPanelEase) * 0.18;
    if (Math.abs(this._optPanelEase - target) < 0.005) this._optPanelEase = target;
    if (this._optPanelEase < 0.01 && !this.optPanelOpen) return;
    const panelH = 300;
    const py = H - (panelH - 10) * this._optPanelEase - 10 * (1 - this._optPanelEase);
    ctx.save();
    ctx.fillStyle = 'rgba(30,8,8,0.95)';
    this.roundRect(ctx, 160, py, W - 320, panelH - 20, 14); ctx.fill();
    ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 3;
    this.roundRect(ctx, 160, py, W - 320, panelH - 20, 14); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = 'bold 20px Yu Gothic, Meiryo, sans-serif';
    ctx.fillStyle = '#ffca28';
    this.outlineText(ctx, '⚙ 演奏オプション', 190, py + 34);
    const items = this._optionItems();
    for (let i = 0; i < items.length; i++) {
      const iy = py + 72 + i * 34;
      ctx.font = 'bold 17px Yu Gothic, Meiryo, sans-serif';
      ctx.fillStyle = '#fff';
      this.outlineText(ctx, items[i].label, 200, iy);
      ctx.fillStyle = '#fff8e1';
      this.roundRect(ctx, 460, iy - 23, 260, 28, 8); ctx.fill();
      ctx.strokeStyle = '#c62828'; ctx.lineWidth = 2;
      this.roundRect(ctx, 460, iy - 23, 260, 28, 8); ctx.stroke();
      ctx.fillStyle = '#b71c1c';
      ctx.textAlign = 'center';
      this.outlineText(ctx, items[i].val, 590, iy - 2);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  // ==================== 難易度選択 ====================
  drawDifficulty() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8e1212'); g.addColorStop(1, '#3a0909');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const song = this.songs[this.selectedSong];
    const dispTitle = (song.courses[0] && (song.courses[0].headers.TITLEJA || song.courses[0].headers.TITLE)) || song.name;
    ctx.fillStyle = '#fff8e1';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, dispTitle, W/2, 90);
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '18px sans-serif';
    this.outlineText(ctx, '難易度を選択してください', W/2, 122);

    const courses = song.courses;
    const diffColors = { Easy: '#ffb300', Normal: '#fb8c00', Hard: '#f4511e', Oni: '#c2185b', Edit: '#8e24aa' };
    const diffLabels = { Easy: 'かんたん', Normal: 'ふつう', Hard: 'むずかしい', Oni: 'おに', Edit: 'えでぃっと' };
    const cardW = 170, cardH = 210, gap = 20;
    const totalWidth = courses.length * cardW + (courses.length - 1) * gap;
    const startX = W/2 - totalWidth/2 - this.diffScrollX;
    const maxScroll = Math.max(0, totalWidth - W + 100);
    this.diffScrollX = Math.max(0, Math.min(this.diffScrollX, maxScroll));

    for (let i = 0; i < courses.length; i++) {
      const x = startX + i * (cardW + gap);
      if (x + cardW < 0 || x > W) continue;
      const selected = i === this.selectedDiff;
      const dn = courses[i].headers.COURSE || 'Oni';
      const color = diffColors[dn] || '#fff';
      ctx.fillStyle = selected ? color : '#fff8e1';
      ctx.globalAlpha = selected ? 0.35 : 1;
      this.roundRect(ctx, x, 170, cardW, cardH, 12); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = selected ? color : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = selected ? 5 : 2;
      this.roundRect(ctx, x, 170, cardW, cardH, 12); ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      this.outlineText(ctx, diffLabels[dn] || dn, x + cardW/2, 225);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 52px sans-serif';
      this.outlineText(ctx, '★' + (courses[i].headers.LEVEL || '?'), x + cardW/2, 300);
      const noteCount = courses[i].measures.reduce((s, m) => s + (m.events ? m.events.filter(e => e.t === 'note' && e.v !== '0').length : 0), 0);
      ctx.fillStyle = '#ffcc9e';
      ctx.font = '15px sans-serif';
      this.outlineText(ctx, `ノーツ数: ${noteCount}`, x + cardW/2, 350);
    }
    ctx.fillStyle = '#ffe0b2';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, '←→ で難易度選択 / Enter で開始 / Esc で戻る', W/2, H - 14);
    // 演奏オプション縦リストパネル(下からスライドイン)
    this.drawOptionPanel(ctx);
    // 演奏オプションパネル開閉ボタン(左下・パネルの上に描画)
    ctx.fillStyle = '#fff8e1';
    this.roundRect(ctx, 16, 552, 156, 44, 10); ctx.fill();
    ctx.strokeStyle = this.optPanelOpen ? '#ff6f00' : '#c62828'; ctx.lineWidth = 3;
    this.roundRect(ctx, 16, 552, 156, 44, 10); ctx.stroke();
    ctx.fillStyle = '#b71c1c';
    ctx.font = 'bold 16px Yu Gothic, Meiryo, sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, '⚙ 演奏オプション', 94, 580);
  }

  // ==================== リザルト(太鼓の達人風・赤和柄背景) ====================
  drawResult() {
    const ctx = this.ctx;
    if (this.resultAt === undefined) this.resultAt = this.animTime;
    const rt = this.animTime - this.resultAt;
    const countUp = (v) => Math.floor(v * Math.min(1, rt / 0.5));

    // ---- 背景: 赤グラデ + 麻の葉模様 ----
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#d32f2f');
    bgGrad.addColorStop(0.5, '#b71c1c');
    bgGrad.addColorStop(1, '#8e1212');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    this._drawHempPattern(ctx);

    // ---- 上部帯: 成績発表 + 曲名 ----
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, 64);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 62, W, 3);
    ctx.textAlign = 'left';
    ctx.font = 'bold 40px Yu Gothic, Meiryo, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('成績発表', 24, 46);
    const rsong = this.songs[this.selectedSong];
    const rtitle = rsong ? ((rsong.courses[0] && (rsong.courses[0].headers.TITLEJA || rsong.courses[0].headers.TITLE)) || rsong.name) : '';
    ctx.textAlign = 'right';
    ctx.font = 'bold 24px Yu Gothic, Meiryo, sans-serif';
    ctx.fillStyle = '#ffcc80';
    ctx.fillText(rtitle, W - 24, 44);

    if (this.players === 2) {
      // 【2P: 画面を上下に2分割】1P=上半分(赤テーマ) / 2P=下半分(青テーマ)
      const halfH = (H - 64) / 2;
      this._drawResultPlayer(ctx, 64, halfH, this, 1, countUp);
      this._drawResultPlayer(ctx, 64 + halfH, halfH, this.p2, 2, countUp);
    } else {
      this._drawResultPlayer(ctx, 64, H - 64, this, 1, countUp);
      this._drawResultParade(ctx);
    }

    // ---- フッター ----
    const blink2 = 0.55 + 0.45 * Math.sin(this.animTime * Math.PI * 2 + 1.2);
    ctx.save();
    ctx.globalAlpha = blink2;
    ctx.fillStyle = '#ffcc9e';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Enter またはクリックでタイトルへ', W / 2, H - 12);
    ctx.restore();
  }

  // 【リザルト: プレイヤーごとの成績ブロック】
  // st = スコア/コンボ/判定の状態オブジェクト(1Pはthis・2Pはthis.p2)。
  // 2Pは青色テーマ。どんちゃんの見た目は赤⇔水色を反転(hue-rotate 180°)させる。
  _drawResultPlayer(ctx, y0, h, st, player, countUp) {
    const isP2 = player === 2;
    const theme = isP2 ? {
      band: 'rgba(13, 60, 97, 0.55)', bandEdge: '#4fc3f7',
      plate: '#0288d1', plateEdge: '#01467a', nameEdge: '#0288d1',
      accent: '#4fc3f7', gauge0: '#4fc3f7', gauge1: '#0288d1'
    } : {
      band: 'rgba(80, 10, 10, 0.55)', bandEdge: '#ffd54f',
      plate: '#ff6d00', plateEdge: '#7f2600', nameEdge: '#c62828',
      accent: '#ffd54f', gauge0: '#ffca28', gauge1: '#ff6f00'
    };
    const mid = y0 + h / 2;

    // ---- 区画背景: 2Pは下半分を青系に染める ----
    ctx.fillStyle = theme.band;
    ctx.fillRect(0, y0, W, h);
    ctx.fillStyle = theme.bandEdge;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, y0, W, 3);
    ctx.globalAlpha = 1;

    // ---- どんちゃん(1P=通常色 / 2P=赤⇔水色を反転) ----
    const img = this.charFrame('char');
    if (img && img.width) {
      ctx.save();
      if (isP2) { try { ctx.filter = 'hue-rotate(180deg) saturate(1.3)'; } catch (e) {} }
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const sc = Math.min(140 / iw, (h - 60) / ih);
      const bounce = Math.sin(this.animTime * 3 + (isP2 ? 1.5 : 0)) * 5;
      ctx.drawImage(img, 72 - iw * sc / 2, mid + 6 + bounce - ih * sc / 2, iw * sc, ih * sc);
      ctx.restore();
      try { ctx.filter = 'none'; } catch (e) {}
    }

    // ---- ネームプレート ----
    const npX = 140;
    ctx.fillStyle = theme.plate;
    this.roundRect(ctx, npX, y0 + 14, 64, 38, 9); ctx.fill();
    ctx.strokeStyle = theme.plateEdge; ctx.lineWidth = 3;
    this.roundRect(ctx, npX, y0 + 14, 64, 38, 9); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    this.outlineText(ctx, player + 'P', npX + 32, y0 + 41);
    ctx.fillStyle = '#fffdf5';
    this.roundRect(ctx, npX + 72, y0 + 14, 210, 38, 9); ctx.fill();
    ctx.strokeStyle = theme.nameEdge; ctx.lineWidth = 3;
    this.roundRect(ctx, npX + 72, y0 + 14, 210, 38, 9); ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'left';
    this.outlineText(ctx, this.playerName, npX + 88, y0 + 40);
    // 称号(ネームプレートの下)
    ctx.fillStyle = theme.accent;
    ctx.font = 'bold 13px Yu Gothic, Meiryo, sans-serif';
    this.outlineText(ctx, '🎖 ' + profileMgr.titleName(), npX + 90, y0 + 68);

    // ---- スコア(中央・黒パネルに白文字) ----
    const scW = 300, scH = 60, scX = (W - scW) / 2, scY = mid - 42;
    ctx.fillStyle = '#1a1a1a';
    this.roundRect(ctx, scX, scY, scW, scH, 12); ctx.fill();
    ctx.strokeStyle = theme.accent; ctx.lineWidth = 4;
    this.roundRect(ctx, scX, scY, scW, scH, 12); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, String(countUp(st.score)).padStart(6, '0') + '点', W / 2, scY + 43);

    // ---- RANK ----
    const total = st.perfect + st.good + st.miss;
    const accuracy = total > 0 ? Math.round((st.perfect * 100 + st.good * 50) / total) : 0;
    let rank = 'C';
    if (accuracy >= 95) rank = 'SSS'; else if (accuracy >= 90) rank = 'SS';
    else if (accuracy >= 80) rank = 'S'; else if (accuracy >= 70) rank = 'A';
    else if (accuracy >= 60) rank = 'B';
    ctx.font = 'bold 40px Yu Gothic, Meiryo, sans-serif';
    ctx.fillStyle = theme.accent;
    this.outlineText(ctx, 'RANK ' + rank, W / 2, scY + scH + 44);

    // ---- NEW RECORD!(1Pのみ) ----
    if (!isP2 && this.newRecord) {
      const blink = 0.55 + 0.45 * Math.sin(this.animTime * Math.PI * 2);
      ctx.save();
      ctx.globalAlpha = blink;
      ctx.fillStyle = '#ff8f00';
      ctx.font = 'bold 24px Yu Gothic, Meiryo, sans-serif';
      this.outlineText(ctx, 'NEW RECORD!', W / 2, scY + scH + 74);
      ctx.restore();
    }

    // ---- 獲得コイン(共有財布・1P側に表示。0.5秒カウントアップ) ----
    if (!isP2 && this.coinEarned) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 22px Yu Gothic, Meiryo, sans-serif';
      this.outlineText(ctx, '\u{1FA99} +' + countUp(this.coinEarned) + ' \u679a\u30B2\u30C3\u30C8\uFF01 (\u6240\u6301 ' + coinMgr.coins + ' \u679A)', W / 2, scY - 14);
    }
    // ---- 獲得XP・レベルアップ・新称号(1Pのみ) ----
    if (!isP2 && this.xpGained) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#a5d6a7';
      ctx.font = 'bold 18px Yu Gothic, Meiryo, sans-serif';
      this.outlineText(ctx, '✨ 経験値 +' + countUp(this.xpGained) + '　Lv.' + profileMgr.level(), W / 2, scY - 40);
      if (this.levelUpLv) {
        const bl = 0.6 + 0.4 * Math.sin(this.animTime * 6);
        ctx.save(); ctx.globalAlpha = bl;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 22px Yu Gothic, Meiryo, sans-serif';
        this.outlineText(ctx, '⤴ LEVEL UP! Lv.' + this.levelUpLv, W / 2, scY - 66);
        ctx.restore();
      }
      if (this.newTitles && this.newTitles.length) {
        ctx.fillStyle = '#ffecb3';
        ctx.font = 'bold 16px Yu Gothic, Meiryo, sans-serif';
        this.newTitles.forEach((t, i) => {
          this.outlineText(ctx, '🎖 新しい称号「' + t.name + '」', W / 2, scY + scH + 100 + i * 22);
        });
      }
    }

    // ---- 右側: 判定結果(良/可/不可) ----
    const rightX = W - 300;
    const rowH = Math.min(44, (h - 130) / 3);
    const rightY = mid - (rowH * 3 + 44) / 2;
    const results = [
      { label: '良', val: countUp(st.perfect), color: '#ffd700', bg: '#4e3400' },
      { label: '可', val: countUp(st.good), color: '#b0bec5', bg: '#263238' },
      { label: '不可', val: countUp(st.miss), color: '#7e57c2', bg: '#311b92' },
    ];
    for (let i = 0; i < 3; i++) {
      const ry = rightY + i * rowH;
      const r = results[i];
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.arc(rightX + 22, ry + rowH / 2 - 5, 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = r.bg;
      ctx.font = 'bold 14px Yu Gothic, Meiryo, sans-serif';
      ctx.textAlign = 'center';
      this.outlineText(ctx, r.label, rightX + 22, ry + rowH / 2);
      ctx.textAlign = 'right';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.fillStyle = '#fff';
      this.outlineText(ctx, String(r.val), rightX + 250, ry + rowH / 2 + 4);
    }
    // 最大コンボ・連打数(プレイヤー別のhits配列から集計)
    const infoY = rightY + 3 * rowH + 16;
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px Yu Gothic, Meiryo, sans-serif';
    ctx.fillStyle = theme.accent;
    this.outlineText(ctx, '最大コンボ数', rightX - 10, infoY);
    this.outlineText(ctx, '連打数', rightX - 10, infoY + 24);
    ctx.textAlign = 'right';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, String(countUp(st.maxCombo)), rightX + 250, infoY);
    const rollTotal = this.rolls.reduce((s, r) => s + r.hits[player - 1], 0);
    this.outlineText(ctx, String(countUp(rollTotal)), rightX + 250, infoY + 24);

    // ---- 魂ゲージ(区画の下部・プレイヤー別の値) ----
    const soulV = Math.max(0, Math.min(1, isP2 ? (this.soul2 || 0) : this.soul));
    const gx = 200, gw2 = W - 400, gy = y0 + h - 34, gh = 16;
    ctx.fillStyle = '#2a0d05';
    ctx.fillRect(gx, gy, gw2, gh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(gx, gy, gw2, gh);
    // クリア圏(1Pは右端20% / 2Pは左端20%)
    const clearX = isP2 ? gx : gx + gw2 * 0.8;
    ctx.fillStyle = 'rgba(255,202,40,0.25)';
    ctx.fillRect(clearX, gy - 2, gw2 * 0.2, gh + 4);
    const fw2 = (gw2 - 4) * soulV;
    if (fw2 > 0.001) {
      const fg = ctx.createLinearGradient(gx, 0, gx + gw2, 0);
      fg.addColorStop(0, theme.gauge0);
      fg.addColorStop(1, theme.gauge1);
      ctx.fillStyle = fg;
      if (isP2) ctx.fillRect(gx + gw2 - 2 - fw2, gy + 2, fw2, gh - 4); // 2Pは右端から
      else ctx.fillRect(gx + 2, gy + 2, fw2, gh - 4);
    }
    ctx.font = 'bold 14px Yu Gothic, Meiryo, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    this.outlineText(ctx, '魂', gx - 26, gy + 14);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffca28';
    this.outlineText(ctx, 'クリア', clearX + gw2 * 0.1, gy - 5);
  }

  // ---- 麻の葉模様 ----
  _drawHempPattern(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    const s = 48;
    for (let row = -1; row < H / s + 2; row++) {
      for (let col = -1; col < W / s + 2; col++) {
        const cx = col * s + (row % 2) * (s / 2);
        const cy = row * s * 0.866;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3 - Math.PI / 2;
          const px = cx + Math.cos(a) * (s * 0.5);
          const py = cy + Math.sin(a) * (s * 0.5);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        // 中心の小六角形
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3 - Math.PI / 2;
          const px = cx + Math.cos(a) * (s * 0.18);
          const py = cy + Math.sin(a) * (s * 0.18);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---- 魂ゲージ(リザルト用・上部横長) ----
  _drawResultSoulGauge(ctx) {
    const gx = 320, gw = 640, gy = 92, gh = 22;
    const clearX = gx + gw * 0.8, clearW = gw * 0.2; // クリア圏(右端20%)
    const v = Math.max(0, Math.min(1, this.soul));

    // ベース全体: 暗い赤のフラットなゲージ
    ctx.fillStyle = '#2a0d05';
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeRect(gx, gy, gw, gh);

    // クリア圏(80〜100%): 背景=暗い黄色(フラット)
    ctx.fillStyle = '#4a3d00';
    ctx.fillRect(clearX, gy, clearW, gh);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 2;
    ctx.strokeRect(clearX, gy, clearW, gh);

    // フィル(通常部: オレンジ)
    const innerNormal = gw * 0.8 - 4;
    const fw = (gw - 4) * v;
    if (fw > 0.001) {
      const fg = ctx.createLinearGradient(gx, 0, clearX, 0);
      fg.addColorStop(0, '#ffca28');
      fg.addColorStop(1, '#ff6f00');
      ctx.fillStyle = fg;
      ctx.fillRect(gx + 2, gy + 2, Math.min(fw, innerNormal), gh - 4);
    }
    // フィル(クリア圏: 黄色 ※100%時は虹色)
    const fwClear = fw - innerNormal;
    if (fwClear > 0.001) {
      if (v >= 0.999) {
        const rg = ctx.createLinearGradient(clearX, 0, clearX + clearW, 0);
        for (let i = 0; i <= 20; i++) {
          const h = this.rainbowStyle === 0 ? i * 18 : 360 - i * 18;
          rg.addColorStop(i / 20, `hsl(${h}, 92%, 55%)`);
        }
        ctx.fillStyle = rg;
      } else {
        const fg2 = ctx.createLinearGradient(clearX, 0, clearX + clearW, 0);
        fg2.addColorStop(0, '#ffeb3b');
        fg2.addColorStop(1, '#fbc02d');
        ctx.fillStyle = fg2;
      }
      ctx.fillRect(clearX + 2, gy + 2, Math.min(fwClear, clearW - 4), gh - 4);
    }

    // ラベル
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffca28';
    ctx.fillText('クリア', clearX + clearW / 2, gy - 6);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Yu Gothic, Meiryo, sans-serif';
    ctx.fillText('魂', gx + gw + 24, gy + 17);
  }

  // ---- 王冠ランクアイコン(簡易) ----
  _drawCrownRank(ctx, cx, cy, countUp) {
    // 王冠
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(-28, 10);
    ctx.lineTo(-20, -18);
    ctx.lineTo(-8, -6);
    ctx.lineTo(0, -22);
    ctx.lineTo(8, -6);
    ctx.lineTo(20, -18);
    ctx.lineTo(28, 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
    // 宝石
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(0, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-2, -6, 2, 0, Math.PI * 2); ctx.fill();
    // ランク文字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Yu Gothic, Meiryo, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('おに', 0, 28);
    ctx.restore();
  }

  // ---- 下部キャラクターパレード(簡易) ----
  _drawResultParade(ctx) {
    const baseY = H - 90;
    const chars = 8;
    const spacing = W / (chars + 1);
    for (let i = 0; i < chars; i++) {
      const x = spacing * (i + 1);
      const bounce = Math.sin(this.animTime * 3 + i * 0.8) * 6;
      const y = baseY + bounce;
      // 簡易ドンちゃん
      const bodyColor = i % 2 === 0 ? '#e53935' : '#1e88e5';
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x, y + 2, 18, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(x - 7, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 7, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x - 3, y + 8, 3, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 3, y + 8, 3, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
    // 下部花飾り
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for (let i = 0; i < 20; i++) {
      const fx = (i * 67 + 20) % W;
      const fy = H - 20 + Math.sin(i * 3) * 8;
      ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ==================== 入力 ====================
  input(isDon, side = 'left', player = 1) {
    if (!this.isPlaying) return;
    const st = player === 2 ? this.p2 : this; // スコア/コンボ/判定の対象
    // ミニ太鼓のハイライト用(左右×don/ka・プレイヤー別。2Pは反転色)
    if (player === 1) {
      if (isDon) {
        if (side === 'left') this.lastLeftDonAt = this.animTime; else this.lastRightDonAt = this.animTime;
      } else {
        if (side === 'left') this.lastLeftKaAt = this.animTime; else this.lastRightKaAt = this.animTime;
      }
    } else {
      if (isDon) {
        if (side === 'left') this.lastLeftDonAt2 = this.animTime; else this.lastRightDonAt2 = this.animTime;
      } else {
        if (side === 'left') this.lastLeftKaAt2 = this.animTime; else this.lastRightKaAt2 = this.animTime;
      }
    }
    const musicTime = this.gameClock();
    const judgeWindow = 0.15;

    let target = null;
    let minDiff = Infinity;
    const pi = player - 1;
    if (this.abe[pi] && !this._autoNoType) isDon = !isDon; // あべこべ: ドン⇔カツ入替
    const noDist = this.noDist[pi] || !!this._autoNoType;   // ドンカツ区別なし(オートは常に不問)
    for (let note of this.notes) {
      if (player === 1 ? note.hp1 : note.hp2) continue;
      const et = player === 1 ? (note.rt1 || note.type) : (note.rt2 || note.type); // ランダム見かけ
      const isNoteDon = (et === 1 || et === 3);
      const isNoteKa = (et === 2 || et === 4);
      if (!noDist && ((isDon && !isNoteDon) || (!isDon && !isNoteKa))) continue;
      const diff = Math.abs(note.time - musicTime);
      if (diff < judgeWindow && diff < minDiff) {
        minDiff = diff;
        target = note;
      }
    }
    if (target) {
      target['hp' + player] = true;
      // 連打中の音符を優先: 音符を叩いた瞬間に「自分の」連打は終了する(相手には影響しない)
      for (const roll of this.rolls) {
        if (!roll.resolved[pi] && musicTime >= roll.startTime - 0.1 && musicTime <= roll.endTime + 0.2) roll.resolved[pi] = true;
      }
      if (player === 1) this.charHitT = 0.25;
      if (minDiff < 0.05) {
        st.perfect++;
        st.combo++;
        if (st.combo % 10 === 0) this.comboFlashAt = this.animTime;
        if (COMBO_VOICE_THRESHOLDS.includes(st.combo)) this.audio.playComboVoice(st.combo);
        st.score = Math.min(999999, st.score + Math.round(this.pointPerfect + st.combo * this.comboK));
        this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(player), type: 'perfect', time: musicTime, life: 1.3 });
        this.spawnSoulParticle(player); // 魂が放物線で「自分の」ゲージへ飛ぶ
      } else {
        st.good++;
        st.combo++;
        if (st.combo % 10 === 0) this.comboFlashAt = this.animTime;
        if (COMBO_VOICE_THRESHOLDS.includes(st.combo)) this.audio.playComboVoice(st.combo);
        st.score = Math.min(999999, st.score + Math.round(this.pointGood + st.combo * this.comboK * 0.5));
        this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(player), type: 'good', time: musicTime, life: 1.3 });
        this.spawnSoulParticle(player); // 魂が放物線で「自分の」ゲージへ飛ぶ
      }
      if (st.combo > st.maxCombo) st.maxCombo = st.combo;
      this.audio.playSE(isDon ? 'don' : 'ka');
      return;
    }

    // 連打: 「自分の」回数カウントを増やすだけの軽量処理(1P/2Pで別々に管理)。
    // 位置計算・探索は行わない。
    for (let roll of this.rolls) {
      if (roll.resolved[pi]) continue;
      if (musicTime >= roll.startTime - 0.1 && musicTime <= roll.endTime + 0.2) {
        roll.hits[pi]++;
        if (player === 1) this.charHitT = 0.25;
        st.score = Math.min(999999, st.score + Math.round((this.pointPerfect || 300) * 0.3));
        this.audio.playSE('don');
        return;
      }
    }

    // 風船: 「自分の」回数カウント・破裂を別々に管理(1P/2P独立)。
    // 位置計算・探索は行わない。
    for (let balloon of this.balloons) {
      if (balloon.resolved[pi]) continue;
      if (musicTime >= balloon.time - 0.15 && musicTime <= balloon.endTime + 0.1) {
        balloon.hitFlag[pi] = true;
        balloon.hits[pi]++;
        if (player === 1) this.charHitT = 0.25;
        st.score = Math.min(999999, st.score + Math.round((this.pointPerfect || 300) * 0.3));
        this.audio.playSE(isDon ? 'don' : 'ka');
        if (balloon.hits[pi] >= balloon.hitsRequired) {
          balloon.resolved[pi] = true;
          balloon.poppedAt[pi] = musicTime;
          st.perfect++;
          this.hitEffects.push({ x: this.judgeLineX, y: this.laneCY(player), type: 'perfect', time: musicTime, life: 1.3 });
          this.audio.playSE('balloon');
        }
        return;
      }
    }

    this.audio.playSE(isDon ? 'don' : 'ka');
  }

  // ==================== クリック ====================
  handleClick(mx, my) {
    const rect = this.canvas.getBoundingClientRect();
    const x = (mx - rect.left) * (W / rect.width);
    const y = (my - rect.top) * (H / rect.height);
    if (this.screen === 'title') {
      // ネームプレート(名前変更 → localStorage保存)
      if (x > W/2 - 160 && x < W/2 + 168 && y > 232 && y < 274) {
        const name = prompt('プレイヤー名を入力してください', this.playerName);
        if (name && name.trim()) {
          this.playerName = name.trim().slice(0, 12);
          profileMgr.name = this.playerName;
          profileMgr.save();
        }
        return;
      }
      // 称号バッジ(クリックで解放済み称号を切替)
      if (x > W/2 - 82 && x < W/2 + 168 && y > 280 && y < 306) {
        profileMgr.cycleTitle();
        return;
      }
      // 設定バー
      for (const b of this.getSettingsButtons()) {
        if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) {
          if (b.action === 'back') this.screen = 'title';
          else if (b.action === 'folder') document.getElementById('folderInput').click();
          else if (b.action === 'reload') location.reload();
          else if (b.action === 'auto') this.autoPlay = !this.autoPlay;
          else if (b.action === 'color') {
            this.bodyColorIdx = (this.bodyColorIdx + 1) % BODY_PRESETS.length;
            this.bodyColor = BODY_PRESETS[this.bodyColorIdx];
            this.buildComposites();
          }
          else if (b.action === 'rainbow') this.rainbowStyle = 1 - this.rainbowStyle;
          else if (b.action === 'keys') { this.screen = 'keyconfig'; return; }
          else if (b.action === 'site') { window.open('https://main.song-repository.pages.dev/', '_blank'); }
          else if (b.action === 'soundset') {
            const sets = ['default'].concat((this.manifest && this.manifest.soundsets) || ['matsu']);
            this.soundset = sets[(sets.indexOf(this.soundset) + 1) % sets.length];
            try { localStorage.setItem('taiko_soundset', this.soundset); } catch (e) {}
            audio.loadSE(this.manifest);
          }
          return;
        }
      }
      // メダルショップ(songs.json が無い場合は非表示なので到達しない)
      if (this.shopAvailable && x > W/2 - 170 && x < W/2 + 170 && y > 398 && y < 432) {
        shop.open();
        return;
      }
      const menus = ['game', 'folder', 'help'];
      for (let i = 0; i < 3; i++) {
        const cy = 460 + i * 32;
        if (x > W/2 - 170 && x < W/2 + 170 && y > cy - 26 && y < cy + 8) {
          if (menus[i] === 'game') {
            if (this.songs.length > 0) {
              this.screen = 'songSelect';
              this.selectedSong = 0;
            }
          } else if (menus[i] === 'folder') {
            document.getElementById('folderInput').click();
          }
        }
      }
    } else if (this.screen === 'songSelect') {
      // ジャンル分けレイアウトに基づいてクリック位置を判定(旧: 平坦レイアウトでずれていた)
      const layout = this.buildSongListLayout();
      for (const row of layout) {
        if (row.type !== 'song') continue;
        const iy = row.y - this.scrollOffset;
        if (x > 90 && x < W - 90 && y > iy && y < iy + 64) {
          if (row.index >= 0 && this.isSongLocked(this.songs[row.index])) return; // 未解禁は選択不可
          // クリックした行が一瞬縮むアニメーション(150ms後に画面遷移)
          this._songClickIdx = row.index;
          this._songClickAt = this.animTime;
          const idx = row.index;
          setTimeout(() => {
            this.selectedSong = idx === -1 ? Math.floor(Math.random() * this.songs.length) : idx;
            this.screen = 'difficulty';
            this.selectedDiff = 0;
            this.diffScrollX = 0;
          }, 150);
          return;
        }
      }
    } else if (this.screen === 'difficulty') {
      // 演奏オプションパネル開閉
      if (x > 16 && x < 172 && y > 552 && y < 596) {
        this.optPanelOpen = !this.optPanelOpen;
        return;
      }
      // パネル内のボタン(開ききっている時のみ)
      if (this.optPanelOpen && this._optPanelEase > 0.9) {
        const items = this._optionItems();
        for (let i = 0; i < items.length; i++) {
          const iy = (H - 290) + 72 + i * 34; // 完全展開時のY
          if (x > 460 && x < 720 && y > iy - 23 && y < iy + 5) {
            const dir = items[i].act === 'hs' ? (x < 590 ? -1 : 1) : 1;
            this._applyOption(items[i].act, dir);
            return;
          }
        }
        if (y > H - 310) return; // パネル領域内はカード選択無効
      }
      const song = this.songs[this.selectedSong];
      const courses = song.courses;
      const cardW = 170, cardH = 210, gap = 20;
      const totalWidth = courses.length * cardW + (courses.length - 1) * gap;
      const startX = W/2 - totalWidth/2 - this.diffScrollX;
      for (let i = 0; i < courses.length; i++) {
        const cx = startX + i * (cardW + gap);
        if (x > cx && x < cx + cardW && y > 170 && y < 170 + cardH) {
          this.selectedDiff = i;
          this.loadCourse(courses[i]);
          this.startGame();
          return;
        }
      }
    } else if (this.screen === 'keyconfig') {
      const rows = this.getKeyRows();
      for (let i = 0; i < rows.length; i++) {
        const ry = 160 + i * 52;
        if (x > W/2 - 240 && x < W/2 + 240 && y > ry && y < ry + 42) {
          this._keyCapture = rows[i][1];
          return;
        }
      }
    } else if (this.screen === 'result') {
      this.screen = 'title';
    }
  }

  // ==================== キー ====================
  handleKey(e) {
    if (this.screen === 'title') {
      if (e.key === 'Enter' && this.songs.length > 0) {
        this.screen = 'songSelect';
        this.selectedSong = 0;
      }
    } else if (this.screen === 'songSelect') {
      const kk = e.key.toLowerCase();
      if (e.key === 'ArrowUp' || kk === 'f') this.selectedSong = Math.max(-1, this.selectedSong - 1);
      else if (e.key === 'ArrowDown' || kk === 'j') this.selectedSong = Math.min(this.songs.length - 1, this.selectedSong + 1);
      else if (e.key === 'Enter' || kk === 'd') {
        if (this.selectedSong === -1) {
          const pool = this.songs.map((s, i) => i).filter(i => !this.isSongLocked(this.songs[i]));
          this.selectedSong = pool.length ? pool[Math.floor(Math.random() * pool.length)] : 0;
        }
        if (this.isSongLocked(this.songs[this.selectedSong])) return; // 未解禁は選択不可
        this.screen = 'difficulty';
        this.selectedDiff = 0;
        this.diffScrollX = 0;
      } else if (e.key === 'Escape' || kk === 'k') this.screen = 'title';
    } else if (this.screen === 'difficulty') {
      const song = this.songs[this.selectedSong];
      const kk = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || kk === 'f') this.selectedDiff = Math.max(0, this.selectedDiff - 1);
      else if (e.key === 'ArrowRight' || kk === 'j') this.selectedDiff = Math.min(song.courses.length - 1, this.selectedDiff + 1);
      else if (e.key === 'Enter' || kk === 'd') {
        this.loadCourse(song.courses[this.selectedDiff]);
        this.startGame();
      } else if (e.key === 'Escape' || kk === 'k') this.screen = 'songSelect';
    } else if (this.screen === 'playing') {
      const k = e.key.toLowerCase();
      const kb = this.keys;
      const p2 = this.players === 2;
      if (k === kb.donL) { e.preventDefault(); this.input(true, 'left', 1); }
      else if (k === kb.donR) { e.preventDefault(); this.input(true, 'right', 1); }
      else if (k === kb.kaL) { e.preventDefault(); this.input(false, 'left', 1); }
      else if (k === kb.kaR) { e.preventDefault(); this.input(false, 'right', 1); }
      else if (p2 && k === kb.donL2) { e.preventDefault(); this.input(true, 'left', 2); }
      else if (p2 && k === kb.donR2) { e.preventDefault(); this.input(true, 'right', 2); }
      else if (p2 && k === kb.kaL2) { e.preventDefault(); this.input(false, 'left', 2); }
      else if (p2 && k === kb.kaR2) { e.preventDefault(); this.input(false, 'right', 2); }
      else if (k === 'c') { this.rainbowStyle = 1 - this.rainbowStyle; }
      else if (k === '[') {
        if (e.shiftKey) { this.liveShift = Math.max(-5, Math.round((this.liveShift - 0.05) * 100) / 100); this._saveLiveShift(); }
        else { this.avOffsetMs = Math.max(-200, this.avOffsetMs - 5); this._saveAvOffset(); }
      }
      else if (k === ']') {
        if (e.shiftKey) { this.liveShift = Math.min(5, Math.round((this.liveShift + 0.05) * 100) / 100); this._saveLiveShift(); }
        else { this.avOffsetMs = Math.min(200, this.avOffsetMs + 5); this._saveAvOffset(); }
      }
      else if (k === 'backspace') { this.liveShift = 0; this._saveLiveShift(); }
      else if (k === '-' || k === '_') { this.hs = Math.max(0.5, Math.round((this.hs - 0.5) * 10) / 10); }
      else if (k === '=' || k === '+' || k === ';') { this.hs = Math.min(4.0, Math.round((this.hs + 0.5) * 10) / 10); }
      else if (k === 'escape') {
        this.stopGame();
        this.screen = 'songSelect';
      }
    } else if (this.screen === 'keyconfig') {
      if (e.key === 'Escape') this.screen = 'title';
    } else if (this.screen === 'result') {
      if (e.key === 'Enter' || e.key === 'Escape') this.screen = 'title';
    }
  }
}

const canvas = document.getElementById('gameCanvas');

// ==================== 所持コイン管理 ====================
// localStorage 'taiko_coins' に保存。表示更新は0.5秒かけてイージングでカウント
// アップ/ダウンし、増加時は緑で1.2倍、減少時は赤で縮小してから元に戻る。
const coinMgr = {
  coins: 0,   // 実値(localStorageと同期)
  shown: 0,   // 表示中の値(アニメーションで実値に追従)
  _animId: null,
  load() {
    // 'player_coins' を主キーに。旧キー 'taiko_coins' からの移行も行う。
    let v = 0;
    try {
      v = parseInt(localStorage.getItem('player_coins'), 10);
      if (isNaN(v)) v = parseInt(localStorage.getItem('taiko_coins'), 10) || 0;
    } catch (e) {}
    this.coins = v;
    this.shown = this.coins;
    this.render();
  },
  save() { try { localStorage.setItem('player_coins', String(this.coins)); } catch (e) {} },
  render() {
    const el = document.getElementById('coinVal');
    if (el) el.textContent = String(Math.round(this.shown));
  },
  // 0.5秒かけて shown → target へカウント(easeOutCubic)
  animateTo(target) {
    if (this._animId) cancelAnimationFrame(this._animId);
    const from = this.shown, to = target, t0 = performance.now(), dur = 500;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      this.shown = from + (to - from) * e;
      this.render();
      if (p < 1) this._animId = requestAnimationFrame(step);
      else { this.shown = to; this.render(); this._animId = null; }
    };
    this._animId = requestAnimationFrame(step);
  },
  _flash(cls) {
    const el = document.getElementById('coin-display');
    if (!el) return;
    el.classList.remove('coin-up', 'coin-down');
    void el.offsetWidth; // リフローでトランジションを再発火させる
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 500);
  },
  add(n) {                    // コイン獲得: 緑・1.2倍アニメーション
    this.coins += n; this.save();
    this.animateTo(this.coins);
    this._flash('coin-up');
  },
  spend(n) {                  // コイン消費: 赤・縮小アニメーション
    if (this.coins < n) return false;
    this.coins -= n; this.save();
    this.animateTo(this.coins);
    this._flash('coin-down');
    return true;
  }
};
coinMgr.load();

// ==================== 時間指定シード乱数 ====================
// メダルショップの1時間ごとの入れ替え用。シード=現在の「経過時間(時)」なので
// 時計が合っていればどのPCでも同じ5曲が選ばれる(同期表示)。
function hourSeed() {
  return Math.floor(Date.now() / 3600000);
}
// mulberry32: 32bitシードから一様乱数を生成する決定的PRNG
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// list から n 件を Fisher–Yates シャッフル(乱数はseed由来)で選び、元の順序で返す
function pickHourly(list, n, seed) {
  const rand = mulberry32(seed);
  const idx = list.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, Math.min(n, idx.length)).sort((a, b) => a - b).map(i => list[i]);
}

// ==================== メダルショップ ====================
// opensongs.json(常時プレイ可能) / shop_songs.json(メダルで購入して解禁) の
// 曲zipを JSZip で解凍してプレイするモーダルショップ。
// 所持メダルは coinMgr('player_coins')、購入済み曲IDは 'unlocked_songs' に保存。
const shop = {
  openSongs: [],
  songs: [],
  open() {
    document.getElementById('shop-modal').style.display = 'flex';
    this.updateCoin(true);
    this.render();
  },
  close() { document.getElementById('shop-modal').style.display = 'none'; },
  isUnlocked(id) {
    try { return (JSON.parse(localStorage.getItem('unlocked_songs')) || []).includes(id); }
    catch (e) { return false; }
  },
  unlock(id) {
    try {
      const a = JSON.parse(localStorage.getItem('unlocked_songs')) || [];
      if (!a.includes(id)) a.push(id);
      localStorage.setItem('unlocked_songs', JSON.stringify(a));
    } catch (e) {}
  },
  // JSON側 is_unlocked フラグ または localStorage 購入リストのいずれかで解禁判定
  isSongUnlocked(s) {
    if (s && s.is_unlocked === true) return true;
    const id = String(s && s.id !== undefined ? s.id : (s && s.title));
    return this.isUnlocked(id);
  },
  // ショップ内所持メダル表示を0.5秒かけてカウントアップ/ダウン
  updateCoin(instant) {
    const el = document.getElementById('shopCoinVal');
    if (!el) return;
    if (instant) { el.textContent = String(coinMgr.coins); return; }
    const from = parseInt(el.textContent, 10) || 0, to = coinMgr.coins, t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / 500);
      const e2 = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(from + (to - from) * e2));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  // 曲カードの共通枠(タイトル/アーティスト)
  _card(s) {
    const card = document.createElement('div');
    card.className = 'shop-card';
    const info = document.createElement('div');
    info.className = 'shop-card-info';
    const title = document.createElement('div');
    title.className = 'shop-song-title';
    title.textContent = s.title || '(無題)';
    info.appendChild(title);
    if (s.artist) {
      const artist = document.createElement('div');
      artist.className = 'shop-song-artist';
      artist.textContent = s.artist;
      info.appendChild(artist);
    }
    // ジャンル / 難易度 / ノーツ数のメタ情報
    if (s.genre || s.difficulty || s.notes) {
      const meta = document.createElement('div');
      meta.className = 'shop-song-artist';
      meta.textContent = [
        s.genre,
        s.difficulty ? '\u2605' + s.difficulty : null,
        s.notes ? s.notes + '\u30CE\u30FC\u30C4' : null,
      ].filter(Boolean).join(' / ');
      info.appendChild(meta);
    }
    card.appendChild(info);
    return { card, info };
  },
  // 曲一覧を動的生成
  // ・opensongs.json の曲 → 常に「▶ プレイ」
  // ・shop_songs.json の曲 → 未購入は「🔒 🪙価格 で購入」(不足時は無効化)、購入済みは「▶ プレイ」
  render() {
    const list = document.getElementById('shop-song-list');
    if (!list) return;
    list.innerHTML = '';
    if (!this.openSongs.length && !this.songs.length) {
      list.innerHTML = '<div class="shop-loading">曲データを読み込んでいます…</div>';
      return;
    }
    const section = (label) => {
      const h = document.createElement('div');
      h.className = 'shop-section';
      h.textContent = label;
      list.appendChild(h);
    };
    // プレイボタン: path を loadSongZip に渡して読み込み+再生準備
    const playBtn = (path) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'buy-btn play';
      b.textContent = '▶ プレイ';
      b.addEventListener('click', () => { this.close(); playShopSong(path); });
      return b;
    };
    // 1) オープン曲: 常にプレイ可能
    if (this.openSongs.length) {
      section('♪ オープン曲');
      for (const s of this.openSongs) {
        const { card } = this._card(s);
        card.appendChild(playBtn(s.path));
        list.appendChild(card);
      }
    }
    // 2) ショップ曲: 1時間ごとにランダム5曲が入れ替わる(シード=経過時間(時)で全PC同期)
    if (this.songs.length) {
      const seed = hourSeed();
      this._lastSeed = seed;
      const restMin = Math.max(1, Math.ceil(((seed + 1) * 3600000 - Date.now()) / 60000));
      section('♪ メダルショップ曲 (1時間ごとに更新・あと' + restMin + '分)');
      const hourly = pickHourly(this.songs, 5, seed);
      for (const s of hourly) {
        const { card } = this._card(s);
        const id = String(s.id !== undefined ? s.id : s.title);
        const price = Number(s.price) || 0;
        if (this.isSongUnlocked(s)) {
          // 購入済み(is_unlocked or localStorage): プレイ可能
          card.appendChild(playBtn(s.path));
        } else {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'buy-btn';
          if (coinMgr.coins < price) {
            btn.classList.add('disabled');
            btn.textContent = '\u{1F512} \u{1FA99} ' + price + ' (不足)';
            btn.disabled = true;
          } else {
            btn.textContent = '\u{1F512} \u{1FA99} ' + price + ' で購入';
            btn.addEventListener('click', () => {
              if (!coinMgr.spend(price)) return;   // 1. メダル消費+localStorage保存(画面#coin-displayは0.5秒カウント)
              this.unlock(id);                     // 2. 'unlocked_songs' に曲ID追加
              this.updateCoin();                   // 3. #shop-coin-display も0.5秒カウント
              this.render();                       // 4. 画面を再描画(ボタン→▶ プレイへ)
            });
          }
          card.appendChild(btn);
        }
        list.appendChild(card);
      }
    }
  }
};

// ==================== Zip曲データ読み込み(JSZip) ====================
// path のzipを fetch → JSZipで解凍 → .tja と音声ファイルを取り出し、
// 再生可能なソングオブジェクトを生成する。
async function loadSongZip(path) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip が読み込めていません(CDNを確認)');
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ' が見つかりません');
  const zip = await JSZip.loadAsync(await r.arrayBuffer());
  const files = [];
  zip.forEach((rel, entry) => { if (!entry.dir) files.push(entry); });
  // .tja を検索
  const tjaEntry = files.find(f => /\.tja$/i.test(f.name));
  if (!tjaEntry) throw new Error('zip内に .tja が見つかりません');
  // TJAテキスト取得(UTF-8 → 文字化けならShift-JISで再デコード)
  const tjaBuf = await tjaEntry.async('arraybuffer');
  let tjaText = new TextDecoder('utf-8').decode(tjaBuf);
  if (tjaText.includes('\uFFFD')) {
    try { tjaText = new TextDecoder('shift_jis').decode(tjaBuf); } catch (e) {}
  }
  // 音声ファイル: TJAヘッダ WAVE: を優先、無ければzip内の最初の ogg/mp3/wav
  const base = tjaEntry.name.includes('/') ? tjaEntry.name.slice(0, tjaEntry.name.lastIndexOf('/') + 1) : '';
  const waveM = tjaText.match(/^\s*WAVE\s*:\s*(.+?)\s*$/im);
  let audioEntry = null;
  if (waveM) audioEntry = zip.file(base + waveM[1]) || zip.file(waveM[1]);
  if (!audioEntry) audioEntry = files.find(f => /\.(ogg|mp3|wav)$/i.test(f.name));
  if (!audioEntry) throw new Error('zip内に音声ファイルが見つかりません');
  const audioBlob = await audioEntry.async('blob');
  const audioFile = new File([audioBlob], audioEntry.name.split('/').pop());
  // パースしてソングオブジェクト化
  const courses = loader.parser.parse(tjaText);
  if (!courses.length) throw new Error('TJAの解析に失敗しました');
  const songName = decodeURIComponent(path.split('/').pop()).replace(/\.zip$/i, '');
  return {
    name: songName,
    courses,
    audioFile,
    genre: (courses[0].headers.GENRE || '').trim() || 'その他',
    zipPath: path
  };
}

// プレイボタン押下: zipを読み込んでゲームに追加し、難易度選択へ
async function playShopSong(path) {
  const loadEl = document.getElementById('loading');
  const loadFill = document.getElementById('loadFill');
  try {
    if (loadEl) {
      loadEl.classList.remove('hidden');
      loadEl.childNodes[0].textContent = '\u{1F941} 曲データを読み込み中...';
      if (loadFill) loadFill.style.width = '30%';
    }
    const song = await loadSongZip(path);
    // カテゴリ: メダルショップ購入曲 →「メダルショップ」/ オープン曲 →「オープン曲」
    if ((shop.songs || []).some(s => s.path === path)) song.category = '\u30E1\u30C0\u30EB\u30B7\u30E7\u30C3\u30D7';
    else if ((shop.openSongs || []).some(s => s.path === path)) song.category = '\u30AA\u30FC\u30D7\u30F3\u66F2';
    // JSON側の lead_in(秒)を引き継ぐ: 音声先頭に意図的な無音パディングがある曲だけ
    // 個別に指定する。無音が曲の一部(静寂のイントロ等)の曲は指定しないこと。
    const entry = shop.openSongs.concat(shop.songs || []).find(s => s.path === path);
    song.zipLeadIn = (entry && typeof entry.lead_in === 'number') ? entry.lead_in : null;
    if (loadFill) loadFill.style.width = '100%';
    // 同じpathの曲があれば入れ替え(重複防止)
    const idx = game.songs.findIndex(s => s.zipPath === path);
    if (idx >= 0) game.songs.splice(idx, 1);
    game.songs.push(song);
    game.selectedSong = game.songs.length - 1;
    game.screen = 'difficulty';
    game.selectedDiff = 0;
    game.diffScrollX = 0;
  } catch (e) {
    console.error(e);
    alert('曲の読み込みに失敗しました: ' + (e && e.message ? e.message : e));
  } finally {
    if (loadEl) loadEl.classList.add('hidden');
  }
}

async function traverseEntry(entry, files, path = '') {
  if (entry.isFile) {
    await new Promise(resolve => {
      entry.file(file => {
        file.webkitRelativePath = path + file.name;
        files.push(file);
        resolve();
      });
    });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    const entries = await new Promise(resolve => reader.readEntries(resolve));
    for (let en of entries) await traverseEntry(en, files, path + entry.name + '/');
  }
}

// ==================== 🎯 適応的FPSシステム ====================
// モニターのリフレッシュレートに動的に合わせる（60-999Hz・垂直同期）
class AdaptiveFPS {
  constructor() {
    this.minFPS = 60;      // 最低FPS
    this.maxFPS = 999;     // 最大FPS
    this.currentFPS = 60;  // 現在のFPS
    this.targetFPS = 60;   // 目標FPS
    this.frameTime = 1000 / 60; // ミリ秒単位のフレーム時間
    
    this.frameCount = 0;
    this.fpsCheckTime = 0;
    this.fpsCheckInterval = 1000; // 1秒ごとにFPSをチェック
    
    this.lastFrameTime = performance.now();
    this.deltaTime = 0; // Δt（フレーム間の時間、秒）
    this.totalTime = 0; // 総経過時間
    
    this.targetFrameTime = 1000 / this.targetFPS; // ミリ秒
    this.frameTimes = []; // 直近60フレームのフレーム時間
    this.avgFrameTime = 0;
    
    this.isAdaptiveEnabled = true;
    this.displayStats = false; // デバッグ用表示フラグ
  }

  // モニターのリフレッシュレートを検出（ベストエフォート）
  async detectRefreshRate() {
    return new Promise((resolve) => {
      let frameCount = 0;
      let startTime = performance.now();
      const checkDuration = 1000; // 1秒間測定

      const countFrames = (currentTime) => {
        frameCount++;
        if (currentTime - startTime < checkDuration) {
          requestAnimationFrame(countFrames);
        } else {
          const detectedFPS = Math.round((frameCount * 1000) / (currentTime - startTime));
          // 60-999Hzの範囲内に収める
          const clampedFPS = Math.max(this.minFPS, Math.min(this.maxFPS, detectedFPS));
          console.log(`📊 検出されたリフレッシュレート: ${detectedFPS}Hz → ${clampedFPS}Hz`);
          resolve(clampedFPS);
        }
      };
      
      requestAnimationFrame(countFrames);
    });
  }

  // フレーム更新前に呼び出す
  updateFrameTime() {
    const now = performance.now();
    this.deltaTime = (now - this.lastFrameTime) / 1000; // 秒に変換
    this.lastFrameTime = now;
    
    // デルタタイム制限（異常値を排除）
    if (this.deltaTime > 0.1) this.deltaTime = 0.1; // 最大100ms
    if (this.deltaTime < 0.001) this.deltaTime = 0.001; // 最小1ms
    
    this.totalTime += this.deltaTime;
    
    // フレーム時間を記録
    const frameTimeMs = this.deltaTime * 1000;
    this.frameTimes.push(frameTimeMs);
    if (this.frameTimes.length > 60) {
      this.frameTimes.shift(); // 古いデータを削除
    }
    
    // 平均フレーム時間を計算
    this.avgFrameTime = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length;
    
    // リアルタイムFPSを計算
    this.frameCount++;
    this.fpsCheckTime += frameTimeMs;
    
    if (this.fpsCheckTime >= this.fpsCheckInterval) {
      this.currentFPS = Math.round((this.frameCount * 1000) / this.fpsCheckTime);
      this.frameCount = 0;
      this.fpsCheckTime = 0;
      
      // 自動適応：FPSが目標から大きくズレていたら調整
      if (this.isAdaptiveEnabled) {
        this._adjustTargetFPS();
      }
    }
  }

  // FPSの自動調整（パフォーマンスに基づく）
  _adjustTargetFPS() {
    const fpsDeviation = this.currentFPS - this.targetFPS;
    
    // FPSが安定している → 目標を上げる可能性
    if (Math.abs(fpsDeviation) < 5) {
      if (this.targetFPS < this.maxFPS) {
        this.targetFPS = Math.min(this.targetFPS + 12, this.maxFPS);
      }
    }
    // FPSが目標より大きく低い → 目標を下げる
    else if (fpsDeviation < -10) {
      this.targetFPS = Math.max(this.targetFPS - 12, this.minFPS);
    }
  }

  // 描画をスキップすべきか判定（垂直同期対応）
  shouldRender() {
    // requestAnimationFrameはブラウザの垂直同期に自動同期
    // モニターのリフレッシュレート（60-999Hz）に追従
    return true;
  }

  // デルタタイムを使用した物理演算・アニメーション更新
  // 使用例: const newPos = oldPos + velocity * fps.deltaTime;
  
  getStats() {
    return {
      currentFPS: this.currentFPS,
      targetFPS: this.targetFPS,
      avgFrameTime: this.avgFrameTime.toFixed(2),
      deltaTime: this.deltaTime.toFixed(4),
      totalTime: this.totalTime.toFixed(2),
      minFPS: this.minFPS,
      maxFPS: this.maxFPS
    };
  }
}

      lines.push(`\n【判定結果】`);
      lines.push(`  コンボ: ${game.combo}`);
      lines.push(`  スコア: ${game.score}`);
      lines.push(`  Perfect: ${game.stat.perfect}`);
      lines.push(`  Good: ${game.stat.good}`);
      lines.push(`  Miss: ${game.stat.miss}`);
    }

    // ============ オーディオ情報 ============
    if (audio.ctx) {
      lines.push(`\n【オーディオ情報】`);
      lines.push(`  AudioContext状態: ${audio.ctx.state}`);
      lines.push(`  再生中: ${audio.isPlaying}`);
      lines.push(`  マスターゲイン: ${audio.masterGain.gain.value.toFixed(2)}`);
    }

    // ============ FPS情報 ============
    if (fps) {
      const fpsStats = fps.getStats();
      lines.push('');
      lines.push('【FPS情報（適応的システム）】');
      lines.push(`  現在FPS: ${fpsStats.currentFPS} (目標: ${fpsStats.targetFPS})`);
      lines.push(`  平均フレーム時間: ${fpsStats.avgFrameTime}ms`);
      lines.push(`  Δt（デルタタイム）: ${fpsStats.deltaTime}秒`);
      lines.push(`  対応範囲: ${fpsStats.minFPS} ~ ${fpsStats.maxFPS}Hz`);
      lines.push(`  総経過時間: ${fpsStats.totalTime}秒`);
    }

    // ============ 操作方法 ============
    lines.push('');
    lines.push('【操作】');
    lines.push('  DEL キー = デバッグメニュー切り替え');
    lines.push('  F/J = ドン(赤), D/K = カツ(青)');
    lines.push('');
    lines.push('✅ リアルタイム更新中... (毎フレーム)');

    content.textContent = lines.join('\n');
  }
};

// デバッグメニューの定期更新（毎フレーム）
setInterval(() => {
  if (DEBUG.active) {
    DEBUG.update();
  }
}, 16); // 約60FPS

// デバッグメニューのクローズボタン
document.querySelector('.close-debug')?.addEventListener('click', () => {
  DEBUG.toggle();
});



// フレームごとにコンソールにFPS統計を出力（オプション・デバッグ用）
setInterval(() => {
  if (fps && fps.displayStats) {
    const stats = fps.getStats();
    console.log(`📊 FPS: ${stats.currentFPS} | Δt: ${stats.deltaTime}s | Avg: ${stats.avgFrameTime}ms`);
  }
}, 5000); // 5秒ごと

</script>
  <div id="debugOverlay"><div class="close-debug">✕ CLOSE (DEL)</div><div id="debugContent"></div></div>
</body>
</html>
