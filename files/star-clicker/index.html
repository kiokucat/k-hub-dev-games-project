<style>

#bn{top:30%;font-size:clamp(24px,5vw,52px);text-shadow:0 0 20px var(--ac),0 0 60px var(--ac);opacity:0}

#pn[hidden],.u[hidden]{display:none}
.u{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;padding:9px 12px;border-radius:15px;border:1px solid #ffffff1a;background:#080d2099;cursor:pointer;transition:transform .2s,box-shadow .3s,opacity .3s,border-color .3s}

.n{text-align:right;line-height:1.5}
.ct{font-size:10.5px;color:var(--dim)}
.co{font-size:14px;color:hsl(var(--ih) 100% 80%)}

#tr{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;display:flex;gap:6px}

.mh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #ffffff14}
.mh h2{margin:0;flex:1;font-size:15px;letter-spacing:.14em}
.mh h2 span{color:hsl(var(--h) 100% 78%);margin-left:.6em}
.x,.mf button{font:inherit;color:#fff;background:#ffffff12;border:1px solid #ffffff2a;border-radius:11px;padding:7px 12px;cursor:pointer}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:12px;overflow-y:auto;scrollbar-width:thin}
.a{padding:9px 12px;border-radius:14px;border:1px solid #ffffff1a;background:#080d2099;opacity:.45}

.a b{display:block;font-size:12.5px}.a small{display:block;margin-top:2px;color:var(--dim);font-size:10.5px;font-weight:400;line-height:1.4}
#ct{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:thin;flex:none}
#ct button{flex:none;font:inherit;font-size:12px;letter-spacing:.08em;color:var(--dim);background:#ffffff0d;border:1px solid transparent;border-radius:12px;padding:9px 12px;cursor:pointer}

#ti{padding:2px 16px 6px;color:var(--dim);font-size:11px;font-weight:400;flex:none}
#tv{position:relative;overflow:auto;padding:8px 10px 14px;flex:1;min-height:150px;scrollbar-width:thin}
.tree{position:relative;width:760px;height:270px;margin:0 auto}
.tree[hidden]{display:none}
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tree path{fill:none;stroke:#ffffff26;stroke-width:3;stroke-linecap:round}

.nd{position:absolute;width:132px;height:68px;font:inherit;color:inherit;text-align:left;padding:7px 9px;border-radius:14px;border:1px solid #ffffff22;background:#080d20dd;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

.nd small{font-size:10px;color:var(--dim);font-weight:400;line-height:1.3}
.nd.lk{opacity:.38;border-style:dashed}.nd.av{opacity:.7}
.nd.own{opacity:1;border-color:hsl(var(--h) 100% 65%/.7);background:hsl(var(--h) 60% 22%/.55)}
.nd.can{opacity:1;border-color:hsl(var(--h) 100% 70%/.9);box-shadow:0 0 18px hsl(var(--h) 100% 55%/.45),inset 0 0 18px hsl(var(--h) 100% 55%/.15)}

#cbody{padding:14px 16px;font-size:12.5px;line-height:1.8;font-weight:400}

.mf{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px}
.mf button:disabled{opacity:.4;cursor:default}
#mo[hidden]{display:none}#oc{border-color:hsl(var(--h) 100% 66%/.9);box-shadow:0 0 16px hsl(var(--h) 100% 55%/.5)}
#cy:not(:disabled){border-color:hsl(var(--h) 100% 66%/.9);box-shadow:0 0 16px hsl(var(--h) 100% 55%/.5)}

#tl{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;font:inherit;font-size:12px;letter-spacing:.06em;color:#fff;background:#050818aa;border:1px solid #ffffff30;border-radius:12px;padding:7px 10px;min-width:64px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;transition:opacity .8s}

.cin #tl{opacity:0!important;pointer-events:none!important;transition:opacity .25s}
@media(max-width:560px){#tl{min-width:60px;padding:6px 8px}}

.dg{font:inherit;color:#fff;background:#ffffff12;border:1px solid #ffffff2a;border-radius:11px;padding:8px 14px;cursor:pointer}
.dg.warn{border-color:#ff7a7acc}
</style>
</head>
