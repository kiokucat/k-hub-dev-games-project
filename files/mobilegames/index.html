<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ミニゲームセンター</title>
<style type="text/css">
/* mamorino5 / Android 6.0.1向け。設計座標は240x320。表示領域に合わせて全体を拡大縮小 */
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eaf3f6;color:#263740;font-family:Meiryo,sans-serif;-webkit-text-size-adjust:none;}
*{box-sizing:border-box;} button,textarea,select,input{font-family:Meiryo,sans-serif;} button{-webkit-tap-highlight-color:transparent;}
#アプリ{width:240px;height:320px;position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%);transform-origin:center center;overflow:hidden;background:#f8fcfd;}
#ヘッダー{width:240px;height:30px;line-height:30px;position:absolute;left:0;top:0;z-index:20;background:#1c718e;border-bottom:2px solid #10536a;color:#fff;}
#ホームボタン{width:30px;height:28px;float:left;margin:0 4px;padding:0;border:0;background:transparent;color:#fff;font-size:19px;line-height:27px;}
#見出し{display:block;height:28px;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:bold;}
.画面{width:240px;height:290px;position:absolute;top:30px;left:0;display:none;overflow-x:hidden;overflow-y:auto;}
.表示中{display:block;}.中央{width:220px;margin:0 auto;}
#ホーム{width:240px;height:290px;padding:8px 0 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}#ホーム::-webkit-scrollbar{width:0;height:0;}
.案内{margin:0 0 7px;text-align:center;font-size:12px;color:#456;}
.選択一覧{width:220px;margin:0 auto;text-align:center;font-size:0;padding-bottom:8px;}
.ゲーム選択{width:106px;height:34px;margin:2px;padding:1px;display:inline-block;vertical-align:top;overflow:hidden;border:1px solid #70a9bb;border-radius:5px;background:#fff;color:#174e65;font-size:10px;font-weight:bold;line-height:14px;cursor:pointer;}
.実装済{background:#def3f8;border-color:#2888a6;}
.ゲーム選択:active,.小ボタン:active,.数ボタン:active,.ゲーム大ボタン:active,.音鍵:active{background:#ffec9e;}
.ゲーム画面{padding-top:5px;text-align:center;overflow-x:hidden;overflow-y:auto;}
.説明{width:220px;height:25px;margin:0 auto;overflow:hidden;color:#36505d;font-size:11px;line-height:12px;}
.遊び場{width:220px;height:220px;margin:0 auto;position:relative;overflow:hidden;border:2px solid #4b8294;border-radius:6px;background:#fff;}
.下操作{width:220px;min-height:35px;height:auto;margin:3px auto 0;overflow:visible;text-align:center;font-size:11px;padding-bottom:6px;line-height:1.1;}
.小ボタン{min-width:48px;min-height:28px;height:28px;margin:2px;padding:2px 5px;border:1px solid #397c94;border-radius:4px;background:#e5f5fa;color:#174e65;font-size:11px;font-weight:bold;cursor:pointer;}
.ゲーム大ボタン{min-width:52px;min-height:30px;height:30px;margin:2px;padding:3px 6px;border:1px solid #397c94;border-radius:4px;background:#e5f5fa;color:#174e65;font-size:11px;font-weight:bold;cursor:pointer;}
.状態{display:block;min-height:15px;margin:1px auto;color:#a52d20;font-size:11px;font-weight:bold;line-height:14px;}
/* 1: 5x5の躍動将棋 */
#将棋情報{width:220px;height:20px;margin:0 auto;font-size:11px;line-height:20px;}#将棋手番{float:left;color:#b23b23;font-weight:bold;}#将棋案内{float:right;color:#42606c;}
#将棋盤{width:220px;height:220px;margin:0 auto;position:relative;background:#e8b96d;border:2px solid #804a1d;font-size:0;}
.将棋マス{width:43.2px;height:43.2px;display:inline-block;vertical-align:top;position:relative;border-right:1px solid #80521f;border-bottom:1px solid #80521f;background:#edc77f;}
.選択{background:#ffdf75!important;}.動ける{background:#a9df95!important;}.駒{width:34px;height:36px;margin:3px auto 0;display:block;overflow:hidden;border:1px solid #5e3b1e;border-radius:3px 3px 8px 8px;background:#fff1c5;color:#212121;font-size:17px;font-weight:bold;line-height:34px;text-align:center;}
.後手{-webkit-transform:rotate(180deg);transform:rotate(180deg);color:#7b2631;}#カメラ表示{width:48px;height:17px;position:absolute;right:2px;bottom:2px;z-index:3;border-radius:3px;background:rgba(20,40,50,.72);color:#fff;font-size:8px;line-height:17px;text-align:center;pointer-events:none;}
#スティック{width:42px;height:42px;position:absolute;right:4px;bottom:22px;z-index:3;border:2px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(15,55,75,.28);pointer-events:none;}#スティック中心{width:16px;height:16px;margin:11px;border-radius:9px;background:rgba(255,255,255,.82);}
/* 2: 日記 */
#日記帳{padding-top:4px;}#日記入力{width:210px;height:140px;margin:0 auto;display:block;resize:none;border:1px solid #8bb2c0;border-radius:4px;background:#fffdf2;color:#34302c;font-size:12px;line-height:17px;}#日記時刻{margin:3px 0;color:#59717b;font-size:10px;}
/* 3: ○× */
#まるばつ盤{width:150px;height:150px;margin:18px auto 0;border-collapse:collapse;table-layout:fixed;}#まるばつ盤 td{width:50px;height:50px;padding:0;border:2px solid #447d93;background:#f9ffff;color:#173f55;font-size:29px;font-weight:bold;text-align:center;vertical-align:middle;}
/* 4: 連打 */
#連打箱{padding-top:18px;background:#f7f1db;}#連打数{height:48px;color:#bd452d;font-size:34px;font-weight:bold;line-height:48px;}#連打時間{color:#315d6c;font-size:17px;}#連打ボタン{width:160px;height:83px;margin-top:18px;border:3px solid #b84a27;border-radius:10px;background:#ff9b57;color:#fff;font-size:23px;font-weight:bold;box-shadow:0 3px 0 #9e361e;}#連打ボタン:active{margin-top:21px;box-shadow:none;}
/* 5: 数当て */
#数当て箱{padding-top:10px;}#予想数{height:56px;color:#17627d;font-size:43px;font-weight:bold;line-height:56px;}.数列{height:36px;margin:2px 0;}.数ボタン{width:47px;height:31px;margin:1px;padding:0;border:1px solid #3a829a;border-radius:5px;background:#d9f2f7;color:#1b5066;font-size:13px;font-weight:bold;}#数当て助言{height:25px;padding-top:4px;color:#a13b2b;font-size:12px;font-weight:bold;}
/* 6: 反射 */
#反射板{width:200px;height:160px;margin:29px auto 0;border:3px solid #813331;border-radius:8px;background:#db4b43;color:#fff;font-size:23px;font-weight:bold;line-height:154px;text-align:center;}#反射板.待機{background:#5d8494;border-color:#365967;}#反射板.成功{background:#38a652;border-color:#1f7132;}
/* 7: スロット */
#スロット箱{padding-top:38px;background:#2d4253;}#リール{width:190px;height:72px;margin:0 auto;border:4px solid #f8c95d;border-radius:8px;background:#fff;white-space:nowrap;}.絵文字{width:59px;height:64px;display:inline-block;vertical-align:top;border-right:1px solid #b6b6b6;font-size:39px;line-height:64px;text-align:center;}#スロット結果{height:32px;margin-top:13px;color:#fff;font-size:16px;font-weight:bold;}
/* 8: ニム */
#ニム箱{padding-top:10px;background:#f3f5e9;}#コイン数{height:30px;color:#555;font-size:12px;line-height:30px;}#コイン並び{width:190px;height:74px;margin:0 auto;overflow:hidden;font-size:0;text-align:center;}.コイン{width:17px;height:17px;margin:2px;display:inline-block;border:2px solid #bd8116;border-radius:9px;background:#ffd55b;}#ニム文{height:25px;color:#a14027;font-size:12px;font-weight:bold;}
/* 9: サイコロ */
#さいころ箱{padding:4px 5px;height:220px;} .さいころレイアウト{width:210px;height:210px;margin:0 auto;display:block;font-size:0;overflow:hidden;} .さいころ操作欄{width:72px;height:210px;display:inline-block;vertical-align:top;margin-right:6px;padding-top:10px;text-align:center;border-right:1px solid #b6cbd2;} .さいころ操作見出し{height:26px;color:#36505d;font-size:10px;font-weight:bold;line-height:13px;} .さいころ振るボタン{width:60px;height:60px;margin:4px auto;display:block;border:2px solid #397c94;border-radius:7px;background:#dff4fa;color:#174e65;font-size:11px;font-weight:bold;line-height:14px;overflow:hidden;} .さいころ振るボタン:active{background:#ffec9e;} .さいころ結果欄{width:126px;height:210px;display:inline-block;vertical-align:top;padding-left:6px;font-size:11px;overflow:hidden;} .さいころ結果見出し{height:18px;color:#36505d;font-size:11px;font-weight:bold;line-height:18px;} #出目{height:44px;color:#263c4c;font-size:24px;font-weight:bold;line-height:44px;text-align:center;white-space:nowrap;overflow:hidden;} #合計{height:22px;color:#ad3a24;font-size:12px;font-weight:bold;line-height:22px;text-align:center;white-space:nowrap;overflow:hidden;} .さいころ回数表示{height:18px;color:#58707a;font-size:10px;line-height:18px;text-align:center;} #記録{width:116px;height:98px;margin:3px auto 0;overflow-y:auto;border:1px solid #9cb8c2;background:#f5fbfc;color:#49626c;font-size:9px;line-height:14px;text-align:left;padding:2px;}
/* 10: 記憶 */
#記憶箱{padding-top:17px;}#記憶情報{height:28px;color:#4a626b;font-size:12px;font-weight:bold;line-height:28px;}#色盤{width:154px;height:154px;margin:0 auto;font-size:0;}.色{width:72px;height:72px;margin:2px;display:inline-block;border:3px solid rgba(0,0,0,.22);border-radius:9px;opacity:.72;}.光{opacity:1!important;border-color:#fff!important;box-shadow:0 0 12px 5px #fff;}#赤{background:#e84b46;}#青{background:#4398df;}#黄{background:#f2ce37;}#緑{background:#4aaf69;}
/* 11〜50の共通予定画面 */
#予定箱{padding-top:55px;background:#f5fafb;}#予定番号{color:#26708a;font-size:27px;font-weight:bold;}#予定文{margin-top:16px;color:#6a828d;font-size:17px;font-weight:bold;}
/* 54〜59: 追加ミニゲーム */
#追加箱{padding-top:10px;text-align:center;}#追加表示{height:48px;color:#36505d;font-size:23px;font-weight:bold;line-height:48px;}#追加説明{height:30px;color:#58707a;font-size:11px;line-height:15px;overflow:hidden;} .追加大ボタン{width:92px;height:54px;margin:3px;border:2px solid #397c94;border-radius:7px;background:#e5f5fa;color:#174e65;font-size:13px;font-weight:bold;} .追加大ボタン:active{background:#ffec9e;}
#色あて盤{width:180px;height:100px;margin:8px auto 0;} .色あて色{width:78px;height:42px;margin:3px;display:inline-block;border:2px solid #487d8d;border-radius:6px;}
#神経盤 .小ボタン{display:inline-block;vertical-align:top;width:48px !important;height:48px !important;margin:0 2px 4px 0;padding:0;line-height:44px;}
#もぐら盤 .小ボタン,#花盤 .小ボタン,#宝盤 .小ボタン{display:inline-block;vertical-align:top;width:60px !important;height:50px !important;margin:0 5px 6px 0;padding:0;}
#キャッチ盤{display:block;width:192px;height:168px;margin:0 auto;padding:0;position:relative;font-size:0;line-height:0;text-align:left;}
#キャッチ盤 .小ボタン{position:absolute;display:block;width:60px !important;height:50px !important;margin:0;padding:0;font-size:0;line-height:0;}
#キャッチ穴0{left:0;top:0;}#キャッチ穴1{left:66px;top:0;}#キャッチ穴2{left:132px;top:0;}
#キャッチ穴3{left:0;top:56px;}#キャッチ穴4{left:66px;top:56px;}#キャッチ穴5{left:132px;top:56px;}
#キャッチ穴6{left:0;top:112px;}#キャッチ穴7{left:66px;top:112px;}#キャッチ穴8{left:132px;top:112px;}
.キャッチ風船{position:absolute;width:24px;height:30px;left:18px;top:8px;border-radius:50% 50% 45% 45%;background:#e84b46;border:1px solid #9f2f2a;}
.キャッチ風船:after{content:'';position:absolute;left:11px;top:25px;width:1px;height:12px;background:#397c94;}
#迷路盤>div{display:inline-block !important;vertical-align:top;width:40px;height:40px;margin:0 2px 2px 0;line-height:38px;text-align:center;font-size:20px;}
#パズル盤 .小ボタン{display:inline-block;vertical-align:top;width:60px !important;height:60px !important;margin:0 4px 4px 0;padding:0;line-height:54px;}
#ドット盤>div{display:inline-block;vertical-align:top;width:20px;height:20px;margin:0 1px 1px 0;line-height:18px;}
#風船盤 .追加大ボタン{display:inline-block;vertical-align:top;margin:0 4px 4px 0;}
#方向盤{width:180px;height:120px;margin:7px auto 0;} .方向ボタン{width:52px;height:36px;margin:2px;border:1px solid #397c94;border-radius:5px;background:#e5f5fa;font-size:18px;font-weight:bold;color:#174e65;}

/* 53. 曲タップ演奏シミュレーター */
#曲箱{padding-top:6px;background:#f7fbfc;text-align:center;}
#曲選択{width:202px;height:28px;margin:0 auto 5px;font-size:11px;border:1px solid #78a8b7;border-radius:4px;background:#fff;color:#264e5f;}
#曲情報{width:202px;height:30px;margin:0 auto 4px;overflow:hidden;color:#36505d;font-size:10px;line-height:14px;}
#鍵盤{width:204px;height:110px;margin:0 auto;font-size:0;overflow:hidden;text-align:center;}
.音鍵{width:46px;height:50px;margin:2px;display:inline-block;vertical-align:top;border:1px solid #4f8aa0;border-radius:5px;background:#fff;color:#234f60;font-size:11px;font-weight:bold;line-height:48px;}
.音鍵:active,.音鍵.正解鍵{background:#ffec9e;}
#曲進捗{width:202px;height:20px;margin:0 auto;color:#a13b2b;font-size:10px;font-weight:bold;line-height:20px;}

/* 37〜50: 追加ミニゲーム共通 */
.小ゲーム面{width:216px;height:216px;margin:0 auto;position:relative;overflow:hidden;background:#fafdff;border:1px solid #9cb8c2;border-radius:5px;}
.小ゲーム情報{height:24px;line-height:24px;color:#36505d;font-size:11px;font-weight:bold;overflow:hidden;}
.ゲーム大ボタン{width:88px;height:44px;margin:3px;border:2px solid #397c94;border-radius:7px;background:#e5f5fa;color:#174e65;font-size:12px;font-weight:bold;}
.ゲーム大ボタン:active{background:#ffec9e;}
#かけっこ盤{position:relative;width:210px;height:165px;margin:4px auto;background:#eef7ea;border:1px solid #95b58f;overflow:hidden;}
#お店盤{width:204px;height:175px;margin:3px auto;display:block;font-size:0;line-height:0;text-align:center;overflow:hidden;}#お店盤 .ゲーム大ボタン{display:inline-block;vertical-align:top;}
#島盤{width:204px;height:176px;margin:3px auto;display:block;font-size:0;line-height:0;text-align:center;overflow:hidden;}#島盤 .島マス{display:inline-block;vertical-align:top;margin:0 4px 4px 0;}
.島マス{width:30px;height:30px;border:1px solid #6d9b78;border-radius:4px;background:#eaf5e9;font-size:18px;line-height:28px;text-align:center;}
#写真枠{width:205px;height:176px;margin:3px auto;border:1px solid #9cb8c2;background:#fff;overflow:hidden;}
#写真キャンバス{width:200px;height:170px;margin:2px;background:#eef7ff;}
#おたのしみ面{padding-top:22px;text-align:center;}
#星座盤{width:205px;height:175px;margin:3px auto;background:#10284d;position:relative;overflow:hidden;}
.星ボタン{position:absolute;width:22px;height:22px;padding:0;border:0;background:transparent;color:#ffe58a;font-size:17px;}
#天気絵{height:62px;font-size:44px;line-height:62px;}
#虫盤{width:204px;height:176px;margin:3px auto;display:block;font-size:0;line-height:0;text-align:center;overflow:hidden;}#虫盤 button{display:inline-block;vertical-align:top;margin:0 3px 4px 0;}
#虫盤 button{width:48px;height:48px;padding:0;border:1px solid #7da085;border-radius:6px;background:#eaf7e8;font-size:22px;}
#ボウリング盤{width:204px;height:168px;margin:3px auto;position:relative;background:#edf5fb;border:1px solid #91adbd;overflow:hidden;}
#カーレース盤{width:210px;height:176px;margin:3px auto;position:relative;background:#4d5560;overflow:hidden;border-left:14px solid #6e757c;border-right:14px solid #6e757c;}
#リズム盤{width:204px;height:168px;margin:3px auto;position:relative;background:#f4f7fb;border:1px solid #9cb8c2;overflow:hidden;}
.リズムレーン{position:absolute;top:0;width:48px;height:168px;border-right:1px solid #d4dfe4;}
.リズムノート{position:absolute;width:42px;height:22px;border-radius:5px;background:#77b6ce;border:1px solid #397c94;}
#リズム判定{position:absolute;bottom:3px;left:0;width:204px;text-align:center;font-size:11px;font-weight:bold;color:#a13b2b;}

/* 追加テーマ: 端末でもPCでも読みやすい、図形ベースのUI */
#ヘッダー{background:#183b4a;border-bottom:2px solid #0e2630;box-shadow:0 1px 0 rgba(0,0,0,.15);}
#アプリ{background:#f4f8fa;}
.ゲーム選択{border-color:#9ab8c3;border-radius:8px;background:#ffffff;box-shadow:0 1px 2px rgba(20,50,60,.10);}
.ゲーム選択.実装済{background:#e9f5f7;border-color:#4c91a5;}
.ゲーム選択:active,.小ボタン:active,.数ボタン:active,.ゲーム大ボタン:active,.音鍵:active{background:#d9eef2;}
.遊び場{border-color:#9ab5bf;border-radius:8px;box-shadow:0 1px 3px rgba(30,60,70,.10);}
.小ボタン,.ゲーム大ボタン{border-color:#6b9aaa;border-radius:7px;box-shadow:0 1px 1px rgba(0,0,0,.08);}
.小ボタン:disabled,.ゲーム大ボタン:disabled{opacity:.45;}
.絵文字{font-family:Arial,sans-serif;font-weight:bold;color:#234f60;}
/* 本格将棋 */
#本格将棋横並び{width:216px;height:195px;margin:0 auto;position:relative;font-size:0;line-height:0;}
#本格将棋盤{width:195px;height:195px;margin:0;display:inline-block;vertical-align:top;position:relative;z-index:31;background:#d8a45f;border:3px solid #70431f;box-shadow:0 2px 5px rgba(0,0,0,.22);font-size:0;line-height:0;overflow:hidden;}
.本格将棋場{height:220px!important;min-height:220px;overflow:hidden!important;position:relative;z-index:30;background:#f7fbfc;}
.本格将棋マス{width:21px;height:21px;display:block;position:absolute;box-sizing:border-box;border-right:1px solid #815a2d;border-bottom:1px solid #815a2d;background:#e9bd76;text-align:center;cursor:pointer;z-index:1;}
.本格将棋マス.選択{background:#ffe47d;}
.本格将棋マス.合法{background:#b9df9e;}
.本格将棋駒{width:17px;height:19px;margin:1px auto 0;display:block;border:1px solid #6a4528;border-radius:2px 2px 5px 5px;background:#fff0bd;color:#211c17;font-family:serif;font-size:12px;font-weight:bold;line-height:17px;text-align:center;}
.本格将棋駒.後手{transform:rotate(180deg);color:#8a2e35;}
#本格将棋手番縦{width:21px;height:195px;display:inline-block;vertical-align:top;padding-top:30px;background:#e5f2f5;border:1px solid #78a8b7;border-left:0;color:#58707a;font-size:10px;font-weight:bold;line-height:17px;text-align:center;}
#本格将棋手番縦 .手番中{display:block;background:#ffe47d;color:#6a3d14;}
#本格将棋案内{height:19px;line-height:19px;color:#9a382a;font-size:10px;font-weight:bold;}
#本格将棋案内{height:18px;line-height:18px;color:#9a382a;font-size:10px;font-weight:bold;}
.昇格選択{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100;width:140px;padding:7px;background:#fff;border:2px solid #496d7a;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.25);font-size:10px;text-align:center;}
.昇格選択 button{width:58px;height:27px;margin:2px;border:1px solid #6b9aaa;border-radius:5px;background:#eef7f9;font-size:10px;}
/* 軽量アニメーション: Android 5系でも安定する opacity / transform だけを使用 */
/* 本格将棋は各手で盤全体を描き直すため、登場演出の対象から外す */
.ゲーム画面.表示中 .遊び場{-webkit-animation:遊び場登場 .22s ease-out;animation:遊び場登場 .22s ease-out;}
