html,body{height:100%;margin:0}

const g=bpGain();$('#bp').textContent=S.bp+' BP';$('#bpn').textContent=g?`転生すると +${g} BP`:`1億コイン到達で転生できます(今回 ${fmt(Math.floor(S.total))})`;$('#rbb').disabled=!g;
T1.upd();T2.upd()}
/* ---- タブ・テーマ・リセット ---- */
$$('.tabs').forEach(tb=>{const bs=[...tb.children],ps=[...tb.parentNode.children].filter(e=>e.classList.contains('pane'));bs.forEach((b,i)=>b.onclick=()=>{bs.forEach((x,j)=>x.classList.toggle('on',i==j));ps.forEach((x,j)=>x.classList.toggle('on',i==j));chart()})});
const BT=$$('#bt button'),CO=$$('.col');BT.forEach((b,i)=>b.onclick=()=>{BT.forEach((x,j)=>x.classList.toggle('on',i==j));CO.forEach((x,j)=>x.classList.toggle('on',i==j));fit();chart()});
function theme(t,p){R.dataset.theme=t;$('#th').innerHTML=I(t=='dark'?'light_mode':'dark_mode');if(p)try{localStorage.setItem('mc.theme',t)}catch(e){}cols();chart()}
let t0;try{t0=localStorage.getItem('mc.theme')}catch(e){}
theme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>theme(R.dataset.theme=='dark'?'light':'dark',1);
let arm=0;$('#rs').onclick=function(){if(!arm){arm=1;this.classList.add('arm');toast('もう一度タップで全データを消去','warning');setTimeout(()=>{arm=0;this.classList.remove('arm')},3000);return}
arm=0;this.classList.remove('arm');S=fresh();C=calc();seen={};ready=false;hist=[];sel=null;ui();ready=true;save()};
/* ---- メインループ ---- */
let last=performance.now(),acc=0;
function loop(t){const dt=Math.min(1,(t-last)/1e3);last=t;S.time+=dt;gain(C.cps*dt);acc+=dt;if(acc>.2){acc=0;ui()}draw();requestAnimationFrame(loop)}
setInterval(()=>{hist.push(inc);inc=0;if(hist.length>60)hist.shift();chart()},1000);
setInterval(save,5000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
ui();ready=true;requestAnimationFrame(loop);
</script>
