kf=bl?[1,0,1,0,1,0,1,0].map(o=>({opacity:o})):sp?[{transform:'none'},{transform:'rotate(120deg) translateY(30%)'},{transform:'rotate(200deg) translateY(150%)',opacity:0}]:[{clipPath:'inset(0)',transform:'none'},{clipPath:'inset(100% 0 0 0)',transform:'translateY(40%)'}];
es.forEach(e=>e.animate(kf,{duration:900,easing:'steps(9)',fill:'forwards'}));await sleep(950)}
es.forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.classList.add('dead')})}
async function faint(v,w){const m=act(v);if(m.hp>0)return;await down(v);await say(`${nm(v)}は たおれた！`);
if(RL.xp&&act(w).hp>0){const g=Math.floor(bst(m.s)/2*m.L/2);await say(`${nm(w)}は ${g}の\nけいけんちを もらった！`);await gainExp(w,g)}
if(!P[v].team.some(x=>x.hp>0)){WIN=w;phase='over';M=`${w+1}Pの しょうり！`;draw()}}
async function mv(p,i){const q=1-p,a=act(p),d=act(q),k=SP[a.s][4][i],m=MV[k];if(a.pp[i]>0)a.pp[i]--;
await say(`${nm(p)}の ${m[0]}！`);await fxm(p,k);
if(m[6]=='h'){const b=a.hp;a.hp=Math.min(a.st[0],a.hp+(a.st[0]>>1));draw();if(a.hp>b)pop(p,'+'+(a.hp-b),'hl');await say(a.hp>b?`${nm(p)}は たいりょくを\nかいふくした！`:'しかし うまく きまらなかった！');return}
if(m[4]&&R()*100>=m[4]){await say('しかし こうげきは はずれた！');return}
const r=dmg(a,d,k);if(!r.e){await say(`${nm(q)}には こうかが ないようだ…`);return}
let x=r.d,sash=0;if(d.it=='fs'&&d.hp==d.st[0]&&x>=d.hp){x=d.hp-1;sash=1;d.it=''}
d.hp=Math.max(0,d.hp-x);draw();hitfx(q,x,r,m[1]);await fx(q,'hit',450);
if(r.crit)await say('きゅうしょに あたった！',800);
if(r.e!=1)await say(r.e>1?'こうかは ばつぐんだ！':'こうかは いまひとつのようだ…',900);
if(sash)await say(`${nm(q)}は きあいのタスキで\nもちこたえた！`);
if(m[6]=='d'&&x){const b0=a.hp;a.hp=Math.min(a.st[0],a.hp+Math.max(1,x>>1));draw();pop(p,'+'+(a.hp-b0),'hl');await say(`${nm(q)}から たいりょくを\nすいとった！`)}
if(d.hp>0&&d.it=='sb'&&d.hp*2<=d.st[0]){d.it='';d.hp=Math.min(d.st[0],d.hp+(d.st[0]>>2));draw();pop(q,'+HP','hl');await say(`${nm(q)}は オボンのみで\nたいりょくを かいふくした！`)}
if(a.it=='lo'&&a.hp>0){a.hp=Math.max(0,a.hp-Math.max(1,a.st[0]/10|0));draw();pop(p,'-'+Math.max(1,a.st[0]/10|0),'dm');await say(`${nm(p)}は いのちが けずられた！`,800)}
await faint(q,p);if(phase!='over')await faint(p,q)}
async function item(p,c){const S=P[p],m=S.team[c.to],B=BAG[c.k];S.bag[c.k]--;const h0=m.hp;await say(`${p+1}Pは ${B[0]}を\nつかった！`);
if(c.k=='rv')m.hp=m.st[0]>>1;else if(c.k=='el')m.pp=SP[m.s][4].map(k=>MV[k][5]);else m.hp=Math.min(m.st[0],m.hp+B[1]);if(S.a==c.to&&c.k!='el'&&m.hp>h0)pop(p,'+'+(m.hp-h0),'hl');
draw();await say(`${SP[m.s][0]}の ${c.k=='el'?'PP':'HP'}が かいふくした！`)}
const reset=()=>P.forEach(S=>{S.ch=null;S.pend=null;S.ui='cmd'});
// ポケモン入れ替え演出（すべて時間(ms)基準のWeb Animations/タイマーなので、60Hzでも144Hzでも同じ速さ）
const sEls=p=>[0,1].map(h=>$(h,'.pf.'+(h==p?'me':'foe')+' .em'));
function spark(p,inn){[0,1].forEach(h=>{const f=$(h,'.field'),T=$(h,'.pf.'+(h==p?'me':'foe')),cx=T.offsetLeft+T.offsetWidth/2,cy=T.offsetTop+T.offsetHeight/2,u=Math.max(4,f.offsetWidth/55|0),a=inn?[1,12]:[12,1];
for(let i=0;i<16;i++){const g=i*Math.PI/8,s=u*(i%2?2:3),e=document.createElement('i');e.className='pt';
e.style.cssText=`left:${cx-s/2}px;top:${cy-s/2}px;width:${s}px;height:${s}px;border-radius:50%;background:${i%2?'#fff':'#a8e8ff'};box-shadow:0 0 ${u*2}px #fff`;f.append(e);
e.animate([{transform:`translate(${Math.cos(g)*a[0]*u}px,${Math.sin(g)*a[0]*u}px)`,opacity:inn?1:0},{opacity:1,offset:.35},{transform:`translate(${Math.cos(g)*a[1]*u}px,${Math.sin(g)*a[1]*u}px)`,opacity:0}],{duration:750,easing:'ease-out',fill:'forwards'}).onfinish=()=>e.remove()}})}
async function swOut(p){spark(p,0);
sEls(p).forEach(e=>e.animate([{filter:'none',transform:'scale(1)',opacity:1},{filter:'brightness(0) invert(1)',transform:'scale(1)',opacity:1,offset:.35},{filter:'brightness(0) invert(1)',transform:'scale(0)',opacity:0}],{duration:700,easing:'ease-in',fill:'forwards'}));
await sleep(760)}
function swIn(p){sEls(p).forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.classList.remove('dead');
e.animate([{filter:'brightness(0) invert(1)',transform:'scale(0)',opacity:0},{filter:'brightness(0) invert(1)',transform:'scale(1.15)',opacity:1,offset:.5},{filter:'none',transform:'scale(1)',opacity:1}],{duration:800,easing:'ease-out'})});
spark(p,1);return sleep(850)}
async function swapMon(p,to,out){if(out){await say(`${nm(p)}、もどれ！`,600);await swOut(p)}
P[p].a=to;M=`ゆけっ！ ${nm(p)}！`;draw();await Promise.all([swIn(p),sleep(500*RL.sp)])}
let WIN=0;
function pop(v,t,c,row=0){[0,1].forEach(h=>{const f=$(h,'.field'),T=$(h,'.pf.'+(h==v?'me':'foe')),e=document.createElement('i');e.className='pop '+c;e.textContent=t;
e.style.left=T.offsetLeft+T.offsetWidth/2+'px';e.style.top=T.offsetTop+T.offsetHeight*.25+row*30+'px';f.append(e);
e.animate([{transform:'translateY(10px) scale(.3)',opacity:0},{transform:'translateY(-6px) scale(1.25)',opacity:1,offset:.18},{transform:'translateY(-14px) scale(1)',opacity:1,offset:.7},{transform:'translateY(-34px) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>e.remove()})}
function shake(s){if(!RL.an)return;[0,1].forEach(h=>{const a=4+10*s,kf=[];for(let i=0;i<10;i++){const d=1-i/10;kf.push({translate:`${(i%2?-1:1)*a*d}px ${(i%3?1:-1)*a*d*.6}px`})}kf.push({translate:'0 0'});$(h,'.field').animate(kf,{duration:420,easing:'linear'})})}
function flash(c,o,ms){if(!RL.an)return;[0,1].forEach(h=>{const l=$(h,'.fl');l.style.background=c;l.animate([{opacity:o},{opacity:0}],{duration:ms,easing:'ease-out'})})}
function ban(m){[0,1].forEach(h=>{const b=$(h,'.ban'),c=TC[m[1]];b.textContent=m[0];b.style.background=`linear-gradient(90deg,#0000,${c} 14%,${c} 86%,#0000)`;
b.animate([{transform:'translateX(-60%)',opacity:0},{transform:'translateX(0)',opacity:1,offset:.2},{transform:'translateX(0)',opacity:1,offset:.75},{transform:'translateX(60%)',opacity:0}],{duration:1000,easing:'ease-out'})})}
function hitfx(v,x,r,t){pop(v,'-'+x,r.crit?'cr':'dm');let row=1;
if(r.e>1)pop(v,'ばつぐん！','se',row++);else if(r.e<1)pop(v,'いまひとつ','nv',row++);
if(r.crit)pop(v,'きゅうしょ！','cr',row);
const pw=Math.min(1,x/(act(v).st[0]*.5||1));shake(.3+pw*.7+(r.e>1?.3:0));flash(r.e>1||r.crit?'#fff':TC[t],r.e>1?.8:.5,r.e>1?420:300)}
function cnt(el,v,mx){if(el._v===void 0){el._v=v;el._to=v;el._mx=mx;el.textContent=v+'/'+mx;return}
if(el._to===v&&el._mx===mx)return;const f=el._v,t0=performance.now(),id=el._id=(el._id||0)+1;el._to=v;el._mx=mx;
const st=t=>{if(el._id!=id)return;const k=Math.min(1,Math.max(0,(t-t0)/800)),c=Math.round(f+(v-f)*(1-(1-k)**2));el._v=c;el.textContent=c+'/'+mx;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
requestAnimationFrame(function tk(t){document.querySelectorAll('.msg').forEach(el=>{if(el._t==null)return;const n=Math.min(el._t.length,Math.max(0,Math.floor((t-el._s)/(28*RL.sp))));if(el._n!==n){el._n=n;el.textContent=el._t.slice(0,n)}});requestAnimationFrame(tk)});
function fin(p){const bt=$(p,'.bt');let f=bt.querySelector('.fin');if(phase!='over'){f&&f.remove();return}
if(f)return;const w=WIN==p;f=document.createElement('div');f.className='fin '+(w?'win':'lose');
f.innerHTML=`<div class="ft">${w?'YOU WIN!':'YOU LOSE…'}</div>`+(w?Array.from({length:48},()=>`<i style="left:${R()*100}%;background:hsl(${R()*360} 90% 60%);animation-duration:${2+R()*2}s;animation-delay:${-R()*3}s"></i>`).join(''):'');bt.append(f)}
async function splash(){const hs=[0,1].map(h=>{const d=document.createElement('div'),mons=pl=>P[pl].team.map(m=>`<img src="${IMG[m.s]||spr(SP[m.s][1])}" alt="">`).join('');d.className='vs';
d.innerHTML=`<div class="vb b"><b>${2-h}P</b><div>${mons(1-h)}</div></div><div class="vt">VS</div><div class="vb a"><b>${h+1}P</b><div>${mons(h)}</div></div>`;$(h,'.bt').append(d);return d});
await sleep(1800);hs.forEach(d=>d.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=()=>d.remove());await sleep(300)}
async function turn(){phase='run';draw();
const sc=p=>{const c=P[p].ch;return(c.t=='sw'?9e3:c.t=='it'?8e3:({p2:2,p1:1}[MV[SP[act(p).s][4][c.i]][6]]||0)*1e3+act(p).st[5])+R()},s=[sc(0),sc(1)],ord=s[0]>=s[1]?[0,1]:[1,0];
for(const p of ord){if(phase=='over')return;const c=P[p].ch;
if(c.t=='sw')await swapMon(p,c.to,1);
else if(c.t=='it')await item(p,c);else if(act(p).hp>0)await mv(p,c.i)}
if(phase=='over')return;
for(const p of [0,1]){const m=act(p);if(m.hp>0&&m.it=='lf'&&m.hp<m.st[0]){m.hp=Math.min(m.st[0],m.hp+Math.max(1,m.st[0]>>4));draw();pop(p,'+HP','hl');await say(`${nm(p)}は たべのこしで\nたいりょくを かいふくした！`)}}
const nd=[0,1].filter(need);reset();phase=nd.length?'sw':'pick';nd.forEach(p=>P[p].ui='party');draw()}
async function doSw(){const nd=[0,1].filter(p=>P[p].ch&&need(p));phase='run';draw();
for(const p of nd)await swapMon(p,P[p].ch.to,0);reset();phase='pick';draw()}
async function begin(){P.forEach(S=>{S.team=S.pk.map((k,j)=>mk(k,RL.lv,RL.it?HI[S.hi[j]][0]:''));S.a=0;S.bag={po:3,su:2,hy:1,rv:1,el:1}});reset();
HOLD=1;document.querySelectorAll('.pf .em').forEach(e=>e.classList.add('dead'));phase='run';draw();await splash();await say('1Pと 2Pの\nポケモンバトル かいし！',1300);HOLD=0;M='ゆけっ！';draw();await Promise.all([swIn(0),swIn(1),sleep(500*RL.sp)]);phase='pick';draw()}
function setup(p,a,i,k){const S=P[p];
if(a=='pk'){const j=S.pk.indexOf(k);S.foc=k;if(j>=0){S.pk.splice(j,1);S.hi.splice(j,1)}else if(S.pk.length<RL.n){S.pk.push(k);S.hi.push(0)};S.rdy=0}
else if(a=='ho'){S.hi[i]=(S.hi[i]+1)%HI.length;S.rdy=0}
else if(a=='lv'){S.lv=Math.min(100,Math.max(5,S.lv+i));S.rdy=0}
else if(a=='rdy'&&S.pk.length==RL.n)S.rdy=!S.rdy;
draw();if(P[0].rdy&&P[1].rdy)begin()}
function go(p,a,i,k){const S=P[p];
if(phase=='rules')return rules(p,a,i,k);if(phase=='setup')return setup(p,a,i,k);
if(phase=='over'){if(a=='again'){phase='rules';P.forEach(x=>x.rdy=0);draw()}return}
if(S.ch)return;
if(a=='no'){S.pend=null;draw();return}
if(a=='ok'){if(!S.pend)return;S.ch=S.pend;S.pend=null}
else if(S.pend)return;
else if(phase=='sw'){if(a=='sw'&&need(p))S.pend={t:'sw',to:i}}
else if(phase=='pick'){
if(a=='fight'||a=='bag'||a=='party')S.ui=a;else if(a=='back')S.ui='cmd';
else if(a=='mv')S.pend={t:'mv',i};else if(a=='bi'){S.bi=k;S.ui='tgt'}
else if(a=='tg')S.pend={t:'it',k:S.bi,to:i};else if(a=='sw')S.pend={t:'sw',to:i}}
else return;
draw();if(phase=='pick'&&P[0].ch&&P[1].ch)turn();
else if(phase=='sw'&&[0,1].every(q=>!need(q)||P[q].ch))doSw()}
H.forEach(h=>h.innerHTML=sk);
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset;go(H.indexOf(b.closest('.half')),d.a,+d.i,d.k)});
draw();
</script></body></html>
