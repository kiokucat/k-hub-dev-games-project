for(const q of [ME,FO])for(const y of [0,SH])for(const s of [-1,1]){const Q=add(add(q,[0,y,0]),mul(b.r,s*.95)),d=sub(Q,p),z=dot(d,b.f);if(z<.6)return 0;const x=W/2+dot(d,b.r)/z*F,yy=Ht/2-dot(d,b.u)/z*F;if(x<W*.06||x>W*.94||yy<Ht*.08||yy>Ht*.92)return 0}return 1}
function solve(i,W,Ht){const k=i+':'+W+'x'+Ht;let s=SC.get(k);if(s)return s;const v=VW[i];
if(v.sho){const hd=nrm([ME[0]-FO[0],0,ME[2]-FO[2]]),rt=cross(UP,mul(hd,-1));s={p:add(add(ME,mul(hd,4.2)),add(mul(rt,.9),[0,2.4,0])),t:[FO[0],.7,FO[2]],f:56}}
else{const d=nrm(v.d);let r=4;for(;r<70;r+=.5)if(fits(add(MID,mul(d,r)),MID,FOV,W,Ht))break;s={p:add(MID,mul(d,r)),t:MID,f:FOV}}
if(SC.size>60)SC.clear();SC.set(k,s);return s}
/* 時間で変わる背景 */
const KF=[
{n:'夕暮れ',top:[37,18,95],mid:[196,58,138],hor:[255,178,94],sun:[255,232,170],alt:.07,sz:1.1,g1:[42,138,106],g2:[32,114,94],pad:[95,240,192],st:.18,cl:[255,208,224]},
{n:'夜',top:[6,6,30],mid:[22,22,78],hor:[70,56,130],sun:[232,238,255],alt:.5,sz:.6,g1:[22,64,76],g2:[14,50,64],pad:[120,200,255],st:1,cl:[80,80,140]},
{n:'朝焼け',top:[60,90,170],mid:[255,150,150],hor:[255,214,150],sun:[255,240,190],alt:.12,sz:1,g1:[70,150,100],g2:[58,132,90],pad:[140,255,200],st:.1,cl:[255,225,215]},
{n:'昼',top:[60,140,235],mid:[130,200,250],hor:[212,238,255],sun:[255,252,220],alt:.62,sz:.8,g1:[88,176,80],g2:[74,160,68],pad:[170,255,150],st:0,cl:[255,255,255]}];
const mixT=(a,b,k)=>{const o={};for(const x in a)o[x]=Array.isArray(a[x])?lv(a[x],b[x],k):typeof a[x]=='number'?a[x]+(b[x]-a[x])*k:a[x];return o},
C=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const STARS=Array.from({length:90},(_,i)=>{const az=(i*2.399)%TWO,el=.06+((i*.618)%1)*1.1;return[Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)]});
let T0=performance.now(),OFF=0,E=0,pp='title';
const idle=x=>x=='title'||x=='setup'||x=='rules'||x=='over';
function tag(fl,t){let e=fl.querySelector('.ct');if(!e){e=document.createElement('div');e.className='ct';fl.append(e)}e.textContent='📷 '+t;e.getAnimations().forEach(a=>a.cancel());e.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none',offset:.1},{opacity:1,offset:.8},{opacity:0}],{duration:2600})}
function render(p,now,th,IDX){const fl=$(p,'.field'),bt=$(p,'.bt');if(bt.hidden)return;const W=fl.clientWidth,Ht=fl.clientHeight;if(!W||!Ht)return;
let st=fl._cm;if(!st)st=fl._cm={cv:fl.querySelector('.cv')};
const cv=st.cv,dpr=Math.min(devicePixelRatio||1,1.5),bw=Math.round(W*dpr),bh=Math.round(Ht*dpr);if(cv.width!=bw||cv.height!=bh){cv.width=bw;cv.height=bh}
const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
/* カメラ */
const base=solve(IDX,W,Ht),ang=(now-T0)*ROT/1000,rt=(c,i)=>VW[i].sho?{p:add(ME,ry(sub(c.p,ME),Math.sin(ang*.8)*.55)),t:c.t,f:c.f}:{p:add(c.t,ry(sub(c.p,c.t),ang)),t:c.t,f:c.f};
if(st.e!==E){st.e=E;st.i=IDX;st.fb=base;st.fi=IDX;st.t0=-1e9;tag(fl,VW[IDX].n)}
else if(st.i!==IDX){st.fb=st.pb;st.fi=st.i;st.i=IDX;st.t0=now;tag(fl,VW[IDX].n)}
st.pb=base;
const to=rt(base,IDX),k=Math.min(1,(now-st.t0)/1800),fr=rt(st.fb,st.fi),e2=ease(k),cam=k>=1?to:{p:lv(fr.p,to.p,e2),t:lv(fr.t,to.t,e2),f:fr.f+(to.f-fr.f)*e2};
const bs=basis(cam.p,cam.t),F=Ht/2/Math.tan(cam.f*PI/360),pit=Math.asin(Math.max(-1,Math.min(1,-bs.f[1]))),hy=Ht/2-F*Math.tan(Math.min(pit,1.5));
const cs=Q=>{const d=sub(Q,cam.p);return[dot(d,bs.r),dot(d,bs.u),dot(d,bs.f)]},sx=c=>W/2+c[0]/c[2]*F,sy=c=>Ht/2-c[1]/c[2]*F,
pd=D=>{const c=[dot(D,bs.r),dot(D,bs.u),dot(D,bs.f)];return c[2]>.02?[sx(c),sy(c)]:null};
g.clearRect(0,0,W,Ht);
/* 空 */
if(hy>0){const gr=g.createLinearGradient(0,hy-Ht*.95,0,hy);gr.addColorStop(0,C(th.top));gr.addColorStop(.6,C(th.mid));gr.addColorStop(1,C(th.hor));g.fillStyle=gr;g.fillRect(0,0,W,Math.min(Ht,hy)+2);
if(th.st>.02)STARS.forEach((D,i)=>{const q=pd(D);if(!q||q[1]>hy)return;g.fillStyle=`rgba(255,255,255,${th.st*(.5+.5*Math.sin(now/600+i*7))})`;const s=i%5?1.5:2.6;g.fillRect(q[0],q[1],s,s)});
const q=pd(nrm([.35,th.alt,1]));if(q){const r=F*.075*th.sz,gl=g.createRadialGradient(q[0],q[1],0,q[0],q[1],r*5);gl.addColorStop(0,C(th.sun,.55));gl.addColorStop(1,C(th.sun,0));g.fillStyle=gl;g.fillRect(q[0]-r*5,q[1]-r*5,r*10,r*10);g.fillStyle=C(th.sun);g.beginPath();g.arc(q[0],q[1],r,0,TWO);g.fill()}
for(let i=0;i<6;i++){const az=(i*1.05+now*.00003)%TWO,e=.14+.08*(i%3),q=pd([Math.sin(az)*Math.cos(e),Math.sin(e),Math.cos(az)*Math.cos(e)]);if(!q||q[1]>hy)continue;const w=F*(.2+.05*(i%2)),y=q[1];g.fillStyle=C(th.cl,.8);g.beginPath();g.ellipse(q[0],y,w*.5,w*.12,0,0,TWO);g.ellipse(q[0]-w*.18,y-w*.08,w*.22,w*.12,0,0,TWO);g.ellipse(q[0]+w*.1,y-w*.12,w*.26,w*.14,0,0,TWO);g.fill()}}
/* 地面（チェッカー） */
if(hy<Ht){g.fillStyle=C(lv(th.g1,th.g2,.5));g.fillRect(0,Math.max(0,hy),W,Ht);
const GN=12,CL=2,N=2*GN+1,lat=[];for(let j=-GN;j<=GN;j++)for(let i=-GN;i<=GN;i++)lat.push(cs([i*CL,0,j*CL]));
const A=new Path2D,B=new Path2D;
for(let j=-GN;j<GN;j++)for(let i=-GN;i<GN;i++){const q=[lat[(j+GN)*N+i+GN],lat[(j+GN)*N+i+1+GN],lat[(j+GN+1)*N+i+1+GN],lat[(j+GN+1)*N+i+GN]],o=[];
for(let n=0;n<4;n++){const a=q[n],b=q[(n+1)%4],ia=a[2]>=Z0,ib=b[2]>=Z0;if(ia)o.push(a);if(ia!=ib){const t=(Z0-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Z0])}}
if(o.length<3)continue;const pa=(i+j)&1?B:A;o.forEach((c,n)=>n?pa.lineTo(sx(c),sy(c)):pa.moveTo(sx(c),sy(c)));pa.closePath()}
g.fillStyle=C(th.g1);g.fill(A);g.fillStyle=C(th.g2);g.fill(B);
if(hy>-Ht*.4){const hh=Math.min(Ht*.35,Ht-hy),y0=Math.max(0,hy),gr=g.createLinearGradient(0,hy,0,hy+hh);gr.addColorStop(0,C(th.hor,.95));gr.addColorStop(1,C(th.hor,0));g.fillStyle=gr;g.fillRect(0,y0,W,hy+hh-y0)}}
/* 台座 */
const disc=(q,y,rad)=>{const pts=[];for(let n=0;n<28;n++){const a=n/28*TWO,c=cs([q[0]+Math.cos(a)*rad,y,q[2]+Math.sin(a)*rad]);if(c[2]<Z0)return 0;pts.push([sx(c),sy(c)])}g.beginPath();pts.forEach((s,n)=>n?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]));g.closePath();return 1};
[ME,FO].forEach(q=>{if(disc(q,0,1.6)){g.fillStyle='rgba(0,0,0,.28)';g.fill()}if(disc(q,-.16,1.25)){g.fillStyle=C(mul(th.pad,.4));g.fill()}if(disc(q,0,1.25)){g.fillStyle=C(th.pad,.9);g.fill()}if(disc(q,.01,.85)){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2.5;g.stroke()}});
/* ポケモン（ビルボード）: 位置と大きさを遠近で決める。わざの演出はこの位置を基準に出る */
const yq=Math.max(.5,Math.cos(pit*.85)),zs=[];
const ps=[['me',ME],['foe',FO]].map(([c,q])=>{const pf=$(p,'.pf.'+c),fz=cs(q),cc=cs([q[0],SH/2,q[2]]),ph=pf.offsetHeight||1,pw=pf.offsetWidth||1,s=Math.max(.15,Math.min(4,SH*F/Math.max(.5,cc[2])/ph)),cy=sy(fz)-ph*s*yq*.42;zs.push(cc[2]);return{pf,pw,ph,s,cx:sx(fz),cy}});
ps.forEach((o,n)=>{const s=o.pf.style;s.right='auto';s.bottom='auto';s.left=(o.cx-o.pw/2)+'px';s.top=(o.cy-o.ph/2)+'px';s.scale=o.s+' '+(o.s*yq);s.zIndex=zs[n]<=zs[1-n]?3:2})}
function frame(now){requestAnimationFrame(frame);
if(idle(pp)&&!idle(phase)){T0=now;OFF=Math.random()*4|0;E++}pp=phase;
if(phase=='title'||document.hidden)return;
const e=Math.max(0,now-T0),IDX=(3+Math.floor(e/STEP))%5,tt=e/TSTEP+OFF,i=Math.floor(tt),f=tt-i,kk=Math.max(0,Math.min(1,(f-.6)/.4)),th=mixT(KF[i%4],KF[(i+1)%4],kk*kk*(3-2*kk));
try{[0,1].forEach(p=>render(p,now,th,IDX))}catch(err){}}
requestAnimationFrame(frame);
})();
</script></body></html>
