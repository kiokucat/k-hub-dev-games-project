<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にゃんこ戦記</title>
<style>
:root{--bg:#fff3d1;--ink:#3b2610;--card:#fffaf0;--line:#3b2610;--accent:#ff8a1f;--on:#fff;--sea:#bfe6ff;--land:#a8d98a;--landl:#5c8f4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1710;--ink:#f7ead2;--card:#2c2417;--line:#f7ead2;--accent:#ffa43f;--on:#1d1710;--sea:#16324a;--land:#4b7a45;--landl:#2e5230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1710;--ink:#f7ead2;--card:#2c2417;--line:#f7ead2;--accent:#ffa43f;--on:#1d1710;--sea:#16324a;--land:#4b7a45;--landl:#2e5230;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:1000px;margin:0 auto;padding:8px}
.hidden{display:none!important}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;cursor:pointer;padding:6px 10px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(34px,8vw,64px);margin:12px 0 4px;letter-spacing:.04em}
#menu{text-align:center;padding:12px 0}
#stages{display:grid;gap:10px;max-width:420px;margin:18px auto}
.st{padding:14px;font-size:18px;font-weight:700}
.st.off{opacity:.45;cursor:not-allowed}
#help{max-width:520px;margin:12px auto;font-size:14px;line-height:1.7;text-align:left}
#top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
#top span{display:flex;gap:6px}
canvas{display:block;width:100%;aspect-ratio:1000/400;border:3px solid var(--line);border-radius:12px;background:#9ad;touch-action:manipulation}
#ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#units{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media (min-width:640px){#units{grid-template-columns:repeat(8,1fr)}}
.big{padding:10px 6px;font-weight:700;font-size:15px}
.big.ready{background:var(--accent);color:var(--on);animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.big.ready{animation:none}}
.ub{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;line-height:1.25}
.th{width:44px;height:44px}
.lv{position:absolute;right:3px;top:1px;font-size:10px;font-weight:700}
#map svg{width:100%;max-width:420px;display:block;margin:12px auto;border:3px solid var(--line);border-radius:16px}
.nd{cursor:pointer}.nd circle{fill:var(--accent);stroke:var(--line);stroke-width:2.5}.nd.lk{cursor:not-allowed}.nd.lk circle{fill:#9aa5ad}
.nd text{font-size:12px;font-weight:700;text-anchor:middle;fill:var(--on)}
.nd .lb{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.nd.nx circle{animation:pulse2 1s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{to{transform:scale(1.2)}}
.nd:focus-visible circle{stroke:#fff;stroke-width:4}
.cn{font-size:18px;font-weight:700;margin:6px 0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-width:520px;margin:8px auto}
.pb{padding:10px 4px;font-weight:700}.pb:disabled{opacity:.45;cursor:not-allowed}.pb.nx2{background:var(--accent);color:var(--on)}
#grs,#coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}
.rc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:12px;animation:pop .35s both}
.rc canvas{width:60px;height:60px}.rc i{font-style:normal;color:#e8a100}
.rc.r3{background:linear-gradient(#fff1a8,#ffc94d);color:#3b2610}.rc.r4{background:linear-gradient(#ffd6f5,#ff9be8,#ffd65a);color:#3b2610}
#coll .rc{animation:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.rc{animation:none}.nd.nx circle{animation:none}}
#gacha{text-align:center;padding:10px 0}
.row{display:flex;gap:10px;justify-content:center;margin:8px 0}.row button{padding:12px 16px;font-weight:700}
button{box-shadow:0 3px 0 var(--line)}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ub:not(.off),.big:not(.off){background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--accent) 24%,var(--card)))}
.ub .nm{font-size:11px;font-weight:700}
.ub .co{font-size:12px}
.ub .k{position:absolute;left:4px;top:1px;font-size:10px;opacity:.6}
.ub.off,.big.off{opacity:.5}
.cdb{position:absolute;inset:0;background:rgba(0,0,0,.4);transform-origin:bottom;transform:scaleY(var(--p,0));pointer-events:none}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5}
#card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:20px 26px;text-align:center;max-width:90vw}
#card h2{margin:0 0 6px;font-size:30px}
#mbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div id="app">
  <section id="menu">
    <div style="font-size:64px">🐱</div>
    <h1>にゃんこ戦記</h1>
    <div>ネコを出して、敵の城をたおそう！</div>
    <div class="cn">🥫 ネコ缶 <b id="cans2"></b></div><button id="togacha" class="big" style="padding:10px 18px">🎰 ネコガチャ</button>
    <div id="stages"></div><div id="pref"></div>
    <div id="help">
      ・地方をタップ→都道府県を選んで出撃。47都道府県を順番に制覇しよう<br>
      ・クリアでネコ缶を獲得。ガチャでネコを強化・新ネコを入手<br>
      ・ネコボタン(キー1〜8)でネコを出撃。お金は時間でたまる<br>
      ・お財布UP(Q)でお金のたまる速さと上限がアップ<br>
      ・にゃんこ砲(Space)は充填後、敵全員にダメージ＋ふっとばし<br>
      ・自分の家🏠がこわされたら負け
    </div>
  </section>
  <section id="battle" class="hidden">
    <div id="top"><b id="stname"></b><span><button id="spd">×1</button><button id="pause">⏸</button><button id="quit">やめる</button></span></div>
    <canvas id="cv" width="1000" height="400"></canvas>
    <div id="ctl">
      <button id="cannon" class="big"></button>
      <button id="wallet" class="big"></button>
      <div id="units"></div>
    </div>
  </section>
</div>
<section id="gacha" class="hidden"><div style="max-width:700px;margin:auto;padding:8px">
  <h2>🎰 ネコガチャ</h2><div class="cn">🥫 ネコ缶 <b id="cans">0</b></div>
  <div class="row"><button id="p1">1回 🥫100</button><button id="p10">10連 🥫1000</button></div>
  <div id="gmsg" aria-live="polite">同じネコが出るとLvアップ（+8%）。10連は★3以上が1体確定</div><div id="grs"></div>
  <h3>コレクション</h3><div id="coll"></div><button id="gback" style="padding:10px 24px">もどる</button></div></section>
<div id="modal" class="hidden"><div id="card"><h2 id="mt"></h2><div id="mb"></div><div id="mbtn"></div></div></div>
<script>
(()=>{
const W=1000,H=400,GY=268,GH=60;
const $=s=>document.querySelector(s);
const cv=$('#cv');let ctx=cv.getContext('2d');
const CATS=[
{name:'ネコ',emoji:'🐱',cost:50,cdw:1.5,hp:120,atk:8,range:40,spd:70,atkcd:1,kb:3,size:36},
{name:'タンク',emoji:'😾',acc:'🛡️',cost:100,cdw:3,hp:800,atk:5,range:34,spd:52,atkcd:1.3,kb:4,size:38},
{name:'バトル',emoji:'😼',acc:'⚔️',cost:150,cdw:4,hp:200,atk:30,range:52,spd:66,atkcd:1.2,kb:2,size:36},
{name:'ロング',emoji:'🙀',acc:'🏹',cost:250,cdw:7,hp:150,atk:22,range:170,spd:52,atkcd:2.2,kb:2,size:36,aoe:true},
{name:'ウシ',emoji:'🐮',cost:400,cdw:10,hp:650,atk:55,range:42,spd:130,atkcd:1.1,kb:2,size:42},
{name:'ゴッド',cost:900,cdw:24,hp:3000,atk:150,range:80,spd:48,atkcd:1.6,kb:2,size:52,aoe:true},
{name:'ニンジャ',cost:200,cdw:3,hp:100,atk:35,range:40,spd:170,atkcd:.7,kb:2,size:34},
{name:'サムライ',cost:600,cdw:14,hp:900,atk:90,range:75,spd:60,atkcd:1.4,kb:3,size:42,aoe:true}
];
const ENM={
dog:{name:'ワンコ',emoji:'🐶',hp:70,atk:7,range:30,spd:55,atkcd:1.2,kb:2,reward:12,size:34},
snake:{name:'ヘビ',emoji:'🐍',hp:90,atk:9,range:34,spd:100,atkcd:1,kb:2,reward:16,size:32},
pig:{name:'ブタ',emoji:'🐷',hp:500,atk:22,range:36,spd:40,atkcd:1.5,kb:3,reward:60,size:44},
croc:{name:'ワニ',emoji:'🐊',hp:1100,atk:45,range:55,spd:50,atkcd:1.6,kb:3,reward:120,size:50},
boss:{name:'カバ',emoji:'🦛',hp:6000,atk:120,range:70,spd:28,atkcd:2.2,kb:2,reward:600,size:86}
};
const TH=[['沖縄','#4fd0ff','#d8f8ff','#e8d9a0','#8be3cc','#62d2b4',3],['九州','#ff9d6a','#ffe3b8','#8a7a5a','#c98a62','#a6704f',0],
['四国','#8fd0ff','#eaf7ff','#6cbf4b','#a6dc90','#82c46c',5],['中国','#7fb8ff','#e0efff','#8fb85a','#b8d98e','#97c26e',0],
['近畿','#ffb3c7','#fff0f4','#8fc86a','#f4c6d6','#e2a6bd',5],['中部','#9ec7ff','#f0f7ff','#7aa860','#c9d8ea','#a8bcd6',4],
['関東','#8fb0e8','#dfe8f8','#7d8794','#aab4c6','#8d98ad',0],['東北','#a9c4e8','#eef4ff','#cfe0ea','#e2edf6','#c4d6e6',4],
['北海道','#6f8fd6','#dfe9ff','#f2f7ff','#ffffff','#dfe9f7',4]];
const PF=[['沖縄',['沖縄県']],['九州',['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県']],['四国',['香川県','徳島県','愛媛県','高知県']],
['中国',['山口県','広島県','岡山県','島根県','鳥取県']],['近畿',['和歌山県','三重県','奈良県','大阪府','兵庫県','京都府','滋賀県']],
['中部',['静岡県','愛知県','岐阜県','山梨県','長野県','福井県','石川県','富山県','新潟県']],['関東',['神奈川県','千葉県','東京都','埼玉県','茨城県','栃木県','群馬県']],
['東北',['福島県','宮城県','山形県','岩手県','秋田県','青森県']],['北海道',['北海道']]];
const STAGES=[],RS=[];
TH.forEach((t,r)=>{RS.push(STAGES.length);PF[r][1].forEach(nm=>{
  const i=STAGES.length,d=i*8/46;
  STAGES.push({name:(i+1)+' '+nm,region:t[0],r,base:Math.round(2500+d*d*280+d*1200),mul:{hp:1.1+.3*d,atk:1.1+.25*d},
   sky:[t[1],t[2]],gr:t[3],hill:[t[4],t[5]],deco:t[6],waves:[
   {t:'dog',start:2,every:Math.max(2.4,7-.55*d)},{t:'snake',start:Math.max(5,20-2*d),every:Math.max(4,15-1.2*d)},
   {t:'pig',start:Math.max(14,55-5*d),every:Math.max(9,40-3.5*d),max:d<2?3:99}]
   .concat(d>=1?[{t:'croc',start:Math.max(30,60-3*d),every:Math.max(14,35-2.5*d)}]:[])
   .concat(d>=3?[{t:'boss',at:.6,cnt:1}]:[]).concat(d>=6?[{t:'boss',at:.25,cnt:1}]:[]).concat(i===46?[{t:'boss',at:.45,cnt:1}]:[])});
});});
CATS.forEach((c,i)=>{c.idx=i;c.r=[1,1,2,2,3,4,2,3][i];c.ex=i>5?1:0;});for(const k in ENM)ENM[k].key=k;
let save={cleared:0,cans:300,lv:CATS.map(()=>1),own:CATS.map(c=>c.ex?0:1)};
try{const s=JSON.parse(localStorage.getItem('nyanko_save')||'null');if(s&&typeof s.cleared==='number'){save.cleared=s.cleared;if(typeof s.cans==='number')save.cans=s.cans;CATS.forEach((c,i)=>{if(s.lv&&s.lv[i]>0)save.lv[i]=s.lv[i];if(s.own&&s.own[i])save.own[i]=1;});}}catch(e){}
function persist(){try{localStorage.setItem('nyanko_save',JSON.stringify(save));}catch(e){}}
const cap=l=>200+300*l,inc=l=>12+5*l,wcost=l=>90*l;
let G=null,now=0;

function mk(side,def,mul){
  const m=mul||{hp:1,atk:1};
  const hp=def.hp*m.hp;
  return {side,dir:side,def,x:side>0?100:900,y:GY+10+Math.random()*(GH-16),hp,max:hp,atk:def.atk*m.atk,cd:0,kbT:0,lunge:0,hitF:0,moving:false,phase:Math.random()*6.28,dead:false};
}
function fx(o){o.max=o.life;G.fx.push(o);}
function pop(x,y,txt,col){fx({type:'t',x,y,vx:0,vy:-45,life:0.8,txt,col});}
function puff(x,y,n,col){for(let i=0;i<n;i++)fx({type:'c',x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*120,life:0.5,r:3+Math.random()*4,col});}

function hurt(o,dmg,force){
  const seg=o.max/o.def.kb,before=Math.ceil(o.hp/seg-1e-9);
  o.hp-=dmg;o.hitF=0.1;
  pop(o.x,o.y-o.def.size-8,Math.round(dmg),o.side>0?'#ff6a55':'#ffffff');
  fx({type:'s',x:o.x,y:o.y-o.def.size*.7,vx:0,vy:0,life:0.22});
  if(o.hp<=0){
    o.dead=true;puff(o.x,o.y-20,8,'#ffffff');fx({type:'u',u:o,x:o.x,y:o.y,vx:-o.dir*170,vy:-280,life:0.75});
    if(o.side<0){const r=o.def.reward;G.money=Math.min(cap(G.wlv),G.money+r);pop(o.x,o.y-o.def.size-24,'+¥'+r,'#ffe14d');}
    return;
  }
  if(force||Math.ceil(o.hp/seg-1e-9)<before){o.kbT=force?0.45:0.3;o.cd=o.def.atkcd*0.6;}
}
function hurtBase(side,dmg){
  if(side>0){G.eb-=dmg;G.shake=Math.max(G.shake,.12);pop(900,GY-20,Math.round(dmg),'#fff');if(G.eb<=0){G.eb=0;end(true);}}
  else{G.cb-=dmg;G.shake=Math.max(G.shake,.12);pop(100,GY-20,Math.round(dmg),'#ff6a55');if(G.cb<=0){G.cb=0;end(false);}}
}
function strike(u,t,base){
  if(base){hurtBase(u.side,u.atk);puff(u.side>0?905:95,u.y-30,4,'#ffd0a0');return;}
  if(u.def.aoe){
    for(const o of G.units){if(o.side===u.side||o.dead)continue;const d=(o.x-u.x)*u.dir;if(d>=-20&&d<=u.def.range)hurt(o,u.atk);}
  }else hurt(t,u.atk);
}
function stepUnit(u,dt){
  const d=u.def;
  if(u.lunge>0)u.lunge-=dt;
  if(u.hitF>0)u.hitF-=dt;
  u.moving=false;
  if(u.kbT>0){
    u.kbT-=dt;u.x-=u.dir*300*dt*Math.max(0,u.kbT/0.3);
    u.x=Math.max(95,Math.min(905,u.x));return;
  }
  let tgt=null,best=1e9,baseT=false;
  for(const o of G.units){
    if(o.side===u.side||o.dead)continue;
    const dist=(o.x-u.x)*u.dir;
    if(dist>=-30&&dist<=d.range&&dist<best){best=dist;tgt=o;}
  }
  if(!tgt){const bx=u.side>0?910:90;if((bx-u.x)*u.dir<=d.range)baseT=true;}
  if(tgt||baseT){
    u.cd-=dt;
    if(u.cd<=0){u.cd=d.atkcd;u.lunge=0.18;strike(u,tgt,baseT);}
  }else{
    u.moving=true;u.x+=u.dir*d.spd*dt;
  }
}
function spawnE(t){
  G.units.push(mk(-1,ENM[t],G.stage.mul));
  if(t==='boss')pop(800,GY-80,'ボス出現！','#ff4d4d');G.shake=.6;
}
function update(dt){
  G.t+=dt;
  G.money=Math.min(cap(G.wlv),G.money+inc(G.wlv)*dt);
  G.charge=Math.min(1,G.charge+dt/30);
  for(let i=0;i<CATS.length;i++)if(G.cdT[i]>0)G.cdT[i]-=dt;
  for(const v of G.wv){
    const w=v.w;
    if(w.at!=null){
      if(v.n<1&&G.eb/G.ebMax<=w.at){v.n=1;for(let k=0;k<(w.cnt||1);k++)spawnE(w.t);}
      continue;
    }
    if(G.t>=v.next&&v.n<(w.max||9999)){
      v.n++;v.next=G.t+w.every*(0.9+Math.random()*0.2);
      if(G.units.filter(u=>u.side<0).length<16)spawnE(w.t);
    }
  }
  for(const u of G.units.slice()){if(!u.dead&&!G.over)stepUnit(u,dt);}
  G.units=G.units.filter(u=>!u.dead);
  for(const f of G.fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.type==='c')f.vy+=300*dt;else if(f.type==='u')f.vy+=650*dt;}
  G.fx=G.fx.filter(f=>f.life>0);
  if(G.beam>0)G.beam-=dt;
  if(G.shake>0)G.shake-=dt;
}
function deploy(i){
  if(!G||G.over||G.paused)return;
  const c=CATS[i];
  if(!save.own[i]||G.money<c.cost||G.cdT[i]>0)return;
  G.money-=c.cost;G.cdT[i]=c.cdw;{const m=1+.08*(save.lv[i]-1);G.units.push(mk(1,c,{hp:m,atk:m}));}
}
function upWallet(){
  if(!G||G.over||G.paused||G.wlv>=8)return;
  const c=wcost(G.wlv);
  if(G.money>=c){G.money-=c;G.wlv++;pop(500,60,'お財布UP！','#ffe14d');}
}
function fire(){
  if(!G||G.over||G.paused||G.charge<1)return;
  G.charge=0;G.beam=0.5;G.shake=.45;
  for(const o of G.units.slice())if(o.side<0&&!o.dead)hurt(o,200,true);
}
function end(win){
  G.over=true;
  const first=win&&G.i>=save.cleared,gain=win?(first?300:80):10;
  if(first)save.cleared=G.i+1;
  save.cans+=gain;persist();
  const m=$('#mbtn');m.innerHTML='';
  $('#mt').textContent=win?(G.i===STAGES.length-1?'👑 全国制覇！！':'🎉 勝利！'):'💥 敗北…';
  selR=-1;
  $('#mb').textContent=(win?'敵の城をたおした！':'おうちがこわされてしまった…')+'　🥫 ネコ缶 +'+gain+(first?'（初クリア）':'');
  const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;m.appendChild(b);};
  if(win&&G.i<STAGES.length-1){const n=G.i+1;add('次のステージ',()=>start(n));}
  const r=G.i;add('もう一回',()=>start(r));
  add('🎰 ガチャ',()=>{showMenu();openGacha();});add('マップ',showMenu);
  $('#modal').classList.remove('hidden');
}
function start(i){
  const S=STAGES[i];
  G={i,stage:S,units:[],fx:[],t:0,money:150,wlv:1,cb:2500,cbMax:2500,eb:S.base,ebMax:S.base,charge:0,beam:0,shake:0,

  const pool=CATS.map((c,i)=>i).filter(i=>CATS[i].r>=minR);
  let x=Math.random()*pool.reduce((s,i)=>s+WT[i],0);
  for(const i of pool){x-=WT[i];if(x<0)return i;}
  return pool[0];

function pull(n){
  const cost=n*100;

  for(let k=0;k<n;k++)res.push(roll(n===10&&k===9&&!res.some(i=>CATS[i].r>=3)?3:0));
  const out=res.map(i=>{
    let tag;
    if(!save.own[i]){save.own[i]=1;tag='NEW!';}
    else if(save.lv[i]<20){save.lv[i]++;tag='Lv'+save.lv[i]+' UP';}
    else{save.cans+=30;tag='MAX +30缶';}
    return {i,tag};

    const d=document.createElement('div');d.className='rc r'+CATS[o.i].r;d.style.animationDelay=(k*0.12)+'s';
