<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLOCKLAND</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root{--bg:#f1efe6;--pn:#fff;--tx:#1b1d1f;--mu:#666b6f;--bd:#cfcbbd;--ac:#3b7f36;--at:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#16181b;--pn:#1f2327;--tx:#ecefe9;--mu:#9aa19a;--bd:#363c42;--ac:#6fcf68;--at:#0b170b;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc3ff;font-family:'DotGothic16',sans-serif;color:var(--tx);-webkit-user-select:none;user-select:none}
.material-symbols-outlined{font-size:1.25em;vertical-align:-.22em}
.fill{font-variation-settings:'FILL' 1}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:1px 1px 0 #000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#info{position:absolute;top:10px;left:12px;font-size:14px;line-height:1.6}
#cross{position:fixed;left:50%;top:50%;width:31px;height:31px;margin:-15px;background:var(--cr) center/100% 100% no-repeat;image-rendering:pixelated;mix-blend-mode:difference}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,#c0141f 135%);transition:opacity .55s}#flash.on{opacity:1;transition:none}
#prog{position:fixed;left:50%;top:calc(50% + 22px);width:60px;height:5px;margin-left:-30px;background:#0006}
#prog i{display:block;height:100%;width:0;background:#fff}
#tip{position:absolute;bottom:112px;width:100%;text-align:center;font-size:16px;transition:opacity .6s}
#hot{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:grid;gap:4px}
#stats{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#hp,#fd{display:flex;font-size:22px;text-shadow:none}
#fd{color:#e8a33a;flex-direction:row-reverse}
#fd .o{opacity:.25}
.ht{position:relative;width:27px;height:27px;background:var(--c,var(--hc)) center/100% 100% no-repeat;image-rendering:pixelated}
.ht.f:after,.ht.h:after{content:"";position:absolute;inset:0;background:var(--hf) center/100% 100% no-repeat;image-rendering:pixelated}.ht.h:after{background-image:var(--hh)}
#hp.bl .ht{--c:var(--hcb)}
#arm{display:flex}#arm[hidden]{display:none}
.ar{width:27px;height:27px;background:var(--ae) center/100% 100% no-repeat;image-rendering:pixelated}.ar.f{background-image:var(--af)}.ar.h{background-image:var(--ah)}
body.mob .ht,body.mob .ar{width:18px;height:18px}
#bar{display:flex;gap:4px;padding:4px;background:#0007}
#bar div{position:relative;width:48px;height:48px;border:2px solid #fff3;background:#0006;display:grid;place-items:center}
#bar div.on:after{content:"";position:absolute;inset:-6px -5px -5px;background:var(--sel) center/100% 100% no-repeat;image-rendering:pixelated;pointer-events:none}
#bar .n{position:absolute;left:3px;top:1px;font-size:10px;font-style:normal;color:#fffb}
.dur{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#000a}.dur i{display:block;height:100%;width:calc(var(--d)*1%);background:hsl(calc(var(--d)*1.2),85%,50%)}
.sg4{grid-template-columns:repeat(4,1fr)}#eqg button small{font-size:10px}
#ctab{grid-template-columns:repeat(3,1fr)}
img{image-rendering:pixelated;width:32px;height:32px}
#bar b,#grid b,.sg b{position:absolute;right:3px;bottom:0;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#0006;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.card{background:var(--pn);border:2px solid var(--bd);padding:22px;width:min(92vw,440px);max-height:90vh;overflow:auto;display:grid;gap:12px;box-sizing:border-box}
h1{margin:0;font-size:30px;letter-spacing:.08em}
h1 .material-symbols-outlined{color:var(--ac)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:.6em;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
.btn{font:inherit;padding:.65em 1em;border:2px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;display:inline-flex;gap:.4em;align-items:center;justify-content:center}
.btn.on,.pri{background:var(--ac);color:var(--at);border-color:var(--ac)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
ul{margin:0;padding:0;list-style:none;font-size:13px;color:var(--mu);line-height:1.7}
#theme{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;max-height:55vh;overflow:auto}
#grid button{position:relative;height:48px;display:grid;place-items:center;border:2px solid var(--bd);background:var(--bg);cursor:pointer;padding:0}
#grid button:hover,#grid button:focus-visible{border-color:var(--ac);outline:none}
small{color:var(--mu)}
.kr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.kr .btn{min-width:8em;padding:.4em .8em}.kr .row{flex:1;align-items:center}
#kl{display:grid;gap:6px;max-height:42vh;overflow:auto}
input[type=range]{padding:0}input[type=checkbox]{flex:none;width:20px;height:20px;padding:0}
.card.wide{width:min(94vw,520px)}
.sg{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.sg button{position:relative;aspect-ratio:1/1;display:grid;place-items:center;border:2px solid var(--bd);background:var(--bg);cursor:pointer;padding:0;min-width:0}
.sg button.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.sg img{width:72%;height:72%}
#hgrid{margin-top:4px;padding-top:10px;border-top:2px solid var(--bd)}
#held{min-height:1.5em;font-size:13px;display:flex;align-items:center;gap:6px}#held img{width:22px;height:22px}
@media(prefers-reduced-motion:reduce){#tip{transition:none}}
html,body{overscroll-behavior:none}canvas,#hud{touch-action:none}
.btn:disabled{opacity:.4;cursor:default}
#rl{display:grid;gap:6px;max-height:55vh;overflow:auto}.rc{justify-content:flex-start;text-align:left}.rc img{width:28px;height:28px}
#mob{display:none}body.mob #mob{display:block}
#joy,#mb button{pointer-events:auto;touch-action:none}
#joy{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#0004;border:2px solid #fff6}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffa}
#mb{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,54px);gap:8px}
#mb button{height:54px;border-radius:50%;border:2px solid #fff8;background:#0006;color:#fff;padding:0;display:grid;place-items:center;font-size:22px}
#mb button.dn{background:#fff6}
body.mob #info{display:none}
body.mob #bar{pointer-events:auto}body.mob #hot{bottom:auto;top:calc(8px + env(safe-area-inset-top))}body.mob #stats{order:2}body.mob #hp,body.mob #fd{font-size:12px}
body.mob #bar div{width:38px;height:38px}body.mob #bar img{width:26px;height:26px}

body.mob #tip{bottom:auto;top:calc(88px + env(safe-area-inset-top))}
#fire{position:fixed;left:0;right:0;bottom:0;height:38%;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(to top,#ff6a00cc,#ffb30055 55%,transparent);animation:fl .5s steps(2) infinite}#fire.on{opacity:1}@keyframes fl{50%{filter:brightness(1.35)}}@media(prefers-reduced-motion:reduce){#fire{animation:none}}

#eqg{grid-template-columns:repeat(4,1fr)}#eqg small{font-size:9px;line-height:1.1;word-break:break-all}
.card.inv{width:min(96vw,900px)}
#ibody{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
#imain{flex:1 1 420px;min-width:0;display:grid;gap:10px}
#itop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#itop .sg4{width:min(46vw,200px)}
.cr{display:flex;align-items:center;gap:6px;margin-top:4px}
#cgrid{display:grid;gap:4px}
#cgrid button,#cout button{position:relative;width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--bd);background:var(--bg);padding:0;cursor:pointer}
#cout button{width:54px;height:54px;border-color:var(--ac)}#cout button:disabled{border-color:var(--bd)}
#cgrid b,#cout b{position:absolute;right:3px;bottom:0;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000}
#cgrid img,#cout img{width:72%;height:72%}
#guide{flex:1 1 210px;max-width:300px;display:grid;gap:6px}
#ghost{position:fixed;left:0;top:0;width:44px;height:44px;pointer-events:none;z-index:99}
#ghost img{width:100%;height:100%}#ghost b{position:absolute;right:0;bottom:0;color:#fff;text-shadow:1px 1px 0 #000;font-size:13px}
.rc.no{opacity:.55}.rc small{line-height:1.4}
#igrid button,#hgrid button,#eqg button,#cgrid button,#cout button{touch-action:none}

<canvas id="cv"></canvas><div id="flash"></div><div id="fire"></div>
<div id="hud" hidden>
 <div id="info"></div><div id="cross"></div><div id="prog"><i></i></div>
 <div id="tip"></div><div id="hot"><div id="arm" hidden></div><div id="stats"><div id="hp"></div><div id="fd"></div></div><div id="bar"></div></div>
 <div id="mob"><div id="joy"><i></i></div><div id="mb">
  <button id="mcr" aria-label="クラフト"><span class="material-symbols-outlined">construction</span></button>
  <button id="minv" aria-label="インベントリ"><span class="material-symbols-outlined">inventory_2</span></button>
  <button id="mps" aria-label="一時停止"><span class="material-symbols-outlined">pause</span></button>
  <button id="msp" aria-label="ダッシュ/降下"><span class="material-symbols-outlined">bolt</span></button>
  <button id="mjp" aria-label="ジャンプ"><span class="material-symbols-outlined">keyboard_double_arrow_up</span></button>
  <button id="mpl" aria-label="設置"><span class="material-symbols-outlined">add_box</span></button>
  <span></span><span></span>
  <button id="mbrk" aria-label="破壊/攻撃"><span class="material-symbols-outlined">hardware</span></button>
 </div></div>
</div>
<div id="inv" class="ov" hidden><div class="card inv">
 <h1 id="invt"><span class="material-symbols-outlined">inventory_2</span> インベントリ</h1>
 <div id="ibody">
  <div id="imain">
   <div id="itop"><div><small>装備</small><div id="eqg" class="sg sg4"></div></div>
    <div id="cwrap"><small id="ctitle"></small><div class="cr"><div id="cgrid"></div><span class="material-symbols-outlined">arrow_forward</span><div id="cout"></div></div></div></div>

  </div>
  <div id="guide"><small>レシピ (クリックで材料を自動配置)</small><div id="ctab" class="seg"></div><div id="rl"></div></div>
 </div>
 <small id="invn"></small>
 <button class="btn" id="invc"><span class="material-symbols-outlined">close</span>閉じる (E)</button>
</div></div>
<div id="ghost" hidden></div>
<div id="dead" class="ov" hidden><div class="card">
 <h1><span class="material-symbols-outlined">heart_broken</span> ゲームオーバー</h1>
 <button class="btn pri" id="resp"><span class="material-symbols-outlined">replay</span>リスポーン</button>
</div></div>
<div id="menu" class="ov">
 <button class="btn" id="theme" aria-label="テーマ切替"><span class="material-symbols-outlined">dark_mode</span></button>
 <div class="card">
  <h1><span class="material-symbols-outlined">deployed_code</span> BLOCKLAND</h1>
  <label>シード値 <small>(空欄でランダム)</small>

   <button class="btn on" data-m="0"><span class="material-symbols-outlined">forest</span>サバイバル</button>
   <button class="btn" data-m="1"><span class="material-symbols-outlined">flight</span>クリエイティブ</button></div>
  <div class="seg" id="ctl"><button class="btn" data-c="0"><span class="material-symbols-outlined">keyboard</span>PC操作</button>
   <button class="btn" data-c="1"><span class="material-symbols-outlined">smartphone</span>モバイル操作</button></div>
  <button class="btn pri" id="go"><span class="material-symbols-outlined">play_arrow</span>新しいワールドを生成</button>
  <button class="btn" id="setb"><span class="material-symbols-outlined">tune</span>設定</button>

 <h1><span class="material-symbols-outlined">tune</span> 設定</h1>

 <small id="kmsg" style="color:var(--ac)"></small>
 <div id="kl"></div>

 <label class="kr">視点の上下を反転 <input id="invy" type="checkbox"></label>
 <label class="kr">BGM音量 <span class="row"><input id="vm" type="range" min="0" max="1" step="0.05"><small id="vmv" style="min-width:3em;text-align:right"></small></span></label>
 <label class="kr">効果音の音量 <span class="row"><input id="vs" type="range" min="0" max="1" step="0.05"><small id="vsv" style="min-width:3em;text-align:right"></small></span></label>
 <label class="kr">音を消す <input id="vmute" type="checkbox"></label>
 <div class="seg"><button class="btn" id="kreset"><span class="material-symbols-outlined">restart_alt</span>初期化</button><button class="btn pri" id="setc"><span class="material-symbols-outlined">check</span>閉じる</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),root=document.documentElement;
// ---- theme
let th='';try{th=localStorage.getItem('bl-th')||''}catch(e){}
if(!th)th=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
const setTh=t=>{root.dataset.theme=t;$('#theme span').textContent=t=='dark'?'light_mode':'dark_mode';try{localStorage.setItem('bl-th',t)}catch(e){}};
