if(a=='pk'){const j=S.pk.indexOf(k);S.foc=k;if(j>=0){S.pk.splice(j,1);S.hi.splice(j,1)}else if(S.pk.length<RL.n){S.pk.push(k);S.hi.push(0)};S.rdy=0}
else if(a=='ho'){S.hi[i]=(S.hi[i]+1)%HI.length;S.rdy=0}
else if(a=='lv'){S.lv=Math.min(100,Math.max(5,S.lv+i));S.rdy=0}
else if(a=='rdy'&&S.pk.length==RL.n)S.rdy=!S.rdy;
draw();if(P[0].rdy&&P[1].rdy)begin()}
function go(p,a,i,k){const S=P[p];
if(phase=='rules')return rules(p,a,i,k);if(phase=='setup')return setup(p,a,i,k);
if(phase=='over'){if(a=='again'){T0=0;TF=0;phase='rules';P.forEach(x=>x.rdy=0);draw()}return}
if(S.ch)return;
if(a=='no')S.cf=null;
else if(a=='ok'){if(!S.cf)return;S.ch=S.cfd=S.cf;S.cf=null}
else if(phase=='sw'){if(a=='sw'&&need(p))S.cf={t:'sw',to:i}}
else if(phase=='pick'){
if(S.cf)return;
if(a=='fight'||a=='bag'||a=='party')S.ui=a;else if(a=='back')S.ui='cmd';
else if(a=='mv')S.cf={t:'mv',i};else if(a=='bi'){S.bi=k;S.ui='tgt'}
else if(a=='tg')S.cf={t:'it',k:S.bi,to:i};else if(a=='sw')S.cf={t:'sw',to:i}}
else return;
draw();if(phase=='pick'&&P[0].ch&&P[1].ch)turn();
else if(phase=='sw'&&[0,1].every(q=>!need(q)||P[q].ch))doSw()}
H.forEach(h=>h.innerHTML=sk);
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset;go(H.indexOf(b.closest('.half')),d.a,+d.i,d.k)});
draw();
</script></body></html>
