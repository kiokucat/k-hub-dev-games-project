<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネークリッカー INFINITY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Arial',sans-serif;background:#0a0a1a;color:#eee;min-height:100vh;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;max-width:1600px;margin:0 auto 10px;flex-wrap:wrap;gap:8px;padding:0 10px}
.header h1{color:#ffd700;font-size:24px;text-shadow:0 0 15px rgba(255,215,0,.4)}
.save-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;transition:all .15s;color:#fff;font-size:12px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn-green{background:#2e7d32}
.btn-blue{background:#1565c0}
.btn-red{background:#c62828}
.btn-purple{background:#6a1b9a}
.tab-btn{background:#1a1a2e;border:1px solid #333}
.tab-btn.active{background:#283593;border-color:#ffd700;color:#ffd700}
.stats-bar{display:flex;justify-content:center;gap:20px;margin-bottom:10px;flex-wrap:wrap;font-size:12px;color:#888;max-width:1600px;margin:0 auto 10px}
.stats-bar span{color:#ffd700;font-weight:bold}
.pp-display{color:#e040fb;font-weight:bold}
.container{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;max-width:1600px;margin:0 auto}
.panel{background:#12121e;border-radius:12px;padding:15px;border:1px solid #1e1e2e;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.main-section{display:flex;flex-direction:column;align-items:center;justify-content:center;grid-row:span 2}
.money-display{font-size:36px;font-weight:bold;color:#ffd700;margin-bottom:6px;text-align:center;text-shadow:0 0 15px rgba(255,215,0,.3)}
.sub-display{font-size:13px;color:#aaa;margin-bottom:4px;text-align:center}
.pp-info{color:#e040fb;font-size:13px;margin-bottom:15px;text-align:center;font-weight:bold}
.click-btn{width:140px;height:140px;border-radius:50%;border:3px solid #ffd700;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;font-size:20px;font-weight:bold;cursor:pointer;transition:all .08s;box-shadow:0 0 25px rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;user-select:none}
.click-btn:hover{transform:scale(1.06);box-shadow:0 0 40px rgba(255,215,0,.4)}
.click-btn:active{transform:scale(.9)}
.floating-number{position:fixed;font-weight:bold;color:#ffd700;font-size:20px;pointer-events:none;animation:float-up 1s ease-out forwards;text-shadow:2px 2px 4px rgba(0,0,0,.6);z-index:1000}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-40px) scale(1.15)}100%{opacity:0;transform:translateY(-90px) scale(.85)}}
.panel h2{font-size:13px;margin-bottom:10px;color:#ffd700;border-bottom:1px solid #2a2a3e;padding-bottom:6px;display:flex;align-items:center;gap:5px;position:sticky;top:0;background:#12121e;z-index:5}
.sidebar{overflow-y:auto;max-height:520px;position:relative}
.upgrade-item{background:#1a1a2e;border-left:2px solid #3949ab;padding:8px 10px;margin-bottom:6px;border-radius:6px;cursor:pointer;transition:all .15s;font-size:11px}
.upgrade-item:hover{background:#252538;transform:translateX(3px)}
.upgrade-item.disabled{opacity:1;cursor:not-allowed}
.upgrade-item.disabled:hover{transform:none}
.upgrade-item.locked{position:relative;overflow:hidden}
.upgrade-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;pointer-events:none;border-radius:6px;opacity:.88;z-index:2}
.upgrade-name{font-weight:bold;color:#fff;margin-bottom:2px;font-size:12px}
.upgrade-cost{font-size:11px;color:#ff9800}
.upgrade-count{font-size:10px;color:#888;margin-top:2px}
.item-card{background:#1a1a2e;border-left:2px solid #e91e63;padding:8px 10px;margin-bottom:6px;border-radius:6px;cursor:pointer;transition:all .15s;font-size:11px;position:relative}
.item-card:hover{background:#252538;transform:translateX(3px)}
.item-card.owned{border-left-color:#4CAF50;background:#0d1f0d}
.item-card.owned:hover{background:#142b14}
.item-card.disabled{opacity:.35;cursor:not-allowed}
.item-name{font-weight:bold;color:#fff;margin-bottom:2px;display:flex;align-items:center;gap:3px;font-size:12px}
.item-rarity{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:bold}
.rarity-N{background:#757575}
.rarity-R{background:#2196F3}
.rarity-SR{background:#9c27b0}
.rarity-SSR{background:#ff9800}
.rarity-UR{background:#f44336}
.rarity-LR{background:#00e5ff;color:#000}
.rarity-SECRET{background:#ffd700;color:#000}
.item-cost{font-size:11px;color:#ffd700}
.item-effect{font-size:10px;color:#ff9800;margin-top:2px}
.item-owned{position:absolute;top:6px;right:6px;background:#2e7d32;color:#fff;font-size:9px;padding:1px 6px;border-radius:6px}
.achievement-item{background:#151520;border-left:2px solid #3949ab;padding:8px 10px;margin-bottom:5px;border-radius:6px;font-size:11px}
.achievement-item.unlocked{background:#0d1f0d;border-left-color:#4CAF50}
.achievement-item.locked{position:relative;overflow:hidden}
.achievement-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;pointer-events:none;border-radius:6px;transition:opacity .3s}
.achievement-name{font-weight:bold;color:#fff;margin-bottom:1px;font-size:12px}
.achievement-desc{font-size:10px;color:#777;margin-bottom:2px}
.achievement-progress{font-size:10px;color:#666}
.progress-bar{width:100%;height:3px;background:#1e1e2e;border-radius:2px;margin-top:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#3949ab,#5e35b1);border-radius:2px;transition:width .3s}
.progress-bar-fill.complete{background:#4CAF50}
.notification{position:fixed;top:15px;right:15px;background:#1a1a2e;padding:12px 16px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.5);animation:slide-in .25s ease-out;max-width:300px;border:1px solid #2a2a3e;color:#fff;z-index:2000;font-size:13px}
.notification.achievement{border-left:3px solid #fbc02d}
.notification.item{border-left:3px solid #ff9800}
.notification.save{border-left:3px solid #4CAF50}
.notification.rare{border-left:3px solid #e91e63}
.notification.pp{border-left:3px solid #e040fb}
@keyframes slide-in{from{transform:translateX(350px);opacity:0}to{transform:translateX(0);opacity:1}}
.tab-content{display:none}.tab-content.active{display:block}
.combo-display{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:16px;color:#ff1744;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none}
.combo-display.show{opacity:1}
.critical-hit{animation:crit-pulse .25s ease-out}
@keyframes crit-pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.prestige-panel{background:#1a0a2e;border:1px solid #4a148c;padding:12px;border-radius:8px;margin-bottom:10px;text-align:center}
.prestige-panel h3{color:#e040fb;font-size:14px;margin-bottom:6px}
.prestige-info{font-size:12px;color:#aaa;margin-bottom:8px}
.prestige-btn{background:#6a1b9a;color:#fff;padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px;transition:all .2s}
.prestige-btn:hover{background:#8e24aa;transform:scale(1.05)}
.prestige-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pp-shop-item{background:#1a0a2e;border-left:2px solid #e040fb;padding:8px 10px;margin-bottom:6px;border-radius:6px;cursor:pointer;transition:all .15s;font-size:11px}
.pp-shop-item:hover{background:#2a1040;transform:translateX(3px)}
.pp-shop-item.disabled{opacity:.35;cursor:not-allowed}
.pp-shop-name{font-weight:bold;color:#e040fb;margin-bottom:2px}
.pp-shop-cost{font-size:11px;color:#ce93d8}
.pp-shop-desc{font-size:10px;color:#aaa}
.pp-shop-lv{font-size:10px;color:#888;margin-top:2px}
.event-log{font-size:11px;color:#777;max-height:500px;overflow-y:auto;line-height:1.6}
.event-log div{padding:2px 0;border-bottom:1px solid #1a1a2e}
.filter-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.filter-bar button{background:#1e1e2e;border:1px solid #333;color:#888;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;transition:all .15s}
.filter-bar button:hover,.filter-bar button.active{background:#3949ab;color:#fff;border-color:#3949ab}
@media(max-width:1200px){.container{grid-template-columns:1fr 1fr}.main-section{grid-row:span 1;grid-column:span 2}}
@media(max-width:768px){.container{grid-template-columns:1fr}.main-section{grid-column:span 1}.header{flex-direction:column}.money-display{font-size:28px}}
</style>
</head>
<body>
<div class="header">
<h1>💰 マネークリッカー INFINITY</h1>
<div class="save-controls">
<button class="btn tab-btn active" data-tab="upgrades">⚡ アップグレード</button>
<button class="btn tab-btn" data-tab="items">🎒 所持品</button>
<button class="btn tab-btn" data-tab="achievements">🏆 実績</button>
<button class="btn tab-btn" data-tab="prestige">✨ プレステージ</button>
<button class="btn btn-green" id="manualSaveBtn">💾 保存</button>
<button class="btn btn-blue" id="manualLoadBtn">📂 読込</button>
<button class="btn btn-red" id="resetBtn">🔄 リセット</button>
</div>
</div>
<div class="stats-bar">
<div>総クリック: <span id="totalClicksDisplay">0</span></div>

<div>実績: <span id="achievementCount">0</span>/<span id="achievementTotal">0</span></div>
<div>所持品: <span id="itemCount">0</span>/<span id="itemTotal">0</span></div>
<div class="pp-display">PP: <span id="ppDisplay">0</span></div>
<div>周回: <span id="prestigeCount">0</span></div>
</div>
<div class="container">
<div class="panel main-section">
<div class="combo-display" id="comboDisplay"></div>
<div class="money-display" id="moneyDisplay">¥0</div>
<div class="sub-display" id="incomeDisplay">毎秒: ¥0</div>
<div class="sub-display" id="clickDisplay">1クリック: ¥1</div>

<div class="pp-info" id="ppInfo">次のプレステージ: +0 PP</div>
<button class="click-btn" id="clickBtn">💰<br>クリック</button>
</div>
<div class="panel sidebar">
<div class="tab-content active" id="tab-upgrades">
<h2>⚡ アップグレード <span id="upgradeCount" style="color:#888;font-size:11px"></span></h2>
<div class="filter-bar" id="upgradeFilters">
<button class="active" data-filter="all">全て</button>
<button data-filter="passive">📈 パッシブ</button>
<button data-filter="click">👆 クリック</button>
<button data-filter="special">✨ 特殊</button>
</div>
<div id="upgradesList"></div>
</div>
<div class="tab-content" id="tab-items">
<h2>🎒 所持品 <span id="itemShopCount" style="color:#888;font-size:11px"></span></h2>
<div class="filter-bar" id="itemFilters">
<button class="active" data-filter="all">全て</button>
<button data-filter="N">N</button>
<button data-filter="R">R</button>
<button data-filter="SR">SR</button>
<button data-filter="SSR">SSR</button>
<button data-filter="UR">UR</button>
<button data-filter="LR">LR</button>
<button data-filter="SECRET">SECRET</button>
</div>
<div id="itemsList"></div>
</div>
<div class="tab-content" id="tab-achievements">
<h2>🏆 実績 <span id="achProgress" style="color:#888;font-size:11px"></span></h2>
<div id="achievementsList"></div>
</div>
<div class="tab-content" id="tab-prestige">
<h2>✨ プレステージ</h2>
<div class="prestige-panel">
<h3>🔄 プレステージ実行</h3>
<div class="prestige-info">所持金をリセットし、PPを獲得します。PPは永続的な強化に使用できます。</div>
<div style="font-size:14px;color:#e040fb;margin-bottom:8px">獲得予定PP: <span id="prestigeGain">0</span></div>
<button class="prestige-btn" id="prestigeBtn">プレステージ実行</button>
</div>
<h2 style="margin-top:15px">🛒 PPショップ</h2>
<div id="ppShopList"></div>
</div>
</div>
<div class="panel sidebar">
<h2>📜 イベントログ</h2>
<div class="event-log" id="eventLog"></div>
</div>
<div class="panel sidebar">
<h2>📊 統計</h2>
<div id="statsPanel" style="font-size:11px;color:#aaa;line-height:1.8"></div>
</div>
</div>
<div id="itemContainer"></div>
<div id="notificationContainer"></div>

generateItems() {
this.items = [];
const rData = { N: { count: 60, costBase: 100, costMult: 1.4 }, R: { count: 50, costBase: 2000, costMult: 1.5 }, SR: { count: 40, costBase: 50000, costMult: 1.6 }, SSR: { count: 25, costBase: 2000000, costMult: 1.8 }, UR: { count: 15, costBase: 100000000, costMult: 2.0 }, LR: { count: 8, costBase: 5000000000, costMult: 2.5 }, SECRET: { count: 2, costBase: 100000000000, costMult: 3.0 } };
const prefixes = ['古びた','輝く','呪われた','祝福された','失われた','禁断の','永遠の','混沌の','聖なる','闇の','光の','時の','夢の','星の','深淵の','天の','地の','海の','炎の','氷の','雷の','風の','土の','森の','砂の','鋼の','水晶の','翡翠の','紅玉の','琥珀の','真珠の','珊瑚の','銀の','金の','白金の','隕石の','隕鉄の','精霊の','悪魔の','天使の','神々の','龍の','鳳凰の','麒麟の','玄武の','朱雀の','青龍の','白虎の','九尾の','吸血鬼の','狼男の','魔女の','魔法使いの','騎士の','王の','皇帝の','賢者の','預言者の','勇者の','魔王の'];
const types = ['コイン','指輪','ペンダント','腕輪','お守り','印章','宝玉','結晶','宝珠','巻物','剣','盾','鎧','兜','靴','手袋','マント','冠','杖','弓','槍','斧','鈴','笛','鏡','灯','鍵','杯','皿','壺','像','絵画','楽譜','地図','羅針盤','砂時計','指南書','日記','手紙','契約書','勲章','紋章','旗','印章','印鑑','鍵束','宝石箱','財宝','金貨','銀貨','銅貨','紙幣','小切手','債券','株券','宝石','真珠','珊瑚','琥珀'];
const efs = [
{ type: 'clickMult', base: 1.02, desc: 'クリック倍率', fmt: v => 'x' + v.toFixed(2) },
{ type: 'passiveMult', base: 1.02, desc: 'パッシブ倍率', fmt: v => 'x' + v.toFixed(2) },
{ type: 'allMult', base: 1.01, desc: '全収入倍率', fmt: v => 'x' + v.toFixed(2) },
{ type: 'clickAdd', base: 1, desc: 'クリック収入', fmt: v => '+' + this.fmt(v) },
{ type: 'passiveAdd', base: 0.5, desc: '毎秒収入', fmt: v => '+' + this.fmt(v) },
{ type: 'critChance', base: 0.005, desc: 'クリティカル率', fmt: v => '+' + (v * 100).toFixed(1) + '%' },
{ type: 'critDamage', base: 0.05, desc: 'クリティカル倍率', fmt: v => '+' + v.toFixed(2) + 'x' },
{ type: 'dropRate', base: 0.01, desc: 'ドロップ率', fmt: v => '+' + (v * 100).toFixed(0) + '%' },
{ type: 'combo', base: 0.03, desc: 'コンボ倍率', fmt: v => '+' + v.toFixed(2) + 'x' }
];
let idc = 0;
Object.entries(rData).forEach(([rarity, data]) => {
for (let i = 0; i < data.count; i++) {
const p = prefixes[Math.floor(Math.random() * prefixes.length)];
const t = types[Math.floor(Math.random() * types.length)];
const ef = efs[Math.floor(Math.random() * efs.length)];
const cost = Math.floor(data.costBase * Math.pow(data.costMult, i) * (0.8 + Math.random() * 0.4));
const mult = rarity === 'N' ? 1 : rarity === 'R' ? 1.5 : rarity === 'SR' ? 2.5 : rarity === 'SSR' ? 4 : rarity === 'UR' ? 7 : rarity === 'LR' ? 12 : 25;
const val = ef.base * (1 + i * 0.1) * mult;
this.items.push({ id: 'it_' + (idc++), name: p + 'の' + t, cost: cost, rarity: rarity, effect: { type: ef.type, value: ef.type.includes('Mult') ? val : val }, desc: ef.desc + ' ' + ef.fmt(val), owned: false });
}
});
const rOrder = { SECRET: 6, LR: 5, UR: 4, SSR: 3, SR: 2, R: 1, N: 0 };
this.items.sort((a, b) => rOrder[b.rarity] - rOrder[a.rarity] || a.cost - b.cost);
}

cT.forEach((t, i) => { const n = (i < 10 ? ['始まり','初心者','練習生','見習い','弟子','達人','名人','プロ','マスター','神'][i] : 'クリックランク' + (i + 1)) + ' [' + this.fmt(t * 2) + '回]'; add('c_' + i, n, '累計' + this.fmt(t * 2) + '回クリック', () => this.totalClicks, t * 2, Math.min(100, Math.floor(Math.pow(i + 1, 1.3)))); });
const mB = [];
for (let i = 0; i < 800; i++) { let t = i < 10 ? [1000, 5000, 10000, 50000, 100000, 500000, 1000000, 5000000, 10000000, 50000000][i] : Math.floor(Math.pow(10, i * 0.015 + 2.5)); mB.push(t); }
mB.forEach((t, i) => { const n = (i < 10 ? ['貧乏人','労働者','店員','主任','課長','部長','取締役','社長','会長','大富豪'][i] : '資産ランク' + (i + 1)) + ' [¥' + this.fmt(t * 2) + ']'; add('m_' + i, n, '累計¥' + this.fmt(t * 2) + '獲得', () => this.totalMoney, t * 2, Math.min(200, Math.floor(Math.pow(i + 1, 1.2)))); });
for (let i = 0; i < 300; i++) { const t = (i < 10 ? i + 1 : Math.floor(Math.pow(i, 1.8))) * 2; add('u_' + i, '投資家ランク' + (i + 1) + ' [' + this.fmt(t) + '個]', 'アップグレード累計' + this.fmt(t) + '個購入', () => this.getTotalUpgrades(), t, Math.min(150, i + 1)); }
for (let i = 0; i < 200; i++) { const t = (i + 1) * 2; add('it_' + i, '収集家ランク' + (i + 1) + ' [' + t + '個]', '所持品' + t + '個獲得', () => this.getOwnedItemsCount(), t, Math.min(100, Math.floor((i + 1) * 0.5) + 1)); }
for (let i = 0; i < 200; i++) { const t = (i < 10 ? (i + 1) * 5 : Math.floor(Math.pow(i, 1.6) * 5)) * 2; add('cb_' + i, 'コンボランク' + (i + 1) + ' [' + t + '連]', '最大コンボ' + t + '達成', () => this.maxCombo, t, Math.min(100, i + 1)); }
for (let i = 0; i < 200; i++) { const t = (i < 10 ? (i + 1) * 10 : Math.floor(Math.pow(i, 1.7) * 10)) * 2; add('cr_' + i, 'クリティカルランク' + (i + 1) + ' [' + this.fmt(t) + '回]', 'クリティカル累計' + this.fmt(t) + '回', () => this.totalCrits, t, Math.min(100, i + 1)); }
for (let i = 0; i < 200; i++) { const t = (i < 10 ? i + 1 : Math.floor(Math.pow(i, 1.5))) * 2; add('dr_' + i, 'ドロップランク' + (i + 1) + ' [' + this.fmt(t) + '回]', 'レアドロップ累計' + this.fmt(t) + '回', () => this.rareDrops, t, Math.min(100, i + 1)); }
for (let i = 0; i < 500; i++) { let t = (i < 10 ? [10000, 50000, 100000, 500000, 1000000, 5000000, 10000000, 50000000, 100000000, 500000000][i] : Math.floor(Math.pow(10, i * 0.02 + 3))) * 2; add('h_' + i, '貯蓄ランク' + (i + 1) + ' [¥' + this.fmt(t) + ']', '所持金が¥' + this.fmt(t) + '以上', () => this.money, t, Math.min(200, Math.floor(Math.pow(i + 1, 1.1)))); }
for (let i = 0; i < 300; i++) { let t = (i < 10 ? [1, 5, 10, 50, 100, 500, 1000, 5000, 10000, 50000][i] : Math.floor(Math.pow(10, i * 0.025 + 0.5))) * 2; add('ps_' + i, '収入ランク' + (i + 1) + ' [¥' + this.fmt(t) + '/秒]', '毎秒収入が¥' + this.fmt(t) + '以上', () => this.getTotalPassive(), t, Math.min(150, i + 1)); }
for (let i = 0; i < 300; i++) { let t = (i < 10 ? [10, 50, 100, 500, 1000, 5000, 10000, 50000, 100000, 500000][i] : Math.floor(Math.pow(10, i * 0.025 + 1))) * 2; add('cp_' + i, 'パワーランク' + (i + 1) + ' [¥' + this.fmt(t) + ']', '1クリックが¥' + this.fmt(t) + '以上', () => this.getTotalClickValue(), t, Math.min(150, i + 1)); }
for (let i = 0; i < 100; i++) { const t = (i + 1) * 2; add('pr_' + i, '輪廻ランク' + (i + 1) + ' [' + t + '回]', 'プレステージ' + t + '回実行', () => this.prestigeCount, t, Math.min(500, t * 5)); }
for (let i = 0; i < 200; i++) { const t = (i < 10 ? (i + 1) * 10 : Math.floor(Math.pow(i, 1.8) * 10)) * 2; add('pp_' + i, '超越ランク' + (i + 1) + ' [' + this.fmt(t) + 'PP]', '累計PP' + this.fmt(t) + '獲得', () => this.totalPP || this.pp, t, Math.min(300, (i + 1) * 2)); }
}

generatePPShop() {
this.ppShop = {
critRate: { name: 'クリティカル率強化', cost: 5, baseCost: 5, effect: 0.01, owned: 0, desc: 'クリティカル率 +1%', type: 'critRate' },
critDmg: { name: 'クリティカルダメージ強化', cost: 5, baseCost: 5, effect: 0.1, owned: 0, desc: 'クリティカル倍率 +0.1x', type: 'critDmg' },
startMoney: { name: '開始資金強化', cost: 10, baseCost: 10, effect: 100, owned: 0, desc: '開始資金 +¥100', type: 'startMoney' },
incomeMult: { name: '全収入倍率強化', cost: 50, baseCost: 50, effect: 0.05, owned: 0, desc: '全収入倍率 +5%', type: 'incomeMult' },
dropRate: { name: 'ドロップ率強化', cost: 20, baseCost: 20, effect: 0.02, owned: 0, desc: 'ドロップ率 +2%', type: 'dropRate' },
comboBonus: { name: 'コンボ倍率強化', cost: 15, baseCost: 15, effect: 0.05, owned: 0, desc: 'コンボ倍率 +0.05x', type: 'comboBonus' },
clickBase: { name: '基礎クリック強化', cost: 8, baseCost: 8, effect: 1, owned: 0, desc: '基礎クリック収入 +1', type: 'clickBase' },
passiveBase: { name: '基礎パッシブ強化', cost: 8, baseCost: 8, effect: 0.5, owned: 0, desc: '基礎毎秒収入 +0.5', type: 'passiveBase' },
goldenTouch: { name: '黄金の手', cost: 100, baseCost: 100, effect: 0.05, owned: 0, desc: '全ての倍率 +5%', type: 'golden' },
ppBoost: { name: 'PP獲得倍率', cost: 200, baseCost: 200, effect: 0.1, owned: 0, desc: 'PP獲得量 +10%', type: 'ppBoost' }
};
}

fmt(n) {
if (n >= 1e33) return (n / 1e33).toFixed(2) + 'D';
if (n >= 1e30) return (n / 1e30).toFixed(2) + 'N';
if (n >= 1e27) return (n / 1e27).toFixed(2) + 'O';
if (n >= 1e24) return (n / 1e24).toFixed(2) + 'Y';
if (n >= 1e21) return (n / 1e21).toFixed(2) + 'Z';
if (n >= 1e18) return (n / 1e18).toFixed(2) + 'E';
if (n >= 1e15) return (n / 1e15).toFixed(2) + 'P';
if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
if (n >= 1) return Math.floor(n).toLocaleString();
if (n >= 0.01) return n.toFixed(2);
return n.toFixed(4);
}

init() {
document.getElementById('clickBtn').addEventListener('click', e => this.click(e));
document.getElementById('manualSaveBtn').addEventListener('click', () => { this.saveGame(); this.showNotification('保存完了', 'save'); this.addEvent('手動保存'); });
document.getElementById('manualLoadBtn').addEventListener('click', () => { if (confirm('読込しますか？')) { this.loadGame(); this.updateDisplay(); this.renderAll(); this.showNotification('読込完了', 'save'); this.addEvent('読込完了'); } });
document.getElementById('resetBtn').addEventListener('click', () => { if (confirm('全データ削除しますか？')) { localStorage.removeItem('moneyClickerInfinitySave'); location.reload(); } });
document.getElementById('prestigeBtn').addEventListener('click', () => this.doPrestige());
document.querySelectorAll('.tab-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
btn.classList.add('active');
document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});
});
document.querySelectorAll('#upgradeFilters button').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('#upgradeFilters button').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
this.upgradeFilter = btn.dataset.filter;
this.renderUpgrades();
});
});
document.querySelectorAll('#itemFilters button').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('#itemFilters button').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
this.itemFilter = btn.dataset.filter;
this.renderItems();
});
});
this.renderAll();
this.gameLoop();
setInterval(() => this.autoSave(), 30000);
setInterval(() => this.gameLoop(), 100);
setInterval(() => this.tryDropItem(), 5000);
setInterval(() => this.autoClick(), 500);
setInterval(() => this.checkAchievements(), 1000);
}

getTotalUpgrades() { return Object.values(this.upgrades).reduce((a, b) => a + b.owned, 0); }
getOwnedItemsCount() { return this.items.filter(i => i.owned).length; }
getTotalPassive() { return (this.moneyPerSec * this.getPassiveMultiplier()) + this.getPassiveAdd(); }
getTotalClickValue() { return Math.floor((this.baseMoneyPerClick + this.getClickAdd()) * this.getClickMultiplier()); }

getClickMultiplier() {
let m = 1 + (this.ppShop.incomeMult ? this.ppShop.incomeMult.owned * 0.05 : 0);
if (this.ppShop.goldenTouch) m += this.ppShop.goldenTouch.owned * 0.05;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'clickMult' || it.effect.type === 'allMult') m *= it.effect.value; });
const cb = (this.upgrades.comboMaster ? this.upgrades.comboMaster.owned * 0.05 : 0) + (this.ppShop.comboBonus ? this.ppShop.comboBonus.owned * 0.05 : 0);
m *= (1 + this.clickCombo * (0.02 + cb));
return m;
}
getPassiveMultiplier() {
let m = 1 + (this.ppShop.incomeMult ? this.ppShop.incomeMult.owned * 0.05 : 0);
if (this.ppShop.goldenTouch) m += this.ppShop.goldenTouch.owned * 0.05;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'passiveMult' || it.effect.type === 'allMult') m *= it.effect.value; });
return m;
}
getCritChance() {
let c = this.criticalChance + (this.ppShop.critRate ? this.ppShop.critRate.owned * 0.01 : 0);
c += this.upgrades.critChance ? this.upgrades.critChance.owned * 0.005 : 0;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'critChance') c += it.effect.value; });
return Math.min(c, 1);
}
getCritMultiplier() {
let m = this.criticalMultiplier + (this.ppShop.critDmg ? this.ppShop.critDmg.owned * 0.1 : 0);
m += this.upgrades.critDamage ? this.upgrades.critDamage.owned * 0.1 : 0;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'critDamage') m += it.effect.value; });
return m;
}
getClickAdd() {
let a = 0;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'clickAdd') a += it.effect.value; });
a += this.ppShop.clickBase ? this.ppShop.clickBase.owned * 1 : 0;
return a;
}
getPassiveAdd() {
let a = 0;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'passiveAdd') a += it.effect.value; });
a += this.ppShop.passiveBase ? this.ppShop.passiveBase.owned * 0.5 : 0;
return a;
}
getDropRateBonus() {
let b = 0.15 + (this.ppShop.dropRate ? this.ppShop.dropRate.owned * 0.02 : 0);
b += this.upgrades.goldenTouch ? this.upgrades.goldenTouch.owned * 0.01 : 0;
this.items.filter(i => i.owned).forEach(it => { if (it.effect.type === 'dropRate') b += it.effect.value; });
return b;
}
getPPGain() {
if (this.money < 1000000) return 0;
const base = Math.floor(Math.log10(this.money) - 5);
const boost = this.ppShop.ppBoost ? 1 + this.ppShop.ppBoost.owned * 0.1 : 1;
return Math.max(0, Math.floor(base * boost));
}

doPrestige() {
const gain = this.getPPGain();
if (gain <= 0) { this.showNotification('所持金が足りません (100万円以上必要)', 'save'); return; }
if (!confirm('プレステージしますか?\n獲得PP: ' + gain + '\n(所持金とアップグレードはリセットされます)')) return;
this.pp += gain; this.totalPP = (this.totalPP || 0) + gain; this.prestigeCount++;
this.money = (this.ppShop.startMoney ? this.ppShop.startMoney.owned * 100 : 0);
this.moneyPerSec = 0; this.baseMoneyPerClick = 1;
this.totalClicks = 0; this.totalMoney = 0; this.clickCombo = 0; this.lastClickTime = 0;
this.rareDrops = 0; this.totalCrits = 0; this.maxCombo = 0;
Object.keys(this.upgrades).forEach(k => { this.upgrades[k].owned = 0; this.upgrades[k].cost = this.upgrades[k].baseCost; });
this.items.forEach(i => { i.owned = false; });
this.showNotification('プレステージ完了! +' + gain + ' PP', 'pp');
this.addEvent('プレステージ実行! +' + gain + ' PP (累計PP: ' + this.pp + ')');
this.saveGame(); this.renderAll(); this.updateDisplay();
}

click(e) {
const now = Date.now();
if (now - this.lastClickTime < 1000) this.clickCombo++; else this.clickCombo = 1;
this.lastClickTime = now;
if (this.clickCombo > this.maxCombo) this.maxCombo = this.clickCombo;
let cv = (this.baseMoneyPerClick + this.getClickAdd()) * this.getClickMultiplier();
const isCrit = Math.random() < this.getCritChance();
if (isCrit) { cv *= this.getCritMultiplier(); this.totalCrits++; document.getElementById('clickBtn').classList.add('critical-hit'); setTimeout(() => document.getElementById('clickBtn').classList.remove('critical-hit'), 250); }
cv = Math.floor(cv);
this.money += cv; this.totalMoney += cv; this.totalClicks++;
this.showFloatingNumber(e.clientX, e.clientY, isCrit ? '💥 +' + this.fmt(cv) + '!' : '+¥' + this.fmt(cv), isCrit);
const cd = document.getElementById('comboDisplay');
if (this.clickCombo >= 5) { cd.textContent = '🔥 ' + this.clickCombo + ' Combo! x' + (1 + this.clickCombo * 0.02).toFixed(2); cd.classList.add('show'); }
else { cd.classList.remove('show'); }
this.updateDisplay(); this.renderUpgrades(); this.renderItems();
}

autoClick() {
const ac = this.upgrades.autoClicker ? this.upgrades.autoClicker.owned : 0;
if (ac > 0) { const av = Math.floor(this.moneyPerClick * ac * 0.5 * this.getClickMultiplier()); this.money += av; this.totalMoney += av; this.totalClicks += ac; }
}

buyUpgrade(key) {
const u = this.upgrades[key];
if (this.money >= u.cost) {
this.money -= u.cost; u.owned++;
if (u.type === 'passive') this.moneyPerSec += u.effect;
else if (u.type === 'click') this.baseMoneyPerClick += u.effect;
u.cost = Math.floor(u.baseCost * Math.pow(1.15, u.owned));
this.addEvent(u.name + ' Lv.' + u.owned + ' 購入');
this.saveGame(); this.renderUpgrades(); this.updateDisplay();
}
}

buyItem(item) {
if (item.owned) { this.showNotification('既に所持中', 'save'); return; }
if (this.money >= item.cost) {
this.money -= item.cost; item.owned = true;
const rn = { N: 'N', R: 'R', SR: 'SR', SSR: 'SSR', UR: 'UR', LR: 'LR', SECRET: 'SECRET' };
this.showNotification(item.name + ' [' + rn[item.rarity] + '] 獲得!', 'rare');
this.addEvent('所持品: ' + item.name + ' [' + rn[item.rarity] + ']');
this.saveGame(); this.renderItems(); this.updateDisplay();
}
}

buyPPUpgrade(key) {
const u = this.ppShop[key];
if (this.pp >= u.cost) {
this.pp -= u.cost; u.owned++;
u.cost = Math.floor(u.baseCost * Math.pow(1.5, u.owned));
this.addEvent('PP購入: ' + u.name + ' Lv.' + u.owned);
this.saveGame(); this.renderPPShop(); this.updateDisplay();
}
}

tryDropItem() {
const dr = this.getDropRateBonus();
if (Math.random() < dr) {
const w = [0.35, 0.28, 0.18, 0.10, 0.05, 0.03, 0.01];
const r = ['N', 'N', 'R', 'SR', 'SSR', 'UR', 'LR'];
let rand = Math.random(), sr = 'N';
for (let i = 0; i < w.length; i++) { rand -= w[i]; if (rand <= 0) { sr = r[i]; break; } }
const ai = this.items.filter(i => !i.owned && i.rarity === sr);
if (ai.length > 0) {
const it = ai[Math.floor(Math.random() * ai.length)];
it.owned = true; this.rareDrops++;
const re = { N: '⚪', R: '🔵', SR: '🟣', SSR: '🟡', UR: '🔴', LR: '🔷', SECRET: '👑' };
this.showNotification('ドロップ! ' + re[it.rarity] + ' ' + it.name, 'item');
this.addEvent('ドロップ: ' + it.name + ' [' + it.rarity + ']');
this.renderItems(); this.updateDisplay(); this.saveGame();
}
}
}

checkAchievements() {
Object.entries(this.achievements).forEach(([key, ach]) => {
if (!this.unlockedAchievements.has(key) && ach.progress() >= ach.target) {
this.unlockedAchievements.add(key);
this.money += ach.reward;
if (ach.reward > 0) this.showNotification('🏆 ' + ach.name + ' (+' + ach.reward + ')', 'achievement');
else this.showNotification('🏆 ' + ach.name, 'achievement');
this.addEvent('実績: ' + ach.name);
}
});
}

gameLoop() {
const tp = this.getTotalPassive();
this.money += tp * 0.1;
this.totalMoney += tp * 0.1;
this.updateDisplay();
}

updateDisplay() {
const mr = Math.floor(this.money);
document.getElementById('moneyDisplay').textContent = '¥' + this.fmt(mr);
const tp = this.getTotalPassive();
document.getElementById('incomeDisplay').textContent = '毎秒: ¥' + this.fmt(tp);
const tc = this.getTotalClickValue();
document.getElementById('clickDisplay').textContent = '1クリック: ¥' + this.fmt(tc);
document.getElementById('multDisplay').textContent = '倍率: x' + this.getClickMultiplier().toFixed(2);
document.getElementById('ppInfo').textContent = '次のプレステージ: +' + this.getPPGain() + ' PP';
document.getElementById('ppDisplay').textContent = this.pp;
document.getElementById('prestigeCount').textContent = this.prestigeCount;
document.getElementById('prestigeGain').textContent = this.getPPGain();
document.getElementById('totalClicksDisplay').textContent = this.totalClicks.toLocaleString();
document.getElementById('totalMoneyDisplay').textContent = '¥' + this.fmt(this.totalMoney);
document.getElementById('achievementCount').textContent = this.unlockedAchievements.size;
document.getElementById('achievementTotal').textContent = Object.keys(this.achievements).length;
document.getElementById('itemCount').textContent = this.getOwnedItemsCount();
document.getElementById('itemTotal').textContent = this.items.length;
document.getElementById('upgradeCount').textContent = '(' + this.getTotalUpgrades() + '/' + Object.keys(this.upgrades).length + ')';
document.getElementById('itemShopCount').textContent = '(' + this.getOwnedItemsCount() + '/' + this.items.length + ')';
document.getElementById('achProgress').textContent = '(' + this.unlockedAchievements.size + '/' + Object.keys(this.achievements).length + ')';
}

renderAll() { this.renderUpgrades(); this.renderItems(); this.renderAchievements(); this.renderPPShop(); this.updateStats(); }

renderUpgrades() {
const c = document.getElementById('upgradesList');
let list = Object.entries(this.upgrades);
if (this.upgradeFilter !== 'all') list = list.filter(([k, u]) => u.type === this.upgradeFilter || (this.upgradeFilter === 'special' && !['passive', 'click'].includes(u.type)));
const affordable = list.filter(([k, u]) => this.money >= u.cost);
const expensive = list.filter(([k, u]) => this.money < u.cost);
const display = this.upgradeFilter !== 'all' ? list : [...affordable, ...expensive.slice(0, 50)];
let html = '';
display.forEach(([key, u]) => {
const ca = this.money >= u.cost;
const cls = ca ? '' : 'disabled locked';
const typeLabel = u.type === 'passive' ? '毎秒+' + this.fmt(u.effect) : u.type === 'click' ? 'クリック+' + this.fmt(u.effect) : '特殊';
html += '<div class="upgrade-item ' + cls + '" data-key="' + key + '">';
if (!ca) html += '<div class="upgrade-overlay"></div>';
html += '<div class="upgrade-name">' + u.name + '</div>';
html += '<div class="upgrade-cost">¥' + this.fmt(u.cost) + '</div>';
html += '<div class="upgrade-count">Lv.' + u.owned + ' | ' + typeLabel + '</div></div>';
});
if (this.upgradeFilter === 'all' && expensive.length > 50) {
html += '<div style="text-align:center;color:#555;font-size:11px;padding:10px">🔽 フィルターを使って更多を表示...</div>';
}
c.innerHTML = html;
c.querySelectorAll('.upgrade-item:not(.disabled)').forEach(el => {
el.addEventListener('click', () => this.buyUpgrade(el.dataset.key));
});
}

renderItems() {
const c = document.getElementById('itemsList');
let list = this.items;
if (this.itemFilter !== 'all') list = list.filter(i => i.rarity === this.itemFilter);
let html = '';
list.forEach(item => {
const ca = this.money >= item.cost;
const cls = item.owned ? 'owned' : (!ca ? 'disabled' : '');
const costText = item.owned ? '売却不可' : '¥' + this.fmt(item.cost);
html += '<div class="item-card ' + cls + '" data-id="' + item.id + '">';
if (item.owned) html += '<span class="item-owned">所持中</span>';
html += '<div class="item-name"><span class="item-rarity rarity-' + item.rarity + '">' + item.rarity + '</span> ' + item.name + '</div>';
html += '<div class="item-cost">' + costText + '</div>';
html += '<div class="item-effect">' + item.desc + '</div></div>';
});
c.innerHTML = html;
c.querySelectorAll('.item-card:not(.owned):not(.disabled)').forEach(el => {
const item = this.items.find(i => i.id === el.dataset.id);
if (item) el.addEventListener('click', () => this.buyItem(item));
});
}

renderAchievements() {
const c = document.getElementById('achievementsList');
const achList = Object.entries(this.achievements);
const unlocked = achList.filter(([k, a]) => this.unlockedAchievements.has(k));
const locked = achList.filter(([k, a]) => !this.unlockedAchievements.has(k));
const closest = locked.sort((a, b) => (a[1].target - a[1].progress()) - (b[1].target - b[1].progress())).slice(0, 40);
const display = [...unlocked.slice(-20), ...closest];
let html = '';
display.forEach(([key, ach]) => {
const isu = this.unlockedAchievements.has(key);
const prog = Math.min(ach.progress(), ach.target);
const pct = Math.min(100, (prog / ach.target * 100));
const icon = isu ? '⭐' : (pct >= 80 ? '✨' : pct >= 50 ? '🔓' : pct >= 20 ? '🔎' : '🔒');
const cls = isu ? 'unlocked' : 'locked';
const fillCls = isu ? 'complete' : '';
const rewardText = (isu && ach.reward > 0) ? ' (+' + ach.reward + ')' : '';
const overlayOpacity = isu ? 0 : Math.max(0.15, 0.92 - (pct / 100) * 0.85);
html += '<div class="achievement-item ' + cls + '">';
if (!isu) html += '<div class="achievement-overlay" style="opacity:' + overlayOpacity.toFixed(2) + '"></div>';
html += '<div class="achievement-name">' + icon + ' ' + ach.name + '</div>';
html += '<div class="achievement-desc">' + ach.desc + '</div>';
html += '<div class="achievement-progress">' + this.fmt(prog) + ' / ' + this.fmt(ach.target) + rewardText + '</div>';
html += '<div class="progress-bar"><div class="progress-bar-fill ' + fillCls + '" style="width:' + pct + '%"></div></div></div>';
});
c.innerHTML = html;
}

renderPPShop() {
const c = document.getElementById('ppShopList');
let html = '';
Object.entries(this.ppShop).forEach(([key, u]) => {
const ca = this.pp >= u.cost;
const cls = ca ? '' : 'disabled';
html += '<div class="pp-shop-item ' + cls + '" data-key="' + key + '">';
html += '<div class="pp-shop-name">' + u.name + '</div>';
html += '<div class="pp-shop-cost">' + u.cost + ' PP</div>';
html += '<div class="pp-shop-desc">' + u.desc + '</div>';
html += '<div class="pp-shop-lv">Lv.' + u.owned + '</div></div>';
});
c.innerHTML = html;
c.querySelectorAll('.pp-shop-item:not(.disabled)').forEach(el => {
el.addEventListener('click', () => this.buyPPUpgrade(el.dataset.key));
});
}

updateStats() {
const s = document.getElementById('statsPanel');
s.innerHTML = '<div>💰 クリック倍率: x' + this.getClickMultiplier().toFixed(2) + '</div>' +
'<div>📈 パッシブ倍率: x' + this.getPassiveMultiplier().toFixed(2) + '</div>' +
'<div>⚡ クリティカル率: ' + (this.getCritChance() * 100).toFixed(1) + '%</div>' +
'<div>💥 クリティカル倍率: x' + this.getCritMultiplier().toFixed(2) + '</div>' +
'<div>🔥 最大コンボ: ' + this.maxCombo + '</div>' +
'<div>🎁 ドロップ: ' + this.rareDrops + '回</div>' +
'<div>💀 クリティカル: ' + this.totalCrits + '回</div>' +
'<div>📦 所持品: ' + this.getOwnedItemsCount() + '/' + this.items.length + '</div>' +
'<div>⬆️ アップグレード: ' + this.getTotalUpgrades() + '/' + Object.keys(this.upgrades).length + '</div>' +
'<div>✨ プレステージ: ' + this.prestigeCount + '回</div>' +
'<div>🌟 累計PP: ' + (this.totalPP || this.pp) + '</div>';
}

addEvent(text) {
const t = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
this.eventLog.unshift('[' + t + '] ' + text);
if (this.eventLog.length > 100) this.eventLog.pop();
const l = document.getElementById('eventLog');
l.innerHTML = this.eventLog.map(e => '<div>' + e + '</div>').join('');
}

showNotification(text, type) {
const c = document.getElementById('notificationContainer');
const d = document.createElement('div');
d.className = 'notification ' + type;
d.textContent = text;
c.appendChild(d);
setTimeout(() => { d.style.opacity = '0'; d.style.transform = 'translateX(350px)'; setTimeout(() => d.remove(), 250); }, 3000);
}

showFloatingNumber(x, y, text, isCrit) {
const d = document.createElement('div');
d.className = 'floating-number';
d.textContent = text;
d.style.left = (x - 20 + Math.random() * 40) + 'px';
d.style.top = (y - 25) + 'px';
if (isCrit) { d.style.color = '#ff1744'; d.style.fontSize = '26px'; }
document.getElementById('itemContainer').appendChild(d);
setTimeout(() => d.remove(), 1000);
}

autoSave() { this.saveGame(); }

saveGame() {
const sd = {
money: this.money, moneyPerSec: this.moneyPerSec, baseMoneyPerClick: this.baseMoneyPerClick,
totalClicks: this.totalClicks, totalMoney: this.totalMoney, rareDrops: this.rareDrops,
totalCrits: this.totalCrits, maxCombo: this.maxCombo, pp: this.pp, prestigeCount: this.prestigeCount,
totalPP: this.totalPP || this.pp,
unlockedAchievements: Array.from(this.unlockedAchievements),
upgrades: {}, items: this.items.map(i => ({ id: i.id, owned: i.owned })),
ppShop: {}
};
Object.entries(this.upgrades).forEach(([k, u]) => { sd.upgrades[k] = { owned: u.owned, cost: u.cost }; });
Object.entries(this.ppShop).forEach(([k, u]) => { sd.ppShop[k] = { owned: u.owned, cost: u.cost }; });
localStorage.setItem('moneyClickerInfinitySave', JSON.stringify(sd));
}

loadGame() {
const s = localStorage.getItem('moneyClickerInfinitySave');
if (!s) return;
const d = JSON.parse(s);
this.money = d.money || 0; this.moneyPerSec = d.moneyPerSec || 0; this.baseMoneyPerClick = d.baseMoneyPerClick || 1;
this.totalClicks = d.totalClicks || 0; this.totalMoney = d.totalMoney || 0; this.rareDrops = d.rareDrops || 0;
this.totalCrits = d.totalCrits || 0; this.maxCombo = d.maxCombo || 0; this.pp = d.pp || 0;
this.prestigeCount = d.prestigeCount || 0; this.totalPP = d.totalPP || d.pp || 0;
this.unlockedAchievements = new Set(d.unlockedAchievements || []);
Object.entries(d.upgrades || {}).forEach(([k, ud]) => { if (this.upgrades[k]) { this.upgrades[k].owned = ud.owned || 0; this.upgrades[k].cost = ud.cost || this.upgrades[k].baseCost; } });
(d.items || []).forEach(si => { const it = this.items.find(i => i.id === si.id); if (it) it.owned = si.owned; });
Object.entries(d.ppShop || {}).forEach(([k, ud]) => { if (this.ppShop[k]) { this.ppShop[k].owned = ud.owned || 0; this.ppShop[k].cost = ud.cost || this.ppShop[k].baseCost; } });
}
}

const game = new MoneyClickerInfinity();
</script>
