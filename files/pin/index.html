<script>
const $=s=>document.querySelector(s),W=400,FLEN=76,AH=[1500,1100],GW=512,GH=820,S=GW/W,VH=GH/S,BR=12;
const TH=[
{n:'ネオンシティ',e:'NEON CITY',c:'#19f0ff',d:'#ff2bd6',b:'#1a1240',x:'バランス型・オールラウンド',g:1,k:1,s:1,m:1.6},
{n:'レトロロケット',e:'RETRO ROCKET',c:'#ffb02b',d:'#ff3b3b',b:'#2a1208',x:'重力つよめ・得点1.2倍',g:1.25,k:1,s:1.2,m:1.6},
{n:'ジャングル',e:'JUNGLE BEAT',c:'#7dff4a',d:'#ffe135',b:'#0c2410',x:'バンパー超パワー',g:1,k:1.5,s:1,m:1.6},
{n:'深海パラダイス',e:'DEEP SEA',c:'#35e0ff',d:'#3b6bff',b:'#071a33',x:'ふわふわ低重力',g:.75,k:1,s:1,m:1.6},
{n:'さくら祭り',e:'SAKURA FESTA',c:'#ff9ed8',d:'#ffffff',b:'#2a1020',x:'コンボが長持ち',g:1,k:1,s:1,m:2.6},
{n:'サイバードラゴン',e:'CYBER DRAGON',c:'#b05bff',d:'#b6ff3b',b:'#190b33',x:'バンパー強め・低重力',g:.9,k:1.3,s:1,m:1.8},
{n:'ゴールドカジノ',e:'GOLD CASINO',c:'#ffd23b',d:'#ff2b4d',b:'#2b1f06',x:'全得点1.5倍',g:1,k:1,s:1.5,m:1.6},
{n:'アイスパレス',e:'ICE PALACE',c:'#d9f4ff',d:'#6fb8ff',b:'#0d2238',x:'高反発・得点1.25倍',g:1,k:1.2,s:1.25,m:1.6}];
let ti=0,mode='boot',mute=0,ac,ren,sc3,cam3,cur,L1,L2,LT,GT,tm=0,fr=0,area=0,sco=0,shown=0,balls=3,combo=0,ctm=0,mult=1,fever=0,save=0,ball,lanes=[0,0,0],cam=0,shk=0,fl=0,pts=[],pops=[],pw=0,pd=1,chg=0,lastM=0,dx0=null,last=0,plg={d:0,v:0,rel:0};
const cv=$('#g'),cx=cv.getContext('2d');cv.width=GW;cv.height=GH;
const gc=document.createElement('canvas');gc.width=256;gc.height=160;const gx=gc.getContext('2d');
function beep(f,d,ty,v){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;d=d||.08;o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const hs=()=>{try{return+localStorage.getItem('spb')||0}catch(e){return 0}};
function ban(s,c){const e=$('#ban');e.textContent=s;e.style.color=c;e.classList.remove('s');void e.offsetWidth;e.classList.add('s')}
/* ---------- tables ---------- */
const mk=(h,m)=>{const L=[],s=(a,b,c,d,e)=>L.push([a,b,c,d,e==null?.4:e]);
 if(m){let px=390,py=250;for(let i=1;i<=18;i++){const a=Math.PI*i/18,x=200+190*Math.cos(a),y=250-190*Math.sin(a);s(px,py,x,y,.3);px=x;py=y}
  s(390,250,390,h-20);s(352,340,352,h-20);s(352,h-20,390,h-20);s(10,250,10,h-260)}
 else{s(10,0,352,0);s(10,0,10,h-260);s(352,0,352,h-260)}
 s(10,h-260,86,h-102,.3);s(352,h-260,276,h-102,.3);return L};
const WA=[mk(AH[0],1),mk(AH[1],0)];
const FL=[{px:93,py:AH[0]-95,s:1,a:.45,w:0,on:0},{px:269,py:AH[0]-95,s:-1,a:.45,w:0,on:0}];
const BP=[[110,430,24,0],[230,430,24,0],[170,520,24,0],[75,700,22,0],[265,700,22,0],[170,830,26,0],[85,980,22,0],[255,980,22,0],[170,1120,24,0],[60,1090,13,0],[290,1090,13,0]];
const BPB=[],ST=[];for(let r=0;r<9;r++)for(let k=0;k<6;k++){const x=(r%2?62:31)+k*62;if(x<345){BPB.push([x,170+r*85,9,0]);ST.push([x+31,212+r*85,1])}}
const BA=[BP,BPB];
const inL=b=>area===0&&b.x>352&&b.y>AH[0]-80,canL=()=>inL(ball)&&Math.abs(ball.vy)<150&&!(ball.cap>0);
function hit(b,x1,y1,x2,y2,e,rr,vf){
 const dx=x2-x1,dy=y2-y1;let t=((b.x-x1)*dx+(b.y-y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
 const qx=x1+dx*t,qy=y1+dy*t;let nx=b.x-qx,ny=b.y-qy;const d=Math.hypot(nx,ny),r=9+rr;
 if(d>=r||d===0)return;nx/=d;ny/=d;b.x=qx+nx*r;b.y=qy+ny*r;
 const v=vf?vf(t):[0,0],vn=(b.vx-v[0])*nx+(b.vy-v[1])*ny;
 if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny}}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=100+Math.random()*320;pts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.5,c:c})}}
function gain(n,x,y){const v=Math.round(n*mult*(fever>0?2:1)*TH[ti].s);sco+=v;pops.push({x:x,y:y-24,t:0,s:'+'+v,c:fever>0?'#ffe14a':'#fff'});const e=$('#sc');e.classList.remove('p');void e.offsetWidth;e.classList.add('p')}
function bump(p){const T=TH[ti];combo++;ctm=T.m;if(combo%5===0){mult=Math.min(9,mult+1);ban('COMBO x'+combo,T.c)}if(combo===12){fever=8;ban('FEVER!!','#ffe14a');fl=1}
 gain(p[2]<10?150:p[2]<15?300:100,p[0],p[1]);burst(p[0],p[1],p[2]<10?6:12,area?'#ffe14a':T.d);p[3]=1;shk=Math.min(9,shk+(p[2]<10?1:3));beep(280+Math.min(combo,24)*35,.07);vib(8)}
function warp(){area=1;ST.forEach(s=>s[2]=1);BPB.forEach(p=>p[3]=0);ball.x=181;ball.y=50;ball.vx=0;ball.vy=250;ball.tr=[];ball.cd=.5;cam=0;fl=1;shk=12;ban('BONUS AREA!','#ffe14a');beep(660,.15);beep(990,.3,'triangle')}
function back(){area=0;ball.x=170;ball.y=590;ball.vx=(Math.random()-.5)*400;ball.vy=-700;ball.cd=1.5;ball.tr=[];cam=Math.max(0,Math.min(AH[0]-VH,590-VH*.6));fl=1;gain(2000,170,560);ban('MAIN TABLE','#ffffff');beep(440,.2,'triangle')}
function phys(h){
 const T=TH[ti],b=ball,hh=AH[area],WL=WA[area];
 for(const f of FL){f.py=hh-95;const tg=f.on?-.5:.45,o=f.a,s=22*h*(f.on?1:.6);f.a+=Math.max(-s,Math.min(s,tg-f.a));f.w=(f.a-o)/h}
 if(b.cap>0){b.cap-=h;if(b.cap<=0)warp();return}
 if(b.cd>0)b.cd-=h;
 b.vy+=1000*T.g*h;const sp=Math.hypot(b.vx,b.vy);if(sp>1800){b.vx*=1800/sp;b.vy*=1800/sp}
 b.x+=b.vx*h;b.y+=b.vy*h;
 for(const w of WL)hit(b,w[0],w[1],w[2],w[3],w[4],0);
 if(!area&&plg.rel<=0)hit(b,355,AH[0]-62+plg.d,387,AH[0]-62+plg.d,.1,0);
 for(const f of FL)hit(b,f.px,f.py,f.px+f.s*FLEN*Math.cos(f.a),f.py+FLEN*Math.sin(f.a),.2,6,t=>[-f.s*Math.sin(f.a)*f.w*t*FLEN,Math.cos(f.a)*f.w*t*FLEN]);
 for(const p of BA[area]){const dx=b.x-p[0],dy=b.y-p[1],d=Math.hypot(dx,dy),rr=9+p[2];
  if(d<rr&&d>0){const nx=dx/d,ny=dy/d,kk=p[2]<10?140:320*T.k;b.x=p[0]+nx*rr;b.y=p[1]+ny*rr;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=2*vn*nx;b.vy-=2*vn*ny}b.vx+=nx*kk;b.vy+=ny*kk;bump(p)}}
 if(area){for(const s of ST)if(s[2]&&Math.hypot(b.x-s[0],b.y-s[1])<20){s[2]=0;gain(1000,s[0],s[1]);burst(s[0],s[1],16,'#ffe14a');beep(900+Math.random()*400,.1,'triangle');vib(10)}}
 else{
  [110,170,230].forEach((x,i)=>{if(!lanes[i]&&Math.hypot(b.x-x,b.y-180)<16){lanes[i]=1;gain(500,x,180);beep(700+i*150,.08);if(lanes.every(Boolean)){lanes=[0,0,0];mult=Math.min(9,mult+1);gain(3000,170,180);ban('LANE CLEAR!','#7dff4a');burst(170,180,30,'#7dff4a');fl=.6}}});
  if(!(b.cd>0)&&Math.hypot(b.x-170,b.y-620)<12){b.cap=.9;b.x=170;b.y=620;b.vx=b.vy=0;gain(5000,170,620);ban('JACKPOT!!','#ff4bd8');burst(170,620,40,'#ffe14a');shk=14;fl=1;beep(880,.3,'sawtooth');vib(60)}}
 if(sp<30&&!inL(b)){b.sk+=h;if(b.sk>4){b.vx=(Math.random()-.5)*600;b.vy=-500;b.sk=0;ban('NUDGE!','#ffffff')}}else b.sk=0}

 $('#tabT').classList.toggle('on',!tab);$('#tabU').classList.toggle('on',!!tab);
 $('#grid').innerHTML=L.map(it=>{const own=SV.own.includes(it.id),eq=SV[k]===it.id,bp=tab?'linear-gradient(90deg,'+(it.g1||'#1c0d3e')+','+(it.m1||'#2a1060')+')':it.c==='rainbow'?'linear-gradient(90deg,red,orange,yellow,lime,cyan,magenta)':'linear-gradient(90deg,transparent,'+(it.c||TH[ti].c)+')';
  return '<div class="it'+(eq?' eq':'')+'" data-id="'+it.id+'"><i style="background:'+bp+'"></i><b>'+it.n+'</b><span>'+(eq?'装備中':own?'そうび':it.p.toLocaleString()+' COIN')+'</span></div>'}).join('')}
$('#grid').onclick=e=>{const d=e.target.closest('.it');if(!d)return;const L=tab?SKN:TRL,k=tab?'skin':'trail',it=L.find(x=>x.id===d.dataset.id);
 if(!SV.own.includes(it.id)){if(SV.coins<it.p){beep(120,.2,'sawtooth');return}SV.coins-=it.p;SV.own.push(it.id);beep(900,.1);beep(1300,.2,'triangle')}
 SV[k]=it.id;sv();applySkin();shopR()};
$('#shopb').onclick=()=>{$('#title').classList.add('hide');$('#shop').classList.remove('hide');shopR()};
$('#shb').onclick=()=>{$('#shop').classList.add('hide');toTitle()};
$('#tabT').onclick=()=>{tab=0;shopR()};$('#tabU').onclick=()=>{tab=1;shopR()};
requestAnimationFrame(loop);
idb().then(ld).then(()=>{['t0','u0'].forEach(id=>{if(!SV.own.includes(id))SV.own.push(id)});toTitle()});
</script></body></html>
