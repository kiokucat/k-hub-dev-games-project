<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiPadControl v1.0.1 - 4P Controller Setup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* DEBUG MODE PANEL */
    .debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.95);
      color: #00ff00;
      font-family: 'Courier New', monospace;
      padding: 12px;
      border-radius: 8px;
      font-size: 10px;
      line-height: 1.3;
      max-width: 500px;
      max-height: 95vh;
      overflow-y: auto;
      border: 2px solid #00ff00;
      display: none;
      z-index: 9999;
    }

    .debug-panel.active {
      display: block;
    }

    .debug-version {
      font-weight: bold;
      color: #ffff00;
      margin-bottom: 8px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 6px;
    }

    .debug-player {
      margin-top: 8px;
      padding: 6px;
      border-left: 2px solid #00ff00;
      margin-bottom: 10px;
    }

    .debug-player-title {
      color: #ffff00;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .debug-player-meta {
      color: #00ff00;
      font-size: 9px;
      margin: 2px 0;
    }

    .debug-section {
      color: #ffff00;
      font-weight: bold;
      margin-top: 4px;
      margin-bottom: 2px;
      font-size: 9px;
    }

    .debug-info {
      color: #00ff00;
      margin: 1px 0;
      padding-left: 8px;
    }

    .debug-error {
      color: #ff0000;
    }

    .debug-on {
      color: #ff00ff;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Registration Screen */
    .registration-screen {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 60px 40px;
      text-align: center;
    }

    .registration-screen.hidden {
      display: none;
    }

    .registration-header {
      margin-bottom: 50px;
    }

    .registration-header h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }

    .registration-header p {
      font-size: 16px;
      color: #666;
    }

    .player-slots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .player-slot {
      padding: 20px;
      border: 3px solid #ddd;
      border-radius: 12px;
      background: #f9f9f9;
      transition: all 0.3s ease;
    }

    .player-slot.active {
      border-color: #667eea;
      background: #f0f4ff;
      transform: scale(1.05);
    }

    .player-slot.connected {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .player-slot.waiting {
      border-color: #f59e0b;
      background: #fffbf0;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .player-slot h3 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .player-slot .status {
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }

    .player-slot .device-info {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .status.waiting {
      color: #f59e0b;
      font-weight: bold;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status.connected {
      color: #10b981;
      font-weight: bold;
    }

    .status.empty {
      color: #999;
    }

    .current-prompt {
      font-size: 18px;
      color: #667eea;
      font-weight: bold;
      padding: 30px;
      background: #f0f4ff;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    /* Game Screen */
    .game-screen {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 20px;
      display: none;
    }

    .game-screen.active {
      display: block;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5e7eb;
    }

    .game-header h2 {
      color: #333;
      font-size: 24px;
    }

    .game-status {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .player-status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .player-status-badge.connected {
      background: #10b981;
      color: white;
    }

    .player-status-badge.disconnected {
      background: #e5e7eb;
      color: #666;
    }

    #gameCanvas {
      width: 100%;
      height: 400px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    .game-footer {
      margin-top: 20px;
      text-align: center;
    }

    /* Detection Log */
    #detectionLog {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      max-height: 150px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-entry.log-info {
      color: #0066cc;
    }

    .log-entry.log-warn {
      color: #ff9900;
    }

    .log-entry.log-error {
      color: #cc0000;
    }

    @media (max-width: 768px) {
      .player-slots {
        grid-template-columns: repeat(2, 1fr);
      }

      .registration-screen {
        padding: 40px 20px;
      }

      .registration-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Registration Screen -->
    <div id="registrationScreen" class="registration-screen">
      <div class="registration-header">
        <h1>🎮 MultiPadControl v1.0.1</h1>
        <p>Standard Gamepad 4P 登録デモ</p>
      </div>

      <div class="current-prompt">
        <span id="currentPrompt">コントローラーのAボタンを押してプレイヤー登録</span>
      </div>

      <div class="player-slots">
        <div id="slot1" class="player-slot">
          <h3>🔴 P1</h3>
          <div class="status empty" id="status1">待機中...</div>
          <div class="device-info" id="device1"></div>
        </div>
        <div id="slot2" class="player-slot">
          <h3>🟡 P2</h3>
          <div class="status empty" id="status2">待機中...</div>
          <div class="device-info" id="device2"></div>
        </div>
        <div id="slot3" class="player-slot">
          <h3>🟢 P3</h3>
          <div class="status empty" id="status3">待機中...</div>
          <div class="device-info" id="device3"></div>
        </div>
        <div id="slot4" class="player-slot">
          <h3>🔵 P4</h3>
          <div class="status empty" id="status4">待機中...</div>
          <div class="device-info" id="device4"></div>
        </div>
      </div>

      <div id="detectionLog"></div>

      <div class="button-group" style="margin-top: 30px;">
        <button id="resetBtn" class="btn-secondary">
          <i class="fas fa-redo"></i> リセット
        </button>
        <button id="startGameBtn" class="btn-primary" disabled style="opacity: 0.5; cursor: not-allowed;">
          <i class="fas fa-play"></i> ゲーム開始
        </button>
      </div>

      <div style="margin-top: 20px; font-size: 12px; color: #999;">
        💡 ヒント: Delete キーを押すと DEBUG 診断モードが表示されます
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="game-screen">
      <div class="game-header">
        <h2>🎮 ゲーム画面</h2>
        <div id="gameStatus" class="game-status"></div>
      </div>

      <canvas id="gameCanvas"></canvas>

      <div class="game-footer">
        <button id="backBtn" class="btn-secondary">
          <i class="fas fa-arrow-left"></i> 登録画面に戻る
        </button>
      </div>
    </div>
  </div>

  <!-- GamepadManager ライブラリを ES Module として読み込み -->
  <script type="module">
    import { GamepadManager } from './multipad.js';

    // ==========================================
    // Game Logic with Delta Time
    // ==========================================
    class TestGame {
      constructor(canvas, gamepadManager) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.gamepadManager = gamepadManager;
        this.lastFrameTime = performance.now();
        this.deltaTime = 0;
        
        this.players = [];
        for (let i = 1; i <= 4; i++) {
          if (this.gamepadManager.isPlayerConnected(i)) {
            this.players.push({
              num: i,
              x: 50 + (i - 1) * 150,
              y: 200 + (i - 1) * 50,
              vx: 0,
              vy: 0,
              speed: 150, // pixels per second
              color: ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A'][i - 1],
              colorIndex: 0,
              colors: [
                ['#FF6B6B', '#FF8E8E'],
                ['#4ECDC4', '#6FE7DE'],
                ['#45B7D1', '#67D5E4'],
                ['#FFA07A', '#FFB99E']
              ],
              buttonAPressed: false
            });
          }
        }

        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());
        this.gameLoop();
      }

      resizeCanvas() {
        const rect = this.canvas.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
      }

      update() {
        const now = performance.now();
        this.deltaTime = (now - this.lastFrameTime) / 1000;
        this.deltaTime = Math.min(this.deltaTime, 0.05);
        this.lastFrameTime = now;

        for (const player of this.players) {
          const input = this.gamepadManager.getPlayerInput(player.num);

          if (input) {
            // 🔑 Standard Input API を使用（A/B/X/Y/L/R/ZL/ZR/スティックすべて利用可能）
            player.vx = input.leftStickX * player.speed * this.deltaTime;
            player.vy = input.leftStickY * player.speed * this.deltaTime;

            // Aボタンで色変更
            if (input.A) {
              if (!player.buttonAPressed) {
                player.colorIndex = (player.colorIndex + 1) % 2;
                player.color = player.colors[player.num - 1][player.colorIndex];
              }
              player.buttonAPressed = true;
            } else {
              player.buttonAPressed = false;
            }
          } else {
            player.vx = 0;
            player.vy = 0;
          }

          // 位置更新
          player.x += player.vx;
          player.y += player.vy;

          // 画面内に留める
          player.x = Math.max(20, Math.min(this.canvas.width - 20, player.x));
          player.y = Math.max(20, Math.min(this.canvas.height - 20, player.y));
        }
      }

      draw() {
        // 背景
        this.ctx.fillStyle = 'rgba(245, 247, 250, 0.5)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // グリッド
        this.ctx.strokeStyle = 'rgba(200, 200, 200, 0.2)';
        this.ctx.lineWidth = 1;
        for (let i = 0; i < this.canvas.width; i += 50) {
          this.ctx.beginPath();
          this.ctx.moveTo(i, 0);
          this.ctx.lineTo(i, this.canvas.height);
          this.ctx.stroke();
        }
        for (let i = 0; i < this.canvas.height; i += 50) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, i);
          this.ctx.lineTo(this.canvas.width, i);
          this.ctx.stroke();
        }

        // プレイヤー
        for (const player of this.players) {
          const connected = this.gamepadManager.isPlayerConnected(player.num);

          // プレイヤー円
          this.ctx.fillStyle = player.color;
          this.ctx.beginPath();
          this.ctx.arc(player.x, player.y, 25, 0, Math.PI * 2);
          this.ctx.fill();

          // ボーダー
          this.ctx.strokeStyle = connected ? '#333' : '#ccc';
          this.ctx.lineWidth = 3;
          this.ctx.stroke();

          // プレイヤー番号
          this.ctx.fillStyle = '#fff';
          this.ctx.font = 'bold 16px Arial';
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(`P${player.num}`, player.x, player.y);
        }
      }

      gameLoop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.gameLoop());
      }
    }

    // ==========================================
    // UI Controller
    // ==========================================
    let gamepadManager;
    let testGame;

    window.addEventListener('DOMContentLoaded', () => {
      gamepadManager = new GamepadManager();
      gamepadManager.log('MultiPadControl 初期化', 'info');

      // UI 状態を定期的に更新する関数
      const updateUIStatus = () => {
        for (let p = 1; p <= 4; p++) {
          const slot = document.getElementById(`slot${p}`);
          const status = document.getElementById(`status${p}`);
          const device = document.getElementById(`device${p}`);

          if (gamepadManager.playerAssignments.has(p)) {
            const gpIndex = gamepadManager.playerAssignments.get(p);
            const gamepad = gamepadManager.getGamepad(gpIndex);

            slot.classList.remove('active', 'waiting');
            slot.classList.add('connected');
            status.className = 'status connected';
            status.textContent = '✓ 接続済み';
            device.textContent = gamepad ? gamepad.id || 'Gamepad' : '';
          } else {
            slot.classList.remove('connected');
            slot.classList.add('active', 'waiting');
            status.className = 'status waiting';
            status.textContent = 'Aボタンで登録...';
            device.textContent = '';
          }
        }

        // ゲーム開始ボタンの有効/無効を切り替え
        const startBtn = document.getElementById('startGameBtn');
        const connectedCount = gamepadManager.playerAssignments.size;
        if (connectedCount > 0) {
          startBtn.disabled = false;
          startBtn.style.opacity = '1';
          startBtn.style.cursor = 'pointer';
        } else {
          startBtn.disabled = true;
          startBtn.style.opacity = '0.5';
          startBtn.style.cursor = 'not-allowed';
        }
      };

      // UI を定期的に更新
      const uiUpdateInterval = setInterval(() => {
        updateUIStatus();
      }, 100);

      // Reset Button
      document.getElementById('resetBtn').addEventListener('click', () => {
        gamepadManager.reset();
        updateUIStatus();
      });

      // Start Game Button
      document.getElementById('startGameBtn').addEventListener('click', () => {
        const regScreen = document.getElementById('registrationScreen');
        const gameScreen = document.getElementById('gameScreen');

        regScreen.classList.add('hidden');
        gameScreen.classList.add('active');

        // ゲーム状態表示を更新
        const gameStatus = document.getElementById('gameStatus');
        gameStatus.innerHTML = '';
        for (let i = 1; i <= 4; i++) {
          const badge = document.createElement('div');
          badge.className = 'player-status-badge ' + 
            (gamepadManager.isPlayerConnected(i) ? 'connected' : 'disconnected');
          badge.textContent = `P${i}: ${gamepadManager.isPlayerConnected(i) ? '接続' : '未接続'}`;
          gameStatus.appendChild(badge);
        }

        // ゲーム開始
        const canvas = document.getElementById('gameCanvas');
        testGame = new TestGame(canvas, gamepadManager);
      });

      // Back Button
      document.getElementById('backBtn').addEventListener('click', () => {
        const regScreen = document.getElementById('registrationScreen');
        const gameScreen = document.getElementById('gameScreen');

        gameScreen.classList.remove('active');
        regScreen.classList.remove('hidden');

        gamepadManager.reset();
        updateUIStatus();
      });

      // 初期UI更新
      updateUIStatus();
    });
  </script>
</body>
</html>
