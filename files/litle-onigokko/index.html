function cpuStep(dt){const oni=G.oni=='cpu';C.mv=false;if(oni&&G.cool>0)return;C.rep-=dt;
 if(C.rep<=0){C.rep=oni?.5:1;let tx=Pl.x,tz=Pl.z;
  if(!oni){let best=-1e9;for(let i=0;i<24;i++){const x=C.x+R(-50,50),z=C.z+R(-50,50);if(Math.abs(x)>HALF-4||Math.abs(z)>HALF-4||blk[idx(x,z)])continue;
   let sc=Math.hypot(x-Pl.x,z-Pl.z)-.6*Math.hypot(x-C.x,z-C.z);if((x-C.x)*(Pl.x-C.x)+(z-C.z)*(Pl.z-C.z)>0)sc-=30;if(sc>best){best=sc;tx=x;tz=z}}}
  C.tg=[tx,tz];C.path=astar(C.x,C.z,tx,tz);C.pi=0}
 const pa=C.path;let j=C.pi;while(j<pa.length-1&&Math.hypot(pa[j][0]-C.x,pa[j][1]-C.z)<1.1)j++;let b=j;

function step(dt){
 const tag=G.game=='tag',coin=G.game=='coin';
 Pl.yaw+=((k.ArrowLeft?1:0)-(k.ArrowRight?1:0))*2.3*dt;Pl.pitch=Math.max(-1.45,Math.min(1.45,Pl.pitch+((k.ArrowUp?1:0)-(k.ArrowDown?1:0))*1.8*dt));

 else{
  const f=(k.KeyW?1:0)-(k.KeyS?1:0),s=(k.KeyD?1:0)-(k.KeyA?1:0),mv=f||s,sprint=(k.ShiftLeft||k.ShiftRight)&&!G.exh&&mv;
  if(sprint){G.stam=Math.max(0,G.stam-28*dt);if(G.stam<=0)G.exh=true}else{G.stam=Math.min(100,G.stam+(mv?10:22)*dt);if(G.stam>25)G.exh=false}
  const vx=-Math.sin(Pl.yaw)*f+Math.cos(Pl.yaw)*s,vz=-Math.cos(Pl.yaw)*f-Math.sin(Pl.yaw)*s,l=Math.hypot(vx,vz)||1,sp=sprint?9.2:6.2;
  if(mv){Pl.x+=vx/l*sp*dt;Pl.z+=vz/l*sp*dt}collide(Pl,.45);
  if(k.Space&&Pl.y==0)Pl.vy=7;Pl.vy-=22*dt;Pl.y=Math.max(0,Pl.y+Pl.vy*dt);if(Pl.y==0)Pl.vy=0;
  Pl.bob+=mv&&Pl.y==0?sp*dt*1.7:0}
 let d=1e9;
 if(tag){cpuStep(dt);C.amp+=((C.mv?1:0)-C.amp)*Math.min(1,dt*8);if(mixer)mixer.update(C.mv?dt:0);
  G.cool=Math.max(0,G.cool-dt);if(G.oni=='cpu')G.tc+=dt;else G.tp+=dt;
  d=Math.hypot(Pl.x-C.x,Pl.z-C.z);if(d<(Pl.car?2.8:1.5)&&G.cool<=0&&Pl.y<1)swap()}
 if(coin&&Math.hypot(Pl.x-cp.x,Pl.z-cp.z)<3.5){G.pts++;G.t+=5;toast('+5秒',700);newCp()}
 if(G.game!='free'){G.t-=dt;if(G.t<=0){G.mode='end';document.exitPointerLock();
  if(tag){const w=G.tp<G.tc;show(w?'あなたの勝ち!':G.tp==G.tc?'引き分け':'CPUの勝ち',`鬼だった時間 あなた ${G.tp.toFixed(1)}秒 / CPU ${G.tc.toFixed(1)}秒`,'もう一度')}
  else show('タイムアップ!',`チェックポイント ${G.pts}個`,'もう一度')}}
 // visuals
 if(Pl.car){const c=Pl.car;if(G.third){cam.position.set(c.x+Math.sin(Pl.yaw)*7.5,3.6,c.z+Math.cos(Pl.yaw)*7.5);cam.rotation.x=Pl.pitch-.15}else{cam.position.set(c.x+Math.sin(c.ry)*.25,1.3,c.z+Math.cos(c.ry)*.25);cam.rotation.x=Pl.pitch}}

 const oni=G.oni=='cpu';C.mesh.visible=mark.visible=tag;beam.visible=tag&&oni;

 const a=$('sp');if(a)a.textContent=tag?G.tp.toFixed(1):G.pts;const b2=$('sc');if(b2)b2.textContent=G.tc.toFixed(1);$('sb').style.width=G.stam+'%';
 $('vig').style.opacity=tag&&oni&&d<16?(1-d/16)*.9:0;

 else if(near){h.style.display='';$('hi').textContent='directions_car';$('ht').textContent='[E] 車に乗る'}else h.style.display='none';
