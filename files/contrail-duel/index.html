<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Contrail Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D view; HUD panels pinned to corners, radar bottom-left (top-centre on touch), overlay menu centred. */
:root{
  --ink:#0c1a28;
  --panel:rgba(9,22,36,.62);
  --line:rgba(255,255,255,.2);
  --amber:#ffc83d;
  --cyan:#7fe0ff;
  --red:#ff5a47;
  --text:#eef6fb;
  --muted:#a2b8c9;
  --display:'Oxanium','Zen Kaku Gothic New',system-ui,sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,40,0) 45%,rgba(255,40,20,.55) 100%)}
.panel{position:absolute;background:var(--panel);padding:8px 12px;border-left:3px solid var(--amber);font-family:var(--display);font-size:12px;letter-spacing:.08em;pointer-events:none;line-height:1.5}
.panel b{font-weight:700;font-size:18px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.panel small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-right:6px}
#tl{top:12px;left:max(12px,env(safe-area-inset-left,0px))}
#tr{top:12px;right:max(12px,env(safe-area-inset-right,0px));text-align:right;border-left:0;border-right:3px solid var(--amber)}
#bc{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:baseline;white-space:nowrap;border-left:0;border-bottom:3px solid var(--amber)}
.bar{width:170px;height:8px;background:rgba(255,255,255,.16);margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--cyan);transform-origin:left;transform:scaleX(1)}
.bar.heat i{background:var(--amber)}
.bar.low i,.bar.hot i{background:var(--red)}
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,56px);letter-spacing:.2em;text-shadow:0 2px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .3s;pointer-events:none}
#banner.show{opacity:1}
#warn{position:absolute;top:34%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(18px,3.4vw,30px);letter-spacing:.18em;color:var(--red);text-shadow:0 0 12px rgba(0,0,0,.6);pointer-events:none;opacity:0}
#warn.on{opacity:1;animation:blink .5s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#warn.on{animation:none}}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:16px;overflow:auto;background:linear-gradient(180deg,rgba(8,20,34,.55),rgba(8,20,34,.9));text-align:center}
#menu[hidden]{display:none}
#menu>:first-child{margin-top:auto}
#menu>:last-child{margin-bottom:auto}
.inmenu .panel{display:none}
#menu h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,84px);letter-spacing:.16em;line-height:1;text-wrap:balance}
#menu .trail{width:min(520px,80%);height:10px;background:
  linear-gradient(90deg,transparent,rgba(255,255,255,.9) 40%,rgba(255,255,255,.9) 60%,transparent) 0 0/100% 2px no-repeat,
  linear-gradient(90deg,transparent,rgba(255,255,255,.6) 30%,rgba(255,255,255,.6) 70%,transparent) 0 8px/100% 2px no-repeat}
#menu p{margin:0;color:var(--muted);max-width:52ch;line-height:1.7;font-size:15px}
#stats{font-family:var(--display);font-size:18px;letter-spacing:.1em;color:var(--amber);min-height:1.4em}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 22px;max-width:640px;width:100%;text-align:left;font-size:13px}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:3px 0}
.keys kbd{font-family:var(--display);font-weight:700;color:var(--amber);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.seg{background:transparent;border:1px solid var(--line);padding:7px 16px;font-family:var(--body);font-weight:700;font-size:14px}
.seg[aria-pressed="true"]{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
#go{background:var(--amber);color:var(--ink);border:0;padding:13px 48px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.2em}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch #touch{display:block}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:26px;width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:rgba(9,22,36,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.5)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid var(--line);background:rgba(9,22,36,.45);color:var(--text);font-family:var(--body);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
#bFire{right:max(18px,env(safe-area-inset-right,0px));bottom:30px;width:92px;height:92px;background:rgba(255,200,61,.35);border-color:var(--amber)}
#bMis{right:max(124px,env(safe-area-inset-right,0px));bottom:30px;width:64px;height:64px}
#bFlr{right:max(124px,env(safe-area-inset-right,0px));bottom:104px;width:54px;height:54px}
#bUp{right:max(18px,env(safe-area-inset-right,0px));bottom:132px;width:50px;height:50px}
#bDn{right:max(18px,env(safe-area-inset-right,0px));bottom:190px;width:50px;height:50px}
.touch #bc{top:128px;bottom:auto}
#mirror{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;box-sizing:content-box;border:3px solid rgba(255,255,255,.55);border-radius:10px;overflow:hidden;pointer-events:none;background:#000;box-shadow:0 2px 14px rgba(0,0,0,.45)}
#mirror[hidden]{display:none}
#mirrorC{transform:scaleX(-1)}
#mirror::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,0) 38%);pointer-events:none}
#mirror span{position:absolute;left:7px;top:3px;font-family:var(--display);font-size:10px;letter-spacing:.2em;color:#fff;opacity:.75;text-shadow:0 1px 3px #000;z-index:1}
@media (max-width:1200px){#mirror{bottom:64px}}
.touch #mirror{bottom:auto;top:84px}
.inmenu #mirror{display:none}
.opts kbd{font-family:var(--display);font-weight:700;color:var(--amber);margin-left:4px}
#comfort{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 36%,rgba(0,0,0,.9) 98%)}
.oh{font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 22px;max-width:680px;width:100%;text-align:left;font-size:13px}
.opts label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:3px 0;line-height:1.45}
.opts input{accent-color:var(--cyan);width:16px;height:16px;margin:2px 0 0;flex:none}
#modelStat{font-size:12px;color:var(--muted);min-height:1.2em}
</style>

<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="vignette"></div>
  <div id="comfort"></div>
  <div id="mirror" hidden><canvas id="mirrorC"></canvas><span>REAR</span></div>

  <div class="panel" id="tl">
    <div><small>機体</small><b id="hpT">100</b></div>
    <div class="bar" id="hpBar"><i></i></div>
    <div><small>機銃熱</small></div>
    <div class="bar heat" id="heatBar"><i></i></div>
  </div>
  <div class="panel" id="tr">
    <div><small>ウェーブ</small><b id="waveT">1</b></div>
    <div><small>スコア</small><b id="scoreT">0</b></div>
    <div><small>ハイスコア</small><span id="bestT">0</span></div>
  </div>
  <div class="panel" id="bc">
    <span><small>速度</small><b id="spdT">0</b> km/h</span>
    <span><small>高度</small><b id="altT">0</b> m</span>
    <span><small>出力</small><b id="thrT">60</b>%</span>
    <span><small>ミサイル</small><b id="mslT">4</b></span>
    <span><small>フレア</small><b id="flrT">3</b></span>
  </div>
  <div id="banner"></div>
  <div id="warn"></div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div class="tb" id="bFire">機銃</div>
    <div class="tb" id="bMis">ミサイル</div>
    <div class="tb" id="bFlr">フレア</div>
    <div class="tb" id="bUp">加速</div>
    <div class="tb" id="bDn">減速</div>
  </div>

  <div id="menu">
    <h1 id="mTitle">CONTRAIL DUEL</h1>
    <div class="trail"></div>
    <p id="mDesc">CPU操縦の戦闘機と空中戦。ウェーブごとに敵が増え、腕も上がります。敵を全機撃墜して生き残りましょう。</p>
    <div id="stats"></div>
    <div class="row" id="diff" role="group" aria-label="難易度">
      <button class="seg" data-d="0" aria-pressed="false">やさしい</button>
      <button class="seg" data-d="1" aria-pressed="true">ふつう</button>
      <button class="seg" data-d="2" aria-pressed="false">むずかしい</button>
    </div>
    <div class="oh">酔い軽減</div>
    <div class="row">
      <button class="seg" id="cOn">すべてON</button>
      <button class="seg" id="cOff">すべてOFF</button>
    </div>
    <div class="opts" id="opts">
      <label><input type="checkbox" data-o="level">水平固定カメラ(機体が傾いても画面は傾かない)</label>
      <label><input type="checkbox" data-o="vig">旋回中は視界の周辺を暗くする</label>
      <label><input type="checkbox" data-o="horizon">水平線ガイドを表示</label>
      <label><input type="checkbox" data-o="gentle">ゆっくり操作・ゆっくり追従</label>
      <label><input type="checkbox" data-o="noshake">画面の揺れと赤フラッシュをなくす</label>
      <label><input type="checkbox" data-o="fixfov">視野角を固定(速度で変えない)</label>
    </div>
    <div class="oh">追加機能</div>
    <div class="opts" id="mods">
      <label><input type="checkbox" data-m="mirror">バックミラー(右下に後方を表示)<kbd>V</kbd></label>
      <label><input type="checkbox" data-m="shadow">影モッド(機体・山・建物・雲の影。重いときはOFF)<kbd>G</kbd></label>
    </div>
    <div class="keys">
      <div><span>ピッチ</span><kbd>W / S</kbd></div>
      <div><span>ロール(旋回)</span><kbd>A / D</kbd></div>
      <div><span>ラダー</span><kbd>Q / E</kbd></div>
      <div><span>加速 / 減速</span><kbd>R / F</kbd></div>
      <div><span>機銃</span><kbd>Space</kbd></div>
      <div><span>ミサイル</span><kbd>Enter / B</kbd></div>
      <div><span>フレア</span><kbd>X</kbd></div>
      <div><span>上下反転</span><kbd>I</kbd></div>
      <div><span>ポーズ / ミュート</span><kbd>P / M</kbd></div>
      <div><span>機体モデルの向き反転</span><kbd>O</kbd></div>
      <div><span>バックミラー切替</span><kbd>V</kbd></div>
      <div><span>影モッド切替</span><kbd>G</kbd></div>
    </div>
    <div id="modelStat"></div>
    <button id="go">出撃</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
'use strict';
const T=THREE;
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const rand=(a,b)=>a+Math.random()*(b-a);
const V3=T.Vector3;
const AX=new V3(1,0,0),AY=new V3(0,1,0),AZ=new V3(0,0,1),NEG_Z=new V3(0,0,-1);
const ARENA=3400, EBULLET_V=520, PBULLET_V=620;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- comfort (motion sickness) options ---------- */
const opt={level:1,vig:1,horizon:1,gentle:0,noshake:1,fixfov:1};
try{Object.assign(opt,JSON.parse(store.get('contrailOpt')||'{}'));}catch(e){}
const saveOpt=()=>store.set('contrailOpt',JSON.stringify(opt));
/* ---------- add-on mods (mirror / shadow): independent of the comfort options ---------- */
const mods={mirror:1,shadow:matchMedia('(pointer:coarse)').matches?0:1};
try{Object.assign(mods,JSON.parse(store.get('contrailMods')||'{}'));}catch(e){}
const saveMods=()=>store.set('contrailMods',JSON.stringify(mods));

/* ---------- renderer / scene ---------- */
const glCanvas=$('gl'), hudCanvas=$('hud'), hctx=hudCanvas.getContext('2d');
const renderer=new T.WebGLRenderer({canvas:glCanvas,antialias:true});
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false; // updated once per frame by updateShadow()
const scene=new T.Scene();
const HORIZON=0xcfe6f2;
scene.fog=new T.Fog(HORIZON,900,6200);
const camera=new T.PerspectiveCamera(70,1,1,12000);
scene.add(new T.HemisphereLight(0xdcecff,0x6b7a4a,0.95));
const sun=new T.DirectionalLight(0xfff1d2,1.15); sun.position.set(500,900,350); scene.add(sun);
const SUN_DIR=new V3(500,900,350).normalize(),SH_R=350,SH_MAP=2048,SH_DIST=1000;
sun.shadow.mapSize.set(SH_MAP,SH_MAP);
{const sc=sun.shadow.camera;sc.left=-SH_R;sc.right=SH_R;sc.top=SH_R;sc.bottom=-SH_R;sc.near=1;sc.far=3400;sc.updateProjectionMatrix();}
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.6;
scene.add(sun.target);
const shR=new V3().crossVectors(new V3(0,1,0),SUN_DIR).normalize(),shU=new V3().crossVectors(SUN_DIR,shR),shT=new V3();
function updateShadow(){
  sun.castShadow=!!mods.shadow;
  if(!mods.shadow)return;
  const pp=player.pos,tx=2*SH_R/SH_MAP;   // snap to texel grid so shadows don't shimmer
  const a=Math.round(pp.dot(shR)/tx)*tx,b=Math.round(pp.dot(shU)/tx)*tx,d=pp.dot(SUN_DIR);
  shT.set(0,0,0).addScaledVector(shR,a).addScaledVector(shU,b).addScaledVector(SUN_DIR,d);
  sun.target.position.copy(shT);sun.position.copy(shT).addScaledVector(SUN_DIR,SH_DIST);
  renderer.shadowMap.needsUpdate=true;
}

const sky=new T.Mesh(new T.SphereGeometry(9000,24,12),new T.ShaderMaterial({
  side:T.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new T.Color(0x2f78c4)},hor:{value:new T.Color(HORIZON)}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(normalize(vP).y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.5)),1.);}'
}));
scene.add(sky);

// ground: patchwork fields
(function(){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  const cols=['#7a9a52','#8aa85c','#6c8c4a','#a3a863','#b9ac6a','#5f8148','#93a35a','#c0b374'];
  const n=8,s=512/n;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    g.fillStyle=cols[(Math.random()*cols.length)|0]; g.fillRect(x*s,y*s,s,s);
    g.strokeStyle='rgba(40,60,30,.18)'; g.lineWidth=1;
    for(let k=4;k<s;k+=7){g.beginPath();g.moveTo(x*s+k,y*s);g.lineTo(x*s+k,y*s+s);g.stroke();}
  }
  g.strokeStyle='rgba(60,70,40,.5)'; g.lineWidth=3;
  for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*s,0);g.lineTo(i*s,512);g.stroke();g.beginPath();g.moveTo(0,i*s);g.lineTo(512,i*s);g.stroke();}
  const tex=new T.CanvasTexture(c); tex.wrapS=tex.wrapT=T.RepeatWrapping; tex.repeat.set(22,22);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const ground=new T.Mesh(new T.PlaneGeometry(15000,15000),new T.MeshLambertMaterial({map:tex,color:0xb8b8b0}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
})();

// mountains
const mts=[];
(function(){
  const mat=new T.MeshStandardMaterial({color:0x7d8a78,flatShading:true,roughness:1});
  const snow=new T.MeshStandardMaterial({color:0xf2f6fa,flatShading:true,roughness:1});
  for(let i=0;i<34;i++){
    let x,z; do{const a=rand(0,6.283),r=rand(500,3300);x=Math.cos(a)*r;z=Math.sin(a)*r+300;}while(Math.hypot(x,z-700)<450);
    const r=rand(170,420),h=rand(160,460);
    mts.push({x,z,r,h});
    const m=new T.Mesh(new T.ConeGeometry(r,h,7,1),mat); m.position.set(x,h/2,z); m.rotation.y=rand(0,6); m.castShadow=m.receiveShadow=true; scene.add(m);
    if(h>260){const c=new T.Mesh(new T.ConeGeometry(r*.285,h*.285,7,1),snow); c.position.set(x,h*.858,z); c.rotation.y=m.rotation.y; c.castShadow=true; scene.add(c);}
  }
})();
const obs=[];
function heightAt(x,z){let h=0;for(let i=0;i<obs.length;i++){const o=obs[i],dx=x-o.x,dz=z-o.z;if(dx*dx+dz*dz<o.r*o.r&&o.h>h)h=o.h;}for(let i=0;i<mts.length;i++){const m=mts[i],dx=x-m.x,dz=z-m.z,d=Math.sqrt(dx*dx+dz*dz);if(d<m.r){const v=m.h*(1-d/m.r);if(v>h)h=v;}}return h;}

// clouds
(function(){
  const mat=new T.MeshLambertMaterial({color:0xffffff});
  const geo=new T.IcosahedronGeometry(1,1);
  for(let i=0;i<80;i++){
    const g=new T.Group(); const n=4+((Math.random()*3)|0), base=rand(40,90);
    for(let k=0;k<n;k++){const p=new T.Mesh(geo,mat);const s=base*rand(.6,1.1);p.scale.set(s*1.4,s*.7,s);p.position.set(rand(-1,1)*base*1.5,rand(-.2,.3)*base,rand(-1,1)*base*.8);p.castShadow=true;g.add(p);}
    g.position.set(rand(-4200,4200),rand(250,1200),rand(-4200,4200)); scene.add(g);
  }
})();

/* ---------- particles ---------- */
const pScale={value:800};
class Particles{
  constructor(n,additive,drag){
    this.n=n;this.i=0;this.drag=drag;
    this.pos=new Float32Array(n*3);this.vel=new Float32Array(n*3);this.col=new Float32Array(n*4);this.size=new Float32Array(n);
    this.life=new Float32Array(n);this.max=new Float32Array(n).fill(1);this.s0=new Float32Array(n);this.s1=new Float32Array(n);
    this.c0=new Float32Array(n*4);this.c1=new Float32Array(n*4);
    const g=new T.BufferGeometry();
    this.aPos=new T.BufferAttribute(this.pos,3).setUsage(T.DynamicDrawUsage);
    this.aCol=new T.BufferAttribute(this.col,4).setUsage(T.DynamicDrawUsage);
    this.aSize=new T.BufferAttribute(this.size,1).setUsage(T.DynamicDrawUsage);
    g.setAttribute('position',this.aPos);g.setAttribute('color',this.aCol);g.setAttribute('size',this.aSize);
    const m=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:additive?T.AdditiveBlending:T.NormalBlending,uniforms:{scale:pScale},
      vertexShader:'attribute float size;attribute vec4 color;uniform float scale;varying vec4 vC;void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*scale/max(-mv.z,1.);gl_Position=projectionMatrix*mv;}',
      fragmentShader:'varying vec4 vC;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.15,d)*vC.a;gl_FragColor=vec4(vC.rgb,a);}'});
    this.points=new T.Points(g,m);this.points.frustumCulled=false;scene.add(this.points);

function makePlane(main,accent){

}

  const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);

function steer(e,desired,rate,dt){
  e.fwd(tv);const ang=tv.angleTo(desired);let bankT=0;
  if(ang>1e-4){
    const step=Math.min(ang,rate*dt);
    axisV.crossVectors(tv,desired);
    if(axisV.lengthSq()<1e-10)axisV.set(0,1,0).applyQuaternion(e.q);
    axisV.normalize();
    tv3.set(0,1,0).applyQuaternion(e.q);
    bankT=clamp(axisV.dot(tv3)*(step/dt)*.8,-1.3,1.3);
    tq.setFromAxisAngle(axisV,step);e.q.premultiply(tq);
  }
  tv3.set(1,0,0).applyQuaternion(e.q);const upY=tv2.set(0,1,0).applyQuaternion(e.q).y;
  if(upY>.15)rotL(e.q,AZ,-tv3.y*3*dt);else rotL(e.q,AZ,2.5*dt);
  e.bank+=(bankT-e.bank)*(1-Math.exp(-5*dt));e.model.rotation.z=e.bank;
}

function aiUpdate(e,dt){
  const p=player;const f=e.fwd(new V3());

  e.errT-=dt;if(e.errT<=0){e.errT=rand(1,2);const s=(1.15-e.skill)*28;e.err.set(rand(-s,s),rand(-s,s),rand(-s,s));}
  const lead=dist/(EBULLET_V+e.speed);
  const aim=new V3().copy(p.pos).addScaledVector(p.vel,lead*Math.min(1,e.skill)).add(e.err);
  const aimDir=aim.sub(e.pos).normalize();
  let desired=aimDir.clone();

  // threats
  let missileThreat=null;
  for(const m of missiles)if(m.team===0&&m.target===e&&m.pos.distanceTo(e.pos)<650){missileThreat=m;break;}
  e.jinkT-=dt;
  if(e.mode==='pursue'){
    if(missileThreat){e.mode='evade';e.evadeT=rand(.9,1.4);
      e.evadeDir.crossVectors(missileThreat.dir,AY.clone().multiplyScalar(Math.random()<.5?1:-1)).add(new V3(0,rand(-.4,.4),0)).normalize();}
    else if(dist<110){e.mode='evade';e.evadeT=rand(1,1.8);
      e.evadeDir.copy(f).addScaledVector(toP,-.4);e.evadeDir.y+=rand(-.3,.5);
      tv2.crossVectors(toP,AY).multiplyScalar(Math.random()<.5?1:-1);e.evadeDir.addScaledVector(tv2,.8).normalize();}
    else{
      p.fwd(tv2);const aimedAt=tv2.dot(tv3.copy(e.pos).sub(p.pos).normalize());
      if(aimedAt>.96&&dist<650&&e.jinkT<=0){
        e.jinkT=rand(1.2,3.2)/Math.max(.5,e.skill);
        if(Math.random()<.35+e.skill*.35){e.mode='evade';e.evadeT=rand(.7,1.5);
          tv2.set(rand(-1,1),rand(-1,1),rand(-1,1));e.evadeDir.crossVectors(toP,tv2).normalize();}
      }
    }
  }
  if(e.mode==='evade'){e.evadeT-=dt;desired.copy(e.evadeDir);if(e.evadeT<=0)e.mode='pursue';}

  // terrain / bounds / ceiling
  let emergency=false;
  for(const d of[160,360]){
    const ax=e.pos.x+f.x*d,az=e.pos.z+f.z*d,ay=e.pos.y+f.y*d;
    if(ay<heightAt(ax,az)+85){emergency=true;break;}
  }
  if(e.pos.y<heightAt(e.pos.x,e.pos.z)+70)emergency=true;
  if(emergency){desired.set(f.x*.35,1,f.z*.35).normalize();}
  else{
    const hd=Math.hypot(e.pos.x,e.pos.z);
    if(hd>ARENA-250){desired.set(-e.pos.x,0,-e.pos.z).normalize();desired.y=.1;desired.normalize();}
    if(e.pos.y>1400&&desired.y>-.1){desired.y=-.1;desired.normalize();}
    if(e.pos.y<220&&desired.y<.15&&!emergency){desired.y=.15;desired.normalize();}
  }
  steer(e,desired,e.turn*(e.mode==='evade'?1.15:1)*(emergency?1.3:1),dt);

  // speed
  const wantSpd=e.base*(dist>900?1.18:dist<200?.9:1);
  e.speed+=(wantSpd-e.speed)*(1-Math.exp(-1.2*dt));

  // guns
  f.copy(e.fwd(f));
  const angErr=f.angleTo(aimDir);
  if(e.fireWin>0){e.fireWin-=dt;}
  else{
    e.rest-=dt;
    if(e.rest<=0&&e.mode==='pursue'&&dist<720&&angErr<.07+(1.2-e.skill)*.06){e.fireWin=rand(.7,1.1);e.rest=rand(.9,1.8)/Math.max(.6,e.skill);}
  }
  e.fireCd-=dt;
  if(e.fireWin>0&&e.fireCd<=0&&dist<780){
    e.fireCd+=1/(5+e.skill*2);if(e.fireCd<0)e.fireCd=0;
    const sp=(1.3-e.skill)*.012+.004;
    tv2.copy(f);tv2.x+=rand(-sp,sp);tv2.y+=rand(-sp,sp);tv2.z+=rand(-sp,sp);tv2.normalize();
    tv3.set(gunSide*2.3,0,-1).applyQuaternion(e.q).add(e.pos);gunSide=-gunSide;
    fireBullet(1,tv3,tv2,EBULLET_V,e.vel,5*diffCfg[diff].dmg);
  }
  // missiles (later waves)
  e.mslCd-=dt;
  if(wave>=3&&e.mslCd<=0&&e.mode==='pursue'&&dist>450&&dist<1400&&angErr<.2&&p.alive&&!p.dying){
    e.mslCd=rand(16,26)/Math.max(.7,e.skill*.9);
    launchMissile(1,tv3.copy(e.pos).addScaledVector(f,4),f,p,e.speed+20);
  }
}

/* ---------- player control ---------- */
const keys=Object.create(null);
const touch={x:0,y:0,fire:false,up:false,dn:false};
let mouseFire=false,pressedMissile=false,pressedFlare=false;
function readInput(){
  let pitch=0,roll=0,yaw=0,thr=0;
  if(keys.KeyS||keys.ArrowDown)pitch+=1;if(keys.KeyW||keys.ArrowUp)pitch-=1;
  if(keys.KeyD||keys.ArrowRight)roll+=1;if(keys.KeyA||keys.ArrowLeft)roll-=1;
  if(keys.KeyE)yaw+=1;if(keys.KeyQ)yaw-=1;
  if(keys.KeyR||keys.ShiftLeft||keys.ShiftRight||touch.up)thr+=1;if(keys.KeyF||touch.dn)thr-=1;
  pitch+=touch.y;roll+=touch.x;
  if(invertY)pitch=-pitch;
  return{pitch:clamp(pitch,-1,1),roll:clamp(roll,-1,1),yaw,thr,fire:!!(keys.Space||keys.KeyJ||mouseFire||touch.fire)};
}
const ctl={pitch:0,roll:0,yaw:0};
function updatePlayer(dt){
  const p=player;
  if(p.dying){updateDying(p,dt);return;}
  const inp=readInput();const k=1-Math.exp(-9*dt);
  ctl.pitch+=(inp.pitch-ctl.pitch)*k;ctl.roll+=(inp.roll-ctl.roll)*k;ctl.yaw+=(inp.yaw-ctl.yaw)*k;
  p.thr=clamp(p.thr+inp.thr*.5*dt,0,1);
  const gm=opt.gentle?1:0;
  rotL(p.q,AX,ctl.pitch*(gm?.9:1.35)*dt);
  rotL(p.q,AZ,-ctl.roll*(gm?1.5:2.7)*dt);
  rotL(p.q,AY,-ctl.yaw*(gm?.5:.7)*dt);
  tv.set(1,0,0).applyQuaternion(p.q);tv2.set(0,1,0).applyQuaternion(p.q);
  // coordinated turn from bank
  tq.setFromAxisAngle(AY,tv.y*(gm?.8:1.05)*dt);p.q.premultiply(tq);
  // wing levelling when no roll input
  if(tv2.y>.2)rotL(p.q,AZ,-tv.y*.8*dt*(1-Math.abs(ctl.roll)));
  p.q.normalize();
  p.fwd(tv3);
  const target=52+p.thr*100-tv3.y*38;
  p.speed+=(target-p.speed)*(1-Math.exp(-1.1*dt));
  p.vel.copy(tv3).multiplyScalar(p.speed);p.pos.addScaledVector(p.vel,dt);
  if(p.pos.y>1700){p.pos.y=1700;}

  // guns & heat
  heat=Math.max(0,heat-(overheated?.28:.32)*dt);
  if(overheated&&heat<.4)overheated=false;
  gunAcc=Math.max(0,gunAcc-dt);
  if(inp.fire&&!overheated){
    const interval=1/13;
    while(gunAcc<=0){
      gunAcc+=interval;heat+=.045;
      tv.set(gunSide*2.4,0,-1.5).applyQuaternion(p.q).add(p.pos);gunSide=-gunSide;
      tv2.copy(tv3);tv2.x+=rand(-.002,.002);tv2.y+=rand(-.002,.002);tv2.normalize();
      fireBullet(0,tv,tv2,PBULLET_V,p.vel,10);sfxGun();
      if(heat>=1){overheated=true;heat=1;banner('オーバーヒート',900);break;}
    }
  }
  // lock-on
  let best=null,bestAng=.38;
  for(const e of enemies){if(e.dying)continue;
    tv.copy(e.pos).sub(p.pos);const d=tv.length();if(d>1500)continue;
    const a=tv3.angleTo(tv.normalize());if(a<bestAng){bestAng=a;best=e;}}
  if(best&&best===lockTarget)lockT=Math.min(1,lockT+dt/.8);
  else{lockTarget=best;lockT=0;}
  // missiles/flares
  if(pressedMissile){pressedMissile=false;
    if(msl>0){msl--;launchMissile(0,tv.copy(p.pos).addScaledVector(tv3,3).addScaledVector(AY.clone().applyQuaternion(p.q),-1),tv3,(lockTarget&&lockT>=1)?lockTarget:null,p.speed+30);}
  }
  if(pressedFlare){pressedFlare=false;
    if(flr>0){flr--;dropFlare(p);}
  }
  mslRegen+=dt;if(mslRegen>14&&msl<4){msl++;mslRegen=0;}
  if(msl>=4)mslRegen=0;

  // ground / mountain collision
  const gh=heightAt(p.pos.x,p.pos.z);
  hud.pullUp=(p.pos.y<gh+120&&tv3.y<-.05)||p.pos.y<gh+60;
  if(p.pos.y<gh+2.5){p.pos.y=gh+2.5;explosion(p.pos,1.4);damage(p,999,false);}
  // arena bounds
  const hd=Math.hypot(p.pos.x,p.pos.z);
  if(hd>ARENA){outT+=dt;hud.outOfBounds=true;if(outT>6){damage(p,999,false);}}
  else{outT=Math.max(0,outT-dt*2);hud.outOfBounds=outT>0&&hd>ARENA-100;}
}
function dropFlare(p){
  const f={pos:p.pos.clone(),vel:new V3(rand(-8,8),-8,rand(-8,8)).addScaledVector(p.vel,.5),life:4.5,alive:true,acc:0};
  flares.push(f);
  tv.copy(p.pos);
  for(const m of missiles)if(m.team===1&&m.target===p&&m.pos.distanceTo(p.pos)<1800&&Math.random()<.8)m.target=f;
  noise(.5,'bandpass',3000,1500,.2);
}
function updateDying(p,dt){
  p.dieT+=dt;
  rotL(p.q,AZ,p.dieDir*3.2*dt);rotL(p.q,AX,-.45*dt);
  p.fwd(tv3);p.speed*=Math.exp(-.12*dt);
  p.vel.copy(tv3).multiplyScalar(p.speed);p.vel.y-=Math.min(p.dieT,3)*45;
  p.pos.addScaledVector(p.vel,dt);
  const gh=heightAt(p.pos.x,p.pos.z);
  if(p.pos.y<gh+2||p.dieT>3.4){explosion(p.pos,p===player?1.8:1.5);p.alive=false;p.group.visible=false;}
}
function updateEnemyDying(e,dt){updateDying(e,dt);if(!e.alive)removePlane(e);}

/* ---------- waves ---------- */
function startWave(){
  wave++;
  const count=Math.min(6,1+Math.floor(wave/2));
  for(let i=0;i<count;i++)spawnEnemy(Math.min(1.1,(.38+.075*wave+rand(-.04,.1))*diffCfg[diff].skill));
  banner('WAVE '+wave,1800);
  if(wave>1){player.hp=Math.min(100,player.hp+30);msl=4;flr=3;}
}

/* ---------- simulation step ---------- */
function updateWorld(dt){
  const p=player;
  if(p.alive)updatePlayer(dt);
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dying){updateEnemyDying(e,dt);continue;}
    if(p.alive&&!p.dying)aiUpdate(e,dt);else{e.speed=e.speed;steer(e,e.fwd(tv2).clone(),1,dt);}
    e.fwd(tv3);e.vel.copy(tv3).multiplyScalar(e.speed);e.pos.addScaledVector(e.vel,dt);
    const gh=heightAt(e.pos.x,e.pos.z);
    if(e.pos.y<gh+2){e.pos.y=gh+2;explosion(e.pos,1.4);e.hp=0;e.dying=true;e.alive=false;removePlane(e);continue;}
    if(p.alive&&!p.dying&&e.pos.distanceToSquared(p.pos)<64){damage(p,40,false);damage(e,200,true);}
  }
  // planes: contrails, damage smoke, glow
  const all=[player,...enemies];
  for(const pl of all){
    if(!pl.alive)continue;
    pl.glow.scale.set(1,1,.6+(pl===player?pl.thr:.6)*.9);
    if(pl.dying){pl.smkAcc+=dt;while(pl.smkAcc>.025){pl.smkAcc-=.025;
      fire.emit(pl.pos.x,pl.pos.y,pl.pos.z,rand(-4,4),rand(-4,4),rand(-4,4),.5,5,1,C_FIRE0,C_FIRE1);
      smoke.emit(pl.pos.x,pl.pos.y,pl.pos.z,rand(-3,3),rand(0,6),rand(-3,3),2.4,5,16,C_SMK0,C_SMK1);}continue;}
    pl.trailAcc+=dt;
    const iv=.035;
    while(pl.trailAcc>=iv){
      pl.trailAcc-=iv;
      for(const s of[-1,1]){
        tv.set(s*(pl.tip||5.6),0,pl.tail?pl.tail*.4:1.6).applyQuaternion(pl.q).add(pl.pos).addScaledVector(pl.vel,-pl.trailAcc);
        smoke.emit(tv.x,tv.y,tv.z,0,0,0,1.8,.7,3.2,C_TRAIL0,C_TRAIL1);
      }
    }
    if(pl.hp<55){
      pl.smkAcc+=dt;const iv2=pl.hp<28?.03:.07;
      while(pl.smkAcc>=iv2){pl.smkAcc-=iv2;
        tv.set(0,.2,3.5).applyQuaternion(pl.q).add(pl.pos);
        smoke.emit(tv.x,tv.y,tv.z,rand(-2,2),rand(0,3),rand(-2,2),1.8,2.4,9,C_SMK0,C_SMK1);
        if(pl.hp<28)fire.emit(tv.x,tv.y,tv.z,rand(-2,2),rand(0,2),rand(-2,2),.35,2.2,.6,C_FIRE0,C_FIRE1);}
    }
  }
  // bullets
  for(const b of bullets){
    if(!b.active)continue;
    b.prev.copy(b.pos);b.pos.addScaledVector(b.vel,dt);b.life-=dt;
    if(b.life<=0){b.active=false;b.mesh.visible=false;continue;}
    if(b.pos.y<heightAt(b.pos.x,b.pos.z)+.5){sparks(b.pos,3,1.4);b.active=false;b.mesh.visible=false;continue;}
    const targets=b.team===0?enemies:[player];
    for(const t of targets){
      if(!t.alive||t.dying)continue;
      if(segDistSq(b.prev,b.pos,t.pos)<42){damage(t,b.dmg,b.team===0);b.active=false;b.mesh.visible=false;break;}
    }
  }
  // missiles
  for(let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];m.t+=dt;
    m.speed=Math.min(330,m.speed+240*dt);
    if(m.target&&(!m.target.alive||m.target.dying))m.target=null;
    if(m.target&&m.t>.25){
      tv.copy(m.target.pos).sub(m.pos).normalize();
      const ang=m.dir.angleTo(tv);
      if(ang>1e-4&&ang<3.1){axisV.crossVectors(m.dir,tv).normalize();m.dir.applyAxisAngle(axisV,Math.min(ang,m.rate*dt));}
    }
    m.prev.copy(m.pos);m.pos.addScaledVector(m.dir,m.speed*dt);
    m.mesh.quaternion.setFromUnitVectors(NEG_Z,m.dir);
    m.smk+=dt;while(m.smk>=.02){m.smk-=.02;
      tv.copy(m.pos).addScaledVector(m.dir,-2.2-m.smk*m.speed);
      smoke.emit(tv.x,tv.y,tv.z,0,0,0,1.5,1.2,5,C_GREY0,C_GREY1);
      fire.emit(tv.x,tv.y,tv.z,0,0,0,.12,2.2,.5,C_FIRE0,C_FIRE1);}
    let det=false;
    if(m.t>7||m.pos.y<heightAt(m.pos.x,m.pos.z))det=true;
    const victims=m.team===0?enemies:[player];
    if(!det)for(const v of victims){if(v.alive&&!v.dying&&segDistSq(m.prev,m.pos,v.pos)<(m.target===v?300:150)){det=true;break;}}
    if(det){
      explosion(m.pos,.8);
      for(const v of victims){if(!v.alive||v.dying)continue;
        const d=v.pos.distanceTo(m.pos);if(d<42)damage(v,(m.team===0?85:60*diffCfg[diff].dmg)*clamp(1-d/50,.35,1),m.team===0);}
      scene.remove(m.mesh);missiles.splice(i,1);
    }
  }
  // flares
  for(let i=flares.length-1;i>=0;i--){
    const f=flares[i];f.life-=dt;f.vel.y-=14*dt;f.vel.multiplyScalar(Math.exp(-.35*dt));f.pos.addScaledVector(f.vel,dt);
    f.acc+=dt;while(f.acc>=.03){f.acc-=.03;
      fire.emit(f.pos.x,f.pos.y,f.pos.z,rand(-2,2),rand(-2,2),rand(-2,2),.5,5,2,C_FLARE0,C_FLARE1);
      smoke.emit(f.pos.x,f.pos.y,f.pos.z,0,0,0,1.2,1.2,4,C_GREY0,C_GREY1);}
    if(f.life<=0){f.alive=false;flares.splice(i,1);}
  }
  smoke.update(dt);fire.update(dt);
  hud.hitMark=Math.max(0,hud.hitMark-dt);

  // missile warning
  hud.warnMissile=0;
  for(const m of missiles)if(m.team===1&&m.target===player){const d=m.pos.distanceTo(player.pos);if(!hud.warnMissile||d<hud.warnMissile)hud.warnMissile=d;}

  // waves / game flow
  if(state==='play'){
    if(enemies.every(e=>e.dying||!e.alive)){
      waveWait-=dt;if(waveWait<=0){startWave();waveWait=3;}
    }else waveWait=3;
    if(player.dying||!player.alive){overT-=dt;if(overT<=0)gameOver();}
  }
}

/* ---------- camera ---------- */
const camF=new V3(0,0,-1),m4=new T.Matrix4(),prevCamQ=new T.Quaternion(),zeroV=new V3(),upV=new V3();
let vigVal=0;
function updateCamera(dt){
  if(state==='menu'){
    menuAngle+=dt*.25;
    camera.position.set(player.pos.x+Math.sin(menuAngle)*30,player.pos.y+6,player.pos.z+Math.cos(menuAngle)*30);
    camera.lookAt(player.pos);camera.fov=55;camera.updateProjectionMatrix();prevCamQ.copy(camera.quaternion);return;
  }
  const slow=opt.gentle?3:7;
  player.fwd(tv3);
  if(!camInit){camQ.copy(player.q);camF.copy(tv3);camInit=true;}
  if(opt.level){
    // camera keeps the horizon level; only the aircraft rolls on screen
    camF.lerp(tv3,1-Math.exp(-slow*.85*dt)).normalize();
    tv.copy(camF).multiplyScalar(-15.5);tv.y+=3.8;
    camera.position.copy(player.pos).add(tv);
    const t=clamp((Math.abs(camF.y)-.8)/.17,0,1);
    upV.set(0,1,0).lerp(tv2.set(0,1,0).applyQuaternion(player.q),t).normalize();
    m4.lookAt(zeroV,camF,upV);camera.quaternion.setFromRotationMatrix(m4);
    camQ.copy(camera.quaternion);
  }else{
    camQ.slerp(player.q,1-Math.exp(-slow*dt));
    tv.set(0,3.2,15.5).applyQuaternion(camQ);
    camera.position.copy(player.pos).add(tv);
    camera.quaternion.copy(camQ);
  }
  rotL(camera.quaternion,AX,-.06);
  const gh=heightAt(camera.position.x,camera.position.z)+4;if(camera.position.y<gh)camera.position.y=gh;
  shake*=Math.exp(-3.5*dt);
  if(!opt.noshake&&shake>.01){camera.position.x+=rand(-1,1)*shake*1.2;camera.position.y+=rand(-1,1)*shake*1.2;camera.position.z+=rand(-1,1)*shake*1.2;}
  const fov=opt.fixfov?72:68+clamp((player.speed-100)*.16,-4,10);
  if(Math.abs(fov-camera.fov)>.05){camera.fov=fov;camera.updateProjectionMatrix();}
  // peripheral darkening follows how fast the view turns
  const w=camera.quaternion.angleTo(prevCamQ)/Math.max(dt,1e-3);prevCamQ.copy(camera.quaternion);
  vigVal+=(clamp(w/1.1,0,1)-vigVal)*(1-Math.exp(-6*dt));
}

/* ---------- rear-view mirror ---------- */
const rcam=new T.PerspectiveCamera(60,2,1,12000);
const mirEl=$('mirror'),mirC=$('mirrorC'),mctx=mirC.getContext('2d');
let mirW=240,mirH=110,mirShown=false;
const mF=new V3(),mUp=new V3(),mTmp=new V3();
function sizeMirror(w){
  mirW=Math.round(clamp(w*.24,150,300));mirH=Math.round(mirW*.46);
  mirEl.style.width=mirW+'px';mirEl.style.height=mirH+'px';
  mirC.width=Math.round(mirW*DPR);mirC.height=Math.round(mirH*DPR);
  rcam.aspect=mirW/mirH;rcam.updateProjectionMatrix();
}
function renderMirror(){
  const on=!!mods.mirror&&(state==='play'||state==='over');
  if(on!==mirShown){mirShown=on;mirEl.hidden=!on;}
  if(!on)return;
  const w=window.innerWidth,h=window.innerHeight;
  player.fwd(mF);
  mUp.set(0,1,0);
  const t=clamp((Math.abs(mF.y)-.8)/.17,0,1);
  if(t>0)mUp.lerp(mTmp.set(0,1,0).applyQuaternion(player.q),t).normalize();
  rcam.position.copy(player.pos).addScaledVector(mF,-7).addScaledVector(mUp,1.8);
  rcam.up.copy(mUp);
  rcam.lookAt(mTmp.copy(rcam.position).addScaledVector(mF,-1));
  // draw the rear view into a corner of the GL canvas, copy it to the mirror canvas, then the main pass overwrites it
  renderer.setScissorTest(true);renderer.setViewport(w-mirW,0,mirW,mirH);renderer.setScissor(w-mirW,0,mirW,mirH);
  sky.position.copy(rcam.position);
  pScale.value=mirH*DPR/(2*Math.tan(rcam.fov*Math.PI/360));
  renderer.render(scene,rcam);
  renderer.setScissorTest(false);renderer.setViewport(0,0,w,h);
  const cv=renderer.domElement,sw=Math.round(mirW*DPR),sh=Math.round(mirH*DPR);
  mctx.drawImage(cv,cv.width-sw,cv.height-sh,sw,sh,0,0,mirC.width,mirC.height);
  // enemy markers (drawn un-flipped; the CSS mirror flips them together with the picture)
  mctx.strokeStyle='#ff5a47';mctx.lineWidth=2*DPR;
  for(const e of enemies){
    if(e.dying)continue;
    mTmp.copy(e.pos).applyMatrix4(rcam.matrixWorldInverse);
    if(mTmp.z>=0)continue;
    const d=-mTmp.z;mTmp.applyMatrix4(rcam.projectionMatrix);
    if(Math.abs(mTmp.x)>1||Math.abs(mTmp.y)>1)continue;
    const x=(mTmp.x*.5+.5)*mirC.width,y=(-mTmp.y*.5+.5)*mirC.height,r=clamp(900/d*5,5,16)*DPR;
    mctx.strokeRect(x-r,y-r,r*2,r*2);
  }
}

/* ---------- HUD ---------- */
const cache={};
function setText(id,v){if(cache[id]!==v){cache[id]=v;$(id).textContent=v;}}
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  hudCanvas.width=Math.round(w*DPR);hudCanvas.height=Math.round(h*DPR);
  sizeMirror(w);
}
window.addEventListener('resize',resize);
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch)$('app').classList.add('touch');

const sp=new V3();
function toScreen(v,w,h){
  sp.copy(v).applyMatrix4(camera.matrixWorldInverse);
  const behind=sp.z>0;
  sp.applyMatrix4(camera.projectionMatrix);
  let x=sp.x,y=sp.y;if(behind){x=-x;y=-y;}
  return{x:(x*.5+.5)*w,y:(-y*.5+.5)*h,behind};
}
function drawHud(now){
  const w=window.innerWidth,h=window.innerHeight;
  hctx.setTransform(DPR,0,0,DPR,0,0);hctx.clearRect(0,0,w,h);
  if(state==='menu')return;
  camera.updateMatrixWorld();camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  const AMBER='#ffc83d',RED='#ff5a47',CY='#7fe0ff';
  const p=player;
  // reticle
  if(p.alive&&!p.dying){
    p.fwd(tv3);tv.copy(p.pos).addScaledVector(tv3,500);
    const s=toScreen(tv,w,h);
    hctx.strokeStyle=overheated?RED:AMBER;hctx.lineWidth=2;hctx.globalAlpha=.9;
    hctx.beginPath();hctx.arc(s.x,s.y,15,0,6.283);hctx.stroke();
    hctx.beginPath();hctx.arc(s.x,s.y,1.8,0,6.283);hctx.fillStyle=hctx.strokeStyle;hctx.fill();
    for(const a of[0,1.571,3.142,4.712]){hctx.beginPath();hctx.moveTo(s.x+Math.cos(a)*15,s.y+Math.sin(a)*15);hctx.lineTo(s.x+Math.cos(a)*23,s.y+Math.sin(a)*23);hctx.stroke();}
    if(hud.hitMark>0){hctx.strokeStyle='#fff';hctx.lineWidth=3;hctx.beginPath();
      for(const a of[.785,2.356,3.927,5.498]){hctx.moveTo(s.x+Math.cos(a)*9,s.y+Math.sin(a)*9);hctx.lineTo(s.x+Math.cos(a)*18,s.y+Math.sin(a)*18);}hctx.stroke();}
    hctx.globalAlpha=1;
  }
  // horizon guide (fixed reference for the eyes)
  if(opt.horizon&&p.alive){
    camera.getWorldDirection(tv);const fl0=Math.hypot(tv.x,tv.z);
    if(fl0>.05){
      const fx0=tv.x/fl0,fz0=tv.z/fl0,rx0=-fz0,rz0=fx0,cp=camera.position;
      const a=toScreen(tv2.set(cp.x+fx0*8000-rx0*8000,cp.y,cp.z+fz0*8000-rz0*8000),w,h);
      const b=toScreen(tv3.set(cp.x+fx0*8000+rx0*8000,cp.y,cp.z+fz0*8000+rz0*8000),w,h);
      if(!a.behind&&!b.behind){
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,ang=Math.atan2(b.y-a.y,b.x-a.x);
        hctx.save();hctx.translate(mx,my);hctx.rotate(ang);hctx.strokeStyle='rgba(255,255,255,.55)';hctx.lineWidth=1.5;
        hctx.beginPath();hctx.moveTo(-w,0);hctx.lineTo(-90,0);hctx.moveTo(90,0);hctx.lineTo(w,0);
        hctx.moveTo(-90,0);hctx.lineTo(-90,8);hctx.moveTo(90,0);hctx.lineTo(90,8);hctx.stroke();hctx.restore();
      }
    }
  }
  // enemy markers
  let primary=null,pa=9;
  for(const e of enemies){if(e.dying)continue;tv.copy(e.pos).sub(p.pos);const d=tv.length();p.fwd(tv3);const a=tv3.angleTo(tv.normalize());if(a<pa&&d<1500){pa=a;primary=e;}}
  for(const e of enemies){
    if(e.dying)continue;
    const s=toScreen(e.pos,w,h),d=e.pos.distanceTo(p.pos);
    const margin=34;
    const on=!s.behind&&s.x>margin&&s.x<w-margin&&s.y>margin&&s.y<h-margin;
    const isLock=e===lockTarget;
    if(on){
      const r=clamp(1500/d*8,9,26);
      hctx.strokeStyle=isLock&&lockT>=1?AMBER:RED;hctx.lineWidth=2;
      const x=s.x,y=s.y,c=r*.45;
      hctx.beginPath();
      for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){hctx.moveTo(x+sx*r,y+sy*(r-c));hctx.lineTo(x+sx*r,y+sy*r);hctx.lineTo(x+sx*(r-c),y+sy*r);}
      hctx.stroke();
      hctx.fillStyle=RED;hctx.font='600 11px Oxanium,sans-serif';hctx.textAlign='center';
      hctx.fillText(d>=1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m',x,y+r+14);
      if(isLock){
        hctx.strokeStyle=AMBER;hctx.lineWidth=3;hctx.beginPath();hctx.arc(x,y,r+8,-1.571,-1.571+6.283*lockT);hctx.stroke();
        if(lockT>=1){hctx.fillStyle=AMBER;hctx.fillText('LOCK',x,y-r-12);}
      }
      if(e===primary&&d<1000){
        tv.copy(e.pos).addScaledVector(e.vel,d/(PBULLET_V+p.speed*.9));
        const l=toScreen(tv,w,h);hctx.strokeStyle=CY;hctx.lineWidth=2;hctx.beginPath();
        hctx.moveTo(l.x,l.y-6);hctx.lineTo(l.x+6,l.y);hctx.lineTo(l.x,l.y+6);hctx.lineTo(l.x-6,l.y);hctx.closePath();hctx.stroke();
      }
    }else{
      const cx=w/2,cy=h/2;let dx=s.x-cx,dy=s.y-cy;if(!dx&&!dy)dx=1;
      const k=Math.min((w/2-margin)/Math.abs(dx||1e-6),(h/2-margin)/Math.abs(dy||1e-6));
      const x=cx+dx*k,y=cy+dy*k,a=Math.atan2(dy,dx);
      hctx.save();hctx.translate(x,y);hctx.rotate(a);hctx.fillStyle=RED;hctx.globalAlpha=.9;
      hctx.beginPath();hctx.moveTo(14,0);hctx.lineTo(-8,-9);hctx.lineTo(-3,0);hctx.lineTo(-8,9);hctx.closePath();hctx.fill();hctx.restore();hctx.globalAlpha=1;
    }
  }
  // incoming missile markers
  for(const m of missiles){
    if(m.team!==1||m.target!==player)continue;
    const s=toScreen(m.pos,w,h);if(s.behind)continue;
    hctx.strokeStyle=(now*6|0)%2?'#fff':AMBER;hctx.lineWidth=2;hctx.strokeRect(s.x-9,s.y-9,18,18);
  }
  // radar
  const R=isTouch?52:78;
  const rx=isTouch?w/2:Math.max(12,0)+R+14,ry=isTouch?R+12:h-R-14;
  hctx.fillStyle='rgba(9,22,36,.6)';hctx.beginPath();hctx.arc(rx,ry,R,0,6.283);hctx.fill();
  hctx.strokeStyle='rgba(255,255,255,.25)';hctx.lineWidth=1;
  hctx.beginPath();hctx.arc(rx,ry,R,0,6.283);hctx.stroke();hctx.beginPath();hctx.arc(rx,ry,R/2,0,6.283);hctx.stroke();
  hctx.beginPath();hctx.moveTo(rx-R,ry);hctx.lineTo(rx+R,ry);hctx.moveTo(rx,ry-R);hctx.lineTo(rx,ry+R);hctx.stroke();
  p.fwd(tv3);const fl=Math.hypot(tv3.x,tv3.z)||1,fx=tv3.x/fl,fz=tv3.z/fl,RANGE=2200;
  const blip=(pos,color,tri)=>{
    const dx=pos.x-p.pos.x,dz=pos.z-p.pos.z;
    let sx=(-fz*dx+fx*dz)/RANGE,sy=-(fx*dx+fz*dz)/RANGE;const m=Math.hypot(sx,sy);if(m>1){sx/=m;sy/=m;}
    const x=rx+sx*(R-4),y=ry+sy*(R-4);hctx.fillStyle=color;
    const dy=pos.y-p.pos.y;
    hctx.beginPath();
    if(tri){hctx.moveTo(x,y-4);hctx.lineTo(x+4,y+4);hctx.lineTo(x-4,y+4);}
    else if(dy>150){hctx.moveTo(x,y-5);hctx.lineTo(x+4,y+3);hctx.lineTo(x-4,y+3);}
    else if(dy<-150){hctx.moveTo(x,y+5);hctx.lineTo(x+4,y-3);hctx.lineTo(x-4,y-3);}
    else hctx.arc(x,y,3.4,0,6.283);
    hctx.closePath();hctx.fill();
  };
  for(const e of enemies)if(!e.dying)blip(e.pos,e===lockTarget?AMBER:RED,false);
  for(const m of missiles)if(m.team===1&&m.target===player)blip(m.pos,AMBER,true);
  hctx.fillStyle=CY;hctx.beginPath();hctx.moveTo(rx,ry-6);hctx.lineTo(rx+5,ry+5);hctx.lineTo(rx-5,ry+5);hctx.closePath();hctx.fill();
}
function updateHudDom(now){
  setText('hpT',String(Math.max(0,Math.ceil(player.hp))));
  const hb=$('hpBar');hb.firstElementChild.style.transform='scaleX('+clamp(player.hp/100,0,1).toFixed(3)+')';hb.classList.toggle('low',player.hp<35);
  const eb=$('heatBar');eb.firstElementChild.style.transform='scaleX('+clamp(heat,0,1).toFixed(3)+')';eb.classList.toggle('hot',overheated);
  setText('waveT',String(Math.max(1,wave)));setText('scoreT',String(score));setText('bestT',String(Math.max(best,score)));
  setText('spdT',String(Math.round(player.speed*3.6)));setText('altT',String(Math.max(0,Math.round(player.pos.y))));
  setText('thrT',String(Math.round(player.thr*100)));setText('mslT',String(msl));setText('flrT',String(flr));
  const warn=$('warn');let msg='';
  if(hud.warnMissile)msg='ミサイル接近 — フレア(X)・急旋回';
  else if(hud.pullUp&&player.alive&&!player.dying)msg='PULL UP 地面接近';
  else if(hud.outOfBounds)msg='エリア外 — 戻れ '+Math.max(0,Math.ceil(6-outT));
  if(cache.warnShown!==!!msg){cache.warnShown=!!msg;warn.classList.toggle('on',!!msg);}
  if(msg&&warn.textContent!==msg)warn.textContent=msg;
  $('vignette').style.opacity=(opt.noshake?clamp(flash,0,1)*.2:clamp(flash,0,1)).toFixed(2);
  $('comfort').style.opacity=(opt.vig&&state!=='menu'?clamp(vigVal,0,1)*.85:0).toFixed(2);
}

/* ---------- audio loop ---------- */
let warnBeep=0;
function updateAudio(dt){
  if(!ac||!engOsc)return;
  const run=state==='play'||state==='over';
  engOsc.frequency.setTargetAtTime(48+player.speed*.55+player.thr*14,ac.currentTime,.1);
  engGain.gain.setTargetAtTime(run&&!muted?.07:0,ac.currentTime,.15);
  if(run&&hud.warnMissile){warnBeep-=dt;if(warnBeep<=0){warnBeep=clamp(hud.warnMissile/1500,.12,.5);tone(1100,.08,'square',.08);}}
}

/* ---------- flow ---------- */
function resetGame(){
  for(const e of enemies)scene.remove(e.group);enemies=[];
  for(const b of bullets){b.active=false;b.mesh.visible=false;}
  for(const m of missiles)scene.remove(m.mesh);missiles.length=0;flares.length=0;
  smoke.clear();fire.clear();
  const p=player;p.pos.set(0,500,700);p.q.identity();p.speed=100;p.thr=.6;p.hp=100;p.alive=true;p.dying=false;p.group.visible=true;p.vel.set(0,0,-100);p.model.rotation.z=0;
  heat=0;overheated=false;msl=4;flr=3;mslRegen=0;lockT=0;lockTarget=null;shake=0;flash=0;outT=0;
  ctl.pitch=ctl.roll=ctl.yaw=0;score=0;wave=0;kills=0;waveWait=1.2;overT=0;camInit=false;vigVal=0;
  pressedMissile=pressedFlare=false;
}
function showMenu(mode){
  const m=$('menu');m.hidden=false;
  $('mTitle').textContent=mode==='pause'?'ポーズ':mode==='over'?'撃墜された':'CONTRAIL DUEL';
  $('mDesc').hidden=mode!=='menu';
  $('stats').textContent=mode==='over'?'WAVE '+wave+'  /  撃墜 '+kills+'  /  SCORE '+score+(score>=best&&score>0?'  NEW BEST':''):mode==='pause'?'':'HIGH SCORE '+best;
  $('go').textContent=mode==='pause'?'再開':mode==='over'?'もう一度':'出撃';
  $('diff').hidden=mode==='pause';
  showModelStat();
  m.dataset.mode=mode;$('app').classList.add('inmenu');
}
function startGame(){
  initAudio();
  const mode=$('menu').dataset.mode;
  if(mode==='pause'){state='play';}
  else{resetGame();state='play';}
  $('menu').hidden=true;$('app').classList.remove('inmenu');
}
function gameOver(){
  state='over';
  if(score>best){best=score;store.set('contrailBest',String(best));}
  showMenu('over');
}
function pause(){if(state!=='play')return;state='paused';showMenu('pause');}
$('go').addEventListener('click',startGame);
{
  const boxes=document.querySelectorAll('#opts input');
  const sync=()=>{for(const b of boxes)b.checked=!!opt[b.dataset.o];};
  for(const b of boxes)b.addEventListener('change',()=>{opt[b.dataset.o]=b.checked?1:0;saveOpt();});
  $('cOn').addEventListener('click',()=>{for(const k in opt)opt[k]=1;saveOpt();sync();});
  $('cOff').addEventListener('click',()=>{for(const k in opt)opt[k]=0;saveOpt();sync();});
  sync();
}
const modBoxes=document.querySelectorAll('#mods input');
function syncMods(){for(const b of modBoxes)b.checked=!!mods[b.dataset.m];}
for(const b of modBoxes)b.addEventListener('change',()=>{mods[b.dataset.m]=b.checked?1:0;saveMods();});
syncMods();
function toggleMod(k,label){mods[k]=mods[k]?0:1;saveMods();syncMods();if(state==='play')banner(label+(mods[k]?' ON':' OFF'),900);}
for(const b of document.querySelectorAll('#diff .seg'))b.addEventListener('click',()=>{
  diff=+b.dataset.d;for(const o of document.querySelectorAll('#diff .seg'))o.setAttribute('aria-pressed',String(o===b));});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('blur',pause);

window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;
  if(state==='menu'||state==='over'||state==='paused'){if(e.code==='Enter'||(e.code==='Space'&&document.activeElement===document.body)){startGame();return;}}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='paused')startGame();}
  if(state==='play'){
    if(e.code==='Enter'||e.code==='KeyB')pressedMissile=true;
    if(e.code==='KeyX')pressedFlare=true;
  }
  if(e.code==='KeyV')toggleMod('mirror','バックミラー');
  if(e.code==='KeyG')toggleMod('shadow','影');
  if(e.code==='KeyI')invertY=!invertY;
  if(e.code==='KeyO'){flip=!flip;store.set('contrailFlip',flip?'1':'0');for(const pl of[player,...enemies])if(pl.mdl)pl.mdl.rotation.y=flip?0:Math.PI;}
  if(e.code==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:.5;}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
glCanvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0&&state==='play')mouseFire=true;});
window.addEventListener('pointerup',()=>{mouseFire=false;});

// touch controls
{
  const st=$('stick'),kn=$('knob');let pid=null;
  const move=e=>{const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
    touch.x=Math.abs(dx)<.12?0:dx;touch.y=Math.abs(dy)<.12?0:dy;kn.style.transform='translate('+dx*38+'px,'+dy*38+'px)';};
  st.addEventListener('pointerdown',e=>{pid=e.pointerId;st.setPointerCapture(pid);move(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e);});
  const end=e=>{if(e.pointerId===pid){pid=null;touch.x=touch.y=0;kn.style.transform='';}};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  const hold=(id,key)=>{const el=$(id);el.addEventListener('pointerdown',e=>{touch[key]=true;el.setPointerCapture(e.pointerId);});
    const off=()=>{touch[key]=false;};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);};
  hold('bFire','fire');hold('bUp','up');hold('bDn','dn');
  $('bMis').addEventListener('pointerdown',()=>{if(state==='play')pressedMissile=true;});
  $('bFlr').addEventListener('pointerdown',()=>{if(state==='play')pressedFlare=true;});
}

/* ---------- main loop (time-based: identical at 60 / 144 Hz) ---------- */
let last=performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;
  if(!(dt>0))return;
  dt=Math.min(dt,.05);
  if(state==='play'||state==='over')updateWorld(dt);
  else if(state==='menu'){player.vel.set(0,0,0);}
  flash*=Math.exp(-3*dt);
  updateCamera(dt);
  updateShadow();renderMirror();
  sky.position.copy(camera.position);
  pScale.value=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));
  renderer.render(scene,camera);
  drawHud(ts/1000);updateHudDom(ts/1000);updateAudio(dt);
}
resize();resetGame();showMenu('menu');
requestAnimationFrame(t=>{last=t;frame(t);});
window.__game={get state(){return state},player,get enemies(){return enemies},startGame,get wave(){return wave},get score(){return score}};
})();
</script>
