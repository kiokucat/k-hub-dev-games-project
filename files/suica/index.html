<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ころころフルーツ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#d3e3d9;--box:#fbf7ee;--ink:#23305a;--sub:#5d6b8c;--acc:#e8643c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17222f;--box:#2a3b52;--ink:#f3ecd9;--sub:#9db0c8;--acc:#ff8a5c}}
:root[data-theme="dark"]{--bg:#17222f;--box:#2a3b52;--ink:#f3ecd9;--sub:#9db0c8;--acc:#ff8a5c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:min(100vw,calc((100dvh - 110px) * .667));padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:flex-end;justify-content:space-between}
.score{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.best{font-size:13px;color:var(--sub);margin-top:2px}
.next{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.next b{font-size:34px;line-height:1;background:var(--box);border-radius:50%;width:52px;height:52px;display:grid;place-items:center}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:2/3;border-radius:22px 22px 10px 10px;touch-action:none;cursor:pointer;background:var(--box)}
.legend{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}
.legend span{line-height:1}
.over{position:absolute;inset:0;border-radius:22px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:left}
.over.on{display:flex}
.over h2{margin:0;font-size:30px}
.over p{margin:0;color:var(--sub)}
button{font:inherit;font-weight:900;font-size:18px;color:#fff;background:var(--acc);border:0;border-radius:14px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="score" id="sc">0</div><div class="best">ベスト <span id="bs">0</span></div></div>
    <div class="next">つぎ<b id="nx"></b></div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="ゲーム画面。タップまたはスペースキーでフルーツを落とします"></canvas>
    <div class="over" id="ov"><h2>おしまい！</h2><p id="fs"></p><button id="rs">もう一度あそぶ</button></div>
  </div>
  <div class="legend" id="lg"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const {Engine,Bodies,Composite,Events}=Matter;
const W=360,H=540,TOP=105;
const R=[13,18,23,29,35,42,50,58,67,77,88];
const E=['🍒','🍓','🍇','🍊','🍋','🍎','🍐','🍑','🍍','🍈','🍉'];
const C=['#e0405a','#f0657a','#8a5fc0','#f4a233','#f2d54a','#d9473f','#a9c552','#f7a98c','#e8c13a','#7fc46a','#4fb35f'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dpr=Math.min(devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr*1.0;
cv.height=Math.round(W*1.5*dpr);
const SC=cv.width/W;
let th={};
function readTheme(){const s=getComputedStyle(document.documentElement);th={box:s.getPropertyValue('--box').trim(),ink:s.getPropertyValue('--ink').trim(),acc:s.getPropertyValue('--acc').trim()}}
readTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

document.getElementById('lg').innerHTML=E.map((e,i)=>`<span style="font-size:${10+i*1.1}px">${e}</span>`).join('');
let best=0;try{best=+localStorage.getItem('kkf-best')||0}catch(e){}
document.getElementById('bs').textContent=best;

let eng,score,cur,nxt,px=W/2,lastDrop,over,overT,now;
function rnd(){return Math.floor(Math.random()*5)}
function make(lv,x,y){
  const b=Bodies.circle(x,y,R[lv],{restitution:.15,friction:.4,frictionStatic:.5,density:.002});
  b.lv=lv;b.born=now;Composite.add(eng.world,b);return b;
}
function reset(){
  eng=Engine.create({positionIterations:10,velocityIterations:8});
  eng.gravity.y=1.1;
  Composite.add(eng.world,[
    Bodies.rectangle(W/2,H+25,W+200,50,{isStatic:true}),
    Bodies.rectangle(-30,H/2,60,3000,{isStatic:true}),
    Bodies.rectangle(W+30,H/2,60,3000,{isStatic:true})
  ]);
  Events.on(eng,'collisionStart',e=>{
    for(const p of e.pairs){
      const a=p.bodyA,b=p.bodyB;
      if(a.lv!==undefined&&a.lv===b.lv&&!a.dead&&!b.dead){
        a.dead=b.dead=true;
        Composite.remove(eng.world,[a,b]);
        const x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2;
        if(a.lv===10){setScore(score+200)}
        else{make(a.lv+1,x,y);setScore(score+(a.lv+2)*(a.lv+3)/2)}
      }
    }
  });
  score=0;setScore(0);cur=rnd();nxt=rnd();showNext();
  lastDrop=0;over=false;overT=0;now=performance.now();
  document.getElementById('ov').classList.remove('on');
}
function setScore(s){
  score=s;document.getElementById('sc').textContent=s;
  if(s>best){best=s;document.getElementById('bs').textContent=s;try{localStorage.setItem('kkf-best',s)}catch(e){}}
}
function showNext(){document.getElementById('nx').textContent=E[nxt]}
function drop(){
  if(over||now-lastDrop<450)return;
  const r=R[cur];
  make(cur,Math.max(r,Math.min(W-r,px)),r+8);
  lastDrop=now;cur=nxt;nxt=rnd();showNext();
}
function aim(ev){const r=cv.getBoundingClientRect();px=(ev.clientX-r.left)/r.width*W}
cv.addEventListener('pointermove',aim);
cv.addEventListener('pointerdown',aim);
cv.addEventListener('pointerup',e=>{aim(e);drop()});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();drop()}
  if(e.code==='ArrowLeft')px-=14;
  if(e.code==='ArrowRight')px+=14;
});
document.getElementById('rs').onclick=reset;

function drawFruit(x,y,lv,ang,k){
  const r=R[lv]*k;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.arc(0,0,r,0,7);
  ctx.fillStyle=C[lv];ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();
  ctx.font=`${r*1.25}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(E[lv],0,r*.06);
  ctx.restore();
}
function frame(t){
  now=t;
  Engine.update(eng,1000/60);
  // game over check
  let danger=false;
  for(const b of eng.world.bodies){
    if(b.lv!==undefined&&!b.dead&&now-b.born>1200&&b.position.y-R[b.lv]<TOP&&b.speed<1.5)danger=true;
  }
  overT=danger?overT+1000/60:0;
  if(!over&&overT>1800){
    over=true;
    document.getElementById('fs').textContent='スコア '+score;
    document.getElementById('ov').classList.add('on');
  }
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle=th.box;ctx.fillRect(0,0,W,H*1.0);
  // danger line
  ctx.setLineDash([8,8]);ctx.lineWidth=2;
  ctx.strokeStyle=danger?th.acc:'rgba(128,140,160,.45)';
  ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.stroke();ctx.setLineDash([]);
  for(const b of eng.world.bodies){
    if(b.lv===undefined)continue;
    const k=1+.22*Math.max(0,1-(now-b.born)/200);
    drawFruit(b.position.x,b.position.y,b.lv,b.angle,k);
  }
  if(!over){
    const r=R[cur],x=Math.max(r,Math.min(W-r,px));
    ctx.strokeStyle='rgba(128,140,160,.35)';ctx.lineWidth=2;ctx.setLineDash([3,7]);
    ctx.beginPath();ctx.moveTo(x,r+8);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=now-lastDrop<450?.35:1;
    drawFruit(x,r+8,cur,0,1);ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
reset();requestAnimationFrame(frame);
</script>
</body>
</html>
